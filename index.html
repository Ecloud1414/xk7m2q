<p><span class="s" data-sq="Në 'Sahihun' e Muslimit transmetohet nga Burejde ibn el-Husajbi se Pejgamberi ﷺ, kur dërgonte komandant mbi çetë ose ushtri, e këshillonte veçanërisht me devotshmëri ndaj Allahut dhe mirësi ndaj muslimanëve me të, pastaj thoshte:"><span class="w" data-sq="në 'Sahihun' e Muslimit nga Burejde ibn el-Husajbi">وفي «صحيح مسلم» عن بريدة بن الحصيب قال:</span> <span class="w" data-sq="Pejgamberi ﷺ kur dërgonte komandant mbi çetë ose ushtri">كان رسول الله ﷺ إذا بعث أميرًا عليٰ سرية أو جيش</span> <span class="w" data-sq="e këshillonte me devotshmëri ndaj Allahut">أوصاه في خاصة نفسه بتقويٰ الله تعاليٰ</span> <span class="w" data-sq="dhe mirësi ndaj muslimanëve me të, pastaj thoshte:">وبمن معه من المسلمين خيرًا، ثم يقول:</span></span> <span class="s hadith" data-sq="Luftoni me emrin e Allahut, në rrugën e Allahut. Luftoni ata që nuk besojnë në Allahun. Mos e teproni, mos tradhtoni, mos gjymtoni, dhe mos vrisni fëmijë.">«اغزوا بسم الله، وفي سبيل الله، قاتلوا من كفر بالله، لا تغلوا ولا تغدروا ولا تُمَثِّلوا، ولا تقتلوا وليدًا»</span></p>

<p><span class="s" data-sq="Imamët kanë kundërshtime rreth disa llojeve të vrasjes, si djegia me zjarr gjatë nevojës së madhe,"><span class="w" data-sq="imamët kanë kundërshtime rreth disa llojeve të vrasjes">وقد يتنازع الأئمة في بعض أنواع القتل،</span> <span class="w" data-sq="si djegia me zjarr gjatë nevojës së madhe">كالتحريق بالنار عند شدة</span></span></p>`},

{html:`<p><span class="s" data-sq="mëkateve; disa e lejojnë, sepse Ebu Bekri, Allahu qoftë i kënaqur me të, urdhëroi djegien e disa murtedinëve, gjithashtu Aliu, Allahu qoftë i kënaqur me të, dogji ata që pretenduan hyjninë e tij. Të tjerë e ndaluan, për shkak të transmetimit nga Pejgamberi ﷺ që ndaloi djegien e atyre që kishte urdhëruar t'i digjte."><span class="w" data-sq="mëkateve; disa e lejojnë">الذنوب، فيجوِّزه بعضهم؛</span> <span class="w" data-sq="sepse Ebu Bekri urdhëroi djegien e disa murtedinëve">لأن أبا بكر الصديق رَضِيَ اللَّهُ عَنْهُ أمر بتحريق ناس من المرتدين،</span> <span class="w" data-sq="gjithashtu Aliu dogji ata që pretenduan hyjninë e tij">وكذلك علي بن أبي طالب رَضِيَ اللَّهُ عَنْهُ حرَّق المغالية الذين ادعوا إلاهيته.</span> <span class="w" data-sq="të tjerë e ndaluan; për shkak të transmetimit nga Pejgamberi ﷺ">ومنعه آخرون؛ لما روي عن النبي ﷺ</span> <span class="w" data-sq="që ndaloi djegien e atyre që kishte urdhëruar t'i digjte">من النهي عن تحريق مَن كان أمر بتحريقه.</span></span></p>

<p><span class="s" data-sq="Nëse grabitësit nxjerrin armët në ndërtesa — jo në shkretëtirë — për të marrë pasurinë, është thënë: nuk janë muharibin, por janë si vjedhësi dhe rrëmbenjësi; sepse viktima mund t'i thërrasë njerëzit për ndihmë."><span class="w" data-sq="nëse grabitësit nxjerrin armët në ndërtesa — jo në shkretëtirë">ولو شَهَر المحاربون السلاح في البنيان ـ لا في الصحراء ـ</span> <span class="w" data-sq="për të marrë pasurinë, është thënë:">لأخذ المال، فقد قيل:</span> <span class="w" data-sq="nuk janë muharibin, por janë si vjedhësi dhe rrëmbenjësi">إنهم ليسوا محاربين بل هم بمنزلة المُختلس والمُنتهِب؛</span> <span class="w" data-sq="sepse viktima mund t'i thërrasë njerëzit për ndihmë">لأن المطلوب يدركه الغوث إذا استغاث بالناس.</span></span></p>

<p><span class="s" data-sq="Shumica kanë thënë: dispozita e tyre në ndërtesa e shkretëtirë është e njëjtë — ky është mendimi i Malikut, Shafiut, shumicës së shokëve të Ahmedit e disa shokëve të Ebu Hanifes; madje ata në ndërtesa meritojnë më shumë ndëshkim, sepse ndërtesat janë vend i sigurisë e qetësisë, dhe vend ku njerëzit ndihmojnë e mbështesin njëri-tjetrin."><span class="w" data-sq="shumica kanë thënë: dispozita në ndërtesa e shkretëtirë është e njëjtë">وقال الأكثرون: إن حكمهم في البنيان والصحراء واحد،</span> <span class="w" data-sq="mendimi i Malikut, Shafiut, shumicës së shokëve të Ahmedit e disa të Ebu Hanifes">وهذا قول مالك في المشهور عنه، والشافعي، وأكثر أصحاب أحمد وبعض أصحاب أبي حنيفة،</span> <span class="w" data-sq="madje ata në ndërtesa meritojnë më shumë ndëshkim">بل هم في البنيان أحق بالعقوبة</span> <span class="w" data-sq="sepse ndërtesat janë vend i sigurisë e qetësisë">منهم في الصحراء؛ لأن البنيان محل الأمن والطمأنينة،</span> <span class="w" data-sq="dhe vend ku njerëzit ndihmojnë e mbështesin njëri-tjetrin">ولأنه محلٌّ تناصر الناس وتعاونهم،</span></span></p>

<p><span class="s" data-sq="ata ia grabisin njeriut krejt pasurinë në shtëpinë e tij, ndërsa udhëtari zakonisht ka me vete vetëm një pjesë të pasurisë. Ky është mendimi i saktë, veçanërisht ato grupe të organizuara që populli i quan në"><span class="w" data-sq="ata ia grabisin njeriut krejt pasurinë në shtëpinë e tij">يسلبون الرجلَ في داره جميعَ ماله،</span> <span class="w" data-sq="ndërsa udhëtari ka me vete vetëm një pjesë të pasurisë">والمسافر لا يكون معه ـ غالبًا ـ إلا بعض ماله.</span> <span class="w" data-sq="ky është mendimi i saktë, veçanërisht ato grupe të organizuara">فهذا هو الصواب، لاسيما هؤلاء المتحزِّبون</span> <span class="w" data-sq="që populli i quan në">الذين تسميهم العامة في</span></span></p>`},

{html:`<p><span class="s" data-sq="Sham e Egjipt: el-Minser, ndërsa në Bagdad i quanin: el-Ajjarin."><span class="w" data-sq="Sham e Egjipt: el-Minser">الشام ومصر: المِنْسَر،</span> <span class="w" data-sq="ndërsa në Bagdad i quanin: el-Ajjarin">وكانوا يسمَّون ببغداد: العيَّارين.</span></span></p>

<p><span class="s" data-sq="Edhe sikur të luftojnë me shkopinj, gurë të hedhur me duar ose me hobeta e të ngjashme, ata janë gjithsesi muharibin (grabitës). Disa kanë transmetuar konsensus se hirabe (grabitja) bëhet me armë të mprehta dhe të rënda. Pavarësisht mosmarrëveshjes, mendimi i saktë i shumicës së muslimanëve është: kushdo që lufton për të marrë pasuritë, me çfarëdo lloji lufte, është muharib/prerës i rrugës."><span class="w" data-sq="edhe sikur të luftojnë me shkopinj, gurë ose hobeta">ولو حاربوا بالعصي والحجارة المقذوفة بالأيدي أو المقاليع ونحوها،</span> <span class="w" data-sq="ata janë gjithsesi muharibin">فهم محاربون أيضًا،</span> <span class="w" data-sq="disa kanë transmetuar konsensus se hirabe bëhet me armë të mprehta e të rënda">وقد حُكيَ عن بعض الفقهاء: لا محاربة إلا بالمحدَّد، وحكيٰ بعضُهم الإجماعَ عليٰ أن المحاربة تكون بالمحدَّد والمثقَّل.</span> <span class="w" data-sq="mendimi i saktë i shumicës: kushdo që lufton për pasuritë me çdo lloj lufte, është muharib">وسواء كان فيه خلاف أو لم يكن فالصواب الذي عليه جماهير المسلمين: أن من قاتل عليٰ أخذِ الأموال بأي نوع كان من أنواع القتال فهو محارب قاطع،</span></span></p>

<p><span class="s" data-sq="ashtu si kushdo që lufton muslimanët nga jobesimtarët me çdo lloj lufte, ai është harbi (armik lufte); dhe kushdo që lufton jobesimtarët nga muslimanët me shpatë, shtizë, shigjeta, gurë ose shkop, ai është muxhahid në rrugën e Allahut."><span class="w" data-sq="kushdo që lufton muslimanët nga jobesimtarët, ai është harbi">كما أن من قاتل المسلمين من الكفار بأي نوع كان من أنواع القتال فهو حربي،</span> <span class="w" data-sq="kushdo që lufton jobesimtarët me shpatë, shtizë, shigjeta, gurë ose shkop">ومن قاتل الكفار من المسلمين بسيف أو رمح أو سهم أو حجارة أو</span> <span class="w" data-sq="ai është muxhahid në rrugën e Allahut">عصًا؛ فهو مجاهد في سبيل الله تعالىٰ.</span></span></p>

<p><span class="s" data-sq="Kur dikush vret njerëz fshehurazi për t'u marrë pasurinë, si ai që ulet në han, ose thërret në shtëpinë e tij dikë duke e punësuar për rrobaqepsi, mjekësi e të ngjashme, pastaj e vret dhe ia merr pasurinë — ky quhet: vrasje me mashtrim (katl gile), ndërsa populli i quan: el-mu'arridin."><span class="w" data-sq="kur dikush vret njerëz fshehurazi për t'u marrë pasurinë">وأما إذا كان يقتل النفوس سرًّا لأخذ المال،</span> <span class="w" data-sq="si ai që ulet në han ose thërret në shtëpinë e tij dikë">مثل الذي يجلس في خان أو يدعو إليٰ منزله</span> <span class="w" data-sq="duke e punësuar për rrobaqepsi, mjekësi e të ngjashme">من يستأجره لخياطة أو طب أو نحو ذلك،</span> <span class="w" data-sq="pastaj e vret dhe ia merr pasurinë">فيقتله ويأخذ ماله.</span> <span class="w" data-sq="ky quhet: vrasje me mashtrim (katl gile)">وهذا القتل يسمَّيٰ: قتل غيلة،</span> <span class="w" data-sq="populli i quan: el-mu'arridin">وتسميهم العامة: المعرضين.</span></span></p>`},

{html:`<p><span class="s" data-sq="ndodhet tek udhëtarët, e kur mbetet vetëm me një grup prej tyre, i vret dhe ua merr pasuritë. Ose fton në shtëpinë e tij dikë duke e punësuar, pastaj e vret e ia merr pasurinë. Ky vrasje quhet: katl gile, populli i quan: el-mu'arridin."><span class="w" data-sq="ndodhet tek udhëtarët">يكون لأبناء السبيل،</span> <span class="w" data-sq="kur mbetet vetëm me një grup prej tyre, i vret dhe ua merr pasuritë">وإذا انفرد بقوم منهم قتلهم وأخذ أموالهم.</span> <span class="w" data-sq="ose fton në shtëpinë e tij dikë duke e punësuar">أو يدعو إلىٰ منزله من يستأجره لخياطة أو طب أو نحو ذلك،</span> <span class="w" data-sq="pastaj e vret e ia merr pasurinë">فيقتله ويأخذ ماله.</span> <span class="w" data-sq="ky quhet katl gile, populli i quan el-mu'arridin">وهذا القتل يسمَّيٰ: قتل غيلة، وتسميهم العامة: المعرضين.</span></span></p>

<p><span class="s" data-sq="Nëse kjo bëhet për të marrë pasurinë, a janë si muharibin, ose u zbatohet ligji i kisasit (ndëshkimit të barabartë)? Ka dy mendime mes fukahave:"><span class="w" data-sq="nëse kjo bëhet për të marrë pasurinë">فإذا كان لأخذِ المال</span> <span class="w" data-sq="a janë si muharibin, ose u zbatohet ligji i kisasit?">فهل هم كالمحاربين، أو يجري عليهم حكم القَوَد؟</span> <span class="w" data-sq="ka dy mendime mes fukahave">ففيه قولان للفقهاء:</span></span></p>

<p><span class="s" data-sq="I pari: janë si muharibin; sepse vrasja me mashtrim është si vrasja me forcë, të dyja nuk mund t'i ruhesh; madje dëmi i kësaj mund të jetë më i madh sepse nuk kuptohet."><span class="w" data-sq="i pari: janë si muharibin">أحدهما: أنهم كالمحاربين؛</span> <span class="w" data-sq="sepse vrasja me mashtrim është si vrasja me forcë, nuk mund t'i ruhesh">لأن القتل بحيلة كالقتل مكابرة، كلاهما لا يمكن الاحتراز منه،</span> <span class="w" data-sq="madje dëmi i kësaj mund të jetë më i madh sepse nuk kuptohet">بل قد يكون ضرر هذا أشد لأنه لا يدريٰ به.</span></span></p>

<p><span class="s" data-sq="I dyti: muharib është ai që lufton haptazi, kurse ky vrasës me mashtrim, çështja e tij i lihet kujdestarit të gjakut. Mendimi i parë është më i përputhshëm me parimet e sheriatit, madje dëmi i kësaj mund të jetë më i madh sepse nuk kuptohet."><span class="w" data-sq="i dyti: muharib është ai që lufton haptazi">والثاني: أن المحارب هو المجاهر بالقتال،</span> <span class="w" data-sq="kurse ky vrasës me mashtrim, çështja i lihet kujdestarit të gjakut">وأن هذا المغتال يكون أمره إلىٰ وليِّ الدم.</span> <span class="w" data-sq="mendimi i parë është më i përputhshëm me parimet e sheriatit">والأول أشبه بأصول الشريعة،</span> <span class="w" data-sq="madje dëmi i kësaj mund të jetë më i madh sepse nuk kuptohet">بل قد يكون ضرر هذا أشد؛ لأنه لا يُدريٰ به.</span></span></p>

<p><span class="s" data-sq="Fukahave u kanë ndryshuar mendimet gjithashtu rreth atyre që vrasin sundimtarin — si vrasësit e Uthmanit, dhe vrasësi i Aliut, Allahu qoftë i kënaqur me ta: a janë si muharibin e vriten si hadd, ose çështja u lihet kujdestarëve të gjakut? Dy mendime në medh'hebin e Ahmedit e të tjerëve; sepse vrasja e sundimtarit shkakton çrregullim të përgjithshëm."><span class="w" data-sq="fukahave u ndryshuan mendimet rreth atyre që vrasin sundimtarin">واختلف الفقهاء أيضًا فيمن يقتل السلطانَ؛</span> <span class="w" data-sq="si vrasësit e Uthmanit dhe vrasësi i Aliut">كقَتَلَة عثمان، وقاتل علي رَضِيَ اللَّهُ عَنْهُمَا:</span> <span class="w" data-sq="a janë si muharibin e vriten si hadd, ose çështja u lihet kujdestarëve të gjakut?">هل هم كالمحاربين فيُقتَلون حدًّا، أو يكون أمرُهم إلىٰ أولياء الدم؟</span> <span class="w" data-sq="dy mendime në medh'hebin e Ahmedit; sepse vrasja e sundimtarit shkakton çrregullim">عليٰ قولين في مذهب أحمد وغيره؛ لأن في قتله فسادًا عامًّا.</span></span></p>`},

{html:`<h3 style="text-align:center;font-size:1.2em;margin:1.2em 0"><span class="s" data-sq="Kapitull">فصل</span></h3>

<p><span class="s" data-sq="E gjithë kjo kur ata kapen. Por nëse sundimtari ose zëvendësit e tij i kërkojnë për zbatim të ndëshkimit pa bërë padrejtësi, e ata kundërshtojnë, atëherë muslimanët detyrohen t'i luftojnë sipas konsensusit të dijetarëve, derisa të mposhten të gjithë."><span class="w" data-sq="gjithë kjo kur ata kapen">وهذا كله إذا قُدِر عليهم،</span> <span class="w" data-sq="por nëse sundimtari i kërkon për zbatim të ndëshkimit pa padrejtësi">فأما إذا طلبهم السلطان أو نُوَّابه لإقامة الحدِّ بلا عدوان</span> <span class="w" data-sq="e ata kundërshtojnë">فامتنعوا عليه،</span> <span class="w" data-sq="muslimanët detyrohen t'i luftojnë sipas konsensusit">فإنه يجب عليٰ المسلمين قتالهم باتفاق العلماء</span> <span class="w" data-sq="derisa të mposhten të gjithë">حتىٰ يُقدَر عليهم كلهم،</span></span></p>

<p><span class="s" data-sq="e nëse nuk binden veçse me luftë që çon në vrasjen e të gjithëve, luftohen edhe nëse çon në këtë — pavarësisht a kanë vrarë apo jo; vriten në luftë si të jetë e mundur, në qafë ose tjetërkund."><span class="w" data-sq="nëse nuk binden veçse me luftë që çon në vrasjen e të gjithëve">ومتىٰ لم ينقادوا إلا بقتالٍ يفضي إلىٰ قتلهم كلهم</span> <span class="w" data-sq="luftohen edhe nëse çon në këtë">قوتلوا وإن أفضىٰ إلىٰ ذلك،</span> <span class="w" data-sq="pavarësisht a kanë vrarë apo jo">سواء كانوا قد قتلوا أو لم يَقتلوا،</span> <span class="w" data-sq="vriten në luftë si të jetë e mundur">ويُقتلون في القتال كيفما أمكن في العُنُق وغير العنق.</span></span></p>

<p><span class="s" data-sq="Luftohet edhe kushdo që lufton me ta për t'i mbrojtur e ndihmuar — kjo është luftë, ndërsa ajo e para (zbatimi kur kapen) është ekzekutim i ndëshkimit."><span class="w" data-sq="luftohet edhe kushdo që lufton me ta për t'i mbrojtur e ndihmuar">ويقاتَل مَن قاتل معهم ممن يحميهم ويُعينهم،</span> <span class="w" data-sq="kjo është luftë, ndërsa ajo e para është ekzekutim i ndëshkimit">وهذا قتال وذاك إقامة حد.</span></span></p>

<p><span class="s" data-sq="Luftimi i tyre është ndër detyrimet më të forta të luftimit të grupeve që refuzojnë ligjet e Islamit; sepse këta janë organizuar për prishjen e jetëve e pasurive, shkatërrimin e bujqësisë e pasardhësve. Qëllimi i tyre nuk është as vendosja e fesë as e pushtetit."><span class="w" data-sq="luftimi i tyre është ndër detyrimet më të forta">وقتال هؤلاء من آكد قتال الطوائف الممتنعة عن شرائع الإسلام،</span> <span class="w" data-sq="sepse këta janë organizuar për prishjen e jetëve e pasurive, shkatërrimin e bujqësisë e pasardhësve">فإن هؤلاء قد تحزَّبوا لفساد النفوس والأموال، وهلاك الحرث والنسل،</span> <span class="w" data-sq="qëllimi i tyre nuk është as vendosja e fesë as e pushtetit">ليس مقصودهم إقامة دين ولا مُلك،</span></span></p>

<p><span class="s" data-sq="Këta janë si muharibin që strehojnë në kala, shpella, maja malesh, funde luginash e të ngjashme; sulmojnë kushdo që kalon pranë tyre. Kur ushtria e sundimtarit vjen për t'i futur në bashkësinë muslimane e bindjen për zbatimin e ndëshkimeve — i luftojnë e i zmbrapsojnë."><span class="w" data-sq="këta janë si muharibin që strehojnë në kala, shpella, maja malesh">وهؤلاء كالمحاربين الذين يأوون إلىٰ حصن، أو مغارة، أو رأس جبل،</span> <span class="w" data-sq="funde luginash e të ngjashme">أو بطن واد، ونحو ذلك؛</span> <span class="w" data-sq="sulmojnë kushdo që kalon pranë tyre">عليٰ من مرَّ بهم،</span> <span class="w" data-sq="kur ushtria e sundimtarit vjen për t'i futur në bashkësinë e bindjen">وإذا جاءهم جندُ ولي الأمر يطلبهم للدخول في جماعة المسلمين والطاعة لإقامة الحدود</span> <span class="w" data-sq="i luftojnë e i zmbrapsojnë">= قاتلوهم ودفعوهم،</span></span></p>

<p><span class="s" data-sq="si beduinët që presin rrugën e haxhinjve ose rrugë të tjera, si malësorët që mbrohen në maja malesh ose shpella për të prerë rrugën, si aleatët që janë aleuar për prerjen e rrugës mes Shamit e Irakut — duke e quajtur këtë: en-Nehida —"><span class="w" data-sq="si beduinët që presin rrugën e haxhinjve">مثل الأعراب الذين يقطعون الطريق عليٰ الحاج</span> <span class="w" data-sq="ose rrugë të tjera">أو غيره من الطرقات،</span> <span class="w" data-sq="si malësorët që mbrohen në maja malesh ose shpella">وكالجبلية الذين يعتصمون برؤوس الجبال أو المغارات لقطع الطريق،</span> <span class="w" data-sq="si aleatët që janë aleuar për prerjen e rrugës mes Shamit e Irakut — duke e quajtur en-Nehida">وكالأحلاف الذين تحالفوا لقطع الطريق بين الشام والعراق ويسمون ذلك: النهيضة</span></span></p>`},

{html:`<p><span class="s" data-sq="Luftohen siç përmendem; por luftimi i tyre nuk është si luftimi i jobesimtarëve meqë nuk janë jobesimtarë, andaj nuk u merren pasuritë — përveçse nëse kanë marrë pasuritë e njerëzve pa të drejtë, atëherë kanë garanci, e merret prej tyre aq sa kanë marrë, edhe nëse nuk dihet vetë marrësi; sepse mbështetësi e kryerësi janë njësoj siç thamë; por kur dihet vetë ai, garancia përfundimtare bie mbi të."><span class="w" data-sq="luftohen siç përmendem; por nuk është si luftimi i jobesimtarëve">يُقاتلون كما ذكرنا؛ لكنَّ قتالهم ليس بمنزلة قتال الكفار</span> <span class="w" data-sq="meqë nuk janë jobesimtarë, andaj nuk u merren pasuritë">إذ لم يكونوا كفارًا، فلا تُؤخذ أموالُهم</span> <span class="w" data-sq="përveçse nëse kanë marrë pasuritë e njerëzve pa të drejtë">إلا أن يكونوا أخذوا أموال الناس بغير حق،</span> <span class="w" data-sq="atëherë kanë garanci, e merret prej tyre aq sa kanë marrë">فإنَّ عليهم ضمانها، فيؤخذ منهم بقدر ما أخذوا</span> <span class="w" data-sq="edhe nëse nuk dihet vetë marrësi">وإن لم يُعلَم عين الآخذ،</span> <span class="w" data-sq="sepse mbështetësi e kryerësi janë njësoj">وكذلك لو عُلِم، فإن الرِّدء والمباشر سواء كما قلناه،</span> <span class="w" data-sq="por kur dihet vetë ai, garancia përfundimtare bie mbi të">لكن إذا عُرف عينُه كان قرار الضمان عليه.</span></span></p>

<p><span class="s" data-sq="Kthehet ajo që u mor pronarëve të pasurive; e nëse kthimi u bë i pamundur, shkon për interesat e muslimanëve — nga furnizimi i forcës luftarake e tjetër."><span class="w" data-sq="kthehet ajo që u mor pronarëve të pasurive">ويُردُّ ما أُخِذ منه عليٰ أرباب الأموال،</span> <span class="w" data-sq="nëse kthimi u bë i pamundur, shkon për interesat e muslimanëve">فإن تعذَّر الردُّ إليهم كان لمصالح المسلمين</span> <span class="w" data-sq="nga furnizimi i forcës luftarake e tjetër">من رزق الطائفة المقاتلة لهم، وغير ذلك.</span></span></p>

<p><span class="s" data-sq="Qëllimi i luftimit të tyre është mposhja e tyre për zbatimin e ndëshkimeve dhe parandalimin e çrregullimit. Nëse plagosen rëndë, nuk i jepet goditja përfundimtare derisa të vdesë — përveçse nëse mbi të rëndonte ndëshkimi me vdekje. Nëse ik e na mjafton largimi i tij, nuk e ndjekim — përveçse nëse ka ndëshkim mbi të ose frikësohemi nga kthimi i tij."><span class="w" data-sq="qëllimi i luftimit është mposhja për zbatimin e ndëshkimeve">بل المقصود من قتالهم التمكُّن منهم لإقامة الحدود،</span> <span class="w" data-sq="dhe parandalimin e çrregullimit">ومنعهم من الفساد،</span> <span class="w" data-sq="nëse plagosen rëndë, nuk i jepet goditja përfundimtare">فإذا جُرح الرجل منهم جرحًا مُثْخَنًا لم يُجْهَز عليه حتيٰ يموت</span> <span class="w" data-sq="përveçse nëse mbi të rëndonte ndëshkimi me vdekje">إلا أن يكون قد وجب عليه القتل،</span> <span class="w" data-sq="nëse ik e na mjafton largimi, nuk e ndjekim">فإذا هو هرب وكفانا شرَّه لم نتَّبعه</span> <span class="w" data-sq="përveçse nëse ka ndëshkim mbi të ose frikësohemi nga kthimi">إلا أن يكون عليه حدٌّ أو نخاف عاقبته.</span></span></p>

<p><span class="s" data-sq="Kush prej tyre kapet, i zbatohet ndëshkimi që i zbatohet edhe të tjerëve; disa fukaha ashpërsohen me ta derisa i shohin pasuritë e tyre si plaçkë lufte me humus, por shumica e refuzojnë këtë."><span class="w" data-sq="kush prej tyre kapet, i zbatohet ndëshkimi">ومن أُسِر منهم أُقيم عليه الحدُّ الذي يُقام عليٰ غيره،</span> <span class="w" data-sq="disa fukaha ashpërsohen derisa i shohin pasuritë si plaçkë lufte">ومن الفقهاء من يأبون ذلك. يشدِّد فيهم حتيٰ يريٰ غنيمة أموالهم وتخميسها،</span> <span class="w" data-sq="por shumica e refuzojnë këtë">وأكثرهم يأبون ذلك.</span></span></p>`},

{html:`<p><span class="s" data-sq="Nëse bashkohen me mbretërinë e një grupi që ka dalë nga sheriati i Islamit dhe i ndihmojnë kundër muslimanëve, luftohen si luftimi i tyre."><span class="w" data-sq="nëse bashkohen me një grup jashtë sheriatit">فأما إذا تحيَّزوا إليٰ مملكةٍ طائفةٍ خارجةٍ عليٰ شريعة الإسلام</span> <span class="w" data-sq="dhe i ndihmojnë kundër muslimanëve, luftohen si luftimi i tyre">وأعانوهم عليٰ المسلمين = قُوتلوا كقتالهم.</span></span></p>

<p><span class="s" data-sq="Kush nuk pret rrugën por merr taksë (haraç) ose tatim nga udhëtarët — mbi koka, kafshë, ngarkesa e të ngjashme — ky është taksambledhës i padrejtë (mekas), mbi të bie ndëshkimi i taksambledhësve."><span class="w" data-sq="kush nuk pret rrugën por merr taksë ose tatim nga udhëtarët">وأما من كان لا يقطع الطريق لكنه يأخذ خفارة أو ضريبة من أبناء السبيل</span> <span class="w" data-sq="mbi koka, kafshë, ngarkesa e të ngjashme">عليٰ الرؤوس والدواب والأحمال ونحو ذلك؛</span> <span class="w" data-sq="ky është taksambledhës i padrejtë, mbi të bie ndëshkimi i tyre">فهذا نخَّاس مكَّاس عليه عقوبة المكاسين.</span></span></p>

<p><span class="s" data-sq="Fukahave u kanë ndryshuar mendimet rreth lejimit të vrasjes së tij — ai nuk është prej prerësve të rrugës, sepse rruga nuk pritet për shkak të tij — por ai është ndër njerëzit me ndëshkim më të ashpër Ditën e Kiametit. Pejgamberi ﷺ tha për gruan Gamidite:"><span class="w" data-sq="fukahave u ndryshuan rreth lejimit të vrasjes — nuk është prej prerësve të rrugës">وقد اختلف الفقهاء في جواز قتله، وليس هو من قُطَّاع الطريق، فإن الطريق لا تنقطع به،</span> <span class="w" data-sq="por ai është ndër njerëzit me ndëshkim më të ashpër Ditën e Kiametit">مع أنه من أشدِّ الناس عذابًا يوم القيامة،</span> <span class="w" data-sq="Pejgamberi ﷺ tha për gruan Gamidite:">حتيٰ قال النبي ﷺ في الغامدية:</span></span> <span class="s hadith" data-sq="Ajo u pendua me pendim të tillë që sikur të pendohej kështu taksambledhësi i padrejtë, do t'i falej.">«لقد تابت توبةً لو تابها صاحب مكسٍ لغُفِر له»</span></p>

<p><span class="s" data-sq="Të shtypurve, të cilëve u kërkohet pasuria, u lejohet luftimi i grabitësve me konsensus të muslimanëve; nuk detyrohen t'u japin asgjë nga pasuria nëse munden t'i luftojnë. Pejgamberi ﷺ tha:"><span class="w" data-sq="të shtypurve u lejohet luftimi i grabitësve me konsensus">ويجوز للمظلومين الذين تُراد أموالهم قتال المحاربين بإجماع المسلمين،</span> <span class="w" data-sq="nuk detyrohen t'u japin asgjë nëse munden t'i luftojnë">ولا يجب أن يُبْذَل لهم من المال شيءٌ إذا أمكن قتالُهم،</span> <span class="w" data-sq="Pejgamberi ﷺ tha:">النبي ﷺ:</span></span> <span class="s hadith" data-sq="Kush vritet duke mbrojtur pasurinë e vet është shehid, kush vritet duke mbrojtur gjakun (jetën) e vet është shehid, kush vritet duke mbrojtur fenë e vet është shehid, dhe kush vritet duke mbrojtur nderin e vet është shehid.">«من قُتِل دون ماله فهو شهيد، ومَن قتل دون دمه فهو شهيد، ومَن قتل دون دينه فهو شهيد، ومَن قتل دون حرمته فهو شهيد»</span></p>`},

{html:`<p><span class="s" data-sq="Ky që fukahave e quajnë: sulmues (sa'il), ai është zullumqar pa arsyetim e pa autoritet. Nëse kërkon pasurinë, lejohet zmbrapsja me çdo mjet; nëse nuk zmbrapet veçse me luftë, luftohet; e nëse heq dorë nga lufta dhe u jep diçka nga pasuria, lejohet."><span class="w" data-sq="ky që fukahave e quajnë: sulmues (sa'il), zullumqar pa arsyetim e pa autoritet">وهذا الذي تسميه الفقهاء: الصائل، وهو الظالم بلا تأويل ولا ولاية،</span> <span class="w" data-sq="nëse kërkon pasurinë, lejohet zmbrapsja me çdo mjet">فإن كان مطلوبُه المال جاز دفعُه بما يمكن،</span> <span class="w" data-sq="nëse nuk zmbrapet veçse me luftë, luftohet">فإذا لم يندفع إلا بالقتال قُوتِل،</span> <span class="w" data-sq="nëse heq dorë dhe u jep diçka nga pasuria, lejohet">وإن ترك القتال وأعطاهم شيئًا من المال جاز.</span></span></p>

<p><span class="s" data-sq="Kur kërkon nderin: si kur kërkon kurvëri me familjen e dikujt, ose kërkon imoralitet nga gruaja, fëmija ose tjetërkush — atëherë detyrohet ta mbrojë veten me çdo mjet, edhe me vrasje, e nuk lejohet nënshtrimi asnjëherë; ndryshe nga pasuria, sepse dhënia e pasurisë lejohet, por dhënia e imoralitetit nuk lejohet."><span class="w" data-sq="kur kërkon nderin: si kur kërkon kurvëri me familjen">وأما إذا كان مطلوبُه الحُرْمة: مثل أن يطلب الزنا بمحارم الإنسان،</span> <span class="w" data-sq="ose kërkon imoralitet nga gruaja, fëmija ose tjetërkush">أو يطلب من المرأة أو الصبي المملوك أو غيره الفجور به،</span> <span class="w" data-sq="detyrohet ta mbrojë veten me çdo mjet, edhe me vrasje">فإنه يجب عليه أن يدفَع عن نفسه بما يمكن ولو بالقتل،</span> <span class="w" data-sq="nuk lejohet nënshtrimi asnjëherë; ndryshe nga pasuria">ولا يجوز التمكينُ بحال، بخلاف المال فإنه يجوز التمكين منه؛</span> <span class="w" data-sq="sepse dhënia e pasurisë lejohet, por dhënia e imoralitetit jo">لأن بذل المال جائز، وبذل الفجور بالنفس أو الحُرْمة غير جائز.</span></span></p>

<p><span class="s" data-sq="Kur qëllimi i tij është vrasja e njeriut, lejohet mbrojtja e vetes, por a detyrohet? Dy mendime mes dijetarëve në medh'hebin e Ahmedit e të tjerëve."><span class="w" data-sq="kur qëllimi është vrasja, lejohet mbrojtja e vetes">وأما إذا كان مقصودُه قتل الإنسان جاز له الدفع عن نفسه،</span> <span class="w" data-sq="por a detyrohet? dy mendime">وهل يجب عليه؟ عليٰ قولين للعلماء في مذهب أحمد وغيره.</span></span></p>

<p><span class="s" data-sq="Kjo kur njerëzit kanë sundimtar. Por kur ndodh — Allahu na ruajttë — fitne, si kur dy sundimtarë muslimanë grinden e luftojnë për pushtet; a i lejohet njeriut, kur njëri hyn në vendin e tjetrit e shpata bie, të mbrojë veten në fitne, apo të dorëzohet e mos luftojë? Dy mendime mes dijetarëve në medh'hebin e Ahmedit"><span class="w" data-sq="kjo kur njerëzit kanë sundimtar">وهذا إذا كان للناس سلطان،</span> <span class="w" data-sq="por kur ndodh fitne">وأما إذا كان ـ والعياذ بالله ـ فتنة</span> <span class="w" data-sq="si kur dy sundimtarë muslimanë grinden për pushtet">مثل أن يختلف سلطانان للمسلمين ويقتتلان عليٰ الملك؛</span> <span class="w" data-sq="a lejohet mbrojtja e vetes në fitne, ose dorëzimi pa luftë?">فهل يجوز للإنسان إذا دخل أحدُهما بلدَ الآخر وجريَ السيفُ أن يدفع عن نفسه في الفتنة أو يستسلم ولا يقاتل فيها؟</span> <span class="w" data-sq="dy mendime mes dijetarëve në medh'hebin e Ahmedit">عليٰ قولين لأهل العلم في مذهب أحمد</span></span></p>`},

{html:`<p><span class="s" data-sq="e të tjerëve."><span class="w" data-sq="e të tjerëve">وغيره.</span></span></p>

<p><span class="s" data-sq="Kur sundimtari i kap grabitësit që kanë marrë pasuritë, ai detyrohet të nxjerrë prej tyre pasuritë e njerëzve dhe t'ua kthejë, bashkë me zbatimin e ndëshkimit mbi trupat e tyre; gjithashtu edhe hajdutin."><span class="w" data-sq="kur sundimtari i kap grabitësit që kanë marrë pasuritë">فإذا ظفر السلطان بالمحاربين الحرامية وقد أخذوا الأموال،</span> <span class="w" data-sq="ai detyrohet të nxjerrë pasuritë e njerëzve dhe t'ua kthejë">فعليه أن يستخرج منهم الأموال التي للناس ويردَّها عليهم،</span> <span class="w" data-sq="bashkë me zbatimin e ndëshkimit; gjithashtu edhe hajdutin">مع إقامة الحدِّ عليٰ أبدانهم، وكذلك السارق.</span></span></p>

<p><span class="s" data-sq="Nëse refuzojnë ta sjellin pasurinë pasi është provuar mbi ta, i ndëshkon me burg e rrahje derisa mundësohet marrja — duke e sjellë, ose duke autorizuar dikë ta sjellë, ose duke treguar vendin e saj."><span class="w" data-sq="nëse refuzojnë ta sjellin pasurinë pasi provohet mbi ta">فإن امتنعوا من إحضار المال بعد ثبوته عليهم،</span> <span class="w" data-sq="i ndëshkon me burg e rrahje">عاقبهم بالحبس والضرب</span> <span class="w" data-sq="derisa mundësohet marrja — duke e sjellë, autorizuar ose treguar vendin">حتيٰ يُمَكَّنوا من أخذه بإحضاره، أو توكيل من يحضره، أو الإخبار عنه بمكانه،</span></span></p>

<p><span class="s" data-sq="ashtu si ndëshkohet çdokush që refuzon detyrimin që i takon ta kryejë. Allahu në Librin e Tij i ka lejuar burrit ta disiplinojë gruan kur ajo refuzon të drejtën e detyruar derisa ta kryejë; andaj këta e meritojnë edhe më shumë."><span class="w" data-sq="ashtu si ndëshkohet çdokush që refuzon detyrimin">كما يُعاقَب كلُّ ممتنع عن حقٍّ وجبَ عليه أداؤه،</span> <span class="w" data-sq="Allahu i ka lejuar burrit ta disiplinojë gruan kur ajo refuzon të drejtën">فإنَّ الله قد أباح للرجل في كتابه أن يضرب امرأته إذا نَشَزَت</span> <span class="w" data-sq="derisa ta kryejë; andaj këta e meritojnë edhe më shumë">فامتنعت من الحق الواجب عليها حتيٰ توفيه، فهؤلاء أوليٰ وأحريٰ.</span></span></p>

<p><span class="s" data-sq="Kjo kërkesë dhe ndëshkim është e drejtë e pronarit të pasurisë; nëse dëshiron t'ua dhurojë pasurinë, ose të pajtohet, ose t'ua falë ndëshkimin — ka të drejtë; ndryshe nga zbatimi i ndëshkimit fiks (hadd) mbi ta, i cili nuk falet asnjëherë. Imami nuk ka të drejtë ta detyrjë pronarin të heqë dorë nga asgjë prej të drejtës së tij."><span class="w" data-sq="kjo kërkesë dhe ndëshkim është e drejtë e pronarit">وهذه المطالبة والعقوبة حقٌّ لربِّ المال،</span> <span class="w" data-sq="nëse dëshiron t'ua dhurojë pasurinë, pajtohet, ose t'ua falë — ka të drejtë">فإن أراد هِبَتَهم المال أو المصالحة عليه أو العفو عن عقوبتهم عليٰ ذلك؛ فله ذلك</span> <span class="w" data-sq="ndryshe nga zbatimi i hadd-it, i cili nuk falet asnjëherë">بخلاف إقامة الحد عليهم، فإنه لا سبيل إليٰ العفو عنه بحال.</span> <span class="w" data-sq="imami nuk ka të drejtë ta detyrjë pronarin të heqë dorë nga e drejta e tij">وليس للإمام أن يُلْزِم ربَّ المال بترك شيء من حقه.</span></span></p>`},

{html:`<p><span class="s" data-sq="Nëse pasuritë janë shpenzuar ose humbur tek ta ose tek hajduti, është thënë: i garantojnë pronarëve ashtu si çdo grabitës tjetër — ky është mendimi i Shafiut dhe Ahmedit; mbetet si borxh nëse janë të paaftë. Është thënë: nuk bashkohet prerja (e gjymtyrëve) me dëmshpërblimin — ky është mendimi i Ebu Hanifes. Është thënë: garantojnë vetëm kur janë të pasur, jo kur janë të paaftë — ky është mendimi i Malikut."><span class="w" data-sq="nëse pasuritë janë shpenzuar tek ta ose tek hajduti">وإن كانت الأموال قد تَلِفَت بالأكل وغيره عندهم أو عند السارق،</span> <span class="w" data-sq="i garantojnë pronarëve si çdo grabitës — mendimi i Shafiut dhe Ahmedit">فقيل: يضمنونها لأربابها كما يضمن سائر الغاصبين وهو قول الشافعي وأحمد رَضِيَ اللَّهُ عَنْهُمَا.</span> <span class="w" data-sq="mbetet si borxh nëse janë të paaftë">وتبقيٰ مع الإعسار في ذمتهم إليٰ ميسرة،</span> <span class="w" data-sq="është thënë: nuk bashkohet prerja me dëmshpërblimin — mendimi i Ebu Hanifes">وقيل: لا يُجمَع بين القطع والغُرْم، وهو قول أبي حنيفة،</span> <span class="w" data-sq="është thënë: garantojnë vetëm kur janë të pasur — mendimi i Malikut">وقيل: يضمنونها مع اليسار فقط دون الإعسار، وهو قول مالك.</span></span></p>

<p><span class="s" data-sq="Nuk i lejohet sundimtarit të marrë pagesë nga pronarët e pasurive për ndjekjen e hajdutëve — as për vete, as për ushtarët që dërgon; sepse ndjekja e tyre është lloj xhihadi në rrugën e Allahut, e ushtarët muslimanë dalin për këtë si për fushata të tjera të quajtura: el-Bikar."><span class="w" data-sq="nuk i lejohet sundimtarit të marrë pagesë nga pronarët për ndjekjen e hajdutëve">ولا يحلُّ للسلطان أن يأخذ من أرباب الأموال جُعْلًا عليٰ طلب السارقين،</span> <span class="w" data-sq="as për vete as për ushtarët që dërgon">لا لنفسه ولا للجُنْد الذين يرسلهم في طلبهم،</span> <span class="w" data-sq="sepse ndjekja e tyre është lloj xhihadi në rrugën e Allahut">بل طلب هؤلاء من نوع الجهاد في سبيل الله،</span> <span class="w" data-sq="ushtarët muslimanë dalin si për fushata të tjera: el-Bikar">فيخرج فيه جند المسلمين كما يخرج في غيره من الغزوات التي تسميٰ: البيكار.</span></span></p>`},

{html:`<p><span class="s" data-sq="Muxhahidinëve në këtë u shpenzohet nga fondi që shpenzohet për luftëtarët e tjerë; nëse kanë tokë ose rroga që u mjaftojnë, mirë; përndryshe u jepet plotësimi i nevojës nga fondet publike e sadakate, sepse kjo është 'në rrugën e Allahut'."><span class="w" data-sq="muxhahidinëve u shpenzohet nga fondi i luftëtarëve">ويُنفَق عليٰ المجاهدين في هذا من المال الذي يُنفَق منه عليٰ سائر الغزاة،</span> <span class="w" data-sq="nëse kanë tokë ose rroga që u mjaftojnë, mirë">فإن كان لهم إقطاع أو عطاء يكفيهم</span> <span class="w" data-sq="përndryshe u jepet plotësimi nga fondet publike e sadakate">وإلا أُعطوا تمامَ كفايتهم الغزاة لغزوهم من مال المصالح ومال الصدقات،</span> <span class="w" data-sq="sepse kjo është 'në rrugën e Allahut'">فإن هذا من سبيل الله.</span></span></p>

<p><span class="s" data-sq="Nëse udhëtarëve që u grabitën u takon zekati — si tregtarët — e imami ua merr zekatin e pasurive dhe e shpenzon në rrugën e Allahut si shpenzim për ata që ndjekin grabitësit, lejohet."><span class="w" data-sq="nëse udhëtarëve u takon zekati, si tregtarët">فإن كان عليٰ أبناء السبيل المأخوذين زكاة، مثل التجار الذين قد يؤخذون،</span> <span class="w" data-sq="imami ua merr zekatin e shpenzon në rrugën e Allahut — lejohet">فأخَذَ الإمامُ زكاة أموالهم وأنفقها في سبيل الله تعاليٰ، كنفقة الذين يَطلبون المحاربين = جاز.</span></span></p>

<p><span class="s" data-sq="Nëse kanë forcë të madhe që kërkon pajtim, imami mund t'u japë disa krerëve të tyre nga fej'i, fondet publike ose zekati — për ta ndihmuar në sjelljen e të tjerëve, ose për ta neutralizuar forcën e tyre që të dobësohen të tjerët. Këta do të ishin nga 'ata që u zbutet zemra' (el-muel·lefe kulubuhum); Ahmedi e të tjerë e kanë përmendur këtë, dhe është e qartë nga Kurani, Suneti dhe parimet e sheriatit."><span class="w" data-sq="nëse kanë forcë të madhe që kërkon pajtim">ولو كانت لهم شوكة قوية تحتاج إليٰ تأليف</span> <span class="w" data-sq="imami u jep disa krerëve nga fej'i ose zekati">فأعطيٰ الإمامُ من الفيء أو المصالح أو الزكاة لبعض رؤسائهم،</span> <span class="w" data-sq="për ta ndihmuar në sjelljen e të tjerëve ose neutralizimin e forcës">ليعينه عليٰ إحضار الباقين، أو لترك شرَّه فيَضعُف الباقون،</span> <span class="w" data-sq="këta do të ishin nga 'ata që u zbutet zemra'">وكان هؤلاء من المؤلفة قلوبهم،</span> <span class="w" data-sq="Ahmedi e të tjerë e kanë përmendur; e qartë nga Kurani e Suneti">وقد ذكر مثل ذلك غير واحد من الأئمة كأحمد وغيره، وهو ظاهرٌ بالكتاب والسنة وأصول الشريعة.</span></span></p>

<p><span class="s" data-sq="Nuk lejohet që imami të dërgojë dikë të dobët për t'u përballur me grabitësit, as dikë që merr para nga viktimat — tregtarët e udhëtarët; por dërgon ushtarë të fortë e të besuar, e nëse nuk gjenden, atëherë më të mirët e mundshëm."><span class="w" data-sq="nuk lejohet të dërgojë dikë të dobët ose dikë që merr para nga viktimat">ولا يجوز أن يرسل الإمامُ مَن يَضعُف عن مقاومة الحرامية، ولا مَن يأخذ مالًا من المأخوذين؛ التجار وغيرهم من أبناء السبيل،</span> <span class="w" data-sq="dërgon ushtarë të fortë e të besuar, e nëse jo, më të mirët e mundshëm">بل يرسل من</span></span></p>`},

{html:`<p><span class="s" data-sq="ushtarëve të fortë e të besuar; e nëse nuk gjenden, atëherë më të mirët e mundshëm."><span class="w" data-sq="ushtarëve të fortë e të besuar; e nëse jo, më të mirët e mundshëm">الجند الأقوياء الأمناء، إلا أن يتعذَّر ذلك فيرسل الأمثل فالأمثل.</span></span></p>

<p><span class="s" data-sq="Nëse ndonjë zëvendës i sundimtarit ose kryetar fshati ose i ngjashëm urdhëron grabitësit fshehurazi ose haptazi për të vjedhur, pastaj kur vjedhin u ndan plaçkën e i mbron, e ndoshta dëmshpërblen viktimat ose jo — ky është më fajtor se kreu i grabitësve; sepse grabitësi mund të zmbrapet më lehtë se ky korruptuar."><span class="w" data-sq="nëse ndonjë zëvendës i sundimtarit ose kryetar fshati">فإن كان بعض نُوَّاب السلطان أو رؤساء القريٰ ونحوهم</span> <span class="w" data-sq="urdhëron grabitësit fshehurazi ose haptazi">من يأمر الحرامية في الباطن بالأخذ أو الظاهر،</span> <span class="w" data-sq="pastaj kur vjedhin u ndan plaçkën e i mbron">حتيٰ إذا أخذوا شيئًا قاسمهم ودافع عنهم،</span> <span class="w" data-sq="e ndoshta dëmshpërblen viktimat ose jo">وأرضيٰ المأخوذين ببعض أموالهم أو لم يُرْضِهم</span> <span class="w" data-sq="ky është më fajtor se kreu i grabitësve">= فهذا أعظم جُرْمًا من مُقدَّم الحرامية؛</span> <span class="w" data-sq="sepse grabitësi mund të zmbrapet më lehtë se ky">لأن ذلك يمكن دفعُه بدون ما يُدفع به هذا.</span></span></p>

<p><span class="s" data-sq="Detyra është t'i thuhet për të ajo që thuhet për mbështetësin e ndihmësin e tyre: nëse kanë vrarë, ai vritet sipas mendimit të Umerit e shumicës; nëse kanë marrë pasuri, i pritet dora e këmba; nëse kanë vrarë e marrë pasuri, vritet e kryqëzohet. Sipas disa dijetarëve i pritet, vritet e kryqëzohet; e sipas disa tjerëve zgjedhet mes këtyre."><span class="w" data-sq="detyra është t'i thuhet ajo që thuhet për mbështetësin">والواجب أن يقال فيه ما يقال في الرِّدء والعون لهم،</span> <span class="w" data-sq="nëse kanë vrarë, ai vritet sipas Umerit e shumicës">فإن قتَلوا قُتِل هو عليٰ قول عمر بن الخطاب رَضِيَ اللَّهُ عَنْهُ وأكثر أهل العلم،</span> <span class="w" data-sq="nëse kanë marrë pasuri, i pritet dora e këmba">وإن أخذوا المال قُطِعت يدُه ورجله.</span> <span class="w" data-sq="nëse kanë vrarë e marrë, vritet e kryqëzohet">وإن قتلوا وأخذوا المال قُتل وصُلِب.</span> <span class="w" data-sq="sipas disave: pritet, vritet e kryqëzohet; sipas disave: zgjedhet">وهو عليٰ قول طائفة من أهل العلم يُقطع ويُقتل ويُصلَب، وقيل: يُخيَّر بين هذين.</span></span></p>

<p><span class="s" data-sq="Nëse nuk i ka autorizuar që në fillim, por pasi i kapi u ndau pasuritë dhe pezulloi disa të drejta e ndëshkime — ky nuk është si ai që i autorizoi, por krimi i tij është ndër më të mëdhenjtë, andaj ndëshkohet me diçka më poshtë."><span class="w" data-sq="nëse nuk i ka autorizuar por u ndau pasuritë pasi i kapi">وإن كانوا لم يؤذن لهم لكن لما قدر عليهم قاسمهم الأموال وعطل بعض الحقوق والحدود،</span> <span class="w" data-sq="ky nuk është si ai që i autorizoi, por krimi është ndër më të mëdhenjtë">فهذا ليس بمنزلة الذين أذن لهم ابتداء، كان جُرْمه من أعظم الجرائم،</span> <span class="w" data-sq="ndëshkohet me diçka më poshtë">فيعاقب بما دون ذلك.</span></span></p>

<p><span class="s" data-sq="Kush strehon muharib, hajdut, vrasës e të ngjashëm mbi të cilët ka ndëshkim ose e drejtë e Allahut ose e njeriut, dhe e pengon nga ai që do ta zbatojë detyrimin pa padrejtësi —"><span class="w" data-sq="kush strehon muharib, hajdut, vrasës e të ngjashëm">ومن آويٰ محاربًا أو سارقًا أو قاتلًا ونحوهم</span> <span class="w" data-sq="mbi të cilët ka ndëshkim ose e drejtë">ممن وجب عليه حدٌّ أو حقٌّ لله سبحانه وتعاليٰ أو لآدمي،</span> <span class="w" data-sq="dhe e pengon nga ai që do ta zbatojë detyrimin pa padrejtësi">ومنعه ممن يستوفي منه الواجب بلا</span></span></p>`},

{html:`<p><span class="s" data-sq="padrejtësi — ai është ortak i tij në krim; Allahu dhe i Dërguari i Tij e kanë mallkuar. Muslimi transmeton në 'Sahihun' e tij nga Aliu, Allahu qoftë i kënaqur me të, se Pejgamberi ﷺ tha:"><span class="w" data-sq="padrejtësi — ai është ortak i tij në krim">عدوان = فهو شريكه في الجرم،</span> <span class="w" data-sq="Allahu dhe i Dërguari i Tij e kanë mallkuar">ولقد لعنه الله ورسوله،</span> <span class="w" data-sq="Muslimi transmeton nga Aliu se Pejgamberi ﷺ tha:">رويٰ مسلم في «صحيحه» عن علي بن أبي طالب رَضِيَ اللَّهُ عَنْهُ قال: قال رسول الله ﷺ:</span></span> <span class="s hadith" data-sq="Allahu e mallkoftë atë që bën një shkelje, ose atë që strehon një shkelës.">«لعنَ الله من أحدَثَ حدثًا أو آويٰ مُحدِثًا»</span></p>

<p><span class="s" data-sq="Kur kapet ky që strehoi shkelësin, i kërkohet ta sjellë ose ta tregojë; nëse refuzon, ndëshkohet me burg e rrahje herë pas here derisa ta mundësojë sjelljen e shkelësit — ashtu si ndëshkohet ai që refuzon pagesën e borxhit të detyruar. Çdo gjë që detyrohet të paraqitet — qoftë njeri ose pasuri — ndëshkohet ai që pengon paraqitjen e saj."><span class="w" data-sq="kur kapet ky, i kërkohet ta sjellë ose ta tregojë">وإذا ظُفِر بهذا الذي آويٰ المُحْدِث، فإنه يُطلَّب منه إحضاره أو الإعلام به،</span> <span class="w" data-sq="nëse refuzon, ndëshkohet me burg e rrahje herë pas here">فإن امتنع عُوقِب بالحبس والضرب مرَّة بعد مرة</span> <span class="w" data-sq="derisa ta mundësojë sjelljen e shkelësit">حتيٰ يُمَكَّن من ذلك المُحْدِث،</span> <span class="w" data-sq="ashtu si ndëshkohet ai që refuzon pagesën e borxhit">كما ذكرنا أنه يُعاقَب الممتنع من أداء المال الواجب.</span> <span class="w" data-sq="çdo gjë që detyrohet paraqitja — ndëshkohet penguesi i saj">فما وجب حضورُه من النفوس والأموال يُعاقب من منعَ حضورَها.</span></span></p>

<p><span class="s" data-sq="Nëse dikush e di vendin e pasurisë ose njeriut të kërkuar me të drejtë e nuk e pengon, ai detyrohet ta tregojë e ta udhëzojë, nuk lejohet fshehja; sepse kjo është bashkëpunim në mirësi e devotshmëri, e kjo është detyrë. Ndryshe, nëse njeriu ose pasuria kërkohet padrejtësisht, nuk lejohet tregimi; sepse kjo është bashkëpunim në mëkat, madje detyrohet mbrojtja sepse ndihma e të shtypurit është detyrë."><span class="w" data-sq="nëse dikush e di vendin e pasurisë ose njeriut të kërkuar me të drejtë">ولو كانَ رجلٌ يعلمُ مكان المال المطلوب بحق، أو الرجل المطلوب بحق</span> <span class="w" data-sq="e nuk e pengon, detyrohet ta tregojë">وهو لم يمنعه، فإنه يجبُ عليه الإعلامُ به، والدلالةُ عليه،</span> <span class="w" data-sq="nuk lejohet fshehja; kjo është bashkëpunim në mirësi">ولا يجوز كتمانه، فإن هذا من باب التعاون عليٰ البر والتقويٰ وذلك واجب،</span> <span class="w" data-sq="nëse kërkohet padrejtësisht, nuk lejohet tregimi">بخلاف ما لو كان النفسُ أو المالُ مطويًّا بباطل، فإنه لا يحلُّ الإعلام به؛</span> <span class="w" data-sq="sepse kjo është bashkëpunim në mëkat; detyrohet mbrojtja e të shtypurit">ولأنه من التعاون عليٰ الإثم والعدوان، بل يجب الدفع عنه لأن نصر المظلوم واجب.</span></span></p>

<p><span class="s" data-sq="Në 'dy Sahihët' transmetohet nga Enesi, Allahu qoftë i kënaqur me të, se Pejgamberi ﷺ tha: «Ndihmoje vëllanë tënd, qoftë zullumqar ose i shtypur.» Thashë: O i Dërguar i Allahut, e ndihmoj kur është i shtypur, por si"><span class="w" data-sq="në 'dy Sahihët' nga Enesi, Pejgamberi ﷺ tha:">وفي «الصحيحين» عن أنس بن مالك رَضِيَ اللَّهُ عَنْهُ قال: قال رسول الله ﷺ:</span></span> <span class="s hadith" data-sq="Ndihmoje vëllanë tënd, qoftë zullumqar ose i shtypur.">«انصر أخاك ظالمًا أو مظلومًا»</span> <span class="s" data-sq="Thashë: O i Dërguar i Allahut, e ndihmoj kur është i shtypur, por si"><span class="w" data-sq="thashë: e ndihmoj kur është i shtypur, por si">قلت: يا رسول الله، أنصره مظلومًا فكيف</span></span></p>`},

{html:`<p><span class="s" data-sq="ta ndihmoj kur është zullumqar? Tha:"><span class="w" data-sq="ta ndihmoj kur është zullumqar? Tha:">أنصره ظالمًا؟ قال:</span></span> <span class="s hadith" data-sq="E pengon nga zullumi, kjo është ndihma jote ndaj tij.">«تمنعه من الظلم فذلك نصرك إياه»</span> <span class="s" data-sq="Muslimi transmeton të ngjashëm nga Xhabiri."><span class="w" data-sq="Muslimi transmeton të ngjashëm nga Xhabiri">ورويٰ مسلم نحوه عن جابر.</span></span></p>

<p><span class="s" data-sq="Në 'dy Sahihët' nga Bera ibn Azibi: Pejgamberi ﷺ na urdhëroi shtatë gjëra e na ndaloi shtatë: na urdhëroi vizitën e të sëmurit, ndjekjen e xhenazes, përgëzimin e teshtitësit, kryerjen e betimit, pranimin e ftesës, ndihmën e të shtypurit, [dhe përhapjen e selamit]. Dhe na ndaloi unazat e arit, pirjen nga argjendet, jastëkët e mëndafshit, veshjen e mëndafshit, kasiut, istibrakut dhe dibaxhit."><span class="w" data-sq="në 'dy Sahihët' nga Bera ibn Azibi:">وفي «الصحيحين» عن البراء بن عازب قال:</span> <span class="w" data-sq="na urdhëroi shtatë e na ndaloi shtatë">أمرنا رسول الله ﷺ بسبع، ونهانا عن سبع:</span> <span class="w" data-sq="vizitën e të sëmurit, xhenazen, teshtitësin, betimin, ftesën, ndihmën e të shtypurit, selamin">أمرنا بعيادة المريض، واتباع الجنائز، وتشميت العاطس، وإبرار القَسَم أو المُقْسِم، وإجابة الدعويٰ، ونصر المظلوم، [وإفشاء السلام].</span> <span class="w" data-sq="na ndaloi unazat e arit, argjendet, jastëkët e mëndafshit, mëndafshin">ونهانا عن خواتيم الذهب، وعن شرب بالفضة، وعن الميائر، وعن لبس الحرير، والقَسِّي، والاستبرق، والديباج.</span></span></p>

<p><span class="s" data-sq="Nëse ky dijetar (që e di vendin) refuzon të tregojë, lejohet ndëshkimi me burg e tjetër derisa ta tregojë; sepse refuzoi detyrimin që nuk pranohet zëvendësim; ndëshkohet siç u tha më parë. Por nuk lejohet ndëshkimi veçse kur dihet se ai e di vendin."><span class="w" data-sq="nëse refuzon të tregojë, lejohet ndëshkimi me burg derisa ta tregojë">فإن امتنع هذا العالِمُ به من الإعلام بمكانه جاز عقوبته بالحبس وغيره حتيٰ يخبر به؛</span> <span class="w" data-sq="sepse refuzoi detyrimin që nuk pranohet zëvendësim">لأنه امتنع من حقٍّ وَجَبَ عليه لا تدخله النيابة، فعُوقب كما تقدم،</span> <span class="w" data-sq="por nuk lejohet ndëshkimi veçse kur dihet se ai e di">ولا تجوز عقوبته عليٰ ذلك إلا إذا عُرف أنه عالم به.</span></span></p>

<p><span class="s" data-sq="Ky parim vlen për çdo rast ku sundimtarët, gjykatësit e të tjerë kanë të bëjnë me dikë që refuzon detyrimin nga fjala ose veprimi. Kjo nuk është ndëshkim i njeriut për detyrimin e tjetrit, as ndëshkim për tradhtinë e tjetrit, që të hyjë nën fjalën e Allahut: «Asnjë mëkatar nuk bartë mëkatin e tjetrit» [El-En'am: 164], dhe fjalën e Pejgamberit ﷺ: «Asnjë kriminel nuk kryen krim veçse mbi"><span class="w" data-sq="ky parim vlen për çdo rast ku sundimtarët e gjykatësit kanë dikë që refuzon detyrimin">وهذا مُطَّرِدٌ فيما يتولاه الولاة والقضاة وغيرهم في كل من امتنع من واجب من قول أو فعل،</span> <span class="w" data-sq="kjo nuk është ndëshkim për detyrimin e tjetrit">وليس هذا بمطالبةٍ للرجل بحقٍّ وجب عليٰ غيره،</span> <span class="w" data-sq="as ndëshkim për tradhtinë e tjetrit">ولا عقوبةٍ عليٰ خيانةٍ غيره</span> <span class="w" data-sq="që të hyjë nën fjalën e Allahut:">حتيٰ يدخل في قوله:</span> <span class="w quran" data-sq="Asnjë mëkatar nuk bartë mëkatin e tjetrit. [El-En'am: 164]">﴿وَلَا تَزِرُ وَازِرَةٌ وِزْرَ أُخْرَيٰ﴾</span> <span class="w" data-sq="[El-En'am: 164], dhe fjalën e Pejgamberit ﷺ:">[الأنعام: ١٦٤]، وفي قول النبي ﷺ:</span></span> <span class="s hadith" data-sq="Asnjë kriminel nuk kryen krim veçse mbi">«ألا لا يجني جانٍ إلا</span></p>`},

{html:`<p><span class="s hadith" data-sq="veten e tij.">عليٰ نفسه»</span> <span class="s" data-sq="Kjo do të ishte si kur dikujt i kërkohet pasuria e detyruar mbi tjetrin, pa qenë përfaqësues as garant, ose ndëshkohet për krimin e të afërmit ose fqinjit, pa bërë vetë asnjë mëkat — as duke lënë detyrë as duke bërë haram; kjo nuk lejohet."><span class="w" data-sq="kjo do të ishte si kur dikujt i kërkohet pasuria e tjetrit, pa qenë garant">وإنما ذاك مثل أن يُطلَّب بمال قد وجب عليٰ غيره، وكيلًا ولا ضامنًا ولا له عنده مال،</span> <span class="w" data-sq="ose ndëshkohet për krimin e fqinjit, pa bërë vetë asnjë mëkat">أو يُعاقَب بجريرة قريبه أو جاره، من غير أن يكون هو قد أذنب لا بترك واجب ولا فعل محرَّم،</span> <span class="w" data-sq="kjo nuk lejohet">فهذا الذي لا يحل.</span></span></p>

<p><span class="s" data-sq="Por ky njeri ndëshkohet për mëkatin e vet — që e di vendin e zullumqarit të kërkuar për zbatimin e të drejtës, ose e di vendin e pasurisë me të cilën janë lidhur të drejtat e pronarëve, e refuzon ndihmën e detyruar mbi të"><span class="w" data-sq="ky njeri ndëshkohet për mëkatin e vet">فأما هذا فإنما يُعاقَب عليٰ ذنب نفسه،</span> <span class="w" data-sq="që e di vendin e zullumqarit të kërkuar">وهو أن يكون قد عَلِم مكان الظالم الذي يُطلَّب حضورُه لاستيفاء الحق،</span> <span class="w" data-sq="ose e di vendin e pasurisë me të drejtat e pronarëve">أو يعلم مكان المال الذي قد تعلق به حقوق المستحقين،</span> <span class="w" data-sq="e refuzon ndihmën e detyruar">فيمتنع من الإعانة والنُّصْرَة الواجبة عليه</span></span></p>

<p><span class="s" data-sq="sipas Kuranit, Sunetit dhe konsensusit — ose nga dashamirësia e fanatizmi për zullumqarin, siç bëjnë mëkatarët për njëri-tjetrin; ose nga armiqësia e urrejtja ndaj të shtypurit. Allahu i Lartësuar tha:"><span class="w" data-sq="sipas Kuranit, Sunetit dhe konsensusit">بالكتاب والسنة والإجماع؛</span> <span class="w" data-sq="ose nga dashamirësia për zullumqarin">إما محاباةً وحميَّةً لذلك الظالم،</span> <span class="w" data-sq="siç bëjnë mëkatarët për njëri-tjetrin">كما قد يفعل أهل المعصية بعضهم لبعض،</span> <span class="w" data-sq="ose nga armiqësia ndaj të shtypurit. Allahu tha:">وإما مُعاداة وبغضًا للمظلوم، وقد قال الله تعاليٰ:</span></span> <span class="s quran" data-sq="Le mos u shtyjë urrejtja ndaj një populli e t'i shmangeni drejtësisë; bëhuni të drejtë, se ajo është më afër devotshmërisë. [El-Maide: 8]">﴿وَلَا يَجْرِمَنَّكُمْ شَنَآنُ قَوْمٍ عَلَيٰ أَلَّا تَعْدِلُوا اعْدِلُوا هُوَ أَقْرَبُ لِلتَّقْوَيٰ﴾</span> <span class="s" data-sq="[El-Maide: 8].">[المائدة: ٨].</span></p>

<p><span class="s" data-sq="ose nga shmangja nga kryerja e detyrës ndaj Allahut dhe drejtësisë që Allahu ka bërë detyrë; ose nga frika, dështimi dhe tradhtia ndaj fesë, siç bëjnë ata që braktisin ndihmën e fesë së Allahut, të Dërguarit dhe Librit të Tij — të cilët kur u thuhet: 'Dilni në rrugën e Allahut,' rëndohen në tokë."><span class="w" data-sq="ose nga shmangja nga kryerja e detyrës ndaj Allahut dhe drejtësisë">وإما إعراضًا عن القيام لله والقيام بالقسط الذي أوجبه الله تعاليٰ،</span> <span class="w" data-sq="ose nga frika, dështimi dhe tradhtia ndaj fesë">أو جُبْنًا وفشلًا وخذلانًا لدينه،</span> <span class="w" data-sq="siç bëjnë braktisësit e fesë — kur u thuhet 'dilni në rrugën e Allahut' rëndohen në tokë">كما يفعله التاركون لنصر دين الله تعاليٰ، ورسوله وكتابه، الذين إذا قيل لهم: انفروا في سبيل الله اثَّاقلوا إليٰ الأرض.</span></span></p>`},

{html:`<p><span class="s" data-sq="Sido qoftë, ky lloj meriton ndëshkimin sipas konsensusit të dijetarëve. Kush nuk ndjek këtë rrugë, pezullon ndëshkimet, humb të drejtat, dhe i forti e ha të dobëtin."><span class="w" data-sq="sido qoftë, ky lloj meriton ndëshkimin sipas konsensusit">وعليٰ كل تقدير فهذا الصنف يستحق العقوبة باتفاق العلماء.</span> <span class="w" data-sq="kush nuk ndjek këtë rrugë, pezullon ndëshkimet, humb të drejtat, i forti e ha të dobëtin">ومن لم يسلك هذا السبيل عطَّل الحدود، وضيَّع الحقوق، وأكلَ القويُّ الضعيفَ.</span></span></p>

<p><span class="s" data-sq="Ai i ngjan atij që ka pasurinë e zullumqarit vonues — borxh ose mall — dhe refuzon t'ia dorëzojë gjykatësit të drejtë për ta shlyer... për familjen, të afërmit, robërit ose kafshët e tij."><span class="w" data-sq="ai i ngjan atij që ka pasurinë e zullumqarit e refuzon ta dorëzojë">وهو يشبه من عنده مال الظالم الماطل من عين أو دين، وقد امتنع من تسليمه إليٰ حاكم عادل يوفي به دينه،</span> <span class="w" data-sq="për familjen, të afërmit, robërit ose kafshët e tij">عليه لأهله أو لأقاربه أو مماليكه أو بهائمه.</span></span></p>

<p><span class="s" data-sq="Shpesh njeriut i bie detyrim për shkak të tjetrit, ashtu si nafaka detyrohet për shkak të nevojës së të afërmit... Ndëshkimi disiplinor (ta'zir) është për atë që dihet se ka pasuri ose njeri që detyrohet ta sjellë por nuk e sjell — si prerësit e rrugës, hajdutët e mbrojtësit e tyre, ose ai që dihet se e di vendin por nuk tregon."><span class="w" data-sq="shpesh njeriut i bie detyrim për shkak të tjetrit, si nafaka">وكثيرًا ما يجب عليٰ الرجل حقٌّ بسبب غيره، كما تجبُ عليه النفقة بسبب حاجة قريبة،</span> <span class="w" data-sq="ta'ziri është për atë që ka pasuri ose njeri por nuk e sjell">التعزير عقوبة لمن عُلِم أن عنده مالًا أو نفسًا يجب إحضارُه وهو لا يُحْضِره؛</span> <span class="w" data-sq="si prerësit, hajdutët e mbrojtësit, ose ai që di por nuk tregon">كالقُطَّاع والسُّرَّاق وحُماتهم، أو عُلِم أنه خبير به وهو لا يخبر بمكانه.</span></span></p>

<p><span class="s" data-sq="Nëse refuzon tregimin që të mos i bëhet padrejtësi të kërkuarit — ky bën mirë. Shpesh ngatërrohen dy rastet, dhe bashkohen dyshimi e epshi; detyra është dallimi i të drejtës nga e kota."><span class="w" data-sq="nëse refuzon që të mos i bëhet padrejtësi — ky bën mirë">فأمَّا إن امتنع من الإخبار والإحضار؛ لئلا يعتديٰ عليه الطالب أو يظلمه؛ فهذا محسن،</span> <span class="w" data-sq="shpesh ngatërrohen dy rastet; detyra është dallimi i të drejtës nga e kota">وكثيرًا ما يشتبه أحدهما بالآخر، وتجتمع شبهة وشهوة، والواجب تمييز الحق من الباطل.</span></span></p>

<p><span class="s" data-sq="Kjo ndodh shpesh me krerët e beduinëve e qytetarëve kur dikush kërkon strehim tek ta, ose ka farefisnëri ose miqësi; ata ndjekin fanatizmin e xhahilijetit,"><span class="w" data-sq="kjo ndodh shpesh me krerët kur dikush kërkon strehim ose ka farefisnëri">وهذا يقع كثيرًا في الرؤساء من أهل البادية والحاضرة إذا استجار بهم مستجير، أو كان بينهما قرابة أو صداقة،</span> <span class="w" data-sq="ata ndjekin fanatizmin e xhahilijetit">فإنهم يرون الحَمِيَّة الجاهلية،</span></span></p>`},

{html:`<p><span class="s" data-sq="dhe krenarinë me mëkat, dhe reputacionin tek turma — e mbrojnë e ndihmojnë atë edhe kur është zullumqar, mbi të drejtin e shtypur; veçanërisht nëse i shtypuri është kryetar kundërshtar. Shohin dorëzimin e strehuesit si poshtërim e dobësi. Kjo — në përgjithësi — është xhahilijet e pastër, dhe ndër shkaqet më të mëdha të prishjes së fesë e botës."><span class="w" data-sq="krenarinë me mëkat, reputacionin tek turma">والعزة بالإثم، والسمعة عند الأوباش</span> <span class="w" data-sq="e mbrojnë edhe kur është zullumqar, mbi të drejtin e shtypur">= أنهم ينصرونه ويحمونه ـ وإن كان ظالمًا مُبطلًا ـ عليٰ المُحِقِّ المظلوم،</span> <span class="w" data-sq="veçanërisht nëse i shtypuri është kryetar kundërshtar">لاسيما إن كان المظلوم رئيسًا يناوؤهم</span> <span class="w" data-sq="shohin dorëzimin si poshtërim">ويناوؤنه، فيرون أن في تسليم المستجير بهم إليٰ من يناوؤهم ذلًّا وعجزًا،</span> <span class="w" data-sq="kjo është xhahilijet e pastër, ndër shkaqet më të mëdha të prishjes">وهذا ـ عليٰ الإطلاق ـ جاهلية محضة، وهي من أكبر أسباب فساد الدين والدنيا،</span></span></p>

<p><span class="s" data-sq="siç përmendet se kjo ishte shkaku i luftërave arabe si Lufta e Busosit mes Beni Bekrit e Taglibit; gjithashtu shkaku i hyrjes së turqve mongolë në tokën e Islamit dhe pushtimit të tyre mbi mbretërit e Maveraunnehrit e Horasanit — ishte diçka e tillë."><span class="w" data-sq="siç ishte shkaku i luftërave arabe si Lufta e Busosit">وقد ذُكِر أنه إنما كان سبب حروب من حروب الأعراب؛ كحرب البسوس، التي كانت من بني بكر وتغلب إلا نحو هذا،</span> <span class="w" data-sq="gjithashtu shkaku i hyrjes së mongolëve në tokën e Islamit">وكذا سبب دخول الترك المغول إليٰ دار الإسلام، واستيلاؤهم عليٰ ملوك ما وراء النهر وخراسان = كان سببه نحو هذا.</span></span></p>

<p><span class="s" data-sq="Kush e përul veten për Allahun, e ka ngritur; kush jep të drejtën nga vetja, e ka nderuar veten; sepse më i ndershmi tek Allahu është më i devotshmi. Kush krenohet me zullum — duke penguar të drejtën e duke bërë mëkat — e ka poshtëruar veten. Allahu i Lartësuar tha:"><span class="w" data-sq="kush e përul veten për Allahun, e ka ngritur">ومن أذلَّ نفسه لله تعاليٰ فقد أعزَّها،</span> <span class="w" data-sq="kush jep të drejtën nga vetja, e ka nderuar veten">ومن بذل الحقَّ من نفسه فقد أكرم نفسه،</span> <span class="w" data-sq="sepse më i ndershmi tek Allahu është më i devotshmi">فإنَّ أكرم الخلق عند الله أتقاهم.</span> <span class="w" data-sq="kush krenohet me zullum, e ka poshtëruar veten. Allahu tha:">ومن اعتزَّ بالظلم من نفسه، مَنْعَ الحق وِفعْل الإثم، فقد أذلَّ نفسه وأهانها، قال الله تعاليٰ:</span></span> <span class="s quran" data-sq="Kush dëshiron krenarinë (le ta dijë), e tërë krenaria i takon All-llahut. [Fatir: 10]">﴿مَن كَانَ يُرِيدُ ٱلْعِزَّةَ فَلِلَّهِ ٱلْعِزَّةُ جَمِيعًا﴾</span> <span class="s" data-sq="[Fatir: 10]">[فاطر: ١٠]،</span></p>

<p><span class="s" data-sq="dhe tha për munafikët:"><span class="w" data-sq="dhe tha për munafikët:">وقال تعاليٰ عن المنافقين:</span></span> <span class="s quran" data-sq="Ata thonë: Kur të kthehemi në Medinë, ai më i fuqishmi do ta dëbojë prej aty atë më të dobëtin. E krenaria i takon All-llahut, të dërguarit të Tij dhe besimtarëve, por hipokritët nuk e dinë. [El-Munafikun: 8]">﴿يَقُولُونَ لَئِن رَّجَعْنَآ إِلَى ٱلْمَدِينَةِ لَيُخْرِجَنَّ ٱلْأَعَزُّ مِنْهَا ٱلْأَذَلَّ وَلِلَّهِ ٱلْعِزَّةُ وَلِرَسُولِهِ وَلِلْمُؤْمِنِينَ وَلَـٰكِنَّ ٱلْمُنَـٰفِقِينَ لَا يَعْلَمُونَ﴾</span> <span class="s" data-sq="[El-Munafikun: 8].">[المنافقون: ٨]،</span></p>

<p><span class="s" data-sq="dhe tha, i Madhëruar, në përshkrimin e këtij lloji:"><span class="w" data-sq="dhe tha në përshkrimin e këtij lloji:">وقال جل جلاله في صفة هذا الضرب:</span></span> <span class="s quran" data-sq="Ka prej njerëzve që fjala e tij të mahnit ty në jetën e kësaj bote dhe për atë që ka në zemrën e tij e bën dëshmitar All-llahun. [El-Bekare: 204]">﴿وَمِنَ ٱلنَّاسِ مَن يُعْجِبُكَ قَوْلُهُۥ فِى ٱلْحَيَوٰةِ ٱلدُّنْيَا وَيُشْهِدُ ٱللَّهَ عَلَىٰ مَا فِى قَلْبِهِۦ</span></p>`}
,{html:`<p><span class="s quran" data-sq="...e ai është kundërshtari më i rreptë. E kur largohet (prej teje), kalon nëpër tokë për të bërë shkatërrime në të, shkatërron të mbjellat edhe kafshët. All-llahu nuk e do shkatërrimin. E kur i thuhet atij: Kij frikë All-llahun, atë e kap kryelartësia edhe mëkati, prandaj xhehennemi është vend i denjë për të, e sa shtrat i keq është ai. [El-Bekare: 204-206]">وَهُوَ أَلَدُّ ٱلْخِصَامِ ۝ وَإِذَا تَوَلَّىٰ سَعَىٰ فِى ٱلْأَرْضِ لِيُفْسِدَ فِيهَا وَيُهْلِكَ ٱلْحَرْثَ وَٱلنَّسْلَ وَٱللَّهُ لَا يُحِبُّ ٱلْفَسَادَ ۝ وَإِذَا قِيلَ لَهُ ٱتَّقِ ٱللَّهَ أَخَذَتْهُ ٱلْعِزَّةُ بِٱلْإِثْمِ فَحَسْبُهُۥ جَهَنَّمُ وَلَبِئْسَ ٱلْمِهَادُ﴾</span> <span class="s" data-sq="[El-Bekare: 204-206].">[البقرة: ٢٠٤-٢٠٦].</span></p>

<p><span class="s" data-sq="Ndërsa detyrimi mbi atë tek i cili kërkohet strehim: nëse është i padrejtësuar, e ndihmon. Nuk vërtetohet se është i padrejtësuar thjesht me pretendimin e tij — shpesh ankohet njeriu ndërsa ai vetë është zullumqar. Përkundrazi, hetohet gjendja e tij nga kundërshtari dhe të tjerët. Nëse rezulton se është zullumqar, e kthen nga padrejtësia me butësi nëse mundësohet — qoftë me pajtim ose gjykim me drejtësi — përndryshe me forcë."><span class="w" data-sq="detyrimi mbi atë tek i cili kërkohet strehim:">وإنما الواجب على من استجار به مستجير:</span> <span class="w" data-sq="nëse është i padrejtësuar, e ndihmon">إن كان مظلومًا ينصره،</span> <span class="w" data-sq="nuk vërtetohet se është i padrejtësuar thjesht me pretendimin e tij">ولا يثبت أنه مظلوم بمجرّد دعواه،</span> <span class="w" data-sq="shpesh ankohet njeriu ndërsa ai vetë është zullumqar">فطالما اشتكى الرجل وهو ظالم،</span> <span class="w" data-sq="përkundrazi hetohet gjendja e tij nga kundërshtari dhe të tjerët">بل يكشف خبرَه من خصمه وغيره،</span> <span class="w" data-sq="nëse rezulton se është zullumqar, e kthen nga padrejtësia me butësi">فإن كان ظالمًا ردّه عن الظلم بالرفق إن أمكن،</span> <span class="w" data-sq="qoftë me pajtim ose gjykim me drejtësi, përndryshe me forcë">إما من صلح أو حُكْم بالقسط، وإلا فبالقوة.</span></span></p>

<p><span class="s" data-sq="E nëse secili prej tyre është edhe zullumqar edhe i padrejtësuar — si njerëzit e epsheve nga Kajsi, Jemeni e të ngjashëm, dhe shumica e atyre që padisin njëri-tjetrin nga banorët e qyteteve e shkretëtirave, ose ishin që të dy pa faj për shkak dyshimi, interpretimi ose gabimi që ndodhi mes tyre — ndërmjetësohet mes tyre me pajtim ose gjykim, siç tha i Lartësuari:"><span class="w" data-sq="nëse secili prej tyre është edhe zullumqar edhe i padrejtësuar">وإن كان كلٌّ منهما ظالمًا مظلومًا؛</span> <span class="w" data-sq="si njerëzit e epsheve nga Kajsi, Jemeni e të ngjashëm">كأهل الأهواء من قيس ويَمَن ونحوهم،</span> <span class="w" data-sq="shumica e atyre që padisin njëri-tjetrin nga banorët e qyteteve e shkretëtirave">وأكثر المتداعين من أهل الأمصار والبوادي،</span> <span class="w" data-sq="ose ishin pa faj për shkak dyshimi, interpretimi ose gabimi mes tyre">أو كانا جميعًا غير ظالمين لشبهة أو تأويل أو غلط وقع فيما بينهما=</span> <span class="w" data-sq="ndërmjetësohet mes tyre me pajtim ose gjykim, siç tha i Lartësuari:">سعى بينهما بالإصلاح أو الحكم، كما قال تعالى:</span></span></p>

<p><span class="s quran" data-sq="Në qoftë se dy grupe besimtarësh kaplohen ndërmjet vete, ju pajtoni ata, e në qoftë se njëri grup e kalon tjetrin, atëherë luftojeni atë grup që ka kaluar derisa t'i kthehet urdhrit të All-llahut, e nëse kthehet, atëherë bëni pajtimin ndërmjet tyre me drejtësi e bëhuni të barabartë, se All-llahu i do ata që janë të barabartë (të drejtë). S'ka dyshim se besimtarët janë vëllezër, pra bëni pajtim ndërmjet vëllezërve tuaj dhe kini frikë All-llahun, që të jeni të mëshiruar. [El-Huxhurat: 9-10]">﴿وَإِن طَآئِفَتَانِ مِنَ ٱلْمُؤْمِنِينَ ٱقْتَتَلُوا فَأَصْلِحُوا بَيْنَهُمَا فَإِنۢ بَغَتْ إِحْدَاهُمَا عَلَى ٱلْأُخْرَىٰ فَقَـٰتِلُوا ٱلَّتِى تَبْغِى حَتَّىٰ تَفِىٓءَ إِلَىٰٓ أَمْرِ ٱللَّهِ فَإِن فَآءَتْ فَأَصْلِحُوا بَيْنَهُمَا بِٱلْعَدْلِ وَأَقْسِطُوٓا۟ إِنَّ ٱللَّهَ يُحِبُّ ٱلْمُقْسِطِينَ ۝ إِنَّمَا ٱلْمُؤْمِنُونَ إِخْوَةٌ فَأَصْلِحُوا بَيْنَ أَخَوَيْكُمْ وَٱتَّقُوا ٱللَّهَ لَعَلَّكُمْ تُرْحَمُونَ﴾</span> <span class="s" data-sq="[El-Huxhurat: 9-10].">[الحجرات: ٩-١٠]،</span></p>

<p><span class="s" data-sq="dhe tha i Lartësuari:">وقال تعالى:</span> <span class="s quran" data-sq="Nuk ka hajr në shumë biseda të tyre përveç kush urdhëron për lëmoshë, ose për vepër të mirë ose pajtim mes njerëzve. E kush i bën këto duke pasur për qëllim kënaqësinë e All-llahut, Ne do t'i japim shpërblim të madh. [En-Nisa: 114]">﴿لَّا خَيْرَ فِى كَثِيرٍ مِّن نَّجْوَاهُمْ إِلَّا مَنْ أَمَرَ بِصَدَقَةٍ أَوْ مَعْرُوفٍ أَوْ إِصْلَـٰحٍۭ بَيْنَ ٱلنَّاسِ وَمَن يَفْعَلْ ذَٰلِكَ ٱبْتِغَآءَ مَرْضَاتِ ٱللَّهِ فَسَوْفَ نُؤْتِيهِ أَجْرًا عَظِيمًا﴾</span> <span class="s" data-sq="[En-Nisa: 114].">[النساء: ١١٤].</span></p>

<p><span class="s" data-sq="Ka transmetuar Ebu Davudi në Sunen nga Pejgamberi ﷺ se i është thënë: A është nga fanatizmi"><span class="w" data-sq="ka transmetuar Ebu Davudi në Sunen">وقد رويَ أبو داود في «السنن»</span> <span class="w" data-sq="nga Pejgamberi ﷺ se i është thënë:">عن النبي ﷺ أنه قيل له:</span> <span class="w" data-sq="a është nga fanatizmi">أمِنَ العصبية</span></span></p>`}
,{html:`<p><span class="s" data-sq="që njeriu të ndihmojë popullin e tij në të drejtën? Tha:"><span class="w" data-sq="që njeriu të ndihmojë popullin e tij në të drejtën?">أن ينصر الرجل قومَه في الحق؟</span> <span class="w" data-sq="tha:">قال:</span></span> <span class="s hadith" data-sq="Jo, por fanatizmi është që njeriu të ndihmojë popullin e tij në të padrejtën.">«لا، ولكن العصبية أن ينصرَ الرجلُ قومَه في الباطل».</span></p>

<p><span class="s" data-sq="Dhe tha:">وقال:</span> <span class="s hadith" data-sq="Më i miri prej jush është ai që mbron popullin e tij, derisa nuk mëkaton.">«خيرُكم المدافع عن قومه ما لم يأثم».</span></p>

<p><span class="s" data-sq="Dhe tha:">وقال:</span> <span class="s hadith" data-sq="Shembulli i atij që ndihmon popullin e tij në të padrejtën, është si deveja që bie në pus e tërhiqet me bishtin e saj.">«مثل الذي ينصرُ قومَه في الباطل كبعير تردّى في بئر فهو يجُرُّ بذَنَبِه».</span></p>

<p><span class="s" data-sq="Dhe tha:">وقال:</span> <span class="s hadith" data-sq="Kush e dëgjoni duke u mburrur me mburrtje xhahilijeti, thuajini: Kafshoje organin e babait tënd, dhe mos përdorni eufemizma.">«من سمعتموه يتعزّى بعزاء الجاهلية فأعِضُّوه بهَنِ أبيه ولا تَكْنوا»،</span> <span class="s" data-sq="do me thënë: thuajini hapur.">أي: قولوا له: عضّ أيرَ أبيك.</span></p>`}
,{html:`<p><span class="s" data-sq="Çdo gjë që del jashtë thirrjes së Islamit dhe Kuranit — qoftë nga prejardhja, vendi, raca, medh'hebi apo rruga — është prej mburrtjes së xhahilijetit."><span class="w" data-sq="çdo gjë që del jashtë thirrjes së Islamit dhe Kuranit">وكل ما خرج عن دعوة الإسلام والقرآن</span> <span class="w" data-sq="nga prejardhja, vendi, raca, medh'hebi apo rruga">من نسب أو بلد أو جنس، أو مذهب أو طريقة؛</span> <span class="w" data-sq="është prej mburrtjes së xhahilijetit">فهو من عزاء الجاهلية.</span></span></p>

<p><span class="s" data-sq="Madje kur u grindën dy burra nga muhaxhirët dhe ensarët — muhaxhiri thirri: O muhaxhirë!, dhe ensari thirri: O ensarë! — Pejgamberi ﷺ tha:"><span class="w" data-sq="madje kur u grindën dy burra nga muhaxhirët dhe ensarët">بل لما اختصم رجلان من المهاجرين والأنصار</span> <span class="w" data-sq="muhaxhiri thirri: O muhaxhirë!">فقال المهاجري: يا للمهاجرين،</span> <span class="w" data-sq="dhe ensari thirri: O ensarë!">وقال الأنصاري: يا للأنصار.</span> <span class="w" data-sq="Pejgamberi ﷺ tha:">قال النبي ﷺ:</span></span> <span class="s hadith" data-sq="A me thirrje xhahilijeti ndërsa unë jam mes jush?">«أبدعوى الجاهلية وأنا بين أظهركم؟»،</span> <span class="s" data-sq="dhe u zemërua për këtë shumë.">وغضب لذلك غضبًا شديدًا.</span></p>

<p style="text-align:center;font-size:1.5rem;letter-spacing:.5rem">❖ ❖ ❖</p>`}
,{html:`<h2 class="fasl">فصل</h2>

<p><span class="s" data-sq="Sa i përket vjedhësit: është obligim prerja e dorës së tij të djathtë me Librin, Sunnetin dhe konsensusin. Allahu i Lartësuar tha:"><span class="w" data-sq="sa i përket vjedhësit">وأما السارق؛</span> <span class="w" data-sq="është obligim prerja e dorës së tij të djathtë me Librin, Sunnetin dhe konsensusin">فيجب قطع يده اليمنى بالكتاب والسنة والإجماع،</span> <span class="w" data-sq="Allahu i Lartësuar tha:">قال الله تعالى:</span></span> <span class="s quran" data-sq="Vjedhësit dhe vjedhëses prejuani duart, si ndëshkim i asaj që punuan, (kjo është) masë ndëshkuese nga All-llahu. All-llahu është i gjithëfuqishëm, i urtë. E kush pendohet pas zullumit që ka bërë dhe përmirësohet, s'ka dyshim se All-llahu ia pranon pendimin. All-llahu falë shumë, është mëshirues. [El-Maide: 38-39]">﴿وَٱلسَّارِقُ وَٱلسَّارِقَةُ فَٱقْطَعُوٓا أَيْدِيَهُمَا جَزَآءً بِمَا كَسَبَا نَكَـٰلًا مِّنَ ٱللَّهِ وَٱللَّهُ عَزِيزٌ حَكِيمٌ ۝ فَمَن تَابَ مِنۢ بَعْدِ ظُلْمِهِۦ وَأَصْلَحَ فَإِنَّ ٱللَّهَ يَتُوبُ عَلَيْهِ إِنَّ ٱللَّهَ غَفُورٌ رَّحِيمٌ﴾</span> <span class="s" data-sq="[El-Maide: 38-39].">[المائدة: ٣٨-٣٩]،</span></p>

<p><span class="s" data-sq="Nuk lejohet pas vërtetimit të dënimit mbi të — me dëshmi apo pranim — vonesa e tij as me burg, as me pasuri për t'u shpenguar, as me gjë tjetër. Përkundrazi, pritet dora e tij në kohë të madhërueshme e të tjera."><span class="w" data-sq="nuk lejohet pas vërtetimit të dënimit — me dëshmi apo pranim">ولا يجوز بعد ثبوت الحدّ عليه بالبيّنة أو الإقرار</span> <span class="w" data-sq="vonesa e tij as me burg, as me pasuri, as me gjë tjetër">تأخيرُه لا بحبس، ولا مال يفتدي به، ولا غيره،</span> <span class="w" data-sq="pritet dora e tij në kohë të madhërueshme e të tjera">بل تُقطع يده في الأوقات المعظّمة وغيرها.</span></span></p>

<p><span class="s" data-sq="Zbatimi i dënimeve është prej ibadeteve, si xhihadi në rrugën e Allahut. Duhet ditur se zbatimi i dënimit është mëshirë nga Allahu ndaj robërve të Tij. Prandaj udhëheqësi duhet të jetë i vendosur në zbatimin e dënimit — të mos e marrë dhembshuria në fenë e Allahut e ta pezullojë atë. Qëllimi i tij duhet të jetë mëshira ndaj krijesave duke i ndaluar njerëzit nga të këqijat, jo shërimi i mllefit apo dëshira për t'u ngritur mbi krijesat."><span class="w" data-sq="zbatimi i dënimeve është prej ibadeteve, si xhihadi në rrugën e Allahut">فإن إقامة الحدود من العبادات كالجهاد في سبيل الله،</span> <span class="w" data-sq="duhet ditur se zbatimi i dënimit është mëshirë nga Allahu ndaj robërve të Tij">وينبغي أن يعرف أن إقامة الحدّ رحمة من الله بعباده،</span> <span class="w" data-sq="udhëheqësi duhet të jetë i vendosur në zbatimin e dënimit">فيكون الوالي شديدًا في إقامة الحدّ،</span> <span class="w" data-sq="të mos e marrë dhembshuria në fenë e Allahut e ta pezullojë atë">لا تأخذه رأفةٌ في دين الله فيعطله.</span> <span class="w" data-sq="qëllimi i tij të jetë mëshira ndaj krijesave duke i ndaluar nga të këqijat">ويكون قصده رحمة الخلق بكفّ الناس عن المنكرات،</span> <span class="w" data-sq="jo shërimi i mllefit apo dëshira për t'u ngritur mbi krijesat">لا شفاءَ غيظه وإرادته للعلو على الخلق.</span></span></p>

<p><span class="s" data-sq="Si pozita e prindit kur e edukon fëmijën: sikur ta linte pa e edukuar siç sugjeron nëna nga butësia — do të prishej fëmija. E edukon nga mëshira dhe përmirësimi i gjendjes së tij, megjithëse dëshiron që mos ta detyrojë. Si mjeku që i jep të sëmurit barën e hidhur. Si prerja e gjymtyrës së kalbur, vendosja e kupave dhe prerja e venave. Madje si pirja e njeriut barën e hidhur dhe futja e vetes në vështirësi për të arritur rehatin."><span class="w" data-sq="si pozita e prindit kur e edukon fëmijën">بمنزلة الوالد إذا أدّبَ ولدَه،</span> <span class="w" data-sq="sikur ta linte pa e edukuar siç sugjeron nëna nga butësia — do të prishej fëmija">فإنه لو كفّ عن تأديب ولده كما تُشِير به الأمّ رِقّةً ورأفة ـ لفسدَ الولدُ،</span> <span class="w" data-sq="e edukon nga mëshira dhe përmirësimi i gjendjes, megjithëse dëshiron që mos ta detyrojë">وإنما يؤدّبه رحمةً به وإصلاحًا لحاله، مع أنه يودُّ ويؤثر أن لا يُحوِجه إلى تأديب.</span> <span class="w" data-sq="si mjeku që i jep të sëmurit barën e hidhur">وبمنزلة الطبيب الذي يسقي المريض الدواء الكريه.</span> <span class="w" data-sq="si prerja e gjymtyrës së kalbur, vendosja e kupave dhe prerja e venave">وبمنزلة قَطْع العضو المستأكِل، والحَجْم، وقَطْع العروق بالفصاد، ونحو ذلك.</span> <span class="w" data-sq="madje si pirja e njeriut barën e hidhur dhe futja e vetes në vështirësi për rehati">بل بمنزلة شرب الإنسان الدواء الكريه وما يُدخله على نفسه من المشقّة لينال به الراحة.</span></span></p>`}
,{html:`<p><span class="s" data-sq="Prandaj u ligjëruan dënimet, dhe kështu duhet të jetë nijeti i udhëheqësit në zbatimin e tyre. Sepse kur qëllimi i tij është përmirësimi i popullit, ndalimi nga të këqijat duke u sjellë dobi e duke larguar dëmin, duke kërkuar kënaqësinë e Allahut dhe bindjen ndaj urdhrit të Tij — Allahu ia zbut zemrat, i lehtëson shkaqet e mirësisë, i mjafton dënimi i lehtë, dhe madje i dënuari kënaqet kur i zbatohet dënimi."><span class="w" data-sq="prandaj u ligjëruan dënimet">فلهذا شُرعت الحدود،</span> <span class="w" data-sq="kështu duhet të jetë nijeti i udhëheqësit në zbatimin e tyre">وهكذا ينبغي أن تكون نية الوالي في إقامتها،</span> <span class="w" data-sq="kur qëllimi i tij është përmirësimi i popullit, ndalimi nga të këqijat duke u sjellë dobi e duke larguar dëmin">فإنه متى كان قصدُه صلاحَ الرعية، والنهي عن المنكرات بجلب المنفعة لهم، ودَفْع الضرر عنهم،</span> <span class="w" data-sq="duke kërkuar kënaqësinë e Allahut dhe bindjen ndaj urdhrit të Tij">وابتغى بذلك وجهَ الله تعالى وطاعة أمره=</span> <span class="w" data-sq="Allahu ia zbut zemrat, i lehtëson shkaqet e mirësisë">لَيَّنَ الله سبحانه وتعالى له القلوب، وتيسرت له أسباب الخير،</span> <span class="w" data-sq="i mjafton dënimi i lehtë, dhe madje i dënuari kënaqet kur i zbatohet">وكفاه العقوبة اليسيرة، وقد يرضى المحدود إذا أقام عليه الحد.</span></span></p>

<p><span class="s" data-sq="Ndërsa nëse qëllimi i tij është ngritja mbi ta, vendosja e pushtetit që ta madhërojnë, ose t'i japin pasuritë që dëshiron — i kthehet kundër qëllimi."><span class="w" data-sq="nëse qëllimi i tij është ngritja mbi ta, vendosja e pushtetit që ta madhërojnë">وأما إذا كان غرضُه العلوَّ عليهم، وإقامة رياسته ليعظِّموه،</span> <span class="w" data-sq="ose t'i japin pasuritë që dëshiron — i kthehet kundër qëllimi">أو ليبذلوا له ما يريد من الأموال= انعكس عليه مقصوده.</span></span></p>

<p><span class="s" data-sq="Transmetohet se Umer ibn AbdulAzizi, radijallahu anhu, para se të merrte hilafeting, ishte zëvendës i Velidit ibn AbdulMelik mbi Medinen e Pejgamberit ﷺ, dhe i kishte udhëhequr me politikë të mirë. Erdhi Haxhxhaxhi nga Iraku — i cili i kishte munduar me ndëshkimin më të keq — dhe pyeti banorët e Medinës për Umerin: Si është frika juaj ndaj tij? Thanë: Nuk mundemi as ta shikojmë nga frika. Tha:"><span class="w" data-sq="transmetohet se Umer ibn AbdulAzizi para hilafetit ishte zëvendës i Velidit mbi Medinen e Pejgamberit ﷺ">يروى أن عمر بن عبد العزيز رضي الله عنه قبل أن يلي الخلافة كان نائبًا للوليد بن عبد الملك على مدينة النبي ﷺ،</span> <span class="w" data-sq="i kishte udhëhequr me politikë të mirë">وكان قد ساسهم سياسةً صالحةً،</span> <span class="w" data-sq="erdhi Haxhxhaxhi nga Iraku — i cili i kishte munduar me ndëshkimin më të keq">فقَدِم الحجّاج من العراق وقد سامهم سوء العذاب،</span> <span class="w" data-sq="pyeti banorët e Medinës: Si është frika juaj ndaj tij? Thanë: Nuk mundemi as ta shikojmë nga frika. Tha:">فسأل أهل المدينة عن عمر: كيف هيبته فيكم؟ قالوا: ما نستطيع أن ننظر إليه هيبةً، قال:</span></span></p>`}
,{html:`<p><span class="s" data-sq="Si është dashuria juaj ndaj tij? Thanë: Është më i dashur tek ne se familjet tona. Tha: Si është ndëshkimi i tij mes jush? Thanë: Mes tre kamxhikëve deri në dhjetë. Tha: Kjo është frika ndaj tij, kjo është dashuria ndaj tij, dhe ky është ndëshkimi i tij — ky është çështje nga qielli!"><span class="w" data-sq="si është dashuria juaj ndaj tij? Thanë: Është më i dashur tek ne se familjet tona">كيف محبتكم له؟ قالوا: هو أحبُّ إلينا من أهلنا،</span> <span class="w" data-sq="si është ndëshkimi i tij mes jush? Thanë: Mes tre kamxhikëve deri në dhjetë">قال: فكيف أدبه فيكم؟ قالوا: ما بين الثلاثة الأسواط إلى العشرة،</span> <span class="w" data-sq="kjo është frika, kjo është dashuria, ky është ndëshkimi — çështje nga qielli!">قال: هذه هيبته، وهذه محبته، وهذا أدبه، هذا أمر من السماء!</span></span></p>

<p><span class="s" data-sq="Kur pritet dora, kauterizohet, dhe preferohet të varet në qafën e tij. Nëse vjedh për herë të dytë, pritet këmba e majtë. Nëse vjedh për herë të tretë e të katërt, ka dy mendime nga sahabët dhe dijetarët pas tyre:"><span class="w" data-sq="kur pritet dora, kauterizohet">وإذا قُطِعت يده حُسِمت،</span> <span class="w" data-sq="preferohet të varet në qafën e tij">ويستحب أن تعلَّق في عنقه،</span> <span class="w" data-sq="nëse vjedh për herë të dytë, pritet këmba e majtë">فإن سرق ثانيًا قُطِعت رجله اليسرى،</span> <span class="w" data-sq="nëse vjedh për herë të tretë e të katërt, ka dy mendime">فإن سرق ثالثًا ورابعًا؛ فيه قولان للصحابة ومَن بعدهم من العلماء:</span></span></p>

<p><span class="s" data-sq="E para: priten të katërta në herën e tretë e të katërt — ky është mendimi i Ebu Bekrit, radijallahu anhu, dhe medh'hebi i Shafiut e Ahmedit në njërën transmetim."><span class="w" data-sq="priten të katërta në herën e tretë e të katërt">أحدهما: تُقْطَع أربعتُه في الثالثة والرابعة،</span> <span class="w" data-sq="mendimi i Ebu Bekrit, medh'hebi i Shafiut e Ahmedit në njërën transmetim">وهو قول أبي بكر رضي الله عنه ومذهب الشافعي وأحمد في إحدى الروايتين.</span></span></p>

<p><span class="s" data-sq="E dyta: burgoset — ky është mendimi i Aliut ibn Ebi Talibit, radijallahu anhu, dhe kufianëve, dhe medh'hebi i Ebu Hanifes e Ahmedit në transmetimin tjetër."><span class="w" data-sq="burgoset — mendimi i Aliut ibn Ebi Talibit dhe kufianëve">والثاني: أنه يُحْبس، وهو قول علي بن أبي طالب رضي الله عنه والكوفيين،</span> <span class="w" data-sq="medh'hebi i Ebu Hanifes e Ahmedit në transmetimin tjetër">ومذهب أبي حنيفة وأحمد في روايته الأخرى.</span></span></p>

<p><span class="s" data-sq="Pritet dora vetëm nëse vjedh nisabin, i cili është një e katërta e dinarit ose tre dirhem sipas shumicës së dijetarëve nga Hixhazi, dijetarët e hadithit e të tjerë — si Maliku dhe Shafiu"><span class="w" data-sq="pritet dora vetëm nëse vjedh nisabin">وإنما تُقْطَع يده إذا سرق نصابًا،</span> <span class="w" data-sq="një e katërta e dinarit ose tre dirhem sipas shumicës së dijetarëve">وهو ربع دينار أو ثلاثة دراهم عند جمهور العلماء من أهل الحجاز وأهل الحديث وغيرهم؛</span> <span class="w" data-sq="si Maliku dhe Shafiu">كمالك والشافعي</span></span></p>`}
,{html:`<p><span class="s" data-sq="dhe Ahmedi. Ka prej tyre që thonë: një dinar ose dhjetë dirhem. Kush vjedh këtë sasi, pritet me konsensus."><span class="w" data-sq="dhe Ahmedi">وأحمد.</span> <span class="w" data-sq="ka prej tyre që thonë: një dinar ose dhjetë dirhem">ومنهم من يقول: دينار أو عشرة دراهم.</span> <span class="w" data-sq="kush vjedh këtë sasi, pritet me konsensus">فمن سرق ذلك قُطِع بالاتفاق.</span></span></p>

<p><span class="s" data-sq="Në dy Sahihët, nga Ibn Umeri, radijallahu anhuma, transmetohet se i Dërguari i Allahut ﷺ preu dorën për një mburojë me vlerë tre dirhem."><span class="w" data-sq="në dy Sahihët nga Ibn Umeri, radijallahu anhuma">وفي «الصحيحين» عن ابن عمر رضي الله عنهما</span> <span class="w" data-sq="i Dërguari i Allahut ﷺ preu dorën për një mburojë me vlerë tre dirhem">أن رسول الله ﷺ قَطَع في مِجَنٍّ ثمنه ثلاثة دراهم.</span></span></p>

<p><span class="s" data-sq="Në shprehjen e Muslimit: Preu dorën e një vjedhësi për një mburojë me vlerë tre dirhem. Mixheni është mburoja."><span class="w" data-sq="në shprehjen e Muslimit: preu dorën e një vjedhësi për një mburojë me vlerë tre dirhem">وفي لفظ لمسلم: قَطَع سارقًا في مِجَنٍّ قيمته ثلاثة دراهم.</span> <span class="w" data-sq="mixheni është mburoja">والمِجَنّ التُّرْس.</span></span></p>

<p><span class="s" data-sq="Në dy Sahihët, nga Aishja, radijallahu anha, e cila tha: I Dërguari i Allahut ﷺ tha:">وفي «الصحيحين» عن عائشة رضي الله عنها قالت: قال رسول الله ﷺ:</span> <span class="s hadith" data-sq="Pritet dora e vjedhësit për një të katërtën e dinarit e sipër.">«تُقطع يد السارق في ربع دينار فصاعدًا».</span> <span class="s" data-sq="Në transmetimin e Muslimit:">وفي رواية لمسلم:</span> <span class="s hadith" data-sq="Nuk pritet dora e vjedhësit veçse për një të katërtën e dinarit e sipër.">«لا تُقطع يدُ السارق إلا في ربع دينار فصاعدًا».</span> <span class="s" data-sq="Në transmetimin e Buhariut tha:">وفي رواية البخاري قال:</span> <span class="s hadith" data-sq="Pritni për një të katërtën e dinarit dhe mos pritni për më pak se kaq.">«اقطعوا في ربع دينار ولا تقطعوا فيما هو أدنى من ذلك».</span> <span class="s" data-sq="Dhe një e katërta e dinarit atëherë ishte tre dirhem, ndërsa dinari dymbëdhjetë dirhem.">وكان ربع الدينار يومئذ ثلاثة دراهم، والدينار اثنا عشر درهمًا.</span></p>

<p><span class="s" data-sq="Vjedhësi nuk konsiderohet vjedhës derisa e merr pasurinë nga vendi i mbrojtur (hirzi). Sa i përket pasurisë së humbur nga pronari, frutave në pemë në shkretëtirë pa rojtare, bagëtisë pa bari, e ngjashëm — nuk ka prerje, por ndëshkohet marrësi me ta'zir, dhe dyfishohet"><span class="w" data-sq="vjedhësi nuk konsiderohet vjedhës derisa e merr pasurinë nga hirzi">ولا يكون السارق سارقًا حتى يأخذ المال من حِرْز،</span> <span class="w" data-sq="pasuria e humbur, frutat pa rojtare, bagëtia pa bari">فأما المال الضائع من صاحبه، والثمر الذي يكون في الشجر في الصحراء بلا حافظ والماشية التي لا راعي عندها، ونحو ذلك=</span> <span class="w" data-sq="nuk ka prerje, por ndëshkohet me ta'zir dhe dyfishohet">فلا قَطْع فيه لكن يُعَزَّر الآخذ، ويضاعف</span></span></p>`}
,{html:`<p><span class="s" data-sq="mbi të gjoba siç erdhi me hadith.">عليه الغُرم كما جاء به الحديث.</span></p>

<p><span class="s" data-sq="Dijetarët kanë mospajtime për dyfishimin; prej atyre që e thanë: Ahmedi e të tjerë."><span class="w" data-sq="dijetarët kanë mospajtime për dyfishimin">وقد اختلف أهل العلم في التضعيف،</span> <span class="w" data-sq="prej atyre që e thanë: Ahmedi e të tjerë">وممن قال به: أحمد وغيره،</span></span> <span class="s" data-sq="Rafi' ibn Hadixh tha: E dëgjova të Dërguarin e Allahut ﷺ duke thënë:">قال رافع بن خديج: سمعت رسول الله ﷺ يقول:</span> <span class="s hadith" data-sq="Nuk ka prerje për fruta e as për kether (zemrën e palmës).">«لا قطع في ثَمَرٍ ولا كَثَر».</span> <span class="s" data-sq="Ketheri është xhummari — zemra e palmës. Transmetuar nga autorët e Suneneve."><span class="w" data-sq="ketheri është xhummari — zemra e palmës">والكَثَر: هو الجُمَّار جُمَّار النخل.</span> <span class="w" data-sq="transmetuar nga autorët e Suneneve">رواه أهل السنن.</span></span></p>
