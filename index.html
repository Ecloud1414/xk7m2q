{html:`<p><span class="s" data-sq="dikujt, dhe po ashtu dëshmia zbatohet pa padi; edhe pse juristët u ndanë për prerjen e dorës: a varet nga kërkesa e të vjedhurut për pasurinë? Me dy mendime, por janë dakord se nuk varet nga kërkesa e dënimit; disa kushtëzuan kërkesën e pasurisë që hajduti mos ketë dyshim."><span class="w" data-sq="dikujt, po ashtu dëshmia pa padi; juristët u ndanë për prerjen: a varet nga kërkesa e pasurisë?">أحدٍ به، وكذلك تُقام الشهادة فيه من غير دعوى أحدٍ به، وإن كان الفقهاء قد اختلفوا في قطع يد السارق: هل يفتقر إلى مطالبة المسروق بماله؟</span> <span class="w" data-sq="Me dy mendime, por dakord se nuk varet nga kërkesa e dënimit; disa kushtëzuan pasurinë për mungesë dyshimi.">على قولين في مذهب أحمد وغيره، ولكنهم متفقون على أنه لا يفتقر إلى مطالبة المسروق بالحدِّ، بل اشترط بعضُهم المطالبة بالمال لئلا يكون للسارق فيه شبهة.</span></span></p>

<p><span class="s" data-sq="Dhe ky lloj obligohet zbatimi mbi fisnikun e të ulëtin, të fortin e të dobëtin; nuk lejohet pezullimi as me ndërmjetësim, as dhuratë, as ndryshe; nuk lejohet ndërmjetësimi; e kush e pezullon — duke mundur — mbi të mallkimi i Allahut, melaikëve e gjithë njerëzve, nuk pranon Allahu as farz as nafile; ai është nga ata që e blenë fjalën e Allahut me çmim të vogël."><span class="w" data-sq="Ky lloj obligohet mbi fisnikun e të ulëtin; nuk lejohet pezullimi as me ndërmjetësim as dhuratë; nuk lejohet shefati në të;">وهذا القسم يجب إقامته على الشريف والوضيع، والقوي والضعيف، ولا يحل تعطيله لا بشفاعة ولا بهدية ولا بغيرهما، ولا تحل الشفاعة فيه،</span> <span class="w" data-sq="e kush e pezullon duke mundur — mbi të mallkimi i Allahut, melaikëve e njerëzve, nuk pranon as farz as nafile; ai bleu fjalën e Allahut me çmim të vogël.">ومن عطَّله لذلك ـ وهو قادر على إقامته ـ فعليه لعنة الله والملائكة والناس أجمعين، لا يقبل الله منه صرفًا ولا عدلًا، وهو ممن اشترى بآيات الله ثمنًا قليلًا.</span></span></p>

<p><span class="s hadith" data-sq="Transmetoi Ebu Daudi nga Abdullah ibnu Omer, radijallahu anhuma, tha: Tha i Dërguari ﷺ: «Kush ndërmjetëson e pengon dënim nga dënimet e Allahut, ka kundërshtuar Allahun; kush mbrojtë të pavërtetën duke ditur, mbetet në zemërimin e Allahut derisa ta lërë; e kush thotë për myslimanin çka s'është në të, mbahet në baltën e keqes derisa ta largojë.» I thanë: Ç'është balta e keqes? Tha: «Shtrydhja e banorëve të zjarrit.»"><span class="w" data-sq="Ebu Daudi nga Ibnu Omeri: Tha ﷺ: «Kush ndërmjetëson e pengon dënim, ka kundërshtuar Allahun; kush mbrojtë të pavërtetën duke ditur, mbetet në zemërim;">روى أبو داود في «سننه» عن عبد الله بن عمر رضي الله عنهما قال: قال رسول الله ﷺ: «من حالت شفاعتُه دون حدٍّ من حدود الله فقط ضادَّ الله في أمره، ومَن خاصم في باطلٍ وهو يعلم لم يزل في سخط الله حتى ينزع،</span> <span class="w" data-sq="e kush thotë për myslimanin çka s'është në të, mbahet në baltën e keqes derisa ta largojë.» Ç'është balta? Tha: «Shtrydhja e banorëve të zjarrit.»">ومَن قال في مسلم ما ليس فيه حُبِسَ في ردغة الخَبال حتى يخرج مما قال». قيل: يا رسول الله، وما ردغة الخبال؟ قال: «عُصارة أهل النار».</span></span></p>`},
// ===== Faqja 84: Hadithi i Usames — Fatimeja, shtyllat e gjykimit (PDF fq. 86) =====
{html:`<p><span class="s" data-sq="Kështu i përmendi Pejgamberi ﷺ gjyqtarët, dëshmitarët e palët — këta janë shtyllat e gjykimit.">فذكر النبي ﷺ الحُكّام، والشهداء، والخُصَماء، وهؤلاء أركان الحكم.</span></p>

<p><span class="s hadith" data-sq="Në «dy Sahihët» nga Aisheja, radijallahu anha, se Kurejshit i shqetësoi çështja e Mahzumijes që vodhi; thanë: Kush do t'i flasë të Dërguarit? Thanë: Kush guxon përveç Usame ibnu Zejdit. Tha: «O Usame, a ndërmjetëson në dënim nga dënimet e Allahut? Beni Izraelët u shkatërruan sepse kur vidhte fisnikun e linin, e kur vidhte i dobëti e dënonin; pasha Atë në dorën e të Cilit është shpirti i Muhammedit, sikur Fatimeja bija e Muhammedit të vidhte, do t'ia prisja dorën.»"><span class="w" data-sq="Në «dy Sahihët» nga Aisheja: Kurejshit i shqetësoi Mahzumija që vodhi; thanë: Kush guxon t'i flasë përveç Usames?">وفي «الصحيحين» عن عائشة رضي الله عنها أن قريشًا أهمَّهم شأن المخزومية التي سرقت، فقالوا: مَن يكلم فيها رسول الله؟ فقالوا: ومَن يجترئ عليه إلا أسامة بن زيد،</span> <span class="w" data-sq="Tha: «O Usame, a ndërmjetëson në dënim? Beni Izraelët u shkatërruan: kur vidhte fisnikun e linin, e kur vidhte i dobëti e dënonin; sikur Fatimeja të vidhte, do t'ia prisja dorën.»">قال: «يا أسامة، أتشفعُ في حدٍّ من حدود الله؟ إنما هلك بنوا إسرائيل أنهم كانوا إذا سرق فيهم الشريف تركوه، وإذا سرق فيهم الضعيف أقاموا عليه الحد، والذي نفس محمد بيده لو أن فاطمة بنت محمد سرقت لقطعتُ يدَها».</span></span></p>

<p><span class="s" data-sq="Në këtë tregim ka mësim; ngase shtëpia më fisnike e Kurejshit ishin dy degë: Beni Mahzum e Beni Abd Menaf; e kur iu obligua kësaj prerja për vjedhjen — që është mohimi i huasë">ففي هذه القصة عبرة، فإنّ أشرف بيت كان في قريش بطنان: بنو مخزوم، وبنو عبد مناف، فلما وجب على هذه القطعُ بسرقتها، التي هي جهود العاريَّة</span></p>`},
// ===== Faqja 85: Zemërimi i Pejgamberit, gruaja e penduar, Maliku e Zubejri (PDF fq. 87) =====
{html:`<p><span class="s" data-sq="sipas mendimit të disa dijetarëve, ose vjedhje tjetër sipas të tjerëve; e ajo ishte nga fiset më të mëdha e shtëpitë më fisnike, e ndërmjetësoi Usame i dashuri i Pejgamberit ﷺ — u zemërua Pejgamberi ﷺ e ia kundërshtoi hyrjen në ndërmjetësimin e dënimeve; pastaj dha shembullin me zonjën e grave të botërave — e Allahu e pastëroi — e tha: «Sikur Fatimeja të vidhte, do t'ia prisja dorën.»"><span class="w" data-sq="sipas disa dijetarëve ose vjedhje tjetër; ajo ishte nga fiset më të mëdha, e ndërmjetësoi Usame — u zemërua Pejgamberi ﷺ;">على قول بعض العلماء، أو سرقة أخرى غير هذه على قول آخرين، وكانت من أكبر القبائل وأشرف البيوت، وشفَع فيها حِبُّ رسول الله ﷺ أسامة= غضبَ رسول الله ﷺ، وأنكر عليه دخوله فيما حرمه الله، وهو الشفاعة في الحدود،</span> <span class="w" data-sq="pastaj dha shembullin me zonjën e grave të botërave e tha: «Sikur Fatimeja bija e Muhammedit të vidhte, do t'ia prisja dorën.»">ثم ضرب المثل بسيدة نساء العالمين ـ وقد برَّأها الله من ذلك ـ فقال: «لو أن فاطمة بنت محمد سرقت لقطعتُ يدَها».</span></span></p>

<p><span class="s" data-sq="Dhe transmetohet: se gruaja që iu pre dora u pendua, e hynte te Pejgamberi ﷺ e ai ia plotësonte nevojën.">وقد رُوي: أن هذه المرأة التي قُطِعت يدها تابت، وكانت تدخل بعد ذلك على النبي ﷺ فيقضي حاجَتَها.</span></p>

<p><span class="s" data-sq="Dhe transmetohet: «Se hajduti kur pendohet, e paraprin dora në xhenet; e nëse nuk pendohet, e paraprin dora në zjarr.»">فقد رُوي: «أن السارق إذا تاب سبقته يده إلى الجنة، وإن لم يتب سبقته يده إلى النار».</span></p>

<p><span class="s" data-sq="Dhe transmetoi Maliku në «Muvet-ta»: se një grup e zunë hajdutin ta çojnë te Uthmani, e i takoi Zubejri e u foli; thanë: Kur t'i çohet Uthmanit, ndërmjetëso. Tha: Kur dënimet arrijnë sulltanin, mallkoi Allahu ndërmjetësuesin e atë që pranon ndërmjetësimin — do me thënë: atë që pranon shefatin."><span class="w" data-sq="Maliku në «Muvet-ta»: zunë hajdutin ta çojnë te Uthmani, Zubejri u foli; thanë: Ndërmjetëso te Uthmani.">وروى مالك في «الموطأ»: أن جماعةً أمسكوا لصًّا ليرفعوه إلى عثمان، فتلقاهم الزبير فكلَّمهم فيه، فقالوا: إذا رُفِع إلى عثمان فاشفع فيه</span> <span class="w" data-sq="Tha: Kur dënimet arrijnë sulltanin, mallkoi Allahu ndërmjetësuesin e pranuesin.">عنده، فقال: إذا بلغت الحدودُ السلطانَ فلعن الله الشافع والمُشفَّع. يعني الذي يقبل الشفاعة.</span></span></p>`},
// ===== Faqja 86: Hadithi i Safvanit, pendimi pas dënimit, En-Nisa 85 (PDF fq. 88) =====
{html:`<p><span class="s" data-sq="Dhe ishte Safvan ibnu Umeje duke fjetur mbi ridanë e tij në xhaminë e Pejgamberit ﷺ, e erdhi hajduti e vodhi; e kapi e ia çoi Pejgamberit ﷺ, e ai urdhëroi prerjen e dorës. Tha: O i Dërguari, për ridanë time ia pret dorën? Unë ia fal."><span class="w" data-sq="Safvani ishte duke fjetur mbi ridanë në xhami, hajduti vodhi; e kapi e ia çoi Pejgamberit ﷺ, urdhëroi prerjen.">وكان صفوان بن أمية نائمًا على ردائه في مسجد النبي ﷺ، فجاء لصٌّ فسرقه، فأخذه فأتى به النبيَّ ﷺ، فأمر بقطع يده،</span> <span class="w" data-sq="Tha: Për ridanë ia pret dorën? Unë ia fal.">فقال: يا رسول الله، أعلى ردائي تقطع يده؟ أنا أهَبُه له،</span></span> <span class="s hadith" data-sq="«Pse jo para se të ma sillte?» — pastaj ia preu dorën. Transmetuan njerëzit e Suneneve.">قال: «فهلَّا قبل أن تأتيني به» ثم قطعَ يدَه. رواه أهل السنن.</span></p>

<p><span class="s" data-sq="Do me thënë ﷺ: Sikur ta kishe falur para se ta sillte, do kishte qenë; por pasi iu çua mua, nuk lejohet pezullimi i dënimit — as me falje, as ndërmjetësim, as dhurim, as ndryshe.">يعني ﷺ: أنك لو عفوتَ عنه قبل أن تأتيني به لكان، فأما بعد أن رُفِع إليَّ فلا يجوز تعطيل الحدِّ لا بعفوٍ ولا بشفاعةٍ ولا بهبةٍ ولا غير ذلك.</span></p>

<p><span class="s" data-sq="Prandaj u pajtuan dijetarët se grabitësi e hajduti kur u çohen qeveritarit e pastaj pendohen, nuk bie dënimi, por obligohet zbatimi edhe nëse pendohen. E nëse janë të sinqertë, dënimi u bëhet shlyerje, e lejimi i tyre është nga plotësimi i pendimit, si kthimi i hakëve pronarëve."><span class="w" data-sq="U pajtuan dijetarët se grabitësi e hajduti kur u çohen qeveritarit e pendohen, nuk bie dënimi, por obligohet zbatimi.">ولهذا اتفق العلماء ـ فيما أعلم ـ على أن قاطعَ الطريق واللص ونحوهما إذا رُفِعوا إلى ولي الأمر ثم تابوا بعد ذلك لم يسقط الحد عنهم، بل تجب إقامته وإن تابوا.</span> <span class="w" data-sq="Nëse janë të sinqertë, dënimi u bëhet shlyerje; lejimi i tyre nga plotësimi i pendimit, si kthimi i hakëve pronarëve.">فإن كانوا صادقين في التوبة كان الحدُّ كفارةً لهم، وكان تمكينُهم من ذلك من تمام التوبة، بمنزلة رد الحقوق إلى أهلها، والتمكين من استيفاء القصاص في حقوق الآدميين.</span></span></p>

<p><span class="s" data-sq="Dhe rrënja e kësaj në fjalën e Allahut:">وأصل هذا في قول الله سبحانه وتعالى:</span> <span class="s quran" data-sq="Kush ndërmjetëson për punë të mirë, ai ka hise në të, e kush ndërmjetëson për punë të keqe ai ka pjesë në barrën e saj, e All-llahu ka fuqi për çdo send. [En-Nisa: 85]">﴿مَّن يَشْفَعْ شَفَاعَةً حَسَنَةً يَكُن لَّهُ نَصِيبٌ مِّنْهَا وَمَن يَشْفَعْ شَفَاعَةً سَيِّئَةً يَكُن لَّهُ كِفْلٌ مِّنْهَا وَكَانَ اللَّهُ عَلَىٰ كُلِّ شَيْءٍ مُّقِيتًا﴾ [النساء: ٨٥]،</span> <span class="s" data-sq="ngase ndërmjetësimi është: ndihma e kërkuesit derisa të bëhet çift pas teksa ishte">فإن الشفاعة هي: إعانة الطالب حتى يصير معه شفعًا بعد أن كان</span></p>`},
// ===== Faqja 87: Ndërmjetësimi i mirë/keq, El-Maide 33-34, pendimi pas pohimit (PDF fq. 89) =====
{html:`<p><span class="s" data-sq="tek, e nëse e ndihmon atë në mirësi e devotshmëri, ishte ndërmjetësim i mirë, e nëse e ndihmon në mëkat e armiqësi, ishte ndërmjetësim i keq."><span class="w" data-sq="tek (vetëm)">وترًا،</span> <span class="w" data-sq="nëse e ndihmon në mirësi e devotshmëri">فإن أعانَتْهُ على برٍّ وتقوى</span> <span class="w" data-sq="ishte ndërmjetësim i mirë">كانت شفاعةً حسنة،</span> <span class="w" data-sq="e nëse e ndihmon në mëkat e armiqësi">وإن أعانَتْهُ على إثمٍ وعدوان</span> <span class="w" data-sq="ishte ndërmjetësim i keq">كانت شفاعةً سيئة.</span></span> <span class="s" data-sq="Mirësia është: ajo çfarë je urdhëruar, e mëkati: ajo çfarë je ndaluar, e nëse kanë qenë gënjeshtarë, Allahu nuk e udhëzon dredhën e tradhtarëve."><span class="w" data-sq="mirësia">والبرُّ:</span> <span class="w" data-sq="ajo çfarë je urdhëruar">ما أُمرت به،</span> <span class="w" data-sq="mëkati">والإثمُ:</span> <span class="w" data-sq="ajo çfarë je ndaluar">ما نُهِيتَ عنه،</span> <span class="w" data-sq="nëse kanë qenë gënjeshtarë">وإن كانوا كاذبين</span> <span class="w" data-sq="Allahu nuk e udhëzon dredhën e tradhtarëve">فإن الله لا يهدي كيد الخائنين.</span></span></p>

<p><span class="s" data-sq="Dhe Allahu i Lartësuar ka thënë:">وقد قال الله تعالى:</span> <span class="s quran" data-sq="S'ka dyshim se dënimi i atyre që luftojnë kundër All-llahut dhe të dërguarit të Tij dhe bëjnë shkatërrime në tokë, është: të mbyten, ose të gozhdohen, ose t'u priten duart dhe këmbët tërthorazi, ose të dëbohen nga vendi. Kjo është poshtërim për ta në këtë botë, kurse në botën tjetër ata kanë dënim shumë të madh. Përveç atyre që pendohen para se t'i zini, e ta dini se All-llahu falë, mëshiron. [El-Maide: 33-34]">﴿إِنَّمَا جَزَاءُ الَّذِينَ يُحَارِبُونَ اللَّهَ وَرَسُولَهُ وَيَسْعَوْنَ فِي الْأَرْضِ فَسَادًا أَن يُقَتَّلُوا أَوْ يُصَلَّبُوا أَوْ تُقَطَّعَ أَيْدِيهِمْ وَأَرْجُلُهُم مِّنْ خِلَافٍ أَوْ يُنفَوْا مِنَ الْأَرْضِ ذَٰلِكَ لَهُمْ خِزْيٌ فِي الدُّنْيَا وَلَهُمْ فِي الْآخِرَةِ عَذَابٌ عَظِيمٌ ۞ إِلَّا الَّذِينَ تَابُوا مِن قَبْلِ أَن تَقْدِرُوا عَلَيْهِمْ فَاعْلَمُوا أَنَّ اللَّهَ غَفُورٌ رَّحِيمٌ﴾ [المائدة: ٣٣-٣٤]،</span> <span class="s" data-sq="pra i përjashtoi penduesit vetëm para zënies së tyre, ndërsa penduesi pas zënies mbetet ndër ata që u obligohet dënimi; për arsye të përgjithësimit, kuptimit dhe arsyetimit."><span class="w" data-sq="i përjashtoi penduesit vetëm para zënies">فاستثنى التائبين قبل القدرة عليهم فقط،</span> <span class="w" data-sq="penduesi pas zënies mbetet ndër ata me dënim obligativ">فالتائب بعد القدرة عليه باقٍ فيمن وجب عليه الحدُّ؛</span> <span class="w" data-sq="për arsye të përgjithësimit, kuptimit dhe arsyetimit">للعموم والمفهوم والتعليل.</span></span></p>

<p><span class="s" data-sq="Kjo kur është vërtetuar me dëshmi. E nëse ka qenë me pohim, dhe ka ardhur duke e pohuar mëkatin i penduar, për këtë ka mospajtim të përmendur në vend tjetër."><span class="w" data-sq="kjo kur vërtetohet me dëshmi">هذا إذا كان قد ثبت بالبينة،</span> <span class="w" data-sq="nëse ka qenë me pohim">فأما إذا كان بإقرار،</span> <span class="w" data-sq="ka ardhur duke pohuar mëkatin i penduar">وجاء مقرًّا بالذنب تائبًا،</span> <span class="w" data-sq="për këtë ka mospajtim gjetiu">فهذا فيه نزاع مذكور في غير هذا الموضع،</span></span> <span class="s" data-sq="dhe e dukshme e medhhebit të Ahmedit: se nuk obligohet zbatimi i dënimit në rastin e tillë, por nëse e kërkon zbatimin, zbatohet, e nëse largohet nuk i zbatohet dënimi."><span class="w" data-sq="e dukshme e medhhebit të Ahmedit">وظاهر مذهب أحمد:</span> <span class="w" data-sq="se nuk obligohet dënimi në rastin e tillë">أنه لا تجب إقامة الحد في مثل هذه الصورة،</span> <span class="w" data-sq="por nëse e kërkon, zbatohet">بل إن طَلَبَ إقامة الحد عليه أقيم،</span> <span class="w" data-sq="e nëse largohet, nuk i zbatohet">وإن ذهب لم يُقِم عليه حدٌّ،</span></span> <span class="s" data-sq="dhe mbi këtë u kuptua hadithi i Maiz ibn Malikut kur tha:">وعلى هذا حُمِل حديث ماعز بن مالك لما قال:</span> <span class="s hadith" data-sq="«Pse nuk e latë?»">«فهلَّا تركتموه»،</span></p>`},
// ===== Faqja 88: Hadithet e dënimeve, furnizimi e fitorja (PDF fq. 90) =====
{html:`<p><span class="s" data-sq="dhe hadithi i atij që tha:">وحديث الذي قال:</span> <span class="s hadith" data-sq="«Kam bërë mëkat të dënueshëm, prandaj ma zbato mua»">«أصبتُ حدًّا فأقِمْه عليَّ»</span><span class="s" data-sq=", bashkë me transmetime të tjera.">، مع آثار أخر.</span></p>

<p><span class="s" data-sq="Dhe në «Sunen Ebi Davudit» dhe Nesaiut, nga Abdullah ibn Amri, Allahu qoftë i kënaqur me ta, se i Dërguari i Allahut ﷺ ka thënë:">وفي «سنن أبي داود» والنسائي عن عبد الله بن عمرو رضي الله عنهما أن رسول الله ﷺ قال:</span> <span class="s hadith" data-sq="«Dënimet zgjidhini ndërmjet jush, e çdo dënim që arrin tek unë, ai tashmë është bërë i detyrueshëm»">«تعاقَوا الحدودَ فيما بينكم، فما بلغني مِن حدٍّ فقد وجب»</span></p>

<p><span class="s" data-sq="Dhe në «Sunen en-Nesai» dhe Ibn Maxhe, nga Ebu Hurejra, Allahu qoftë i kënaqur me të, nga Pejgamberi ﷺ ka thënë:">وفي «سنن النسائي» وابن ماجه عن أبي هريرة رضي الله عنه عن النبي ﷺ قال:</span> <span class="s hadith" data-sq="«Një dënim që zbatohet në tokë është më i mirë për banorët e tokës sesa t'u binte shi dyzet mëngjes»">«حدٌّ يُعْمَل به في الأرض خير لأهل الأرض من أن يُمْطَروا أربعين صباحًا»</span></p>

<p><span class="s" data-sq="Dhe kjo ngase mëkatet janë shkak për pakësimin e furnizimit dhe frikën nga armiku, siç tregon Libri dhe Suneti, e kur zbatohen dënimet, shfaqet bindja ndaj Allahut dhe pakësohet mëkati, e kështu arrihet furnizimi dhe fitorja."><span class="w" data-sq="kjo ngase mëkatet janë shkak">وهذا لأن المعاصي سبب</span> <span class="w" data-sq="për pakësimin e furnizimit">لنقص الرزق</span> <span class="w" data-sq="dhe frikën nga armiku">والخوف من العدو،</span> <span class="w" data-sq="siç tregon Libri dhe Suneti">كما يدل عليه الكتاب والسنة،</span> <span class="w" data-sq="kur zbatohen dënimet">فإذا أقيمت الحدود،</span> <span class="w" data-sq="shfaqet bindja ndaj Allahut">ظهرت طاعة الله</span> <span class="w" data-sq="pakësohet mëkati">ونقصت معصيته،</span> <span class="w" data-sq="arrihet furnizimi dhe fitorja">فحصل الرزق والنصر.</span></span></p>`},
// ===== Faqja 89: Ndalohet marrja e pasurisë për pezullim dënimi, El-Maide 63 e 42, ryshfeti (PDF fq. 91) =====
{html:`<p><span class="s" data-sq="Dhe nuk duhet të merret nga zinaqari, hajduti, grabitësi i rrugës e të ngjashmit pasuri me të cilën pezullohet dënimi, as për thesarin e shtetit as për tjetër, dhe kjo pasuri e marrë për pezullimin e dënimit është haram i ndyrë, e nëse e bën këtë qeveritari, ai ka bashkuar dy prishje të mëdha."><span class="w" data-sq="nuk duhet të merret">ولا ينبغي أن يؤخَذَ</span> <span class="w" data-sq="nga zinaqari, hajduti, grabitësi e të ngjashmit">من الزاني أو السارق أو قاطع الطريق ونحوهم</span> <span class="w" data-sq="pasuri me të cilën pezullohet dënimi">مالٌ يُعطَّل به الحدُّ،</span> <span class="w" data-sq="as për thesarin e shtetit as tjetër">لا لبيت المال ولا لغيره،</span> <span class="w" data-sq="kjo pasuri e marrë është haram i ndyrë">وهذا المال المأخوذ لتعطيل الحد سُحْتٌ خبيث،</span> <span class="w" data-sq="nëse e bën qeveritari, ka bashkuar dy prishje">وإذا فعل وليُّ الأمر ذلك فقد جمع فسادين عظيمين.</span></span></p>

<p><span class="s" data-sq="E para: pezullimi i dënimit, e dyta: ngrënia e haramit. Pra e la obligimin dhe e bëri të ndaluarën."><span class="w" data-sq="e para: pezullimi i dënimit">أحدهما: تعطيل الحد،</span> <span class="w" data-sq="e dyta: ngrënia e haramit">والثاني: أكل السحت.</span> <span class="w" data-sq="e la obligimin dhe bëri të ndaluarën">فتَرَكَ الواجبَ وفَعَلَ المحرَّم،</span></span> <span class="s" data-sq="Allahu i Lartësuar tha:">قال الله تعالى:</span> <span class="s quran" data-sq="Përse paria fetare dhe dijetarët e tyre nuk po i ndalojnë nga thënia e tyre mëkatare dhe ngrënia e haramit? Sa vepër e keqe është ajo që bëjnë! [El-Maide: 63]">﴿لَوْلَا يَنْهَاهُمُ الرَّبَّانِيُّونَ وَالْأَحْبَارُ عَن قَوْلِهِمُ الْإِثْمَ وَأَكْلِهِمُ السُّحْتَ لَبِئْسَ مَا كَانُوا يَصْنَعُونَ﴾ [المائدة: ٦٣]،</span> <span class="s" data-sq="dhe tha i Lartësuari për hebrenjtë:">وقال تعالى عن اليهود:</span> <span class="s quran" data-sq="Janë dëgjues të gënjeshtrës, ngrënës të haramit. [El-Maide: 42]">﴿سَمَّاعُونَ لِلْكَذِبِ أَكَّالُونَ لِلسُّحْتِ﴾ [المائدة: ٤٢]؛</span> <span class="s" data-sq="ngase ata e hanin haramin nga ryshfeti i quajtur: birtili, dhe quhet ndonjëherë: dhurata e tjetër, e kur ha qeveritari haramin, i duhet të dëgjojë gënjeshtrën nga dëshmia e rreme e tjetër."><span class="w" data-sq="ngase ata e hanin haramin nga ryshfeti">لأنهم كانوا يأكلون السحت من الرشوة</span> <span class="w" data-sq="i quajtur birtili">التي تسمى: البِرْطِيل،</span> <span class="w" data-sq="quhet ndonjëherë: dhurata">وتسمَّى أحيانًا: الهدية وغيرها،</span> <span class="w" data-sq="kur ha qeveritari haramin">ومتى أكل وليُّ الأمر السُّحْت</span> <span class="w" data-sq="i duhet të dëgjojë gënjeshtrën nga dëshmia e rreme">احتاج أن يسمع الكذب من الشهادة الزور وغيرها،</span></span> <span class="s" data-sq="dhe i Dërguari i Allahut ﷺ e mallkoi mitëdhënësin, mitëmarrësin dhe ndërmjetësuesin, që është ai i cili ecën mes tyre. E transmetuan autorët e Suneneve."><span class="w" data-sq="i Dërguari ﷺ mallkoi mitëdhënësin e mitëmarrësin">وقد لعن رسول الله ﷺ الراشي والمرتشي</span> <span class="w" data-sq="dhe ndërmjetësuesin që ecën mes tyre">والرائش، وهو الواسطة الذي يمشي بينهما.</span> <span class="w" data-sq="e transmetuan autorët e Suneneve">رواه أهل السنن.</span></span></p>

<p><span class="s" data-sq="Dhe në «dy Sahihët»: dy burra u paditën te Pejgamberi ﷺ, e tha njëri prej tyre:">وفي «الصحيحين»: أن رجلين اختصما إلى النبي ﷺ فقال أحدهما:</span></p>`},
// ===== Faqja 90: Hadithi i punëtorit zinaqar, ixhmai për ryshfet, prishja e pezullimit (PDF fq. 92) =====
{html:`<p><span class="s" data-sq="O i Dërguar i Allahut, gjyko mes nesh me Librin e Allahut. Tha shoku i tij — dhe ishte më i ditur se ai —: Po, o i Dërguar i Allahut, gjyko mes nesh me Librin e Allahut dhe më lejo mua."><span class="w" data-sq="o i Dërguar i Allahut, gjyko mes nesh me Librin e Allahut">يا رسول الله، اقض بيننا بكتاب الله،</span> <span class="w" data-sq="tha shoku i tij, ishte më i ditur se ai">فقال صاحبه ـ وكان أفقه منه ـ:</span> <span class="w" data-sq="po, o i Dërguar i Allahut, gjyko mes nesh dhe më lejo">نعم يا رسول الله، اقض بيننا بكتاب الله وائذنْ لي،</span></span> <span class="s" data-sq="tha:">فقال:</span> <span class="s hadith" data-sq="«Thuaj»">«قل»</span><span class="s" data-sq=", tha: Djali im ishte punëtor te familja e këtij — do me thënë shërbëtor — e bëri zina me gruan e tij, e unë e kompensova me njëqind dele e një shërbëtor, dhe pyeta disa dijetarë e ata më informuan se mbi djalin tim bie njëqind kamxhikë e largim një vit, e mbi gruan e këtij gurëzimi.">، فقال: إن ابني كان عسيفًا في أهل هذا ـ يعني أجيرًا ـ فزنى بامرأته، فافتديتُ منه بمئة شاة وخادم، وإني سألت رجالًا من أهل العلم فأخبروني أن على ابني جلد مئة وتغريب عام، وأنَّ على امرأة هذا الرجم.</span> <span class="s" data-sq="Tha:">فقال:</span> <span class="s hadith" data-sq="«Pasha Atë në dorën e të Cilit është shpirti im, do të gjykoj mes jush me Librin e Allahut: njëqind delet e shërbëtori t'i kthehen ty, e mbi djalin tënd njëqind kamxhikë e largim një vit, e shko o Unejs te gruaja e këtij, pyete, e nëse pohon gurëzoje»">«والذي نفسي بيده لأقضينَّ بينكما بكتاب الله: المئة والخادم ردٌّ عليك، وعلى ابنك جلد مئة وتغريب عام، واغْدُ يا أُنَيس على امرأة هذا فاسألها فإن اعترفت فارجمها»</span><span class="s" data-sq=", e ai e pyeti dhe ajo pohoi, e ai e gurëzoi.">، فسألها فاعترفت فرجمها.</span></p>

<p><span class="s" data-sq="Pra në këtë hadith, kur u dha për mëkatarin kjo pasuri për t'ia larguar dënimin, Pejgamberi ﷺ urdhëroi kthimin e pasurisë pronarit, dhe urdhëroi zbatimin e dënimit, e nuk e mori pasurinë për myslimanët; as nga luftëtarët as nga të varfrit e tjerët."><span class="w" data-sq="në këtë hadith, kur u dha pasuria për largimin e dënimit">ففي هذا الحديث أنه لما بذل عن المذنب هذا المال لدفع الحدِّ عنه،</span> <span class="w" data-sq="Pejgamberi ﷺ urdhëroi kthimin e pasurisë pronarit">أمر النبي ﷺ بدفع المال إلى صاحبه،</span> <span class="w" data-sq="dhe urdhëroi zbatimin e dënimit">وأمر بإقامة الحد،</span> <span class="w" data-sq="nuk e mori pasurinë për myslimanët">ولم يأخذ المال للمسلمين؛</span> <span class="w" data-sq="as nga luftëtarët, të varfrit e tjerët">من المجاهدين والفقراء وغيرهم.</span></span></p>

<p><span class="s" data-sq="Dhe myslimanët janë pajtuar se pezullimi i dënimit me pasuri apo tjetër nuk lejohet, dhe u pajtuan se pasuria e marrë nga zinaqari, hajduti, pijaneci e grabitësi i rrugës e të ngjashme, për pezullimin e dënimit, është pasuri e ndyrë e ndaluar."><span class="w" data-sq="myslimanët u pajtuan se pezullimi i dënimit me pasuri nuk lejohet">وقد أجمع المسلمون على أن تعطيل الحد بمالٍ يُؤخَذ أو غيره لا يجوز،</span> <span class="w" data-sq="u pajtuan se pasuria e marrë për pezullim dënimi është haram">وأجمعوا على أن المال المأخوذ من الزاني، والسارق، والشارب، والمحارب قاطع الطريق، ونحو ذلك، لتعطيل الحدِّ= مالٌ سُحْتٍ خبيث.</span></span></p>

<p><span class="s" data-sq="Dhe shumë nga prishja e punëve të njerëzve nuk është veçse për pezullimin e dënimit ose pasojat e tij, dhe kjo është nga shkaqet më të mëdha të prishjes së banorëve të shkretëtirave, fshatrave e qyteteve, nga beduinët, turkmanët, kurdët e bujqit, e ndjekësit e epsheve si Kajsi e Jemeni, e banorët e qyteteve; nga kryetarët, pasanikët e varfanjakët, udhëheqësit, prijësit e ushtarët e tyre. Dhe ai është shkak i rënies së respektit të qeveritarit, dhe rënies së vlerës së tij nga"><span class="w" data-sq="shumë nga prishja e punëve të njerëzve">وكثير مما يوجد من فساد أمور الناس،</span> <span class="w" data-sq="nuk është veçse për pezullimin e dënimit">إنما هو لتعطيل الحد أو جاءه،</span> <span class="w" data-sq="kjo nga shkaqet më të mëdha të prishjes">وهذا من أكبر الأسباب في فساد</span> <span class="w" data-sq="banorëve të shkretëtirave, fshatrave e qyteteve">أهل البوادي والقرى والأمصار،</span> <span class="w" data-sq="nga beduinët, turkmanët, kurdët e bujqit">من الأعراب والتُّرْكُمان والأكراد والفلاحين،</span> <span class="w" data-sq="e ndjekësit e epsheve si Kajsi e Jemeni">وأهل الأهواء، كقيس ويَمَن،</span> <span class="w" data-sq="e banorët e qyteteve; kryetarët, pasanikët e varfanjakët">وأهل الحاضرة؛ من رؤساء الناس وأغنيائهم وفقرائهم،</span> <span class="w" data-sq="udhëheqësit, prijësit e ushtarët e tyre">وأمراء الناس ومُقَدَّميهم وجندهم.</span> <span class="w" data-sq="shkak i rënies së respektit e vlerës së qeveritarit">وهو سبب سقوط حُرمة المتولِّي، وسقوط قَدره من</span></span></p>`},
// ===== Faqja 91: Birtili, ryshfeti i qeveritarit, pijanecët (PDF fq. 93) =====
{html:`<p><span class="s" data-sq="zemrave, dhe shpërbërjes së autoritetit të tij, e kur merr ryshfet e birtil për pezullimin e dënimit, i dobësohet vetja për të zbatuar dënim tjetër, e bëhet nga lloji i hebrejve të mallkuar."><span class="w" data-sq="zemrave dhe shpërbërjes së autoritetit">القلوب، وانحلال أمره،</span> <span class="w" data-sq="kur merr ryshfet e birtil për pezullim dënimi">فإذا ارتشى وتبَرْطل على تعطيل حدٍّ</span> <span class="w" data-sq="i dobësohet vetja për dënim tjetër">ضَعُفَت نفسُه أن يقيم حدًّا آخر،</span> <span class="w" data-sq="bëhet nga lloji i hebrejve të mallkuar">وصار من جنس اليهود الملعونين.</span></span></p>

<p><span class="s" data-sq="Rrënja e birtil-it është: guri i gjatë drejtkëndësh, u emërua ryshfeti me të ngase i mbyll gojën mitëmarrësit nga e vërteta, siç ia mbyll guri i gjatë. Siç ka ardhur në transmetim: Kur hyn ryshfeti nga dera, del amaneti nga dritarja. Do me thënë: hapësira."><span class="w" data-sq="rrënja e birtil-it: guri i gjatë drejtkëndësh">وأصلُ البِرْطيل هو: الحَجَر المستطيل،</span> <span class="w" data-sq="u emërua ryshfeti me të ngase ia mbyll gojën">سُمِّيت به الرشوة لأنها تلقم المرتشي عن التكلُّم بالحق،</span> <span class="w" data-sq="siç ia mbyll guri i gjatë">كما يلقمه الحجر الطويل.</span> <span class="w" data-sq="siç ka ardhur: kur hyn ryshfeti nga dera, del amaneti nga dritarja">كما قد جاء في الأثر: إذا دخلت الرشوة من الباب خرجت الأمانة من الكُوَّة.</span> <span class="w" data-sq="do me thënë: hapësira">يعني: الطاقة.</span></span></p>

<p><span class="s" data-sq="Po ashtu kur merr pasuri për shtetin mbi këtë, si ky haram i quajtur: ndëshkimet, a nuk e sheh se beduinët prishës kur marrin pasuri disa njerëzve, pastaj shkojnë te qeveritari e i sjellin kuaj ia ofrojnë, ose tjetër= si forcohet lakmia e tyre në prishje, thyhet respekti i qeverisjes e sundimit, e prishet populli!"><span class="w" data-sq="po ashtu kur merr pasuri për shtetin">وكذلك إذا أخذ مالًا للدولة على ذلك،</span> <span class="w" data-sq="si ky haram i quajtur: ndëshkimet">مثل هذا السُّحْت الذي يسمى: التأديبات،</span> <span class="w" data-sq="a nuk e sheh se beduinët prishës kur marrin pasuri">ألا ترى أن الأعراب المفسدين إذا أخذوا مالًا لبعض الناس،</span> <span class="w" data-sq="pastaj shkojnë te qeveritari e sjellin kuaj">ثم جاءوا إلى ولي الأمر، فقادوا إليه خيلًا فيقدمونها له، أو غيرها=</span> <span class="w" data-sq="si forcohet lakmia, thyhet respekti, prishet populli">كيف يقوى طمعُهم في الفساد، وتنكسر حُرْمة الولاية والسلطنة، وتفسد الرعية!</span></span></p>

<p><span class="s" data-sq="Po ashtu bujqit e të tjerët, po ashtu pijaneci kur zihet e jep ca pasuri, si shpresojnë pijecësit se kur zihen do të shpëtojnë me ca pasuri, e i merr ai qeveritar haram pa bereqet, e prishja mbetet."><span class="w" data-sq="po ashtu bujqit e tjerët">وكذلك الفلاحون وغيرهم،</span> <span class="w" data-sq="po ashtu pijaneci kur zihet e jep pasuri">وكذلك شارب الخمر إذا أُخِذ فدفعَ بعض ماله،</span> <span class="w" data-sq="si shpresojnë pijecësit se kur zihen do shpëtojnë">كيف يطمع الخمَّارون فيرجون إذا أُمْسِكوا أن يفتدوا ببعض أموالهم،</span> <span class="w" data-sq="i merr qeveritari haram pa bereqet, prishja mbetet">فيأخذها ذلك الوالي سحتًا لا يُبارك فيها، والفساد قائم.</span></span></p>`},
// ===== Faqja 92: Mbrojtja e kriminelëve, hadithi i strehimit, ixhmai (PDF fq. 94) =====
{html:`<p><span class="s" data-sq="Po ashtu njerëzit me pozitë kur mbrojnë dikë nga dënimi, si kur ndonjë bujk bën krim, pastaj strehohet në fshatin e zëvendësit të sulltanit ose emirit, e mbrohet kundër Allahut e të Dërguarit, e ai që e mbroi bëhet nga ata që i mallkoi Allahu e i Dërguari."><span class="w" data-sq="njerëzit me pozitë kur mbrojnë dikë nga dënimi">وكذلك ذوو الجاه إذا حموا أحدًا أن يُقام عليه الحد،</span> <span class="w" data-sq="si kur bujku bën krim e strehohet te zëvendësi i sulltanit">مثل أن يرتكب بعض الفلاحين جريمة، ثم يأوي إلى قرية نائب السلطان، أو أمير</span> <span class="w" data-sq="e mbrohet kundër Allahut e të Dërguarit">فيحتمي على الله ورسوله،</span> <span class="w" data-sq="ai që e mbroi bëhet nga të mallkuarit">فيكون ذلك الذي حماه ممن لعنه الله ورسوله،</span></span> <span class="s" data-sq="ka transmetuar Muslimi në «Sahihun» e tij nga Ali ibn Ebi Talibi, Allahu qoftë i kënaqur me të, se i Dërguari i Allahut ﷺ ka thënë:">فقد روى مسلم في «صحيحه» عن علي بن أبي طالب رضي الله عنه قال: قال رسول الله ﷺ:</span> <span class="s hadith" data-sq="«Allahu e mallkoftë atë që shpik (mëkat), ose strehon shpikësin»">«لعن الله من أحدث حدثًا، أو آوى محدِثًا».</span> <span class="s" data-sq="Pra çdokush që strehon shpikës nga këta mëkatarët, e ka mallkuar Allahu dhe i Dërguari i Tij.">فكل من آوى محدِثًا من هؤلاء المُحْدِثين فقد لعنه الله ورسوله.</span></p>

<p><span class="s" data-sq="E kur Pejgamberi ﷺ ka thënë:">وإذا كان النبي ﷺ قد قال:</span> <span class="s hadith" data-sq="«Kush ndërmjetëson për të penguar ndonjë dënim nga dënimet e Allahut, ai e ka kundërshtuar Allahun në urdhrin e Tij»">«إن من حالت شفاعته دون حدٍّ من حدود الله فقد ضادَّ الله في أمره»</span> <span class="s" data-sq="e si është puna e atij që i pengon dënimet me fuqinë e dorën e tij, e merr nga kriminelët haram pasurie?! Sidomos dënimet mbi banorët e shkretëtirës, ngase nga prishja më e madhe e tyre: mbrojtja e dhunuesve me pozitë ose pasuri, njëlloj si pasuria e marrë për thesarin e shtetit ose për qeveritarin fshehtas ose haptas, krejt kjo është e ndaluar me ixhma të myslimanëve, e është si garantimi i pijecëve e alkoolit, ngase kush e mundëson këtë ose e ndihmon me pasuri që merr, ata janë të një lloji."><span class="w" data-sq="si është puna e atij që pengon dënimet me fuqi e dorë">فكيف بمن منع الحدود بقدرته ويده،</span> <span class="w" data-sq="e merr nga kriminelët haram pasurie">واعتاض من المجرمين بسُحْتٍ من المال يأخذه؟!</span> <span class="w" data-sq="sidomos dënimet mbi banorët e shkretëtirës">لاسيما الحدود على سكان البر،</span> <span class="w" data-sq="nga prishja më e madhe: mbrojtja e dhunuesve me pozitë ose pasuri">فإن من أعظم فسادهم: حماية المعتدين منهم بجاه أو مال،</span> <span class="w" data-sq="njëlloj pasuria për thesarin ose qeveritarin, fshehtas ose haptas">سواء كان المال المأخوذ لبيت المال أو للوالي سرًّا أو علانية،</span> <span class="w" data-sq="krejt e ndaluar me ixhma">فذلك جميعه محرم بإجماع المسلمين،</span> <span class="w" data-sq="si garantimi i pijecëve, kush e mundëson janë të një lloji">وهو مثل تضمين الحانات والخمر، فإنَّ من مكَّنَ من ذلك أو أعان أحدًا عليه بمال يأخذه فهم من جنس واحد.</span></span></p>

<p><span class="s" data-sq="Dhe pasuria e marrë mbi këtë i ngjason asaj që merret nga pagesa e lavires, dhe shpërblimi i">والمال المأخوذ على هذا شبيهٌ بما يُؤخذ من مهر البغيِّ، وحُلوان</span></p>`},
// ===== Faqja 93: Hadithi i çmimit haram, qeveritari si kryebanditi, gruaja e Lutit (PDF fq. 95) =====
{html:`<p><span class="s" data-sq="falltarit, çmimi i qenit, dhe paga e ndërmjetësuesit në haram i quajtur: kavvadi, ka thënë Pejgamberi ﷺ:">الكاهن، وثمن الكلب، وأجرة المتوسط في الحرام الذي يُسمَّى: القوَّاد، قال النبي ﷺ:</span> <span class="s hadith" data-sq="«Çmimi i qenit është i ndyrë, pagesa e lavires është e ndyrë, dhe shpërblimi i falltarit është i ndyrë»">«ثمن الكلب خبيث، ومهر البغيِّ خبيث، وحُلوان الكاهن خبيث»</span> <span class="s" data-sq="E transmetoi Buhariu.">رواه البخاري.</span></p>

<p><span class="s" data-sq="Pagesa e lavires quhet: xhudhur el-kihab, e në kuptimin e saj hyn ajo çfarë u jepet fëmijëve të skllevërve ose të lirëve për imoralitet me ta. Dhe shpërblimi i falltarit si shpërblimi i astrologut e të ngjashmit, mbi atë çfarë tregon nga lajmet sipas pretendimit të tij, e tjetër."><span class="w" data-sq="pagesa e lavires quhet: xhudhur el-kihab">فمَهْر البغيِّ هو الذي يسمَّى: جُذور القِحاب،</span> <span class="w" data-sq="në kuptimin e saj: ajo çfarë u jepet fëmijëve">وفي معناه ما يُعطاه المختَّون الصبيان من المماليك أو الأحرار على الفجور بهم.</span> <span class="w" data-sq="shpërblimi i falltarit si i astrologut">وحُلوان الكاهن مثل حلاوة المنجم ونحوه،</span> <span class="w" data-sq="mbi lajmet sipas pretendimit të tij">على ما يخبر به من الأخبار المبشرة بزعمه، ونحو ذلك.</span></span></p>

<p><span class="s" data-sq="Dhe qeveritari kur e lë mohimin e të këqijave e zbatimin e dënimeve me pasuri që merr= bëhet si kryetari i banditëve që ndan plaçkën me grabitësit, e si kavvadi që merr çfarë merr për të bashkuar dy veta në imoralitet. Dhe gjendja e tij i ngjason plakës së keqe gruas së Lutit që e tradhtoi, dhe i udhëzonte imoralët te mysafirët e tij."><span class="w" data-sq="qeveritari kur lë mohimin e të këqijave me pasuri">وولي الأمر إذا ترك إنكار المنكرات وإقامة الحدود عليها بمال يأخذه=</span> <span class="w" data-sq="si kryetari i banditëve që ndan plaçkën">كان بمنزلة مُقَدَّم الحراميَّة الذي يُقاسم المحاربين على الأخِيْذة،</span> <span class="w" data-sq="si kavvadi që bashkon dy veta në imoralitet">وبمنزلة القوَّاد الذي يأخذ ما يأخذه ليجمع بين اثنين على فاحشة.</span> <span class="w" data-sq="gjendja e tij si plaka e keqe gruaja e Lutit">وكانت حاله شبيهًا بحال عجوز السوء امرأة لوط التي خانته،</span> <span class="w" data-sq="i udhëzonte imoralët te mysafirët e tij">فكانت تدلُّ الفجارَ على ضيفه</span></span></p>

<p><span class="s" data-sq="për të cilën Allahu tha:">التي قال الله فيها:</span> <span class="s quran" data-sq="E Ne e shpëtuam atë dhe familjen e tij, përveç gruas së tij që mbeti prej atyre të shkatërruarve. [El-Earaf: 83]">﴿فَأَنجَيْنَاهُ وَأَهْلَهُ إِلَّا امْرَأَتَهُ كَانَتْ مِنَ الْغَابِرِينَ﴾ [الأعراف: ٨٣]،</span> <span class="s" data-sq="dhe tha i Bekuari e i Lartësuari:">وقال تبارك وتعالى:</span> <span class="s quran" data-sq="Ti ec natën me familjen tënde e asnjëri nga ju mos u ktheftë prapa, përveç gruas sate, sepse atë do ta godasë ajo që do t'i godasë ata. [Hud: 81]">﴿فَأَسْرِ بِأَهْلِكَ بِقِطْعٍ مِّنَ اللَّيْلِ وَلَا يَلْتَفِتْ مِنكُمْ أَحَدٌ إِلَّا امْرَأَتَكَ إِنَّهُ مُصِيبُهَا مَا أَصَابَهُمْ﴾ [هود: ٨١]،</span> <span class="s" data-sq="pra Allahu e ndëshkoi plakën e keqe kavvaden me atë çfarë ndëshkoi popullin e keq që bënin punë të ndyra, dhe kjo">فعذَّب الله عجوزَ السوء القوَّادة بمثل ما عذَّبَ القومَ السوء الذين كانوا يعملون الخبائث، وهذا</span></p>`},
// ===== Faqja 94: Amri bil-ma'ruf, ajete për urdhërimin në të mirë (PDF fq. 96) =====
{html:`<p><span class="s" data-sq="ngase kjo e tëra është marrje pasurie për ndihmë në mëkat e armiqësi, e qeveritari është vënë vetëm për të urdhëruar në të mirë e ndaluar nga e keqja, dhe ky është qëllimi i qeverisjes, e kur qeveritari e mundëson të keqen me pasuri që merr= ka bërë të kundërtën e qëllimit, si ai që e ve dikë të ndihmojë kundër armikut tënd, e ai ndihmon armikun kundër teje, e si ai që merr pasuri për të luftuar në rrugë të Allahut, e lufton me të myslimanët!!"><span class="w" data-sq="kjo e tëra marrje pasurie për ndihmë në mëkat e armiqësi">لأنَّ هذا جميعه أخذُ مالٍ للإعانة على الإثم والعدوان،</span> <span class="w" data-sq="qeveritari vënë për të urdhëruar në mirë e ndaluar keqen">وولي الأمر إنما نُصِبَ ليأمر بالمعروف وينهى عن المنكر،</span> <span class="w" data-sq="ky është qëllimi i qeverisjes">وهذا هو مقصود الولاية،</span> <span class="w" data-sq="kur mundëson keqen me pasuri, ka bërë të kundërtën">فإذا كان الوالي يُمَكِّن من المنكر بمالٍ يأخذه= كان قد أتى بضد المقصود،</span> <span class="w" data-sq="si ai që e ve dikë kundër armikut, e ai ndihmon armikun">مثل من نَصَبْتَه ليعينك على عدوِّك، فأعان عدوَّك عليك،</span> <span class="w" data-sq="si ai që merr pasuri për xhihad, e lufton myslimanët">وبمنزلة من أخذ مالًا ليجاهدَ به في سبيل الله تعالى، فقاتلَ به المسلمين!!</span></span></p>

<p><span class="s" data-sq="E sqaron këtë: se përmirësimi i vendit e njerëzve është me urdhërimin në të mirë e ndalimin nga e keqja, ngase përmirësimi i jetës e i ahiretit është në bindjen ndaj Allahut e të Dërguarit, e kjo nuk plotësohet veçse me urdhërimin në të mirë e ndalimin nga e keqja, e me të u bë ky umet umeti më i mirë i nxjerrë për njerëzit."><span class="w" data-sq="përmirësimi i vendit e njerëzve me urdhërimin në mirë">يوضح ذلك: أن صلاح البلاد والعباد بالأمر بالمعروف والنهي عن المنكر،</span> <span class="w" data-sq="përmirësimi i jetës e ahiretit në bindjen ndaj Allahut">فإن صلاح المعاش والمعاد في طاعة الله ورسوله،</span> <span class="w" data-sq="nuk plotësohet veçse me urdhërim në mirë e ndalim nga keqja">ولا يتم ذلك إلا بالأمر بالمعروف والنهي عن المنكر،</span> <span class="w" data-sq="me të u bë ky umet umeti më i mirë">وبه صارت هذه الأمة خير أُمَّة أُخرجت للناس،</span></span> <span class="s" data-sq="Allahu i Lartësuar tha:">قال الله تعالى:</span> <span class="s quran" data-sq="Ju jeni populli më i dobishëm, i ardhur për të mirën e njerëzve, të urdhëroni për të mirë, të ndaloni nga e keqja. [Ali Imran: 110]">﴿كُنتُمْ خَيْرَ أُمَّةٍ أُخْرِجَتْ لِلنَّاسِ تَأْمُرُونَ بِالْمَعْرُوفِ وَتَنْهَوْنَ عَنِ الْمُنكَرِ﴾ [آل عمران: ١١٠]،</span> <span class="s" data-sq="dhe tha i Lartësuari:">وقال تعالى:</span> <span class="s quran" data-sq="Nga ju le të jetë një grup që thërret në atë që është e dobishme, urdhëron për punë të mira dhe ndalon nga të këqijat. [Ali Imran: 104]">﴿وَلْتَكُن مِّنكُمْ أُمَّةٌ يَدْعُونَ إِلَى الْخَيْرِ وَيَأْمُرُونَ بِالْمَعْرُوفِ وَيَنْهَوْنَ عَنِ الْمُنكَرِ﴾ [آل عمران: ١٠٤]،</span></p>

<p><span class="s" data-sq="dhe tha i Lartësuari:">وقال تعالى:</span> <span class="s quran" data-sq="Besimtarët dhe besimtaret janë të dashur për njëri-tjetrin, urdhërojnë për të mirë, e ndalojnë nga e keqja. [Et-Teube: 71]">﴿وَالْمُؤْمِنُونَ وَالْمُؤْمِنَاتُ بَعْضُهُمْ أَوْلِيَاءُ بَعْضٍ يَأْمُرُونَ بِالْمَعْرُوفِ وَيَنْهَوْنَ عَنِ الْمُنكَرِ﴾ [التوبة: ٧١]،</span> <span class="s" data-sq="dhe tha Allahu i Lartësuar për beni israilët:">وقال الله تعالى عن بني إسرائيل:</span> <span class="s quran" data-sq="Ata nuk ndalonin njëri-tjetrin nga e keqja që bënin. Sa vepër e shëmtuar ishte ajo që bënin! [El-Maide: 79]">﴿كَانُوا لَا يَتَنَاهَوْنَ عَن مُّنكَرٍ فَعَلُوهُ لَبِئْسَ مَا كَانُوا يَفْعَلُونَ﴾ [المائدة: ٧٩]،</span></p>

<p><span class="s" data-sq="dhe tha i Lartësuari:">وقال تعالى:</span> <span class="s quran" data-sq="E kur ata harruan atë që u përkujtua, Ne i shpëtuam ata që pengonin prej të keqes, ndërsa ata që ishin zullumqarë i kapëm me një dënim të ashpër, ngase ishin të prishur. [El-Earaf: 165]">﴿فَلَمَّا نَسُوا مَا ذُكِّرُوا بِهِ أَنجَيْنَا الَّذِينَ يَنْهَوْنَ عَنِ السُّوءِ وَأَخَذْنَا الَّذِينَ ظَلَمُوا بِعَذَابٍ بَئِيسٍ بِمَا كَانُوا يَفْسُقُونَ﴾ [الأعراف: ١٦٥]،</span></p>

<p><span class="s" data-sq="Pra Allahu i Lartësuar na tregoi se kur zbriti dënimi, i shpëtoi ata që ndalonin nga mëkatet,">فأخبر الله تعالى أن العذابَ لما نزل نجَّى الذين ينهون عن السيئات،</span></p>`},
// ===== Faqja 95: Hadithi i Ebu Bekrit, mëkati i fshehtë/publik, amri bil-ma'ruf (PDF fq. 97) =====
{html:`<p><span class="s" data-sq="dhe i kapi zullumqarët me dënim të ashpër.">وأخَذَ الظالمين بالعذاب الشديد.</span></p>

<p><span class="s" data-sq="Dhe në hadithin e saktë: se Ebu Bekri es-Siddiku, Allahu qoftë i kënaqur me të, u foli njerëzve në minberin e të Dërguarit të Allahut ﷺ e tha: O njerëz, ju e lexoni këtë ajet dhe e vini në vend jo të duhur:">وفي الحديث الثابت: أنَّ أبا بكر الصديق رضي الله عنه خطبَ الناس على منبر رسول الله ﷺ فقال: أيها الناس، إنكم تقرؤون هذه الآية وتضعونها على غير موضعها:</span> <span class="s quran" data-sq="O ju që keni besuar, ruajeni veten tuaj! Kur jeni në rrugë të drejtë, nuk ju dëmton ai që ka humbur. [El-Maide: 105]">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا عَلَيْكُمْ أَنفُسَكُمْ لَا يَضُرُّكُم مَّن ضَلَّ إِذَا اهْتَدَيْتُمْ﴾ [المائدة: ١٠٥]</span> <span class="s" data-sq="e unë e kam dëgjuar të Dërguarin e Allahut ﷺ duke thënë:">وإني سمعت رسول الله ﷺ يقول:</span> <span class="s hadith" data-sq="«Njerëzit kur e shohin të keqen e nuk e ndryshojnë, gati Allahu t'i përfshijë me dënim prej Tij»">«إن الناس إذا رأوا المنكر فلم يغيروه أوشك أن يعُمَّهم الله بعقاب منه»</span></p>

<p><span class="s" data-sq="Dhe në hadith tjetër:">وفي حديث آخر:</span> <span class="s hadith" data-sq="«Mëkati kur fshihet nuk dëmton veçse bërësin e tij, por kur shfaqet e nuk mohohet, dëmton të gjithë»">«إن المعصية إذا خفيَتْ لم تضرَّ إلا صاحبَها، ولكن إذا ظهرَت فلم تُنكَر ضرَّت العامة»</span></p>

<p><span class="s" data-sq="Dhe ky kapitull që e përmendëm nga gjykimi në dënimet e Allahut dhe hakët e Tij, qëllimi më i madh i tij është: urdhërimi në të mirë dhe ndalimi nga e keqja. E urdhërimi në të mirë si:"><span class="w" data-sq="ky kapitull që përmendëm nga gjykimi në dënimet e hakët e Allahut">وهذا القسم الذي ذكرناه من الحكم في حدود الله وحقوقه</span> <span class="w" data-sq="qëllimi më i madh: urdhërimi në mirë e ndalimi nga keqja">مقصودُه الأكبر هو: الأمر بالمعروف والنهي عن المنكر.</span> <span class="w" data-sq="urdhërimi në të mirë si">فالأمر بالمعروف مثل:</span></span></p>`},
// ===== Faqja 96: Obligimet, ndëshkimi i lënësit të namazit (PDF fq. 98) =====
{html:`<p><span class="s" data-sq="namazi, zekati, agjërimi, haxhi, sadakaja, amaneti, mirësia ndaj prindërve, lidhja farefisnore, sjellja e mirë me familjen e fqinjët, e tjetër.">الصلاة، والزكاة، والصيام، والحج، والصدقة، والأمانة، وبر الوالدين، وصِلَّة الأرحام، وحُسْن العشرة مع الأهل والجيران، ونحو ذلك.</span></p>

<p><span class="s" data-sq="Obligim i qeveritarit është të urdhërojë namazet e detyruara çdo kë që mundt ta urdhërojë, e ta ndëshkojë lënësin me ixhma të myslimanëve."><span class="w" data-sq="obligim i qeveritarit të urdhërojë namazet e detyruara">فالواجب على ولي الأمر أن يأمر بالصلوات المكتوبات جميع من يقدر على أمره،</span> <span class="w" data-sq="ta ndëshkojë lënësin me ixhma">ويعاقب التارك بإجماع المسلمين.</span></span></p>

<p><span class="s" data-sq="E nëse lënësit janë grup i fuqishëm, luftohen për lënien e tij me ixhma, po ashtu luftohen për lënien e zekatit, agjërimit e tjetër, dhe për lejimin e harameve të dukshme mbi të cilat ka ixhma; si martesa me farefisnoren, prishja në tokë, e tjetër. Çdo grup i fuqishëm që refuzon zbatimin e ndonjë ligji nga ligjet e dukshme e të njohura të Islamit, obligohet luftimi i tij derisa feja t'i takojë e tëra Allahut, me pajtim të dijetarëve."><span class="w" data-sq="nëse lënësit janë grup i fuqishëm, luftohen me ixhma">فإن كان التاركون طائفةً ممتنعة قُوتِلوا بتركها بإجماع المسلمين،</span> <span class="w" data-sq="po ashtu luftohen për lënien e zekatit, agjërimit e tjetër">وكذلك يُقاتلون على ترك الزكاة، والصيام، وغيرهما،</span> <span class="w" data-sq="për lejimin e harameve mbi të cilat ka ixhma">وعلى استحلال ما كان من المحرمات الظاهرة المُجْمَع عليها؛</span> <span class="w" data-sq="si martesa me farefisnoren, prishja në tokë">كنكاح ذوات المحارم، والفساد في الأرض، ونحو ذلك.</span> <span class="w" data-sq="çdo grup i fuqishëm obligohet luftimi i tij">فكلُّ طائفةٍ ممتنعة عن التزام شريعة من شرائع الإسلام الظاهرة والمتواترة يجب جهادُها</span> <span class="w" data-sq="derisa feja t'i takojë e tëra Allahut, me pajtim dijetarëve">حتى يكون الدين كلُّه لله، باتفاق العلماء.</span></span></p>

<p><span class="s" data-sq="E nëse lënësi i namazit është një vetë, thuhet: ndëshkohet me rrahje e burg derisa të falet, e shumica e dijetarëve thonë se obligohet vrasja nëse refuzon namazin pasi t'i kërkohet pendim si murtedi, e nëse pendohet e falet mirë, e nëse jo vritet. A vritet si kafir apo mysliman fasik? Ka dy mendime. Shumica e selefëve: vritet si kafir, dhe krejt kjo me pranimin e obligueshmërisë; e nëse e mohon obligueshmërinë, ai është kafir me ixhma"><span class="w" data-sq="nëse lënësi është njëshi, thuhet ndëshkohet me rrahje e burg">وإن كان التارك للصلاة واحدًا، فقد قيل: إنه يُعاقَب بالضرب والحبس حتى يصلي،</span> <span class="w" data-sq="shumica thonë obligohet vrasja nëse refuzon pasi kërkohet pendim">وجمهور العلماء على أنه يجب قتلُه إذا امتنع من الصلاة بعد أن يُسْتتاب كما يُسْتتاب المرتد،</span> <span class="w" data-sq="nëse pendohet e falet mirë, e nëse jo vritet">فإن تاب وصلى وإلا قُتل.</span> <span class="w" data-sq="a vritet kafir apo mysliman fasik? dy mendime">وهل يقتل كافرًا، أو مسلمًا فاسقًا؟ فيه قولان.</span> <span class="w" data-sq="shumica e selefëve: vritet kafir">وأكثر السلف على أنه يُقتل كافرًا،</span> <span class="w" data-sq="krejt kjo me pranimin e obligueshmërisë; nëse e mohon, kafir me ixhma">وهذا كله مع الإقرار بوجوبها. أما إذا جحدَ وجوبَها فهو كافر بإجماع</span></span></p>`},
// ===== Faqja 97: Xhihadi obligim, hadithet e vlerës së tij (PDF fq. 99) =====
{html:`<p><span class="s" data-sq="myslimanëve, po ashtu kush mohon obligimet e përmendura e harametin mbi të cilat obligohet luftimi, ndëshkimi për lënien e obligimeve e bërjen e harameve është qëllimi i xhihadit në rrugë të Allahut, ai është obligim mbi umetin me pajtim, siç tregon Libri e Suneti, dhe është nga punët më të mira."><span class="w" data-sq="myslimanëve, po ashtu kush mohon obligimet e harametin">المسلمين، وكذلك من جحدَ سائرَ الواجبات المذكورة والمحرمات التي يجب القتالُ عليها،</span> <span class="w" data-sq="ndëshkimi për lënien e obligimeve është qëllimi i xhihadit">فالعقوبةُ على ترك الواجبات، وفِعْل المحرَّمات هو مقصود الجهاد في سبيل الله،</span> <span class="w" data-sq="obligim mbi umetin me pajtim, siç tregon Libri e Suneti">وهو واجبٌ على الأمة باتفاق، كما دلَّ عليه الكتاب والسنة،</span> <span class="w" data-sq="dhe është nga punët më të mira">وهو من أفضل الأعمال.</span></span></p>

<p><span class="s" data-sq="Tha një burrë: O i Dërguar i Allahut, më trego një punë që barazohet me xhihadin në rrugë të Allahut.">قال رجل: يا رسول الله، دلني على عمل يَعْدِل الجهاد في سبيل الله،</span> <span class="s" data-sq="Tha:">قال:</span> <span class="s hadith" data-sq="«Nuk mundesh — ose: nuk e përballon —»">«لا تستطيعه ـ أو: لا تطيقه ـ»</span><span class="s" data-sq=", tha: Më trego. Tha:">,  قال: أخبرني به، قال:</span> <span class="s hadith" data-sq="«A mundesh kur del luftëtari të agjërosh pa ndërprerë e të falësh pa ndaluar?»">«هل تستطيعُ إذا خرجَ المجاهدُ أن تصومَ لا تفطر وتقومَ لا تفتر؟»</span> <span class="s" data-sq="Tha: E kush e përballon këtë? Tha:">قال: ومن يستطيع ذلك؟ قال:</span> <span class="s hadith" data-sq="«Ai është ai që barazohet me xhihadin në rrugë të Allahut»">«فذلك الذي يَعْدِلُ الجهادَ في سبيل الله»</span></p>

<p><span class="s" data-sq="Dhe tha:">وقال:</span> <span class="s hadith" data-sq="«Në xhenet ka njëqind shkallë, nga shkalla në shkallë sa mes qiellit e tokës, i ka përgatitur Allahu për luftëtarët në rrugën e Tij»">«إن في الجنة لمئة درجة، من الدرجة إلى الدرجة كما بين السماء والأرض أعدَّها الله للمجاهدين في سبيله»</span> <span class="s" data-sq="Të dyja në «dy Sahihët».">كلاهما في «الصحيحين».</span></p>

<p><span class="s" data-sq="Dhe tha Pejgamberi ﷺ:">وقال النبي ﷺ:</span> <span class="s hadith" data-sq="«Kreu i çështjes është Islami, shtylla e tij namazi, dhe kulmi i tij xhihadi në rrugë të Allahut»">«رأس الأمر الإسلام، وعموده الصلاة، وذروة سنامه الجهاد في سبيل الله»</span></p>`},
// ===== Faqja 98: Ajete për xhihadin, kapitulli i grabitësve të rrugës (PDF fq. 100) =====
{html:`<p><span class="s" data-sq="Dhe tha i Lavdëruari e i Lartësuari:">وقال سبحانه وتعالى:</span> <span class="s quran" data-sq="Besimtarë të vërtetë janë vetëm ata që i besuan All-llahut, të dërguarit të Tij, e pastaj nuk dyshuan dhe me pasurinë e jetën e tyre luftuan në rrugën e All-llahut. Të tillët janë ata të sinqertit. [El-Huxhurat: 15]">﴿إِنَّمَا الْمُؤْمِنُونَ الَّذِينَ آمَنُوا بِاللَّهِ وَرَسُولِهِ ثُمَّ لَمْ يَرْتَابُوا وَجَاهَدُوا بِأَمْوَالِهِمْ وَأَنفُسِهِمْ فِي سَبِيلِ اللَّهِ أُولَٰئِكَ هُمُ الصَّادِقُونَ﴾ [الحجرات: ١٥]،</span> <span class="s" data-sq="dhe tha i Lavdëruari e i Lartësuari:">وقال سبحانه وتعالى:</span> <span class="s quran" data-sq="A e bëtë furnizimin e haxhinjve dhe mirëmbajtjen e xhamisë së shenjtë si besimin në All-llahun e ditën e fundit dhe luftimin në rrugën e All-llahut? Ata nuk janë të barabartë te All-llahu. All-llahu nuk e udhëzon popullin zullumqar. Ata që besuan, u shpërngulën dhe luftuan në rrugën e All-llahut me pasurinë dhe vetën e tyre, kanë shkallë më të lartë te All-llahu dhe ata janë fitimtarët. Zoti i tyre i gëzon me mëshirë nga Ai, me kënaqësi dhe me xhennete ku kanë begati të përhershme. Aty janë përgjithmonë. Vërtet All-llahu ka shpërblim të madh. [Et-Teube: 19-22]">﴿أَجَعَلْتُمْ سِقَايَةَ الْحَاجِّ وَعِمَارَةَ الْمَسْجِدِ الْحَرَامِ كَمَنْ آمَنَ بِاللَّهِ وَالْيَوْمِ الْآخِرِ وَجَاهَدَ فِي سَبِيلِ اللَّهِ لَا يَسْتَوُونَ عِندَ اللَّهِ وَاللَّهُ لَا يَهْدِي الْقَوْمَ الظَّالِمِينَ ۞ الَّذِينَ آمَنُوا وَهَاجَرُوا وَجَاهَدُوا فِي سَبِيلِ اللَّهِ بِأَمْوَالِهِمْ وَأَنفُسِهِمْ أَعْظَمُ دَرَجَةً عِندَ اللَّهِ وَأُولَٰئِكَ هُمُ الْفَائِزُونَ ۞ يُبَشِّرُهُمْ رَبُّهُم بِرَحْمَةٍ مِّنْهُ وَرِضْوَانٍ وَجَنَّاتٍ لَّهُمْ فِيهَا نَعِيمٌ مُّقِيمٌ ۞ خَالِدِينَ فِيهَا أَبَدًا إِنَّ اللَّهَ عِندَهُ أَجْرٌ عَظِيمٌ﴾ [التوبة: ١٩-٢٢].</span></p>

<h3 style="text-align:center;font-size:1.2em;margin:1.2em 0"><span class="s" data-sq="Kapitull">فصل</span></h3>

<p><span class="s" data-sq="Nga kjo është ndëshkimi i grabitësve — prerësve të rrugës, që u dalin njerëzve me armë në rrugë e tjetër për t'u grabitur pasurinë haptas; nga beduinët, ose"><span class="w" data-sq="nga kjo ndëshkimi i grabitësve — prerësve të rrugës">فمن ذلك عقوبة المحاربيين قُطَّاع الطريق،</span> <span class="w" data-sq="që u dalin njerëzve me armë në rrugë">الذين يعترضون الناس بالسلاح في الطرقات ونحوها</span> <span class="w" data-sq="për t'u grabitur pasurinë haptas; nga beduinët">ليغصبوهم المال مُجاهرةً؛ من الأعراب، أو</span></span></p>`},

{html:`<p><span class="s" data-sq="turkmenëve, ose kurdëve, ose fshatarëve, ose ushtarëve të prishur, ose kriminelëve të qytetit, ose të tjerëve. Allahu i Lartësuar tha për ta:"><span class="w" data-sq="turkmenëve, ose kurdëve">التركمان، أو الأكراد،</span> <span class="w" data-sq="ose fshatarëve">أو الفلاحين،</span> <span class="w" data-sq="ose ushtarëve të prishur">أو فَسَقة الجند،</span> <span class="w" data-sq="ose kriminelëve të qytetit">أو مَرَدة الحاضرة،</span> <span class="w" data-sq="ose të tjerëve. Allahu i Lartësuar tha për ta:">أو غيرهم، قال الله تعالىٰ فيهم:</span></span> <span class="s quran" data-sq="S'ka dyshim se dënimi i atyre që luftojnë kundër All-llahut dhe të dërguarit të Tij dhe që bëjnë shkatërrime në tokë, është: të mbyten, ose të gozhdohen, ose t'u priten duart dhe këmbët tërthor, ose të dëbohen nga vendi. Kjo për ta është poshtërim në Dynja, kurse në botën tjetër ata kanë dënim të madh. [El-Maide: 33]">﴿إِنَّمَا جَزَاؤُا۟ ٱلَّذِينَ يُحَارِبُونَ ٱللَّهَ وَرَسُولَهُۥ وَيَسْعَوْنَ فِى ٱلْأَرْضِ فَسَادًا أَن يُقَتَّلُوٓا۟ أَوْ يُصَلَّبُوٓا۟ أَوْ تُقَطَّعَ أَيْدِيهِم وَأَرْجُلُهُم مِّنْ خِلَـٰفٍ أَوْ يُنفَوْا۟ مِنَ ٱلْأَرْضِ ذَٰلِكَ لَهُمْ خِزْىٌ فِى ٱلدُّنْيَا وَلَهُمْ فِى ٱلْءَاخِرَةِ عَذَابٌ عَظِيمٌ﴾</span> <span class="s" data-sq="[El-Maide: 33].">[المائدة: ٣٣].</span></p>

<p><span class="s" data-sq="Imam Shafiu, Allahu qoftë i kënaqur me të, ka transmetuar në 'Musnedin' e tij nga Ibn Abbasi rreth prerësve të rrugës: Nëse kanë vrarë dhe kanë marrë pasurinë, vriten dhe kryqëzohen; nëse kanë vrarë e nuk kanë marrë pasuri, vriten e nuk kryqëzohen; nëse kanë marrë pasurinë e nuk kanë vrarë, u priten duart dhe këmbët tërthor; dhe nëse kanë frikësuar udhëtarët e nuk kanë marrë pasuri, dëbohen nga toka."><span class="w" data-sq="Imam Shafiu ka transmetuar">وقد رويٰ الشافعيُّ رَحِمَهُ اللَّهُ</span> <span class="w" data-sq="në 'Musnedin' e tij nga Ibn Abbasi">في «مسنده» عن ابن عباس</span> <span class="w" data-sq="rreth prerësve të rrugës:">رَضِيَ اللَّهُ عَنْهُ في قُطَّاع الطريق:</span> <span class="w" data-sq="nëse kanë vrarë dhe kanë marrë pasurinë, vriten dhe kryqëzohen">إذا قتلوا وأخذوا المال قُتِلوا وصُلِبوا،</span> <span class="w" data-sq="nëse kanë vrarë e nuk kanë marrë pasuri, vriten e nuk kryqëzohen">وإذا قتلوا ولم يُصْلَبوا،</span> <span class="w" data-sq="nëse kanë marrë pasurinë e nuk kanë vrarë, u priten duart dhe këmbët tërthor">ولم يأخذوا المال قُتِلوا ولم يُصْلَبوا، وإذا أخذوا المال ولم يَقتلوا قُطِعت</span> <span class="w" data-sq="duart dhe këmbët tërthor">أيديهم وأرجلهم من خلاف،</span> <span class="w" data-sq="dhe nëse kanë frikësuar udhëtarët e nuk kanë marrë pasuri, dëbohen nga toka">وإذا أخافوا السبيل ولم يأخذوا مالاً نُفُوا من الأرض.</span></span></p>

<p><span class="s" data-sq="Ky është mendimi i shumë dijetarëve si Shafiu dhe Ahmedi, dhe është i afërt me mendimin e Ebu Hanifes. Disa prej tyre mendojnë se imami ka të drejtë të bëjë ixhtihad rreth tyre, kështu vritet ai që sipas gjykimit të tij meriton vdekjen."><span class="w" data-sq="ky është mendimi i shumë dijetarëve">وهذا قول كثير من أهل العلم</span> <span class="w" data-sq="si Shafiu dhe Ahmedi">كالشافعي وأحمد،</span> <span class="w" data-sq="dhe është i afërt me mendimin e Ebu Hanifes">وهو قريب من قول أبي حنيفة.</span> <span class="w" data-sq="disa prej tyre mendojnë se imami ka të drejtë të bëjë ixhtihad">ومنهم من يسوِّغ للإمام أن يجتهد فيهم،</span> <span class="w" data-sq="kështu vritet ai që sipas gjykimit të tij meriton vdekjen">فيَقْتُل من رأيٰ قتله</span></span></p>

<p><span class="s" data-sq="si çështje e interesit publik, edhe nëse nuk ka vrarë — si p.sh. kur ai është kryetar i bindur mes tyre — dhe i pret gjymtyrët atij që sipas gjykimit të tij meriton prerje, edhe nëse nuk ka marrë pasuri — si p.sh. kur ai është i fortë e me ndikim — në marrjen e pasurisë."><span class="w" data-sq="si çështje e interesit publik, edhe nëse nuk ka vrarë">مصلحةً منهم وإن كان لم يَقْتل،</span> <span class="w" data-sq="si p.sh. kur ai është kryetar i bindur mes tyre">مثل أن يكون رئيسًا مُطاعًا فيهم،</span> <span class="w" data-sq="dhe i pret gjymtyrët atij që sipas gjykimit të tij meriton prerje">ويَقطَع من رأيٰ قطعَه مصلحةً</span> <span class="w" data-sq="edhe nëse nuk ka marrë pasurinë">وإن كان لم يأخذ المال،</span> <span class="w" data-sq="si p.sh. kur ai është i fortë e me ndikim, në marrjen e pasurisë">مثل أن يكون ذا جَلَدٍ وقوةٍ في أخذ المال.</span></span></p>

<p><span class="s" data-sq="Ndërkohë disa prej tyre mendojnë se kur kanë marrë pasurinë, vriten, u priten gjymtyrët dhe kryqëzohen; mendimi i parë (është më i saktë)."><span class="w" data-sq="disa prej tyre mendojnë se kur kanë marrë pasurinë">كما أن منهم من يريٰ أنه إذا أخذوا المال</span> <span class="w" data-sq="vriten, u priten gjymtyrët dhe kryqëzohen">قُتِلوا وقُطِعوا وصُلِبوا،</span> <span class="w" data-sq="mendimi i parë (është më i saktë)">والأول</span></span></p>`},

{html:`<p><span class="s" data-sq="është mendimi i shumicës: kush prej grabitësve ka vrarë, imami e vret si ndëshkim fiks (hadd), nuk lejohet falja e tij me konsensus të dijetarëve, siç e ka përmendur Ibn Mundhiri. Çështja e tij nuk i lihet trashëgimtarëve të të vrarit,"><span class="w" data-sq="është mendimi i shumicës">قول الأكثر،</span> <span class="w" data-sq="kush prej grabitësve ka vrarë">فمن كان من المحاربين قد قتل</span> <span class="w" data-sq="imami e vret si ndëshkim fiks (hadd)">فإنه يقتله الإمامُ حدًّا،</span> <span class="w" data-sq="nuk lejohet falja e tij me konsensus të dijetarëve">لا يجوز العفو عنه بحالٍ بإجماع العلماء،</span> <span class="w" data-sq="siç e ka përmendur Ibn Mundhiri">ذكره ابن المنذر.</span> <span class="w" data-sq="çështja e tij nuk i lihet trashëgimtarëve të të vrarit">ولا يكون أمره إلىٰ ورثة المقتول،</span></span></p>

<p><span class="s" data-sq="ndryshe nga rasti kur dikush vret tjetrin për armiqësi personale ose hakmarrje, ose diçka të ngjashme nga shkaqe private — në atë rast gjaku i takon kujdestarëve të të vrarit: nëse duan e vrasin, nëse duan falin, dhe nëse duan marrin dijen (kompensimin e gjakut); sepse ai e vrau për qëllim të veçantë."><span class="w" data-sq="ndryshe nga rasti kur dikush vret tjetrin për armiqësi">بخلاف ما لو قتل رجلٌ رجلًا لعداوة بينهما</span> <span class="w" data-sq="ose hakmarrje">أو خصومة،</span> <span class="w" data-sq="ose diçka të ngjashme nga shkaqe private">أو نحو ذلك من الأسباب الخاصة،</span> <span class="w" data-sq="në atë rast gjaku i takon kujdestarëve të të vrarit">فإنَّ هذا دمه لأولياء المقتول</span> <span class="w" data-sq="nëse duan e vrasin">إن أحبوا قتلوا،</span> <span class="w" data-sq="nëse duan falin">وإن أحبوا عَفَوا عنه،</span> <span class="w" data-sq="dhe nëse duan marrin dijen (kompensimin e gjakut)">وإن أحبوا أخذوا الدية؛</span> <span class="w" data-sq="sepse ai e vrau për qëllim të veçantë">لأنه قتله لغرض خاص.</span></span></p>

<p><span class="s" data-sq="Kurse grabitësit (muharibin) vrasin për të marrë pasurinë e njerëzve, kështu dëmi i tyre është i përgjithshëm, në rangun e hajdutëve; andaj vrasja e tyre është ndëshkim fiks (hadd) i Allahut, dhe kjo është e pranuar mes fukahave."><span class="w" data-sq="kurse grabitësit vrasin për të marrë pasurinë e njerëzve">وأما المحاربون فإنما يقتلون لأخذ أموال الناس،</span> <span class="w" data-sq="dëmi i tyre është i përgjithshëm, në rangun e hajdutëve">فضررهم عامٌّ بمنزلة السُّرَّاق؛</span> <span class="w" data-sq="andaj vrasja e tyre është ndëshkim fiks (hadd) i Allahut, kjo është e pranuar mes fukahave">فكان قتلهم حدًّا لله، وهذا متفق عليه بين الفقهاء.</span></span></p>

<p><span class="s" data-sq="Edhe nëse i vrari nuk është i barabartë me vrasësin — si p.sh. kur vrasësi është i lirë e i vrari rob, ose vrasësi musliman e i vrari dhimmi (jomusliman nën besëlidhje) — a vritet në hirabe (grabitje rrugore)? Fukahave u kanë ndryshuar mendimet rreth kësaj."><span class="w" data-sq="edhe nëse i vrari nuk është i barabartë me vrasësin">حتىٰ لو كان المقتول غير مكافئ للقاتل؛</span> <span class="w" data-sq="si p.sh. vrasësi i lirë e i vrari rob, ose vrasësi musliman e i vrari dhimmi">مثل أن يكون القاتل حرًّا والمقتول عبدًا، أو القاتل مسلمًا والمقتول ذميًّا أو مستأمنًا،</span> <span class="w" data-sq="a vritet në hirabe? fukahave u kanë ndryshuar mendimet">القاتل، فقد اختلف الفقهاء هل يُقتل في المحاربة؟</span> <span class="w" data-sq="mendimi më i fuqishëm është se ai vritet">والأقويٰ أنه يقتل،</span></span></p>

<p><span class="s" data-sq="si mendimi i Malikut dhe Ahmedit në njërën prej dy transmetimeve të tij, dhe Shafiut në njërin mendim; sepse ai vritet si ndëshkim fiks (hadd) për çrregullimin e përgjithshëm, ashtu si i priten gjymtyrët kur merr pasuritë e tyre, dhe burgosen sipas të drejtave të tyre."><span class="w" data-sq="si mendimi i Malikut dhe Ahmedit në njërën transmetim, dhe Shafiut në njërin mendim">كقول مالك وأحمد في إحديٰ روايتيه والشافعي في قول له؛</span> <span class="w" data-sq="sepse ai vritet si ndëshkim fiks (hadd) për çrregullimin e përgjithshëm">لأنه يُقتل للفساد العام حدًّا،</span> <span class="w" data-sq="ashtu si i priten gjymtyrët kur merr pasuritë e tyre">كما يُقطع إذا أخذ أموالهم،</span> <span class="w" data-sq="dhe burgosen sipas të drejtave të tyre">وكما يُحبس بحقوقهم.</span></span></p>`},

{html:`<p><span class="s" data-sq="Kur grabitësit (haramijë) janë grup, njëri prej tyre e kreu vrasjen drejtpërdrejt, ndërsa të tjerët janë ndihmës dhe mbështetës të tij, është thënë: vritet vetëm ai që e kreu drejtpërdrejt, por shumica janë të mendimit se vriten të gjithë edhe sikur të ishin njëqind, dhe se mbështetësi e kryerësi janë të barabartë."><span class="w" data-sq="kur grabitësit janë grup">وإذا كان المحاربون الحرامية جماعةً</span> <span class="w" data-sq="njëri prej tyre e kreu vrasjen drejtpërdrejt">فالواحدُ منهم باشر القتلَ</span> <span class="w" data-sq="ndërsa të tjerët janë ndihmës dhe mbështetës">بنفسه والباقون أعوانٌ له ورِدْءٌ له،</span> <span class="w" data-sq="është thënë: vritet vetëm kryerësi">فقد قيل: إنه يُقتل المباشرُ فقط،</span> <span class="w" data-sq="por shumica mendojnë se vriten të gjithë edhe sikur të ishin njëqind">والجمهور عليٰ أن الجميع يقتلون ولو كانوا مئة،</span> <span class="w" data-sq="dhe se mbështetësi e kryerësi janë të barabartë">وأن الرِّدء والمباشر سواء،</span></span></p>

<p><span class="s" data-sq="dhe kjo është transmetuar nga Hulefai Rashidinët (Kalifët e Drejtëudhëzuar). Umeri, Allahu qoftë i kënaqur me të, vrau rojën e grabitësve. Roja (rebija) është vëzhguesi që ulet në vend të lartë dhe shikon për grabitësit se kush po vjen; sepse kryerësi u mundësua ta vrasë vetëm me fuqinë e mbështetësit dhe ndihmën e tij."><span class="w" data-sq="kjo është transmetuar nga Hulefai Rashidinët">وهذا هو المأثور عن الخلفاء الراشدين،</span> <span class="w" data-sq="Umeri vrau rojën e grabitësve">فإن عمر بن الخطاب رَضِيَ اللَّهُ عَنْهُ قتل ربيئة المحاربين.</span> <span class="w" data-sq="roja (rebija) është vëzhguesi që ulet në vend të lartë">والربيئة هو: الناظر الذي يجلس عليٰ مكان عالٍ ينظر منه</span> <span class="w" data-sq="dhe shikon për grabitësit se kush po vjen">المحاربين</span> <span class="w" data-sq="sepse kryerësi u mundësua vetëm me fuqinë e mbështetësit">لهم من يجيء؛ ولأن المباشر إنما تمكَّن من قتله بقوة الرِّدء ومعونته.</span></span></p>

<p><span class="s" data-sq="Grupi, kur mbështesin njëri-tjetrin derisa bëhen të fortë e të paprekshëm, janë partnerë në shpërblim e ndëshkim, si luftëtarët (muxhahidinët); sepse Pejgamberi ﷺ tha:"><span class="w" data-sq="grupi, kur mbështesin njëri-tjetrin derisa bëhen të paprekshëm">والطائفة إذا انتصر بعضها ببعض حتىٰ صاروا ممتنعين،</span> <span class="w" data-sq="janë partnerë në shpërblim e ndëshkim, si muxhahidinët">فهم مشتركون في الثواب والعقاب كالمجاهدين،</span> <span class="w" data-sq="sepse Pejgamberi ﷺ tha:">فإن النبي ﷺ قال:</span></span> <span class="s hadith" data-sq="Muslimanët janë të barabartë në gjakun e tyre, i jep siguri në emër të tyre edhe më i ulëti, ata janë një dorë kundër të tjerëve, dhe kthimi (i plaçkës) i atij që del ndahet me atë që rri.">«المسلمون تتكافأ دماؤهم، ويسعىٰ بذمتهم أدناهم، وهم يدٌ عليٰ مَن سواهم، ويَرُدُّ مُتسرِّيهم عليٰ قاعدهم»</span></p>

<p><span class="s" data-sq="Kjo do të thotë se kur ushtria e muslimanëve dërgon një çetë (seri), e ajo fiton plaçkë,"><span class="w" data-sq="kjo do të thotë se kur ushtria e muslimanëve">يعني أن جيش المسلمين</span> <span class="w" data-sq="dërgon një çetë (seri), e ajo fiton plaçkë">إذا برزت منهم سرية فغنمت مالًا، فإن</span></span></p>`},

{html:`<p><span class="s" data-sq="ushtria merr pjesë në atë që ka fituar çeta; sepse ajo u mundësua me mbështetjen dhe fuqinë e ushtrisë, por çetës i jepet shpërblim shtesë (nefl) veças. Pejgamberi ﷺ i jepte çetës, kur ishin në fillim të nisjes, një të katërtën pas humsit (të pestës), e kur ktheheshin në vendbanimin e tyre, e një çetë shkëputej prej tyre, u jepte të tretën pas humsit."><span class="w" data-sq="ushtria merr pjesë në atë që ka fituar çeta">الجيش يشاركها فيما غنمت؛</span> <span class="w" data-sq="sepse ajo u mundësua me mbështetjen e ushtrisë">لأنها بظهره وقوته تمكَّنت،</span> <span class="w" data-sq="por çetës i jepet shpërblim shtesë veças">لكن تُنفَّل عنه نفلًا،</span> <span class="w" data-sq="Pejgamberi ﷺ i jepte çetës">فإن النبي ﷺ كان يُنفِّل السرية</span> <span class="w" data-sq="kur ishin në fillim të nisjes, një të katërtën pas humsit">إذا كانوا في بدائهم الرُّبُعَ بعد الخُمس،</span> <span class="w" data-sq="kur ktheheshin, u jepte të tretën pas humsit">رجعوا إلىٰ أوطانهم وتسرَّت سرية نفَّلهم الثلث بعد الخُمس.</span></span></p>

<p><span class="s" data-sq="Sikur ushtria të fitonte plaçkë, çeta do të merrte pjesë në të. Ashtu si Pejgamberi ﷺ u ndau Talhës dhe Zubejrit, Allahu qoftë i kënaqur me ta, ditën e Bedrit, sepse ai i kishte dërguar në detyrë. Kështu ndihmësit dhe mbështetësit e grupit rebel janë pjesë e tij, në atë që u takon dhe në atë që u bie mbi ta."><span class="w" data-sq="sikur ushtria të fitonte plaçkë, çeta do të merrte pjesë">لو غَنِم الجيش غنيمة شاركته السرية؛</span> <span class="w" data-sq="ashtu si Pejgamberi ﷺ u ndau Talhës dhe Zubejrit ditën e Bedrit">لأنها في مصلحة الجيش [آ/ ق٣٢] كما قسم النبي ﷺ لطلحة والزبير</span> <span class="w" data-sq="Allahu qoftë i kënaqur me ta, ditën e Bedrit">رَضِيَ اللَّهُ عَنْهُمَا يوم بدر؛</span> <span class="w" data-sq="sepse ai i kishte dërguar në detyrë">لأنه كان قد بعثهم</span> <span class="w" data-sq="kështu ndihmësit e grupit rebel janë pjesë e tij">في مصلحة الجيش. فأعوان الطائفة الممتنعة وأنصارها منها</span> <span class="w" data-sq="në atë që u takon dhe në atë që u bie mbi ta">فيما لهم وعليهم.</span></span></p>

<p><span class="s" data-sq="Gjithashtu edhe ata që luftojnë për diçka të kotë pa asnjë arsyetim (te'vil), si ata që luftojnë për fanatizëm fisnor e thirrje paganiste, si Kajsi dhe Jemeni e të ngjashme — të dy palët janë zullumqare. Siç tha Pejgamberi ﷺ:"><span class="w" data-sq="gjithashtu edhe ata që luftojnë për diçka të kotë pa arsyetim">وهكذا المقتتلون عليٰ باطل لا تأويل فيه،</span> <span class="w" data-sq="si ata që luftojnë për fanatizëm fisnor">مثل المقتتلين عليٰ عصبية</span> <span class="w" data-sq="e thirrje paganiste, si Kajsi dhe Jemeni">ودعويٰ جاهلية، كقيس ويمن ونحوهما،</span> <span class="w" data-sq="të dy palët janë zullumqare">هما ظالمتان،</span> <span class="w" data-sq="siç tha Pejgamberi ﷺ:">كما قال النبي ﷺ:</span></span> <span class="s hadith" data-sq="Kur dy muslimanë takohen me shpatat e tyre, vrasësi dhe i vrari janë në Zjarr. U tha: O i Dërguar i Allahut, ky është vrasësi, por ç'faj ka i vrari? Tha: Ai kishte për qëllim ta vriste shokun e vet.">«إذا التقىٰ المسلمان بسيفيهما فالقاتل والمقتول في النار»، قيل: يا رسول الله، هذا القاتل فما بال المقتول؟ قال: «إنه أراد قتلَ صاحبه»</span> <span class="s" data-sq="Transmetuar në dy Sahihët.">أخرجاه في «الصحيحين».</span></p>

<p><span class="s" data-sq="Secila palë garanton dëmin që i ka shkaktuar palës tjetër në jetë e pasuri, edhe nëse nuk dihet"><span class="w" data-sq="secila palë garanton dëmin">وتضمن كلُّ طائفة ما أتلفت للأخريٰ</span> <span class="w" data-sq="nga jeta e pasuria, edhe nëse nuk dihet">من نفس ومال، وإن لم يُعْرَف</span></span></p>`},

{html:`<p><span class="s" data-sq="vetë vrasësin; sepse grupi i vetëm që mbështet njëri-tjetrin është si një person i vetëm."><span class="w" data-sq="vetë vrasësin">عينُ القاتل؛</span> <span class="w" data-sq="sepse grupi i vetëm që mbështet njëri-tjetrin është si një person i vetëm">لأن الطائفة الواحدة المتمنعَ بعضها ببعض كالشخص الواحد.</span></span></p>

<p><span class="s" data-sq="Kur kanë marrë vetëm pasurinë e nuk kanë vrarë — siç bëjnë beduinët shpesh — secilit i pritet dora e djathtë dhe këmba e majtë, sipas shumicës së dijetarëve si Ebu Hanife, Shafiu, Ahmedi e të tjerë."><span class="w" data-sq="kur kanë marrë vetëm pasurinë e nuk kanë vrarë">وأما إذا أخذوا المال فقط ولم يقتلوا</span> <span class="w" data-sq="siç bëjnë beduinët shpesh">ـ كما قد يفعله الأعراب كثيرًا ـ</span> <span class="w" data-sq="secilit i pritet dora e djathtë dhe këmba e majtë">فإنه يُقطع من كل واحد يده اليمنيٰ ورجله اليسريٰ،</span> <span class="w" data-sq="sipas shumicës së dijetarëve si Ebu Hanife, Shafiu, Ahmedi e të tjerë">عند أكثر العلماء كأبي حنيفة والشافعي وأحمد وغيرهم.</span></span></p>

<p><span class="s" data-sq="Ky është kuptimi i fjalës së Allahut të Lartësuar: «ose t'u priten duart dhe këmbët tërthor» [El-Maide: 33] — pritet dora me të cilën godet dhe këmba mbi të cilën ecën; pastaj i lyhet me vaj të vluar e të ngjashme për të ndalur gjakun që të mos rrjedhë e të çojë në vdekje. Gjithashtu lyhet edhe dora e hajdutit me vaj."><span class="w" data-sq="ky është kuptimi i fjalës së Allahut:">وهذا معنيٰ قول الله تعالىٰ:</span> <span class="w" data-sq="«ose t'u priten duart dhe këmbët tërthor» [El-Maide: 33]">﴿أَوْ تُقَطَّعَ أَيْدِيهِم وَأَرْجُلُهُم مِّنْ خِلَافٍ﴾ [المائدة: ٣٣]،</span> <span class="w" data-sq="pritet dora me të cilën godet">تُقطع اليد التي يَبطِش بها،</span> <span class="w" data-sq="dhe këmba mbi të cilën ecën">والرِّجل التي يَمشي عليها،</span> <span class="w" data-sq="pastaj i lyhet me vaj të vluar për të ndalur gjakun">وتُحسَم يده ورجله بالزيت المغلي ونحوه، لينحسم الدم ولا</span> <span class="w" data-sq="që të mos rrjedhë e të çojë në vdekje">يخرج، لتفضي إلىٰ تلفه،</span> <span class="w" data-sq="gjithashtu lyhet edhe dora e hajdutit me vaj">وكذلك تُحسَم يد السارق بالزيت.</span></span></p>

<p><span class="s" data-sq="Kjo formë e ndëshkimit mund të jetë më e frikshme se vrasja; sepse beduinët, ushtarët e prishur e të tjerët, kur shohin vazhdimisht mes tyre dikë me dorë e këmbë të prerë, kujtohen për krimin e tij."><span class="w" data-sq="kjo formë e ndëshkimit mund të jetë më e frikshme se vrasja">وهذا القَذَرُ قد يكون أزجَرَ من القتل،</span> <span class="w" data-sq="sepse beduinët, ushtarët e prishur e të tjerët">فإن الأعراب وفَسَقة الجند وغيرهم</span> <span class="w" data-sq="kur shohin vazhdimisht mes tyre dikë me dorë e këmbë të prerë, kujtohen për krimin e tij">إذا رأوا دائمًا بينهم مَن هو مقطوع اليد والرِّجل تذكَّروا بذلك جُرمه</span></span></p>`},

{html:`<p><span class="s" data-sq="dhe ndalohen, ndryshe nga vrasja e cila harrohet; e disa shpirtra krenarë e preferojnë vdekjen kundrejt prerjes së dorës e këmbës tërthor, kështu ky ndëshkim është më i ashpër për të dhe të ngjashmit e tij."><span class="w" data-sq="dhe ndalohen, ndryshe nga vrasja e cila harrohet">فارتدعوا، بخلاف القتل فإنه قد يُنسىٰ،</span> <span class="w" data-sq="disa shpirtra krenarë e preferojnë vdekjen kundrejt prerjes së gjymtyrëve">وقد يؤثِّر بعض النفوس الأبيَّة قتلَه</span> <span class="w" data-sq="kundrejt prerjes së dorës e këmbës tërthor">عليٰ قَطْع يده ورجله من خلاف،</span> <span class="w" data-sq="kështu ky ndëshkim është më i ashpër për të dhe të ngjashmit">فيكون هذا أشد تنكيلًا له ولأمثاله.</span></span></p>

<p><span class="s" data-sq="Kur kanë nxjerrë armët por nuk kanë vrarë njeri e nuk kanë marrë pasuri, pastaj i kanë futur armët dhe kanë ikur, ose kanë lënë luftimin, ata dëbohen. Është thënë: dëbimi i tyre është t'i shpërndajnë pa i lënë të vendosen askund. Është thënë: është burgimi i tyre. Është thënë: është ajo që imami e sheh më të dobishme — dëbim, burg, ose diçka tjetër."><span class="w" data-sq="kur kanë nxjerrë armët por nuk kanë vrarë e nuk kanë marrë pasuri">وأما إذا شَهَروا السلاح ولم يقتلوا نفسًا ولم يأخذوا مالًا</span> <span class="w" data-sq="pastaj i kanë futur armët dhe kanë ikur">ثم أغمدوه وهربوا،</span> <span class="w" data-sq="ose kanë lënë luftimin, ata dëbohen">أو تركوا الحراب فإنهم يُنفَون،</span> <span class="w" data-sq="dëbimi i tyre është t'i shpërndajnë pa i lënë të vendosen askund">فقيل: نفيهم تشريدهم فلا يتركون يأوون في بلد،</span> <span class="w" data-sq="është thënë: burgimi i tyre">وقيل: هو حبسهم،</span> <span class="w" data-sq="është thënë: ajo që imami e sheh më të dobishme — dëbim, burg, ose diçka tjetër">وقيل: هو ما يراه الإمام أصلح من نفي أو حبس أو نحو ذلك.</span></span></p>

<p><span class="s" data-sq="Vrasja e ligjshme është: goditja e qafës me shpatë e të ngjashme; sepse kjo është mënyra më e shpejtë. Gjithashtu Allahu e ka ligjësuar vrasjen e atyre që lejohet vrasja e tyre nga njerëzit e kafshët — kur ka mundësi — në këtë mënyrë."><span class="w" data-sq="vrasja e ligjshme është: goditja e qafës me shpatë">والقتل المشروع هو: ضرب الرقبة بالسيف ونحوه؛</span> <span class="w" data-sq="sepse kjo është mënyra më e shpejtë">لأن ذلك أوحىٰ</span> <span class="w" data-sq="Allahu e ka ligjësuar vrasjen kur ka mundësi në këtë mënyrë">أنواع القتل، وكذلك شرع الله قتل ما يُباح قتله من الآدميين والبهائم إذا قُدِر عليه عليٰ هذا الوجه،</span></span></p>

<p><span class="s" data-sq="Pejgamberi ﷺ tha:"><span class="w" data-sq="Pejgamberi ﷺ tha:">وقال النبي ﷺ:</span></span> <span class="s hadith" data-sq="Allahu e ka caktuar mirësinë (ihsanin) për çdo gjë; kur të vrisni, vrisni mirë; kur të therni, therni mirë; le ta mprehtë secili prej jush thikën e vet dhe le ta lehtësojë kafshën e vet.">«إن الله كتب الإحسانَ عليٰ كلِّ شيء، فإذا قتلتم فأحسنوا القِتلة، وإذا ذبحتم فأحسنوا الذَّبحة، وليحدَّ أحدُكم شفرته وليُرِح ذبيحَته»</span> <span class="s" data-sq="Transmetuar nga Muslimi.">رواه مسلم.</span></p>

<p><span class="s" data-sq="Dhe tha:"><span class="w" data-sq="Dhe tha:">وقال:</span></span> <span class="s hadith" data-sq="Njerëzit më të butë në vrasje janë besimtarët.">«إن أعفَّ الناس قِتلةً أهلُ الإيمان»</span></p>`},

{html:`<h3 style="text-align:center;font-size:1.2em;margin:1.2em 0"><span class="s" data-sq="Kapitull">فصل</span></h3>

<p><span class="s" data-sq="Sa i përket kryqëzimit të përmendur, ai është: ngritja e tyre në vend të lartë që t'i shohin njerëzit dhe të bëhet i njohur çështja e tyre. Kjo bëhet pas vrasjes sipas shumicës së dijetarëve; disa kanë thënë: kryqëzohen të gjallë e bëhet i njohur çështja e tyre, pastaj vriten duke qenë të kryqëzuar."><span class="w" data-sq="kryqëzimi i përmendur është: ngritja e tyre në vend të lartë">وأما الصلب المذكور فهو: رفعهم عليٰ مكان عالٍ</span> <span class="w" data-sq="që t'i shohin njerëzit dhe të bëhet i njohur çështja e tyre">ليراهم الناس ويشتهر أمرُهم،</span> <span class="w" data-sq="kjo bëhet pas vrasjes sipas shumicës së dijetarëve">وهو بعد القتل عند جمهور العلماء،</span> <span class="w" data-sq="disa kanë thënë: kryqëzohen dhe vriten duke qenë të kryqëzuar">ومنهم مَن قال: يُصلبون ويشتهر أمرُهم، ثم يُقتلون وهو مصلوبون.</span></span></p>

<p><span class="s" data-sq="Disa fukaha kanë lejuar vrasjen e tyre pa shpatë; madje disa kanë thënë: lihen në vendin e lartë derisa të vdesin vetvetiu, pa u vrarë."><span class="w" data-sq="disa fukaha kanë lejuar vrasjen pa shpatë">وقد جوَّز بعض الفقهاء قتلَهم بغير السيف،</span> <span class="w" data-sq="madje disa kanë thënë: lihen derisa të vdesin vetvetiu pa u vrarë">حتىٰ قال بعضهم: يُتركون عليٰ المكان العالي حتىٰ يموتوا حتف أنوفهم بلا قتل.</span></span></p>

<p><span class="s" data-sq="Sa i përket gjymtimit në vrasje, nuk lejohet përveçse në bazë të kisasit (ndëshkimit të barabartë). Imran ibn Husejni, Allahu qoftë i kënaqur me të, tha: Pejgamberi ﷺ nuk na ka mbajtur asnjë hutbe pa na urdhëruar për sadaka dhe pa na ndaluar nga gjymtimi."><span class="w" data-sq="sa i përket gjymtimit në vrasje, nuk lejohet përveçse në kisas">فأما التمثيل في القتل، فلا يجوز إلا عليٰ وجه القصاص،</span> <span class="w" data-sq="Imran ibn Husejni tha:">وقد قال عمران بن حصين رَضِيَ اللَّهُ عَنْهُ:</span> <span class="w" data-sq="Pejgamberi ﷺ nuk na ka mbajtur asnjë hutbe pa na urdhëruar për sadaka">ما خطبنا رسول الله ﷺ خطبةً إلا أمَرنا بالصدقة</span> <span class="w" data-sq="dhe pa na ndaluar nga gjymtimi">ونهانا عن المُثْلَة.</span></span></p>

<p><span class="s" data-sq="Madje edhe jobesimtarët, kur i vrasim nuk i gjymtojmë pas vrasjes, nuk u presim hundët e veshët, nuk u çajmë barqet — përveçse nëse ata na kanë bërë neve ashtu, atëherë u bëjmë njësoj si na bënë; por durimi është më i mirë."><span class="w" data-sq="edhe jobesimtarët, kur i vrasim nuk i gjymtojmë pas vrasjes">حتىٰ الكفار إذا قتلناهم فإنا لا نمثِّل بهم بعد القتل،</span> <span class="w" data-sq="nuk u presim hundët e veshët, nuk u çajmë barqet">ولا نجدع أنفهم وآذانهم ولا نبقر بطونهم</span> <span class="w" data-sq="përveçse nëse ata na kanë bërë neve ashtu">إلا أن يكونوا فعلوا ذلك بنا،</span> <span class="w" data-sq="atëherë u bëjmë njësoj si na bënë">فنفعل بهم مثل ما فعلوا،</span> <span class="w" data-sq="por durimi është më i mirë">والترك أفضل،</span></span></p>

<p><span class="s" data-sq="siç tha Allahu i Lartësuar:"><span class="w" data-sq="siç tha Allahu i Lartësuar:">كما قال الله سبحانه وتعالىٰ:</span></span> <span class="s quran" data-sq="Në qoftë se ndëshkoni, ndëshkoni aq sa jeni ndëshkuar, e në qoftë se duroni, ai (durimi) është shumë më i mirë për ata që durojnë. [En-Nahl: 126]">﴿وَإِنْ عَاقَبْتُمْ فَعَاقِبُوا بِمِثْلِ مَا عُوقِبْتُم بِهِ وَلَئِن صَبَرْتُمْ لَهُوَ خَيْرٌ لِّلصَّابِرِينَ﴾</span> <span class="s" data-sq="[En-Nahl: 126], është thënë:">[النحل: ١٢٦]، قيل:</span></p>`},

{html:`<p><span class="s" data-sq="Ajo zbriti kur mushrikët gjymtuan Hamzën dhe shehidët e tjerë të Uhudit, e Pejgamberi ﷺ tha: «Nëse Allahu më jep fitore mbi ta, do t'i gjymtoj dyfishin e asaj që na gjymtuan neve.» Kështu Allahu zbriti këtë ajet."><span class="w" data-sq="ajo zbriti kur mushrikët gjymtuan Hamzën dhe shehidët e tjerë të Uhudit">إنها نزلت لما مَثَّل المشركون بحمزة وغيره من شهداء أحد،</span> <span class="w" data-sq="Pejgamberi ﷺ tha: nëse Allahu më jep fitore, do t'i gjymtoj dyfishin">فقال النبي ﷺ: «لئن أظفرني الله بهم لأمثلنَّ بضعفي ما مَثَّلوا بنا»</span> <span class="w" data-sq="kështu Allahu zbriti këtë ajet">فأنزل الله هذه الآية</span></span></p>

<p><span class="s" data-sq="— edhe pse ajo kishte zbritur [para kësaj] në Meke, si fjala e Tij: «Të pyesin ty për shpirtin. Thuaj: Shpirti është çështje që i përket vetëm Zotit tim» [El-Isra: 85], dhe fjala e Tij: «Fal namazin në dy skajet e ditës, edhe në orët e afërta (me ditën) të natës. Vërtet, veprat e mira i shlyejnë ato të këqijat» [Hud: 114], e ajete të tjera që zbritën në Meke, pastaj ndodhi në Medine shkak që e kërkonte fjalën, e u zbrit për herë të dytë."><span class="w" data-sq="edhe pse ajo kishte zbritur para kësaj në Meke">ـ وإن كانت قد نزلت [قبل ذلك] بمكة،</span> <span class="w" data-sq="si fjala e Tij:">مثل قوله:</span> <span class="w quran" data-sq="Të pyesin ty për shpirtin. Thuaj: Shpirti është çështje që i përket vetëm Zotit tim, e juve nuk ju është dhënë nga dija vetëm pak. [El-Isra: 85]">﴿وَيَسْأَلُونَكَ عَنِ الرُّوحِ قُلِ الرُّوحُ مِنْ أَمْرِ رَبِّي﴾</span> <span class="w" data-sq="[El-Isra: 85], dhe fjala e Tij:">[الإسراء: ٨٥]، وقوله:</span> <span class="w quran" data-sq="Fal namazin në dy skajet e ditës, edhe në orët e afërta (me ditën) të natës. Vërtet, veprat e mira i shlyejnë ato të këqijat. [Hud: 114]">﴿وَأَقِمِ الصَّلَاةَ طَرَفَيِ النَّهَارِ وَزُلَفًا مِّنَ اللَّيْلِ إِنَّ الْحَسَنَاتِ يُذْهِبْنَ السَّيِّئَاتِ﴾</span> <span class="w" data-sq="[Hud: 114]">[هود: ١١٤]،</span> <span class="w" data-sq="e ajete të tjera që zbritën në Meke, pastaj ndodhi në Medine shkak që e kërkonte fjalën, e u zbrit për herë të dytë">وغير ذلك من الآيات التي نزلت بمكة، ثم جريٰ بالمدينة سببٌ يقتضي الخطاب فأُنزلت مرة ثانية</span></span></p>

<p><span class="s" data-sq="— e Pejgamberi ﷺ tha: «Jo, por do të durojmë.»"><span class="w" data-sq="Pejgamberi ﷺ tha: Jo, por do të durojmë">ـ فقال النبي ﷺ: «بل نصبر».</span></span></p>
