<p><span class="s" data-sq="Kjo ngase Pejgamberi ﷺ tha:">وذلك لأن النبي ﷺ قال:</span> <span class="s hadith" data-sq="«Namazi është shtylla e fesë.»">«الصلاة عماد الدين».</span> <span class="s" data-sq="E kur udhëheqësi e ngrit shtyllën e fesë, namazi ndalon nga e keqja dhe e shëmtuara, dhe ai është që i ndihmon njerëzit në gjithë adhurimet e tjera, siç tha i Lartësuari:"><span class="w" data-sq="E kur udhëheqësi e ngrit shtyllën e fesë,">فإذا أقام المتولي عماد الدين،</span> <span class="w" data-sq="namazi ndalon nga e keqja dhe e shëmtuara,">فالصلاة تنهى عن الفحشاء والمنكر،</span> <span class="w" data-sq="dhe ai është që i ndihmon njerëzit në gjithë adhurimet e tjera, siç tha i Lartësuari:">وهي التي تُعِين الناس على ما سواها من الطاعات، كما قال سبحانه وتعالى:</span></span> <span class="s quran" data-sq="Kërkoni ndihmë me durim e me namaz, vërtet ajo është e rëndë, por jo edhe për ata që janë të përulur (ndaj Zotit).">﴿وَاسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ وَإِنَّهَا لَكَبِيرَةٌ إِلَّا عَلَى الْخَاشِعِينَ﴾</span> <span class="s" data-sq="[El-Bekare: 45], dhe tha:">[البقرة: ٤٥]، وقال:</span> <span class="s quran" data-sq="O ju që besuat, kërkoni ndihmë me durim e me namaz, se vërtet All-llahu është me durimtarët.">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا اسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ إِنَّ اللَّهَ مَعَ الصَّابِرِينَ﴾</span> <span class="s" data-sq="[El-Bekare: 153], dhe tha i Lartësuari për robin dhe pejgamberin e Tij ﷺ:">[البقرة: ١٥٣]، وقال عز وجل لعبده ونبيه ﷺ:</span> <span class="s quran" data-sq="Urdhëro familjen tënde të falë namaz, edhe ti vetë zbatoje atë me durim. Ne nuk kërkojmë prej teje ndonjë furnizim, Ne të furnizojmë ty.">﴿وَأْمُرْ أَهْلَكَ بِالصَّلَاةِ وَاصْطَبِرْ عَلَيْهَا لَا نَسْأَلُكَ رِزْقًا نَّحْنُ نَرْزُقُكَ﴾</span></p>`},
// ===== Faqja 28: Edh-Dharijat, qellimi i posteve, Umeri (PDF fq. 30) =====
{html:`<p><span class="s quran" data-sq="Unë nuk i krijova xhinët dhe njerëzit për tjetër pos që të më adhurojnë. Unë nuk kërkoj prej tyre ndonjë furnizim e as nuk dëshiroj të më ushqejnë. All-llahu është furnizues, posedues i fuqisë, i fortë."><span class="w" data-sq="Unë nuk i krijova xhinët dhe njerëzit për tjetër pos që të më adhurojnë.">﴿وَمَا خَلَقْتُ الْجِنَّ وَالْإِنسَ إِلَّا لِيَعْبُدُونِ</span> <span class="w" data-sq="Unë nuk kërkoj prej tyre ndonjë furnizim e as nuk dëshiroj të më ushqejnë.">مَا أُرِيدُ مِنْهُم مِّن رِّزْقٍ وَمَا أُرِيدُ أَن يُطْعِمُونِ</span> <span class="w" data-sq="All-llahu është furnizues, posedues i fuqisë, i fortë.">إِنَّ اللَّهَ هُوَ الرَّزَّاقُ ذُو الْقُوَّةِ الْمَتِينُ﴾</span></span> <span class="s" data-sq="[Edh-Dharijat: 56-58].">[الذاريات: ٥٦-٥٨].</span></p>

<p><span class="s" data-sq="Dhe qëllimi i detyrueshëm me postet është: ndreqja e fesë së krijesave, të cilët kur iu shpëton ajo, kanë humbur humbje të qartë, dhe nuk u bën dobi ajo me çka gëzuan në dynja; dhe ndreqja e asaj pa të cilën nuk qëndron feja nga çështjet e dynjasë së tyre, e ajo është dy llojesh: ndarja e pasurisë mes të drejtëve të saj, dhe ndëshkimi i tejkaluesve."><span class="w" data-sq="Dhe qëllimi i detyrueshëm me postet është: ndreqja e fesë së krijesave,">والمقصودُ الواجب بالولايات: إصلاحُ دين الخلق</span> <span class="w" data-sq="të cilët kur iu shpëton ajo, kanë humbur humbje të qartë, dhe nuk u bën dobi ajo me çka gëzuan në dynja;">الذين متى فاتهم خسروا خسرانًا مبينًا، ولم ينفعهم ما نَعِمُوا به في الدنيا،</span> <span class="w" data-sq="dhe ndreqja e asaj pa të cilën nuk qëndron feja nga çështjet e dynjasë së tyre,">وإصلاحُ ما لا يقوم الدين إلا به من أمر دنياهم،</span> <span class="w" data-sq="e ajo është dy llojesh: ndarja e pasurisë mes të drejtëve të saj, dhe ndëshkimi i tejkaluesve.">وهو نوعان: قَسْم المال بين مستحقيه، وعقوبات المعتدين.</span></span></p>

<p><span class="s" data-sq="Kush nuk i ka bërë padrejtësi, ia ndreq fenë dhe dynjanë; prandaj Umer ibnu'l-Hattabi, radijallahu anhu, thoshte: Unë i dërgova nëpunësit e mi tek ju që t'ju mësojnë Librin e Zotit tuaj, dhe Sunnetin e Pejgamberit tuaj, dhe të ndajnë mes jush me drejtësi."><span class="w" data-sq="Kush nuk i ka bërë padrejtësi, ia ndreq fenë dhe dynjanë;">فمن لم يَعْتَدِ أصلحَ له دينه ودنياه؛</span> <span class="w" data-sq="prandaj Umer ibnu'l-Hattabi, radijallahu anhu, thoshte:">ولهذا كان عمر بن الخطاب رضي الله عنه يقول:</span> <span class="w" data-sq="Unë i dërgova nëpunësit e mi tek ju që t'ju mësojnë Librin e Zotit tuaj, dhe Sunnetin e Pejgamberit tuaj, dhe të ndajnë mes jush me drejtësi.">إنما بعثتُ عُمَّالي إليكم ليعلّموكم كتابَ ربكم، وسنةَ نبيكم، ويقسموا بينكم فيأكم.</span></span></p>

<p><span class="s" data-sq="E kur ndryshoi populli nga njëra anë, dhe udhëheqësit nga ana tjetër, u kundërshtuan çështjet. E kur përpiqet bariu në ndreqjen e fesë dhe dynjasë së tyre sipas mundësisë, ai është nga më të mirët e"><span class="w" data-sq="E kur ndryshoi populli nga njëra anë, dhe udhëheqësit nga ana tjetër, u kundërshtuan çështjet.">فلما تغيرت الرعية من وجه، والرُّعاة من وجه، تناقضت الأمور.</span> <span class="w" data-sq="E kur përpiqet bariu në ndreqjen e fesë dhe dynjasë së tyre sipas mundësisë, ai është nga më të mirët e">فإذا اجتهد الراعي في إصلاح دينهم ودنياهم بحسب الإمكان، كان من أفضل</span></span></p>`},
// ===== Faqja 29: Imami i drejte, hadithi i shtate (PDF fq. 31) =====
{html:`<p><span class="s" data-sq="njerëzve të kohës së tij, dhe ishte nga më të mirët e luftëtarëve në rrugën e Allahut, ngase është transmetuar:"><span class="w" data-sq="njerëzve të kohës së tij,">أهل زمانه،</span> <span class="w" data-sq="dhe ishte nga më të mirët e luftëtarëve në rrugën e Allahut, ngase është transmetuar:">وكان من أفضل المجاهدين في سبيل الله تعالى، فقد رُوي:</span></span> <span class="s hadith" data-sq="«Një ditë e një imami të drejtë është më e mirë se sa adhurimi i gjashtëdhjetë viteve.»">«يومٌ من إمام عادل أفضل من عبادة ستين سنة».</span></p>

<p><span class="s" data-sq="Dhe në 'Musnedin' e Imam Ahmedit nga Pejgamberi ﷺ se tha:">وفي «المسند» للإمام أحمد عن النبي ﷺ أنه قال:</span> <span class="s hadith" data-sq="«Krijesa më e dashur tek Allahu është imami i drejtë, dhe krijesa më e urryer tek Allahu është imami i padrejtë.»">«أحبُّ الخلقِ إلى الله إمامٌ عادل، وأبغض الخلق إلى الله إمام جائر».</span></p>

<p><span class="s" data-sq="Dhe në dy 'Sahihat' nga Ebu Hurejre, radijallahu anhu, tha: Tha i Dërguari i Allahut ﷺ:">وفي «الصحيحين» عن أبي هريرة رضي الله عنه قال: قال رسول الله ﷺ:</span> <span class="s hadith" data-sq="«Shtatë do t'i bëjë hije Allahu nën hijen e Tij ditën kur nuk ka hije tjetër veç hijes së Tij: imam i drejtë, dhe i ri që u rrit në adhurim të Allahut, dhe njeri zemra e të cilit është e lidhur me xhaminë — kur del prej saj derisa të kthehet në te, dhe dy njerëz që u deshën për hir të Allahut u takuan mbi këtë dhe u ndanë mbi këtë, dhe njeri që e përmendi Allahun vetëm e i rrodhën lotët,»"><span class="w" data-sq="«Shtatë do t'i bëjë hije Allahu nën hijen e Tij ditën kur nuk ka hije tjetër veç hijes së Tij:">«سبعة يظلهم الله في ظله يوم لا ظلَّ إلا ظله:</span> <span class="w" data-sq="imam i drejtë,">إمامٌ عادل،</span> <span class="w" data-sq="dhe i ri që u rrit në adhurim të Allahut,">وشابٌّ نشأ في عبادة الله،</span> <span class="w" data-sq="dhe njeri zemra e të cilit është e lidhur me xhaminë — kur del prej saj derisa të kthehet në te,">ورجلٌ قلبه معلَّق بالمسجد إذا خرج منه حتى يعود إليه،</span> <span class="w" data-sq="dhe dy njerëz që u deshën për hir të Allahut, u takuan mbi këtë dhe u ndanë mbi këtë,">ورجلان تحابَّا في الله اجتمعا على ذلك وتفرَّقا عليه،</span> <span class="w" data-sq="dhe njeri që e përmendi Allahun vetëm e i rrodhën lotët,">ورجلٌ ذَكَر الله خاليًا ففاضت عيناه،</span></span></p>`},
// ===== Faqja 30: Vazhdimi i hadithit te shtate, Sahih Muslim, El-Enfal 39 (PDF fq. 32) =====
{html:`<p><span class="s hadith" data-sq="dhe njeri që e thirri një grua me pozitë e bukuri, e tha: Unë i frikohem Allahut, Zotit të botëve; dhe njeri që dha sadaka e e fshehu aq sa nuk e di e majta çka shpenzon e djathta.»"><span class="w" data-sq="dhe njeri që e thirri një grua me pozitë e bukuri, e tha: Unë i frikohem Allahut, Zotit të botëve;">ورجلٌ دعته امرأةٌ ذاتُ منصبٍ وجمال فقال: إني أخافُ اللهَ ربَّ العالمين،</span> <span class="w" data-sq="dhe njeri që dha sadaka e e fshehu aq sa nuk e di e majta çka shpenzon e djathta.»">ورجلٌ تصدق بصدقة فأخفاها حتى لا تعلمَ شمالُه ما تنفق يمينُه».</span></span></p>

<p><span class="s" data-sq="Dhe në 'Sahihun' e Muslimit nga Ijad ibnu Himar, radijallahu anhu, tha: Tha i Dërguari i Allahut ﷺ:">وفي «صحيح مسلم» عن عياض بن حِمار رضي الله عنه قال: قال رسول الله ﷺ:</span> <span class="s hadith" data-sq="«Banorët e Xhenetit janë tre: sundimtar i drejtë, dhe njeri i mëshirshëm zemërbutë me çdo të afërm e mysliman, dhe njeri i pasur i ndershëm bamirës.»"><span class="w" data-sq="«Banorët e Xhenetit janë tre:">«أهل الجنة ثلاثة:</span> <span class="w" data-sq="sundimtar i drejtë,">ذو سلطان مُقْسِط،</span> <span class="w" data-sq="dhe njeri i mëshirshëm zemërbutë me çdo të afërm e mysliman,">ورجلٌ رحيم رقيق القلب بكل ذي قُرْبى ومسلم،</span> <span class="w" data-sq="dhe njeri i pasur i ndershëm bamirës.»">ورجل غني عفيف متصدق».</span></span></p>

<p><span class="s" data-sq="Dhe në 'Sunen' nga ai ﷺ se tha:">وفي «السنن» عنه ﷺ أنه قال:</span> <span class="s hadith" data-sq="«Ai që përpiqet në mbledhjen e sadakasë me të drejtë është si luftëtari në rrugën e Allahut.»">«الساعي على الصدقة بالحق كالمجاهد في سبيل الله».</span></p>

<p><span class="s" data-sq="Dhe tha i Lartësuari — kur urdhëroi për xhihad —:">وقد قال سبحانه وتعالى — لما أمر بالجهاد —:</span> <span class="s quran" data-sq="Luftoni ata derisa të mos mbetet fitne, e feja (adhurimi) të jetë vetëm për All-llahun.">﴿وَقَاتِلُوهُمْ حَتَّىٰ لَا تَكُونَ فِتْنَةٌ وَيَكُونَ الدِّينُ كُلُّهُ لِلَّهِ﴾</span> <span class="s" data-sq="[El-Enfal: 39].">[الأنفال: ٣٩].</span></p>

<p><span class="s" data-sq="Dhe iu tha Pejgamberit ﷺ: O i Dërguar i Allahut, njeriu lufton nga guximi, lufton nga fanatizmi, lufton nga syfaqësia — cili prej tyre është në rrugën e Allahut? Tha:"><span class="w" data-sq="Dhe iu tha Pejgamberit ﷺ: O i Dërguar i Allahut,">وقيل للنبي ﷺ: يا رسول الله،</span> <span class="w" data-sq="njeriu lufton nga guximi, lufton nga fanatizmi, lufton nga syfaqësia —">الرجلُ يقاتل شجاعةً، ويقاتل حَميَّةً، ويقاتل رياءً،</span> <span class="w" data-sq="cili prej tyre është në rrugën e Allahut? Tha:">فأيُّ ذلك في سبيل الله؟ فقال:</span></span> <span class="s hadith" data-sq="«Kush lufton që fjala e Allahut të jetë më e larta, ai është në rrugën e Allahut.»">«مَن قاتل لتكون كلمة الله هي العليا فهو في سبيل الله».</span></p>`},
// ===== Faqja 31: Qellimi — feja per Allahun, El-Hadid 25 (PDF fq. 33) =====
{html:`<p><span class="s" data-sq="Qëllimi është që feja të jetë krejt për Allahun, dhe fjala e Allahut të jetë më e larta. Fjala e Allahut: emër përmbledhës për fjalët e Tij që i përfshinë Libri i Tij, dhe kështu tha Allahu i Lartësuar:"><span class="w" data-sq="Qëllimi është që feja të jetë krejt për Allahun, dhe fjala e Allahut të jetë më e larta.">فالمقصود أن يكون الدين كله لله، وأن تكون كلمة الله هي العليا.</span> <span class="w" data-sq="Fjala e Allahut: emër përmbledhës për fjalët e Tij që i përfshinë Libri i Tij,">وكلمة الله: اسم جامع لكلماته التي تضمَّنها كتابه،</span> <span class="w" data-sq="dhe kështu tha Allahu i Lartësuar:">وهكذا قال الله تعالى:</span></span> <span class="s quran" data-sq="Ne i patëm dërguar të dërguarit Tanë me fakte të qarta dhe bashkë me ata zbritëm librin dhe drejtësinë që njerëzit të veprojnë drejt.">﴿لَقَدْ أَرْسَلْنَا رُسُلَنَا بِالْبَيِّنَاتِ وَأَنزَلْنَا مَعَهُمُ الْكِتَابَ وَالْمِيزَانَ لِيَقُومَ النَّاسُ بِالْقِسْطِ﴾</span> <span class="s" data-sq="[El-Hadid: 25], andaj qëllimi i dërgimit të pejgamberëve dhe zbritjes së librave është që njerëzit të veprojnë me drejtësi në të drejtat e Allahut dhe të drejtat e krijesave. Pastaj tha i Lartësuari:">[الحديد: ٢٥]، فالمقصود من إرسال الرسل وإنزال الكتب أن يقوم الناس بالقسط في حقوق الله وحقوق خلقه. ثم قال تعالى:</span> <span class="s quran" data-sq="Ne e kemi zbritur edhe hekurin që në të ka forcë të fortë dhe dobi për njerëz, e edhe për t'u ditur te All-llahu se kush ndihmon Atë (rrugën e Tij) dhe të dërguarit e Tij duke i besuar të fshehtës.">﴿وَأَنزَلْنَا الْحَدِيدَ فِيهِ بَأْسٌ شَدِيدٌ وَمَنَافِعُ لِلنَّاسِ وَلِيَعْلَمَ اللَّهُ مَن يَنصُرُهُ وَرُسُلَهُ بِالْغَيْبِ﴾</span></p>

<p><span class="s" data-sq="Andaj kush largohet nga Libri, drejtohet me hekurin, prandaj mbështetja e fesë qëndron mbi Mus'hafin dhe shpatën."><span class="w" data-sq="Andaj kush largohet nga Libri, drejtohet me hekurin,">فمَن عَدَل عن الكتاب قُوِّم بالحديد،</span> <span class="w" data-sq="prandaj mbështetja e fesë qëndron mbi Mus'hafin dhe shpatën.">ولهذا كان قِوامُ الدين بالمصحف والسيف.</span></span></p>

<p><span class="s" data-sq="Dhe është transmetuar nga Xhabir ibnu Abdilahi, radijallahu anhuma, se tha: Na urdhëroi i Dërguari i Allahut ﷺ ta godasim me këtë — domethënë shpatën — këndo që largohet nga ky — domethënë Mus'hafi."><span class="w" data-sq="Dhe është transmetuar nga Xhabir ibnu Abdilahi, radijallahu anhuma, se tha:">وقد رُوي عن جابر بن عبد الله رضي الله عنهما أنه قال:</span> <span class="w" data-sq="Na urdhëroi i Dërguari i Allahut ﷺ ta godasim me këtë — domethënë shpatën — këndo që largohet nga ky — domethënë Mus'hafi.">أمَرَنا رسول الله ﷺ أن نضرب بهذا — يعني السيف — مَن عَدَل عن هذا — يعني المصحف.</span></span></p>`},
// ===== Faqja 32: Parapelqimi sipas qellimit, hadithi i imamit (PDF fq. 34) =====
{html:`<p><span class="s" data-sq="E kur ky është qëllimi, arrihet me atë që është më afër pastaj më afër, dhe shikohet tek dy njerëzit se cili është më afër qëllimit e i jepet posti. E nëse posti është — për shembull — imamat namazi vetëm, parapëlqehet ai që e parapëlqeu Pejgamberi ﷺ, ku tha:"><span class="w" data-sq="E kur ky është qëllimi, arrihet me atë që është më afër pastaj më afër,">فإذا كان هذا هو المقصود فإنه يُتَوَصَّل إليه بالأقرب فالأقرب،</span> <span class="w" data-sq="dhe shikohet tek dy njerëzit se cili është më afër qëllimit e i jepet posti.">ويُنظَر إلى الرجلين أيهما كان أقرب إلى المقصود وُلِّي،</span> <span class="w" data-sq="E nëse posti është — për shembull — imamat namazi vetëm, parapëlqehet ai që e parapëlqeu Pejgamberi ﷺ, ku tha:">فإذا كانت الولاية — مثلًا — إمامة صلاة فقط، قُدِّم من قدمه النبي ﷺ، حيث قال:</span></span> <span class="s hadith" data-sq="«U prin popullit ai që e lexon më mirë Librin e Allahut; e nëse janë njëlloj në lexim, më i dituri në Sunnet; e nëse janë njëlloj në Sunnet, më i hershmi në hixhret; e nëse janë njëlloj në hixhret, më i madhi në moshë. Dhe mos ia marrë njeriu imamatin në pushtetin e tij, e mos u ul mbi ndenjësen e tij veçse me lejen e tij.»"><span class="w" data-sq="«U prin popullit ai që e lexon më mirë Librin e Allahut;">«يؤمُّ القومَ أقرؤهم لكتاب الله،</span> <span class="w" data-sq="e nëse janë njëlloj në lexim, më i dituri në Sunnet;">فإن كانوا في القراءة سواء فأعلمهم بالسنة،</span> <span class="w" data-sq="e nëse janë njëlloj në Sunnet, më i hershmi në hixhret;">فإن كانوا في السنة سواء فأقدمهم هجرة،</span> <span class="w" data-sq="e nëse janë njëlloj në hixhret, më i madhi në moshë.">فإن كانوا في الهجرة سواء فأقدمهم سنًّا،</span> <span class="w" data-sq="Dhe mos ia marrë njeriu imamatin në pushtetin e tij, e mos u ul mbi ndenjësen e tij veçse me lejen e tij.»">ولا يُؤَمَّنَّ الرجلُ في سلطانه، ولا يجلس على تَكْرِمَتِه إلا بإذنه»</span></span> <span class="s" data-sq="transmetoi Muslimi.">رواه مسلم.</span></p>

<p><span class="s" data-sq="E nëse dy njerëz janë të barabartë, ose fshihet se cili është më i mirë, hidhet short mes tyre, siç hodhi Sa'd ibnu Ebi Vekkasi short mes njerëzve ditën e Kadisijës kur u grindën për ezanin, duke ndjekur fjalën e tij ﷺ:"><span class="w" data-sq="E nëse dy njerëz janë të barabartë, ose fshihet se cili është më i mirë, hidhet short mes tyre,">فإذا تكافأ رجلان، أو خفي أصلحُهما أُقْرِع بينهما،</span> <span class="w" data-sq="siç hodhi Sa'di short mes njerëzve ditën e Kadisijës kur u grindën për ezanin,">كما أقرع سعد بن أبي وقاص بين الناس يوم القادسية لما تشاجروا على الأذان،</span> <span class="w" data-sq="duke ndjekur fjalën e tij ﷺ:">متابعةً لقوله ﷺ:</span></span> <span class="s hadith" data-sq="«Sikur ta dinin njerëzit çka ka në ezan dhe në safin e parë, pastaj nuk do ta gjenin veçse me short, do ta hidhnin shortin.»">«لو يعلم الناسُ ما في النداء والصفِّ الأوّل ثم لم يجدوا إلا أن يَسْتَهِمُوا عليه لاسْتَهَمُوا».</span></p>

<p><span class="s" data-sq="E kur parapëlqimi bëhet me urdhrin e Allahut kur shfaqet, ose me veprimin e Tij"><span class="w" data-sq="E kur parapëlqimi bëhet me urdhrin e Allahut kur shfaqet, ose me veprimin e Tij">فإذا كان التقديم بأمر الله إذا ظهر، أو بفعله</span></span></p>`},
// ===== Faqja 33: Fasl — Fuqia ne poste (PDF fq. 35) =====
{html:`<p><span class="s" data-sq="kur fshihet çështja — udhëheqësi do t'i ketë dhënë amanetin e posteve të drejtëve të tyre."><span class="w" data-sq="kur fshihet çështja — udhëheqësi do t'i ketë dhënë amanetin e posteve të drejtëve të tyre.">إذا خفي الأمر — كان المتولي قد أدّى الأمانات في الولايات إلى أهلها.</span></span></p>

<span class="fasl">فصل</span>

<p><span class="s" data-sq="Fuqia në poste bashkon fuqinë e njeriut në veten e tij, dhe fuqinë e tij mbi të tjerët; fuqia e tij mbi veten arrihet me butësi e durim, siç është transmetuar nga Pejgamberi ﷺ në hadithin e saktë:"><span class="w" data-sq="Fuqia në poste bashkon fuqinë e njeriut në veten e tij, dhe fuqinë e tij mbi të tjerët;">القوة في الولايات تجمع قوة المرء في نفسه، وقوته على غيره؛</span> <span class="w" data-sq="fuqia e tij mbi veten arrihet me butësi e durim,">فقوته على نفسه بالحلم والصبر،</span> <span class="w" data-sq="siç është transmetuar nga Pejgamberi ﷺ në hadithin e saktë:">كما رُوي عن النبي ﷺ في الحديث الصحيح:</span></span> <span class="s hadith" data-sq="«Nuk është i forti ai që mund në mundjen (fizike), por i forti është ai që e kontrollon veten kur zemërohet.»">«ليس الشديد بالصرعة، وإنما الشديد الذي يملك نفسه عند الغضب».</span></p>

<p><span class="s" data-sq="Dhe ky është 'sejjidi' (zotëria) për të cilin tha Allahu i Lartësuar:">وهذا هو السيد الذي قال الله تعالى فيه:</span> <span class="s quran" data-sq="e ai do të jetë zotëri e i ndershëm">﴿وَسَيِّدًا وَحَصُورًا﴾</span> <span class="s" data-sq="[Al Imran: 39], dhe tha Pejgamberi ﷺ për Hasanin:">[آل عمران: ٣٩]، وقال النبي ﷺ عن الحسن:</span> <span class="s hadith" data-sq="«Ky djali im është sejjid (zotëri), dhe Allahu do të pajtojë me te mes dy grupeve të mëdha nga myslimanët.»">«إنَّ ابني هذا سيد وسيصلح الله به بين طائفتين عظيمتين من المسلمين».</span></p>

<p><span class="s" data-sq="Sqaroi Pejgamberi ﷺ se njeriu i fortë i fuqishëm nuk është ai i fuqishmi në trup që i mund njerëzit e i mposht shumë, por ai është i fuqishmi në shpirtin e tij që e kontrollon veten dhe e mposht kur zemërohet."><span class="w" data-sq="Sqaroi Pejgamberi ﷺ se njeriu i fortë nuk është ai i fuqishmi në trup që i mund njerëzit,">فبين النبي ﷺ أن الرجل الشديد القوي ليس هو القوي في بدنه الذي يصرع الناسَ ويغلبهم كثيرًا،</span> <span class="w" data-sq="por ai është i fuqishmi në shpirtin e tij që e kontrollon veten kur zemërohet.">وإنما هو القوي في نفسه الذي يملك نفسه ويغلبها عند الغضب.</span></span></p>

<p><span class="s" data-sq="Sa për fuqinë e tij mbi të tjerët: guximi në vetvete, përvoja dhe gjithë shkaqet e fuqisë nga njerëzit dhe pasuritë, siç tregon fjala e Tij të Lartësuarit:"><span class="w" data-sq="Sa për fuqinë e tij mbi të tjerët: guximi në vetvete, përvoja dhe gjithë shkaqet e fuqisë nga njerëzit dhe pasuritë,">وأما قوته على غيره؛ فالشجاعة في نفسه، والخبرة وسائر أسباب القوى من الرجال والأموال،</span> <span class="w" data-sq="siç tregon fjala e Tij të Lartësuarit:">كما دل عليه قوله تعالى:</span></span> <span class="s quran" data-sq="E ju përgatituni sa të keni mundësi force, e kuaj të caktuar për betejë.">﴿وَأَعِدُّوا لَهُم مَّا اسْتَطَعْتُم مِّن قُوَّةٍ وَمِن رِّبَاطِ الْخَيْلِ﴾</span> <span class="s" data-sq="[El-Enfal: 60].">[الأنفال: ٦٠].</span></p>

<p><span class="s" data-sq="Dhe transmetoi Muslimi në 'Sahihun' e tij nga Ebu Hurejre, radijallahu anhu, tha: Tha i Dërguari i Allahut ﷺ:">وروى مسلم في «صحيحه» عن أبي هريرة رضي الله عنه قال: قال رسول</span></p>`},
// ===== Faqja 34: Hadithi i besimtarit te forte, dy fuqite (PDF fq. 36) =====
{html:`<p><span class="s hadith" data-sq="«Besimtari i fortë është më i mirë dhe më i dashur tek Allahu se sa besimtari i dobët, e në secilin ka mirësi. Përpiqu për atë që të bën dobi dhe kërko ndihmë nga Allahu e mos u dorëzo; e nëse të godet diçka, mos thuaj: Sikur ta kisha bërë, do ishte kështu e kështu; por thuaj: Kaderi i Allahut, e çka deshi bëri; ngase 'sikur' hap veprën e shejtanit.»"><span class="w" data-sq="«Besimtari i fortë është më i mirë dhe më i dashur tek Allahu se sa besimtari i dobët, e në secilin ka mirësi.">الله ﷺ: «المؤمن القوي خيرٌ وأحبُّ إلى الله من المؤمن الضعيف وفي كلٍّ خير،</span> <span class="w" data-sq="Përpiqu për atë që të bën dobi dhe kërko ndihmë nga Allahu e mos u dorëzo;"> احرص على ما ينفعُك واستعن بالله ولا تعجز،</span> <span class="w" data-sq="e nëse të godet diçka, mos thuaj: Sikur ta kisha bërë, do ishte kështu e kështu;">وإن أصابك شيء فلا تقل: لو أني فعلت لكان كذا وكذا،</span> <span class="w" data-sq="por thuaj: Kaderi i Allahut, e çka deshi bëri; ngase 'sikur' hap veprën e shejtanit.»">ولكن قل: قَدَرُ الله وما شاء فعل، فإنَّ لو تفتحُ عمل الشيطان».</span></span></p>

<p><span class="s" data-sq="Me fuqinë e parë njeriu bëhet nga muhaxhirët (emigruesit) që braktisën atë që e ndaloi Allahu, dhe nga muxhahidët që luftuan veten e tyre për Allahun — e ky është xhihadi kundër armikut të brendshëm: shejtanit dhe epshit."><span class="w" data-sq="Me fuqinë e parë njeriu bëhet nga muhaxhirët që braktisën atë që e ndaloi Allahu,">فبالقوَّة الأولى يصير المرء من المهاجرين الذين هجروا ما نهى الله عنه،</span> <span class="w" data-sq="dhe nga muxhahidët që luftuan veten e tyre për Allahun — e ky është xhihadi kundër armikut të brendshëm: shejtanit dhe epshit.">ومن المجاهدين الذين جاهدوا نفوسهم في الله، وهو جهاد العدو الباطن من الشيطان والهوى.</span></span></p>

<p><span class="s" data-sq="Dhe me fuqinë e dytë bëhet nga muhaxhirët muxhahidët në rrugën e Allahut, që luftuan armiqtë e Tij dhe ndihmuan Allahun dhe të Dërguarin e Tij, e me ta qëndron feja."><span class="w" data-sq="Dhe me fuqinë e dytë bëhet nga muhaxhirët muxhahidët në rrugën e Allahut,">وبالقوة الثانية يصير من المهاجرين المجاهدين في سبيل الله،</span> <span class="w" data-sq="që luftuan armiqtë e Tij dhe ndihmuan Allahun dhe të Dërguarin e Tij, e me ta qëndron feja.">الذين جاهدوا أعداءه ونصروا الله ورسوله، وبهم يقوم الدين.</span></span></p>

<p><span class="s" data-sq="Dhe shpeshherë i ndodh njeriut njëra prej dy fuqive pa tjetrën, e i prishet çështja sipas kësaj; andaj dijetarët këshilluan atë që merr postin e gjyqësorit e poste tjera: të jetë i fuqishëm pa ashpërsi, i butë pa dobësi, si shuplaka e njeriut ku bashkohen fuqia dhe butësia."><span class="w" data-sq="Dhe shpeshherë i ndodh njeriut njëra prej dy fuqive pa tjetrën, e i prishet çështja sipas kësaj;">وكثيرًا ما يحصل للرجل إحدى القوتين دون الأخرى، فيختلُّ من أمره بحسب ذلك؛</span> <span class="w" data-sq="andaj dijetarët këshilluan atë që merr postin: të jetë i fuqishëm pa ashpërsi, i butë pa dobësi,">ولهذا وصَّى العلماء لمن ولي القضاء وغيره من الولايات: أن يكون قويًّا من غير عنف، ليِّنًا من غير ضعف،</span> <span class="w" data-sq="si shuplaka e njeriut ku bashkohen fuqia dhe butësia.">بمنزلة كف الإنسان اجتمعت فيه القوة واللين،</span></span></p>

<p><span class="s" data-sq="nuk është i thatë në fuqinë e tij si kocka e guri, as i dobët në butësinë e tij si gjaku e uji; ngase kush është i fuqishëm mbi njerëzit por nuk është i fuqishëm mbi veten — që të jetë i butë, bujar, i duruar ndaj lëndimit të tyre — ka në te ngushtësi e shqetësim aq sa bëhet i padrejtë ndaj tyre e ndaj vetes, derisa mund ta shkatërrojë guximi i vet."><span class="w" data-sq="nuk është i thatë në fuqinë e tij si kocka e guri, as i dobët në butësinë e tij si gjaku e uji;">ليس يابسًا في قوته كالعظم والحجر، ولا ضعيفًا في ليِّنه كالدم والماء،</span> <span class="w" data-sq="ngase kush është i fuqishëm mbi njerëzit por nuk është i fuqishëm mbi veten, ka ngushtësi e shqetësim aq sa bëhet i padrejtë ndaj tyre.">فإنَّ مَن كان قويًّا على الناس ولم يكن قويًّا على نفسه حتى يكون حليمًا كريمًا ليِّنًا للناس صبورًا على أذاهم= كان فيه من الهَلَع والضيق</span> <span class="w" data-sq="aq sa bëhet i dëmshëm për ta e për veten, derisa mund ta shkatërrojë guximi i vet.">ما يصير به عاسفًا لهم ولنفسه حتى قد تهلكه شجاعته.</span></span></p>

<p><span class="s" data-sq="Dhe kush është i fuqishëm mbi veten, kundërshton epshin e vet, por nuk ka fuqi mbi njerëzit e pushtet t'i mbajë në të vërtetën — ata dalin nga e vërteta, nuk i kryejnë detyrimet e nuk i lënë haramet."><span class="w" data-sq="Dhe kush është i fuqishëm mbi veten, kundërshton epshin, por nuk ka fuqi mbi njerëzit e pushtet t'i mbajë në të vërtetën —">ومن كان قويًّا على نفسه مخالفًا لهواه، إلا أنه ليس فيه قوة على الناس وسلطان يحملهم به على الحق=</span> <span class="w" data-sq="ata dalin nga e vërteta, nuk i kryejnë detyrimet e nuk i lënë haramet.">خرجوا عن الحق، ولم يؤدوا الواجبات ولم يتركوا المحرَّمات.</span></span></p>

<p><span class="s" data-sq="Dhe mund të jenë dy njerëz të cilësuar me cilësi të lavdëruara, por njëri më i plotë se tjetri në disa; ngase halifët e drejtë, secili prej tyre ishte i cilësuar me virtytet që"><span class="w" data-sq="Dhe mund të jenë dy njerëz të cilësuar me cilësi të lavdëruara, por njëri më i plotë se tjetri në disa;">وقد يكون الرجلان مُتَّصِفَين بالصفات الحميدة، وبعضهم أكمل في</span> <span class="w" data-sq="ngase halifët e drejtë, secili prej tyre ishte i cilësuar me virtytet që">بعضها من بعض، فإن الخلفاء الراشدين كلُّ منهم موصوف بالفضائل التي</span></span></p>`},
// ===== Faqja 35: Uthmani e Aliu, hadithi i Irbadit (PDF fq. 37) =====
{html:`<p><span class="s" data-sq="i paraprinë me to krijesat; dhe Uthmani e Aliu, radijallahu anhuma, ishin me virtype të ndryshme në butësi e guxim, në asketizëm ndaj pasurisë e ndaj kryesisë, në xhihad me shpirt e me pasuri, në diturinë e Librit e të Sunnetit; shfaqet virtuti i njërit në njërin lloj ashtu siç shfaqet virtuti i tjetrit në llojin tjetër. Dhe ashtu siç shfaqet virtuti i Ebu Bekrit e Umerit mbi ta në përgjithësi, dhe virtuti i tyre — kënaqësia e Allahut qoftë mbi ta — mbi të gjithë të tjerët; dhe ashtu siç shfaqet udhëzimi i Muhammedit ﷺ mbi udhëzimin e Musait e Isait — salavatet e Allahut qofshin mbi ta."><span class="w" data-sq="i paraprinë me to krijesat; dhe Uthmani e Aliu ishin me virtype të ndryshme në butësi e guxim,">سبقوا بها الخلق، وكان عثمان وعلي رضي الله عنهما متفاضلَين في الحلم والشجاعة،</span> <span class="w" data-sq="në asketizëm ndaj pasurisë e ndaj kryesisë, në xhihad me shpirt e me pasuri, në diturinë e Librit e të Sunnetit;">وفي الزهد في المال والزهد في الرياسة، وفي الجهاد بالنفس والجهاد بالمال، وفي العلم بالكتاب والعلم بالسنة،</span> <span class="w" data-sq="shfaqet virtuti i njërit në njërin lloj ashtu siç shfaqet virtuti i tjetrit në llojin tjetër.">فيظهر فضل أحدهما في أحد النوعين كما يظهر فضل الآخر في النوع الآخر،</span> <span class="w" data-sq="Dhe ashtu siç shfaqet virtuti i Ebu Bekrit e Umerit mbi ta,">وكما يظهر فضل أبي بكر وعمر في عامة ذلك عليهما،</span> <span class="w" data-sq="dhe virtuti i tyre mbi të gjithë të tjerët;">وكما يظهر فضلهم — رضوان الله عليهم — على مَن سواهم في عامة ذلك،</span> <span class="w" data-sq="dhe ashtu siç shfaqet udhëzimi i Muhammedit ﷺ mbi udhëzimin e Musait e Isait, alejhimus-selam.">وكما يظهر هدي محمد ﷺ على هدي موسى وعيسى — صلوات الله عليهم أجمعين —.</span></span></p>

<p><span class="s" data-sq="Dhe këta katër janë ata që duhet myslimanët përgjithësisht, dhe dijetarët e emëruesit posaçërisht, të shikojnë në biografitë e tyre dhe të ndjekin udhëzimin e tyre pas Pejgamberit ﷺ."><span class="w" data-sq="Dhe këta katër janë ata që duhet myslimanët e dijetarët e emëruesit">وهؤلاء الأربعة هم الذين يجب على المسلمين عمومًا وعلى العلماء والأمراء خصوصًا</span> <span class="w" data-sq="të shikojnë në biografitë e tyre dhe të ndjekin udhëzimin e tyre pas Pejgamberit ﷺ.">أن ينظروا في سيرتهم ويقتدوا بهديهم بعد النبي ﷺ،</span></span> <span class="s" data-sq="ngase është vërtetuar në 'Sunen' nga Irbad ibnu Sarije se tha: Na mbajti hutbe i Dërguari i Allahut ﷺ, hutbe nga e cila rrodhën sytë e u dridhën zemrat, e tha njëri: O i Dërguar i Allahut, sikur kjo të jetë hutbe lamtumire, çka na porositë? Tha:">فإنه قد ثبت في «السنن» عن العِرْباض بن سارية أنه قال: خَطَبَنا رسول الله ﷺ خُطبة ذرفت منها العيون ووجِلَت منها القلوب، فقال قائل: يا رسول الله كأنَّ هذه خطبة مودِّع فماذا تَعْهَد إلينا؟ فقال:</span> <span class="s hadith" data-sq="«Ju porosis me devotshmëri ndaj Allahut, dhe me dëgjim e bindje; ngase kush jeton prej jush pas meje do të shohë kundërshtime të shumta, andaj mbahuni pas sunnetit tim dhe sunnetit të halifëve të drejtë e të udhëzuar pas meje, kapuni fort pas tyre dhe kafshojini me dhëmballë, dhe ruajuni nga risitë, ngase çdo risi është humbje.»"><span class="w" data-sq="«Ju porosis me devotshmëri ndaj Allahut, dhe me dëgjim e bindje;">«أوصيكم بتقوى الله تعالى وعليكم بالسمع والطاعة،</span> <span class="w" data-sq="ngase kush jeton prej jush pas meje do të shohë kundërshtime të shumta,">فإنه مَن يعش منكم بعدي فسيرى اختلافًا كثيرًا،</span> <span class="w" data-sq="andaj mbahuni pas sunnetit tim dhe sunnetit të halifëve të drejtë e të udhëzuar pas meje,">فعليكم بسنتي وسنة الخلفاء الراشدين المهديين من بعدي،</span> <span class="w" data-sq="kapuni fort pas tyre dhe kafshojini me dhëmballë, dhe ruajuni nga risitë, ngase çdo risi është humbje.»">تمسَّكوا بها وعضُّوا عليها بالنواجذ، وإيَّاكم ومحدَثات الأمور فإنَّ كل بدعة ضلالة».</span></span></p>`},
// ===== Faqja 36: Hilafeti 30 vjet, Umer ibnu Abdulazizi (PDF fq. 38) =====
{html:`<p><span class="s" data-sq="Dhe është vërtetuar gjithashtu në 'Sunen' nga Sefine, shërbëtori i Pejgamberit ﷺ, nga Pejgamberi ﷺ se tha:">وثبت أيضًا في «السنن» عن سفينة مولى النبي ﷺ عن النبي ﷺ أنه قال:</span> <span class="s hadith" data-sq="«Hilafeti pas meje do të jetë tridhjetë vjet, pastaj bëhet mbretëri.»">«تكون الخلافة من بعدي ثلاثين سنة ثم تصير مُلكًا».</span></p>

<p><span class="s" data-sq="Dhe Umer ibnu Abdulazizi, radijallahu anhu, të cilit i dëshmuan myslimanët se ishte halife i drejtë, thoshte: I Dërguari i Allahut ﷺ dhe udhëheqësit pas tij caktuan sunnete, marrja e të cilave është vërtetim i Librit të Allahut, plotësim i bindjes ndaj Allahut, dhe fuqi në fenë e Allahut; nuk ka të drejtë askush t'i ndryshojë, t'i zëvendësojë, as të shikojë në mendimin e atij që i kundërshton ato. Kush udhëzohet me to, ai është i udhëzuar; kush kërkon ndihmë me to, ai është i ndihmuar; e kush i kundërshton dhe ndjek rrugë tjetër nga ajo e besimtarëve, Allahu e lë atje ku u kthye, e e fus në Xhehennem — sa vendbanim i keq!"><span class="w" data-sq="Dhe Umer ibnu Abdulazizi, të cilit i dëshmuan myslimanët se ishte halife i drejtë, thoshte:">وكان عمر بن عبد العزيز رضي الله عنه الذي شهد له المسلمون بأنه كان خليفةً راشدًا يقول:</span> <span class="w" data-sq="I Dërguari i Allahut ﷺ dhe udhëheqësit pas tij caktuan sunnete, marrja e të cilave është vërtetim i Librit të Allahut, plotësim i bindjes ndaj Allahut, dhe fuqi në fenë e Allahut;">سنَّ رسول الله ﷺ وولاة الأمر بعده سننًا، الأخذُ بها تصديقٌ لكتاب الله، واستكمال لطاعة الله، وقوة على دين الله،</span> <span class="w" data-sq="nuk ka të drejtë askush t'i ndryshojë, t'i zëvendësojë, as të shikojë në mendimin e atij që i kundërshton ato.">ليس لأحد تغييرها ولا تبديلها ولا النظر في رأي مَن خالفها،</span> <span class="w" data-sq="Kush udhëzohet me to, ai është i udhëzuar; kush kërkon ndihmë me to, ai është i ndihmuar;">من اهتدى بها فهو مهتدي، ومن استنصر بها فهو منصور،</span> <span class="w" data-sq="e kush i kundërshton dhe ndjek rrugë tjetër nga ajo e besimtarëve, Allahu e lë atje ku u kthye, e e fus në Xhehennem — sa vendbanim i keq!">ومَن خالفها واتبع غير سبيل المؤمنين ولَّاه الله ما تولى وأصلاه جهنم وساءت مصيرًا.</span></span></p>

<p><span class="s" data-sq="Dhe këto tri baza: Libri i Allahut, Sunneti i të Dërguarit të Tij, dhe rruga e robërve besimtarë të Tij,">وهذه الأصول الثلاثة: كتاب الله، وسنة رسوله، وسبيل عباده المؤمنين،</span></p>`},
// ===== Faqja 37: Mbyllja e pjeses se pare (PDF fq. 39) =====
{html:`<p><span class="s" data-sq="janë feja e Allahut, dhe rruga e Tij e drejtë, dhe litari i Tij i fortë, i cili është feja më e mirë; dhe pasuesit e tij janë ummeti më i nderuar tek Allahu, dhe ummeti më i mirë i nxjerrë për njerëzit. Dhe iu detyruaun banorëve të tokës hyrja në te me dituri e vepër, ashtu që të mos nxirret prej tij ajo që ka hyrë, e të mos futet në te ajo që ka dalë."><span class="w" data-sq="janë feja e Allahut, rruga e Tij e drejtë, litari i Tij i fortë, i cili është feja më e mirë;">هي دين الله، وصراطه المستقيم، وحبله المتين، الذي هو أفضل الأديان،</span> <span class="w" data-sq="dhe pasuesit e tij janë ummeti më i nderuar tek Allahu, dhe ummeti më i mirë i nxjerrë për njerëzit.">وأهله أكرم الأمم على الله، وخير أُمةٍ أخرجت للناس،</span> <span class="w" data-sq="Dhe iu detyruaun banorëve të tokës hyrja në te me dituri e vepër, ashtu që të mos nxirret prej tij ajo që ka hyrë, e të mos futet në te ajo që ka dalë.">وأوجبت على أهل الأرض الدخول فيه علمًا وعملًا، بحيث لا يُخْرَج منه ما دخل فيه، ولا يُدْخَل فيه ما خرج منه.</span></span></p>

<p><span class="s" data-sq="E lusim Allahun e Madhërishëm të na udhëzojë në te krejt, dhe të na forcojë mbi te fshehtazi e haptas, si dhe gjithë vëllezërit tanë; Ai vërtet është Bujar e Fisnik."><span class="w" data-sq="E lusim Allahun e Madhërishëm të na udhëzojë në te krejt,">نسأل الله العظيم أن يهدينا إليه كلَّه،</span> <span class="w" data-sq="dhe të na forcojë mbi te fshehtazi e haptas, si dhe gjithë vëllezërit tanë;">ويُثَبِّتنا عليه باطنًا وظاهرًا، وسائر إخواننا</span> <span class="w" data-sq="Ai vërtet është Bujar e Fisnik.">إنه جواد كريم.</span></span></p>`},
// ===== Faqja 38: Fasl — Pasurite si amanet (PDF fq. 40) =====
{html:`<span class="fasl">فصل</span>

<p><span class="s" data-sq="Lloji i dytë i amaneteve: Pasuritë, siç tha Allahu i Lartësuar për borxhet:"><span class="w" data-sq="Lloji i dytë i amaneteve: Pasuritë,">القسم الثاني من الأمانات: الأموال،</span> <span class="w" data-sq="siç tha Allahu i Lartësuar për borxhet:">كما قال الله سبحانه وتعالى في الديون:</span></span> <span class="s quran" data-sq="E nëse i besoni njëri-tjetrit, atëherë ai të cilit i është besuar le ta kthejë atë që i është dhënë besë, dhe le t'i frikësohet All-llahut, Zotit të vet.">﴿فَإِنْ أَمِنَ بَعْضُكُم بَعْضًا فَلْيُؤَدِّ الَّذِي اؤْتُمِنَ أَمَانَتَهُ وَلْيَتَّقِ اللَّهَ رَبَّهُ﴾</span> <span class="s" data-sq="[El-Bekare: 283].">[البقرة: ٢٨٣].</span></p>

<p><span class="s" data-sq="Dhe hyjnë në këtë lloj: sendet, borxhet e veçanta e të përgjithshme, si depot, pasuria e ortakut, e agjentit, e tregtarit sipërmarrës, pasuria e jetimit, e vakëfit, e të ngjashme. Po ashtu edhe shlyerja e borxheve nga çmimet e shitjeve, e të dhënat e huasë, e pagat e shërbimeve, e të ngjashme."><span class="w" data-sq="Dhe hyjnë në këtë lloj: sendet, borxhet e veçanta e të përgjithshme,">ويدخل في هذا القسم: الأعيان، والديون الخاصة والعامة،</span> <span class="w" data-sq="si depot, pasuria e ortakut, e agjentit, e tregtarit sipërmarrës, pasuria e jetimit,">مثل رد الودائع، ومال الشريك، والمُوَكَّل، والمضارب، ومال المُولَّى من اليتيم</span> <span class="w" data-sq="e vakëfit, e të ngjashme. Po ashtu shlyerja e borxheve nga çmimet e shitjeve, huatë, pagat, e të ngjashme.">وأهل الوقف، ونحو ذلك. وكذلك وفاء الديون من أثمان المبيعات، وبدل القرض، وصَدُقات النساء، وأجور المنافع، ونحو ذلك.</span></span></p>

<p><span class="s" data-sq="Dhe tha Allahu i Lartësuar:">وقد قال الله سبحانه وتعالى:</span> <span class="s quran" data-sq="Njeriu, vërtet, është i krijuar me natyra të dobët. Kur e godet e keqja, ai ankohet shumë. E kur i vjen e mira, ai bëhet koprrac. Përveç atyre që janë të rregullt në namazin e tyre, edhe ata që në pasuritë e tyre kanë hak të caktuar — për lypësin dhe nevojtarin... deri tek fjala e Tij: Edhe ata që i ruajnë amanetin dhe premtimin."><span class="w" data-sq="Njeriu, vërtet, është i krijuar me natyra të dobët. Kur e godet e keqja, ai ankohet shumë. E kur i vjen e mira, ai bëhet koprrac.">﴿إِنَّ الْإِنسَانَ خُلِقَ هَلُوعًا إِذَا مَسَّهُ الشَّرُّ جَزُوعًا وَإِذَا مَسَّهُ الْخَيْرُ مَنُوعًا</span> <span class="w" data-sq="Përveç atyre që janë të rregullt në namazin e tyre, edhe ata që në pasuritë e tyre kanë hak të caktuar — për lypësin dhe nevojtarin">إِلَّا الْمُصَلِّينَ الَّذِينَ هُمْ عَلَىٰ صَلَاتِهِمْ دَائِمُونَ... حَقٌّ مَعْلُومٌ لِّلسَّائِلِ وَالْمَحْرُومِ</span></span> <span class="w" data-sq="deri tek fjala e Tij: Edhe ata që i ruajnë amanetin dhe premtimin.">إلى قوله: ﴿وَالَّذِينَ هُمْ لِأَمَانَاتِهِمْ وَعَهْدِهِمْ رَاعُونَ﴾</span></span> <span class="s" data-sq="[El-Mearixh: 19-32], dhe fjala e Tij:">[المعارج: ١٩-٣٢]، وقوله تعالى:</span> <span class="s quran" data-sq="Ne ta zbritëm ty librin me plot të vërteta, që të gjykosh mes njerëzve me atë që të mëson All-llahu, e ti mos u bëj mbrojtës tradhtarëve.">﴿إِنَّا أَنزَلْنَا إِلَيْكَ الْكِتَابَ بِالْحَقِّ لِتَحْكُمَ بَيْنَ النَّاسِ بِمَا أَرَاكَ اللَّهُ وَلَا تَكُن لِّلْخَائِنِينَ خَصِيمًا﴾</span> <span class="s" data-sq="[En-Nisa: 105], domethënë: mos u grindu për ta.">[النساء: ١٠٥]، أي: لا تخاصم عنهم.</span></p>

<p><span class="s" data-sq="Dhe tha Pejgamberi ﷺ:">وقال النبي ﷺ:</span> <span class="s hadith" data-sq="«Ktheja amanetin atij që ta ka besuar, dhe mos e tradhto atë që të ka tradhtuar.»">«أدِّ الأمانة إلى من ائتمنك ولا تخن مَن خانك»</span> <span class="s" data-sq="transmetuan pasuesit e Suneneve.">رواه أهل «السنن».</span></p>`},
// ===== Faqja 39: Hadithet e besimtarit, pasurise (PDF fq. 41) =====
{html:`<p><span class="s" data-sq="Dhe tha ﷺ:">وقال ﷺ:</span> <span class="s hadith" data-sq="«Besimtar është ai nga i cili janë të sigurt myslimanët për gjakun dhe pasurinë e tyre; mysliman është ai nga gjuha dhe dora e të cilit janë të sigurt myslimanët; muhaxhir është ai që braktis atë që e ndaloi Allahu; dhe muxhahid është ai që lufton veten e vet për Allahun.»"><span class="w" data-sq="«Besimtar është ai nga i cili janë të sigurt myslimanët për gjakun dhe pasurinë e tyre;">«المؤمن من أمِنَه المسلمون على دمائهم وأموالهم،</span> <span class="w" data-sq="mysliman është ai nga gjuha dhe dora e të cilit janë të sigurt myslimanët;">والمسلم مَن سلم المسلمون من لسانه ويده،</span> <span class="w" data-sq="muhaxhir është ai që braktis atë që e ndaloi Allahu;">والمهاجر مَن هَجَر ما نهى الله عنه،</span> <span class="w" data-sq="dhe muxhahid është ai që lufton veten e vet për Allahun.»">والمجاهد من جاهد نفسَه في ذات الله».</span></span> <span class="s" data-sq="Dhe ai është hadith i saktë, disa prej tij janë në dy Sahihat, dhe disa i saktësoi Tirmidhiu.">وهو حديث صحيح بعضه في «الصحيحين» وبعضه صحَّحَه الترمذي.</span></p>

<p><span class="s" data-sq="Dhe tha ﷺ:">وقال ﷺ:</span> <span class="s hadith" data-sq="«Kush merr pasuritë e njerëzve duke dashur t'ua kthejë, ia kthen Allahu; e kush i merr duke dashur t'i shkatërrojë, e shkatërron Allahu.»">«مَن أخَذ أموالَ الناس يريدُ أداءَها أدَّاها الله عنه، ومَن أخَذها يريدُ إتلافَها أتلفَه الله»</span> <span class="s" data-sq="transmetoi Buhariu.">رواه البخاري.</span></p>`},
// ===== Faqja 40: Detyrimi i kthimit, hutbja e lamtumires (PDF fq. 42) =====
{html:`<p><span class="s" data-sq="E kur Allahu i Lartësuar ka detyruar kthimin e amaneteve të marra me të drejtë, kjo tregon edhe detyrimin e kthimit të grabitjes, vjedhjes, tradhtisë e padrejtësive të ngjashme, si dhe kthimin e sendit të huazuar."><span class="w" data-sq="E kur Allahu i Lartësuar ka detyruar kthimin e amaneteve të marra me të drejtë, kjo tregon edhe detyrimin e kthimit të padrejtësive,">وإذا كان الله تعالى قد أوجب أداء الأمانات التي قُبِضَت بحق ففيه تنبيه على وجوب أداء الغَصْب والسرقة والخيانة ونحو ذلك من المظالم،</span> <span class="w" data-sq="si dhe kthimin e sendit të huazuar.">وكذلك أداء العاريَّة.</span></span> <span class="s" data-sq="Dhe mbajti hutbe Pejgamberi ﷺ në haxhin e lamtumirës, e tha në hutben e tij:">وقد خطب النبي ﷺ في حجة الوداع، وقال في خطبته:</span> <span class="s hadith" data-sq="«Sendi i huazuar kthehet, dhurata kthehet, borxhi shlyhet, dhe garanti paguan. Allahu ia ka dhënë secilit të drejtën e tij, andaj nuk ka testament për trashëgimtarin.»">«العارية مؤدَّاة، والمنحة مردودة، والدَّيْن مقضيٌّ، والزعيم غارم، إن الله قد أعطى كلَّ ذي حقٍّ حقَّه فلا وصيةَ لوارث».</span></p>

<p><span class="s" data-sq="Dhe ky lloj përfshin bariun dhe kopenë: secili prej tyre duhet t'ia japë tjetrit atë që i detyrohet; andaj çdo sundimtar dhe zëvendës i tij në dhënie duhet t'ia japë secilit hakun e tij, dhe mbledhësit e pasurive — si nëpunësit e financës — duhet t'ia japin secilit"><span class="w" data-sq="Dhe ky lloj përfshin bariun dhe kopenë: secili prej tyre duhet t'ia japë tjetrit atë që i detyrohet;">وهذا القسم يتناول الرُّعاة والرعية، فعلى كلٍّ منهما أن يؤدي إلى الآخر ما يجب أداؤه إليه؛</span> <span class="w" data-sq="andaj çdo sundimtar dhe zëvendës i tij në dhënie duhet t'ia japë secilit hakun e tij,">فعلى كل ذي السلطان ونُوَّابه في العطاء أن يؤتوا كلَّ ذي حقٍّ حقَّه،</span> <span class="w" data-sq="dhe mbledhësit e pasurive — si nëpunësit e financës — duhet t'ia japin secilit">وعلى جُباة الأموال — كأهل الديوان — أن يؤدوا إلى كل ذي</span></span></p>`},
// ===== Faqja 41: Populli s'kerkon me shume, Et-Teube, Beni Israilet (PDF fq. 43) =====
{html:`<p><span class="s" data-sq="sundimtarit atë që duhet t'ia japin, po ashtu edhe popullsisë i detyrohen hakët."><span class="w" data-sq="sundimtarit atë që duhet t'ia japin,">السلطان ما يجب إيتاؤه إليه،</span> <span class="w" data-sq="po ashtu edhe popullsisë i detyrohen hakët.">وكذلك على الرعية الذين تجب عليهم الحقوق.</span></span></p>

<p><span class="s" data-sq="Dhe nuk ka të drejtë populli të kërkojë nga udhëheqësit e pasurive atë që nuk e meriton, e kështu bëhen nga ata për të cilët tha Allahu i Lartësuar:">وليس للرعية أن يطلبوا من ولاة الأموال ما لا يستحقونه، فيكونون من جنس مَن قال الله سبحانه وتعالى فيه:</span> <span class="s quran" data-sq="Ka prej tyre që të qortojnë ty për lëmoshat. Nëse u jepet atyre prej tyre, ata kënaqen; e nëse nuk u jepet, ata hidhërohen. E sikur ata të kënaqeshin me atë që u dha All-llahu dhe i dërguari i Tij, e të thoshin: na mjafton All-llahu, do të na japë All-llahu prej të mirave të Tij, ne vetëm te All-llahu mbështetemi. Lëmoshat (zekati) janë vetëm për të varfrit, për nevojtarët..."><span class="w" data-sq="Ka prej tyre që të qortojnë ty për lëmoshat.">﴿وَمِنْهُم مَّن يَلْمِزُكَ فِي الصَّدَقَاتِ</span> <span class="w" data-sq="Nëse u jepet atyre prej tyre, ata kënaqen; e nëse nuk u jepet, ata hidhërohen.">فَإِنْ أُعْطُوا مِنْهَا رَضُوا وَإِن لَّمْ يُعْطَوْا مِنْهَا إِذَا هُمْ يَسْخَطُونَ</span> <span class="w" data-sq="E sikur ata të kënaqeshin me atë që u dha All-llahu dhe i dërguari i Tij... ne vetëm te All-llahu mbështetemi.">وَلَوْ أَنَّهُمْ رَضُوا مَا آتَاهُمُ اللَّهُ وَرَسُولُهُ وَقَالُوا حَسْبُنَا اللَّهُ... إِنَّا إِلَى اللَّهِ رَاغِبُونَ</span> <span class="w" data-sq="Lëmoshat janë vetëm për të varfrit, për nevojtarët...">إِنَّمَا الصَّدَقَاتُ لِلْفُقَرَاءِ وَالْمَسَاكِينِ﴾</span></span> <span class="s" data-sq="[Et-Teube: 58-60].">[التوبة: ٥٨-٦٠].</span></p>

<p><span class="s" data-sq="Dhe nuk kanë të drejtë ta ndalojnë sundimtarin nga hakët që duhet t'i japin, siç urdhëroi Pejgamberi ﷺ kur përmendi padrejtësinë e udhëheqësve, e tha:"><span class="w" data-sq="Dhe nuk kanë të drejtë ta ndalojnë sundimtarin nga hakët që duhet t'i japin,">ولا لهم أن يمنعوا السلطان ما يجب دفعه من الحقوق</span> <span class="w" data-sq="siç urdhëroi Pejgamberi ﷺ kur përmendi padrejtësinë e udhëheqësve, e tha:">وإن كان ظالمًا كما أمر النبي ﷺ لما ذكر جَوْر الولاة، فقال:</span></span> <span class="s hadith" data-sq="«Jepuani atyre hakun e tyre, ngase Allahu do t'i pyesë për atë që ju ka ngarkuar.»">«أدوا إليهم حقَّهم، فإن الله سائلهم عما استرعاهم».</span> <span class="s" data-sq="Në dy Sahihat nga Ebu Hurejre, radijallahu anhu, nga Pejgamberi ﷺ se tha:">ففي «الصحيحين» عن أبي هريرة رضي الله عنه عن النبي ﷺ قال:</span> <span class="s hadith" data-sq="«Beni Israilët i qeverisnin pejgamberët, sa herë vdiste ndonjë pejgamber e zëvendësonte pejgamber tjetër; e unë nuk kam pejgamber pas meje, por do të ketë halifë e do të jenë shumë.»"><span class="w" data-sq="«Beni Israilët i qeverisnin pejgamberët, sa herë vdiste ndonjë pejgamber e zëvendësonte pejgamber tjetër;">«كانت بنو إسرائيل تسوسهم الأنبياء، كلما هلك نبيٌّ خَلَفَه</span> <span class="w" data-sq="e unë nuk kam pejgamber pas meje, por do të ketë halifë e do të jenë shumë.»">نبيّ، وإنه لا نبيّ بعدي، وسيكون خلفاء فتكثر»</span></span> <span class="s" data-sq="Thanë: Çka na urdhëron? Tha:">قالوا: فما تأمرنا؟ فقال:</span></p>`},
// ===== Faqja 42: Besatimi, ndarja e pasurise, Umeri (PDF fq. 44) =====
{html:`<p><span class="s hadith" data-sq="«Plotësojani besatimin e të parit pastaj të parit, pastaj jepuani hakun e tyre, ngase Allahu do t'i pyesë për atë që u ka ngarkuar.»">«فوا بيعة الأول فالأول، ثم أعطوهم حقهم، فإن الله سائلهم عما استرعاهم».</span></p>

<p><span class="s" data-sq="Dhe në to dy nga Ibnu Mes'udi, radijallahu anhu, tha: Na tha i Dërguari i Allahut ﷺ:">وفيهما عن ابن مسعود رضي الله عنه قال: قال لنا رسول الله ﷺ:</span> <span class="s hadith" data-sq="«Ju do të shihni pas meje favorizim e çështje që i kundërshtoni.» Thanë: Çka na urdhëron o i Dërguar i Allahut? Tha: «Jepuani atyre hakun e tyre, dhe kërkojani Allahut hakun tuaj.»"><span class="w" data-sq="«Ju do të shihni pas meje favorizim e çështje që i kundërshtoni.»">«إنكم سترون بعدي أَثَرَةً وأمورًا تنكرونها»</span> <span class="w" data-sq="Thanë: Çka na urdhëron o i Dërguar i Allahut? Tha:">قالوا: فما تأمرنا يا رسول الله؟ قال:</span> <span class="w" data-sq="«Jepuani atyre hakun e tyre, dhe kërkojani Allahut hakun tuaj.»">«أدوا إليهم حقَّهم، واسألوا الله حقَّكم».</span></span></p>

<p><span class="s" data-sq="Dhe nuk kanë të drejtë udhëheqësit e pasurive t'i ndajnë sipas epsheve të tyre ashtu siç ndan pronari pronën e tij, ngase ata janë besnikë, zëvendës e agjentë, jo pronarë; tha i Dërguari i Allahut ﷺ:"><span class="w" data-sq="Dhe nuk kanë të drejtë udhëheqësit e pasurive t'i ndajnë sipas epsheve të tyre ashtu siç ndan pronari pronën e tij,">وليس لولاة الأموال أن يقسموها بحسب أهوائهم كما يقسم المالكُ ملكه،</span> <span class="w" data-sq="ngase ata janë besnikë, zëvendës e agjentë, jo pronarë; tha i Dërguari i Allahut ﷺ:">فإنما هم أُمَناء ونُوَّاب ووُكَلاء، ليسوا مُلَّاكًا، قال رسول الله ﷺ:</span></span> <span class="s hadith" data-sq="«Pasha Allahun, nuk i jap askujt e nuk e ndaloj askënd, unë jam vetëm ndarës — e vë aty ku jam urdhëruar.»">«إني والله لا أعطي أحدًا ولا أمنع أحدًا، وإنما أنا قاسم أضع حيثُ أُمِرت»</span> <span class="s" data-sq="transmetoi Buhariu.">رواه البخاري.</span></p>

<p><span class="s" data-sq="Ky pra është i Dërguari i Zotit të botëve, tregoi se nuk është dhënia e ndalimi sipas dëshirës e zgjedhjes së tij, ashtu siç bën pronari i pasurisë së vet, por ai e ndan pasurinë me urdhrin e Allahut, e e vendos aty ku e urdhëron Allahu."><span class="w" data-sq="Ky pra është i Dërguari i Zotit të botëve, tregoi se nuk është dhënia e ndalimi sipas dëshirës e zgjedhjes së tij,">فهذا رسولُ ربِّ العالمين قد أخبر أنه ليس المنع والعطاء بإرادته واختياره،</span> <span class="w" data-sq="por ai e ndan pasurinë me urdhrin e Allahut, e e vendos aty ku e urdhëron Allahu.">كما يفعل ذلك المالك الذي أُبيح له التصرف في ماله،</span></span></p>

<p><span class="s" data-sq="Dhe kështu i tha njëri Umer ibnu'l-Hattabit, radijallahu anhu: O emër i besimtarëve, sikur ta zgjeroje harxhimin për veten nga pasuria e Allahut? Umeri i tha: A e di çka"><span class="w" data-sq="Dhe kështu i tha njëri Umer ibnu'l-Hattabit, radijallahu anhu:">وهكذا قال رجل لعمر بن الخطاب رضي الله عنه:</span> <span class="w" data-sq="O emër i besimtarëve, sikur ta zgjeroje harxhimin për veten nga pasuria e Allahut?">يا أمير المؤمنين لو وسَّعْتَ على نفسك في النفقة من مال الله تعالى؟</span> <span class="w" data-sq="Umeri i tha: A e di çka">فقال له عمر: أتدري ما</span></span></p>`},
// ===== Faqja 43: Tregimi i Umerit, tregu, Aliu (PDF fq. 45) =====
{html:`<p><span class="s" data-sq="shëmbëlltyra ime dhe e këtyre? Si disa njerëz që ishin në udhëtim, mblodhën prej tyre pasuri dhe ia dorëzuan njërit ta shpenzojë për ta; a i lejohet atij njeriu ta favorizojë veten nga pasuritë e tyre?!"><span class="w" data-sq="shëmbëlltyra ime dhe e këtyre? Si disa njerëz që ishin në udhëtim,">مَثَلي ومَثَل هؤلاء؟ كمثل قوم كانوا في سفر،</span> <span class="w" data-sq="mblodhën prej tyre pasuri dhe ia dorëzuan njërit ta shpenzojë për ta;"> فجمعوا منهم مالًا وسلَّموه إلى واحد ينفقه عليهم،</span> <span class="w" data-sq="a i lejohet atij njeriu ta favorizojë veten nga pasuritë e tyre?!">فهل يحلُّ لذلك الرجل أن يستأثر عنهم من أموالهم؟!</span></span></p>

<p><span class="s" data-sq="Dhe njëherë iu soll Umer ibnu'l-Hattabit, radijallahu anhu, pasuri e madhe nga e pesta, e tha: Njerëzit që e sollën amanetin në këtë janë besnikë. Dikush nga të pranishmit i tha: Ti ia ktheve amanetin Allahut të Lartësuar, andaj edhe ata ta kthyen amanetin ty; e sikur ti të shpërdoroje, edhe ata do ta shpërdoronin."><span class="w" data-sq="Dhe njëherë iu soll Umer ibnu'l-Hattabit, radijallahu anhu, pasuri e madhe nga e pesta, e tha:">وحُمِل مرةً إلى عمر بن الخطاب رضي الله عنه مال عظيم من الخمس فقال:</span> <span class="w" data-sq="Njerëzit që e sollën amanetin në këtë janë besnikë.">إن قومًا أدوا الأمانة في هذا لأمناء،</span> <span class="w" data-sq="Dikush nga të pranishmit i tha: Ti ia ktheve amanetin Allahut, andaj edhe ata ta kthyen amanetin ty; e sikur ti të shpërdoroje, edhe ata do ta shpërdoronin.">فقال له بعض الحاضرين: إنك أديت الأمانة إلى الله تعالى فأدوا إليك الأمانة، ولو رَتَعتَ لرَتَعوا.</span></span></p>

<p><span class="s" data-sq="Dhe duhet ditur se udhëheqësi është si tregu: çka shitet në të, ajo sillet. Tha Umer ibnu Abdu'l-Aziz: Nëse shitet në të ndershmëria, mirësia, drejtësia e besnikëria, ajo sillet; e nëse shitet në të gënjeshtra, imoraliteti, padrejtësia e tradhtia, ajo sillet."><span class="w" data-sq="Dhe duhet ditur se udhëheqësi është si tregu: çka shitet në të, ajo sillet.">وينبغي أن يُعرَف أن ولي الأمر كالسوق ما نَفَق فيه جُلِب إليه،</span> <span class="w" data-sq="Tha Umer ibnu Abdu'l-Aziz: Nëse shitet ndershmëria, mirësia, drejtësia e besnikëria, ajo sillet; e nëse shitet gënjeshtra, padrejtësia e tradhtia, ajo sillet.">قال عمر بن عبد العزيز، فإن نَفَق فيه الصدق والبر والعدل والأمانة جُلِب إليه ذلك، وإن نفق فيه الكذب والفجور والجَوْر والخيانة جُلِبَ إليه ذلك.</span></span></p>

<p><span class="s" data-sq="Dhe detyra e udhëheqësit është: ta marrë pasurinë nga e lejuara, ta vendosë në vendin e duhur, dhe mos ta ndalojë nga ai që e meriton.">والذي على وليّ الأمر: أن يأخذ المال من حِلِّه، ويضعه في حقِّه، ولا يمنعه من مُستحقِّه.</span></p>

<p><span class="s" data-sq="Dhe Aliu ibnu Ebi Talib, radijallahu anhu, kur e merrte vesh se ndonjë zëvendës i tij bënte padrejtësi, thoshte: O Allah, unë nuk i urdhërova ata ta shtypnin krijesën Tënde ose ta braktisnin hakun Tënd."><span class="w" data-sq="Dhe Aliu ibnu Ebi Talib, radijallahu anhu, kur e merrte vesh se ndonjë zëvendës i tij bënte padrejtësi, thoshte:">وكان علي بن أبي طالب رضي الله عنه إذا بلغه أن بعض نوابه ظَلَم يقول:</span> <span class="w" data-sq="O Allah, unë nuk i urdhërova ata ta shtypnin krijesën Tënde ose ta braktisnin hakun Tënd.">اللهم إني لم آمرهم أن يظلموا خلقك أو يتركوا حقك.</span></span></p>`},
// ===== Faqja 44: Fasli - Pasuritë sulltanore, ganimeti, El-Enfal (PDF fq. 46) =====
{html:`<p class="fsep">❖ ❖ ❖</p>
<h2><span class="s" data-sq="Kapitulli">فصل</span></h2>

<p><span class="s" data-sq="Pasuritë sulltanore që kanë bazë në Libër e Sunet janë tri lloje: ganimeti, sadakaja dhe fej-i (pasuria publike)."><span class="w" data-sq="Pasuritë sulltanore që kanë bazë në Libër e Sunet">الأموال السلطانية التي أصلها في الكتاب والسنة</span> <span class="w" data-sq="janë tri lloje: ganimeti, sadakaja dhe fej-i.">ثلاثة أصناف: الغنيمة، والصدقة، والفيء.</span></span></p>

<p><span class="s" data-sq="Sa i përket ganimetit: ai është pasuria e marrë nga jobesimtarët me luftë, e përmendi Allahu i Lartësuar në suren El-Enfal që u shpall në betejën e Bedrit, e u quajtën enfal ngase ishin shtesë në pasuritë e myslimanëve."><span class="w" data-sq="Sa i përket ganimetit: ai është pasuria e marrë nga jobesimtarët me luftë,">فأما الغنيمة: فهي المال المأخوذ من الكفار بالقتال،</span> <span class="w" data-sq="e përmendi Allahu i Lartësuar në suren El-Enfal që u shpall në betejën e Bedrit, e u quajtën enfal ngase ishin shtesë.">ذكرها الله سبحانه وتعالى في سورة الأنفال التي أُنزِلت في غزوة بدر، وسُمِّيت أنفالًا؛ لأنها زيادة في أموال المسلمين</span></span> <span class="s" data-sq="e tha:">فقال:</span> <span class="s quran" data-sq="Të pyesin ty për plaçkën e luftës. Thuaj: Plaçka e luftës është e All-llahut dhe e të dërguarit.">﴿يَسْأَلُونَكَ عَنِ الْأَنفَالِ قُلِ الْأَنفَالُ لِلَّهِ وَالرَّسُولِ﴾</span> <span class="s" data-sq="deri ku tha:">إلى أن قال:</span> <span class="s quran" data-sq="Dhe ta dini se çkado që fitoni, një e pesta e tij është e All-llahut, e të dërguarit, dhe e të afërmve, e jetimëve, e nevojtarëve dhe e udhëtarit...">﴿وَاعْلَمُوا أَنَّمَا غَنِمْتُم مِّن شَيْءٍ فَأَنَّ لِلَّهِ خُمُسَهُ وَلِلرَّسُولِ وَلِذِى الْقُرْبَى وَالْيَتَامَى وَالْمَسَاكِينِ وَابْنِ السَّبِيلِ...﴾</span> <span class="s" data-sq="[El-Enfal: 1-41].">[الأنفال: ١-٤١]،</span></p>

<p><span class="s" data-sq="dhe tha gjatë saj:">وقال في أثنائها:</span> <span class="s quran" data-sq="Hani pra nga ajo që e fituat, që është hallall e e mirë, e kini frikë All-llahun, vërtet All-llahu falë shumë, është mëshirues.">﴿فَكُلُوا مِمَّا غَنِمْتُمْ حَلَالًا طَيِّبًا وَاتَّقُوا اللَّهَ إِنَّ اللَّهَ غَفُورٌ رَّحِيمٌ﴾</span> <span class="s" data-sq="[El-Enfal: 69].">[الأنفال: ٦٩].</span></p>

<p><span class="s" data-sq="Dhe në dy Sahihat nga Xhabir ibnu Abdil-lah, radijallahu anhuma, se Pejgamberi ﷺ tha:">وفي «الصحيحين» عن جابر بن عبد الله رضي الله عنهما أن النبي ﷺ قال:</span> <span class="s hadith" data-sq="«M'u dhanë pesë gjëra që nuk i janë dhënë asnjë pejgamberi para meje: u ndihmova me frikë një muaj udhëtim; m'u bë toka xhami e pastruese, andaj kushdo nga ummeti im që e arrin namazin le të falet; m'u lejuan ganimetët e nuk i janë lejuar askujt para meje; m'u dha shefaati; dhe çdo pejgamber dërgohej te populli i vet ndërsa unë u dërgova te njerëzit përgjithësisht.»"><span class="w" data-sq="«M'u dhanë pesë gjëra që nuk i janë dhënë asnjë pejgamberi para meje:">«أُعطيتُ خمسًا لم يُعطَهُنَّ نبيٌّ قبلي:</span> <span class="w" data-sq="u ndihmova me frikë një muaj udhëtim; m'u bë toka xhami e pastruese,">نُصِرتُ بالرُّعب مسيرةَ شهر، وجُعِلت لي الأرضُ مسجدًا وطهورًا،</span> <span class="w" data-sq="andaj kushdo nga ummeti im që e arrin namazin le të falet;">فأيما رجل من أمتي أدركته الصلاة فليصل،</span> <span class="w" data-sq="m'u lejuan ganimetët e nuk i janë lejuar askujt para meje;">وأُحِلَّت لي الغنائم ولم تُحَلَّ لأحد قبلي،</span> <span class="w" data-sq="m'u dha shefaati; dhe çdo pejgamber dërgohej te populli i vet ndërsa unë u dërgova te njerëzit përgjithësisht.»">وأُعطيتُ الشفاعة، وكان النبيُّ يُبعَث إلى قومه خاصة وبُعِثتُ إلى الناس عامة».</span></span></p>`},
// ===== Faqja 45: Hadithi i shpatës, ndarja e ganimetit (PDF fq. 47) =====
{html:`<p><span class="s" data-sq="Dhe tha Pejgamberi ﷺ:">وقال النبي ﷺ:</span> <span class="s hadith" data-sq="«U dërgova me shpatë para Kiametit derisa të adhurohet Allahu i vetëm pa shoq; m'u bë furnizimi im nën hijen e shtizës sime; u bë poshtërimi e përçmimi mbi atë që kundërshton urdhrin tim; dhe kush i përngjan ndonjë populli, ai është prej tyre.»"><span class="w" data-sq="«U dërgova me shpatë para Kiametit derisa të adhurohet Allahu i vetëm pa shoq;">«بُعِثتُ بالسيف بين يدي الساعة حتى يُعبَد الله وحده لا شريك له،</span> <span class="w" data-sq="m'u bë furnizimi im nën hijen e shtizës sime;">وجُعِل رزقي تحت ظلِّ رمحي،</span> <span class="w" data-sq="u bë poshtërimi e përçmimi mbi atë që kundërshton urdhrin tim;">وجُعِل الذلةُ والصَّغَارُ على مَن خالف أمري،</span> <span class="w" data-sq="dhe kush i përngjan ndonjë populli, ai është prej tyre.»">ومَن تشبَّه بقوم فهو منهم».</span></span> <span class="s" data-sq="Transmetoi Ahmedi në «Musned» nga Ibnu Umeri.">رواه أحمد في «المسند» عن ابن عمر.</span></p>

<p><span class="s" data-sq="Dhe detyra në ganimetin e luftës është nxjerrja e një të pestës, shpenzimi i të pestës te ata që i përmendi Allahu i Lartësuar, dhe ndarja e pjesës tjetër mes luftëtarëve. Tha Umer ibnu'l-Hattab, radijallahu anhu: Ganimeti i takon atij që ka qenë në betejë."><span class="w" data-sq="Dhe detyra në ganimetin e luftës është nxjerrja e një të pestës, shpenzimi i të pestës te ata që i përmendi Allahu i Lartësuar,">والواجب في المَغْنَم تخميسه، وصرف الخُمُس إلى من ذكره الله تعالى،</span> <span class="w" data-sq="dhe ndarja e pjesës tjetër mes luftëtarëve.">وقِسْمةُ الباقي بين الغانمين.</span> <span class="w" data-sq="Tha Umer ibnu'l-Hattab, radijallahu anhu: Ganimeti i takon atij që ka qenë në betejë.">قال عمر بن الخطاب رضي الله عنه: الغنيمة لمن شَهِد الوقعة.</span></span></p>`},
// ===== Faqja 46: Ndarja me drejtësi, hadithi i dobëtëve, nefeli (PDF fq. 48) =====
{html:`<p><span class="s" data-sq="Ata janë që ishin të pranishëm për luftë, qoftë se luftuan ose jo, dhe duhet ndarë mes tyre me drejtësi; nuk favorizohet askush as për udhëheqësinë e tij, as për prejardhjen, as për vlerat e tij, ashtu siç bënin Pejgamberi ﷺ e halifët e tij."><span class="w" data-sq="Ata janë që ishin të pranishëm për luftë, qoftë se luftuan ose jo,">وهم الذين شهدوها للقتال، قاتلوا أو لم يقاتلوا،</span> <span class="w" data-sq="dhe duhet ndarë mes tyre me drejtësi; nuk favorizohet askush as për udhëheqësinë, as për prejardhjen, as për vlerat e tij,">ويجب قَسْمُها بينهم بالعدل، فلا يُحَابَى أحدٌ لا لرياسته ولا لنَسَبِه ولا لفضله،</span> <span class="w" data-sq="ashtu siç bënin Pejgamberi ﷺ e halifët e tij.">كما كان النبي ﷺ وخلفاؤه يقسمونها.</span></span></p>

<p><span class="s" data-sq="Dhe në «Sahih el-Buhari» tregohet se Sa'd ibnu Ebi Vekkasi e konsideronte veten me epërsi mbi ata nën të, e Pejgamberi ﷺ tha:">وفي «صحيح البخاري» أن سعد بن أبي وقاص رأى له فضلًا على مَن دونه، فقال النبي ﷺ:</span> <span class="s hadith" data-sq="«A ndiheni e furnizoheni ndryshe veçse me anë të dobëtëve tuaj?»">«هل تُنصَرون وتُرزَقون إلا بضعفائكم».</span></p>

<p><span class="s" data-sq="Dhe në «Musned-in e Ahmedit» nga Sa'd ibnu Ebi Vekkasi tha: O i Dërguar i Allahut, njeriu që është mbrojtës i popullit, a t'i jetë hisja e tij si e tjerëve njësoj?! Tha:">وفي «مسند أحمد» عن سعد بن أبي وقاص قال: قلت: يا رسول الله، الرجلُ يكون حاميةَ القوم، فيكون سهمه وسهم غيره سواء؟! قال:</span> <span class="s hadith" data-sq="«Të vdektë nëna, o ibnu ummi Sa'd! A furnizoheni e ndihmeni ndryshe veçse me anë të dobëtëve tuaj?»">«ثَكِلَتكَ أُمُّكَ ابن أم سعد، وهل تُرْزَقون وتُنصَرون إلا بضعفائكم؟».</span></p>

<p><span class="s" data-sq="Dhe ganimetët vazhduan të ndaheshin mes luftëtarëve në kohën e Beni Umejjeve e Beni Abbasëve, kur myslimanët luftonin romakët, turqit e berberët; por imamit i lejohet ta shpërblejë me shtesë atë nga i cili shfaqet ndonjë ndihmesë e veçantë: si ndonjë çetë e ndarë nga ushtria, ose njeri që ngjiti murin e kështjellës e e çliroi, ose sulmon komandantin e armikut e e mbyti e u thye armiku, e gjëra të tilla;"><span class="w" data-sq="Dhe ganimetët vazhduan të ndaheshin mes luftëtarëve në kohën e Beni Umejjeve e Beni Abbasëve,">وما زالت الغنائم تُقسَم بين الغانمين في دولة بني أمية وبني العباس،</span> <span class="w" data-sq="kur myslimanët luftonin romakët, turqit e berberët; por imamit i lejohet ta shpërblejë me shtesë">لمَّا كان المسلمون يغزون الروم والترك والبربر، لكن يجوز للإمام أن يُنَفِّل من</span> <span class="w" data-sq="atë nga i cili shfaqet ndihmesë e veçantë: si çetë e ndarë nga ushtria, ose njeri që ngjiti murin,">ظهر منه زيادة نِكاية، كسَرِيَّةٍ تَسَرَّت من الجيش، أو رجل صعد حصنًا</span> <span class="w" data-sq="ose sulmon komandantin e e mbyti e u thye armiku;"> عاليًا ففتحه، أو حَمَل على مُقَدَّم العدوِّ، فقتله فهُزِم العدوُّ، ونحو ذلك؛</span></span></p>

<p><span class="s" data-sq="sepse Pejgamberi ﷺ e halifët e tij u jepnin shtesë për këso raste.">فإن النبي ﷺ وخلفاءَه كانوا يُنَفِّلون لذلك.</span></p>

<p><span class="s" data-sq="Dhe u jepte çetës në nisjen e parë një të katërtën pas të pestës, dhe në kthim një të tretën pas"><span class="w" data-sq="Dhe u jepte çetës në nisjen e parë një të katërtën pas të pestës, dhe në kthim një të tretën pas">وكان يُنَفِّل السرية في البَدْأَة الربع بعد الخمس، وفي الرجعة الثلث بعد</span></span></p>`},
// ===== Faqja 47: Nefeli nga e pesta, mendime (PDF fq. 49) =====
{html:`<p><span class="s" data-sq="të pestës.">الخمس.</span></p>

<p><span class="s" data-sq="Dhe ky nefel (shtesa), disa dijetarë thanë: ai merret nga e pesta; e disa thanë: nga e pesta e së pestës, që mos të favorizohen disa luftëtarë mbi disa. E e sakta është se lejohet nga katër të pestat, edhe nëse ka favorizim të disave mbi disa, për dobi fetare e jo për epsh të shpirtit, siç bëri Pejgamberi ﷺ disa herë. Dhe ky është mendimi i fukahave të Shamit, i Ebu Hanifes, i Ahmedit e tjerëve."><span class="w" data-sq="Dhe ky nefel, disa dijetarë thanë: ai merret nga e pesta; e disa thanë: nga e pesta e së pestës, që mos të favorizohen disa luftëtarë mbi disa.">وهذا النفل قد قال بعض العلماء: إنه يكون من الخمس، وقال بعضهم: إنه يكون من خُمُس الخمس، لئلا يُفَضَّل بعض الغانمين على بعض،</span> <span class="w" data-sq="E e sakta është se lejohet nga katër të pestat, edhe nëse ka favorizim, për dobi fetare e jo për epsh, siç bëri Pejgamberi ﷺ disa herë.">والصحيح أنه يجوز من أربعة الأخماس وإن كان فيه تفضيل بعضهم على بعض لمصلحة دينية لا هوى النفس، كما فعل النبي ﷺ غير مرة.</span> <span class="w" data-sq="Dhe ky është mendimi i fukahave të Shamit, i Ebu Hanifes, i Ahmedit e tjerëve.">وهذا قول فقهاء الشام، وأبي حنيفة، وأحمد وغيرهم.</span></span></p>

<p><span class="s" data-sq="Mbi këtë, është thënë: i jepet nefel një e katërta e një e treta me kusht e pa kusht, dhe shtesa mbi këtë me kusht, si p.sh. të thotë: kush më tregon kështjellën, i takon kaq; e kush sjell ndonjë kokë, i takon kaq; e gjëra të ngjashme. E është thënë: nuk i jepet nefel më shumë se një e treta, dhe nuk i jepet"><span class="w" data-sq="Mbi këtë, është thënë: i jepet nefel një e katërta e një e treta me kusht e pa kusht, dhe shtesa mbi këtë me kusht,">وعلى هذا فقد قيل: إنه يُنَفَّل الربع والثلث بشرط وغير شرط، ويُنَفَّل الزيادة على ذلك بالشرط،</span> <span class="w" data-sq="si p.sh. të thotë: kush më tregon kështjellën, i takon kaq; kush sjell kokë, i takon kaq; e gjëra të ngjashme.">مثل أن يقول: من دلني على قلعة فله كذا، ومن جاء برأس فله كذا، ونحو ذلك.</span> <span class="w" data-sq="E është thënë: nuk i jepet nefel më shumë se një e treta, dhe nuk i jepet">وقيل: لا يُنَفَّل زيادةً على الثلث، ولا ينفَّلُه</span></span></p>`},
// ===== Faqja 48: Lejimi, gululi, marrja me leje (PDF fq. 50) =====
{html:`<p><span class="s" data-sq="veçse me kusht, dhe këto janë dy mendime të Ahmedit e tjerëve.">إلا بالشرط، وهذان قولان لأحمد وغيره.</span></p>

<p><span class="s" data-sq="Po ashtu — sipas mendimit të saktë — imamit i lejohet të thotë: kush merr diçka, ajo i takon; siç është transmetuar nga Pejgamberi ﷺ se e tha në betejën e Bedrit, kur e pa se dobija ishte më e madhe se dëmi."><span class="w" data-sq="Po ashtu — sipas mendimit të saktë — imamit i lejohet të thotë: kush merr diçka, ajo i takon;">وكذلك ـ على القول الصحيح ـ للإمام أن يقول: من أخذ شيئًا فهو له،</span> <span class="w" data-sq="siç është transmetuar nga Pejgamberi ﷺ se e tha në betejën e Bedrit, kur e pa se dobija ishte më e madhe.">كما رُوِيَ عن النبي ﷺ أنه قال في غزوة بدر، إذا رأى المصلحة راجحة على المفسدة.</span></span></p>

<p><span class="s" data-sq="E kur imami e mbledh ganimetin dhe e ndan, askujt nuk i lejohet të marrë fshehtas prej tij:">وإذا كان الإمام يجمع الغنيمة ويقسمها، لم يَجُز لأحد أن يغلَّ منها شيئًا</span> <span class="s quran" data-sq="E kush përvetëson diçka në mënyrë të pandershme, ai në ditën e kijametit do të vijë me atë që ka përvetësuar.">﴿وَمَن يَغْلُلْ يَأْتِ بِمَا غَلَّ يَوْمَ الْقِيَامَةِ﴾</span> <span class="s" data-sq="[Al Imran: 161], sepse gululi (vjedhja nga ganimeti) është tradhtia. Dhe nuk lejohet plaçkitja, sepse Pejgamberi ﷺ e ndaloi; e nëse imami e lë mbledhjen dhe ndarjen">[آل عمران: ١٦١]، فإن الغُلول خيانة. ولا تجوز النُّهبَة، فإن النبي ﷺ نهى عنها، فإن ترك الإمام الجمعَ والقسمةَ</span></p>

<p><span class="s" data-sq="dhe jep leje për marrje, leje të lejueshme, kush merr diçka pa agresion, ajo i lejohet pas nxjerrjes së një të pestës; dhe çdo gjë që tregon lejen, ajo është leje.">وأَذِنَ في الأخذ إذنًا جائزًا، فمن أخذ شيئًا بلا عُدوان حلٌّ له بعد تخميسه، وكلُّ ما دل على الإذن فهو إذن.</span></p>

<p><span class="s" data-sq="E nëse nuk jep leje, ose jep leje të palejueshme — i lejohet njeriut të marrë aq sa do t'i binte nga ndarja, duke u përpjekur për drejtësi në këtë.">وأما إذا لم يأذن أو أَذِنَ إذنًا غير جائز= جاز للإنسان أن يأخذ مقدار ما يصيبه بالقسمة متحرِّيًا للعدل في ذلك.</span></p>`},
// ===== Faqja 49: Mesi, ndarja kalorës-këmbësor, hixhin (PDF fq. 51) =====
{html:`<p><span class="s" data-sq="Dhe kush ua ndalon myslimanëve mbledhjen e ganimeteve — duke qenë gjendja kjo — ose ia lejon imamit të bëjë me to çka të dojë, dy mendimet janë kundërshtuar si dy skaje, e feja e Allahut është në mes."><span class="w" data-sq="Dhe kush ua ndalon myslimanëve mbledhjen e ganimeteve — duke qenë gjendja kjo — ose ia lejon imamit të bëjë çka të dojë,">ومن حرَّم على المسلمين جمع المغانم ـ والحال هذه ـ أو أباح للإمام أن يفعل فيها ما شاء،</span> <span class="w" data-sq="dy mendimet janë kundërshtuar si dy skaje, e feja e Allahut është në mes.">فقد تقابل القولان تقابُلَ الطرفين، ودين الله وسط.</span></span></p>

<p><span class="s" data-sq="Dhe drejtësia në ndarje është: t'i japë këmbësorit një hise, e kalorësit me kalë arabe tri hise — një për të dhe dy për kalin; kështu ndau Pejgamberi ﷺ vitin e Hajberit."><span class="w" data-sq="Dhe drejtësia në ndarje është: t'i japë këmbësorit një hise, e kalorësit me kalë arabe tri hise — një për të dhe dy për kalin;">والعدل في القسمة: أن يقسم للرَّاجِل سهم، وللفارس ذي الفرس العربي ثلاثة أسهم، سهم له وسهمان لفرسه،</span> <span class="w" data-sq="kështu ndau Pejgamberi ﷺ vitin e Hajberit.">هكذا قسم النبي ﷺ عام خيبر.</span></span></p>

<p><span class="s" data-sq="Disa fukaha thonë: kalorësi merr dy hise; por mendimi i parë është ai që e mbështet Suneti i saktë, sepse kali ka nevojë për mirëmbajtje e kujdes, dhe dobia e njerëzve prej tij është më e madhe se dy këmbësorëve. Disa thonë: barazohet kali arab me hixhinin në këtë. E disa thonë: hixhinit i jepet vetëm një hise, siç është transmetuar nga Pejgamberi ﷺ e shokët e tij."><span class="w" data-sq="Disa fukaha thonë: kalorësi merr dy hise; por mendimi i parë e mbështet Suneti i saktë,">ومن الفقهاء من يقول: للفارس سهمان، والأول هو الذي دلت عليه السنة الصحيحة،</span> <span class="w" data-sq="sepse kali ka nevojë për mirëmbajtje e kujdes, dhe dobia e njerëzve prej tij është më e madhe se dy këmbësorëve.">ولأن الفرس يحتاج إلى مؤونة نفسه وسائسه، ومنفعةُ الناس به أكثر من منفعة راجِلَين.</span> <span class="w" data-sq="Disa thonë: barazohet kali arab me hixhinin. E disa thonë: hixhinit i jepet vetëm një hise, siç transmetohet nga Pejgamberi ﷺ e shokët e tij.">ومنهم مَن يقول: يسوَّى بين الفرس العربي والهجين في هذا. ومنهم من يقول: بل الهجين يُسْهَم له سهم واحد، كما رُوي عن النبي ﷺ وأصحابه.</span></span></p>`},
// ===== Faqja 50: Llojet e kuajve, ganimeti i pasurisë (PDF fq. 52) =====
{html:`<p><span class="s" data-sq="Kali hixhin: është ai nëna e të cilit është nabatijje, e quhet në këtë kohë tatari, qoftë mashkull, femër apo i tredhur (ekdish)."><span class="w" data-sq="Kali hixhin: është ai nëna e të cilit është nabatijje, e quhet në këtë kohë tatari,">والفرس الهجين: الذي تكون أمه نبطية، ويسمى في هذا الزمان: التتريّ،</span> <span class="w" data-sq="qoftë mashkull, femër apo i tredhur (ekdish).">سواء كان حصانًا أو حِجرًا، ويسمى الرَّمَكة، أو خَصِيًّا ويسمى الإكديش.</span></span></p>

<p><span class="s" data-sq="Të parët i përgatisnin për betejë kuajt mashkuj për forcën e fuqinë e tyre; për sulme natën përdornin pelën, sepse nuk ka hingëllimë që e paralajmëron armikun; e për udhëtim përdornin të tredhurin, sepse ishte më i duruar në ecje."><span class="w" data-sq="Të parët i përgatisnin për betejë kuajt mashkuj për forcën e fuqinë e tyre;">كان السلف يعدون للقتال الحصان لشدته ولقوَّته وحِدَّته،</span> <span class="w" data-sq="për sulme natën përdornin pelën, sepse nuk ka hingëllimë që e paralajmëron armikun;">وللإغارة والبَيَّات الحِجْر؛ لأنه ليس له صهيل ينذر العدو فيحترزون،</span> <span class="w" data-sq="e për udhëtim përdornin të tredhurin, sepse ishte më i duruar në ecje.">وللسَّيْر الخَصِي لأنه أصبر على السير.</span></span></p>

<p><span class="s" data-sq="E nëse ganimeti ishte pasuri që myslimanëve u kishte takuar më parë — si pronë e palujtshme ose e lujtshme — e pronari e njohu para ndarjes, ajo i kthehet atij me ixhma të myslimanëve."><span class="w" data-sq="E nëse ganimeti ishte pasuri që myslimanëve u kishte takuar më parë — si pronë e palujtshme ose e lujtshme —">وإذا كان المغنوم مالًا قد كان للمسلمين قبل ذلك من عقار أو منقول،</span> <span class="w" data-sq="e pronari e njohu para ndarjes, ajo i kthehet atij me ixhma të myslimanëve.">وعَرَفه صاحبُه قبل القسمة، فإنه يُرَدُّ إليه بإجماع المسلمين.</span></span></p>

<p><span class="s" data-sq="Degëzimet e ganimetit, dispozitat e tij kanë transmetime e mendime ku myslimanët janë dakord në disa e kanë kundërshtime në disa; ky nuk është vendi i tyre, por qëllimi ishte përmendja e rregullave të përgjithshme."><span class="w" data-sq="Degëzimet e ganimetit, dispozitat e tij kanë transmetime e mendime ku myslimanët janë dakord në disa e kanë kundërshtime në disa;">وتفاريع الغنائم وأحكامها فيه آثار وأقوال اتفق المسلمون على بعضها وتنازعوا في بعض ذلك،</span> <span class="w" data-sq="ky nuk është vendi i tyre, por qëllimi ishte përmendja e rregullave të përgjithshme.">ليس هذا موضعها، وإنما الغرض ذِكْر الجمل الجامعة.</span></span></p>`},
// ===== Faqja 51: Sadakaja — tetë llojet (PDF fq. 53) =====
{html:`<p class="fsep">❖ ❖ ❖</p>
<h2><span class="s" data-sq="Kapitulli">فصل</span></h2>

<p><span class="s" data-sq="Sa i përket sadakave (zekatit): ai u takon atyre që i përmendi Allahu i Lartësuar në Librin e Tij; e është transmetuar nga Pejgamberi ﷺ se njëri i kërkoi nga sadakaja, e i tha:"><span class="w" data-sq="Sa i përket sadakave: ai u takon atyre që i përmendi Allahu i Lartësuar në Librin e Tij;">وأما الصدقات؛ فهي لمن سمى الله سبحانه وتعالى في كتابه،</span> <span class="w" data-sq="e është transmetuar nga Pejgamberi ﷺ se njëri i kërkoi nga sadakaja, e i tha:">فقد رُوي عن النبي ﷺ أن رجلًا سأله من الصدقة فقال:</span></span> <span class="s hadith" data-sq="«Allahu nuk u kënaq në sadaka me ndarjen e ndonjë pejgamberi e as dikujt tjetër, por e ndau në tetë pjesë; e nëse je nga ato pjesë, ta jap.»">«إن الله لم يرضَ في الصدقة بقسم نبي ولا غيره، ولكن جزَّأها ثمانيةَ أجزاء، فإن كنت من تلك الأجزاء أعطيتك».</span></p>

<p><span class="s" data-sq="(Fukaratë dhe nevojtarët) — i bashkon kuptimi i nevojës deri në mjaftueshmëri; andaj sadakaja nuk i lejohet të pasurit e as punëtorit të fortë.">ف(الفقراء والمساكين) يجمعهما معنى الحاجة إلى الكفاية، فلا تحلُّ الصدقة لغنيٍّ ولا لقويٍّ مكتسب.</span></p>

<p><span class="s" data-sq="(Punëtorët mbi të) — janë ata që e mbledhin, e ruajnë, e regjistrojnë, e gjëra të ngjashme.">(والعاملون عليها) هم الذين يَجْبونها، ويحفظونها، ويكتبونها، ونحو ذلك.</span></p>

<p><span class="s" data-sq="(Ata që u zbuten zemrat) — do t'i përmendim, nëse do Allahu, te pasuria e fej-it.">(والمؤلفة قلوبهم) سنذكرهم ـ إن شاء الله تعالى ـ في مال الفيء.</span></p>

<p><span class="s" data-sq="(Për robërit) — hyn aty ndihma e mukatebëve, çlirimi i robërve të luftës, dhe lirimi i robërve — ky është mendimi më i fortë.">(وفي الرقاب) يدخل فيه إعانة المُكَاتَبين، وافتداء الأسرى، وعتق الرقاب، هذا أقوى الأقوال فيها.</span></p>

<p><span class="s" data-sq="(Borxhlinjtë) — janë ata që kanë borxhe e nuk gjejnë t'i shlyejnë, andaj u jepet për shlyerjen e">(والغارمون) هم الذين عليهم ديون لا يجدون وفاءها، فيُعطَون وفاء</span></p>`},
// ===== Faqja 52: Borxhlinjtë, fi sebilil-lah, ibnu's-sebil (PDF fq. 54) =====
{html:`<p><span class="s" data-sq="borxheve edhe nëse janë shumë, përveç nëse e kanë bërë borxhin në gjynah ndaj Allahut të Lartësuar — atëherë nuk u jepet derisa të pendohen."><span class="w" data-sq="borxheve edhe nëse janë shumë,">ديونهم ولو كان كثيرًا،</span> <span class="w" data-sq="përveç nëse e kanë bërë borxhin në gjynah ndaj Allahut — atëherë nuk u jepet derisa të pendohen.">إلا أن يكونوا غَرِموه في معصية الله تعالى، فلا يُعطَون حتى يتوبوا.</span></span></p>

<p><span class="s" data-sq="(Në rrugën e Allahut) — janë luftëtarët që nuk u jepet nga pasuria e Allahut aq sa u mjafton për luftë; andaj u jepet sa kanë nevojë, ose plotësimi i tij, nga kuaj, armë, shpenzime e paga. Haxhi gjithashtu është nga rruga e Allahut, siç tha Pejgamberi ﷺ."><span class="w" data-sq="(Në rrugën e Allahut) — janë luftëtarët që nuk u jepet sa u mjafton; andaj u jepet sa kanë nevojë, nga kuaj, armë e shpenzime.">(وفي سبيل الله) هم الغُزَّاة الذين لا يُعطَون من مال الله ما يكفيهم لغزوهم، فيُعطَون ما يغزون به، أو تمام ما يغزون به، من خيل وسلاح ونفقة وأجرة.</span> <span class="w" data-sq="Haxhi gjithashtu është nga rruga e Allahut, siç tha Pejgamberi ﷺ.">والحجُّ من سبيل الله، كما قال النبي ﷺ.</span></span></p>

<p><span class="s" data-sq="(Ibnu's-sebili) — është ai që udhëton nga një vend në tjetrin.">(وابن السبيل) هو الذي يجتاز من بلد إلى بلد.</span></p>`},
// ===== Faqja 53: Fej-i — El-Hashr 6-10 (PDF fq. 55) =====
{html:`<p><span class="s" data-sq="Sa i përket fej-it (pasurisë publike), baza e tij është ajo që e përmendi Allahu i Lartësuar në suren El-Hashr, që e shpalli në betejën e Beni Nadiirit pas Bedrit, në fjalën e Tij:"><span class="w" data-sq="Sa i përket fej-it, baza e tij është ajo që e përmendi Allahu i Lartësuar në suren El-Hashr,">وأما الفيء، فأصله ما ذكره الله سبحانه وتعالى في سورة الحشر</span> <span class="w" data-sq="që e shpalli në betejën e Beni Nadiirit pas Bedrit, në fjalën e Tij:">التي أنزلها في غزوة بني النضير بعد بدر في قوله:</span></span> <span class="s quran" data-sq="Atë që All-llahu nga ata ia ktheu të dërguarit të Vet, ju nuk galopuat për të as me kuaj e as me deve, por All-llahu u jep pushtet të dërguarve të Vet kundër kujt të dojë. All-llahu ka mundësi për çdo send. Atë që All-llahu nga banorët e atyre vendbanimeve ia ktheu të dërguarit të Vet, ajo i takon All-llahut, të dërguarit, të afërmve, jetimëve, nevojtarëve dhe udhëtarit, ashtu që ajo të mos ndahet vetëm ndërmjet pasanikëve tuaj. Çka t'ju japë i dërguari, merreni, e çka t'ju ndalojë, largohuni prej saj dhe kinie frikë All-llahun, sepse All-llahu ndëshkon ashpër. (Ajo i takon) Muhaxhirëve të varfër, të cilët u dëbuan prej shtëpive të tyre e prej pasurisë së tyre, duke kërkuar mirësinë e All-llahut e kënaqësinë e Tij dhe që ndihmojnë All-llahun e të dërguarin e Tij. Të tillë janë ata të sinqertit. Edhe ata që e patën bërë vendbanimin dhe besimin para tyre i donë ata që shpërngulen te ata dhe nuk ndiejnë në gjoksin e tyre ndonjë nevojë ndaj asaj që u jepej atyre, madje edhe sikur të kenë vetë nevojë, u jepnin atyre përparësi para vetvetes. Kush i ruhet lakmisë së vetvetes, të tillë janë të shpëtuar. Edhe ata që erdhën pas tyre e thonë: Zoti ynë, falna neve dhe vëllezërit tanë që para nesh u besuan, e mos lejo në zemrat tona urrejtje ndaj atyre që besuan. Zoti ynë, Ti je i butë, mëshirues!"><span class="w" data-sq="Atë që All-llahu nga ata ia ktheu të dërguarit të Vet, ju nuk galopuat as me kuaj e as me deve, por All-llahu u jep pushtet kundër kujt të dojë.">﴿وَمَا أَفَاءَ اللَّهُ عَلَى رَسُولِهِ مِنْهُمْ فَمَا أَوْجَفْتُمْ عَلَيْهِ مِنْ خَيْلٍ وَلَا رِكَابٍ وَلَكِنَّ اللَّهَ يُسَلِّطُ رُسُلَهُ عَلَى مَن يَشَاءُ وَاللَّهُ عَلَى كُلِّ شَيْءٍ قَدِيرٌ</span> <span class="w" data-sq="Çka All-llahu ia ktheu të dërguarit nga banorët e vendbanimeve, i takon All-llahut, të dërguarit, të afërmve, jetimëve, nevojtarëve dhe udhëtarit, që të mos ndahet vetëm mes pasanikëve tuaj.">مَا أَفَاءَ اللَّهُ عَلَى رَسُولِهِ مِنْ أَهْلِ الْقُرَى فَلِلَّهِ وَلِلرَّسُولِ وَلِذِي الْقُرْبَى وَالْيَتَامَى وَالْمَسَاكِينِ وَابْنِ السَّبِيلِ كَيْ لَا يَكُونَ دُولَةً بَيْنَ الْأَغْنِيَاءِ مِنكُمْ</span> <span class="w" data-sq="Çka t'ju japë i dërguari, merreni, e çka t'ju ndalojë, largohuni, e kinie frikë All-llahun, sepse All-llahu ndëshkon ashpër.">وَمَا آتَاكُمُ الرَّسُولُ فَخُذُوهُ وَمَا نَهَاكُمْ عَنْهُ فَانتَهُوا وَاتَّقُوا اللَّهَ إِنَّ اللَّهَ شَدِيدُ الْعِقَابِ</span> <span class="w" data-sq="Muhaxhirëve të varfër që u dëbuan prej shtëpive e pasurisë, duke kërkuar mirësinë e All-llahut, e që ndihmojnë All-llahun e të dërguarin. Të tillë janë ata të sinqertit.">لِلْفُقَرَاءِ الْمُهَاجِرِينَ الَّذِينَ أُخْرِجُوا مِن دِيَارِهِمْ وَأَمْوَالِهِمْ يَبْتَغُونَ فَضْلًا مِّنَ اللَّهِ وَرِضْوَانًا وَيَنصُرُونَ اللَّهَ وَرَسُولَهُ أُولَئِكَ هُمُ الصَّادِقُونَ</span> <span class="w" data-sq="Edhe ata që e patën bërë vendbanimin e besimin para tyre, i donë ata që shpërngulen te ata, e u jepnin përparësi para vetvetes. Kush i ruhet lakmisë, të tillë janë të shpëtuar.">وَالَّذِينَ تَبَوَّءُوا الدَّارَ وَالْإِيمَانَ مِن قَبْلِهِمْ يُحِبُّونَ مَنْ هَاجَرَ إِلَيْهِمْ... وَمَن يُوقَ شُحَّ نَفْسِهِ فَأُولَئِكَ هُمُ الْمُفْلِحُونَ</span> <span class="w" data-sq="Edhe ata që erdhën pas tyre e thonë: Zoti ynë, falna neve dhe vëllezërit tanë që para nesh u besuan, e mos lejo urrejtje ndaj atyre. Zoti ynë, Ti je i butë, mëshirues!">وَالَّذِينَ جَاءُوا مِن بَعْدِهِمْ يَقُولُونَ رَبَّنَا اغْفِرْ لَنَا وَلِإِخْوَانِنَا الَّذِينَ سَبَقُونَا بِالْإِيمَانِ وَلَا تَجْعَلْ فِي قُلُوبِنَا غِلًّا لِّلَّذِينَ آمَنُوا رَبَّنَا إِنَّكَ رَءُوفٌ رَّحِيمٌ﴾</span></span> <span class="s" data-sq="[El-Hashr: 6-10].">[الحشر: ٦-١٠].</span></p>

<p><span class="s" data-sq="Allahu përmendi muhaxhirët e ensarët, dhe ata që erdhën pas tyre me cilësitë e përshkruara; andaj në llojin e tretë hyn çdokush që vjen me këtë cilësi deri në Ditën e Kiametit, ashtu siç hynë në fjalën e Tij:"><span class="w" data-sq="Allahu përmendi muhaxhirët e ensarët, dhe ata që erdhën pas tyre me cilësitë e përshkruara;">فذكر الله سبحانه وتعالى المهاجرين والأنصار، والذين جاؤوا من بعدهم على ما وصف،</span> <span class="w" data-sq="andaj në llojin e tretë hyn çdokush që vjen me këtë cilësi deri në Ditën e Kiametit, ashtu siç hynë në fjalën e Tij:">فدخل في الصنف الثالث كلُّ مَن جاء على هذا الوجه إلى يوم القيامة، كما دخلوا في قوله تعالى:</span></span> <span class="s quran" data-sq="E ata që besuan më vonë, shpërngulën...">﴿وَالَّذِينَ آمَنُوا مِن بَعْدُ وَهَاجَرُوا</span></p>`},
// ===== Faqja 54: Fej-i kuptimi, Xhizja, tregti (PDF fq. 56) =====
