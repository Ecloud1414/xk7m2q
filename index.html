{html:`<p><span class="s" data-sq="Allahu e bëri obligim namazin për të sigurin e të frikësuarin, të shëndetshin e të sëmurin, të pasurin e të varfrin, vendaliun e udhëtarin, dhe e lehtësoi për udhëtarin, të frikësuarin, të sëmurin e të varfrin që nuk gjen pastërtim ose nuk gjen lehtësim, siç erdhi në Librin e Synetin.">فأوجب الله الصلاة علىٰ الآمن والخائف، والصحيح والمريض، والغني والفقير، والمقيم والمسافر، وخففها علىٰ المسافر والخائف والمريض والفقير الذي لا يجد طهورًا أو لا يجد مَيْسَرة، كما جاء به الكتاب والسنة.</span></p><p><span class="s" data-sq="Dhe hoqi obligimin e asaj që robi nuk e arrin nga detyrimet e namazit: pastërtimin, drejtimin nga Kibla, leximin e Fatihasë, plotësimin e rukusë, sexhdes e qëndrimit.">وأسقط ما يعجز عنه العبد من واجباتها، من الطهارة، واستقبال الكعبة، وقراءة الفاتحة، وتكميل الركوع والسجود والقيام.</span></p><p><span class="s" data-sq="Nëse anija thyhet me njerëz brenda, ose luftëtarët ua marrin rrobat, falen lakuriq sipas gjendjes, dhe imami qëndron në mes tyre që të tjerët të mos i shohin avretin.">فلو انكسرت سفينة بقوم، أو سلبهم المحاربون ثيابهم؛ صلوا عراةً بحسب أحوالهم، وكان إمامُهم وسطهم؛ لئلا يرىٰ الباقون عورته.</span></p><p><span class="s" data-sq="Dhe nëse u ngatërrohet drejtimi i Kiblës, përpiqen ta gjejnë, e nëse nuk gjejnë asnjë shenjë, falen si mundin, siç transmetohet se e bënë këtë në kohën e të Dërguarit të Allahut ﷺ.">ولو اشتبهت القبلة اجتهدوا في الاستدلال عليها، فلو عَمِيَت الدلائلُ صلوا كيف أمكنهم، كما قد رُوي أنهم فعلوا ذلك علىٰ عهد رسول الله ﷺ.</span></p>`},
{html:`<p><span class="s" data-sq="Po ashtu nëse burgosen në vend të ngushtë, ose janë në betejë me armikun, e kështu me xhihadin, qeverisjen e gjithë çështjet e fesë. E gjithë kjo hyn në fjalën e Allahut të Lartësuar:">وكذلك لو حُبس بمكان ضَيِّق، أو كان حال مساورة العدو وغير ذلك، فهكذا الجهاد والولايات وسائر أمور الدين، وذلك كله في قوله تعالىٰ:</span> <span class="s quran" data-sq="Pra frikësojuni Allahut sa të mundeni! [Et-Tegabun: 16]">﴿فَاتَّقُوا اللَّهَ مَا اسْتَطَعْتُمْ﴾ [التغابن: ١٦].</span> <span class="s" data-sq="Dhe në fjalën e Profetit ﷺ:">وفي قوله ﷺ:</span> <span class="s hadith" data-sq="'Kur ju urdhëroj diçka, bëni prej saj çka mundeni.'">«إذا أمرتكم بأمر فأتوا منه ما استطعتم».</span></p><p><span class="s" data-sq="Siç Allahu i Lartësuar kur ndaloi ushqimet e ndyra, tha:">كما أن الله تعالىٰ لما حرَّم المطاعم الخبيثة قال:</span> <span class="s quran" data-sq="E kush shtrëngohet (të hajë nga këto) duke mos qenë i padëgjueshëm e duke mos e tepruar, nuk ka mëkat. [El-Bekare: 173]">﴿فَمَنِ اضْطُرَّ غَيْرَ بَاغٍ وَلَا عَادٍ فَلَا إِثْمَ عَلَيْهِ﴾ [البقرة: ١٧٣]،</span> <span class="s" data-sq="dhe tha i Lartësuari:">وقال تعالىٰ:</span> <span class="s quran" data-sq="...dhe nuk u obligoi juve në fe me ndonjë vështirësi. [El-Haxhxh: 78]">﴿وَمَا جَعَلَ عَلَيْكُمْ فِي الدِّينِ مِنْ حَرَجٍ﴾ [الحج: ٧٨]،</span> <span class="s" data-sq="dhe tha i Lartësuari:">وقال تعالىٰ:</span> <span class="s quran" data-sq="Allahu nuk dëshiron t'ju sjellë juve ndonjë vështirësi. [El-Maide: 6]">﴿مَا يُرِيدُ اللَّهُ لِيَجْعَلَ عَلَيْكُم مِّنْ حَرَجٍ﴾ [المائدة: ٦]،</span> <span class="s" data-sq="pra nuk obligoi atë që nuk arrihet, dhe nuk ndaloi atë nga e cila dikush shtrëngohet, kur nevoja është pa mëkat nga robi.">فلم يوجب ما لا يُستطاع، ولم يحرِّم ما يُضْطَر إليه إذا كانت الضرورة بغير معصية من العبد.</span></p><p class="section-title">فصل</p><p><span class="s" data-sq="Qeverisja e çështjeve të njerëzve është ndër obligimet më të mëdha të fesë, madje feja e dynjaja nuk plotësohen pa të, sepse bijtë e Ademit nuk e arrijnë mirëqenien e tyre pa u mbledh së bashku, për nevojën që kanë njëri për tjetrin.">ولاية أمر الناس من أعظم واجبات الدين، بل لا تمام للدين والدنيا إلا بها، فإن بني آدم لا تتم مصلحتهم إلا بالاجتماع لحاجة بعضهم</span></p>`},
{html:`<p><span class="s" data-sq="ndaj njëri-tjetrit duke bashkëpunuar e duke u ndihmuar; bashkëpunojnë për të sjellë dobi dhe ndihmohen për të larguar dëmin, sepse njëriu vetëm nuk arrin të sjellë gjithë dobitë dhe të largojë gjithë dëmet e veta.">إلىٰ بعض تعاونًا وتناصرًا؛ يتعاونون علىٰ جلب المنفعة، ويتناصرون لدفع المضرة، إذ الواحد منهم لا يقدر وحده علىٰ جلب جميع منافعه، ودفع جميع مضارِّه.</span></p><p><span class="s" data-sq="Doemos duhet kryetar kur mblidhen, madje Profeti ﷺ tha:">ولابد لهم عند الاجتماع من رأس، حتىٰ قال النبي ﷺ:</span> <span class="s hadith" data-sq="'Kur dalin tre vetë në udhëtim, le të caktojnë njërin prej tyre komandant.'">«إذا خرج ثلاثةٌ في سفر فليؤمِّروا أحدهم»</span> <span class="s" data-sq="Transmeton Ebu Daudi nga hadithi i Ebu Seidit dhe Ebu Hurejrës.">رواه أبو داود من حديث أبي سعيد وأبي هريرة.</span></p><p><span class="s" data-sq="Transmeton Imam Ahmedi në 'Musned' nga Ibn Amri — Allahu qoftë i kënaqur me ta — se Profeti ﷺ tha:">ورويٰ الإمام أحمد في «المسند» عن ابن عَمرو رضي الله عنهما أن النبي ﷺ قال:</span> <span class="s hadith" data-sq="'Nuk u lejohet tre vetëve të jenë në shkretëtirë pa caktuar njërin prej tyre komandant.'">«لا يحلُّ لثلاثة يكونوا بفلاةٍ من الأرض إلا أمَّروا عليهم أحدَهم».</span></p><p><span class="s" data-sq="Profeti ﷺ e obligoi caktimin e komandantit edhe në mbledhjen e vogël të rastësishme gjatë udhëtimit, si paralajmërim për gjithë llojet e mbledhjeve që janë më të mëdha e më të qëndrueshme. Dhe sepse Allahu i Lartësuar e obligoi urdhërimin e së mirës e ndalimin e së keqes, e kjo nuk arrihet pa forcë e udhëheqje,">فأوجب ﷺ تأميرَ الواحد في الاجتماع القليل العارض في السفر تنبيهًا بذلك علىٰ سائر أنواع الاجتماع التي هي أكثر وأدْوَم، ولأن الله تعالىٰ أوجب الأمرَ بالمعروف والنهي عن المنكر، ولا يتمُّ ذلك إلا بقوَّة وإمارة،</span></p>`},
{html:`<p><span class="s" data-sq="po ashtu gjithë çka obligoi Allahu nga xhihadi, drejtësia, kryerja e haxhit, xhumave, festave, ndihma e të shtypurit dhe zbatimi i hudud-eve — asnjëra nuk arrihet pa forcë e udhëheqje. Prandaj transmetohet:">وكذلك سائر ما أوجب من الجهاد والعدل، وإقامة الحج والجُمَع والأعياد، ونصر المظلوم، وإقامة الحدود= لا تتم إلا بالقوة والإمارة؛ ولهذا</span> <span class="s hadith" data-sq="'Sundimtari është hija e Allahut në tokë.'">رُوي: «إن السلطانَ ظلُّ الله في الأرض»،</span> <span class="s" data-sq="dhe thuhet:">ويقال:</span> <span class="s hadith" data-sq="'Gjashtëdhjetë vjet me sundimtar të padrejtë janë më mirë se një natë pa sundimtar.'">«ستونَ سنة من إمام جائر أصلح من ليلة واحدة بلا سلطان».</span></p><p><span class="s" data-sq="Përvoja e vërteton këtë: koha e vendi ku mungon sundimtari — nga vdekja ose vrasja pa u zëvendësuar, ose ku shpërthen fitne ndërmjet dy grupeve, ose ku populli del nga sundimi — si disa fise shkretëtire e fshatra — aty ndodh aq shkatërrim në fe e dynja, dhe humbasin aq të mira, sa nuk i di veçse Allahu.">والتجربة تبيِّن ذلك، فإن الوقت والمكان الذي يعدم فيه السلطان بموت أو قتل، ولم يقم غيره، أو تجري فيه فتنة بين طائفتين، أو يخرج أهله علىٰ حكم سلطان، كبعض أهل البوادي والقرىٰ= يجري فيها من الفساد في الدين والدنيا، ويفقد فيه من مصالح الدنيا والدين ما لا يعلمه إلا الله.</span></p><p><span class="s" data-sq="Prandaj selefët — si Fudajl ibn Ijadi, Ahmed ibn Hanbeli, Sehl ibn Abdullah et-Tusteri e të tjerë — e madhëronin vlerën e mirësisë së Allahut me sundimtarin, dhe e shihnin lutjen për të e këshillimin e tij ndër veprat më afruese ndaj Allahut të Lartësuar, pa lakmuar pasurinë e kryesinë e tij, pa u frikësuar nga ai, e pa e ndihmuar në mëkat e armiqësi.">ولهذا كان السلف ـ كالفضيل بن عياض، وأحمد بن حنبل، وسهل بن عبد الله التستري وغيرهم ـ يُعَظِّمون قدرَ نعمة الله به، ويرون الدعاء له ومناصحته من أعظم ما يتقرَّبون به إلىٰ الله تعالىٰ، مع عدم الطمع في ماله ورئاسته، ولا لخشية منه، ولا لمعاونته علىٰ الإثم والعدوان.</span></p>`},
{html:`<p><span class="s" data-sq="I Dërguari i Allahut ﷺ ka thënë:">وقد قال رسول الله ﷺ:</span> <span class="s hadith" data-sq="'Allahu është i kënaqur me ju për tri gjëra: ta adhuroni dhe të mos i bëni shok asgjë, të kapeni pas litarit të Allahut të gjithë e të mos përçaheni, dhe t'i këshilloni ata që Ai ua ka besuar udhëheqjen tuaj.'">«إن الله يرضىٰ لكم ثلاثًا: أن تعبدوه ولا تشركوا به شيئًا، وأن تعتصموا بحبل الله جميعًا ولا تفرقوا، وأن تناصحوا من ولّاه أمركم».</span></p><p><span class="s" data-sq="Dhe tha:">وقال:</span> <span class="s hadith" data-sq="'Tri gjëra nuk e tradhtojnë zemrën e myslimanit: sinqeriteti i veprës për Allahun, këshillimi i sundimtarëve, dhe qëndrimi me xhematin e myslimanëve, sepse lutja e tyre i përfshin ata nga pas.'">«ثلاثٌ لا يغلُّ عليهن قلبُ مسلم: إخلاصُ العمل لله، ومناصحةُ ولاة الأمر، ولزومُ جماعة المسلمين، فإن دعوتهم تُحيط من ورائهم».</span></p><p><span class="s" data-sq="Këto janë dy hadithe të mira (hasen).">وهذان حديثان حسنان.</span></p><p><span class="s" data-sq="Në 'Sahih' transmetohet prej tij se tha:">وفي «الصحيح» عنه أنه قال:</span> <span class="s hadith" data-sq="'Feja është këshillim, feja është këshillim, feja është këshillim.'">«الدين النصيحة، الدين النصيحة، الدين النصيحة»،</span> <span class="s" data-sq="Thanë: Për kë, o i Dërguar i Allahut? Tha:">قالوا: لمن يا رسول الله؟ قال:</span> <span class="s hadith" data-sq="'Për Allahun, për Librin e Tij, për të Dërguarin e Tij, për udhëheqësit e myslimanëve dhe për popullin e tyre.'">«لله ولكتابه ولرسوله ولأئمة المسلمين وعامتهم».</span></p>`},
{html:`<p><span class="s" data-sq="Edhe pse shumica e atyre që hyjnë në qeverisje nuk synojnë adhurimin e afrimin ndaj Allahut, por atë që shpirtrat dëshirojnë nga kryesia e lartësia. Siç shumica e atyre që hanë, pinë e martohen nuk synojnë adhurimin e pastër — edhe pse ai është obligim. Madje shumica e atyre që kryejnë amanetet e dukshme, si pagimi i borxheve e çka kanë nga pasuritë e ortakërive, synojnë vetëm ruajtjen e autoritetit e pozitës — edhe pse ato janë obligime. E ngjashme ka shumë.">وإن كان أكثر من يدخل فيها لا يقصد العبادة والتقرب، بل لما في النفوس من حب الشرف والعلو. فكما أن أكثر من يأكل ويشرب وينكح لا يقصد العبادة المحضة ـ وهو من الواجبات ـ. بل من أكثر من يؤدي الأمانات الظاهرة، كقضاء ديون الناس، وما عنده من أموال المضاربات والشركات إنما يقصد بها قيام حُرمته وجاهه عندهم ـ وهي من الواجبات ـ فنظيره كثير.</span></p><p><span class="s" data-sq="Obligimi është ta marrësh qeverisjen si fe e afrim ndaj Allahut, duke bërë vepra të mira nëpërmjet saj për Allahun e Lartësuar. Afrimitë ndaj Allahut nëpërmjet bindshmërisë ndaj Tij e të Dërguarit janë ndër kurbetet më të mira. Gjendja e shumicës u prish vetëm nga kërkimi i kryesisë ose pasurisë nëpërmjet saj.">فالواجب اتخاذ الإمارة دينًا وقُربة يتقرب بها بالعمل الصالح فيها إلىٰ الله تعالىٰ، فإن التقرب إليه فيها بطاعته وطاعة رسوله من أفضل القربات، وإنما فسدَ فيها حالُ أكثر الناس لابتغاء الرئاسة أو المال بها فقط.</span></p><p><span class="s" data-sq="Transmetohet nga Ka'b ibn Maliku se Profeti ﷺ tha:">وقد روىٰ كعب بن مالك عن النبي ﷺ أنه قال:</span> <span class="s hadith" data-sq="'Dy ujqër të uritur të lëshuar në një tufë delesh nuk janë më shkatërrues për të sesa lakmi e njeriut për pasuri e kryesi për fenë e tij.'">«ما ذئبان جائعان أُرْسِلا في غنَمٍ بأفسد لها من حرص المرء علىٰ المال والشرف لدينه».</span> <span class="s" data-sq="Tirmidhiu tha: hadith i mirë i saktë.">قال</span></p>`},
{html:`<p><span class="s" data-sq="Tirmidhiu: hadith hasen sahih (i mirë i saktë).">الترمذي: حديث حسن صحيح.</span></p><p><span class="s" data-sq="Pra tregoi se lakmi e njeriut për pasuri e kryesi ia prish fenë, njësoj ose më shumë se shkatërrimi që dy ujqër të uritur i bëjnë vathës së deleve.">فأخبر أنَّ حرص المرء علىٰ المال والرئاسة يُفسد دينه، مثل أو أكثر من إفساد الذئبين الجائعين لزريبة الغنم.</span></p><p><span class="s" data-sq="Allahu i Lartësuar tregoi për atë që e merr librin e vet me të majtën se thotë:">وقد أخبر الله تعالىٰ عن الذي يؤتىٰ كتابه بشماله أنه يقول:</span> <span class="s quran" data-sq="'Ah, sikur të mos m'u jepte libri im! Dhe të mos dija se ç'është llogaria ime! Ah, sikur (vdekja) të ishte fundi im! Pasuria ime nuk më bëri dobi! M'u zhduk pushteti im!' [El-Hakka: 25-29]">﴿يَا لَيْتَنِي لَمْ أُوتَ كِتَابِيَهْ ۝ وَلَمْ أَدْرِ مَا حِسَابِيَهْ ۝ يَا لَيْتَهَا كَانَتِ الْقَاضِيَةَ ۝ مَا أَغْنَىٰ عَنِّي مَالِيَهْ ۝ هَلَكَ عَنِّي سُلْطَانِيَهْ﴾ [الحاقة: ٢٥-٢٩].</span></p><p><span class="s" data-sq="Allahu i Lartësuar tha:">وقال الله تعالىٰ:</span> <span class="s quran" data-sq="'A nuk udhëtuan nëpër tokë e të shihnin se si ishte përfundimi i atyre që ishin para tyre?! Ata ishin më të fortë se këta dhe lanë më shumë gjurmë në tokë, por Allahu i ndëshkoi për shkak të mëkateve të tyre dhe nuk pati kush t'i mbronte prej Allahut.' [Gafir: 21]">﴿أَوَلَمْ يَسِيرُوا فِي الْأَرْضِ فَيَنظُرُوا كَيْفَ كَانَ عَاقِبَةُ الَّذِينَ كَانُوا مِن قَبْلِهِمْ كَانُوا أَشَدَّ مِنْهُمْ قُوَّةً وَآثَارًا فِي الْأَرْضِ فَأَخَذَهُمُ اللَّهُ بِذُنُوبِهِمْ وَمَا كَانَ لَهُم مِّنَ اللَّهِ مِن وَاقٍ﴾ [غافر: ٢١]،</span> <span class="s" data-sq="dhe tha i Lartësuari:">وقال تعالىٰ:</span> <span class="s quran" data-sq="'Atë botë të përjetshme ua kemi përgatitur atyre që nuk duan madhështi e as çrregullime në tokë. Përfundimi i mirë u takon të devotshmëve.' [El-Kasas: 83]">﴿تِلْكَ الدَّارُ الْآخِرَةُ نَجْعَلُهَا لِلَّذِينَ لَا يُرِيدُونَ عُلُوًّا فِي الْأَرْضِ وَلَا فَسَادًا وَالْعَاقِبَةُ لِلْمُتَّقِينَ﴾ [القصص: ٨٣].</span></p><p><span class="s" data-sq="Njerëzit janë katër llojesh:">فالناس أربعة أقسام:</span></p><p><span class="s" data-sq="Lloji i parë: ata që duan lartësi mbi njerëzit dhe shkatërrim në tokë — kjo është mëkat ndaj Allahut — dhe këta janë mbretërit e kryetarët shkatërrues, si Faraoni e pasuesit e tij.">قومٌ يريدون العلو علىٰ الناس والفساد في الأرض، وهو معصية الله تعالىٰ، وهؤلاء الملوك والرؤساء المفسدون، كفرعون وحزبه،</span></p>`},
{html:`<p><span class="s" data-sq="sherri i krijesave. Allahu i Lartësuar tha:">شر الخلق، قال الله تعالىٰ:</span> <span class="s quran" data-sq="Vërtet, Faraoni u bë kryelartë në tokë dhe e ndau popullin e saj në grupe, duke dobësuar njërin grup prej tyre — u therte djemtë dhe ua linte vajzat gjalla. Vërtet, ai ishte nga shkatërruesit. [El-Kasas: 4]">﴿إِنَّ فِرْعَوْنَ عَلَا فِي الْأَرْضِ وَجَعَلَ أَهْلَهَا شِيَعًا يَسْتَضْعِفُ طَائِفَةً مِّنْهُمْ يُذَبِّحُ أَبْنَاءَهُمْ وَيَسْتَحْيِي نِسَاءَهُمْ إِنَّهُ كَانَ مِنَ الْمُفْسِدِينَ﴾ [القصص: ٤].</span></p><p><span class="s" data-sq="Transmeton Muslimi në 'Sahihun' e tij nga Ibn Mes'udi — Allahu qoftë i kënaqur me të — se tha: i Dërguari i Allahut ﷺ tha:">ورويٰ مسلم في «صحيحه» عن ابن مسعود رضي الله عنه قال: قال رسول الله ﷺ:</span> <span class="s hadith" data-sq="'Nuk hyn në Xhenet kush ka në zemër sa një grimcë mendjemadhësie, dhe nuk hyn në Zjarr kush ka në zemër sa një grimcë besimi.' Dikush tha: O i Dërguar i Allahut, unë dua të kem rroba të bukura e këpucë të bukura, a është kjo mendjemadhësi? Tha: 'Jo, mendjemadhësia është mohimi i të vërtetës dhe përbuzja e njerëzve.'">«لا يدخلُ الجنةَ من كان في قلبه مثقال ذرَّة من كِبر، ولا يدخل النارَ من كان في قلبه ذرة من إيمان»، فقال رجل: يا رسول الله، إني أحبُّ أن يكون ثوبي حسنًا ونعلي حسنًا أفمن الكبْر ذاك؟ قال: «لا، الكبْر بَطَرُ الحق وغَمطُ الناس».</span></p><p><span class="s" data-sq="Pra mohimi i të vërtetës: refuzimi i saj, dhe përbuzja e njerëzve: nënçmimi e përçmimi i tyre. Kjo është gjendja e atij që do lartësi në tokë e shkatërrim.">فبَطَر الحق: جَحْده، وغَمط الناس: احتقارهم وازدراؤهم. فهذه حال من يريد العلو في الأرض والفساد.</span></p><p><span class="s" data-sq="Lloji i dytë: ata që duan shkatërrim pa lartësi, si hajdutët e kriminelët nga fundërrinja e njerëzve.">والقسم الثاني: الذين يريدون الفساد بلا علو، كالسُّرَّاق والمجرمين من سَفَلَة الناس ونحوهم.</span></p><p><span class="s" data-sq="Lloji i tretë: ata që duan lartësi pa shkatërrim, si ata që kanë fe e duan të lartësohen me të mbi njerëzit — kjo gjendet më shumë te ata që merren me ndonjë lloj dije ose devotshmërie.">والثالث: يريدون العلوَّ بلا فساد، كالذين عندهم دين يريدون أن يعلوا به علىٰ غيرهم من الناس، وهو أكثر في المتعلقة بنوعٍ من العلم أو نوع من الورع.</span></p><p><span class="s" data-sq="Lloji i katërt: ata janë banorët e Xhenetit, që nuk duan as lartësi në tokë e as shkatërrim.">وأما القسم الرابع: فهم أهل الجنة، الذين لا يريدون علوًّا في الأرض ولا</span></p>`},
{html:`<p><span class="s" data-sq="shkatërrim, edhe pse ata mund të jenë më të lartë se të tjerët, siç tha i Lartësuari:">فسادًا، مع أنهم قد يكونون أعلىٰ من غيرهم، كما قال تعالىٰ:</span> <span class="s quran" data-sq="Mos u dobësoni e mos u trishtoni, ju jeni më të lartit nëse jeni besimtarë. [Al Imran: 139]">﴿وَلَا تَهِنُوا وَلَا تَحْزَنُوا وَأَنتُمُ الْأَعْلَوْنَ إِن كُنتُم مُّؤْمِنِينَ﴾ [آل عمران: ١٣٩]،</span> <span class="s" data-sq="dhe tha i Lartësuari:">وقال تعالىٰ:</span> <span class="s quran" data-sq="E mos u dobësoni e të ftoni për paqe, derisa jeni ju më të fuqishmit. Allahu është me ju dhe nuk ua pakëson veprat tuaja. [Muhammed: 35]">﴿فَلَا تَهِنُوا وَتَدْعُوا إِلَى السَّلْمِ وَأَنتُمُ الْأَعْلَوْنَ وَاللَّهُ مَعَكُمْ وَلَن يَتِرَكُمْ أَعْمَالَكُمْ﴾ [محمد: ٣٥]،</span> <span class="s" data-sq="dhe tha:">وقال:</span> <span class="s quran" data-sq="...e Allahut i takon krenaria, edhe të Dërguarit të Tij, edhe besimtarëve. [El-Munafikun: 8]">﴿وَلِلَّهِ الْعِزَّةُ وَلِرَسُولِهِ وَلِلْمُؤْمِنِينَ﴾ [المنافقون: ٨].</span></p><p><span class="s" data-sq="Sa ka që duan lartësi e nuk u shton veçse poshtësi, dhe sa ka që janë bërë nga më të lartit pa dashur as lartësi as shkatërrim. Kjo sepse dëshira e njeriut për t'u bërë më i larti ndërsa i ngjashmi i tij të jetë poshtë, është padrejtësi. Pastaj njerëzit e urrejnë dhe e armiqësojnë këtë njeri, sepse i drejti nuk pranon të nënshtrohet prej të ngjashmit, e i padrejti do vetë të jetë nënshtrues.">فكم ممن يريد العلوَّ ولا يزيده ذلك إلا سفولًا، وكم ممن جعل من الأغلين وهو لا يريد العلوَّ ولا الفساد، وذلك لأن إرادة العلو علىٰ الناس من جنس واحد فبإرادة الإنسان أن يكون هو الأعلىٰ ونظيره تحته ظلمٌ له. ثم مع أنه ظلم فالناس يبغضون من يكون كذلك ويعادونه؛ لأن العادل منهم ما يحب أن يكون مقهورًا لنظيره، وغير العادل منهم يُؤثِر أن يكون هو القاهر.</span></p><p><span class="s" data-sq="Kush do lartësi, i prishet feja e dynjaja nga padrejtësia e armiqësia e njerëzve, dhe i duhen ndihmës kundër armiqve, por ndihmësit në të vërtetë janë armiq të tij — e ndihmojnë vetëm për epshet e veta. Prandaj kush kërkon kryesinë është budalla e injorant, dhe">فمريدُ العلوِّ فسد عليه دينُه ودنياه بظلم الناس ومعاداتهم لذلك، فيحتاج لذلك إلىٰ أعوانه يدفعون أعداءه، والأعوان في الحقيقة أعداء له، إنما يعينونه لما ينالونه من أهوائهم، فلهذا كان من طلبَ الرياسة إليه أحمقَ جاهلًا، وإنما</span></p>`},
{html:`<p><span class="s" data-sq="e kërkuara prej saj është ajo me çka njeriu largon dëmin në fenë e dynjanë e tij — që në të vërtetë është largim i lartësisë së padrejtë të tjetrit mbi të, jo dëshirë e lartësisë mbi tjetrin — kjo nuk quhet veçse kryesi.">المطلوب منها ما يدفع به الإنسان عنه الضرر في دينه ودنياه، وهو في الحقيقة دفع علوٍّ غيره عنه بالباطل، لا إرادة منه علوًّا علىٰ غيره إلا يسمىٰ إلا برياسة.</span></p><p><span class="s" data-sq="Sa i përket atij që hyn në të me sinqeritet fetar, siç hyn njeriu në xhihad duke dhënë veten e pasurinë — ky është ai që beson se kjo i largon fitnën në fe, por veçse kë e mbron Allahu, dhe dëmin në dynja, veçse kë e ndihmon Allahu i Lartësuar.">وأما من دخل فيه ديانةً كما يدخل الرجل في الجهاد باذلًا نفسَه ومالَه، فهذا هو الذي يعد اعتقاده أدفع ما فيها من الفتنة في الدين إلا من عصم الله، والمضرَّة في الدنيا إلا لمن أيَّده الله تعالىٰ.</span></p><p><span class="s" data-sq="Doemos — në arsye e fe — disa të jenë mbi disa, siç e kemi sqaruar, ashtu si trupi nuk rregullohet pa kokë. Allahu i Lartësuar tha:">ولا بد ـ في العقل والدين ـ من أن يكون بعضهم فوق بعض، كما قد بيناه، كما أن الجسد لا يصلح إلا برأس فقال تعالىٰ:</span> <span class="s quran" data-sq="Ai është që ju bëri zëvendës në tokë dhe ju ngriti disa nga ju mbi disa të tjerë në shkallë, që t'ju sprovojë me atë çka u dha. [El-En'am: 165]">﴿وَهُوَ الَّذِي جَعَلَكُمْ خَلَائِفَ الْأَرْضِ وَرَفَعَ بَعْضَكُمْ فَوْقَ بَعْضٍ دَرَجَاتٍ لِّيَبْلُوَكُمْ فِي مَا آتَاكُمْ﴾ [الأنعام: ١٦٥]،</span> <span class="s" data-sq="dhe tha i Lartësuari:">وقال تعالىٰ:</span> <span class="s quran" data-sq="Ne e ndamë ndërmjet tyre jetesën e tyre në këtë botë dhe i ngritëm disa mbi disa të tjerë në shkallë, që disa prej tyre t'i marrin disa të tjerë në shërbim. [Ez-Zuhruf: 32]">﴿نَحْنُ قَسَمْنَا بَيْنَهُم مَّعِيشَتَهُمْ فِي الْحَيَاةِ الدُّنْيَا وَرَفَعْنَا بَعْضَهُمْ فَوْقَ بَعْضٍ دَرَجَاتٍ لِّيَتَّخِذَ بَعْضُهُم بَعْضًا سُخْرِيًّا﴾ [الزخرف: ٣٢]،</span> <span class="s" data-sq="prandaj erdhi Sheriati duke e bërë sundimin e pasurinë në rrugën e Allahut si ndihmë për fenë e Allahut.">فلذلك جاءت الشريعة بجعل السلطان والمال في سبيل الله تعالىٰ عونًا علىٰ دين الله.</span></p>`},
{html:`<p><span class="s" data-sq="Nëse qëllimi me sundimin e pasurinë është afrimit ndaj Allahut e vendosja e fesë së Tij, dhe shpenzimi i tyre në rrugën e Tij — kjo është mirëqenia e fesë e dynjasë. Por nëse sundimi ndahet nga feja, ose feja nga sundimi, prishen gjendjet e njerëzve në pasuri.">فإذا كان المقصود بالسلطان والمال هو التقرب إلىٰ الله وإقامة دينه، وإنفاق ذلك في سبيله= كان ذلك صلاح الدين والدنيا، وإن انفرد السلطان عن الدين أو الدين عن السلطان فسدت أحوال الناس في الأموال.</span></p><p><span class="s" data-sq="Njerëzit e bindshëm ndaj Allahut dallohen nga mëkatarët me nijet e vepra të mira, siç erdhi në 'Sahih' nga Profeti ﷺ se tha:">وإنما يتميَّز أهلُ طاعة الله عن أهل معصية الله بالنية والعمل الصالح، كما جاء في «الصحيح» عن النبي ﷺ أنه قال:</span> <span class="s hadith" data-sq="'Allahu nuk shikon pamjet e pasuritë tuaja, por shikon zemrat e veprat tuaja.'">«إنَّ الله لا ينظرُ إلىٰ صوركم وأموالكم، وإنما ينظر إلىٰ قلوبكم وأعمالكم».</span></p><p><span class="s" data-sq="Kur shumicës së sundimtarëve u mbizotëroi dëshira e pasurisë e kryesisë, dhe u larguan nga hakikati i besimit në qeverisjen e tyre — shumë njerëz menduan se qeverisja bie ndesh me besimin e plotësinë e fesë.">ولما غلب علىٰ كثير من ولاة الأمور إرادة المال والشرف، وصاروا بمعزلٍ عن حقيقة الإيمان في ولايتهم= رأىٰ كثيرٌ من الناس أنَّ الإمارات تنافي الإيمان وكمال الدين.</span></p><p><span class="s" data-sq="Prej tyre ka që i dha përparësi fesë duke braktisur atë pa çka feja nuk plotësohet. Dhe prej tyre ka që pa fenë e mori qeverisjen duke besuar se ajo bie ndesh me të. Kështu feja për ta u bë në vendin e mëshirës e përulësisë, jo në vendin e lartësisë e krenarisë.">ثم منهم من غلَّب الدينَ وأعرضَ عما لا يتمُّ الدينُ إلا به من ذلك، ومنهم من رأىٰ حاجته إلىٰ ذلك فأخذه معرِضًا عن الدين؛ لاعتقاده أنه مناف لذلك، وصار الدينُ عنده في محلِّ الرحمة والذل، لا في محلِّ العلوِّ والعزِّ.</span></p><p><span class="s" data-sq="Po ashtu kur shumicës së fetarëve u mbizotëroi paaftësia për plotësimin e">وكذلك لما غلبَ علىٰ كثير من أهل الديّانين العجزُ عن تكميل</span></p>`},
{html:`<p><span class="s" data-sq="fesë, dhe dështimi për shkak të sprovave që i godasin në vendosjen e fesë — e dobësoi rrugën e tyre, dhe e përuli atë kush mendoi se interesi i tij e i të tjerëve nuk arrihet me të.">الدين، والجَزَعُ لما قد يصيبهم في إقامته من البلاء= استضعفَ طريقَهم واستذلَّها مَن رأىٰ أنه لا تقوم مصلحتُه ومصلحة غيره بها.</span></p><p><span class="s" data-sq="Këto janë dy rrugët e prishura: rruga e atij që i atribuohet fesë pa e plotësuar me sundim, xhihad e pasuri që i nevojiten, dhe rruga e atij që merret me sundimin, pasurinë e luftën pa synuar vendosjen e fesë — e para është rruga e të humburve (nasara), e dyta e të zemëruarve (jehudi).">وهذان السبيلان الفاسدان: سبيل من انتسب إلىٰ الدين ولم يكمله بما يحتاج إليه من السلطان والجهاد والمال، وسبيل من أقبل علىٰ السلطان والمال والحرب، ولم يقصد بذلك إقامة الدين= هما سبيل المغضوب عليهم والضالين، الأول للضالين النصارىٰ، والثانية للمغضوب عليهم اليهود.</span></p><p><span class="s" data-sq="Ndërsa Rruga e Drejtë — rruga e atyre që Allahu u dha mirësi nga profetët, besnikët, dëshmorët e të mirët — është rruga e Profetit tonë Muhamed ﷺ dhe e pasuesve të tij, dhe e atyre që ndoqën rrugën e tyre:">وأما الصراط المستقيم؛ صراط الذين أنعم الله عليهم من النبيين والصديقين والشهداء والصالحين، هي سبيل نبينا محمد ﷺ، وسبيل خلفائه وأصحابه، ومَن سلك سبيلهم، وهم:</span> <span class="s quran" data-sq="Dhe të parët nga muhaxhirët e ensarët, dhe ata që i ndoqën me të mirë — Allahu është i kënaqur me ta dhe ata me Të, dhe u ka përgatitur xhenete nën të cilat rrjedhin lumenj. [Et-Teube: 100]">﴿وَالسَّابِقُونَ الْأَوَّلُونَ مِنَ الْمُهَاجِرِينَ وَالْأَنصَارِ وَالَّذِينَ اتَّبَعُوهُم بِإِحْسَانٍ رَّضِيَ اللَّهُ عَنْهُمْ وَرَضُوا عَنْهُ وَأَعَدَّ لَهُمْ جَنَّاتٍ تَجْرِي تَحْتَهَا الْأَنْهَارُ خَالِدِينَ فِيهَا أَبَدًا ذَٰلِكَ الْفَوْزُ الْعَظِيمُ﴾ [التوبة: ١٠٠].</span></p><p><span class="s" data-sq="Obligimi i myslimanit është të përpiqet në këtë sipas mundësisë. Kush merr qeverisje duke synuar bindjen ndaj Allahut, vendosjen e fesë sipas mundësisë, kryerjen e obligimeve dhe shmangien e harameve — nuk ngarkohet me atë që nuk e arrin,">فالواجب علىٰ المسلم أن يجتهد في ذلك بحسب وسعه، فمن ولي ولايةً قصد بها طاعة الله، وإقامة ما يمكنه من دينه، ومصالح المسلمين، وأقام فيها ما يمكنه من الواجبات، واجتنب ما يمكنه من المحرمات= لم يؤاخذ</span></p>`},
{html:`<p><span class="s" data-sq="me atë që nuk e arrin. Sepse qeverisja e të mirëve është më e mirë për umetin sesa qeverisja e mëkatarëve. Kush nuk arrin të vendosë fenë me sundim e xhihad, le ta bëjë atë çka mundet me zemër, lutje për umetin, dashuri për të mirën, dhe kryerje e obligimeve sipas mundësisë — nuk ngarkohet me atë që nuk e arrin.">بما يعجز عنه. فإن تولية الأبرار خير للأمة من تولية الفجار، ومن كان عاجزًا عن إقامة الدين بالسلطان والجهاد، ففَعَل ما يقدر عليه بقلبه، والدعاء للأمة، ومحبَّة الخير وأهله، وفعَل ما يقدرُ عليه من الواجبات= لم يُكَلَّف بما يعجز عنه،</span></p><p><span class="s" data-sq="sepse baza e fesë është Libri udhëzues dhe hekuri ndihmës, siç përmendi Allahu i Lartësuar.">فإنَّ قوام الدين بالكتاب الهادي والحديد الناصر، كما ذكر الله تعالىٰ.</span></p><p><span class="s" data-sq="Secili duhet të përpiqet në përputhjen e Kuranit e hadithit për Allahun, dhe të kërkojë prej Tij çka ka, duke u ndihmuar me Allahun në këtë. Pastaj dynjaja i shërben fesë, siç tha Muadh ibn Xhebeli: Biri i Ademit ka nevojë për pasurinë e kësaj bote; nëse jeni nevojtarë për pjesën e ahiretit, është edhe më e nevojshme. Nëse filloni me ahiretin, fitoni edhe dynjanë rregullisht; por nëse filloni me dynjanë, rrezikoni ta humbni ahiretin.">فعلىٰ كلِّ أحدٍ الاجتهاد في اتفاق القرآن والحديد لله، ويطلب ما عنده مستعينًا بالله في ذلك. ثم الدنيا تخدم الدين، كما قال معاذ بن جبل: ابن آدم مستعينًا بالله في ذلك. ثم الدنيا تخدم الدين، كما قال معاذ بن جبل: ابن آدم أنت محتاجٌ إلىٰ نصيبك من الدنيا، وأنت إلىٰ نصيبك من الآخرة أحْوَج، فإن بدأتَ بنصيبك من الآخرة مرَّ بنصيبك مِن الدنيا فانتظَمْتَه انتظامًا، وإن بدأتَ بنصيبك من الدنيا فاتَك نصيبُك من الآخرة، وأنتَ مِن الدنيا علىٰ خطر.</span></p><p><span class="s" data-sq="Dëshmi për këtë: transmetohet nga Tirmidhiu nga Profeti ﷺ se tha:">ودليل ذلك: ما رواه الترمذي عن النبي ﷺ أنه قال:</span> <span class="s hadith" data-sq="'Kush zgjohet dhe ahireti i është brenga më e madhe, Allahu ia mbledh punët, ia vendos pasurinë në zemër, dhe dynjaja i vjen e nënshtruar. E kush zgjohet dhe dynjaja i është brenga më e madhe, Allahu ia shpërndan punët, ia vendos varfërinë para syve, dhe nuk i vjen nga dynjaja veçse çka i është shkruar.'">«من أصبح والآخرة أكبر هَمِّه جمع الله له شمله، وجعل غناه في قلبه، وأتته الدنيا وهي راغمة. ومن أصبح والدنيا أكبر هَمِّه فرَّق الله عليه ضيعته وجعل فقره بين</span></p>`},
{html:`<p><span class="s" data-sq="syve, dhe nuk i vjen nga dynjaja veçse çka i është shkruar.'">عينيه، ولم يأته من الدنيا إلا ما كُتِب له».</span></p><p><span class="s" data-sq="Baza e kësaj, siç tha Allahu i Lartësuar:">وأصل ذلك كما قال الله تعالىٰ:</span> <span class="s quran" data-sq="Unë nuk i krijova xhinët e njerëzit veçse të më adhurojnë. Unë nuk dua prej tyre furnizim, e as nuk dua të më ushqejnë. Allahu është Furnizuesi, Zotëruesi i forcës, i Pathyeshmi. [Edh-Dharijat: 56-58]">﴿وَمَا خَلَقْتُ الْجِنَّ وَالْإِنسَ إِلَّا لِيَعْبُدُونِ ۝ مَا أُرِيدُ مِنْهُم مِّن رِّزْقٍ وَمَا أُرِيدُ أَن يُطْعِمُونِ ۝ إِنَّ اللَّهَ هُوَ الرَّزَّاقُ ذُو الْقُوَّةِ الْمَتِينُ﴾ [الذاريات: ٥٦-٥٨].</span></p><p><span class="s" data-sq="I lutemi Allahut të Madhërishëm të na japë sukses neve, vëllezërve tanë e gjithë myslimanëve, në atë çka Ai e do e që e kënaq, nga fjala e vepra, sepse nuk ka forcë e as fuqi veçse me Të. Falënderimet i takojnë Allahut, Zotit të botëve. Allahu e bekoftë e e përshëndettë Muhamedin, familjen e shokët e tij, me përshëndetje të shumta.">فنسأل الله العظيم أن يوفقنا وسائر إخواننا، وجميع المسلمين، لما يحبه لنا ويرضاه من القول والعمل، فإنه لا حول ولا قوة إلا به، والحمد لله رب العالمين، وصلىٰ الله علىٰ محمد وعلىٰ آله وصحبه وسلم تسليمًا كثيرًا.</span></p><p class="section-mark">❊ ❊ ❊</p><p><span class="s" data-sq="U kopjua nga një kopje e shkruar me dorën e autorit — Allahu e shpërbleftë. Përfundoi kopjimi ditën e xhuma, të tetën e muajit Rebiu'l-Evvel, vitin njëqind e tetëdhjetë e shtatëqind (780 h.).">نقلت من نسخة نقلت جُلَّها بخط المصنف نفع الله به. وكان الفراغ من نسخها بكرة الجمعة ثامن شهر ربيع الأول سنة إحدىٰ وثمانين وسبعمائة، والحمد لله وحده.</span></p><p class="section-mark">﷽</p>`}
];

let cp=0,mode='sentence',activeEl=null;
const pe=document.getElementById('page'),pn=document.getElementById('pageNum'),pb=document.getElementById('prevBtn'),nb=document.getElementById('nextBtn'),pu=document.getElementById('popup'),pt=document.getElementById('pText'),ov=document.getElementById('overlay'),cb=document.getElementById('closeBtn');

function render(){
const old=pe.querySelector('.page-text');if(old)old.remove();
const d=document.createElement('div');d.className='page-text';
if(mode==='word')d.classList.add('word-mode');
d.innerHTML=pages[cp].html;pe.appendChild(d);pe.scrollTop=0;
pn.textContent=(cp+1)+' / '+pages.length;
pb.disabled=cp===0;nb.disabled=cp===pages.length-1;
hide();
}

function show(el,txt){
if(activeEl)activeEl.classList.remove('active');
activeEl=el;el.classList.add('active');
pt.textContent=txt;pu.classList.add('visible');ov.classList.add('active');
const r=el.getBoundingClientRect(),pw=Math.min(420,window.innerWidth-32);
pu.style.width=pw+'px';
let l=r.left+r.width/2-pw/2;
l=Math.max(16,Math.min(l,window.innerWidth-pw-16));
let t=r.bottom+10;pu.style.transform='';
if(t+120>window.innerHeight){t=r.top-10;pu.style.transform='translateY(-100%)';}
pu.style.left=l+'px';pu.style.top=t+'px';
}

function hide(){pu.classList.remove('visible');ov.classList.remove('active');if(activeEl){activeEl.classList.remove('active');activeEl=null}}

pe.addEventListener('click',e=>{
if(mode==='word'){const w=e.target.closest('.w');if(w&&w.dataset.sq){e.stopPropagation();show(w,w.dataset.sq);return}}
const s=e.target.closest('.s');if(s&&s.dataset.sq){show(s,s.dataset.sq);return}
hide();
});

ov.addEventListener('click',hide);
cb.addEventListener('click',hide);

document.addEventListener('keydown',e=>{
if(e.key==='Escape')hide();
if(e.key==='ArrowLeft'&&cp>0){cp--;render()}
if(e.key==='ArrowRight'&&cp<pages.length-1){cp++;render()}
});

pb.addEventListener('click',()=>{if(cp>0){cp--;render()}});
nb.addEventListener('click',()=>{if(cp<pages.length-1){cp++;render()}});

document.querySelectorAll('.mode-btn').forEach(b=>b.addEventListener('click',()=>{
document.querySelectorAll('.mode-btn').forEach(x=>x.classList.remove('active'));
b.classList.add('active');mode=b.dataset.mode;
const t=pe.querySelector('.page-text');
if(t)t.classList.toggle('word-mode',mode==='word');
hide();
}));

render();
</script>
