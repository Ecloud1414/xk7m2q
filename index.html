<p><span class="s" data-sq="Nga Amr ibn Shu'ajbi, nga babai i tij, nga gjyshi i tij, tha: Dëgjova një burrë nga Muzejne duke pyetur të Dërguarin e Allahut ﷺ. Tha: O i Dërguar, erdha të pyes për kafshën e humbur nga devetë?"><span class="w" data-sq="nga Amr ibn Shu'ajbi, nga babai i tij, nga gjyshi i tij">وعن عمرو بن شعيب عن أبيه عن جده قال:</span> <span class="w" data-sq="dëgjova një burrë nga Muzejne duke pyetur Pejgamberin ﷺ">سمعت رجلًا من مُزَينة يسأل رسول الله ﷺ</span> <span class="w" data-sq="o i Dërguar, erdha të pyes për kafshën e humbur nga devetë">قال: يا رسول الله، جئت أسألك عن الضالة من الإبل؟</span></span> <span class="s hadith" data-sq="Me të është ushqimi dhe uji i saj, ha pemët dhe shkon te uji — lerë derisa ta gjejë pronari.">«معها جِذاؤها وسِقاؤها تأكل الشجَر وتَرِد الماء، فدَعها حتى يأتيها باغيها».</span> <span class="s" data-sq="Tha: Po e humbura nga delet?">قال: الضالة من الغنم؟ قال:</span> <span class="s hadith" data-sq="Për ty, ose për vëllaun tënd, ose për ujkun — merre derisa ta gjejë pronari.">«لك أو لأخيك أو للذئب تجمعها حتى يأتيها باغيها».</span> <span class="s" data-sq="Tha: Po kafsha e grabitur nga kullota?">قال: الحريسة التي تؤخذ من مراتعها؟ قال:</span> <span class="s hadith" data-sq="Për të, çmimi i saj dyfish dhe rrahje ndëshkimi; e çfarë merret nga vendi i ruajtur, ka prerje nëse arrin çmimin e mburojës.">«فيها ثمنها مرتين وضَرْب نكال، وما أُخِذ من عَطَنِه ففيه القطع إذا بلغ ما يؤخذ من ذلك ثمن المِجَنّ».</span> <span class="s" data-sq="Tha: O i Dërguar, po frutat dhe çfarë merret nga mbështjellësat e tyre?">قال: يا رسول الله، فالثمار وما أُخِذ منها من أكمامها؟ قال:</span> <span class="s hadith" data-sq="Kush merr me gojë pa e fshehur në gji, nuk ka mbi të asgjë; e kush mbart, mbi të çmimi i saj">«من أخذ بفمه ولم يتخذ خُبْنَةً فليس عليه شيء، ومن احتمل فعليه ثمنه</span></p>`}
,{html:`<p><span class="s hadith" data-sq="dyfish dhe rrahje ndëshkimi. E çfarë merret nga hambarët, ka prerje nëse arrin çmimin e mburojës; e çfarë nuk arrin çmimin e mburojës, ka gjobë dyfish e kamxhikë ndëshkimi.">مرتين وضربًا ونكالًا، وما أُخِذ من أجرانه ففيه القطع إذا بلغ ما يُؤخَذ من ذلك ثمن المِجَنّ، وما لم يبلغ ثمن المجنّ ففيه غرامة مِثليه وجلداتُ نكال»</span> <span class="s" data-sq="Transmetuar nga autorët e Suneneve, por ky është formulimi i Nesaiut.">رواه أهل السنن لكن هذا سياق النسائي.</span></p>

<p><span class="s" data-sq="Gjithashtu Pejgamberi ﷺ tha:">وكذلك قال النبي ﷺ:</span> <span class="s hadith" data-sq="Nuk ka prerje për plaçkitësin, as për vjedhësin e shpejtë, as për tradhtarin.">«ليس على المُنْتَهِب، ولا على المُخْتَلِس، ولا الخائن قَطْع».</span></p>

<p><span class="s" data-sq="Plaçkitësi (muntehib): ai që rrëmben sendin ndërsa njerëzit shikojnë. Mukhteles-i: ai që tërheq sendin dhe dihet para se ta marrë. Sa i përket tarrarit — ai që pret"><span class="w" data-sq="plaçkitësi: ai që rrëmben sendin ndërsa njerëzit shikojnë">فالمنتهب: الذي ينهب الشيءَ والناسُ ينظرون،</span> <span class="w" data-sq="mukhteles-i: ai që tërheq sendin dhe dihet para se ta marrë">والمختلس: الذي يجتذب الشيء فيُعلَم به قبل أخذه.</span> <span class="w" data-sq="sa i përket tarrarit — ai që pret">فأما الطرّار وهو البطّاط الذي يبط</span></span></p>`}
,{html:`<p><span class="s" data-sq="xhepat, shamitë, mëngët e ngjashëm — atij i pritet sipas mendimit të saktë.">الجيوب والمناديل والأكمام ونحوها؛ فإنه يُقْطَع على الصحيح.</span></p>

<h2 class="fasl">فصل</h2>

<p><span class="s" data-sq="Sa i përket zinaqarit: nëse është muhsan (i martuar), guroret me gurë deri sa të vdesë, siç guori Pejgamberi ﷺ Ma'iz ibn Malikun El-Eslemin, guori Gamidijen, guori dy çifutët, dhe guori të tjerë. Muslimanët pas tij vazhduan me guorim."><span class="w" data-sq="sa i përket zinaqarit: nëse është muhsan">وأما الزاني: فإن كان مُحصَنًا</span> <span class="w" data-sq="guroret me gurë deri sa të vdesë">فإنه يُرجَم بالحجارة حتى يموت،</span> <span class="w" data-sq="siç guori Pejgamberi ﷺ Ma'iz ibn Malikun, Gamidijen, dy çifutët e të tjerë">كما رجم النبي ﷺ ماعزَ بن مالك الأسلمي، ورجم الغامدية، ورجم اليهوديين،</span> <span class="w" data-sq="dhe guori të tjerë; muslimanët pas tij vazhduan">ورجم غير هؤلاء، ورجم المسلمون بعده.</span></span></p>

<p><span class="s" data-sq="Dijetarët kanë mospajtime: a kamxhikohet njëqind herë para guorimit? Në dy mendime në medh'hebin e Ahmedit e të tjerëve.">وقد اختلف العلماء هل يُجلَد قبل الرجم مئة؟ على قولين في مذهب أحمد وغيره.</span></p>

<p><span class="s" data-sq="Nëse nuk është muhsan, kamxhikohet njëqind kamxhikë sipas Librit të Allahut dhe dëbohet një vit sipas Sunnetit të të Dërguarit ﷺ, edhe pse disa dijetarë nuk e shohin dëbimin si obligim."><span class="w" data-sq="nëse nuk është muhsan, kamxhikohet njëqind sipas Librit të Allahut">وإن كان غير مُحْصَن فإنه يُجلَد مئة جلدة بكتاب الله</span> <span class="w" data-sq="dhe dëbohet një vit sipas Sunnetit">ويُغَرَّب عامًا بسنة رسول الله ﷺ،</span> <span class="w" data-sq="edhe pse disa dijetarë nuk e shohin dëbimin obligim">وإن كان بعض العلماء لا يرى وجوب التغريب.</span></span></p>

<p><span class="s" data-sq="Nuk zbatohet dënimi mbi të derisa të dëshmojnë katër dëshmitarë, ose të dëshmojë kundër vetes katër dëshmi — sipas shumicës së dijetarëve. Ka prej tyre që mjaftohen me dëshminë e tij një herë. E nëse pranon kundër vetes pastaj tërhiqet, prej tyre ka që thonë:"><span class="w" data-sq="nuk zbatohet dënimi derisa dëshmojnë katër dëshmitarë">ولا يُقام عليه الحدُّ حتى يشهد عليه أربعة شهداء،</span> <span class="w" data-sq="ose dëshmojë kundër vetes katër dëshmi">أو يشهد على نفسه أربعَ شهادات عند كثير من العلماء أو أكثرهم،</span> <span class="w" data-sq="ka prej tyre që mjaftohen me dëshminë e tij një herë">ومنهم من يكتفي بشهادته على نفسه مرة واحدة.</span> <span class="w" data-sq="nëse pranon pastaj tërhiqet, prej tyre ka që thonë:">ولو أقرَّ على نفسه ثم رجع، فمنهم مَن يقول:</span></span></p>`}
,{html:`<p><span class="s" data-sq="bie dënimi nga ai; dhe prej tyre ka që thonë: nuk bie."><span class="w" data-sq="bie dënimi nga ai">يسقط عنه الحد،</span> <span class="w" data-sq="dhe prej tyre ka që thonë: nuk bie">ومنهم من يقول: لا يسقط.</span></span></p>

<p><span class="s" data-sq="Muhsani: ai që ka kryer marrëdhënie dhe ai është i lirë, i ngarkuar, me atë që e ka martuar me nikah të saktë, në organin e saj, qoftë edhe një herë. Nëse i plotësuari kryen me të mangëtën ose anasjelltas, ka mospajtime mes fukahave. Kur kryen me të një herë, bëhet muhsan — guroret nëse bën zina edhe nëse nuk është i martuar në kohën e zinasë."><span class="w" data-sq="muhsani: ai që ka kryer marrëdhënie, i lirë, i ngarkuar, me atë që e ka martuar me nikah të saktë">والمُحْصَن: من وَطِئ وهو حرٌّ مكلَّف لمن تزوجها نكاحًا صحيحًا في قُبُلها ولو مرّة واحدة،</span> <span class="w" data-sq="nëse i plotësuari kryen me të mangëtën ose anasjelltas, ka mospajtime">فإن وطئ كاملٌ ناقصةً أو بالعكس، ففي إحصان الكامل تنازع بين الفقهاء،</span> <span class="w" data-sq="kur kryen një herë, bëhet muhsan — guroret edhe nëse nuk është i martuar gjatë zinasë">ومتى وطئها مرةً صار مُحْصَنًا يُرجَم إذا زنى ولو لم يكن حين الزنا متزوجًا.</span></span></p>

<p><span class="s" data-sq="[A kushtohet që gruaja të jetë e barabartë me burrin në këto cilësi? Në dy mendime. A e bën muhsan adoleshentja të rriturin dhe anasjelltas?"><span class="w" data-sq="a kushtohet që gruaja të jetë e barabartë në këto cilësi?">[وهل يشترط أن تكون الموطوءة مساوية للواطع في هذه الصفات؟</span> <span class="w" data-sq="në dy mendime">على قولين للعلماء.</span> <span class="w" data-sq="a e bën muhsan adoleshentja të rriturin dhe anasjelltas?">وهل تُحصِن المراهقة البالغ وبالعكس؟</span></span></p>

<p><span class="s" data-sq="Sa i përket ehlul dhimme-ve, ata bëhen muhsan gjithashtu sipas shumicës së dijetarëve, si Shafiu dhe Ahmedi; sepse Pejgamberi ﷺ guori dy çifutë te dera e xhamisë, dhe ky ishte guorimi i parë në Islam.]"><span class="w" data-sq="ehlul dhimme-t bëhen muhsan sipas shumicës së dijetarëve, si Shafiu dhe Ahmedi">فأما أهل الذمة فإنهم يُحصِنون أيضًا عند أكثر العلماء كالشافعي وأحمد؛</span> <span class="w" data-sq="sepse Pejgamberi ﷺ guori dy çifutë te dera e xhamisë, ky ishte guorimi i parë në Islam]">لأن النبي ﷺ رجم يهوديين على باب مسجده، وذلك أول رَجْم في الإسلام].</span></span></p>

<p><span class="s" data-sq="Kanë mospajtime për gruan kur gjendet shtatzënë pa pasur burrë e as pronar, dhe nuk"><span class="w" data-sq="kanë mospajtime për gruan shtatzënë pa burrë e as pronar">واختلفوا في المرأة إذا وُجِدت حُبلى ولم يكن لها زوج ولا سيِّد،</span> <span class="w" data-sq="dhe nuk">ولم</span></span></p>`}
,{html:`<p><span class="s" data-sq="pretendon dyshim në shtatzëninë, ka dy mendime tek Ahmedi e të tjerë. Thuhet: Nuk ka dënim mbi të sepse mundësohet të jetë e dhunuar, ose me mbartje, ose me marrëdhënie dyshimi. Thuhet: Përkundrazi, dënohet — ky është mendimi i transmetuar nga halifët e drejtë, më i ngjashmi me bazat e sheriatit, dhe medh'hebi i Medinës. Sepse mundësitë e rralla nuk merren parasysh, si mundësia e gënjeshtrës."><span class="w" data-sq="pretendon dyshim, ka dy mendime tek Ahmedi e të tjerë">تدَّع شبهةً في الحَبَل، ففيها قولان عند أحمد وغيره؛</span> <span class="w" data-sq="thuhet: nuk ka dënim sepse mundësohet e dhunuar, me mbartje, ose marrëdhënie dyshimi">قيل: لا حدَّ عليها لأنه يجوز أن تكون مكرهةً، أو بتحمُّل، أو بوطء شبهة.</span> <span class="w" data-sq="thuhet: dënohet — ky nga halifët e drejtë, më i ngjashmi me bazat e sheriatit">وقيل: بل تُحَد، وهذا المأثور عن الخلفاء الراشدين، وهو الأشبه بأصول الشريعة،</span> <span class="w" data-sq="medh'hebi i Medinës; mundësitë e rralla nuk merren parasysh">وهو مذهب أهل المدينة، فإن الاحتمالات النادرة لا يُلتفَت إليها، كاحتمال كذبها وكذب الشهود.</span></span></p>

<p><span class="s" data-sq="Sa i përket luvatijes: prej dijetarëve ka që thonë dënimi i tij si i zinaqarit, dhe thuhet nën atë. Mendimi i saktë në të cilin u pajtuan sahabët: vriten të dy — i sipërmi dhe i poshtmi — qofshin muhsan apo jo."><span class="w" data-sq="sa i përket luvatijes, prej dijetarëve ka që thonë: dënimi si i zinaqarit, dhe thuhet nën">وأما التلوُّط، فمن العلماء من يقول: حدُّه حد الزاني، وقد قيل دون ذلك،</span> <span class="w" data-sq="mendimi i saktë: vriten të dy — i sipërmi dhe i poshtmi — qofshin muhsan apo jo">والصحيح الذي اتفقت عليه الصحابة: أنه يُقْتَل الاثنان الأعلى والأسفل، سواءٌ كانا محصَنَيْن أو غير محصَنَيْن.</span></span></p>

<p><span class="s" data-sq="Sepse autorët e Suneneve transmetuan nga Ibn Abbasi nga Pejgamberi ﷺ se tha:">فإنَّ أهل السنن رووا عن ابن عباس عن النبي ﷺ قال:</span> <span class="s hadith" data-sq="Kush e gjeni duke bërë veprën e popullit të Lutit, vritni vepruesin dhe atë mbi të cilin veprohet.">«مَن وجدتموه يفعل فعل قوم لوط فاقتلوا الفاعلَ والمفعولَ به».</span></p>`}
,{html:`<p><span class="s" data-sq="Ebu Davudi transmeton nga Ibn Abbasi, radijallahu anhuma, për beqarin që kapet në livat, tha: Guroret.">ورويَ أبو داود عن ابن عباس رضي الله عنهما في البكر يوجد على اللوطية، قال: يُرْجَم.</span></p>

<p><span class="s" data-sq="Transmetohet nga Aliu ibn Ebi Talibi, radijallahu anhu, ngjashëm.">ورُوِي عن علي بن أبي طالب رضي الله عنه نحو ذلك.</span></p>

<p><span class="s" data-sq="Sahabët nuk kishin mospajtime për vrasjen e tij, por u ndanë në mënyrën. Nga Siddiku, radijallahu anhu, urdhëroi djegien; nga të tjerë: vrasjen; nga disa: t'i hidhet muri derisa vdes nën rrënoja; thuhet: burgosin të dy në vendin më të qelbur derisa vdesin; nga disa: ngrihet mbi murin më të lartë dhe hidhet e ndiqet me gurë, siç bëri Allahu me popullin e Lutit. Ky transmetim nga Ibn Abbasi; tjetri tha: guroret. Mbi këtë shumica e selefëve — medh'hebi i Medinës, Shamit dhe shumicës së fukahave të hadithit si Ahmedi në transmetimin më të saktë dhe Shafiu në njërin mendim."><span class="w" data-sq="sahabët nuk kishin mospajtime për vrasjen, por u ndanë në mënyrën">ولم تختلف الصحابةُ في قتله لكن تنوعوا فيه؛</span> <span class="w" data-sq="nga Siddiku: urdhëroi djegien; nga të tjerë: vrasjen">فروي عن الصديق رضي الله عنه أنه أمر بتحريقه، وعن غيره: قتله،</span> <span class="w" data-sq="nga disa: t'i hidhet muri derisa vdes; thuhet: burgosin në vendin më të qelbur">وعن بعضهم: أنه يُلقَى عليه جدار حتى يموت تحت الهدم، وقيل: يُحبسان في أنتَن موضع حتى يموتا،</span> <span class="w" data-sq="nga disa: ngrihet mbi murin më të lartë e hidhet e ndiqet me gurë, siç bëri Allahu me popullin e Lutit">وعن بعضهم: أن يُرفع على أعلى جدار في القرية ويُرمى منه ويُتْبَع بالحجارة، كما فعل الله بقوم لوط.</span> <span class="w" data-sq="ky transmetim nga Ibn Abbasi; tjetri: guroret. Mbi këtë shumica e selefëve">وهذه رواية عن ابن عباس رضي الله عنه والرواية الأخرى قال: يرجم، وعلى هذا أكثر السلف،</span> <span class="w" data-sq="medh'hebi i Medinës, Shamit, Ahmedit në transmetimin më të saktë, Shafiut në njërin mendim">وهو مذهب أهل المدينة والشام وأكثر فقهاء الحديث كأحمد في أصح روايتيه والشافعي في أحد قوليه.</span></span></p>`}
,{html:`<p><span class="s" data-sq="Thanë: Sepse Allahu guori popullin e Lutit, dhe u ligjërua guorimi i zinaqarit si ngjasim me guorimin e popullit të Lutit. Guroren të dy, qofshin të lirë apo robër, apo njëri rob i tjetrit, nëse janë të rritur. Nëse njëri nuk është i rritur, ndëshkohet me më pak se vrasje, dhe nuk guroret veçse i rrituri."><span class="w" data-sq="sepse Allahu guori popullin e Lutit, u ligjërua guorimi i zinaqarit si ngjasim">قالوا: لأن الله رجم قوم لوط، وشُرِعَ رجم الزاني تشبيهًا برجم قوم لوط.</span> <span class="w" data-sq="guroren të dy, qofshin të lirë apo robër, nëse janë të rritur">ويُرجم الاثنان سواء كانا حرَّيْن أو مملوكَيْن، أو كان أحدهما مملوكَ الآخر إذا كانا بالغَيْن،</span> <span class="w" data-sq="nëse njëri nuk është i rritur, ndëshkohet me më pak se vrasje">فإن كان أحدهما غير بالغ عُوقِب بما دون القتل،</span> <span class="w" data-sq="nuk guroret veçse i rrituri">ولا يُرجم إلا البالغ.</span></span></p>

<h2 class="fasl">فصل</h2>

<p><span class="s" data-sq="Sa i përket dënimit të pijes alkoolike: ai është i vërtetuar me Sunnetin e të Dërguarit ﷺ dhe konsensusin e muslimanëve. Autorët e Suneneve transmetuan nga Pejgamberi ﷺ nga disa rrugë se tha:"><span class="w" data-sq="sa i përket dënimit të pijes alkoolike: i vërtetuar me Sunnetin dhe konsensusin">وأما حدُّ الشُّرْب؛ فإنه ثابت بسنة رسول الله ﷺ، وإجماع المسلمين،</span> <span class="w" data-sq="autorët e Suneneve transmetuan nga Pejgamberi ﷺ se tha:">فقد رويَ أهل «السنن» عن النبي ﷺ من وجوه أنه قال:</span></span> <span class="s hadith" data-sq="Kush pi alkool, kamxhikojeni; pastaj nëse pi, kamxhikojeni; pastaj nëse pi, kamxhikojeni; të katërtën, vriteni.">«مَن شَرِبَ الخمرَ فاجلدوه، ثم إن شربَ فاجلدوه، ثم إن شربَ فاجلدوه، الرابعة فاقتلوه».</span></p>`}
,{html:`<p><span class="s" data-sq="Është vërtetuar se ai kamxhikoi pirësin më shumë se një herë — ai, halifët e tij dhe muslimanët pas tij.">وثبت عنه أنه جلد الشارب غير مرة هو وخلفاؤه والمسلمون بعده.</span></p>

<p><span class="s" data-sq="Vrasja sipas shumicës së dijetarëve është e abroguar; thuhet: është e vlefshme; dhe thuhet: është ta'zir që e bën imami kur ka nevojë.">والقتل عند أكثر العلماء منسوخ، وقيل: هو محكم، وقد يقال: هو تعزيرٌ يفعله الإمام عند الحاجة.</span></p>

<p><span class="s" data-sq="Është vërtetuar nga Pejgamberi ﷺ se goditi për alkool me degë palmash e nallane dyzet herë. Ebu Bekri goditi dyzet. Umeri në hilafeting goditi tetëdhjetë. Aliu, radijallahu anhu, godiste herë dyzet e herë tetëdhjetë."><span class="w" data-sq="Pejgamberi ﷺ goditi me degë palmash e nallane dyzet">وقد ثبت عن النبي ﷺ أنه ضرب في الخمر بالجريد والنعال أربعين،</span> <span class="w" data-sq="Ebu Bekri dyzet, Umeri tetëdhjetë">وضرب أبو بكر أربعين، وضرب عمر في خلافته ثمانين.</span> <span class="w" data-sq="Aliu godiste herë dyzet e herë tetëdhjetë">وكان علي رضي الله عنه يضرب مرة أربعين ومرة ثمانين.</span></span></p>

<p><span class="s" data-sq="Prej dijetarëve ka që thonë: obligohet tetëdhjetë; ka prej tyre: obligimi është dyzet, shtesa e bën imami kur ka nevojë — kur njerëzit bëhen alkoolistë ose pirësi nuk ndalet pa të, e ngjashëm."><span class="w" data-sq="ka që thonë: obligohet tetëdhjetë">فمن العلماء مَن يقول: يجب ضرب الثمانين،</span> <span class="w" data-sq="ka prej tyre: obligimi dyzet, shtesa e bën imami kur ka nevojë">ومنهم من يقول: الواجب أربعون، والزيادة يفعلها الإمامُ عند الحاجة،</span> <span class="w" data-sq="kur njerëzit bëhen alkoolistë ose pirësi nuk ndalet pa të">إذا أدمن الناسُ الخمرَ أو كان الشارب ممن لا يرتدع بدونها، ونحو ذلك.</span></span></p>

<p><span class="s" data-sq="Kur pirësit janë pak dhe çështja e pirësit është e afërt, mjaftojnë dyzet. Ky është mendimi më i drejtë — fjala e Shafiut dhe Ahmedit në njërën transmetim."><span class="w" data-sq="kur pirësit janë pak, mjaftojnë dyzet">فأما مع قلة الشاربين وقُرْب أمر الشارب فتكفي الأربعون،</span> <span class="w" data-sq="mendimi më i drejtë — Shafiu dhe Ahmedi në njërën transmetim">وهذا أوجه القولين، وهو قول الشافعي وأحمد في إحدى الروايتين.</span></span></p>`}
,{html:`<p><span class="s" data-sq="Umeri, radijallahu anhu, kur u shtua pirja, shtoi dëbimin dhe rruarjen e kokës si masë ndalimi. Sikur pirësi të ndëshkohej me dyzet edhe me prerjen e furnizimit ose shkarkimin nga posti — do ishte mirë. Sepse Umeri, radijallahu anhu, kur i arriti lajmi se njëri zëvendës kishte recituar vargje për alkoolin, e shkarkoi."><span class="w" data-sq="Umeri kur u shtua pirja, shtoi dëbimin dhe rruarjen e kokës">وقد كان عمر رضي الله عنه لمّا كثُر الشرب زاد فيه النفي وحلق الرأس،</span> <span class="w" data-sq="si masë ndalimi; sikur pirësi ndëshkohej me prerjen e furnizimit ose shkarkimin — do ishte mirë">مبالغةً في الزجر عنه، فلو عُزِّرَ الشارب مع الأربعين بقطع خُبْزِه أو عزله عن ولايته= كان حسنًا،</span> <span class="w" data-sq="Umeri kur dëgjoi se njëri zëvendës recitoi vargje për alkoolin, e shkarkoi">فإن عمر بن الخطاب رضي الله عنه بلغه عن بعض نوّابه أنه تمثَّل بأبياتٍ في الخمر فعزله.</span></span></p>

<p><span class="s" data-sq="Alkooli që e ndaloi Allahu dhe i Dërguari, dhe urdhëroi Pejgamberi kamxhikimin e pirësit: çdo pije dehëse nga çdo origjinë — qoftë nga frutat si rrushi, hurma, rrushi i thatë e fiku; ose drithërat si gruri e elbi; ose lëngjeshtat si mjalta; ose kafsha si qumështi i pelës. Madje kur Allahu i zbriti Pejgamberit ﷺ ndalimin e alkoolit, nuk kishin në Medinë alkool rrushi; sepse nuk kishte në Medinë"><span class="w" data-sq="alkooli që e ndaloi Allahu dhe i Dërguari: çdo pije dehëse nga çdo origjinë">والخمرُ التي حرمها الله تعالى ورسوله، وأمرَ النبي بجلد شاربها: كلُّ شراب مسكر من أي أصل كان،</span> <span class="w" data-sq="nga frutat si rrushi, hurma, rrushi i thatë, fiku; drithërat si gruri, elbi; mjalta; qumështi i pelës">سواء كان من الثمار؛ كالعنب والرطب والزبيب والتين، أو الحبوب؛ كالحِنطة والشعير، أو الطلول؛ كالعسل، أو الحيوان، كلبن الخيل.</span> <span class="w" data-sq="kur Allahu i zbriti Pejgamberit ndalimin, nuk kishin në Medinë alkool rrushi; sepse nuk kishte në Medinë">بل لما أنزل الله تعالى على نبيه ﷺ تحريم الخمر لم يكن عندهم بالمدينة من خمر العنب شيء؛ لأنه لم يكن بالمدينة</span></span></p>`}
,{html:`<p><span class="s" data-sq="pemë rrushi — rrushi sillej nga Shami. Shumica e pijes së tyre ishte nabidh hurme. Sunneti është mutevatir nga Pejgamberi ﷺ, halifët dhe sahabët se ai ndaloi çdo dehëse dhe sqaroi se ajo është hamr (alkool)."><span class="w" data-sq="pemë rrushi — sillej nga Shami; shumica e pijes së tyre ishte nabidh hurme">شجر عنب، وإنما كانت تُجْلَب من الشام، فكان عامة شرابهم من نبيذ التمر،</span> <span class="w" data-sq="Sunneti mutevatir: ndaloi çdo dehëse dhe sqaroi se ajo është hamr">وقد تواترت السنة عن النبي ﷺ وخلفائه وأصحابه أنه حرّم كل مسكر وبيَّن أنه خمر.</span></span></p>

<p><span class="s" data-sq="Pinin nabidhun e ëmbël — hurma ose rrush i thatë hidhej në ujë, që uji të ëmbëlsohet, sidomos shumë ujëra të Hixhazit që janë të kripura. Ky nabidh është hallall me konsensusin e muslimanëve, sepse nuk deh — siç lejohet lëngu i rrushit para se të bëhet dehës."><span class="w" data-sq="pinin nabidhun e ëmbël — hurma ose rrush i thatë hidhej në ujë që të ëmbëlsohet">وكانوا يشربون النبيذ الحُلو، وهو أن يُنْبَذ في الماء تمرٌ أو زبيب، أي يُطرح فيه ـ [والنبذ: الطرح] ـ ليَحْلوَ الماء، لاسيما كثير من مياه الحجاز،</span> <span class="w" data-sq="ky nabidh hallall me konsensus, nuk deh; si lëngu i rrushit para se të bëhet dehës">فإن فيه ملوحة، فهذا النبيذ حلال بإجماع المسلمين؛ لأنه لا يُسكِر، كما يحل شرب عصير العنب قبل أن يصير مسكرًا.</span></span></p>

<p><span class="s" data-sq="Pejgamberi ﷺ i kishte ndaluar të hedhin nabidhun në enë druri, qeramike, kungulli ose enë me katran; i urdhëroi të përdorin enë lëkure të lidhura. Sepse fermentimi futet ngadalë pa e ndjerë njeriu. Kur është në shakull lëkure, çahet ena kur nabidhi vlon — nuk bie në të ndaluarën. Enët e tjera nuk çahen."><span class="w" data-sq="Pejgamberi i ndaloi enët e drurit, qeramikës, kungullit, e katranit; urdhëroi enë lëkure">وكان النبي ﷺ قد نباهم أن ينبذوا هذا النبيذ في أوعية الخشب أو الجرِّ ـ وهو ما يُصنع من التراب ـ أو القرع أو الظروف المُزَفَّتة، وأمرهم أن ينبذوا في الظروف التي تُربط أفواهُها بالأوكية؛</span> <span class="w" data-sq="fermentimi futet ngadalë; kur është në lëkure, çahet ena kur vlon — nuk bie në haram">لأن الشدة تدب في النبيذ دبيبًا خفيًّا ولا يشعر الإنسان، فربما شرب الإنسان ما قد دبَّ فيه الشِّدة المُطربة وهو لا يشعر، فإذا كان في سقاء موكَّا انشق الظرفُ إذا غلا فيه النبيذ، فلا يقع الإنسان في محذور، وتلك الأوعية لا تنشق.</span></span></p>

<p><span class="s" data-sq="Transmetohet se pas kësaj lejoi hedhjen e nabidhit në enë, dhe tha: «Isha"><span class="w" data-sq="transmetohet se pas kësaj lejoi, dhe tha:">ورُوِي عنه أنه رخص بعد هذا في الانتباذ في الأوعية، وقال:</span></span> <span class="s hadith" data-sq="Isha ju ndaluar nga hedhja e nabidhit në enë — tani hidhni, por mos pini dehëse.">«كنت قد</span></p>`}
,{html:`<p><span class="s hadith" data-sq="...ju ndalova nga hedhja e nabidhit në enë — tani hidhni, por mos pini dehëse.">نهيتكم عن الانتباذ في الأوعية فانتبذوا ولا تشربوا مسكرًا».</span> <span class="s" data-sq="Sahabët dhe dijetarët pas tyre u ndanë: prej tyre nuk i arriti abrogimi — ndali hedhjen në enë. Prej tyre besoi vërtetësinë si abrogues — lejoi. Një grup fukahash dëgjuan se disa sahabë pinin nabidh, menduan se ishte dehëse, lejuan lloje pijesh jo nga rrushi e hurma, dhe lejuan nabidhun e zier nëse nuk dehet pirësi."><span class="w" data-sq="sahabët dhe dijetarët u ndanë: disa nuk i arriti abrogimi — ndali enët; disa besuan abrogimin — lejuan">فاختلف الصحابة ومَن بعدهم من العلماء: منهم من لم يبلغه النسخ أو لم يُثبِته، فنهى عن الانتباذ في الأوعية، ومنهم من اعتقد ثبوته وأنه ناسخ، فرخّص في الانتباذ في الأوعية،</span> <span class="w" data-sq="disa fukaha dëgjuan se sahabë pinin nabidh, menduan se ishte dehëse — lejuan lloje pijesh e nabidhun e zier nëse nuk dehet">فسمع طائفةٌ من الفقهاء أن بعض الصحابة كانوا يشربون النبيذ، فاعتقدوا أنه المسكر، فرخّصوا في شرب أنواع من الأشربة التي ليست من العنب والتمر، وترخّصوا في المطبوخ من نبيذ التمر والزبيب إذا لم يسكر الشارب.</span></span></p>

<p><span class="s" data-sq="E sakta: çdo dehëse është hamr, kamxhikohet pirësi, qoftë edhe një pikë — për ilaç apo jo. Pejgamberi ﷺ u pyet për alkoolin si ilaç, tha:"><span class="w" data-sq="e sakta: çdo dehëse është hamr, kamxhikohet pirësi, qoftë edhe një pikë">والصواب ما عليه جماهير المسلمين: أن كل مُسكِرٍ خمرٌ يُجلَد شاربه، ولو شرب منه قطرةً واحدة لتداوي أو غير تداوي،</span> <span class="w" data-sq="Pejgamberi ﷺ u pyet për alkoolin si ilaç, tha:">فإن النبي ﷺ سُئل عن الخمر أيُتَداوَى بها؟ فقال:</span></span> <span class="s hadith" data-sq="Ai është sëmundje e jo ilaç.">«إنها داء وليست بدواء»،</span> <span class="s hadith" data-sq="Allahu nuk e ka bërë shërimin e ummetit tim në atë që ua ka ndaluar.">و«إن الله لم يجعل شفاء أمتي فيما حرَّم عليها».</span></p>

<p><span class="s" data-sq="Dënimi është obligim kur ngrihet dëshmia ose pranon pirësi.">والحدُّ واجب إذا قامت البينة أو اعترف الشارب.</span></p>`}
,{html:`<p><span class="s" data-sq="Nëse i ndihet era e alkoolit, ose shihet duke e vjellur, e ngjashëm — thuhet: nuk zbatohet dënimi sepse mundësohet të ketë pirë diçka jo hamr, ose pa ditur, ose i detyruar. Thuhet: kamxhikohet nëse dihet se ajo është dehëse. Ky mendim i transmetuar nga halifët e drejtë dhe sahabët si Uthmani, Aliu e Ibn Mesudi. Mbi të tregon Sunneti — medh'hebi i Malikut e Ahmedit në shumicën e teksteve, e të tjerëve."><span class="w" data-sq="nëse i ndihet era, ose shihet duke e vjellur — thuhet: nuk zbatohet dënimi">فإن وُجِدت منه رائحة الخمر، أو رُئي وهو يتقيَّؤها ونحو ذلك؛ فقد قيل: لا يقام عليه الحد؛</span> <span class="w" data-sq="sepse mundësohet të ketë pirë jo hamr, ose pa ditur, ose i detyruar">لاحتمال أنه شرب ما ليس بخمرٍ، أو شربها جاهلًا بها أو مكرهًا ونحو ذلك.</span> <span class="w" data-sq="thuhet: kamxhikohet nëse dihet se ajo dehëse — ky nga halifët e drejtë">وقيل: بل يُجلد إذا عَرَف أن ذلك مسكر. وهذا المأثور عن الخلفاء الراشدين وغيرهم من الصحابة، كعثمان وعلي وابن مسعود رضي الله عنهم،</span> <span class="w" data-sq="mbi të tregon Sunneti — medh'hebi i Malikut e Ahmedit e të tjerëve">وعليه تدل سنة رسول الله ﷺ، وهو الذي يصلح عليه الناس، وهو مذهب مالك وأحمد في غالب نصيهما وغيرهما.</span></span></p>

<p><span class="s" data-sq="Hashishi nga gjethet e kërpit (cannabis) është haram. Përdoruesi kamxhikohet si pirësi i alkoolit. Ai është më i keq se alkooli nga ana se prish mendjen dhe temperamentin, derisa njeriu bie në feminizim, diathe e dëme të tjera."><span class="w" data-sq="hashishi nga gjethet e kërpit është haram, kamxhikohet si pirësi i alkoolit">والحشيشة المصنوعة من ورق القِنَّب حرام، يُجلَد صاحبُها كما يُجلَد شارب الخمر،</span> <span class="w" data-sq="më i keq se alkooli — prish mendjen e temperamentin, bie në feminizim e diathe">وهي أخبث من الخمر من جهة أنها تفسد العقل والمزاج، حتى يصير في الرجل تخنُّث وديائة وغير ذلك من المفاسد الأُخَر؛ من الدِّياثة، والتخنُّث، وفساد المزاج والعقل، وغير ذلك.</span></span></p>

<p><span class="s" data-sq="Disa fukaha të mëvonshëm u ndalën për dënimin e tij, dhe mendonin se ngrënësi ndëshkohet me">وقد توقف بعض الفقهاء المتأخرين في حدِّها، ورأى أنَّ آكلها يعزَّر بما</span></p>`}
,{html:`<p><span class="s" data-sq="nën dënim, duke menduar se ndryshon mendjen pa dehje, si benja. Nuk gjetën fjalë nga dijetarët e hershëm. Por nuk është kështu — ngrënësit dehin e dëshirojnë si alkoolin e më shumë. Pengohet nga përmendja e Allahut e namazi kur e shton, bashkë me dëme si dithia, feminizimi, prishja e mendjes."><span class="w" data-sq="nën dënim, si benja; nuk gjetën fjalë nga dijetarët e hershëm">دون الحد، حيث ظنها تغير العقل من غير طَرَب، بمنزلة البنج، ولم يجد للعلماء المتقدمين فيها كلامًا.</span> <span class="w" data-sq="por ngrënësit dehin e dëshirojnë si alkoolin; pengohet nga dhikri e namazi">وليس كذلك، بل آكلوها ينتشون عنها ويشتهونها كشراب الخمر وأكثر، وآكلها تصده عن ذكر الله تعالى وعن الصلاة إذا أكثر منها،</span> <span class="w" data-sq="dëme: dithia, feminizimi, prishja e temperamentit e mendjes">مع ما فيها من المفاسد الأُخَر؛ من الدِّياثة، والتخنُّث، وفساد المزاج والعقل، وغير ذلك.</span></span></p>

<p><span class="s" data-sq="Por meqë është e ngurtë e ushqim jo pije, fukahave iu ndanë mendimet për papastërtinë në tre mendime. Thuhet: e papastër si alkooli i pirë — ky mendim i saktë. Thuhet: jo, nga ngurtësia. Thuhet: dallohet mes ngurtës e lëngut. Sido qoftë, hyn në atë që ndaloi Allahu e i Dërguari nga hamri e dehësja, me fjalë ose kuptim."><span class="w" data-sq="meqë është ushqim jo pije, ka tre mendime për papastërtinë">لكن لما كانت جامدة مطعومة ليست شرابًا، تنازع الفقهاء في نجاستها على ثلاثة أقوال في مذهب أحمد وغيره؛</span> <span class="w" data-sq="e papastër si alkooli (mendim i saktë); jo nga ngurtësia; dallohet">فقيل: هي نجسة كالخمرة المشروبة، وهذا هو الاعتبار الصحيح، وقيل: لا، لجمودها، وقيل: يُفَرَّق بين جامدها ومائعها.</span> <span class="w" data-sq="sido qoftë, hyn në ndalimin e hamrit e dehësjes, me fjalë ose kuptim">وبكل حال فهي داخلة فيما حرَّم الله ورسولُه من الخمر والمسكر لفظًا أو معنىً.</span></span></p>

<p><span class="s" data-sq="Ebu Musa El-Esh'ariu, radijallahu anhu, tha: O i Dërguar, na jep fetva për dy pije që i prodhojmë në Jemen: bit'in — mjalti i fermentuar — dhe mizrin — misri e elbi i fermentuar."><span class="w" data-sq="Ebu Musa tha: na jep fetva për dy pije nga Jemeni">قال أبو موسى الأشعري رضي الله عنه: يا رسول الله، أفتنا في شرابين كنا نصنعهما باليمن:</span> <span class="w" data-sq="bit'in — mjalti i fermentuar — dhe mizrin — misri e elbi i fermentuar">البِتْع ـ وهو من العسل يُنبَذ حتى يشتد ـ والمِزْر ـ وهو من الذرة والشعير يُنبَذ حتى يشتد ـ</span></span> <span class="s" data-sq="I Dërguari ﷺ i ishte dhënë fjala gjithëpërfshirëse, dhe tha:">قال: وكان رسول الله ﷺ قد أُعطِي جوامع الكَلِم بخواتيمه فقال:</span> <span class="s hadith" data-sq="Çdo dehëse është haram.">«كلُّ مُسْكِرٍ حرام».</span> <span class="s" data-sq="Muttefekun alejhi në dy Sahihët.">متفق عليه في «الصحيحين».</span></p>

<p><span class="s" data-sq="Nga Nu'man ibn Beshiri, tha: I Dërguari ﷺ tha:">وعن النعمان بن بشير قال: قال رسول الله ﷺ:</span> <span class="s hadith" data-sq="Nga gruri bëhet hamr,">«إنَّ مِنَ الحِنْطَةِ خمرًا،</span></p>`}
,{html:`<p><span class="s hadith" data-sq="...nga elbi hamr, nga rrushi i thatë hamr, nga hurma hamr, nga mjalti hamr. Unë ndaloj çdo dehëse.">ومن الشعير خمرًا، ومن الزبيب خمرًا، ومن التمر خمرًا، ومن العسل خمرًا، وأنا أنهىٰ عن كل مسكر»</span> <span class="s" data-sq="Transmetoi Ebu Davudi e të tjerë.">رواه أبو داود وغيره.</span></p>

<p><span class="s" data-sq="Por ky hadith në dy Sahihët transmetohet nga Umeri si fjalë e tij (meukuf): ai foli në minberin e Pejgamberit ﷺ dhe tha:"><span class="w" data-sq="ky hadith në dy Sahihët nga Umeri si meukuf">ولكن هذا في «الصحيحين» عن عمر موقوفًا عليه:</span> <span class="w" data-sq="foli në minberin e Pejgamberit ﷺ dhe tha:">أنه خطب به على منبر رسول الله ﷺ فقال:</span></span> <span class="s hadith" data-sq="Hamri është çdo gjë që mbulon mendjen.">«الخمر ما خامر العقل».</span></p>

<p><span class="s" data-sq="Nga Ibn Umeri, radijallahu anhuma, Pejgamberi ﷺ tha:">وعن ابن عمر رَضِيَاللَّهُعَنْهُمَا أن النبي ﷺ قال:</span> <span class="s hadith" data-sq="Çdo dehëse është hamr dhe çdo dehëse është haram.">«كلُّ مسكر خمر وكلُّ مسكر حرام».</span> <span class="s" data-sq="Në një transmetim: «Çdo dehëse hamr dhe çdo hamr haram.» Transmetoi Muslimi në Sahihun e tij.">وفي رواية: «كل مسكر خمر وكل خمر حرام» رواهما مسلم في «صحيحه».</span></p>

<p><span class="s" data-sq="Nga Aishja, radijallahu anha, tha: I Dërguari ﷺ tha:">وعن عائشة رَضِيَاللَّهُعَنْهَا قالت: قال رسول الله ﷺ:</span> <span class="s hadith" data-sq="Çdo dehëse është haram. Çfarë deh sasi e madhe, edhe një grusht i saj është haram.">«كل مسكر حرام، وما أسكر الفرق منه فملءُ الكفِّ منه حرام».</span> <span class="s" data-sq="Tirmidhiu tha: hadith hasen.">قال الترمذي: حديث حسن.</span></p>`}
,{html:`<p><span class="s" data-sq="Transmetohet nga dijetarët e Sunenit, nga Pejgamberi ﷺ, nga disa anë, se ai tha: «Çfarë deh sasi e madhe, pak e saj është haram.» Huffadhi e vërtetuan."><span class="w" data-sq="transmetohet nga dijetarët e Sunenit, se tha:">ورويَ أهل السنن عن النبي ﷺ من وجوه أنه قال:</span></span> <span class="s hadith" data-sq="Çfarë deh sasi e madhe, pak e saj është haram.">«ما أسكرَ كثيرُه فقليله حرام».</span> <span class="s" data-sq="Huffadhi e vërtetuan.">وصححه الحُفَّاظ.</span></p>

<p><span class="s" data-sq="Nga Xhabiri, radijallahu anhu, një njeri pyeti Pejgamberin ﷺ për pijen nga misri — mizrin. A është dehëse? Tha: po. Tha:"><span class="w" data-sq="Xhabiri: një njeri pyeti Pejgamberin për mizrin — a deh? po">وعن جابر رَضِيَاللَّهُعَنْهُ أن رجلًا سأل النبي ﷺ عن شراب يشربونه بأرضهم من الذرة يقال له: المِزْر؟ فقال: «أمسكر هو؟» قال: نعم،</span></span> <span class="s hadith" data-sq="Çdo dehëse është haram. Allahu ka premtim ndaj atij që pi dehëse: ta japë tinet-ul-khabal."><span class="w" data-sq="çdo dehëse haram; Allahu ka premtim ndaj pirësit">فقال: «كلُّ مُسكرٍ حرام، إنَّ على الله عهدًا لمن يشرب المسكر أن يسقيه من</span> <span class="w" data-sq="tinet-ul-khabal">طينة الخَبَال»،</span></span> <span class="s" data-sq="Thanë: O i Dërguar, ç'është tinet-ul-khabal? Tha: Djersët e banorëve të Zjarrit, ose lëngu i tyre. Transmetoi Muslimi në Sahihun e tij."><span class="w" data-sq="thanë: ç'është? Tha: djersët ose lëngu i banorëve të Zjarrit">قالوا: يا رسول الله، وما طينة الخبال؟ قال: «عَرَق أهل النار، أو عُصارة أهل النار»</span> <span class="w" data-sq="transmetoi Muslimi në Sahihun e tij">رواه مسلم في «صحيحه».</span></span></p>

<p><span class="s" data-sq="Nga Ibn Abbasi, radijallahu anhuma, Pejgamberi ﷺ tha:">وعن ابن عباس رَضِيَاللَّهُعَنْهُ عن النبي ﷺ قال:</span> <span class="s hadith" data-sq="Çdo pije e fermentuar është hamr dhe çdo dehëse është haram.">«كلُّ مُخَمَّر خمر وكل</span></p>`}
,{html:`<p><span class="s hadith" data-sq="...dehëse është haram.">مسكر حرام»</span> <span class="s" data-sq="Transmetoi Ebu Davudi.">رواه أبو داود.</span></p>

<p><span class="s" data-sq="Hadithet në këtë kapitull janë të shumta e gjithëpërfshirëse. I Dërguari ﷺ — me fjalët gjithëpërfshirëse — ndaloi çdo gjë që mbulon mendjen dhe deh, pa dallim lloji a forme, pa ndikim nëse është ushqim apo pije, duke ditur se hamri mund të përgatitet."><span class="w" data-sq="hadithet janë të shumta; Pejgamberi me fjalë gjithëpërfshirëse">والأحاديث في هذا الباب كثيرة ومستفيضة، جمع رسول الله ﷺ ـ بما أوتيه من جوامع الكلم ـ</span> <span class="w" data-sq="çdo gjë që mbulon mendjen e deh, pa dallim lloji a forme">كلَّ ما غطى العقل وأسكر، ولم يفرق بين نوع ونوع، ولا تأثير لكونه مأكولًا أو مشروبًا،</span> <span class="w" data-sq="hamri mund të përgatitet si ushqim">على أن الخمر قد يُصْطَبَغ بها،</span> <span class="w" data-sq="hashishi tretet në ujë e pihet; hamri pihet e hahet — e gjitha haram">وهذه الحشيشة قد تُذاب في الماء وتُشرب، فالخمر يُشرب ويُؤكل، والحشيشة تؤكل وتشرب، وكل ذلك حرام.</span></span></p>

<p><span class="s" data-sq="Dijetarët e hershëm nuk folën për hashishin sepse u shfaq vonë — nga fundi i shekullit të gjashtë ose shtatë. Ashtu si pije dehëse u shpikën pas Pejgamberit ﷺ — të gjitha hyjnë në fjalët gjithëpërfshirëse të Kuranit e Sunnetit."><span class="w" data-sq="dijetarët e hershëm nuk folën për hashishin — u shfaq vonë, shek. 6 ose 7">وإنما لم يتكلم المتقدِّمون في خصوصها؛ لأنه إنما حدث أكلُها من قريب في أواخر المئة السادسة أو قريبًا من ذلك،</span> <span class="w" data-sq="si pije dehëse pas Pejgamberit — hyjnë në fjalët gjithëpërfshirëse">كما أنه قد أُحدِثت أشربة مُسكرة بعد النبي ﷺ، وكلها داخلة في الكلم الجوامع من الكتاب والسنة.</span></span></p>

<h2><span class="s" data-sq="Kapitull">فصل</span></h2>

<p><span class="s" data-sq="Nga dënimet për të cilat erdhi Kurani, Sunneti dhe konsensusi: dënimi i shpifjes (kazf) — kur shpif ndaj muhsanit/muhsanës për zina ose liwat, i detyrohet tetëdhjetë kamxhik."><span class="w" data-sq="nga dënimet e Kuranit, Sunnetit e konsensusit: kazfi">من الحدود التي جاء بها الكتاب والسنة وأجمع عليها المسلمون: حد القذف،</span> <span class="w" data-sq="kur shpif ndaj muhsanit — tetëdhjetë kamxhik">فإذا قذف الرجل محصنًا بالزنا أو اللواط، وجبَ عليه الحدُّ ثمانون جلدة.</span></span></p>

<p><span class="s" data-sq="Muhsani këtu: i liri i ndershëm. Në kapitullin e zinasë: ai që kreu marrëdhënie të plota në kurorë të vlefshme."><span class="w" data-sq="muhsani këtu: i liri i ndershëm">والمحصن هنا هو: الحرّ العفيف،</span> <span class="w" data-sq="në kapitullin e zinasë: ai që kreu marrëdhënie të plota në kurorë">وفي باب حدّ الزنا: الذي وطئ وطءًا كاملًا في نكاح تامّ.</span></span></p>`}
,{html:`<h2><span class="s" data-sq="Kapitull">فصل</span></h2>

<p><span class="s" data-sq="Sa u përket mëkateve pa dënim të caktuar e pa kefaret — si ai që puth fëmijën ose gruan e huaj, bashkëjeton pa marrëdhënie, ha haram si gjakun e mishin e ngordhur, shpif pa zina, vjedh nën nisab ose pa hirz, ose"><span class="w" data-sq="mëkatet pa dënim të caktuar e pa kefaret">وأما المعاصي التي ليس فيها حدٌّ مقدَّر ولا كفارة،</span> <span class="w" data-sq="si ai që puth fëmijën ose gruan e huaj, bashkëjeton pa marrëdhënie, ha haram">كالذي يُقَبِّل الصبيَّ والمرأة الأجنبية، أو يباشر بلا جماع، أو يأكل ما لا يحل كالدم والميتة،</span> <span class="w" data-sq="shpif pa zina, vjedh nën nisab ose pa hirz">أو يقذف الناس بغير الزنا، أو يسرق من غير حرز، أو شيئًا يسيرًا،</span></span></p>

<p><span class="s" data-sq="ose tradhton amanetet — kujdestarët e pasurisë së shtetit, vakëfeve, jetimëve e ngjashëm; ortakët nëse tradhtojnë; mashtruesit në ushqime e rroba; pakësuesit e peshës e masës;"><span class="w" data-sq="tradhton amanetet — kujdestarë pasurie shteti, vakëfi, jetimi">أو يخون أمانته، كولاة أموال بيت المال، والوقوف، ومال اليتيم، ونحو ذلك إذا خانوا فيها.</span> <span class="w" data-sq="ortakët nëse tradhtojnë; mashtruesit në ushqime, rroba; pakësuesit e peshës">وكالوكلاء والشركاء إذا خانوا، أو يغش في معاملته كالذين يغشون في الأطعمة والثياب ونحو ذلك، أو يطفِّف الكيل</span></span></p>

<p><span class="s" data-sq="ose peshën; dëshmon rrejshëm ose jep dëshmi të rrejshme; gjykon me diçka tjetër nga ajo që zbriti Allahu; sulmon mbi njerëzit e tij; krenohet me krenari xhahilije; përmbush thirrësin e xhahilisë; e ngjashëm — "><span class="w" data-sq="peshën; dëshmon rrejshëm; gjykon me tjetër nga ajo që zbriti Allahu">والميزان، أو يشهد بالزور، أو يلقن شهادة الزور، أو يحكم بغير ما أنزل الله سبحانه وتعالى،</span> <span class="w" data-sq="sulmon mbi njerëzit; krenari xhahilije; thirrësin e xhahilisë">أو يعتدي على رعيته، أو يتعزَّى بعزاء الجاهلية، كقوله: يالقيس ياليمن، أو يلبي داعي الجاهلية، إلى غير ذلك</span></span></p>

<p><span class="s" data-sq="këta ndëshkohen me ta'zir — qortim e kamxhik — sipas masës që e sheh udhëheqësi. Nëse mëkati është i shpeshtë e i rëndë, shtohet ndëshkimi; ndryshe nga kur është i rrallë."><span class="w" data-sq="ndëshkohen me ta'zir — qortim e kamxhik — sipas masës">من أنواع المحرمات= فهؤلاء يعاقَبون تعزيرًا وتنكيلًا وتأديبًا بقدر ما يراه</span> <span class="w" data-sq="udhëheqësi sipas shpeshtësisë — nëse i shpeshtë shtohet">الوالي على حسب كثرة ذلك الذنب في الناس وقِلَّتِه، فإذا كان كثيرًا زاد في العقوبة، بخلاف ما إذا كان قليلًا.</span></span></p>`}
,{html:`<p><span class="s" data-sq="Sipas gjendjes së mëkatërit — nëse është prej atyre që vazhdimisht bëjnë mëkate, shtohet ndëshkimi, ndryshe nga ai që bën pak."><span class="w" data-sq="sipas gjendjes së mëkatërit">وعلى حسب حال المذنب،</span> <span class="w" data-sq="nëse vazhdon — shtohet; ndryshe nga ai që bën pak">فإذا كان من المدمنين على الفجور زِيدَ في عُقوبته بخلاف المُقِلّ من ذلك.</span></span></p>

<p><span class="s" data-sq="Sipas madhësisë e vogëlsisë së mëkatit — ndëshkohet ai që ngacmon gratë e fëmijët e njerëzve më shumë se ai që ngacmoi vetëm një grua ose fëmijë."><span class="w" data-sq="sipas madhësisë e vogëlsisë së mëkatit">وعلى حسب كبر الذنب وصغره،</span> <span class="w" data-sq="ndëshkohet ngacmuesi i shumë grave e fëmijëve më shumë se ai i njërit">فيُعاقَب من يتعرض لنساء الناس وأولادهم ما لا يُعاقَب من لم يتعرَّض إلا لامرأة واحدة أو صبي واحد.</span></span></p>

<p><span class="s" data-sq="Ta'ziri nuk ka kufi minimal — përfshin çdo gjë që i shkakton dhimbje njeriut, me fjalë e vepër, lënie fjale e vepre. Mund të ndëshkohet me këshillim, qortim e ashpërsi. Me bojkot e lënie selami derisa pendohet nëse ajo është e dobishme — siç bojkotoi Pejgamberi ﷺ e sahabët tre personat që mbetën prapa. Me largim nga posti. Me heqje nga ushtria — si ushtari ikës, sepse ikja është prej mëkateve të mëdha; heqja e furnizimit lloj ta'ziri. Emiri — nëse bën diçka të rëndë, largimi ta'zir."><span class="w" data-sq="ta'ziri nuk ka kufi minimal — çdo gjë dhimbëse, fjalë e vepër">وليس لأقلّ التعزير حدٌّ، بل هو بكل ما فيه إيلام للإنسان من قول وفعل، وتَرْك قولٍ وتَركِ فعل،</span> <span class="w" data-sq="me këshillim, qortim e ashpërsi">فقد يُعَزَّر الرجلُ بوعظه وتوبيخه والإغلاظ له،</span> <span class="w" data-sq="me bojkot — siç bojkotoi Pejgamberi ﷺ tre personat që mbetën">وقد يُعَزَّر بهجره وترك السلام عليه حتى يتوب إن كان ذلك هو المصلحة، كما هجر النبي ﷺ وأصحابُه الثلاثةَ الذين خُلِّفوا،</span> <span class="w" data-sq="me largim nga posti; heqje nga ushtria — ikja mëkat i madh">وقد يُعزر بعزله عن ولايته، كما كان النبي ﷺ وأصحابُه يُعَزِّرون بذلك، وقد يُعَزَّر بترك استخدامه في جند المسلمين كالجندي المقاتل إذا فرَّ عن الزحف، فإن الفرار من الزحف من الكبائر، وقَطْعُ خبزِه نوعُ تعزيرٍ له،</span> <span class="w" data-sq="emiri nëse bën diçka të rëndë — largimi ta'zir">وكذلك الأمير إذا فعل ما يُستعظَم فعزلُه عن الإمارة تعزيرٌ له.</span></span></p>

<p><span class="s" data-sq="Mund të ndëshkohet me burg, me rrahje, me nxirje të fytyrës e hipje mbrapsht mbi kafshë — siç transmetohet nga Umer ibn el-Hattabi, radijallahu anhu, se urdhëroi"><span class="w" data-sq="me burg, me rrahje">وقد يُعَزَّر بالحبس، وقد يُعزر بالضرب،</span> <span class="w" data-sq="me nxirje fytyre e hipje mbrapsht — siç urdhëroi Umeri">وقد يُعزر بتسويد وجهه وإركابه على دابةٍ مقلوبًا، كما قد رُوي عن عمر بن الخطاب رَضِيَاللَّهُعَنْهُ أنه أمر</span></span></p>`}
,{html:`<p><span class="s" data-sq="atë në dëshmitarin e rrejshëm — sepse gënjeshtari ka fytyrë të zezë, kështu i nxihet; e përmbys fjalën, kështu i përmbyset hipja."><span class="w" data-sq="në dëshmitarin e rrejshëm — gënjeshtari ka fytyrë të zezë">بذلك في شاهد الزور؛ فإن الكاذب أسودُ الوجه فيسَوَّد وجهُه،</span> <span class="w" data-sq="e përmbys fjalën — i përmbyset hipja">وقَلَبَ الحديث فقُلِبَ ركوبُه.</span></span></p>

<p><span class="s" data-sq="Sa i përket kufirit të sipërm — thuhet: nuk shtohet mbi dhjetë kamxhik. Shumë dijetarë thanë: nuk arrin në dënimet (hudud)."><span class="w" data-sq="thuhet: nuk shtohet mbi dhjetë kamxhik">وأما أعلاه؛ فقد قيل: لا يُزاد على عشرة أسواط،</span> <span class="w" data-sq="shumë dijetarë: nuk arrin në hudud">وقال كثير من العلماء: لا يبلغ به الحدود.</span></span></p>

<p><span class="s" data-sq="Pastaj ndahen në dy mendime: prej tyre thotë — nuk arrin në dënimin më të ulët; me të lirin nuk arrin dënimin më të ulët të të lirit — dyzet ose tetëdhjetë — e me robin nuk arrin dënimin më të ulët të robit — njëzet ose dyzet."><span class="w" data-sq="dy mendime: nuk arrin në dënimin më të ulët">ثم هم على قولين؛ منهم من يقول: لا يبلغ به أدنى الحدود؛</span> <span class="w" data-sq="me të lirin: dyzet ose tetëdhjetë; me robin: njëzet ose dyzet">لا يبلغ بالحُرِّ أدنى حدود الحر، وهي الأربعون أو الثمانون، ولا يبلغ بالعبد أدنى حدود العبد، وهي العشرون أو الأربعون.</span></span></p>

<p><span class="s" data-sq="Thuhet: nuk arrin me asnjërin në dënimin e robit.">وقيل: بل لا يبلغ بكلٍّ منهما حدَّ العبد.</span></p>

<p><span class="s" data-sq="Prej tyre thotë: nuk arrin me çdo mëkat në dënimin e llojit të tij, edhe nëse kalon dënimin e llojit tjetër — nuk arrin me marrësin e pasurisë pa hirz në prerjen e dorës edhe nëse rrihet më shumë se dënimi i shpifësit; nuk veprohet me atë nën zina dënimi i zinaqarit edhe nëse kalon dënimin e shpifësit."><span class="w" data-sq="nuk arrin me çdo mëkat dënimin e llojit, edhe nëse kalon llojin tjetër">ومنهم من يقول: لا يبلغ بكلِّ ذنبٍ حدَّ جنسه وإن زاد على حدٍّ جنسٍ آخر،</span> <span class="w" data-sq="nuk arrin me vjedhësin pa hirz prerjen e dorës; nuk zbatohet zina mbi atë nën zina">فلا يبلغ بآخِذ المال من غير حرز قطع اليد، وإن ضُرِب أكثر من حدٍّ القاذف، ولا نفعل بمن فعل ما دون الزنا حدَّ الزاني وإن زاد على حد القاذف.</span></span></p>

<p><span class="s" data-sq="Siç transmetohet nga Umeri, radijallahu anhu: një njeri gdhendte vulën e tij dhe mori me të nga pasuria e shtetit — urdhëroi ta rrahin njëqind, pastaj ditën e dytë njëqind,"><span class="w" data-sq="Umeri: një njeri gdhendte vulën, mori nga pasuria e shtetit">كما روي عن عمر بن الخطاب رَضِيَاللَّهُعَنْهُ: أن رجلًا نقش على خاتمه، وأخذ بذلك من بيت المال،</span> <span class="w" data-sq="urdhëroi ta rrahin njëqind, pastaj ditën e dytë njëqind">فأمر به فضُرِب مئة، ثم ضربه في اليوم الثاني مئة،</span></span></p>`}
,{html:`<p><span class="s" data-sq="pastaj ditën e tretë njëqind.">ثم ضربه في اليوم الثالث مئة.</span></p>

<p><span class="s" data-sq="Transmetohet nga halifët e drejtë: për një burrë e grua të gjetur nën një jorgan — rrihen njëqind.">وروي عن الخلفاء الراشدين في رجل وامرأة وُجِدا في لحاف: يُضربان مئة.</span></p>

<p><span class="s" data-sq="Transmetohet nga Pejgamberi ﷺ për atë që kryen marrëdhënie me robëreshën e gruas së tij:">ورُوي عن النبي ﷺ في الذي يأتي جارية امرأته:</span> <span class="s hadith" data-sq="Nëse ia ka lejuar: njëqind kamxhik. Nëse nuk ia ka lejuar: gurëzohet (rexhm).">«إن كانت أحلتها له: جلد مئة، وإن لم تكن أحلتها له: رُجِم».</span></p>

<p><span class="s" data-sq="Ky mendim është më i qarti. Këto mendime gjenden në medh'hebin e Ahmedit e të tjerëve."><span class="w" data-sq="ky mendim më i qarti">وهذا القول أظهر الأقوال،</span> <span class="w" data-sq="në medh'hebin e Ahmedit e të tjerëve">وهذه الأقوال في مذهب أحمد وغيره،</span></span></p>`}
,{html:`<p><span class="s" data-sq="Dy mendimet e tjera në medh'hebin e Shafiut, radijallahu anhu, e të tjerëve. Sa i përket Malikut — transmetohet: disa krime arrijnë dënimin me vdekje. Disa ndjekës të Ahmedit e miratuan."><span class="w" data-sq="dy mendimet e tjera në medh'hebin e Shafiut e të tjerëve">والقولان الآخران في مذهب الشافعي رَضِيَاللَّهُعَنْهُ وغيره.</span> <span class="w" data-sq="Maliku: disa krime arrijnë vdekjen; disa ndjekës të Ahmedit miratuan">وأما مالك وغيره فحُكِي عنه: أن من الجرائم ما يبلغ به القتل، ووافقه بعض أصحاب أحمد في</span></span></p>

<p><span class="s" data-sq="vrasjen. Si spiuni musliman kur spiunon për armikun kundër muslimanëve — Ahmedi u ndal. Maliku dhe disa hanbelij si Ibn Akili e lejuan. Ebu Hanifeja, Shafiu dhe disa hanbelij si Kadiu Ebu Ja'la e ndaluan."><span class="w" data-sq="si spiuni musliman — Ahmedi u ndal për vrasjen">قتله، وحُكي عنه: أن من الجرائم ما يبلغ به القتل، وقد توقف مثل الجاسوس المسلم إذا جسَّ للعدو على المسلمين، فإن أحمد توقف في قتله،</span> <span class="w" data-sq="Maliku e Ibn Akili lejuan; Ebu Hanife, Shafiu e Ebu Ja'la e ndaluan">وجوَّز مالكٌ وبعضُ الحنبلية كابن عقيل قتلَه، ومَنَعَه أبو حنيفة والشافعي وبعضُ الحنبلية كالقاضي أبي يعلى.</span></span></p>

<p><span class="s" data-sq="Një grup nga ndjekësit e Shafiut, Ahmedit e të tjerëve lejuan vrasjen e thirrësit në bidate kundër Kuranit e Sunnetit. Gjithashtu shumë malikij thanë: Maliku e lejoi vrasjen e kaderive për çrregullim në tokë, jo për ridde."><span class="w" data-sq="disa shafi'ij e hanbelij lejuan vrasjen e thirrësit në bidate">وجوَّز طائفةٌ من أصحاب الشافعي وأحمد وغيرهما قتلَ الداعية إلى البدع المخالفة للكتاب والسنة،</span> <span class="w" data-sq="shumë malikij: vrasja e kaderive për çrregullim, jo ridde">وكذلك كثير من المالكية، قالوا: إنما جوَّز مالك وغيره قتل القدرية لأجل الفساد في الأرض لا لأجل الردة.</span></span></p>

<p><span class="s" data-sq="Gjithashtu për vrasjen e magjistarit — shumica e dijetarëve mendojnë se vritet. Tirmidhiu transmetoi nga Xhundebi, meukuf e merfuan:"><span class="w" data-sq="për vrasjen e magjistarit — shumica mendojnë se vritet">وكذلك قد قيل في قتل الساحر، فإنَّ أكثر العلماء على أنه يُقتل،</span> <span class="w" data-sq="Tirmidhiu transmetoi nga Xhundebi, meukuf e merfuan:">وقد روى الترمذي عن جندب موقوفًا ومرفوعًا أن:</span></span> <span class="s hadith" data-sq="Dënimi i magjistarit është goditje me shpatë.">«حدُّ الساحر ضربة بالسيف».</span></p>`}
,{html:`<p><span class="s" data-sq="Nga Umeri, Uthmani, Hafsaja, Abdullah ibn Umeri e sahabë të tjerë, radijallahu anhum — vrasja e tij. Disa thanë: për kufr. Disa: për çrregullim në tokë. Por shumica e tyre e shohin vrasjen si hadd (dënim)."><span class="w" data-sq="Umeri, Uthmani, Hafsaja, Ibn Umeri e të tjerë — vrasja e tij">وعن عمر وعثمان وحفصة وعبد الله بن عمر وغيرهم من الصحابة رَضِيَاللَّهُعَنْهُمْ قتله،</span> <span class="w" data-sq="disa: për kufr; disa: për çrregullim; shumica: si hadd">قال بعضهم: لأجل الكفر، وقال بعضهم: لأجل الفساد في الأرض، لكنَّ جمهور هؤلاء يرون قتله حدًّا.</span></span></p>

<p><span class="s" data-sq="Gjithashtu Ebu Hanifja ndëshkon me vdekje kur krimet përsëriten — nëse lloji i tyre e kërkon vrasjen, si ai që përsërit liwatin, ose vret njerëz për pasuri, e ngjashëm."><span class="w" data-sq="Ebu Hanifja ndëshkon me vdekje kur krimet përsëriten">وكذلك أبو حنيفة يُعَزِّر بالقتل فيما تكرر من الجرائم، إذا كان جنسه يوجب القتل،</span> <span class="w" data-sq="si ai që përsërit liwatin, ose vret për pasuri">كما يُقْتَل من تكرر منه التلوُّط، أو اغتيال النفوس لأخذ المال، ونحو ذلك.</span></span></p>

<p><span class="s" data-sq="Argumentohet: çrregulluesi kur nuk ndalet e keqja veçse me vrasje — vritet. Transmetoi Muslimi nga Arfaxhe El-Eshxhe'i: Dëgjova Pejgamberin ﷺ duke thënë:"><span class="w" data-sq="çrregulluesi kur nuk ndalet veçse me vrasje — vritet">وقد يُستدل على أن المفسد متى لم ينقطع شره إلا بقتله فإنه يُقتل بما</span> <span class="w" data-sq="transmetoi Muslimi nga Arfaxhe El-Eshxhe'i">رواه مسلم في «صحيحه» عن عرفجة الأشجعي قال: سمعت رسول الله ﷺ يقول:</span></span> <span class="s hadith" data-sq="Kush ju vjen ndërsa çështja juaj mbi një njeri, duke dashur t'ju përçajë — vriteni.">«من أتاكم وأمرُكم على رجلٍ واحدٍ يريد أن يشُقَّ عصاكم ويُفَرِّق جماعتكم فاقتلوه».</span> <span class="s" data-sq="Në transmetim tjetër:">وفي رواية:</span> <span class="s hadith" data-sq="Do të ndodhin trazira — kush dëshiron të përçajë çështjen e ummetit kur është i bashkuar, goditeni me shpatë, kushdo qoftë.">«ستكون هنات وهنات، فمن أراد أن</span></p>`}
,{html:`<p><span class="s hadith" data-sq="...përçajë çështjen e ummetit kur është i bashkuar, goditeni me shpatë, kushdo qoftë.">يفرِّق أمر هذه الأمة وهي جميع فاضربوه بالسيف كائنًا مَن كان».</span></p>

<p><span class="s" data-sq="Gjithashtu thuhet për urdhërin e vrasjes së pirësit të alkoolit herën e katërt; me argumentin nga Ahmedi në Musned, nga Dejlem El-Himjeri: Pyeta Pejgamberin ﷺ: O i Dërguar, ne jemi në tokë ku punojmë rëndë, prodhojmë pije nga gruri për punë e ftohtësi. Tha: «A deh?» Thashë: po. Tha: «Shmanguni.» Thashë: njerëzit nuk e lënë. Tha:"><span class="w" data-sq="thuhet për vrasjen e pirësit herën e katërt">وكذلك قد يقال في أمره بقتل شارب الخمر في الرابعة؛ بدليل ما رواه</span> <span class="w" data-sq="Ahmedi nga Dejlemi: pyeta Pejgamberin — prodhojmë pije nga gruri">أحمد في «المسند» عن ديلم الحِمْيَري قال: سألت رسول الله ﷺ فقلت: يا رسول الله، إنا بأرضٍ نعالج بها عملًا شديدًا، وإنا نتخذ شرابًا من القمح نتقوَّى به على أعمالنا وعلى بَرْد بلادنا، فقال:</span></span> <span class="s hadith" data-sq="A deh?">«هل يُسْكِر؟»</span> <span class="s" data-sq="Thashë: po. Tha:">قلت: نعم، قال:</span> <span class="s hadith" data-sq="Shmanguni.">«فاجتنبوه»،</span> <span class="s" data-sq="Thashë: njerëzit nuk e lënë. Tha:">قلت: إن الناس غير تاركيه، قال:</span> <span class="s hadith" data-sq="Nëse nuk e lënë, vritini.">«فإن لم يتركوه فاقتلوهم».</span></p>

<p><span class="s" data-sq="Kjo sepse çrregulluesi është si sulmuesi — nëse nuk ndalet veçse me vrasje, vritet.">وهذا لأن المُفسد كالصائل، فإذا لم يندفع الصائل إلا بالقتل قُتِل.</span></p>

<p><span class="s" data-sq="Përmbledhja: ndëshkimi është dy lloje:">وجِماع ذلك أن العقوبة نوعان:</span></p>

<p><span class="s" data-sq="I pari: për mëkat të kaluar, si ndëshkim nga Allahu — kamxhikimi i pirësit e shpifësit, prerja e luftuesit e vjedhësit, ta'ziri i vjedhësit nën nisab pa hirz, tradhtarit, falsifikuesit e ngjashëm."><span class="w" data-sq="i pari: për mëkat të kaluar, si ndëshkim nga Allahu">أحدهما: على ذنب ماضٍ جزاء بما كسب نكالًا من الله؛</span> <span class="w" data-sq="kamxhikimi i pirësit, shpifësit, prerja e vjedhësit, ta'zir i tradhtarit">كجلد الشارب والقاذف، وقطع المحارب والسارق، وكذلك تعزير من سرق دون النصاب من غير حرز، وتعزير الخائن ومُزَوِّر الشهادة والعلامة ونحو ذلك.</span></span></p>

<p><span class="s" data-sq="I dyti: ndëshkim për kryerjen e obligimit ose lënien e haramit në të ardhmen — si pendimi i murtedit derisa pranon Islamin, përndryshe vritet; ndëshkimi i lënësit të namazit, zekatit e të drejtave njerëzore derisa i kryen. Ta'ziri në këtë lloj është më i fortë se"><span class="w" data-sq="i dyti: për kryerje obligimi ose lënie harami në të ardhmen">والثاني: العقوبة لتأدية حق واجب أو ترك محرم في المستقبل،</span> <span class="w" data-sq="pendimi i murtedit — nëse nuk pranon vritet; ndëshkimi i lënësit të namazit e zekatit">كما يُستتاب المرتد حتى يسلم، فإن تاب وإلا قُتِل، وكما يُعاقَب تارك الصلاة والزكاة وحقوق الآدميين حتى يؤديها،</span> <span class="w" data-sq="ta'ziri këtu më i fortë se">فالتعزير في هذا الضرب أمْثَل منه</span></span></p>`}
,{html:`<p><span class="s" data-sq="në llojin e parë; prandaj lejohet të rrihet herë pas here derisa e fal namazin obligativ.">في الضرب الأول؛ ولهذا يجوز أن يُضرَب هذا مرةً بعد مرة حتى يؤدي الصلاة الواجبة عليه.</span></p>

<p><span class="s" data-sq="Hadithi në dy Sahihët nga Pejgamberi ﷺ: «Nuk kamxhikohet mbi dhjetë kamxhik veçse në hadd nga hududet e Allahut.» Disa dijetarë sqaruan: «hududet e Allahut» — çfarë u ndalua për të drejtën e Allahut. Sepse hudud në Kuran e Sunnet do të thotë: kufiri mes hallallit e haramit — fundi i hallallit, fillimi i haramit."><span class="w" data-sq="hadithi në dy Sahihët: nuk kamxhikohet mbi dhjetë veçse në hadd">والحديث الذي في «الصحيحين» عن النبي ﷺ أنه قال: «لا يُجلَد فوق عشرة أسواط إلا في حدٍّ من حدود الله»</span> <span class="w" data-sq="disa dijetarë: hududet e Allahut = çfarë u ndalua për të drejtën e Allahut">قد فسَّره طائفةٌ من أهل العلم بأن المراد بـ«حدود الله» بما حُرِّم لحق الله،</span> <span class="w" data-sq="hudud = kufiri mes hallallit e haramit">فإن الحدود في لفظ الكتاب والسنة يُراد بها الفصل بين الحلال والحرام، مثل آخر الحلال وأول الحرام،</span></span></p>

<p><span class="s" data-sq="në të parin thuhet:">فيقال في الأول:</span> <span class="s quran" data-sq="Ato janë dispozita (ligje) të Allahut, pra mos i tejkaloni ato. [El-Bekare: 229]">﴿تِلْكَ حُدُودُ اللَّهِ فَلَا تَعْتَدُوهَا﴾</span> <span class="s" data-sq="[El-Bekare: 229]. Dhe në të dytin:"> [البقرة: ٢٢٩]، ويقال في الثاني:</span> <span class="s quran" data-sq="...dispozitat e Allahut, pra mos iu afroni atyre. [El-Bekare: 187]">﴿حُدُودُ اللَّهِ فَلَا تَقْرَبُوهَا﴾</span> <span class="s" data-sq="[El-Bekare: 187]. Emërtimi i ndëshkimit të caktuar si 'hadd' është konventë e mëvonshme."><span class="w" data-sq="El-Bekare: 187"> [البقرة: ١٨٧]،</span> <span class="w" data-sq="emërtimi i ndëshkimit si hadd — konventë e mëvonshme">وأما تسمية العقوبة المُقَدَّرة حدًّا فهو عُرفٌ حادث.</span></span></p>

<p><span class="s" data-sq="Qëllimi i hadithit: kush rrah për të drejtën e vet — si rrahja e gruas për nushuz — nuk shton mbi dhjetë kamxhik."><span class="w" data-sq="kush rrah për të drejtën e vet — si rrahja e gruas për nushuz">ومراد الحديث: أن من ضرب لحقٍّ نفسه، كضَرْب الرجل امرأتَه في النشوز</span> <span class="w" data-sq="nuk shton mbi dhjetë kamxhik">لا يزيدُ على عشر جلدات.</span></span></p>`}
,{html:`<h2><span class="s" data-sq="Kapitull">فصل</span></h2>

<p><span class="s" data-sq="Kamxhikimi i Sheriatit: kamxhikimi i mesëm me kamxhik (sevt). Më e mira e çështjeve është mesatarja. Aliu, radijallahu anhu, tha: Goditje mes dy goditjesh, kamxhik mes dy kamxhikësh."><span class="w" data-sq="kamxhikimi i Sheriatit: i mesëm me kamxhik">والجلد الذي جاءت به الشريعة: هو الجلد المعتدل بالسوط،</span> <span class="w" data-sq="më e mira e çështjeve mesatarja; Aliu tha: goditje mes dy goditjesh">فإن خيار الأمور أوسطها، قال علي رَضِيَاللَّهُعَنْهُ: ضربٌ بين ضَرْبَيْن، وسَوطٌ بين سَوطَيْن.</span></span></p>

<p><span class="s" data-sq="Kamxhikimi nuk bëhet me shkop e as mëshqerra — nuk mjaftohet me dirre (kamxhik të vogël); dirreja përdoret në ta'zir."><span class="w" data-sq="nuk me shkop e as mëshqerra">ولا يكون الجلد بالعِصِي ولا المقارع،</span> <span class="w" data-sq="nuk mjaftohet me dirre; dirreja përdoret në ta'zir">ولا يُكتفَى فيه بالدِّرَّة، بل الدِّرَّة تُستعمل في التعزير.</span></span></p>

<p><span class="s" data-sq="Sa i përket dënimeve (hudud) — doemos kamxhik (sevt). Umeri, radijallahu anhu, ndëshkonte me dirre; kur vinin dënimet, kërkonte kamxhikun."><span class="w" data-sq="hudud doemos me kamxhik">أما الحدود فلابد فيها من الجلد بالسوط،</span> <span class="w" data-sq="Umeri ndëshkonte me dirre; kur vinin hudud, kërkonte sevtin">وكان عمر بن الخطاب رَضِيَاللَّهُعَنْهُ يؤدِّب بالدِّرَّة فإذا جاءت الحدود دعا بالسوط.</span></span></p>

<p><span class="s" data-sq="Nuk i zhvishen krejt rrobat — hiqen ato që pengojnë dhimbjen si jorganet e lëkurat. Nuk lidhet nëse nuk nevojitet. Nuk goditet fytyra — Pejgamberi ﷺ tha: «Kur lufton ndonjëri, le t'i shmanget fytyrës.» Nuk goditen vendet vdekjeprurëse — qëllimi edukim jo vrasje. Çdo gjymtyre merr pjesën e vet — si shpina"><span class="w" data-sq="nuk zhvishen krejt — hiqen jorganet e lëkurat; nuk lidhet nëse nuk nevojitet">ولا تجرَّد ثيابه كلها، بل يُنزع عنه ما يمنع ألم الضرب من الحشايا والفراء ونحو ذلك، ولا يُربط إذا لم يحتج إلى ذلك،</span> <span class="w" data-sq="nuk goditet fytyra — Pejgamberi ﷺ: le t'i shmanget fytyrës">ولا يضرب وجهُه، فإن النبي ﷺ قال: «إذا قاتل أحدكم فليتق الوجه».</span> <span class="w" data-sq="nuk goditen vendet vdekjeprurëse — qëllimi edukim; çdo gjymtyre merr pjesën">ولا يضرب مَقاتِلَه فإن المقصود تأديبُه لا قتلُه. ويُعطَى كلُّ عضوٍ حقَّه من الضرب؛ كالظهر</span></span></p>`}
,{html:`<p><span class="s" data-sq="krahët, kofshët e ngjashëm.">والأكتاف والفخذين ونحو ذلك.</span></p>

<h2><span class="s" data-sq="Kapitull">فصل</span></h2>

<p><span class="s" data-sq="Ndëshkimet me të cilat erdhi Sheriati për atë që kundërshtoi Allahun e të Dërguarin janë dy lloje:">العقوبات التي جاءت بها الشريعة لمن عصى الله ورسوله نوعان:</span></p>

<p><span class="s" data-sq="I pari: ndëshkimi i individit ose grupit nën kontroll — siç u përmend.">أحدهما: عقوبة المقدور عليه من الواحد والعدد، كما تقدم.</span></p>

<p><span class="s" data-sq="I dyti: ndëshkimi i grupit rebel që nuk mundësohet veçse me luftë.">والثاني: عقاب الطائفة الممتنعة كالتي لا يُقدَر عليها إلا بقتال.</span></p>

<p><span class="s" data-sq="Baza e kësaj është xhihadi kundër jobesimtarëve armiq të fesë. Çdo kujt i arriti thirrja e të Dërguarit ﷺ në fenë e Allahut e nuk iu përgjigj — obligohet luftimi, derisa të mos ketë fitne dhe feja t'i takojë krejt Allahut."><span class="w" data-sq="baza: xhihadi kundër jobesimtarëve armiq të fesë">فأصل هذا هو جهاد الكفار أعداء دين الله ورسوله،</span> <span class="w" data-sq="çdo kujt i arriti thirrja e nuk iu përgjigj — obligohet luftimi">فكلّ مَن بلَغَتْه دعوة رسول الله ﷺ إلى دين الله الذي بعثه به، فلم يستجب له، فإنه يجب قتاله، حتى لا تكون فتنة ويكون الدين كله لله.</span></span></p>

<p><span class="s" data-sq="Allahu — kur dërgoi Pejgamberin ﷺ e urdhëroi të thërrasë njerëzit — nuk i lejoi vrasjen e askujt e as luftën, derisa migroi në Medinë — atëherë lejoi atij e muslimanëve me fjalën e Tij:"><span class="w" data-sq="Allahu nuk lejoi vrasje as luftë derisa migroi në Medinë">وكان الله ـ لما بعث نبيه ﷺ وأمره بدعوة الخلق إلى دينه ـ لم يأذن له في قتل أحد على ذلك ولا قتاله، حتى هاجر إلى المدينة فأذن له وللمسلمين</span></span> <span class="s" data-sq="me fjalën e Tij:">بقوله سبحانه وتعالى:</span> <span class="s quran" data-sq="Atyre që sulmohen me luftë, u është dhënë leja, sepse u është bërë padrejtësi, e Allahu ka fuqi për t'u ndihmuar atyre. Ata, të cilët vetëm pse thanë: 'Zoti ynë është Allahu', u dëbuan pa kurrfarë të drejte. Sikur të mos i mbronte Allahu njerëzit me disa prej disa të tjerëve, do të rrënoheshin manastiret, kishat, sinagogat e xhamitë, ku përmendet shumë emri i Allahut. Allahu patjetër do ta ndihmojë atë që ndihmon rrugën e Tij, se Allahu është i fuqishëm, mbizotërues. Ata, të cilëve kur u mundësojmë vendosjen në tokë, e falin namazin, japin zekatin, urdhërojnë për të mirë e ndalojnë nga e keqja. Allahut i takon përfundimi i çështjeve. [El-Haxh: 39-41]">﴿أُذِنَ لِلَّذِينَ يُقَاتَلُونَ بِأَنَّهُمْ ظُلِمُوا وَإِنَّ اللَّهَ عَلَىٰ نَصْرِهِمْ لَقَدِيرٌ ۝ الَّذِينَ أُخْرِجُوا مِن دِيَارِهِم بِغَيْرِ حَقٍّ إِلَّا أَن يَقُولُوا رَبُّنَا اللَّهُ وَلَوْلَا دَفْعُ اللَّهِ النَّاسَ بَعْضَهُم بِبَعْضٍ لَّهُدِّمَتْ صَوَامِعُ وَبِيَعٌ وَصَلَوَاتٌ وَمَسَاجِدُ يُذْكَرُ فِيهَا اسْمُ اللَّهِ كَثِيرًا وَلَيَنصُرَنَّ اللَّهُ مَن يَنصُرُهُ إِنَّ اللَّهَ لَقَوِيٌّ عَزِيزٌ ۝ الَّذِينَ إِن مَّكَّنَّاهُمْ فِي الْأَرْضِ أَقَامُوا الصَّلَاةَ وَآتَوُا الزَّكَاةَ وَأَمَرُوا بِالْمَعْرُوفِ وَنَهَوْا عَنِ الْمُنكَرِ وَلِلَّهِ عَاقِبَةُ الْأُمُورِ﴾</span> <span class="s" data-sq="[El-Haxh: 39-41]. Pastaj obligoi luftën me fjalën e Tij:"> [الحج: ٣٩-٤١].</span></p>

<p><span class="s" data-sq="Pastaj obligoi luftën me fjalën e Tij:">ثم إنه بعد ذلك أوجب عليهم القتال بقوله سبحانه وتعالى:</span> <span class="s quran" data-sq="Lufta u është bërë obligim, ndonëse është e urrejtur për ju, por mund që ju ta urreni një send e ai është i mirë për ju, dhe mund që ju të dëshironi diçka e ajo është e dëmshme për ju. Allahu din e ju nuk dini. [El-Bekare: 216]">﴿كُتِبَ</span></p>`}
,{html:`<p><span class="s quran" data-sq="...Lufta u është bërë obligim, ndonëse është e urrejtur për ju, por mund që ta urreni një send e ai është i mirë për ju, dhe mund që dëshironi diçka e ajo dëmshme. Allahu din e ju nuk dini. [El-Bekare: 216]">عَلَيْكُمُ الْقِتَالُ وَهُوَ كُرْهٌ لَّكُمْ وَعَسَىٰ أَن تَكْرَهُوا شَيْئًا وَهُوَ خَيْرٌ لَّكُمْ وَعَسَىٰ أَن تُحِبُّوا شَيْئًا وَهُوَ شَرٌّ لَّكُمْ وَاللَّهُ يَعْلَمُ وَأَنتُمْ لَا تَعْلَمُونَ﴾</span> <span class="s" data-sq="[El-Bekare: 216]."> [البقرة: ٢١٦].</span></p>

<p><span class="s" data-sq="E forcoi obligimin dhe madhëroi xhihadin në shumicën e sureve medinase, qortoi braktisësit duke i cilësuar me nifak e sëmundje zemre. Tha:"><span class="w" data-sq="forcoi obligimin, madhëroi xhihadin në suret medinase">ووكَّد الإيجابَ وعظَّم أمرَ الجهاد في عامة السور المدنية،</span> <span class="w" data-sq="qortoi braktisësit — nifak e sëmundje zemre">وذمَّ التاركين له ووصفهم بالنفاق ومرض القلوب، فقال سبحانه وتعالى:</span></span> <span class="s quran" data-sq="Thuaj: Nëse prindërit tuaj, fëmijët tuaj, vëllezërit tuaj, bashkëshortet tuaja, farefisi juaj, pasuria që e fituat, tregtia që frikësoheni se dështon, dhe vendbanmet me të cilat jeni të kënaqur, janë më të dashura se Allahu, i dërguari i Tij dhe lufta në rrugën e Tij, pritni derisa Allahu të sjellë vendimin. Allahu nuk udhëzon popullin e prishur. [Et-Teube: 24]">﴿قُلْ إِن كَانَ آبَاؤُكُمْ وَأَبْنَاؤُكُمْ وَإِخْوَانُكُمْ وَأَزْوَاجُكُمْ وَعَشِيرَتُكُمْ وَأَمْوَالٌ اقْتَرَفْتُمُوهَا وَتِجَارَةٌ تَخْشَوْنَ كَسَادَهَا وَمَسَاكِنُ تَرْضَوْنَهَا أَحَبَّ إِلَيْكُم مِّنَ اللَّهِ وَرَسُولِهِ وَجِهَادٍ فِي سَبِيلِهِ فَتَرَبَّصُوا حَتَّىٰ يَأْتِيَ اللَّهُ بِأَمْرِهِ وَاللَّهُ لَا يَهْدِي الْقَوْمَ الْفَاسِقِينَ﴾</span> <span class="s" data-sq="[Et-Teube: 24]. Dhe tha:"> [التوبة: ٢٤]، وقال سبحانه وتعالى:</span> <span class="s quran" data-sq="Besimtarë të vërtetë janë vetëm ata që i besuan Allahut e të dërguarit të Tij, pastaj nuk dyshuan, dhe me pasurinë e veten luftuan në rrugën e Allahut. Ata janë të sinqertit. [El-Huxhurat: 15]">﴿إِنَّمَا الْمُؤْمِنُونَ الَّذِينَ آمَنُوا بِاللَّهِ وَرَسُولِهِ ثُمَّ لَمْ يَرْتَابُوا وَجَاهَدُوا بِأَمْوَالِهِمْ وَأَنفُسِهِمْ فِي سَبِيلِ اللَّهِ أُولَـٰئِكَ هُمُ الصَّادِقُونَ﴾</span> <span class="s" data-sq="[El-Huxhurat: 15]. Dhe tha:"> [الحجرات: ١٥]، وقال سبحانه وتعالى:</span> <span class="s quran" data-sq="E kur zbritet ndonjë sure kuptimplote ku përmendet lufta, i sheh ata që në zemra kanë sëmundje, se si shikojnë ty sikurse shikohet ai që e ka kapluar vdekja. Po mjerë ata! Respekt e fjalë të mira, e kur vendoset çështja, sikur do të ishin të sinqertë ndaj Allahut, do ishte më mirë për ta. [Muhammed: 20-21]">﴿فَإِذَا أُنزِلَتْ سُورَةٌ مُّحْكَمَةٌ وَذُكِرَ فِيهَا الْقِتَالُ رَأَيْتَ الَّذِينَ فِي قُلُوبِهِم مَّرَضٌ يَنظُرُونَ إِلَيْكَ نَظَرَ الْمَغْشِيِّ عَلَيْهِ مِنَ الْمَوْتِ فَأَوْلَىٰ لَهُمْ ۝ طَاعَةٌ وَقَوْلٌ مَّعْرُوفٌ فَإِذَا عَزَمَ الْأَمْرُ فَلَوْ صَدَقُوا اللَّهَ لَكَانَ خَيْرًا لَّهُمْ﴾</span> <span class="s" data-sq="[Muhammed: 20-21]. Kjo shumë në Kuran."> [محمد: ٢٠-٢١]، وهذا كثير في القرآن.</span></p>

<p><span class="s" data-sq="Gjithashtu madhërimi i xhihadit e njerëzve të tij, si fjala e Tij:">وكذلك تعظيمه وتعظيم أهله كقوله:</span> <span class="s quran" data-sq="O ju që besuat, a t'ju tregoj për një tregti që ju shpëton prej dënimit të dhembshëm? T'i besoni Allahut e të dërguarit të Tij, të luftoni në rrugën e Allahut me pasurinë e veten tuaj. Kjo shumë më e dobishme, nëse dini. Jua fal mëkatet, ju shpie në xhennete nëpër të cilat rrjedhin lumenj, vendbanime të bukura në xhennetin e Adnit — suksesi i madh. Edhe ndihmë prej Allahut e çlirim i afërt. Jepu myzhde besimtarëve. [Es-Saff: 10-13]">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا هَلْ أَدُلُّكُمْ عَلَىٰ تِجَارَةٍ تُنجِيكُم مِّنْ عَذَابٍ أَلِيمٍ ۝ تُؤْمِنُونَ بِاللَّهِ وَرَسُولِهِ وَتُجَاهِدُونَ فِي سَبِيلِ اللَّهِ بِأَمْوَالِكُمْ وَأَنفُسِكُمْ ذَٰلِكُمْ خَيْرٌ لَّكُمْ إِن كُنتُمْ تَعْلَمُونَ ۝ يَغْفِرْ لَكُمْ ذُنُوبَكُمْ وَيُدْخِلْكُمْ جَنَّاتٍ تَجْرِي مِن تَحْتِهَا الْأَنْهَارُ وَمَسَاكِنَ طَيِّبَةً فِي جَنَّاتِ عَدْنٍ ذَٰلِكَ الْفَوْزُ الْعَظِيمُ ۝ وَأُخْرَىٰ تُحِبُّونَهَا نَصْرٌ مِّنَ اللَّهِ وَفَتْحٌ قَرِيبٌ وَبَشِّرِ الْمُؤْمِنِينَ﴾</span> <span class="s" data-sq="[Es-Saff: 10-13]. Dhe fjala e Tij:"> [الصف: ١٠-١٣]، وكقوله تعالى:</span> <span class="s quran" data-sq="A e barazuat dhënien e ujit haxhinjve e mirëmbajtjen e Xhamisë së Shenjtë me atë që besoi Allahun, ditën e fundit dhe luftoi në rrugën e Allahut? Nuk janë të barabartë te Allahu. Allahu nuk udhëzon popullin zullumqar. Ata që besuan, migruan e luftuan në rrugën e Allahut me pasurinë e tyre">﴿أَجَعَلْتُمْ سِقَايَةَ الْحَاجِّ وَعِمَارَةَ الْمَسْجِدِ الْحَرَامِ كَمَنْ آمَنَ بِاللَّهِ وَالْيَوْمِ الْآخِرِ وَجَاهَدَ فِي سَبِيلِ اللَّهِ لَا يَسْتَوُونَ عِندَ اللَّهِ وَاللَّهُ لَا يَهْدِي الْقَوْمَ الظَّالِمِينَ ۝ الَّذِينَ آمَنُوا وَهَاجَرُوا وَجَاهَدُوا فِي سَبِيلِ اللَّهِ بِأَمْوَالِهِمْ</span></p>`}
,{html:`<p><span class="s quran" data-sq="...dhe me veten e tyre, kanë pozitë më të lartë te Allahu. Ata janë fatlumët. Zoti i tyre i përgëzon me mëshirë, kënaqësi e xhennete me begati të përhershme. Ku do të jenë përgjithmonë. Allahu ka shpërblim të madh. [Et-Teube: 19-22]">وَأَنفُسِهِمْ أَعْظَمُ دَرَجَةً عِندَ اللَّهِ وَأُولَـٰئِكَ هُمُ الْفَائِزُونَ ۝ يُبَشِّرُهُمْ رَبُّهُم بِرَحْمَةٍ مِّنْهُ وَرِضْوَانٍ وَجَنَّاتٍ لَّهُمْ فِيهَا نَعِيمٌ مُّقِيمٌ ۝ خَالِدِينَ فِيهَا أَبَدًا إِنَّ اللَّهَ عِندَهُ أَجْرٌ عَظِيمٌ﴾</span> <span class="s" data-sq="[Et-Teube: 19-22]. Dhe fjala e Tij:"> [التوبة: ١٩-٢٢]، وقوله:</span> <span class="s quran" data-sq="Kush largohet prej jush nga feja e vet, Allahu do ta sjellë një popull që Ai i do e ata e duan Atë, të butë ndaj besimtarëve, të ashpër ndaj jobesimtarëve, luftojnë në rrugën e Allahut e nuk i frikësohen qortimit. Kjo dhuratë e Allahut ia jep kujt do. Allahu është i gjërë, i dijshëm. [El-Maide: 54]">﴿مَن يَرْتَدَّ مِنكُمْ عَن دِينِهِ فَسَوْفَ يَأْتِي اللَّهُ بِقَوْمٍ يُحِبُّهُمْ وَيُحِبُّونَهُ أَذِلَّةٍ عَلَى الْمُؤْمِنِينَ أَعِزَّةٍ عَلَى الْكَافِرِينَ يُجَاهِدُونَ فِي سَبِيلِ اللَّهِ وَلَا يَخَافُونَ لَوْمَةَ لَائِمٍ ذَٰلِكَ فَضْلُ اللَّهِ يُؤْتِيهِ مَن يَشَاءُ وَاللَّهُ وَاسِعٌ عَلِيمٌ﴾</span> <span class="s" data-sq="[El-Maide: 54]. Dhe tha:"> [المائدة: ٥٤]، وقال سبحانه وتعالى:</span> <span class="s quran" data-sq="Kjo ngase ata nuk i godet as etja, as lodhja, as uria në rrugën e Allahut, nuk shkelin vend që hidhëron jobesimtarët, nuk arrijnë kundër armikut asnjë fitore, e që mos u shkruhet veprë e mirë. Allahu nuk ua humb shpërblimin bamirësve. Nuk bëjnë asnjë shpenzim as të vogël e as të madh, nuk kalojnë asnjë luginë, e që ajo mos u shkruhet, e Allahu t'u shpërblejë edhe më mirë. [Et-Teube: 120-121]">﴿ذَٰلِكَ بِأَنَّهُمْ لَا يُصِيبُهُمْ ظَمَأٌ وَلَا نَصَبٌ وَلَا مَخْمَصَةٌ فِي سَبِيلِ اللَّهِ وَلَا يَطَئُونَ مَوْطِئًا يَغِيظُ الْكُفَّارَ وَلَا يَنَالُونَ مِنْ عَدُوٍّ نَّيْلًا إِلَّا كُتِبَ لَهُم بِهِ عَمَلٌ صَالِحٌ إِنَّ اللَّهَ لَا يُضِيعُ أَجْرَ الْمُحْسِنِينَ ۝ وَلَا يُنفِقُونَ نَفَقَةً صَغِيرَةً وَلَا كَبِيرَةً وَلَا يَقْطَعُونَ وَادِيًا إِلَّا كُتِبَ لَهُمْ لِيَجْزِيَهُمُ اللَّهُ أَحْسَنَ مَا كَانُوا يَعْمَلُونَ﴾</span> <span class="s" data-sq="[Et-Teube: 120-121]."> [التوبة: ١٢٠-١٢١]،</span></p>

<p><span class="s" data-sq="Përmendi çfarë lind nga veprat e tyre dhe çfarë kryejnë nga punët.">فذكر ما يولده عن أعمالهم وما يباشرونه من الأعمال.</span></p>

<p><span class="s" data-sq="Urdhëri për xhihad dhe vlerat e tij në Kuran e Sunnet janë më shumë se sa numërohen. Prandaj xhihadi vullnetar është vepra më e vlefshme. Me konsensus — më i vlefshëm se haxhi, umra, namazi e agjërimi vullnetar, siç tregojnë Kurani e Sunneti. Pejgamberi ﷺ tha:"><span class="w" data-sq="urdhëri për xhihad — më shumë se sa numërohen; vepra më e vlefshme vullnetare">والأمرُ بالجهاد وذِكر فضائله في الكتاب والسنة أكثر من أن تُحْصَر؛ ولهذا كان أفضلَ ما تطوع به الإنسان،</span> <span class="w" data-sq="me konsensus më i vlefshëm se haxhi, umra, namazi e agjërimi vullnetar">وكان باتفاق العلماء أفضل من الحجِّ والعمرة، ومن الصلاة التطوع والصوم التطوع، كما دل عليه الكتاب والسنة،</span> <span class="w" data-sq="Pejgamberi ﷺ tha:">حتى قال النبي ﷺ:</span></span> <span class="s hadith" data-sq="Kreu i çështjes është Islami, shtylla e tij namazi, dhe kulmi i tij xhihadi.">«رأسُ الأمر الإسلام، وعمودُه الصلاة، وذِروةُ سنامه الجهاد».</span></p>`}
,{html:`<p><span class="s" data-sq="Dhe tha ﷺ:">وقال ﷺ:</span> <span class="s hadith" data-sq="Në Xhennet ka njëqind shkallë, mes shkallës e shkallës sa mes qiellit e tokës — i përgaditi Allahu për muxhahidët në rrugën e Tij.">«إنَّ في الجنة لمئةَ درجة ما بين الدرجة إلى الدرجة كما بين السماء والأرض أعدَّها الله للمجاهدين في سبيله»</span> <span class="s" data-sq="Muttefekun alejhi.">متفق عليه.</span></p>

<p><span class="s" data-sq="Dhe tha ﷺ:">وقال ﷺ:</span> <span class="s hadith" data-sq="Kujt i pluhurosin këmbët në rrugën e Allahut, ia ndalon Allahu Zjarrin.">«مَن اغبرَّت قدماه في سبيل الله حرَّمه الله على النار»</span> <span class="s" data-sq="Transmetoi Buhariu.">رواه البخاري.</span></p>

<p><span class="s" data-sq="Dhe tha:">وقال:</span> <span class="s hadith" data-sq="Roja e një dite e nate më e mirë se agjërimi e falja e një muaji. Nëse vdes — vazhdon vepra, rrjedh rizku, sigurohet nga sprova e varrit.">«رباطُ يومٍ وليلة خيرٌ من صيام شهرٍ وقيامه، وإن مات جرى عليه عملُه الذي كان يعمله، وأُجرِي عليه رِزقُه، وأمِنَ الفتَّان»</span> <span class="s" data-sq="Transmetoi Muslimi.">رواه مسلم.</span></p>

<p><span class="s" data-sq="Në Sunen:">وفي «السنن»:</span> <span class="s hadith" data-sq="Roja e një dite në rrugën e Allahut më e mirë se njëmijë ditë në vendet e tjera.">«رباطُ يومٍ في سبيل الله خير من ألف يومٍ فيما سواه من المنازل».</span></p>

<p><span class="s" data-sq="Dhe tha ﷺ:">وقال ﷺ:</span> <span class="s hadith" data-sq="Dy sy nuk i prek Zjarri: syri që qau nga frika e Allahut, dhe syri që roji në rrugën e Allahut.">«عينانِ لا تمسهما النار: عينٌ بكَت من خشية الله، وعينٌ باتت تحرس في سبيل الله».</span> <span class="s" data-sq="Tirmidhiu tha: hadith hasen.">قال الترمذي: حديث حسن.</span></p>

<p><span class="s" data-sq="Në Musnedin e Ahmedit:">وفي «مسند أحمد»:</span> <span class="s hadith" data-sq="Roja e një nate në rrugën e Allahut më e vlefshme se njëmijë net që falet">«حرَسَ ليلةٍ في سبيل الله أفضلُ من ألف ليلة يُقام</span></p>`}
,{html:`<p><span class="s hadith" data-sq="...netet e tyre dhe agjërohen ditët e tyre.">ليلُها ويُصام نهارُها».</span></p>

<p><span class="s" data-sq="Në dy Sahihët: një njeri tha: O i Dërguar, më trego diçka që barazohet me xhihadin. Tha: «Nuk mundesh.» Tha: më trego. Tha:"><span class="w" data-sq="në dy Sahihët: një njeri pyeti për diçka si xhihadi">وفي «الصحيحين»: أن رجلًا قال: يا رسول الله، أخبرني بشيء يعدل</span></span> <span class="s hadith" data-sq="Nuk mundesh.">الجهاد في سبيل الله، قال: «لا تستطيعه»،</span> <span class="s" data-sq="Tha: më trego. Tha:">قال: فأخْبِرني به، قال:</span> <span class="s hadith" data-sq="A mundesh, kur del muxhahidi, të agjërosh pa ndërprerë dhe të falesh pa pushuar?">«هل تستطيع إذا خرج المجاهد أن تصوم لا تفطر وتقوم لا تفتر؟»</span> <span class="s" data-sq="Tha: jo. Tha:">قال: لا، [قال]:</span> <span class="s hadith" data-sq="Ky është ai që barazohet me xhihadin.">«فذلك الذي يعدل الجهاد».</span></p>

<p><span class="s" data-sq="Në Sunen: tha: «Çdo ummet ka udhëtimin e vet, dhe udhëtimi i ummetit tim është xhihadi në rrugën e Allahut.»">وفي «السنن»: أنه قال:</span> <span class="s hadith" data-sq="Çdo ummet ka udhëtimin e vet, dhe udhëtimi i ummetit tim është xhihadi në rrugën e Allahut.">«إن لكلِّ أمة سياحة وسياحةُ أمتي الجهاد في سبيل الله».</span></p>

<p><span class="s" data-sq="Ky kapitull është i gjërë — nuk ka ardhur në shpërblimin e veprave dhe vlerat e tyre ngjashëm si çfarë erdhi për xhihadin. Kjo është e dukshme kur shqyrtohet: dobia e xhihadit është e përgjithshme për vepruesin e të tjerët, në fe e dynja. Ai përfshin të gjitha ibadetet e brendshme e të jashtme — dashurinë e Allahut, sinqeritetin, mbështetjen, dorëzënien e vetes e pasurisë"><span class="w" data-sq="kapitull i gjërë — asnjë vepër si xhihadi në shpërblim">وهذا الباب واسعٌ لم يرد في ثواب الأعمال وفضلها مثل ما ورد فيه،</span> <span class="w" data-sq="dobia e xhihadit e përgjithshme — për vepruesin e të tjerët, fe e dynja">وهو ظاهر عند الاعتبار؛ فإن نَفْع الجهاد عامٌّ لفاعله ولغيره في الدين والدنيا،</span> <span class="w" data-sq="përfshin të gjitha ibadetet — dashurinë, sinqeritetin, mbështetjen, dorëzënien">ويشتمل على جميع أنواع العبادات الباطنة والظاهرة، فإنه يشتمل على ما يحبه الله عز وجل، والإخلاص له، والتوكل عليه، وتسليم النفس والمال</span></span></p>`}
,{html:`<p><span class="s" data-sq="Atij, durimin, asketizmin, dhikrin, dhe të gjitha llojet e veprave — asnjë vepër tjetër nuk i mbledh të gjitha."><span class="w" data-sq="Atij, durimin, asketizmin, dhikrin">له، والصبر والزهد، وذكر الله سبحانه وتعالى،</span> <span class="w" data-sq="dhe të gjitha llojet e veprave — asnjë tjetër nuk i mbledh">وسائر أنواع الأعمال= على ما لا يشتمل عليه عمل آخر.</span></span></p>

<p><span class="s" data-sq="Kryerësi i tij — personi e ummeti — mes njërit nga dy mirësitë gjithmonë: ose fitore, ose rënie dëshmor e Xhennet."><span class="w" data-sq="kryerësi — mes njërit nga dy mirësitë gjithmonë">والقائم به من الشخص والأمة بين إحدى الحسنيين دائمًا،</span> <span class="w" data-sq="ose fitore, ose dëshmi e Xhennet">إما النصر والظَّفَر، وإما الشهادة والجنة.</span></span></p>

<p><span class="s" data-sq="Njerëzve u nevojitet jeta e vdekja — në jetë përdorin mjetet, në braktisjen e xhihadit humbin dy lumturitë ose pakësohen. Kush dëshiron punë të rënda në fe e dynja me pak dobi, xhihadi është më i dobishëm në të dyja. Edhe vdekja e dëshmorit më e lehtë, dhe ajo më e mirë."><span class="w" data-sq="njerëzve u nevojitet jeta e vdekja; braktisja e xhihadit humb dy lumturitë">ثم إن الخلق لابد لهم من محيا وممات، ففيه يستعمل محياهم ومماتهم في غاية سعادتهم في الدنيا والآخرة، وفي تركه ذهاب السعادتين أو نقصهما،</span> <span class="w" data-sq="kush dëshiron punë të rënda — xhihadi më i dobishëm; vdekja e dëshmorit më e lehtë">فإن من الناس من يرغب في الأعمال الشديدة في الدين والدنيا مع قلة منفعتها، فالجهاد أنفع فيهما من كل عمل شديد، وقد يرغب في ترفيه نفسه حتى يصادفه الموت فموت الشهيد أيسر من كل ميْتة، وهي أفضل الميتات.</span></span></p>

<p><span class="s" data-sq="Kur baza e luftës së ligjshme — xhihadi — dhe qëllimi i tij janë: që feja t'i takojë krejt Allahut dhe fjala e Tij të jetë më e larta. Kush pengon këtë — luftohet me konsensus."><span class="w" data-sq="baza e luftës — xhihadi — qëllimi: feja krejt Allahut, fjala e Tij më e larta">وإذا كان أصلُ القتال المشروع ـ وهو الجهاد ـ ومقصودُه: هو أن يكون الدينُ كلُّه لله، وأن تكون كلمة الله هي العليا،</span> <span class="w" data-sq="kush pengon — luftohet me konsensus">فمَن منع هذا قُوتِل باتفاق المسلمين.</span></span></p>

<p><span class="s" data-sq="Ata që nuk janë luftëtarë — gratë, fëmijët, murgjit, pleqtë, të verbrit, të sëmurët — nuk vriten te shumica e dijetarëve, siç tregojnë Kurani e Sunneti. Edhe nëse disa lejojnë vrasjen e të gjithëve thjesht për shkak të kufrit, i pari më i saktë."><span class="w" data-sq="ata jo luftëtarë — gratë, fëmijët, murgjit, pleqtë — nuk vriten te shumica">وأما من لم يكن من أهل الممانعة والمقاتلة؛ كالنساء والصبيان، والراهب والشيخ الكبير، والأعمى والزَّمِن ونحوهم؛ فلا يُقتَل عند جمهور العلماء</span> <span class="w" data-sq="edhe nëse disa lejojnë vrasjen për kufr — i pari i saktë">إلا أن يُقاتِل بقوله أو فعله، وإن كان بعضهم يرى إباحة قتل الجميع بمجرَّد الكفر، إلا النساء والصبيان لكونهم مالًا للمسلمين، والأول هو الصواب،</span></span></p>

<p><span class="s" data-sq="sepse lufta është për ata që na luftojnë kur dëshirojmë shfaqjen e fesë, siç tha Allahu i Lartësuar:"><span class="w" data-sq="lufta për ata që na luftojnë">فإن القتال هو لمن يقاتلنا إذا أردنا إظهار دين الله، كما قال</span></span></p>`}
,{html:`<p><span class="s" data-sq="Allahu i Lartësuar tha:">سبحانه وتعالى:</span> <span class="s quran" data-sq="Dhe luftoni në rrugën e Allahut ata që ju luftojnë juve, e mos e teproni se Allahu nuk i do ata që e teprojnë. [El-Bekare: 190]">﴿وَقَاتِلُوا فِي سَبِيلِ اللَّهِ الَّذِينَ يُقَاتِلُونَكُمْ وَلَا تَعْتَدُوا إِنَّ اللَّهَ لَا يُحِبُّ الْمُعْتَدِينَ﴾</span> <span class="s" data-sq="[El-Bekare: 190]."> [البقرة: ١٩٠].</span></p>

<p><span class="s" data-sq="Në Sunen: Pejgamberi ﷺ kaloi pranë një gruaje të vrarë në një betejë, ndaloi njerëzit dhe tha: «Kjo nuk ishte luftëtare.» Njërit i tha: «Ndalo! Mos vrisni fëmijë as punëtor» — do të thotë punëtorë jo luftëtarë."><span class="w" data-sq="në Sunen: kaloi pranë gruaje të vrarë, tha: nuk ishte luftëtare">وفي «السنن» عنه ﷺ أنه مَرَّ على امرأة مقتولة في بعض مغازيه قد وقف عليها الناس، فقال:</span></span> <span class="s hadith" data-sq="Kjo nuk ishte luftëtare.">«ما كانت هذه لتقاتل»،</span> <span class="s" data-sq="Njërit i tha:">وقال لأحدهم:</span> <span class="s hadith" data-sq="Ndalo! Mos vrisni fëmijë as punëtor.">«الْحَق خالدًا فقل له: لا تقتلوا ذريةً ولا عسيفًا»</span> <span class="s" data-sq="do të thotë punëtorë jo luftëtarë.">يعني أجيرًا.</span></p>

<p><span class="s" data-sq="Transmetohet nga Pejgamberi ﷺ se thoshte: «Mos vrisni plak, as fëmijë, as grua.»">وفيها عنه ﷺ أنه كان يقول:</span> <span class="s hadith" data-sq="Mos vrisni plak, as fëmijë, as grua.">«لا تقتلوا شيخًا فانيًا، ولا طفلًا صغيرًا، ولا امرأة».</span></p>

<p><span class="s" data-sq="Kjo sepse Allahu lejoi nga vrasja e njerëzve çfarë nevojitet për përmirësimin e krijesave — siç tha: «Fitnja (shirku) është më e rëndë se vrasja.» [El-Bekare: 217] Do të thotë: vrasja edhe pse ka sherr e çrregullim, fitnja e jobesimtarëve — shirku e çrregullimi — është më i keq."><span class="w" data-sq="Allahu lejoi nga vrasja çfarë nevojitet për përmirësim">وذلك أن الله تعالى أباح من قَتْل النفوس ما يُحتاج إليه في صلاح الخلق،</span> <span class="w" data-sq="fitnja (shirku) më e rëndë se vrasja">كما قال سبحانه وتعالى:</span></span> <span class="s quran" data-sq="Fitnja është më e rëndë (e keqe) se vrasja. [El-Bekare: 217]">﴿وَالْفِتْنَةُ أَشَدُّ مِنَ الْقَتْلِ﴾</span> <span class="s" data-sq="[El-Bekare: 217]. Do të thotë: vrasja ka sherr, por fitnja e jobesimtarëve — shirku e çrregullimi — është më e keqe."> [البقرة: ٢١٧]، أي: أن القتل وإن كان فيه شرٌّ وفساد، ففي فتنة الكفار من الشرِّ والفساد ما هو أكبر منه.</span></p>`}
,{html:`<p><span class="s" data-sq="Kush nuk pengon muslimanët nga feja, dëmi i kufrit të tij është vetëm mbi veten. Prandaj fukahave thanë: thirrësi në bidate ndëshkohet me çfarë nuk ndëshkohet heshtuesi."><span class="w" data-sq="kush nuk pengon — dëmi vetëm mbi veten">فمن لم يمنع المسلمين من إقامة دين الله، لم تكن مضرة كفره إلا على نفسه،</span> <span class="w" data-sq="thirrësi në bidate ndëshkohet ndryshe nga heshtuesi">ولهذا قال الفقهاء: إن الداعية إلى البدع المخالفة للكتاب والسنة يُعاقَب بما لا يُعاقَب به الساكت.</span></span></p>
