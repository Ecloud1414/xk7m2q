<p><span class="s" data-sq="Në hadith: «Kur mëkati fshihet, dëmton vetëm vepruesin; por kur shfaqet e nuk mohohet, dëmton të gjithë.»">وجاء في الحديث:</span> <span class="s hadith" data-sq="Kur mëkati fshihet, dëmton vetëm vepruesin; por kur shfaqet e nuk mohohet, dëmton të gjithë.">«إن الخطيئة إذا أُخفيت لم تضرَّ إلا صاحبها، ولكن إذا ظهرت فلم تُنكر ضرَّت العامة».</span></p>

<p><span class="s" data-sq="Prandaj Sheriati obligoi luftimin e jobesimtarëve, por nuk obligoi vrasjen e atij nën kontroll — por kur kapet prej tyre me luftë ose jo, si hedhja e safines pranë nesh, ose marrja me mashtrim — vepron imami sipas të dobishmes: vrasje, robërim, lëshim ose shpërblim — te shumica, siç tregojnë Kurani e Sunneti. Edhe nëse disa fukaha mendojnë se pengu vetem vritet ose robërohet."><span class="w" data-sq="Sheriati obligoi luftimin, nuk obligoi vrasjen e atij nën kontroll">ولهذا أوجبت الشريعة قتال الكفار، ولم توجب قَتْل المقدور عليه</span> <span class="w" data-sq="kur kapet — imami vepron: vrasje, robërim, lëshim ose shpërblim">منهم، بل إذا أُسِر الرجلُ [منهم] في القتال أو غير القتال، مثل أن تُلقيه السفينةُ إلينا، أو يضل الطريق، أو يؤخذ بحيلة، فإنه يفعل به الإمامُ الأصلح؛ من قتله، أو استعباده، أو المنُّ عليه، أو مفاداته بمال أو نفس عند أكثر الفقهاء، كما دل عليه الكتاب والسنة.</span> <span class="w" data-sq="edhe nëse disa mendojnë se vetëm vritet ose robërohet">وإن كان من الفقهاء مَن يرى المنَّ عليه ومفاداته منسوخًا.</span></span></p>

<p><span class="s" data-sq="Sa u përket ithtarëve të Librit e mexhusëve — luftohen derisa pranojnë Islamin ose japin xhizjen duke qenë nën-dorë. Nga të tjerët — fukahave iu ndanë mendimet për marrjen e xhizjes, por shumica nuk e marrin nga arabët."><span class="w" data-sq="ithtarët e Librit e mexhusët — luftohen derisa Islam ose xhizje">فأما أهل الكتاب والمجوس فيُقاتَلون حتى يسلموا أو يُعطوا الجزية عن يدٍ وهم صاغرون.</span> <span class="w" data-sq="nga të tjerët ndahen; shumica nuk e marrin nga arabët">ومن سواهم؛ فقد اختلف الفقهاء في أخذ الجزية منهم، إلا أن عامَّتَهم لا يأخذونها من العرب.</span></span></p>

<p><span class="s" data-sq="Kur një grup rebel i përkasë Islamit por refuzojë disa ligje — ">وأيُّما طائفة ممتنعة انتسبت إلى الإسلام، وامتنعت من بعض شرائعه</span></p>`}
,{html:`<p><span class="s" data-sq="ligjet e dukshme të transmetuara me mutevatur; sepse luftimi i tyre është obligim me konsensus të myslimanëve, derisa feja t'i përkasë tërësisht Allahut,">الظاهرة المتواترة؛ فإنه يجب جهادُها باتفاق المسلمين، حتىٰ يكون الدين كلُّه لله،</span> <span class="s" data-sq="siç luftoi Ebu Bekri es-Siddiku dhe të gjithë sahabët, Allahu qoftë i kënaqur me ta, kundër atyre që refuzuan zekatin,">كما قاتل أبو بكر الصديق وسائر الصحابة رضي الله عنهم مانعي الزكاة،</span> <span class="s" data-sq="edhe pse disa sahabë kishin hezituar në fillim për luftimin e tyre, pastaj u pajtuan,">وقد كان قد توقف في قتالهم بعضُ الصحابة ثم اتفقوا،</span> <span class="s" data-sq="derisa Umer ibn el-Hattabi i tha Ebu Bekrit, Allahu qoftë i kënaqur me ta: Si i lufton njerëzit kur i Dërguari i Allahut ﷺ ka thënë:">حتىٰ قال عمر بن الخطاب لأبي بكر رضي الله عنهما: كيف تقاتل الناس وقد قال رسول الله ﷺ:</span> <span class="s hadith" data-sq="'Jam urdhëruar t'i luftoj njerëzit derisa të dëshmojnë se nuk ka zot tjetër përveç Allahut dhe se Muhamedi është i Dërguari i Allahut; kur ta thonë këtë, i kanë mbrojtur prej meje gjakun dhe pasurinë e tyre përveçse me të drejtën e saj, ndërsa llogaria e tyre është tek Allahu.'">«أُمِرتُ أن أُقاتلَ الناسَ حتىٰ يشهدوا أن لا إله إلا الله، وأن محمدًا رسول الله، فإذا قالوها عصموا مني دماءَهم وأموالَهم إلا بحقِّها، وحسابُهم على الله»</span> <span class="s" data-sq="Ebu Bekri i tha: Zekati është prej të drejtës së saj. Pasha Allahun, sikur të më refuzonin edhe një kec që ia jepnin të Dërguarit të Allahut ﷺ, do t'i luftoja për refuzimin e tij.">فقال له أبو بكر رضي الله عنه: فإن الزكاة من حقها، والله لو منعوني عَناقًا كانوا يؤدونها إلىٰ رسول الله ﷺ لقاتلتهم على منعها.</span> <span class="s" data-sq="Umeri tha: Sapo pashë se Allahu ia hapi gjoksin Ebu Bekrit për luftë, kuptova se ishte e vërteta.">قال عمر: فما هو إلا أن رأيتُ قد شرح الله صدرَ أبي بكر للقتال، فعلمتُ أنه الحق.</span></p>
<p><span class="s" data-sq="Dhe është vërtetuar nga Pejgamberi ﷺ përmes shumë rrugëve se ai urdhëroi luftimin e havarixhëve,">وقد ثبت عن النبي ﷺ من وجوه كثيرة أنه أمر بقتال الخوارج،</span> <span class="s" data-sq="dhe në dy Sahihët, nga Ali ibn Ebi Talibi, Allahu qoftë i kënaqur me të, thotë: Kam dëgjuar të Dërguarin e Allahut ﷺ duke thënë:">وفي «الصحيحين» عن علي بن أبي طالب رضي الله عنه قال: سمعت رسول الله ﷺ يقول:</span> <span class="s hadith" data-sq="'Do të dalin disa njerëz në fund të kohës, të rinj në moshë, mendjelehtë, flasin fjalën më të mirë të krijesave, besimi i tyre nuk u kalon fytin, dalin nga feja siç del shigjeta nga gjahu — kudo që t'i takoni vritini, sepse në vrasjen e tyre ka shpërblim për atë që i vret Ditën e Kiametit.'">«سيخرج قومٌ في آخر الزمان حِداث الأسنان، سفهاء الأحلام، يقولون من قول خير البرية، لا يجاوز إيمانُهم حناجرَهم، يمرقون من الدين كما يمرق السهم من الرَّمِيَّة، فأينما لقيتموهم فاقتلوهم فإن في قتلهم أجرًا لمن قتلهم يوم القيامة»</span></p>
<p><span class="s" data-sq="Në një transmetim tjetër të Muslimit, nga Aliu, Allahu qoftë i kënaqur me të, thotë: Kam dëgjuar të Dërguarin e Allahut ﷺ —">وفي رواية لمسلم عن علي رضي الله عنه قال: سمعت رسول الله ﷺ</span></p>`}
,{html:`<p><span class="s hadith" data-sq="duke thënë: 'Do të dalin nga umeti im njerëz që lexojnë Kuranin — leximi juaj krahasuar me leximin e tyre nuk është asgjë, as namazi juaj krahasuar me namazin e tyre, as agjërimi juaj krahasuar me agjërimin e tyre —'">يقول: «يخرج قومٌ من أمتي يقرؤون القرآن ليس قراءتكم إلىٰ قراءتهم بشيء، ولا صلاتكم إلىٰ صلاتهم بشيء، ولا صيامكم إلىٰ صيامهم بشيء،</span> <span class="s hadith" data-sq="'lexojnë Kuranin duke menduar se është për ta, por ai është kundër tyre; namazi i tyre nuk u kalon qafën, dalin nga Islami siç del shigjeta nga gjahu;'">يقرؤون القرآن يحسبونه أنه لهم وهو عليهم، لا تجاوزُ صلاتُهم تراقيَهم، يمرقون من الإسلام كما يمرق السهم من الرَّمِيَّة،</span> <span class="s hadith" data-sq="'sikur ta dinte ushtria që i godet, çfarë u është caktuar në gjuhën e profetit të tyre, do të hiqnin dorë nga çdo punë tjetër.'">لو يعلم الجيش الذين يصيبونهم ما قُضِي لهم علىٰ لسان نبيهم، لنكلوا عن العمل»</span></p>
<p><span class="s" data-sq="Dhe nga Ebu Seidi, nga Pejgamberi ﷺ, në këtë hadith:">وعن أبي سعيد عن النبي ﷺ في هذا الحديث:</span> <span class="s hadith" data-sq="'I vrasin ithtarët e Islamit dhe i lënë adhuruesit e idhujve; sikur t'i arrij, do t'i vras siç u shkatërrua populli i Adit.'">«يقتلون أهل الإسلام ويدعون أهل الأوثان، لئن أدركتهم لأقتلنَّهم قتل عاد»</span> <span class="s" data-sq="Transmetim i përbashkët (Buhariu dhe Muslimi).">متفق عليه.</span></p>
<p><span class="s" data-sq="Në një transmetim të Muslimit:">وفي رواية لمسلم:</span> <span class="s hadith" data-sq="'Umeti im do të ndahet në dy grupe, dhe do të dalë mes tyre një grup i devijuar (marike); më i afërti prej tyre me të vërtetën do t'i vrasë ata.'">«تكون أمتي فرقتين، فتخرج من بينهما مارقةٌ تلي قتلَهم أولاهما بالحق»</span></p>
<p><span class="s" data-sq="Këta janë ata që i vrau Prijësi i Besimtarëve, Aliu, Allahu qoftë i kënaqur me të, kur doli grupi renegat mes banorëve të Irakut dhe Shamit, dhe quheshin Hururijët.">فهؤلاء الذين قتلهم أمير المؤمنين علي رضي الله عنه لما خرجت الفُرقة بين أهل العراق والشام، وكانوا يسمون: الحرورية=</span> <span class="s" data-sq="Pejgamberi ﷺ sqaroi se të dyja palët e ndara ishin nga umeti i tij, dhe se shokët e Aliut ishin më afër të vërtetës, dhe nuk nxiti përveçse për luftimin e atyre marikëve që dolën nga Islami, u ndanë nga xhemati, dhe e lejuan gjakun e pasurinë e myslimanëve të tjerë.">بيَّن النبي ﷺ أن كلتا الطائفتين المفترقتين من أمته، وأن أصحاب علي أولىٰ بالحق، ولم يحرِّض إلا على قتال أولئك المارقين الذين خرجوا من الإسلام، وفارقوا الجماعة، واستحلُّوا دماءَ مَن سواهم من المسلمين وأموالهم.</span> <span class="s" data-sq="Dhe është vërtetuar me Librin, Sunetin dhe konsensusin e umetit se luftohet kushdo që del nga sheriati i Islamit, edhe nëse ka shqiptuar dy dëshmitë.">وثبت بالكتاب والسنة وإجماع الأمة أنه يُقاتَل من خرج عن شريعة الإسلام وإن تكلم بالشهادتين.</span></p>`}
,{html:`<p><span class="s" data-sq="Juristët kanë mospajtime rreth grupit rebel: nëse e lë sunetin e rregullt si dy rekatet e sabahut, a lejohet luftimi i tij? Ka dy mendime.">وقد اختلف الفقهاء في الطائفة الممتنعة، لو تركت السنة الراتبة كركعتي الفجر هل يجوز قتالها؟ على قولين.</span></p>
<p><span class="s" data-sq="Sa i përket obligimeve dhe ndalesave të qarta e të përhapura, luftohet për to me konsensus,">فأما الواجبات والمحرمات الظاهرة المستفيضة، فيُقاتَل عليها بالاتفاق،</span> <span class="s" data-sq="derisa të angazhohen të kryejnë namazet e detyrueshme, të japin zekatin, të agjërojnë muajin e Ramazanit, të shkojnë në haxh,">حتىٰ يلتزموا أن يقيموا الصلوات المكتوبات، ويؤدوا الزكاة، ويصوموا شهر رمضان، ويحجوا البيت،</span> <span class="s" data-sq="dhe të angazhohen të lënë haramet: si martesa me të ndaluarat, ngrënia e gjërave të ndyra, agresioni ndaj myslimanëve në jetë e pasuri, e të ngjashme.">ويلتزموا ترك المحرمات؛ من نكاح المحرمات، وأكل الخبائث، والاعتداء علىٰ المسلمين في النفوس والأموال، ونحو ذلك.</span></p>
<p><span class="s" data-sq="Luftimi i këtyre është obligim fillimisht pas arritjes së thirrjes së Pejgamberit ﷺ tek ta për atë që luftohen. E nëse ata fillojnë sulmin ndaj myslimanëve, luftimi i tyre përforcohet edhe më, siç e përmendëm për luftimin e agresionëve grabitës të rrugës, madje edhe më.">وقتال هؤلاء واجب ابتداءً بعد بلوغ دعوة النبي ﷺ إليهم بما يُقاتَلون عليه، فأما إذا بدؤوا المسلمين فيتأكد قتالهم، كما ذكرناه في قتال الممتنعين من المعتدين قطاع الطريق وأبلغ.</span></p>
<p><span class="s" data-sq="Xhihadi i obliguar kundër jobesimtarëve dhe atyre që refuzojnë disa ligje — si refuzuesit e zekatit, havarixhët e të ngjashmit — është i detyrueshëm si nisëm ashtu edhe mbrojtës;">الجهاد الواجب للكفار والممتنعين عن بعض الشرائع، كمانعي الزكاة والخوارج ونحوهم= يجب ابتداءً ودفعًا؛</span> <span class="s" data-sq="kur është nisëm (ofenziv), ai është farz kifaje — nëse e kryejnë ata që mjaftojnë, bie obligimi nga të tjerët, ndërsa vlera i mbetet atij që e kryen,">فإذا كان ابتداءً فهو فرض على الكفاية إذا قام به من يكفيه سقط الفرض عن الباقين، وكان الفضل لمن قام به،</span> <span class="s" data-sq="siç ka thënë i Lartësuari:">كما قال تعالىٰ:</span> <span class="s quran" data-sq="Nuk janë të barabartë ata besimtarë që rrinë (nuk shkuan në luftë), pos që nuk janë të paaftë (të sëmurë a invalidë), me ata që luftojnë në rrugën e All-llahut [en-Nisa: 95]">﴿لَّا يَسْتَوِي الْقَاعِدُونَ مِنَ الْمُؤْمِنِينَ غَيْرُ أُولِي الضَّرَرِ وَالْمُجَاهِدُونَ فِي سَبِيلِ اللَّهِ﴾</span></p>`}
,{html:`<p><span class="s" data-sq="E kur armiku synon sulmin ndaj myslimanëve, mbrojtja bëhet obligim për të gjithë të synuarit dhe për të tjerët që t'i ndihmojnë,">فأما إذا أراد العدو الهجوم علىٰ المسلمين، فإنه يصير دفعه واجبًا علىٰ المقصودين كلهم، وعلىٰ غير المقصودين لإعانتهم،</span> <span class="s" data-sq="siç ka thënë i Lartësuari:">كما قال تعالىٰ:</span> <span class="s quran" data-sq="E nëse ata ju kërkojnë ndihmë për çështje të fesë, ju jeni të obliguar t'i ndihmoni [el-Enfal: 72]">﴿وَإِنِ اسْتَنصَرُوكُمْ فِي الدِّينِ فَعَلَيْكُمُ النَّصْرُ﴾</span> <span class="s" data-sq="dhe siç urdhëroi Pejgamberi ﷺ ndihmën e myslimanit, qoftë burri prej ushtarëve profesionistë apo jo.">وكما أمر النبي ﷺ بنصر المسلم، وسواء كان الرجل من المرتزقة للقتال أو لم يكن.</span></p>
<p><span class="s" data-sq="Kjo është e detyrueshme sipas mundësisë për çdo njeri me veten e tij dhe pasurinë, me pak a shumë, në këmbë a hipur,">وهذا يجب بحسب الإمكان علىٰ كل أحد بنفسه وماله، مع القلة والكثرة، والمشي والركوب،</span> <span class="s" data-sq="ashtu siç myslimanët kur i sulmoi armiku në vitin e Hendekut — Allahu nuk lejoi askënd ta braktiste, ndryshe nga xhihadi ofenziv ku i ndau në ata që rrinë e ata që dalin — madje qortoi ata që kërkonin leje nga Pejgamberi ﷺ:">كما كان المسلمون لما قَصَدَهم العدوُّ عام الخندق لم يأذن الله في تركه لأحد، كما أذن في الجهاد الذي قسمهم فيه إلىٰ قاعد وخارج، بل ذمَّ الذين يستأذنون النبي ﷺ</span> <span class="s quran" data-sq="...thonin: 'Shtëpitë tona janë të pambrojtura!' Po ato nuk ishin të pambrojtura, ata vetëm dëshironin të ikin. [el-Ahzab: 13]">﴿يَقُولُونَ إِنَّ بُيُوتَنَا عَوْرَةٌ وَمَا هِيَ بِعَوْرَةٍ ۖ إِن يُرِيدُونَ إِلَّا فِرَارًا﴾</span></p>
<p><span class="s" data-sq="Ky është mbrojtje e fesë, nderit dhe jetëve, dhe është luftë domosdoshmërie; ndërsa ai tjetri (ofenzivi) është luftë zgjedhjeje për shtimin e fesë, lartësimin e saj dhe frikësimin e armikut, si ekspedita e Tebukut e të ngjashme.">فهذا دَفْعٌ عن الدين والحُرمة والأنفس، وهو قتال اضطرار، وذلك قتال اختيار للزيادة في الدين وإعلائه وإرهاب العدو، كغزاة تبوك ونحوها.</span></p>
<p><span class="s" data-sq="Ky lloj ndëshkimi është për grupet rebele (mumteni'a).">فهذا النوع من العقوبة هو للطوائف الممتنعة.</span></p>
<p><span class="s" data-sq="Sa i përket jo-rebelëve nga banorët e vendeve islame e të ngjashmit, është obligim t'u imponohen detyrimet që janë pesë shtyllat e Islamit, si dhe detyrime të tjera si kryerja e amaneteve dhe përmbushja e marrëveshjeve në transaksione e gjëra të tjera.">فأما غير الممتنعين من أهل ديار الإسلام ونحوهم، فيجب إلزامهم بالواجبات التي هي مباني الإسلام الخمس، وغيرها من أداء الأمانات والوفاء بالعهود في المعاملات وغير ذلك.</span></p>
<p><span class="s" data-sq="Kush nuk falet nga të gjithë njerëzit — burra e gra — ai urdhërohet">فمن كان لا يصلي من جميع الناس: رجالهم ونسائهم، فإنه يؤمر</span></p>`}
,{html:`<p><span class="s" data-sq="me namaz; nëse refuzon, ndëshkohet derisa të falet me konsensus të dijetarëve. Shumica e tyre e obligojnë vrasjen e tij nëse nuk falet — i kërkohet pendim, nëse falet mirë, përndryshe vritet.">بالصلاة، فإن امتنع عُوقب حتىٰ يصلي بإجماع العلماء. وأكثرهم يوجبون قتله إذا لم يصل، فيُستتاب فإن صلىٰ وإلا قُتِل.</span> <span class="s" data-sq="A vritet si kafir apo si murtedd apo si fasik? Ka dy mendime të njohura në medhhebin e Ahmedit e të tjerëve; transmetimi nga shumica e selefëve nënkupton kufrin e tij.">وهل يُقتل كافرًا أو مرتدًّا أو فاسقًا؟ على قولين مشهورين في مذهب أحمد وغيره، والمنقول عن أكثر السلف يقتضي كفره،</span> <span class="s" data-sq="Kjo kur ai e pranon obligueshmërinë; sa i përket atij që mohon obligueshmërinë, ai është kafir me konsensus.">وهذا مع الإقرار بالوجوب، فأما من جَحَدَ الوجوب فهو كافر بالاتفاق.</span></p>
<p><span class="s" data-sq="Madje obligohet mbi kujdestarët ta urdhërojnë fëmijën për namaz kur mbush shtatë vjeç, dhe ta godasin për të në dhjetë, siç urdhëroi Pejgamberi ﷺ duke thënë:">بل يجب على الأولياء أن يأمروا الصبي بالصلاة إذا بلغ سبعًا، ويضربوه عليها لعشر، كما أمر النبي ﷺ قال:</span> <span class="s hadith" data-sq="'Urdhërojini për namaz në shtatë vjeç, goditini për të në dhjetë, dhe ndajini në shtretër.'">«مُروهم بالصلاة لسبع، واضربوهم عليها لعشر، وفرِّقوا بينهم في المضاجع»</span> <span class="s" data-sq="Po ashtu edhe çfarë i nevojitet namazit nga pastrimi i detyrueshëm e të ngjashme.">وكذلك ما تحتاج إليه الصلاة من الطهارة الواجبة ونحوها.</span></p>`}
,{html:`<p><span class="s" data-sq="Dhe nga plotësia e kësaj: përkujdesja ndaj xhamive të myslimanëve dhe imamëve të tyre, dhe urdhërimi i tyre të falin namazin e njerëzve siç fali i Dërguari i Allahut ﷺ, ku tha:">ومن تمام ذلك: تعاهُد مساجد المسلمين وأئمتهم، وأمرهم بأن يصلوا بهم صلاةَ رسول الله ﷺ حيث قال:</span> <span class="s hadith" data-sq="'Faluni siç më keni parë duke u falur.'">«صلُّوا كما رأيتموني أُصلِّي»</span> <span class="s" data-sq="Transmeton Buhariu.">رواه البخاري.</span></p>
<p><span class="s" data-sq="Dhe u fal njëherë me shokët e tij mbi skajin e minberit e tha:">وصلىٰ مرة بأصحابه على طرف المنبر فقال:</span> <span class="s hadith" data-sq="'E bëra këtë vetëm që të më merrni si shembull dhe ta mësoni namazin tim.'">«إنما فعلت هذا لتأتمُّوا بي ولتعلموا صلاتي»</span></p>
<p><span class="s" data-sq="Imami i njerëzve në namaz e gjetkë duhet të kujdeset për ta, e të mos u humbasë atë që ka të bëjë me veprimin e tij nga plotësia e fesë së tyre; madje imami i namazit duhet të falë me ta namaz të plotë, e të mos mjaftohet me atë që lejohet për individin vetëm sa për kryerjen minimale, përveçse me arsye.">وعلى إمام الناس في الصلاة وغيرها أن ينظر لهم، فلا يُفوِّتهم ما يتعلق بفعله من كمال دينهم، بل على إمام الصلاة أن يصلي بهم صلاة كاملة، ولا يقتصر على ما يجوز لمنفردٍ الاقتصارُ عليه من قدر الإجزاء إلا لعذر.</span></p>
<p><span class="s" data-sq="Po ashtu edhe imami i tyre në haxh, si edhe komandanti i tyre në luftë. A nuk e sheh se përfaqësuesi dhe kujdestari në shit-blerje duhet të veprojë për të përfaqësuarin e kujdesurin në mënyrën më të mirë për pasurinë e tij, ndërsa në pasurinë e vet humbet çfarë të dojë? E çështja e fesë është më e rëndësishme. Juristët e kanë përmendur këtë kuptim.">وكذلك على إمامهم في الحج، وكذلك أميرهم في الحرب. ألا ترى أن الوكيل والوليَّ في البيع والشراء عليه أن يتصرف لموكله ولموليه على الوجه الأصلح له في ماله، وهو في مالِ نفسه يفوِّت نفسَه ما شاء، فأمرُ الدين أهمّ، وقد ذكر الفقهاء هذا المعنى.</span></p>
<p><span class="s" data-sq="Sa herë që udhëheqësit u kushtuan përmirësimit të fesë së njerëzve, u përmirësua feja dhe dynjaja e të dy palëve; përndryshe u trazuan punët mbi ta.">ومتى اهتمت الولاة بإصلاح دين الناس؛ صلح للطائفتين دينُهم ودنياهم، وإلا اضطربت الأمور عليهم.</span> <span class="s" data-sq="Thelbi i gjithë kësaj: qëllimi i mirë ndaj popullit, sinqeriteti i tërë fesë për Allahun, dhe mbështetja tek Ai. Sepse sinqeriteti dhe mbështetja janë tërësia e përmirësimit të elitës dhe masës, siç jemi urdhëruar të themi në namazin tonë:">وملاك ذلك كله: حسن النية للرعية، وإخلاص الدين كله لله، والتوكل عليه. فإن الإخلاصَ والتوكلَ جماعُ صلاح الخاصة والعامة، كما أمرنا أن نقول في صلاتنا:</span> <span class="s quran" data-sq="Vetëm Ty të adhurojmë dhe vetëm te Ti kërkojmë ndihmë! [el-Fatiha: 5]">﴿إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ﴾</span></p>`}
,{html:`<p><span class="s" data-sq="Është thënë se këto dy fjalë përmbledhin kuptimet e librave të zbritura nga qielli.">فإن هاتين الكلمتين قد قيل: إنهما تجمعان معاني الكتب المنزلة من السماء.</span></p>
<p><span class="s" data-sq="Dhe transmetohet se Pejgamberi ﷺ ishte njëherë në disa beteja e tha:">وقد روي أن النبي ﷺ كان مرةً في بعض مغازيه فقال:</span> <span class="s hadith" data-sq="'O Sundues i Ditës së Gjykimit, vetëm Ty të adhurojmë dhe vetëm te Ti kërkojmë ndihmë'">«يا مالك يوم الدين إياك نعبد وإياك نستعين»</span> <span class="s" data-sq="dhe kokat filluan të binin nga supet (armiqve).">فجعلت الرؤوس تندر عن كواهلها.</span></p>
<p><span class="s" data-sq="Dhe e ka përmendur këtë në shumë vende të librit të Tij, si fjala e Tij:">وقد ذكر ذلك في غير موضع من كتابه كقوله:</span> <span class="s quran" data-sq="Adhuroje Atë dhe mbështetu në Të [Hud: 123]">﴿فَاعْبُدْهُ وَتَوَكَّلْ عَلَيْهِ﴾</span> <span class="s" data-sq="dhe fjala e Tij, i Lartësuari:">وقوله تعالى:</span> <span class="s quran" data-sq="Atij iu kam mbështetur dhe tek Ai jam i drejtuar [Hud: 88]">﴿عَلَيْهِ تَوَكَّلْتُ وَإِلَيْهِ أُنِيبُ﴾</span> <span class="s" data-sq="Dhe Pejgamberi ﷺ kur therte kurbanin e tij thoshte:">وكان النبي ﷺ إذا ذبح أضحيته يقول:</span> <span class="s hadith" data-sq="'O Allah, prej Teje dhe për Ty.'">«اللهم منك ولك»</span></p>`}
,{html:`<p><span class="s" data-sq="Dhe ndihma më e madhe për udhëheqësin veçanërisht dhe për të tjerët përgjithësisht janë tri gjëra:">وأعظمُ عونٍ لولي الأمر خاصة ولغيره عامة ثلاثة أمور:</span></p>
<p><span class="s" data-sq="E para: sinqeriteti ndaj Allahut, dhe mbështetja tek Ai me lutje e gjëra të tjera; baza e kësaj është ruajtja e namazeve me zemër e trup.">أحدها: الإخلاص لله، والتوكل عليه بالدعاء وغيره، وأصلُ ذلك المحافظة على الصلوات بالقلب والبدن.</span></p>
<p><span class="s" data-sq="E dyta: bamirësia ndaj krijesave me dobi dhe pasuri, që është zekati.">والثاني: الإحسان إلى الخلق بالنفع والمال الذي هو الزكاة.</span></p>
<p><span class="s" data-sq="E treta: durimi ndaj lëndimit të krijesave e fatkeqësive të tjera; prandaj Allahu i bashkon namazin dhe durimin shpesh, si fjala e Tij në dy vende:">والثالث: الصبر على أذى الخلق وغيره من النوائب؛ ولهذا يجمع الله بين الصلاة والصبر كثيرًا، كقوله في موضعَين:</span> <span class="s quran" data-sq="Kërkoni ndihmë me durim e me namaz [el-Bekare: 45, 153]">﴿وَاسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ﴾</span></p>
<p><span class="s" data-sq="dhe si fjala e Tij, i Lartësuari:">وكقوله تعالى:</span> <span class="s quran" data-sq="Fal namazin në dy skajet e ditës, edhe në orët e afërta të natës. S'ka dyshim se veprat e mira i shlyejnë ato të këqijat. Kjo është këshillë për ata që pranojnë këshillën. Dhe bëhu i durueshëm, se All-llahu nuk humb shpërblimin e bamirësve [Hud: 114-115]">﴿وَأَقِمِ الصَّلَاةَ طَرَفَيِ النَّهَارِ وَزُلَفًا مِنَ اللَّيْلِ إِنَّ الْحَسَنَاتِ يُذْهِبْنَ السَّيِّئَاتِ ذَلِكَ ذِكْرَى لِلذَّاكِرِينَ ۝ وَاصْبِرْ فَإِنَّ اللَّهَ لَا يُضِيعُ أَجْرَ الْمُحْسِنِينَ﴾</span></p>
<p><span class="s" data-sq="dhe fjala e Tij:">وقوله تعالى:</span> <span class="s quran" data-sq="Bëhu i durueshëm ndaj asaj që thonë ata, madhëro me falënderim Zotin tënd para lindjes së diellit dhe para perëndimit të tij [Ta Ha: 130]">﴿فَاصْبِرْ عَلَى مَا يَقُولُونَ وَسَبِّحْ بِحَمْدِ رَبِّكَ قَبْلَ طُلُوعِ الشَّمْسِ وَقَبْلَ غُرُوبِهَا﴾</span> <span class="s" data-sq="dhe po ashtu në suren Kaf:">وكذلك في سورة ق:</span> <span class="s quran" data-sq="Bëhu i durueshëm ndaj asaj që thonë ata, madhëro me falënderim Zotin tënd para lindjes së diellit dhe para perëndimit [Kaf: 39]">﴿فَاصْبِرْ عَلَى مَا يَقُولُونَ وَسَبِّحْ بِحَمْدِ رَبِّكَ قَبْلَ طُلُوعِ الشَّمْسِ وَقَبْلَ الْغُرُوبِ﴾</span></p>
<p><span class="s" data-sq="dhe tha:">وقال:</span> <span class="s quran" data-sq="Ne e dimë mirë se ty të ngushtohet krahrori nga ajo çka thonë ata. E ti madhëroje me falënderim Zotin tënd e bëhu prej atyre që luten (falen) [el-Hixhr: 97-98]">﴿وَلَقَدْ نَعْلَمُ أَنَّكَ يَضِيقُ صَدْرُكَ بِمَا يَقُولُونَ ۝ فَسَبِّحْ بِحَمْدِ رَبِّكَ وَكُنْ مِنَ السَّاجِدِينَ﴾</span></p>
<p><span class="s" data-sq="Sa i përket bashkimit mes namazit dhe zekatit në Kuran, ai është shumë i shpeshtë; kështu kryerja e namazit">وأما قِرانه بين الصلاة والزكاة في القرآن فكثير جدًّا، فالقيام بالصلاة</span></p>`}
,{html:`<p><span class="s" data-sq="dhe zekatit e durimit e përmirëson gjendjen e udhëheqësit dhe popullit, kur njeriu kupton çfarë hyn në këto emra gjithëpërfshirës,">والزكاة والصبر يُصلح حالَ الراعي والرعية، إذا عرف الإنسانُ ما دخل في</span> <span class="s" data-sq="siç është emri i namazit: ku hyn përmendja e Allahut të Lartësuar, lutja ndaj Tij, leximi i librit të Tij, sinqeriteti i fesë për Të, dhe mbështetja tek Ai.">هذه الأسماء الجامعة، مثلما يدخل في اسم الصلاة؛ من ذكر الله تعالى، ودعائه، وتلاوة كتابه، وإخلاص الدين له، والتوكل عليه.</span> <span class="s" data-sq="Në zekatin: bamirësia ndaj krijesave me pasuri e dobi, si ndihma e të shtypurit, shpëtimi i të dëshpëruarit, dhe plotësimi i nevojës së nevojtarit.">وفي الزكاة؛ الإحسان إلى الخلق بالمال والنفع، من نصر المظلوم، وإغاثة الملهوف، وقضاء حاجة المحتاج.</span> <span class="s" data-sq="Në dy Sahihët, nga Pejgamberi ﷺ, se ai tha:">ففي «الصحيحين» عن النبي ﷺ أنه قال:</span> <span class="s hadith" data-sq="'Çdo vepër e mirë është sadaka (lëmoshë).'">«كلُّ معروفٍ صدقة»</span></p>
<p><span class="s" data-sq="Dhe hyn në të çdo bamirësi, qoftë edhe me fytyrë të hapur e fjalë të mirë. Në dy Sahihët, nga Adij ibn Hatimi, thotë: I Dërguari i Allahut ﷺ tha:">ويدخل فيه كل إحسان ولو ببسط الوجه والكلمة الطيبة، ففي «الصحيحين» عن عدي بن حاتم قال: قال رسول الله ﷺ:</span> <span class="s hadith" data-sq="'Nuk ka asnjërin prej jush përveçse do t'i flasë Zoti i tij, pa perde mes tyre as përkthyes; shikon djathtas e nuk sheh veçse diçka që ka ofruar, shikon majtas e nuk sheh veçse diçka që ka ofruar, shikon përpara e i del zjarri përballë — kush mundet prej jush të mbrohet nga zjarri qoftë edhe me gjysmë hurme le ta bëjë, e nëse nuk mundet, le ta bëjë me një fjalë të mirë.'">«ما منكم من أحدٍ إلا سيكلمه ربُّه ليس بينه وبينَه حاجب ولا ترجمان، فينظر أيمنَ منه فلا يرى إلا شيئًا قدَّمه، وينظر أشأمَ منه فلا يرى إلا شيئًا قدَّمه، وينظر أمامه فتستقبله النار، فمن استطاع منكم أن يتقي النار ولو بشقِّ تمرة فليفعل، فإن لم يستطع فبكلمة طيبة»</span></p>
<p><span class="s" data-sq="Dhe në Sunen, tha ﷺ:">وفي «السنن» قال ﷺ:</span> <span class="s hadith" data-sq="'Mos nënçmo asnjë vepër të mirë, qoftë edhe kur e takon vëllain tënd'">«لا تحقرنَّ من المعروف شيئًا، ولو أن تلقى أخاك</span></p>`}
,{html:`<p><span class="s hadith" data-sq="'me fytyrë të hapur, apo edhe kur zbraz nga kova jote në enën e atij që kërkon ujë.'">ووجهك إليه مُنبَسِط، ولو أن تُفرِغ من دلوك في إناء المُستَسقي»</span></p>
<p><span class="s" data-sq="Dhe tha ﷺ:">وقال ﷺ:</span> <span class="s hadith" data-sq="'Gjëja më e rëndë që vendoset në peshore është morali i mirë.'">«إن أثقل ما يوضع في الميزان الخُلُق الحَسَن»</span></p>
<p><span class="s" data-sq="Dhe transmetohet se ai i tha Umm Selemes:">وروي عنه أنه قال لأم سلمة:</span> <span class="s hadith" data-sq="'O Umm Seleme, morali i mirë ka marrë të mirën e dynjasë dhe ahiretit.'">«يا أم سلمة ذهبَ حُسْن الخلق بخير الدنيا والآخرة»</span></p>
<p><span class="s" data-sq="Ndërsa në durim hyn: durimi i lëndimit, frenimit i zemërimit, falja ndaj njerëzve, dhe kundërshtimi i">وفي الصبر: احتمال الأذى، وكظم الغيظ، والعفو عن الناس، ومخالفة</span></p>`}
,{html:`<p><span class="s" data-sq="epshit, dhe lënia e kryelartësisë e mendjemadhësisë; sepse durimi ndaj mirësisë është më i vështirë se durimi ndaj fatkeqësisë,">الهوى، وترك الأشَر والبَطَر، فإنَّ الصبرَ على السرّاء أشد من الصبر على الضرّاء،</span> <span class="s" data-sq="siç ka thënë i Madhërishmi:">كما قال سبحانه وتعالى:</span> <span class="s quran" data-sq="E nëse Ne i japim njeriut të shijojë mëshirë nga ana Jonë, e pastaj ia heqim atë, ai tërbohej dhe bëhet mosmirënjohës. E nëse i japim atij mirësi pasi e ka goditur e keqja, ai thotë: 'Shkuan të këqijat prej meje!' Ai gëzohet e mbahet me të madh. Përveç atyre që duruan dhe bënë vepra të mira, ata kanë falje dhe shpërblim të madh [Hud: 9-11]">﴿وَلَئِنْ أَذَقْنَا الْإِنسَانَ مِنَّا رَحْمَةً ثُمَّ نَزَعْنَاهَا مِنْهُ إِنَّهُ لَيَئُوسٌ كَفُورٌ ۝ وَلَئِنْ أَذَقْنَاهُ نَعْمَاءَ بَعْدَ ضَرَّاءَ مَسَّتْهُ لَيَقُولَنَّ ذَهَبَ السَّيِّئَاتُ عَنِّي إِنَّهُ لَفَرِحٌ فَخُورٌ ۝ إِلَّا الَّذِينَ صَبَرُوا وَعَمِلُوا الصَّالِحَاتِ أُولَٰئِكَ لَهُم مَّغْفِرَةٌ وَأَجْرٌ كَبِيرٌ﴾</span></p>
<p><span class="s" data-sq="dhe i tha profetit të Tij ﷺ:">وقال لنبيه ﷺ:</span> <span class="s quran" data-sq="Ti merre faljen, urdhëro për vepra të mira dhe largohu prej të padijtshmëve [el-A'raf: 199]">﴿خُذِ الْعَفْوَ وَأْمُرْ بِالْعُرْفِ وَأَعْرِضْ عَنِ الْجَاهِلِينَ﴾</span> <span class="s" data-sq="dhe tha i Lartësuari:">وقال تعالى:</span> <span class="s quran" data-sq="Shpejtoni në sigurimin e faljes prej Zotit tuaj dhe xhenetit, gjerësia e të cilit shtrihet sa qiejt e toka, e i cili u është përgatitur atyre që janë të devotshëm. Të cilët japin edhe kur janë në bollëk edhe kur janë në gjendje të vështirë, e mposhtin mllefin, ua falin njerëzve, e All-llahu i do bamirësit [Al Imran: 133-134]">﴿وَسَارِعُوا إِلَىٰ مَغْفِرَةٍ مِّن رَّبِّكُمْ وَجَنَّةٍ عَرْضُهَا السَّمَاوَاتُ وَالْأَرْضُ أُعِدَّتْ لِلْمُتَّقِينَ ۝ الَّذِينَ يُنفِقُونَ فِي السَّرَّاءِ وَالضَّرَّاءِ وَالْكَاظِمِينَ الْغَيْظَ وَالْعَافِينَ عَنِ النَّاسِ وَاللَّهُ يُحِبُّ الْمُحْسِنِينَ﴾</span></p>
<p><span class="s" data-sq="dhe tha i Lartësuari:">وقال تعالى:</span> <span class="s quran" data-sq="Nuk janë njësoj e mira dhe e keqja. Ktheje të keqen me të mirë, se atëherë ai me të cilin ke armiqësi bëhet si mik i afërt. Këtë nuk mund ta arrijë kush pos atyre që janë të durueshëm, e nuk mund ta arrijë kush pos atyre me vlerë të lartë. Në qoftë se ty të gjen ndonjë cytje prej djallit, kërko mbrojtje tek All-llahu, se Ai është dëgjuesi, i dijshmi [Fussilet: 34-36]">﴿وَلَا تَسْتَوِي الْحَسَنَةُ وَلَا السَّيِّئَةُ ادْفَعْ بِالَّتِي هِيَ أَحْسَنُ فَإِذَا الَّذِي بَيْنَكَ وَبَيْنَهُ عَدَاوَةٌ كَأَنَّهُ وَلِيٌّ حَمِيمٌ ۝ وَمَا يُلَقَّاهَا إِلَّا الَّذِينَ صَبَرُوا وَمَا يُلَقَّاهَا إِلَّا ذُو حَظٍّ عَظِيمٍ ۝ وَإِمَّا يَنزَغَنَّكَ مِنَ الشَّيْطَانِ نَزْغٌ فَاسْتَعِذْ بِاللَّهِ إِنَّهُ هُوَ السَّمِيعُ الْعَلِيمُ﴾</span></p>
<p><span class="s" data-sq="dhe tha i Lartësuari:">وقال تعالى:</span> <span class="s quran" data-sq="Ndëshkimi i së keqes bëhet me një të keqe në të njëjtën masë, e kush fal e përmirëson, shpërblimi i tij është te All-llahu. Ai nuk i do zullumqarët [esh-Shura: 40]">﴿وَجَزَاءُ سَيِّئَةٍ سَيِّئَةٌ مِّثْلُهَا فَمَنْ عَفَا وَأَصْلَحَ فَأَجْرُهُ عَلَى اللَّهِ إِنَّهُ لَا يُحِبُّ الظَّالِمِينَ﴾</span></p>
<p><span class="s" data-sq="Hasan el-Basriu ka thënë: Kur të jetë Dita e Kiametit do të thërrasë një thirrës nga brendësia e Arshit: A ka kush që shpërblimi i tij qëndron tek Allahu? Dhe nuk ngrihet askush përveç atij që fali dhe përmirësoi.">قال الحسن البصري: إذا كان يوم القيامة ينادي مناد من بطنان العرش، ألا ليقم من وقع أجره على الله، ولا يقوم إلا من عفا وأصلح.</span></p>`}
,{html:`<p><span class="s" data-sq="Dhe mirësia e qëllimit ndaj popullit nuk do të thotë t'u bësh atyre çfarë dëshirojnë e të lësh çfarë urrejnë; sepse Allahu i Lartësuar ka thënë:">وليس حُسْن النية للرعية والإحسان إليهم أن يفعلَ ما يهوونه ويترك ما يكرهونه، فقد قال الله تعالى:</span> <span class="s quran" data-sq="E sikur e vërteta t'u përshtatej dëshirave të tyre, do të shkatërroheshin qiejt, toka, dhe gjithçka në to [el-Mu'minun: 71]">﴿وَلَوِ اتَّبَعَ الْحَقُّ أَهْوَاءَهُمْ لَفَسَدَتِ السَّمَاوَاتُ وَالْأَرْضُ وَمَن فِيهِنَّ﴾</span> <span class="s" data-sq="dhe i tha i Lartësuari sahabëve:">وقال تعالى للصحابة:</span> <span class="s quran" data-sq="Ta dini se ndër ju është i dërguari i All-llahut. Sikur ai t'ju dëgjonte juve në shumicën e çështjeve, do të binit në vështirësi [el-Huxhurat: 7]">﴿وَاعْلَمُوا أَنَّ فِيكُمْ رَسُولَ اللَّهِ لَوْ يُطِيعُكُمْ فِي كَثِيرٍ مِنَ الْأَمْرِ لَعَنِتُّمْ﴾</span> <span class="s" data-sq="Mirësia ndaj tyre është të bësh atë që u sjell dobi në fe e dynja, edhe sikur e urrejnë disa, por duhet t'u sillen me butësi në atë që u sjell dobi e e urrejnë.">وإنما الإحسان إليهم فعل ما ينفعهم في الدين والدنيا، ولو كرهه من كرهه، لكن ينبغي له أن يرفق بهم فيما ينفعهم ويكرهونه،</span> <span class="s" data-sq="sepse në Sahih, nga Pejgamberi ﷺ se ai tha:">ففي «الصحيح» عن النبي ﷺ أنه قال:</span> <span class="s hadith" data-sq="'Butësia nuk gjendet në diçka veçse e zbukuron, dhe dhuna nuk gjendet në diçka veçse e shëmton.'">«ما كان الرفق في شيء إلا زانه، ولا كان العنف في شيء إلا شانه»</span> <span class="s" data-sq="Dhe tha:">وقال:</span> <span class="s hadith" data-sq="'Allahu është i butë dhe e do butësinë, dhe jep për butësinë atë që nuk jep për dhunë.'">«إن الله رفيق يحبُّ الرفق، ويعطي على الرفق ما لا يعطي على العنف»</span></p>
<p><span class="s" data-sq="Umer ibn Abdulazizi, Allahu qoftë i kënaqur me të, thoshte: Pasha Allahun, unë dua t'u nxjerr atyre hidhësinë e së vërtetës, por kam frikë se do të largohen prej saj; prandaj duroj derisa të vijë ëmbëlsira e dynjasë, e nxjerr bashkë me të — kur largohen nga kjo, qetësohen me atë.">وكان عمر بن عبد العزيز رضي الله عنه يقول: والله إني أريد أن أخرج لهم المُرَّة من الحق فأخاف أن ينفروا عنها، فأصبر حتى تجيء الحلوةُ من الدنيا، فأخرجها معها، فإذا نفروا لهذه سكنوا لهذه.</span></p>
<p><span class="s" data-sq="Po ashtu Pejgamberi ﷺ kur i vinte dikush me nevojë nuk e kthente mbrapsht — edhe pse vetë ishte nevojtar — përveçse me plotësimin e nevojës ose me fjalë të mirë.">وهكذا كان النبي ﷺ إذا أتاه طالب حاجة لم يردَّه ـ وكان محتاجًا ـ إلا بها أو بميسورٍ من القول.</span></p>`}
,{html:`<p><span class="s" data-sq="Njëherë disa të afërmit e tij i kërkuan ta emërojnë mbi sadakat dhe t'i furnizojë prej tyre, por ai tha:">وسأله مرةً بعضُ أقاربه أن يوليه على الصدقات ويرزقه منها فقال:</span> <span class="s hadith" data-sq="'Sadakaja nuk lejohet për Muhamedin as për familjen e Muhamedit.'">«إن الصدقة لا تحلُّ لمحمد ولا لآل محمد»</span> <span class="s" data-sq="I ndaloi ata prej saj dhe i kompensoi nga fej'i (preja e luftës).">فمنعهم إياها وعوَّضهم من الفيء.</span></p>
<p><span class="s" data-sq="Dhe u gjykuan tek ai Aliu, Zejdi dhe Xhaferi, Allahu qoftë i kënaqur me ta, për bijën e Hamzait; ai nuk ia dha asnjërit prej tyre, por ia dha hallës së saj. Pastaj ia qetësoi zemrën secilit me një fjalë të mirë:">وتحاكم إليه عليٌّ وزيدٌ وجعفر رضي الله عنهم في ابنة حمزة، فلم يقض بها لواحد منهم ولكن قضى بها لخالتها، ثم إنه طيَّب قلبَ كلٍّ واحد منهم بكلمة حسنة،</span> <span class="s" data-sq="i tha Aliut:">فقال لعلي:</span> <span class="s hadith" data-sq="'Ti je prej meje dhe unë prej teje.'">«أنت منِّي وأنا منك»</span> <span class="s" data-sq="i tha Xhaferit:">وقال لجعفر:</span> <span class="s hadith" data-sq="'Ti i ngjason pamjes dhe moralit tim.'">«أشبهتَ خَلقي وخُلقي»</span> <span class="s" data-sq="dhe i tha Zejdit:">وقال لزيد:</span> <span class="s hadith" data-sq="'Ti je vëllai ynë dhe miku ynë.'">«أنت أخونا ومولانا»</span></p>
<p><span class="s" data-sq="Kështu duhet të veprojë udhëheqësi në ndarjen dhe gjykimin e tij; sepse njerëzit gjithmonë i kërkojnë udhëheqësit atë që nuk duhet dhënë — si pozita, pasuri, përfitime, padrejtësi, ndërmjetësim në kufij, etj. — andaj ai i kompenson nga anë tjetër nëse mundet, ose i kthen me fjalë të mirë pa pasur nevojë të ashpërsohet, sepse kthimi i lypësit e lëndon,">فهكذا ينبغي لوليِّ الأمر في قَسْمه وحكمه، فإن الناس دائمًا يسألون وليَّ الأمر ما لا يصلح بَذْله من الولايات، والأموال، والمنافع، والجور، والشفاعة في الحدود، وغير ذلك؛ فيعوِّضهم من جهةٍ أخرى إن أمكن، أو يردّهم بميسور من القول ما لم يحتج إلى الإغلاظ، فإنَّ ردَّ السائل يؤلمُه،</span> <span class="s" data-sq="veçanërisht atë që ka nevojë ta afrosh; dhe Allahu i Lartësuar ka thënë:">خصوصًا من يُحتاج إلى تأليفه، وقد قال تعالى:</span> <span class="s quran" data-sq="E lypësin mos e përzë! [ed-Duha: 10]">﴿وَأَمَّا السَّائِلَ فَلَا تَنْهَرْ﴾</span> <span class="s" data-sq="dhe tha i Lartësuari:">وقال تعالى:</span> <span class="s quran" data-sq="Jepi çdo të afërmi të drejtën që i takon, edhe të varfërit, edhe udhëtarit, e mos shpenzo tepër [el-Isra: 26]">﴿وَآتِ ذَا الْقُرْبَىٰ حَقَّهُ وَالْمِسْكِينَ وَابْنَ السَّبِيلِ وَلَا</span></p>`}
,{html:`<p><span class="s quran" data-sq="Shpenzuesit janë vëllezër të djajve, e djalli është mohues ndaj Zotit të vet. Në qoftë se ti nuk u jep atyre duke shpresuar në mëshirën e Zotit tënd, atëherë thuaju atyre fjalë të buta [el-Isra: 26-28]">تُبَذِّرْ تَبْذِيرًا ۝ إِنَّ الْمُبَذِّرِينَ كَانُوا إِخْوَانَ الشَّيَاطِينِ وَكَانَ الشَّيْطَانُ لِرَبِّهِ كَفُورًا ۝ وَإِمَّا تُعْرِضَنَّ عَنْهُمُ ابْتِغَاءَ رَحْمَةٍ مِّن رَّبِّكَ تَرْجُوهَا فَقُل لَّهُمْ قَوْلًا مَّيْسُورًا﴾</span></p>
<p><span class="s" data-sq="Dhe kur gjykon mbi dikë, ai mund të lëndohet; nëse ia qetëson shpirtin me atë që i shërben nga fjala dhe vepra, kjo është plotësia e politikës — si ilaçi i ëmbël që mjeku ia jep të sëmurit për t'ia lehtësuar barin e hidhur.">وإذا حكم على شخص فإنه قد يتأذَّى، فإذا طيَّب نفسَه بما يصلح من القول والعمل؛ كان ذلك تمامَ السياسة، وهو نظيرُ ما يعطيه الطبيبُ للمريض من الطيِّب الذي يُسَوِّغ الدواءَ الكريه،</span> <span class="s" data-sq="dhe Allahu i Lartësuar i tha Musait ﷺ kur e dërgoi tek Faraoni:">وقد قال الله تعالى لموسى ﷺ لما أرسله إلى فرعون:</span> <span class="s quran" data-sq="Flitini atij fjalë të buta, ndoshta ai mendohet a frikësohet [Ta Ha: 44]">﴿فَقُولَا لَهُ قَوْلًا لَّيِّنًا لَّعَلَّهُ يَتَذَكَّرُ أَوْ يَخْشَىٰ﴾</span></p>
<p><span class="s" data-sq="Dhe Pejgamberi ﷺ u tha Muadhit dhe Ebu Musait — kur i dërgoi në Jemen —:">وقال النبي ﷺ لمعاذٍ وأبي موسى ـ لما بعثهما إلى اليمن ـ:</span> <span class="s hadith" data-sq="'Lehtësoni e mos vështirësoni, përgëzoni e mos largoni, bashkëpunoni e mos u përçani.'">«يسِّرا ولا تُعسِّرا، وبشِّرا ولا تُنفِّرا، وتطاوعا ولا تختلفا»</span></p>
<p><span class="s" data-sq="Dhe njëherë një beduin urinoi në xhami, shokët e tij u ngritën kundër tij, por ai tha: 'Mos e ndërprisni!' — pastaj urdhëroi të hidhet një kovë ujë mbi të, dhe tha:">وبال مرة أعرابيٌّ في المسجد فقام أصحابه إليه، فقال: «لا تُزرِموه» أي لا تقطعوا عليه بوله، ثم أمر بدلو من ماء فصُبَّ عليه، وقال:</span> <span class="s hadith" data-sq="'Ju jeni dërguar lehtësues e nuk jeni dërguar vështirësues.'">«إنما بُعِثتم مُيَسِّرين ولم تُبعَثوا مُعَسِّرين»</span> <span class="s" data-sq="Të dy hadithet janë në dy Sahihët.">والحديثان في «الصحيحين».</span></p>`}
,{html:`<p><span class="s" data-sq="Këtë e ka nevojë njeriu në qeverisjen e vetes, familjes dhe popullit të tij, sepse shpirtrat nuk e pranojnë të vërtetën veçse me atë që ndihmohen nga kënaqësitë e tyre ndaj të cilave kanë nevojë, dhe kështu ato kënaqësi bëhen adhurim ndaj Allahut dhe bindje ndaj Tij me nijetin e mirë.">وهذا يحتاج إليه الرجل في سياسة نفسه وأهل بيته ورعيته، فإنَّ النفوس لا تقبل الحقَّ إلا بما تستعين به من حظوظها التي هي محتاجة إليها، فتكون تلك الحظوظ عبادة لله وطاعة له مع النية الصالحة،</span> <span class="s" data-sq="A nuk e sheh se ngrënia, pirja dhe veshja janë obligim mbi njeriun? Madje edhe nëse detyrohet të hajë ngordhalën, e ka obligim ngrënien sipas shumicës së dijetarëve; nëse nuk ha derisa vdes, hyn në Zjarr, sepse adhurimet nuk kryhen veçse me këtë, dhe ajo pa të cilën nuk plotësohet obligimi, edhe ajo është obligim.">ألا ترى أن الأكل والشرب واللباس واجب على الإنسان؟ حتى لو اضطر إلى الميتة وجبَ عليه الأكل عند عامة العلماء، فإن لم يأكل حتى مات دخل النار؛ لأن العبادات لا تؤدَّى إلا بهذا، وما لا يتم الواجب إلا به فهو واجب.</span></p>
<p><span class="s" data-sq="Për këtë, shpenzimi i njeriut për veten dhe familjen e tij është i paraqitur ndaj tjetrit.">ولهذا كانت نفقةُ الإنسان على نفسه وأهله مقدَّمة على غيره،</span> <span class="s" data-sq="Në 'Sunen' transmetohet nga Ebu Hurejra r.a. se ka thënë: Tha i Dërguari i Allahut ﷺ:">ففي «السنن» عن أبي هريرة رضي الله عنه قال: قال رسول الله ﷺ:</span> <span class="s hadith" data-sq="«Jepni sadaka!» Një njeri tha: O i Dërguari i Allahut, kam një dinar. Tha: «Jepe sadaka për veten tënde.» Tha: Kam edhe një tjetër. Tha: «Jepe sadaka për gruan tënde.» Tha: Kam edhe një tjetër. Tha: «Jepe sadaka për fëmijën tënd.» Tha: Kam edhe një tjetër. Tha: «Jepe sadaka për shërbëtorin tënd.» Tha: Kam edhe një tjetër. Tha: «Ti e di më mirë.»">«تصدقوا»، فقال رجل: يا رسول الله، عندي دينار، فقال: «تصدق به على نفسك»، قال: عندي آخر، قال: «تصدق به على زوجتك»، قال: عندي آخر، قال: «تصدق به على ولدك»، قال: عندي آخر، قال: «تصدق به على خادمك»، قال: عندي آخر، قال: «أنت أبصر به».</span></p>
<p><span class="s" data-sq="Në 'Sahih Muslim' transmetohet nga Ebu Hurejra r.a. se ka thënë: Tha i Dërguari i Allahut">وفي «صحيح مسلم» عن أبي هريرة رضي الله عنه قال: قال رسول الله</span></p>`}
,{html:`<p><span class="s hadith" data-sq="ﷺ: «Një dinar që e shpenzove në rrugën e Allahut, një dinar që e shpenzove për lirimin e një robi, një dinar që e dhe sadaka për një të varfër, dhe një dinar që e shpenzove për familjen tënde — më i madhi në shpërblim është ai që e shpenzove për familjen tënde.»">ﷺ: «دينارٌ أنفقتَه في سبيل الله، ودينارٌ أنفقتَه في رقبة، ودينار تصدقت به على مسكين، ودينار أنفقته على أهلك، أعظمُها أجرًا الذي أنفقته على أهلك».</span></p>
<p><span class="s" data-sq="Në 'Sahih Muslim' transmetohet nga Ebu Umame se ka thënë: Tha i Dërguari i Allahut ﷺ:">وفي «صحيح مسلم» عن أبي أمامة قال: قال رسول الله ﷺ:</span> <span class="s hadith" data-sq="«O biri i Ademit, nëse e shpenzon tepricën është mirë për ty, nëse e mban është keq për ty, nuk qortohesh për mjaftueshmërinë. Fillo me atë që ke nën përkujdesje, dhe dora e lartë është më e mirë se dora e poshtme.»">«يا ابن آدم إنك إن تُنفِقِ الفضلَ خيرٌ لك، وإن تُمسكه شرٌّ لك، ولا تُلام على كفاف، وابدأ بمن تعول، واليد العُليا خير من اليد السفلى».</span></p>
<p><span class="s" data-sq="Ky është interpretimi i fjalës së Tij të Lartësuar:">وهذا تأويل قوله تعالى:</span> <span class="s quran" data-sq="Të pyesin ty se çfarë do të japin. Thuaj: «Tepricën!» [El-Bekare: 219]">﴿وَيَسْأَلُونَكَ مَاذَا يُنفِقُونَ قُلِ الْعَفْوَ﴾</span> <span class="s" data-sq="domethënë: tepricën. Kjo sepse shpenzimi i njeriut për veten dhe familjen e tij është farz ajn (obligim individual), ndryshe nga shpenzimi në luftë dhe te të varfrit, i cili në origjinë është ose farz kifaje (obligim kolektiv) ose i pëlqyeshëm.">أي: الفضل، وذلك لأن نفقة الرجل على نفسه وأهله فرضُ عين، بخلاف النفقة في الغزو وفي المساكين، فإنه في الأصل إما فرضٌ على الكفاية، وإما مستحبٌّ.</span> <span class="s" data-sq="Edhe nëse mund të bëhet individual kur nuk e kryen dikush tjetër, sepse ushqimi i të uriturit është obligim.">وإن كان قد يصير مُتعيِّنًا إذا لم يقم غيره به، فإن إطعام الجائع واجب،</span> <span class="s" data-sq="Për këtë ka ardhur në hadith:">ولهذا جاء في الحديث:</span> <span class="s hadith" data-sq="«Po të fliste të vërtetën lypsari, nuk do të shpëtonte kush e refuzon.»">«لو صَدَقَ السائلُ لما أفلحَ مَن ردَّه»</span> <span class="s" data-sq="E ka përmendur Imam Ahmedi, dhe ka përmendur se kur dihet sinqeriteti i tij, është obligim ta ushqesh.">ذكره الإمام أحمد، وذكر أنه إذا عُلِم صدقه وجبَ إطعامُه.</span></p>`}
,{html:`<p><span class="s" data-sq="Ebu Hatim el-Busti e ka transmetuar në 'Sahihun' e tij hadithin e Ebu Dherrit nga Profeti ﷺ, hadithin e gjatë i cili përmban lloje të ndryshme diturie dhe urtësie, ku thuhet:">وقد روى أبو حاتم البُستي في «صحيحه» حديث أبي ذر عن النبي ﷺ الحديث الطويل الذي فيه أنواع من العلم والحكمة، وفيه:</span> <span class="s hadith" data-sq="«Në urtësinë e familjes së Davudit ishte: Obligim mbi të mençurin është të ketë katër kohë: një kohë ku i lutet Zotit të tij, një kohë ku e llogarit veten e tij, një kohë ku veçohet me shokët e tij të cilët ia tregojnë të metat dhe i flasin për veten e tij, dhe një kohë ku veçohet me kënaqësinë e tij në atë që">«أنه كان في حكمة آل داود: حقٌّ على العاقل أن تكون له أربع ساعات: ساعة يناجي فيها ربه، وساعة يحاسب فيها نفسه، وساعة يخلو فيها بأصحابه الذين يخبرونه بعيوبه، ويحدثونه عن ذات نفسه، وساعة يخلو فيها بلذته فيما</span></p>`}
,{html:`<p><span class="s hadith" data-sq="e madhëron dhe e zbukuron; në këtë kohë ka ndihmë për ato kohët e tjera. I mençuri duhet të jetë njohës i kohës së tij, ruajtës i gjuhës së tij, i përqendruar në punën e tij.»">يَجِلّ ويَجْمُل، فإنَّ في هذه الساعة عونًا على تلك الساعات، وينبغي للعاقل أن يكون عارفًا بزمانه، حافظًا للسانه، مقبلًا على شأنه».</span> <span class="s" data-sq="Kështu tregoi se ka nevojë patjetër për kënaqësi të lejuara të bukura, sepse ato ndihmojnë në ato punë.">فبيَّن أنه لا بدَّ من اللذات المباحة الجميلة، فإنها تُعين على تلك الأمور.</span></p>
<p><span class="s" data-sq="Për këtë juristët islamikë kanë përmendur se drejtësia është: mirësia në fe dhe dinjiteti. Dinjitetin e kanë shpjeguar me përdorimin e asaj që e zbukuron dhe e stolisë, dhe shmangien e asaj që e ndytë dhe e turpëron.">ولهذا ذكر الفقهاء أن العدالة هي: الصلاح في الدين، والمروءة. وفسَّروا المروءة باستعمال ما يجمِّله ويزيِّنه، وتجنب ما يُدنِّسه ويُشينُه.</span></p>
<p><span class="s" data-sq="Ebu Derdaja thoshte: Unë e çlodh shpirtin tim me diçka nga argëtimi që të kem ndihmë për të vërtetën.">وكان أبو الدرداء يقول: إني لأستجمُّ نفسي بالشيء من الباطل لأستعين به على الحق.</span></p>
<p><span class="s" data-sq="Allahu, i pastër nga çdo e metë dhe i lartësuar, i krijoi epshet dhe kënaqësitë në origjinë për plotësimin e dobisë së krijesave; me to ata tërheqin atë që u bën dobi, siç e krijoi zemërimin që me të të largojnë atë që u bën dëm.">والله سبحانه وتعالى إنما خلق الشهوات في الأصل واللذات لتمام مصلحة الخلق، فإنه بذلك يجتلبون ما ينفعهم، كما خلق الغضب ليدفعون به ما يضرهم.</span> <span class="s" data-sq="Ndaloi prej tyre atë që dëmton marrja e tij, qortoi atë që kufizohet vetëm në to dhe merret me to duke lënë dobinë e fesë së tij, si dhe atë që tepron në to në lloj ose sasi, siç tha i Lartësuari:">وحرَّم منها ما يضر تناوله، وذمَّ من اقتصر عليها، واشتغل بها عن مصلحة دينه، ومن أسرف فيها في النوع أو القَدْر، كما قال تعالى:</span> <span class="s quran" data-sq="...e mos e teproni, se vërtet Ai nuk i do ata që e teprojnë [El-En'am: 141]">﴿وَلَا تُسْرِفُوا ۚ إِنَّهُ لَا يُحِبُّ الْمُسْرِفِينَ﴾</span> <span class="s" data-sq="dhe tha:">وقال:</span> <span class="s quran" data-sq="Edhe ata që kur shpenzojnë nuk e teprojnë e as nuk janë dorështrënguar, por mbajnë mesataren e duhur [El-Furkan: 67]">﴿وَالَّذِينَ إِذَا أَنفَقُوا لَمْ يُسْرِفُوا وَلَمْ يَقْتُرُوا وَكَانَ بَيْنَ ذَٰلِكَ قَوَامًا﴾</span> <span class="s" data-sq="dhe tha:">وقال:</span> <span class="s quran" data-sq="Shpërdoruesit janë vëllezër (shokë) të djajve, e djalli është mohues i madh i Zotit të vet [El-Isra: 27]">﴿إِنَّ الْمُبَذِّرِينَ كَانُوا إِخْوَانَ الشَّيَاطِينِ وَكَانَ الشَّيْطَانُ لِرَبِّهِ كَفُورًا﴾</span></p>`}
,{html:`<p><span class="s" data-sq="Derisa Sheriati ndaloi sipas shumicës së dijetarëve shpërdoruesin që e shpenzon pasurinë në atë që nuk i bën dobi.">حتى حَجَرَت الشريعة عند الجمهور على المبذِّر الذي يصرف المال فيما لا ينفعه.</span></p>
<p><span class="s" data-sq="Qortoi gjithashtu atë që lë atë që ka nevojë prej tyre, derisa tha i Lartësuari:">وذمَّ أيضًا من ترك ما يحتاج إليه منها، حتى قال تعالى:</span> <span class="s quran" data-sq="O ju që besuat, mos i ndaloni ato të mira që All-llahu ua lejoi juve [El-Maide: 87]">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تُحَرِّمُوا طَيِّبَاتِ مَا أَحَلَّ اللَّهُ لَكُمْ﴾</span></p>
<p><span class="s" data-sq="Në 'Sahihajn' transmetohet nga Profeti ﷺ se kur mori vesh nga shokët e tij se njëri tha: Sa për mua, unë agjëroj e nuk ha iftar; tjetri tha: Sa për mua, unë falem natën e nuk fle; një tjetër tha: Sa për mua, unë nuk martohem me gra; dhe një tjetër tha: Sa për mua, unë nuk ha mish — Profeti ﷺ tha:">وفي «الصحيحين» عن النبي ﷺ أنه لما بلغه عن أصحابه أنه قال بعضهم: أمَّا أنا فأصوم لا أفطر، وقال الآخر: أما أنا فأقوم لا أنام، وقال آخر: أما أنا فلا أتزوج النساء، وقال آخر: أما أنا فلا آكل اللحم، فقال النبي ﷺ:</span> <span class="s hadith" data-sq="«Por unë agjëroj dhe ha iftar, falem dhe fle, martohem me gra dhe ha mish; kush largohet nga suneti im, nuk është prej meje.»">«لكني أصوم وأفطر، وأقوم وأنام، وأتزوج النساء، وآكل اللحم، فمن رغب عن سنتي فليس مني».</span></p>
<p><span class="s" data-sq="I ndaloi umetit të tij vaslin (lidhjen) në agjërim, dhe tha:">ونهى أمَّته عن الوصال في الصيام، وقال:</span> <span class="s hadith" data-sq="«Kush agjëron tërë kohën, as nuk ka agjëruar e as nuk ka ngrënë iftar.»">«من صامَ الدَّهرَ فلا صام ولا أفطر».</span> <span class="s" data-sq="Dhe tha:">وقال:</span> <span class="s hadith" data-sq="«Agjërimi më i mirë është agjërimi i Davudit: agjëronte një ditë e hante iftar një ditë, dhe nuk ikë kur përballej (me armikun).»">«أفضلُ الصيام صيامُ داود، كان يصوم يومًا ويفطر يومًا ولا يفرُّ إذا لاقى».</span></p>
<p><span class="s" data-sq="Qortoi ruhbanijen (jetën murgëshore) që qëndron në lënien e grave dhe mishit, siç e thonë injorantët kur lavdërojnë disa njerëz: Nuk u martua e nuk theri. Lavdërimi i kësaj lloj ruhbanije e cila">وذمَّ الرهبانية التي في ترك النساء واللحم، كما يقوله الجهال في مدح بعض الناس: ما نكح ولا ذبح. فإن مَدْح مثل هذا من الرهبانية التي</span></p>`}
,{html:`<p><span class="s" data-sq="e shpikën të krishterët, nuk është nga feja e Islamit, madje Profeti ﷺ tha:">ابتدعها النصارى ليست من دين الإسلام، بل قال النبي ﷺ:</span> <span class="s hadith" data-sq="«Çdo popull ka ruhbanijen e vet, dhe ruhbanija e umetit tim është xhihadi në rrugën e Allahut.»">«إن لكلِّ أمةٍ رهبانية ورهبانية أمتي الجهاد في سبيل الله».</span></p>
<p><span class="s" data-sq="E bëri nga veprat e mira atë që ndihmohet me të lejuarën e bukur për të vërtetën; për këtë tha Profeti ﷺ në hadithin e saktë:">وجعل من استعان بالمباح الجميل على الحق من الأعمال الصالحة؛ ولهذا قال النبي ﷺ في الحديث الصحيح:</span> <span class="s hadith" data-sq="«Në marrëdhëniet intime të njërit prej jush ka sadaka.» Thanë: A vjen njëri prej nesh te epshi i tij e ka shpërblim për këtë? Tha: «A e shihni, po ta vinte në haram, a do të kishte mëkat?» Thanë: Po. Tha: «Atëherë pse e llogaritni haramin e nuk e llogaritni hallallin?»">«في بُضْع أحدكم صدقة»، قالوا: أيأتي أحدُنا شهوتَه ويكون له أجر؟ قال: «أرأيتم لو وضعها في حرام أما كان يكون عليه وِزر؟» قالوا: بلى، وقال: «فلم تحتسبون بالحرام ولا تحتسبون بالحلال».</span></p>
<p><span class="s" data-sq="Transmeton Ahmedi në 'Musnedin' e tij dhe Ibn Huzejme në 'Sahihun' e tij nga Ibn Umeri, nga Profeti ﷺ se tha:">وروى أحمد في «مسنده» وابن خزيمة في «صحيحه» عن ابن عمر عن النبي ﷺ قال:</span> <span class="s hadith" data-sq="«Allahu do që të merren lehtësirat e Tij, siç urren që të bëhen mëkatet e Tij.»">«إن الله يحبُّ أن تُؤتَى رُخَصُه كما يكره أن تُؤتَى معصيته».</span></p>`}
,{html:`<p><span class="s" data-sq="Në 'Sahihajn' transmetohet nga Sa'd ibn Ebi Vekkasi se Profeti ﷺ i tha:">وفي «الصحيحين» عن سعد بن أبي وقاص أن النبي ﷺ قال له:</span> <span class="s hadith" data-sq="«Ti nuk shpenzon asnjë shpenzim me të cilin kërkon fytyrën e Allahut, veçse do të ngritesh me të në gradë e lartësi, deri edhe kafshatën që ia vë gruas tënde (në gojë).»">«إنك لم تنفق نفقةً تبتغي بها وجهَ الله، إلا ازددت بها درجة ورفعة، حتى اللقمة تضعها في امرأتك».</span></p>
<p><span class="s" data-sq="Tekstet për këtë janë të shumta; besimtari kur ka nijet, shpërblehet për shumicën e veprave të tij, dhe të lejuarat bëhen nga veprat e tij të mira për shkak të mirësisë së zemrës dhe nijetit të tij.">والنصوص في هذا كثيرة، فالمؤمن إذا كانت له نية أُثيب على عامة أفعاله، وكانت المباحات من صالح أعماله لصلاح قلبه ونيته،</span> <span class="s" data-sq="Ndërsa munafiku, për shkak të prishjes së zemrës dhe nijetit të tij, ndëshkohet për atë që shfaq nga format e adhurimeve dhe syfaqësisë.">والمنافقُ لفسادِ قلبه ونيته يُعاقَب على ما يُظهره من صُوَر العبادات ورياء،</span> <span class="s" data-sq="Në 'Sahihajn' transmetohet nga Profeti ﷺ se tha:">فإن في «الصحيحين» عن النبي ﷺ أنه قال:</span> <span class="s hadith" data-sq="«Vini re! Në trup ka një copë mishi: kur ajo është e mirë, i tërë trupi është i mirë, e kur ajo prishet, i tërë trupi prishet. Vini re, ajo është zemra!»">«ألا إنَّ في الجسد مُضغة إذا صلحت صلح لها سائرُ الجسد، وإذا فسدت فسد لها سائرُ الجسد، ألا وهي القلب».</span></p>
<h2><span class="s" data-sq="Kapitull">فصل</span></h2>
<p><span class="s" data-sq="Siç ndëshkimet u ligjëruan si thirrëse për kryerjen e obligimeve dhe lënien e harameve, gjithashtu u ligjërua çdo gjë që ndihmon në këtë; prandaj duhet lehtësuar rrugën e së mirës,">وكما أن العقوبات شُرِعَت داعيةً إلى فعل الواجبات، وترك المحرمات، فقد شُرِع أيضًا كلُّ ما يعين على ذلك، فينبغي تيسير طريق الخير</span></p>`}
,{html:`<p><span class="s" data-sq="bindjes, ndihmës në të dhe nxitjes për të me çdo mënyrë të mundshme, si p.sh. t'i japë fëmijës, familjes ose popullit të tij atë që i nxit për punë të mira, qoftë pasuri, lavdërim ose diçka tjetër.">والطاعة، والإعانة عليه والترغيب فيه بكل ممكن، مثل أن يبذل لولده أو أهله أو رعيته ما يُرَغِّبُهم في العمل الصالح من مال أو ثناء أو غيره.</span></p>
<p><span class="s" data-sq="Allahu i Lartësuar e dërgoi Muhamedin ﷺ përgëzues e paralajmërues, dhe ai i afronte njerëzit me dobi e pasuri tek Islami dhe ligjet e tij, lavdëronte atë që bënte mirë, siç lavdëroi shumë nga shokët e tij, lutej gjithashtu për atë që vinte me atë që meritonte lutjen, siç i tha Allahu i Lartësuar:">فإن الله تعالى بعث محمدًا ﷺ بشيرًا ونذيرًا، وكان يؤلف الناس بالنفع والمال على الإسلام وشرائعه، ويثني على من أحسن فيه، كما أثنى على غير واحد من أصحابه، ويدعو أيضًا لمن أتى بما يستحق الدعاء، كما قال الله تعالى له:</span> <span class="s quran" data-sq="Merr nga pasuria e tyre lëmoshë me të cilën i pastron ata dhe ua shton të mirat, dhe lutu për ta, se lutja jote është qetësim për ta [Et-Teube: 103]">﴿خُذْ مِنْ أَمْوَالِهِمْ صَدَقَةً تُطَهِّرُهُمْ وَتُزَكِّيهِم بِهَا وَصَلِّ عَلَيْهِمْ ۖ إِنَّ صَلَاتَكَ سَكَنٌ لَّهُمْ﴾</span> <span class="s" data-sq="Për këtë juristët thanë: Imami kur merr sadakanë duhet të lutet për atë që e dha, si p.sh. të thotë: Allahu të shpërbleftë për atë që dhe, të bekoftë në atë që të mbeti, dhe e bëftë pastrim për ty.">ولهذا قال الفقهاء: ينبغي للإمام إذا قبض الصدقة أن يدعو لمن أعطاها، مثل أن يقول: آجرك الله فيما أعطيت، وبارك لك فيما أبقيت، وجعله لك طهورًا.</span></p>
<p><span class="s" data-sq="Gjithashtu përmendja e virtyteve të veprave të mira, shpërblimit të tyre dhe dobisë së tyre në dynja e ahiret — Libri dhe Suneti janë plot me këtë — kjo është më e dobishme në realitet për atë që i përgjigjet, se sa frika vetëm nga ndëshkimi i dynjasë.">وكذلك أيضًا ذكر فضائل الأعمال الصالحة وثوابها ومنفعتها في الدنيا والآخرة، فإن الكتاب والسنة مملوءة من ذلك، وهذا أنفع في الحقيقة لمن استجاب له من الرهبة بالعقوبة الدنيوية فقط،</span> <span class="s" data-sq="Ndëshkimit të dynjasë i kalohet vetëm kur krijesat bëjnë padrejtësi duke u larguar nga kjo rrugë, siç tha Allahu i Lartësuar:">وإنما يُصار إلى العقوبة الدنيوية إذا ظلمَ الخلقُ بالنكول عن هذه الطريقة، كما قال الله تعالى:</span> <span class="s quran" data-sq="Ithtarët e librit mos i polemizoni ndryshe veçse ashtu si është më e mira, përveç atyre që bënë padrejtësi prej tyre [El-Ankebut: 46]">﴿وَلَا تُجَادِلُوا أَهْلَ الْكِتَابِ إِلَّا بِالَّتِي هِيَ أَحْسَنُ إِلَّا الَّذِينَ ظَلَمُوا مِنْهُمْ﴾</span></p>`}
,{html:`<p><span class="s" data-sq="Për hir të dëshirës në dobitë e fesë, u ligjërua gara me kuaj e deve, gjuajtja me shigjeta dhe marrja e çmimit në to, për shkak të nxitjes në përgatitjen e fuqisë dhe mbajtjen e kuajve për xhihad në rrugën e Allahut, derisa tha Profeti ﷺ, siç e transmetojnë autorët e Suneneve:">ولأجل الرغبة في مصالح الدين شُرِعت المسابقة بالخيل والإبل، والمناضلة بالسهام، وأخذ السَّبَق فيها؛ لما فيه من الترغيب في إعداد القوة، ورباط الخيل للجهاد في سبيل الله تعالى، حتى قال النبي ﷺ فيما رواه أهل السنن:</span> <span class="s hadith" data-sq="«Nuk ka çmim (gare) veçse në thundër (deve), thoi (kalë) ose shigjetë.»">«لا سَبَقَ إلا في خفٍّ أو حافرٍ أو نصلٍ»،</span> <span class="s" data-sq="Profeti ﷺ bënte gara kuajsh, ai dhe halifët e tij të drejtë, dhe nxirrnin çmimet nga arka e shtetit për fituesit, si dhe dhënia e atyre që u zbutet zemra (muellefe kulubuhum).">وكان النبي ﷺ يسبِّق بين الخيل هو وخلفاؤه الراشدون، ويخرجون الأسباق من بيت المال للسابقين، وكذلك إعطاء المؤلفة قلوبهم.</span></p>
<p><span class="s" data-sq="Është transmetuar:">وقد رُوي:</span> <span class="s hadith" data-sq="«Njeriu pranonte Islamin në fillim të ditës nga dëshira për dynjanë, por nuk vinte fundi i ditës pa qenë Islami më i dashur tek ai se gjithçka mbi të cilën lind dielli.»">«أنَّ الرجلَ كان يُسلِم أول النهار رغبة في الدنيا، فلا يجيء آخر النهار إلا والإسلام أحب إليه مما طلعت عليه الشمس».</span></p>
<p><span class="s" data-sq="Gjithashtu ligjëroi në të keqen e mëkatin mbylljen e burimeve të tij, bllokimin e rrugëve që çojnë tek ai, dhe largimin e asaj që çon tek ai kur nuk ka dobi mbizotëruese, siç ndaloi Profeti ﷺ">وكذلك شَرَع في الشرِّ والمعصية حَسْمَ مادته، وسدَّ ذريعته، ودفعَ ما يفضي إليه إذا لم يكن فيه مصلحة راجحة، مثل ما نهى عنه النبي ﷺ</span></p>`}
,{html:`<p><span class="s" data-sq="e tha:">فقال:</span> <span class="s hadith" data-sq="«Asnjë njeri të mos veçohet me një grua, sepse i treti i tyre është shejtani.»">«لا يخلونَّ رجل بامرأةٍ فإن ثالثهما الشيطان».</span></p>
<p><span class="s" data-sq="Dhe tha:">وقال:</span> <span class="s hadith" data-sq="«Nuk i lejohet gruas që beson në Allahun dhe Ditën e Fundit të udhëtojë dy ditë rrugë, veçse me bashkëshortin ose mahremin e saj.»">«لا يحلُّ لامرأة تؤمن بالله واليوم الآخر أن تسافر مسيرة يومين إلا ومعها زوج أو ذو محرم».</span> <span class="s" data-sq="Ndaloi veçimin me gruan e huaj dhe udhëtimin me të, sepse është rrugë drejt të keqes.">فنهى عن الخلوة بالأجنبية والسفر بها؛ لأنه ذريعة إلى الشر.</span></p>
<p><span class="s" data-sq="Transmetohet nga Sha'biu se delegacioni i Abd el-Kajsit kur erdhi tek Profeti ﷺ, në mesin e tyre ishte një djalë i bukur, dhe ai e uli pas shpinës së tij, dhe tha:">ورُوي عن الشعبي أن وفد عبد القيس لما قدموا على النبي ﷺ كان فيهم غلام ظاهر الوضاءة، فأجلَسه خلفَ ظهره، وقال:</span> <span class="s hadith" data-sq="«Mëkati i Davudit ishte vetëm shikimi.»">«إنما كانت خطيئة داود النظر».</span></p>
<p><span class="s" data-sq="Umer ibn el-Hattabi r.a. patrullonte natën në Medine dhe dëgjoi një grua që këndonte me vargje duke thënë:">وكان عمر بن الخطاب رضي الله عنه يعسُّ بالمدينة فسمع امرأةً تغنِّي بأبيات وتقول فيها:</span></p>
<p class="poetry"><span class="s" data-sq="A ka ndonjë rrugë drejt verës që ta pi, ose ndonjë rrugë drejt Nasr ibn Haxhaxhit?">هل من سبيلٍ إلى خمرٍ فأشربُها&#x2003;&#x2003;أم من سبيلِ إلى نصر بن حجاج</span></p>
<p><span class="s" data-sq="Hetoi për të dhe e gjeti djalosh të bukur, ia rroi kokën por u bë edhe më i bukur, dhe e dëboi në">ففتش عليه فوجده شابًّا حسنًا، فحلق رأسَه فازداد جمالًا، فنفاه إلى</span></p>`}
,{html:`<p><span class="s" data-sq="Basra, që të mos i sprovonte gratë.">البصرة لئلا يَفْتِن النساء.</span></p>
<p><span class="s" data-sq="Transmetohet prej tij se mori vesh se një njeri ulej me djem, dhe ndaloi shoqërimin e tij.">ورُوي عنه: أنه بلغه أن رجلًا يجلس إليه الصبيان فنهى عن مجالسته.</span></p>
<p><span class="s" data-sq="Kjo sepse Profeti ﷺ e dëboi muhannethin (të feminizuarin) që hynte tek gratë e tij, urdhëroi dëbimin e muhannethinëve nga Medina, dhe lejoi që të hynin ditën e xhuma për të pyetur njerëzit për atë që blejnë.">وهذا لأن النبي ﷺ نفى المخنث الذي كان يدخل على أزواجه، وأمر بنفي المخنثين من المدينة، وأذن أن يدخلوا يوم الجمعة ليسألوا الناس عما يبتاعون به،</span> <span class="s" data-sq="Juristët si Shafiu e Ahmedi e ndoqën këtë sunet, dhe thanë: Është vërtetuar nga Profeti ﷺ dëbimi i zinaqarit dhe dëbimi i muhannethi, megjithëse ai ﷺ">ونص على اتباع هذه السنة الفقهاء كالشافعي وأحمد، وقالوا: ثبت عن النبي ﷺ نَفْي الزاني ونَفْي المُخَنَّث، مع أنه ﷺ</span> <span class="s" data-sq="mallkoi muhannethinët nga meshkujt, dhe gratë që u ngjajnë meshkujve, [dhe shumica] e këtyre haditheve janë në Sahih. Nuk u mjaftua me mallkim derisa e dëboi, sepse ka dëm mbi gratë dhe mbi meshkujt.">لعن المخنثين من الرجال، والمتشبهات من النساء بالرجال، هذه الأحاديث في الصحيح. فلم يكتف باللعنة حتى نفاه؛ لأن فيه مضرة على النساء وعلى الرجال.</span></p>`}
,{html:`<p><span class="s" data-sq="Nëse ka nga fëmijët atë nga i cili frikohet sprovë mbi meshkujt ose gratë, kujdestari i tij ndalohet ta shfaqë pa nevojë, ose ta zbukurojë — veçanërisht ta zbulojë — dhe ta zhveshë në banjo, si dhe ta çojë në tubime argëtimi e këngësh, sepse kjo meriton ndëshkim.">فإذا كان من الصبيان من تخاف فتنته على الرجال أو النساء، مُنِعَ وليُّه من إظهاره لغير حاجة، أو تحسينه لاسيما تبريجه وتجريده في الحمامات، وإحضاره مجالس اللهو والأغاني، فإن هذا مما ينبغي التعزيرُ عليه.</span></p>
<p><span class="s" data-sq="Gjithashtu atij që shfaq paturpësi i ndalohet posedimi i djemve të rinj e të bukur, dhe ndahen nga njëri-tjetri edhe nëse nuk pranon ose nuk ka qëllim fëlliqësinë, sepse qëllimi është largimi i të keqes jo ndëshkimi i vepruesit — mjafton dëshmia e rrethanave, derisa janë pajtuar">وكذلك من ظهر منه الفجور يُمنَع من تملُّك الغلمان المُرْدان الصِّباح، ويُفَرَّق بينهما وإن لم يُقِر أو يعمد فيه بفجوره، فإن ما كان مقصوده إلى دفع المنكر لا عقوبة فاعله فيُكتفى فيه بالدلالة، حتى اتفق</span></p>`}
,{html:`<p><span class="s" data-sq="juristët se nëse një dëshmitar dëshmon para gjykatësit, dhe janë përhapur për të lloje fëlliqësish që e cënojnë dëshminë, nuk lejohet pranimi i dëshmisë së tij, por cënohet tek gjykatësi në bazë të përhapjes edhe nëse nuk e ka parë vetë.">الفقهاء على أنه لو شهد شاهد به عند الحاكم، وكان قد استفاض عنه نوع من أنواع الفسوق القادحة في الشهادة، فإنه لا يجوز قبول شهادته، بل يجرحه الجارح عند الحاكم بذلك بناءً على الاستفاضة وإن لم يره،</span> <span class="s" data-sq="Është vërtetuar se Profetit ﷺ i kaluan një xhenaze dhe e lavdëruan, ai tha:">فقد ثبت عن النبي ﷺ أنه مُرَّ عليه بجنازة فأثنوا عليها خيرًا فقال:</span> <span class="s hadith" data-sq="«U bë obligim, u bë obligim.»">«وجبت وجبت»،</span> <span class="s" data-sq="dhe i kaluan një xhenaze tjetër dhe e qortuan, tha:">ومُرَّ عليه بجنازة فأثنوا عليها شرًّا فقال:</span> <span class="s hadith" data-sq="«U bë obligim, u bë obligim.»">«وجبت وجبت»،</span> <span class="s" data-sq="e pyetën për këtë dhe tha:">فسألوه عن ذلك فقال:</span> <span class="s hadith" data-sq="«Kësaj xhenazeje i thate mirë, thashë: I u bë obligim Xheneti. Kësaj xhenazeje tjetër i thate keq, thashë: I u bë obligim Zjarri. Ju jeni dëshmitarët e Allahut në tokë.»">«هذه الجنازة أثنيتم عليها خيرًا فقلت: وجبت لها الجنة، وهذه الجنازة أثنيتم عليها شرًّا فقلت: وجبت لها النار، أنتم شهداء الله في الأرض».</span></p>
<p><span class="s" data-sq="Megjithëse në kohën e tij ishte një grua që bënte fëlliqësi, tha:">مع أنه كان في زمانه امرأة تفعل الفجور، فقال:</span> <span class="s hadith" data-sq="«Po të gurëzoja dikë pa dëshmi, do ta gurëzoja këtë.»">«لو كنتُ راجمًا أحدًا بغير بينة لرجمتُ هذه».</span> <span class="s" data-sq="Kështu në hadithin e saktë. Tregoi se ndëshkimet nuk zbatohen veçse me dëshmi.">هكذا في الحديث الصحيح. فبيَّن أن الحدود لا تقام إلا بالبينة.</span></p>
<p><span class="s" data-sq="Sa i përket kujdesit nga njeriu në dëshminë, besnikërinë e ngjashëm, atëherë mjafton dyshimi i arsyeshëm, siç tha Profeti ﷺ:">وأما الحذر من الرجل في شهادته وأمانته ونحو ذلك، فتكون المظنة، كما قال النبي ﷺ:</span> <span class="s hadith" data-sq="«Nuk pranohet dëshmia e tradhtarit e as e tradhtares, as e atij që ka inat ndaj vëllait, as dëshmia e shërbëtorit për familjen e shtëpisë.»">«لا تجوز شهادة خائن ولا خائنة، ولا ذي غِمْرٍ على أخيه ولا تجوز شهادة القانع لأهل البيت».</span></p>`}
,{html:`<p><span class="s" data-sq="Tha:">قال:</span> <span class="s hadith" data-sq="«Nuk pranohet dëshmia e të dyshuarit — domethënë të akuzuarit — në mbrojtje ose afërsi.»">«لا تجوز شهادة ظنين ـ أي متهم ـ في ولاء أو قرابة».</span></p>
<p><span class="s" data-sq="Përhapja është e mjaftueshme në këtë e edhe më pak se ajo, derisa mund të gjykohet njeriu nga shoqëria e tij, siç tha Ibn Mesudi: Gjykoni njerëzit sipas shoqërisë së tyre.">والاستفاضة كافية في ذلك وما هو دون الاستفاضة، حتى إنه يُستدل على الرجل بأقرانه، كما قال ابن مسعود: اعتبروا الناس بأخدانهم.</span> <span class="s" data-sq="Kjo sepse Profeti ﷺ tha:">وذلك لأن النبي ﷺ قال:</span> <span class="s hadith" data-sq="«Njeriu është në fenë e mikut të tij, prandaj le të shikojë secili prej jush kë shoqëron.»">«المرء على دين خليله فلينظر أحدُكم من يُخالِل».</span></p>
<p><span class="s" data-sq="Qëllimi i kësaj është largimi i të keqes së tij, si kujdesi nga armiku. Umeri ka thënë">فإن المقصود من هذا دفع شره، مثل الاحتراز من العدو. وقد قال عمر</span></p>`}
,{html:`<p><span class="s" data-sq="r.a.: Kini kujdes nga njerëzit me dyshim të keq. Nuk lejohet ndëshkimi i muslimanit me dyshim ndaj tij.">رضي الله عنه: احترسوا من الناس بسوء الظن. ولا تجوز عقوبة المسلم بسوء الظن به.</span></p>
<p><span class="s" data-sq="Për këtë, qeveritari dhe dijetari duhet të jetë njohës i së keqes, shkaqeve dhe shenjave të saj, si njohja e kufrit, fëlliqësisë dhe gjendjes së armikut në fenë dhe dynjanë e tyre, që të ruhet nga e keqja e kësaj.">لهذا ينبغي للوالي والعالم أن يكون خبيرًا بالشر وأسبابه وعلاماته، مثل الخبرة بالكفر والفسوق وأحوال العدو في دينهم ودنياهم؛ ليحترس من شرٍّ ذلك.</span></p>
<p><span class="s" data-sq="Nga dobitë më të mëdha ishte dërgimi i spiunëve — të cilët janë përgjuesit — tek armiku, dhe njohja e rrugës së kufrit, siç është transmetuar nga disa prej selefit se ka thënë: Hallkat e Islamit shkëputen një nga një kur rritet në Islam ai që nuk e njeh xhahilijetin.">وكان من أعظم المصالح: إزجاء العيون ـ الذين هم الجواسيس ـ إلى العدو، والمعرفة بطريق الكفر، كما قد ورد عن بعض السلف أنه قال: إنما تُنقض عُرى الإسلام عروةً عروةً إذا نشأ في الإسلام من لا يعرف الجاهلية.</span> <span class="s" data-sq="Kjo sepse ai që nuk i njeh sëmundjet e shkaqet e tyre mund të mashtrohet me shëndetin, e nuk ruhet nga shkaqet e sëmundjes ose vetë sëmundja; ndërsa ai që e njeh shkakun dhe shenjën e saj, përshtatet">وهذا لأن من لا يعرف الأمراض وأسبابها قد يغتر بالعافية، ولا يحترز من أسباب المرض أو ذاته، و[من] عرف سببه وعلامته فإنه يصلح</span></p>`}
,{html:`<p><span class="s" data-sq="për mjekun.">للطبيب.</span></p>
<p><span class="s" data-sq="Qeveritarët e dijetarët janë mjekët e krijesave, siç i shkroi Selmani Ebu Derdasë kur mori gjyqësinë: Më ka arritur se ke ndenjur mjek, ruaju mos vritë ndonjë musliman.">والولاة والعلماء أطبَّاءُ الخلق، كما كتب سلمان إلى أبي الدرداء لما تولي القضاء: بلغني أنك قعدت طبيبًا فإياك أن تقتل مسلمًا.</span></p>
<p><span class="s" data-sq="Umeri r.a. thoshte: Nuk jam mashtrues e nuk më mashtron mashtruesi.">وكان عمر رضي الله عنه يقول: لست بخبٍّ ولا يخدعني الخبُّ.</span></p>
<p><span class="s" data-sq="Thanë: Umeri ishte shumë i ndershëm për të mashtruar, dhe shumë i mençur për t'u mashtruar.">وقالوا: كان عمر أورع من أن يَخْدع، وأعقل من أن يُخْدع.</span></p>
<p><span class="s" data-sq="Shëndeti i zemrës i lavdëruar është shëndeti i saj nga sëmundjet, si dyshimet dhe moralet e këqija: nifaku, urrejtja, zilia, koprracia, frika, epshi i zinasë, mendjemadhësia e ngjashëm.">وسلامة القلب المحمودة: هي سلامته من الأمراض، كالشبهات والأخلاق الردية؛ من النفاق والغلِّ والحسد والبخل والجُبْن وشهوة الزِّنا والكِبر ونحو ذلك.</span></p>
<p><span class="s" data-sq="Sa i përket injorancës ndaj realiteteve, ajo nuk është e lavdërueshme në vetvete, sepse dituria është cilësi e përsosmërisë, dhe ajo që ka dobi është ose obligim ose e pëlqyeshme. Politika me mendim e përvojë është më e madhe se politika me trimëri e fuqi, dhe më e dobishme.">فأما الجهلُ بالحقائق فليس في نفسه محمودًا؛ إذ العلم صفة كمال، وما ينتفع به إما واجب وإما مستحب. والسياسةُ بالرأي والخبرة أعظم من السياسة بالشجاعة والقوة وأنفع.</span></p>
<p><span class="s" data-sq="Me këtë Allahu i ngritë gradat, siç tha në historinë e Jusufit a.s.:">وبذلك يرفع الله الدرجات، كما قال في خبر يوسف عليه السلام:</span></p>`}
,{html:`<p><span class="s quran" data-sq="Ne ngrisim në gradë atë që duam. Mbi secilin dijetar ka edhe më dijetar [Jusuf: 76]">﴿نَرْفَعُ دَرَجَاتٍ مَّن نَّشَاءُ وَفَوْقَ كُلِّ ذِي عِلْمٍ عَلِيمٌ﴾</span> <span class="s" data-sq="dhe tha për Dhulkarnejnin:">وقال في ذي القرنين:</span> <span class="s quran" data-sq="Dhe Ne i dhamë atij mundësi për çdo send [El-Kehf: 84]">﴿وَآتَيْنَاهُ مِن كُلِّ شَيْءٍ سَبَبًا﴾</span> <span class="s" data-sq="thanë: diturinë.">قالوا: علمًا.</span></p>
<p><span class="s" data-sq="Profeti ﷺ tha:">وقال النبي ﷺ:</span> <span class="s hadith" data-sq="«Lufta është mashtrim.»">«الحربُ خَدْعَة».</span> <span class="s" data-sq="Nga urtësia e poezisë, Ebu Tajjibi tha:">ومن حكمة الشعر عن أبي الطيب:</span></p>
<p class="poetry"><span class="s" data-sq="Mendimi para trimërisë së trimave — ai është i pari e ajo e dyta / Kur bashkohen për një shpirt, arrin çdo lartësi">الرأيُ قبل شجاعةِ الشُّجعان&#x2003;&#x2003;هو أولٌ وهي المحلُّ الثاني<br/>فإذا هما اجتمعا لنفس مَرَّةً&#x2003;&#x2003;بلغت من العلياء كلَّ مكان</span></p>
<p><span class="s" data-sq="Por qeveritari duhet patjetër të heshtë ndaj ndëshkimit për mëkatet që i bëjnë njerëzit e që nuk dëmtojnë veçse vepruesin, siç transmeton Muavija r.a. nga Profeti ﷺ:">لكن لابدَّ للوالي من التغافل عن العقوبة على ما يعمله الناس من الذنوب التي لا تضرُّ إلا صاحبَها، كما روى معاوية رضي الله عنه عن النبي ﷺ:</span> <span class="s hadith" data-sq="«Kur qeveritari kërkon dyshim tek njerëzit, gati i prish ata.»">«إن الوالي إذا ابتغى الريبة في الناس إلا كاد يفسدهم».</span></p>`}
,{html:`<p><span class="s" data-sq="Hasani tha: Një fjalë që e dëgjoi Muavija nga Profeti ﷺ e Allahu i bëri dobi me të.">قال الحسن: كلمةٌ سمعها معاويةُ من النبي ﷺ نفعه الله بها.</span></p>
<p><span class="s" data-sq="Profeti ﷺ tha:">وقال النبي ﷺ:</span> <span class="s hadith" data-sq="«Kush sprovohet me diçka nga këto ndyrësira, le të mbulohet me mbulesën e Allahut; sepse kush na e hap faqen e tij, Ne i zbatojmë Librin e Allahut.»">«من ابتُلي من هذه القاذورات بشيء فليَسْتَتِر بستر الله، فإنه من يُبدِ لنا صَفْحَتَه نُقِمْ عليه كتابَ الله».</span></p>
<p><span class="s" data-sq="Nuk i takon atij t'u shfaqë njerëzve se di atë që ata e kanë fshehur nga mëkatet e tyre, nëse nuk i ndëshkon për to, sepse kjo ua ndryshon zemrat dhe e nxit fitnen pa dobi.">ولا ينبغي له أن يُظهِر للناس أنه يعرف ما أخفوه من سيئاتهم إذا لم يُعاقب عليه، فإنَّ ذلك يغير قلوبَهم ويحرِّك الفتنةَ بلا فائدة.</span></p>
<h2><span class="s" data-sq="Kapitull">فصل</span></h2>
<p><span class="s" data-sq="Hukukullahi (të drejtat e Allahut): është emër përmbledhës për çdo gjë që ka dobi të përgjithshme pa u kufizuar në dikë, ose largim dëmi të përgjithshëm në atë që ka të bëjë me fenë ose dynjanë — si kujdesi për xhamitë, imamët e myezinët, vakëfet, rrugët, urbanizmin, ringjallja e suneteve profetike, vdekja e bidateve të devijueshme, paraqitja e atyre që kanë dobi nga njerëzit më të mirë, fetarët, dijetarët, bamirësit e të devotshmit nga çdo shtresë, largimi i mëkatarëve, intrigantëve, gënjeshtarëve, e ngjashëm nga dobitë e përgjithshme.">حقوق الله: اسمٌ جامع لكل ما فيه منفعة عامة لا تختصُّ بمعين، أو دفْع مضرة عامة بما يتعلق بالدين أو الدنيا، كالنظر في المساجد وأئمتها ومؤذنيها، والوقوف والطرقات والصِّياع، وإحياء السنن النبوية، وإماتة البدع والمُضِلَّة، وتقديم من ينتفع به في ذلك وغيره من خيار الناس، وأهل الدين والعلم، والبر والتقوى من كل صنف من أصناف الناس، ومجانبة ذوي الإثم والعدوان، وأهل الحيلة والخديعة، والكذب والإذهان، وغير ذلك من المصالح العامة.</span> <span class="s" data-sq="Profeti ﷺ i merrte vetë përsipër shumicën e këtyre, zëvendësonte në atë që ishte larg, dhe autorizonte në disa çështje atë që ishte i pranishëm pranë tij.">وقد كان النبي ﷺ يتولى بنفسه عامة ذلك، ويستنيب فيما بَعُدَ عنه، ويوكِّل في بعض الأمور لمن حضر عنده.</span></p>`}
,{html:`<p><span class="s" data-sq="Muslimanët bashkëpunonin në këtë, dhe halifët e tij ishin afër kësaj. Linin zëvendës në vendin e tyre gjykatësin në atë që binin dakord, e kur i vinte gjykatësit ndonjë çështje e ndërlikuar, i drejtohej halifes, siç i drejtohej Zejdi Umerit në çështjet e gjyshit, divorcit e ngjashëm.">وكان المسلمون يتعاونون على ذلك، وكان خلفاؤه قريبًا من ذلك، وكانوا يستخلفون في مصرهم قاضيًا فيما يتفق حكمهم فيه، فإذا نزل بالقاضي ما فيه إشكال يراجع الخليفة، كما كان زيدٌ يراجع عمر في مسائل الجد والطلاق وغير ذلك.</span></p>
<p><span class="s" data-sq="Pas halifëve, zakonet u ndryshuan në epoka e vende të ndryshme, sipas pakësisë e shumësisë së nevojës, mundësisë e qeveritarit të madh e paaftësisë së tij, angazhimit të tij e shpërfilljes, e shkaqeve të tjera; kështu disa prej këtyre çështjeve i merrte përsipër qeveritari i ushtrisë që është kryepolici.">وأما بعد الخلفاء؛ فتنوعت العادات في ذلك في الأعصار والأمصار بحسب قلة الحاجة وكثرتها، وبحسب قدرة الوالي الكبير وعجزه، وقيامه بالأمر وإعراضه وأسباب أخر، فصار بعض هذه الأمور يتولاها والي الحرب الذي هو صاحب الشرطة.</span></p>
<p><span class="s" data-sq="Kryepolici ishte si zbatues i urdhrave të qeveritarit të madh që i thuhet 'zëvendës i sulltanit'. Enes ibn Maliku tha: Kajsi [ibn] Sa'di ishte tek Profeti ﷺ në pozitën e kryepolicit tek emiri.">وكان صاحب الشرطة مثل المنفذ لأمر الولي الكبير الذي يقال له: «نائب السلطان». قال أنس بن مالك: كان [قيس بن] سعد من النبي ﷺ بمنزلة صاحب الشرطة من الأمير.</span></p>
<p><span class="s" data-sq="Disa prej tyre i merrte përsipër muhtesibi, i cili merret me urdhërimin e së mirës dhe ndalimin e së keqes, dhe juridiksioni i tij mund të hyjë në juridiksionin e gjykatësit. Disa i merrte përsipër gjykatësi.">وبعضها يتولاها المحتَسب الذي وَلِيَ الأمرَ بالمعروف والنهي عن المنكر، وولايته قد تدخل في ولاية القاضي. وبعضها يتولاها القاضي.</span></p>
<p><span class="s" data-sq="Cilado qeverisje në të cilën punohet me bindjen e Allahut dhe të Dërguarit, ajo është qeverisje legjitime; dhe cilado qeverisje në të cilën punohet ndryshe ose lihet ajo që duhet, nuk është legjitime.">وأيُّ شيء من الولايات عُمِل فيه بطاعة الله ورسوله كانت ولايةً شرعية، وأيُّ شيء عُمِل فيها بخلاف ذلك، أو تُرِك فيها ما يجب لم تكن شرعية،</span> <span class="s" data-sq="Meqë gjykatësi ishte më pranë diturisë e njerëzve të saj dhe më njohës i Sheriatit, shumë njerëz mendojnë se nuk ka qeverisje ku zbatohet Sheriati">لما كان القاضي أقرب إلى العلم وأهله وأكثر معرفة بالشريعة= صار كثيرٌ من الناس يظن أنه ليس من الولايات ما يجب أو يقع فيها حكم الشرع</span></p>`}
,{html:`<p><span class="s" data-sq="veçse gjykata, dhe e kuptuan se Sheriati është ajo që gjykon gjykatësi, e ndoshta iknin nga ky Sheriat — ose duke dalë nga e vërteta, ose për shkak të mangësisë së disa gjykatësve. Por nuk është kështu, por Sheriati është emër për atë me të cilën Allahu e dërgoi të Dërguarin e Tij Muhamedin ﷺ nga Libri dhe Urtësia, dhe gjykimi i tij është i detyrueshëm për të gjitha krijesat.">إلا هي، وصاروا يفهمون أن الشرع ما حَكَم به القاضي، وربما فَرُّوا من هذا الشرع؛ إما خروجًا منهم عن الحق، أو لتقصير يقع من بعض القضاة، وليس الأمر كذلك، بل الشرع اسم لما بعث الله تعالى به رسولَه محمدًا ﷺ من الكتاب والحكمة، وحُكْمُه لازمٌ جميعَ الخلق.</span></p>
<p><span class="s" data-sq="Çdo qeveritar duhet ta ndjekë këtë Sheriat, dhe shpesh zëvendësi, qeveritari e muhtesibi e pasojnë atë, siç shpesh e kundërshtojnë disa gjykatës — ose nga mosdija, qëllimi i keq, ose imitimi i ndonjë dijetari. Ky përputhje me Sheriatin pa qenë gjykatës mund të vijë nga shfaqja e së vërtetës ku pajtuan mendjet, fetë, ose Sheriati ynë, ose nga njohja e Librit e Sunetit, ose mendimi i drejtë, ose imitimi i atij që ka qëlluar, ose rastësisht — por përputhja me Sheriatin në gjyqësi është më e shpeshtë se në qeverisjet e tjera.">فعلى كل والٍ أن يتبع هذا الشرع، وكثيرًا ما يوافقه النائب والوالي والمحتسب، كما أنه كثيرًا ما يخالفه بعض القضاة؛ إما لعدم معرفته، أو لغرض مذموم، أو لتقليد عالم أو غير ذلك، فإن الموافق له من غير القضاة قد يوافقه لظهور الحق الذي اتفقت عليه العقول أو الأديان أو شريعتنا، أو لمعرفته بذلك من الكتاب والسنة، أو لصحة رأيه، أو لتقليد مُصيب في ذلك، أو هو اتفاقًا من غير سلوك طريق صحيح، لكنَّ موافقة الشرع في القضاء أكثر من موافقته في غيره من الولايات.</span></p>
<p><span class="s" data-sq="Janë parë nga qeveritarët atë që është më i mirë se shumica e gjykatësve, dhe janë parë nga gjykatësit atë që është më i keq se mëkatarët e qeveritarëve. Përgjithshmëria e këtyre qeverisjeve dhe veçanësia e tyre është sipas mundësisë së atij që emërohet, sepse qëllimi është besnikëria e fesë në të gjitha çështjet, dhe kjo nuk plotësohet veçse me bashkim e pushtet; kur vendoset pushtet me të cilin kryhet feja sipas ligjit, ky është qëllimi i qeverisjes.">وقد رؤي من الولاة من هو خير من أكثر القضاة، ورؤي من القضاة من هو شرٌّ من فُسَّاق الولاة. وعموم هذه الولايات وخصوصها هو بحسب ما يمكن من المولي، فإن المقصود هو أمانة الدين في جميع الأشياء، ولا يتم ذلك إلا بالاجتماع والسلطان، فإذا جُعِل سلطانٌ يقام به الدين على الوجه المشروع، كان ذلك مقصود الولاية.</span></p>
<p><span class="s" data-sq="Grupe juristësh kanë përmendur se qeverisja absolute e gjyqësisë kërkon disa lloje, dhe kanë mos-pajtim në disa çështje, kjo sipas kuptimit të fjalës 'qeverisje' dhe zakonit të saj, sepse kjo ndryshon sipas kuptimeve të zakonit, derisa thanë: Kjo e kërkon këtë. Sepse detyrimet e kontratave të gjitha merren nga fjala ose zakoni kur Sheriati nuk u ka vendosur kufij.">وقد ذكر طوائف من الفقهاء أن ولاية القضاء المطلقة تقتضي عدة أنواع، واختلفوا في أشياء، وهذا بحسب مقتضى لفظ الولاية وعُرْفها، فإن ذلك يختلف [باختلاف] معاني العُرف حتى قالوا: ذلك يقتضي هذا، فإن موجبات العقود كلها تُتَلَقَّى من اللفظ أو العرف إذا لم يكن الشرع قد جعل لها حدًّا.</span></p>`}
,{html:`<p><span class="s" data-sq="Çdo gjë që është nga kapitulli i përfaqësimeve dhe qeverisjeve që përfitohen me kusht e jo me Sheriat — si testamenti, gjyqësia, komanda ushtarake, qeverisja e vendeve e ngjashëm — përgjithshmëria e veçanësia e tyre përfitohet nga emëruesi me fjalë e zakon sipas asaj që vërtetohet me Sheriat, si qeverisja e babait mbi djalin e tij, sepse përgjithshmëria e kësaj përfitohet me vetë Sheriatin.">وكل ما كان من باب الوكالات والولايات التي تُستفاد بالشرط لا بالشرع، كالوصية، والقضاء، وأمارة الحرب، وولاية الأمصار، ونحو ذلك، فإن عمومَها وخصوصَها يُستفادُ من المولِّي لفظًا وعرفًا على ما يثبت بالشرع، كولاية الأب على ابنه، فإن عموم ذلك يستفاد بنفس الشرع.</span></p>`}
,{html:`<h2><span class="s" data-sq="Kapitull">فصل</span></h2>
<p><span class="s" data-sq="Sa i përket të drejtave dhe ndëshkimeve që i përkasin një individi të caktuar:">وأما الحقوق والحدود التي لآدميٍّ معين:</span></p>
<p><span class="s" data-sq="Prej tyre: gjakrat. Allahu i Lartësuar tha:">فمنها: الدماء، قال الله تعالى:</span> <span class="s quran" data-sq="Thuaj: «Ejani t'ju lexoj atë që Zoti juaj ua ndaloi juve: të mos i shoqëroni Atij asgjë, të silleni mirë ndaj prindërve, të mos i mbytni fëmijët tuaj nga varfëria — Ne ju ushqejmë juve dhe ata — mos iu afroni punëve të ndyta, qofshin të hapura ose të fshehura, mos e mbytni njeriun që All-llahu e ndaloi, veçse me të drejtë. Këto janë porositë e Tij që të mendoni. Mos iu afroni pasurisë së jetimit veçse me mënyrën më të mirë, derisa ta arrijë pjekurinë. Mbushni masën e peshojën me drejtësi — Ne nuk e ngarkojmë asnjë njeri përtej mundësisë — kur të flisni thoni të drejtën edhe nëse ka të bëjë me të afërmin. Plotësoni besën ndaj All-llahut. Këto janë porositë e Tij që të përkujtoheni. Kjo është rruga Ime e drejtë, ndiqeni atë e mos ndiqni rrugë të tjera që t'ju largojnë nga rruga e Tij. Këto janë porositë e Tij që të ruheni [El-En'am: 151-153]">﴿قُلْ تَعَالَوْا أَتْلُ مَا حَرَّمَ رَبُّكُمْ عَلَيْكُمْ أَلَّا تُشْرِكُوا بِهِ شَيْئًا وَبِالْوَالِدَيْنِ إِحْسَانًا وَلَا تَقْتُلُوا أَوْلَادَكُم مِّنْ إِمْلَاقٍ نَّحْنُ نَرْزُقُكُمْ وَإِيَّاهُمْ وَلَا تَقْرَبُوا الْفَوَاحِشَ مَا ظَهَرَ مِنْهَا وَمَا بَطَنَ وَلَا تَقْتُلُوا النَّفْسَ الَّتِي حَرَّمَ اللَّهُ إِلَّا بِالْحَقِّ ذَٰلِكُمْ وَصَّاكُم بِهِ لَعَلَّكُمْ تَعْقِلُونَ ۝ وَلَا تَقْرَبُوا مَالَ الْيَتِيمِ إِلَّا بِالَّتِي هِيَ أَحْسَنُ حَتَّىٰ يَبْلُغَ أَشُدَّهُ وَأَوْفُوا الْكَيْلَ وَالْمِيزَانَ بِالْقِسْطِ لَا نُكَلِّفُ نَفْسًا إِلَّا وُسْعَهَا وَإِذَا قُلْتُمْ فَاعْدِلُوا وَلَوْ كَانَ ذَا قُرْبَىٰ وَبِعَهْدِ اللَّهِ أَوْفُوا ذَٰلِكُمْ وَصَّاكُم بِهِ لَعَلَّكُمْ تَذَكَّرُونَ ۝ وَأَنَّ هَٰذَا صِرَاطِي مُسْتَقِيمًا فَاتَّبِعُوهُ وَلَا تَتَّبِعُوا السُّبُلَ فَتَفَرَّقَ بِكُمْ عَن سَبِيلِهِ ذَٰلِكُمْ وَصَّاكُم بِهِ لَعَلَّكُمْ تَتَّقُونَ﴾</span></p>
<p><span class="s" data-sq="Dhe tha i Lartësuari:">وقال تعالى:</span> <span class="s quran" data-sq="Nuk i takon asnjë besimtari të mbysë besimtarin tjetër, veçse gabimisht [En-Nisa: 92]">﴿وَمَا كَانَ لِمُؤْمِنٍ أَن يَقْتُلَ مُؤْمِنًا إِلَّا خَطَأً﴾</span> <span class="s" data-sq="deri te fjala e Tij:">إلى قوله:</span> <span class="s quran" data-sq="Kush e mbytë një besimtar me qëllim, ndëshkimi i tij është xhehenemi ku do të jetë përgjithmonë, All-llahu është i hidhëruar ndaj tij, e ka mallkuar dhe i ka përgatitur ndëshkim të madh [En-Nisa: 93]">﴿وَمَن يَقْتُلْ مُؤْمِنًا مُّتَعَمِّدًا فَجَزَاؤُهُ جَهَنَّمُ خَالِدًا فِيهَا وَغَضِبَ اللَّهُ عَلَيْهِ وَلَعَنَهُ وَأَعَدَّ لَهُ عَذَابًا عَظِيمًا﴾</span></p>
<p><span class="s" data-sq="Dhe tha i Lartësuari:">وقال تعالى:</span> <span class="s quran" data-sq="Për këtë Ne ua shkruam beni israilëve: kush mbytë një njeri jo për njeri ose për çrregullim në tokë, ai është sikur t'i kishte mbytur të gjithë njerëzit. E kush e shpëton, ai është sikur t'i kishte shpëtuar të gjithë njerëzit [El-Maide: 32]">﴿مِنْ أَجْلِ ذَٰلِكَ كَتَبْنَا عَلَىٰ بَنِي إِسْرَائِيلَ أَنَّهُ مَن قَتَلَ نَفْسًا</span></p>`}
,{html:`<p><span class="s quran" data-sq="(vazhdim) pa pasur të drejtë ose pa shkaktuar çrregullim në tokë, ai është sikur t'i kishte mbytur të gjithë njerëzit. E kush e shpëton, ai është sikur t'i kishte shpëtuar të gjithë njerëzit [El-Maide: 32]">بِغَيْرِ نَفْسٍ أَوْ فَسَادٍ فِي الْأَرْضِ فَكَأَنَّمَا قَتَلَ النَّاسَ جَمِيعًا وَمَنْ أَحْيَاهَا فَكَأَنَّمَا أَحْيَا النَّاسَ جَمِيعًا﴾</span></p>
<p><span class="s" data-sq="Në hadithin e saktë transmetohet nga Profeti ﷺ se tha:">وفي الحديث الصحيح عن النبي ﷺ أنه قال:</span> <span class="s hadith" data-sq="«E para gjë që gjykohet ndërmjet njerëzve Ditën e Kijametit janë gjakrat.»">«أول ما يُقضى بين الناس يوم القيامة في الدماء».</span></p>
<p><span class="s" data-sq="Dijetarët kanë thënë: Mëkati më i madh pas kufrit është mbytja e njeriut që Allahu e ka ndaluar pa të drejtë.">وقد قال العلماء: أكبر الكبائر بعد الكفر: قتل النفس التي حرم الله بغير الحق.</span></p>
