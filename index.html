<p><span class="s" data-sq="Mbytja është tre llojesh:">والقتل ثلاثة أنواع:</span></p>
<p><span class="s" data-sq="E para: vrasja me qëllim të plotë, që është kur synon atë që e di të pafajshëm me atë që zakonisht vret — qoftë me mprehtësinë si shpata e ngjashëm, me peshën si kudhja e rrahësja, me ndalimin e frymës si mbytja në ujë e mbytja me lak, me djegien, hedhjen nga lartësia, shtrëngimin e testikujve derisa del shpirti, dhënien helm vdekjeprurës, e ngjashëm.">أحدها: العمد المحض، وهو أن يقصد من يعلمه معصومًا بما يقتل غالبًا، سواء كان يقتل بحده كالسيف ونحوه، أو بثقله كالسُّنْدان والكُوذين القَصَّار، أو بقَطْع النَّفَس عنه، كالتغريق والخَنْق، أو بغير ذلك كالحريق والإلقاء من مكانٍ شاهقٍ، وإمساك الخِصْيتين حتى تخرج الروح، وبسَقْي السموم القتالة، ونحو ذلك من الأفعال.</span></p>`}
,{html:`<p><span class="s" data-sq="Kur e bën këtë vrasësi duke qenë i rritur e i mençur, dhe i vrari i pafajshëm e i barabartë me të, atëherë obligohet kisasi (shpagimi), që është t'u mundësohet kujdestarëve të të vrarit të kenë vrasësin: nëse duan, vrasin; nëse duan, marrin shpagimin (dijetin); e nëse duan, falin.">فهذا إذا فعله القاتلُ وهو بالغ عاقل، والمقتولُ معصومٌ مكافئ له= وجب فيه القَوَد، وهو أن يُمَكَّن أولياءُ المقتول من القاتل، فإن أحبوا قَتَلوا، وإن أحبوا أخذو الدية، وإن أحبوا عفوا.</span></p>
<p><span class="s" data-sq="A kanë të drejtë të falin dijetin pa pëlqimin e vrasësit? Në këtë ka mospajtim të njohur ndërmjet juristëve. Nuk kanë të drejtë të vrasin dikë tjetër përveç vrasësit, as nga fisi i tij as nga të tjerët.">وهل لهم أن يعفوا عن الدية بغير رضى القاتل؟ فيه خلاف مشهور بين الفقهاء، وليس لهم أن يقتلوا غير القاتل لا من قبيلته ولا من غيرهم،</span> <span class="s" data-sq="Allahu i Lartësuar tha:">قال الله تعالى:</span> <span class="s quran" data-sq="Mos e mbytni njeriun që All-llahu e ka ndaluar veçse me të drejtë. Kush mbytet padrejtësisht, Ne kujdestarit të tij i kemi dhënë pushtet, por le të mos e teprojë mbytjen, sepse ai do të ndihmohet [El-Isra: 33]">﴿وَلَا تَقْتُلُوا النَّفْسَ الَّتِي حَرَّمَ اللَّهُ إِلَّا بِالْحَقِّ وَمَن قُتِلَ مَظْلُومًا فَقَدْ جَعَلْنَا لِوَلِيِّهِ سُلْطَانًا فَلَا يُسْرِف فِّي الْقَتْلِ إِنَّهُ كَانَ مَنصُورًا﴾</span> <span class="s" data-sq="thanë në komentim: të mos vrasë dikë tjetër përveç vrasësit.">قالوا في التفسير: لا يقتل غير قاتله.</span></p>
<p><span class="s" data-sq="Nga Ebu Shurjeh el-Huzai transmetohet se tha i Dërguari i Allahut ﷺ:">وعن أبي شريح الخُزاعي قال: قال رسول الله ﷺ:</span> <span class="s hadith" data-sq="«Kush goditet me gjak ose plagë — habel janë plagët — ai ka zgjedhjen ndërmjet njërës nga tri: nëse do të katërtën, kapeni për dore — : të vrasë, të falë, ose të marrë dijetin. Kush bën diçka nga këto pastaj kthehet (për hakmarrje), ai ka zjarrin e xhehenemit ku do të jetë përgjithmonë.»">«من أُصيب بدم أو خبل ـ والخبل الجراح ـ فهو بالخيار بين إحدى ثلاث ـ فإن أراد الرابعة فخذوا على يديه ـ: أن يَقتِل، أو يعفو، أو يأخذ الدية، فمن فعل شيئًا من ذلك فعاد، فإن له نار جهنم خالدًا فيها أبدًا».</span></p>`}
,{html:`<p><span class="s" data-sq="në «Es-Sunen». Tirmidhiu tha: hadith hasen sahih.">«السنن». قال الترمذي: حديث حسن صحيح.</span></p>
<p><span class="s" data-sq="Kush vret pas faljes ose marrjes së dijetit, ai është kriminel më i madh se ai që vret fillimisht, derisa">فمن قَتَل بعد العفو أو أَخْذ الدِّية، فهو أعظم جُرمًا ممن قَتَل ابتداءً، حتىٰ</span> <span class="s" data-sq="disa dijetarë kanë thënë: obligohet mbytja e tij si had (ndëshkim i caktuar), dhe çështja e tij nuk u lihet kujdestarëve të të vrarit.">قال بعض العلماء: إنه يجب قتله حدًّا، ولا يكون امره إلىٰ أولياء المقتول،</span> <span class="s" data-sq="Allahu i Lartësuar tha:">قال الله تعالىٰ:</span> <span class="s quran" data-sq="O ju që besuat, u është bërë obligim kisasi (shpagimi) për vrasje: i liri për të lirin, robi për robin, femra për femrën. Atij që i falet diçka nga vëllai i tij le t'i përmbahet asaj me të mirë dhe le t'ia kryejë me mirësi. Kjo është lehtësim dhe mëshirë nga Zoti juaj. E kush e tepron pas kësaj, ai ka ndëshkim të dhembshëm. Në kisas ka jetë për ju, o të mençur, ashtu që të ruheni [El-Bekare: 178-179]">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا كُتِبَ عَلَيْكُمُ الْقِصَاصُ فِي الْقَتْلَى الْحُرُّ بِالْحُرِّ وَالْعَبْدُ بِالْعَبْدِ وَالْأُنثَىٰ بِالْأُنثَىٰ فَمَنْ عُفِيَ لَهُ مِنْ أَخِيهِ شَيْءٌ فَاتِّبَاعٌ بِالْمَعْرُوفِ وَأَدَاءٌ إِلَيْهِ بِإِحْسَانٍ ذَٰلِكَ تَخْفِيفٌ مِّن رَّبِّكُمْ وَرَحْمَةٌ فَمَنِ اعْتَدَىٰ بَعْدَ ذَٰلِكَ فَلَهُ عَذَابٌ أَلِيمٌ ۝ وَلَكُمْ فِي الْقِصَاصِ حَيَاةٌ يَا أُولِي الْأَلْبَابِ لَعَلَّكُمْ تَتَّقُونَ﴾</span></p>
<p><span class="s" data-sq="Dijetarët kanë thënë: Kujdestarët e të vrarit i mundojnë zemrat me hidhërim, derisa përparajnë të vrasin vrasësin dhe familjen e tij, e ndoshta nuk kënaqen me vrasjen e vrasësit, por vrasin shumë nga shokët e vrasësit, si kryetarin e fisit dhe udhëheqësin e grupit, kështu vrasësi ka shkelur në fillim dhe këta shkelim në marrje, siç bënin njerëzit e xhahilijetit, dhe siç bëjnë njerëzit e xhahilijetit të dalur nga Sheriati në këto kohëra, nga beduinët e qytetarët e të tjerë.">قال العلماء: إن أولياء المقتول تغلبي قلوبهم بالغيظ، حتىٰ يُؤثروا أن يقتلوا القاتل وأولياءه، وربما لم يرضوا بقتل القاتل، بل يقتلون كثيرًا من أصحاب القاتل، كسيد القبيلة، ومُقَدَّم الطائفة، فيكون القاتل قد اعتدىٰ في الابتداء، ويتعدَّىٰ هؤلاء في الاستيفاء، كما كان يفعله أهل الجاهلية، وكما يفعله أهل الجاهلية الخارجون عن الشريعة في هذه الأوقات، من الأعراب والحاضرة وغيرهم.</span></p>
<p><span class="s" data-sq="Ndodh që e madhërojnë vrasjen e vrasësit sepse ai është i madh e më i ndershëm se i vrari, kështu çon që kujdestarët e të vrarit të vrasin kë munden nga familja e vrasësit, e ndoshta">وقد يستعظمون قتل القاتل لكونه عظيمًا أشرف من المقتول، فيفضي ذلك إلىٰ أن أولياء المقتول يقتلون من قدروا عليه من أولياء القاتل، وربما</span></p>`}
,{html:`<p><span class="s" data-sq="aleanca e këtyre me një popull dhe e atyre me popull tjetër, e çon në fitne dhe armiqësi të mëdha.">حالف هؤلاء قومًا واستعانوا بهم وهؤلاء قومًا، فيُفضي إلىٰ الفتن والعداوات العظيمة.</span></p>
<p><span class="s" data-sq="Shkaku i kësaj: dalja e tyre nga suneti i drejtësisë që është kisasi në mbytje. Allahu na obligoi kisasin — që është barazia dhe ndërsjellshmëria — dhe na lajmëroi se në të ka jetë, duke ruajtur gjakun e atij që nuk ka vrarë nga familjet e dy palëve.">وسبب ذلك: خروجُهم عن سَنَن العدل الذي هو القصاص في القتلىٰ، وكتب الله علينا القصاص ـ وهو المساواة والمعادلة ـ وأخبر أن فيه حياةً بحقن دم غير القاتل من أولياء الرجلين.</span></p>
<p><span class="s" data-sq="Gjithashtu: kur ai që do të vrasë di se do të vritet, ai heq dorë nga vrasja. Transmetohet nga Aliu ibn Ebi Talib dhe Abdullah ibn Amr, nga i Dërguari i Allahut ﷺ se tha:">وأيضًا: فإذا عَلِم من يريد القتلَ أنه يُقتل كفَّ عن القتل، وقد رُوي عن علي بن أبي طالب وعبد الله بن عمرو عن رسول الله ﷺ أنه قال:</span> <span class="s hadith" data-sq="«Besimtarët kanë gjak të barabartë, ata janë dorë e njëjtë kundër atij që u del, dhe i përmbush zotimin e tyre më i ulëti i tyre. Dijeni: nuk vritet mysliman për jobesimtarin, as i mbrojtun gjatë mbrojtjes së tij.»">«المؤمنون تتكافأ دماؤهم، وهم يدٌّ علىٰ من سواهم، ويسعىٰ بذمتهم أدناهم، ألا يُقتَل مسلم بكافر ولا ذو عهدٍ في عهده»</span> <span class="s" data-sq="e transmetoi Ahmedi, Ebu Daudi e të tjerë nga dijetarët e sunenit.">رواه أحمد وأبو داود وغيرهما من أهل السنن.</span></p>
<p><span class="s" data-sq="Kështu gjykoi i Dërguari i Allahut ﷺ se gjakrat e myslimanëve janë të barabarta — domethënë barazi e ndërsjellësi — nuk i jepet përparësi arabit ndaj joarabit, as kurejshiut ose hashimitit ndaj tjetrit nga myslimanët, as të lirit të lindur ndaj të liruar, as dijetarit ose emirit ndaj analfabetit ose të udhëhequrit, siç gjykoi se ata barazohen në pasuri si në trashëgimi, sepse bijtë barazohen në trashëgiminë nga nëna edhe nëse dallohen në fe e dunja.">فقضىٰ رسول الله ﷺ أن المسلمين تتكافأ دماؤهم ـ أي تتساوىٰ وتتعادل ـ ولا يُفَضَّل عربيٌّ علىٰ عجميٍّ، ولا قرشيٌّ أو هاشميٌّ علىٰ غيره من المسلمين، ولا حرٌّ أصليٍ علىٰ مولًى عتيق، ولا عالم أو أمير علىٰ أميٍّ أو مأمور، كما قضىٰ أنهم يتساوون في الأموال في مثل المواريث، فإن البنين يتساوون في إرثهم من أُمِّهم وإن تفاضلوا في الدين والدنيا.</span></p>`}
,{html:`<p><span class="s" data-sq="Kjo drejtësi ndërmjet myslimanëve është e njëzëshme — kundër asaj që bënin njerëzit e xhahilijetit.">المسلمين أنها سواء، خلاف ما عليه أهل الجاهلية.</span></p>
<p><span class="s" data-sq="Shkaku kryesor i epsheve ndërmjet njerëzve në shkretëtira e qytete nuk është gjë tjetër veçse padrejtësia dhe braktisja e drejtësisë, sepse njëra palë i merr tjetrës gjak ose pasuri, ose ngrihet mbi të me të padrejtën pa e pajtuar, ndërsa tjetra nuk mjaftohet me marrjen e të drejtës.">وأكثر سبب الأهواء الواقعة بين الناس في البوادي والحواضر إنما هو البغي وترك العدل، فإن إحدىٰ الطائفتين تصيب من الأخرىٰ دمًّا أو مالًا، أو تعلوا عليها بالباطل فلا تنصفها، ولا تقتصر الأخرىٰ علىٰ استيفاء الحق.</span></p>
<p><span class="s" data-sq="Obligimi në librin e Allahut të Lartësuar është gjykimi ndërmjet njerëzve në gjak e pasuri me drejtësi siç ka urdhëruar Allahu, dhe shuarja e asaj që bënin shumë njerëz nga gjykimi i xhahilijetit. E kur pajtues pajton ndërmjet tyre, le të pajtojë me drejtësi, siç tha i Lartësuari:">والواجب في كتاب الله تعالىٰ الحكم بين الناس في الدماء والأموال وغيرها بالقسط الذي أمر الله تعالىٰ به، ومحو ما كان عليه كثير من الناس من حكم الجاهلية. وإذا أصلح مصلحٌ بينهم فيصلح بالعدل، كما قال تعالىٰ:</span> <span class="s quran" data-sq="Nëse dy grupe besimtarësh kalin njëri-tjetrin, pajtojini. Nëse njëri prej tyre i bën padrejtësi tjetrit, luftojeni atë palë derisa t'i kthehet urdhërit të All-llahut. E nëse kthehet, atëherë pajtojini me drejtësi, sepse All-llahu i do të drejtët. S'ka dyshim se besimtarët janë vëllezër, ndaj bëni pajtim ndërmjet vëllezërve tuaj e kini frikë All-llahun, ashtu që të jeni të mëshiruar [El-Huxhurat: 9-10]">﴿وَإِن طَائِفَتَانِ مِنَ الْمُؤْمِنِينَ اقْتَتَلُوا فَأَصْلِحُوا بَيْنَهُمَا فَإِن بَغَتْ إِحْدَاهُمَا عَلَى الْأُخْرَىٰ فَقَاتِلُوا الَّتِي تَبْغِي حَتَّىٰ تَفِيءَ إِلَىٰ أَمْرِ اللَّهِ فَإِن فَاءَتْ فَأَصْلِحُوا بَيْنَهُمَا بِالْعَدْلِ وَأَقْسِطُوا إِنَّ اللَّهَ يُحِبُّ الْمُقْسِطِينَ ۝ إِنَّمَا الْمُؤْمِنُونَ إِخْوَةٌ فَأَصْلِحُوا بَيْنَ أَخَوَيْكُمْ وَاتَّقُوا اللَّهَ لَعَلَّكُمْ تُرْحَمُونَ﴾</span></p>
<p><span class="s" data-sq="Dhe duhet të kërkohet falja nga kujdestarët e të vrarit, sepse kjo është më e mirë për ta, siç tha i Lartësuari:">وينبغي أن يطلب العفو من أولياء المقتول، فإنه أفضل لهم، كما قال تعالىٰ:</span> <span class="s quran" data-sq="Plagët janë kisas (shpagim i ndërsjellë). E kush e fal atë (hakmarrjen), ajo i bëhet shlyerje (mëkatesh) [El-Maide: 45]">﴿وَالْجُرُوحَ قِصَاصٌ فَمَن تَصَدَّقَ بِهِ فَهُوَ كَفَّارَةٌ لَّهُ﴾</span></p>`}
,{html:`<p><span class="s" data-sq="Kjo drejtësi që gjykoi i Dërguari i Allahut ﷺ ndërmjet myslimanëve në gjak e pasuri është e njëzëshme ndërmjet myslimanëve, ndryshe nga ajo e njerëzve të xhahilijetit dhe gjykatësve hebrenjë, sepse pranë Medines së Profetit ﷺ ishin dy fise hebrejsh: Kurejdha dhe Nadhiri, e Nadhiri e madhëronte veten ndaj Kurejdhës në gjakra, e u pajtuan te Profeti ﷺ.">وهذا الذي قضاه رسول الله ﷺ من العدل بين المسلمين في النفوس والأموال متفق عليه بين المسلمين، بخلاف ما عليه أهل الجاهلية وحُكَّام اليهود، فإنه كان بقرب مدينة النبي ﷺ صنفان من اليهود: قُرَيظة والنَّضير، وكان النضير تُفَضِّل علىٰ قريظة في الدماء، فتحاكموا إلىٰ النبي ﷺ في</span> <span class="s" data-sq="atë, dhe në hadin e zinaqarit, sepse ata e kishin ndryshuar prej gurëzimit në nxirje me katran, e thanë: nëse gjykon ndërmjet jush kështu, është argument për ju, përndryshe ju keni braktisur ligjin e Teuratit. Allahu zbriti:">ذلك، وفي حدِّ الزَّاني، فإنهم كانوا قد غيروه من الرجم إلىٰ التحميم، فقالوا: إن حَكَم بينكم بذلك كانت لكم حجة، وإلا فأنتم قد تركتم حكم التوراة،</span> <span class="s" data-sq="e zbriti Allahu i Lartësuar:">فأنزل الله تعالىٰ:</span> <span class="s quran" data-sq="O i dërguar, mos u brengos për ata që nxitojnë në mosbesim... [El-Maide: 41]">﴿يَا أَيُّهَا الرَّسُولُ لَا يَحْزُنكَ الَّذِينَ يُسَارِعُونَ فِي الْكُفْرِ﴾</span> <span class="s" data-sq="deri te fjala e Tij:">إلىٰ قوله:</span> <span class="s quran" data-sq="E kush nuk gjykon me atë që zbriti All-llahu, ata janë zullumqarë [El-Maide: 45]">﴿وَمَن لَّمْ يَحْكُم بِمَا أَنزَلَ اللَّهُ فَأُولَـٰئِكَ هُمُ الظَّالِمُونَ﴾</span></p>
<p><span class="s" data-sq="Sqaroi i Madhëruari se Ai i barazoi ndërmjet shpirtrave të tyre dhe nuk dalloi njërin ndaj tjetrit siç vepronin ata. Deri te fjala e Tij:">بيَّن سبحانه وتعالىٰ أنه سوَّىٰ بين نفوسهم ولم يفضِّل نفسًا علىٰ أخرىٰ كما كانوا يفعلونه. إلىٰ قوله:</span> <span class="s quran" data-sq="Gjyko ndërmjet tyre me atë që All-llahu zbriti dhe mos u shko pas dëshirave të tyre e të largohen prej asaj që t'u ka ardhur nga e vërteta. Secilit prej jush i kemi caktuar ligj e program [El-Maide: 48]">﴿فَاحْكُم بَيْنَهُم بِمَا أَنزَلَ اللَّهُ وَلَا تَتَّبِعْ أَهْوَاءَهُمْ عَمَّا جَاءَكَ مِنَ الْحَقِّ لِكُلٍّ جَعَلْنَا مِنكُمْ شِرْعَةً وَمِنْهَاجًا﴾</span> <span class="s" data-sq="deri te fjala e Tij:">إلىٰ قوله:</span> <span class="s quran" data-sq="A mos duan ata gjykimin e (kohës së) injorancës? E kush është gjykues më i mirë se All-llahu për një popull që bindët? [El-Maide: 50]">﴿أَفَحُكْمَ الْجَاهِلِيَّةِ يَبْغُونَ وَمَنْ أَحْسَنُ مِنَ اللَّهِ حُكْمًا لِّقَوْمٍ يُوقِنُونَ﴾</span> <span class="s" data-sq="Allahu gjykoi në gjakrat e">فحكَم الله في دماء</span></p>`}
,{html:`<p><span class="s" data-sq="Enesi tha: Asnjë çështje nuk iu ngrit të Dërguarit të Allahut ﷺ ku kishte kisas veçse urdhëroi falje. Transmetoi Ebu Daudi e të tjerë.">قال أنس: ما رُفِعَ إلىٰ رسول الله ﷺ أمرٌ فيه القصاص إلا أمر فيه بالعفو. رواه أبو داود وغيره.</span></p>
<p><span class="s" data-sq="Muslimi transmeton në «Sahihun» e tij nga Ebu Hurejra r.a. se tha i Dërguari i Allahut ﷺ:">وروىٰ مسلم في «صحيحه» عن أبي هريرة رضي الله عنه قال: قال رسول الله ﷺ:</span> <span class="s hadith" data-sq="«Asnjë lëmoshë nuk pakëson pasurinë, Allahu nuk ia shton robit me falje veçse krenari, dhe kushdo që përulet për Allahun — Allahu e ngre.»">«ما نقصت صدقةٌ من مال، وما زاد الله عبدًا بعفوٍ إلا عزًّا، وما تواضع أحدٌ لله إلا رفعَه الله».</span></p>
<p><span class="s" data-sq="Kjo barazim që përmendëm është ndërmjet myslimanit të lirë me myslimanin e lirë. Sa i përket dhimmiut (jomyslimanit nën mbrojtje), shumica e dijetarëve janë se ai nuk është i barabartë me myslimanin, siç edhe i siguruari që vjen nga vendet e jobesimtarëve si i dërguar ose tregtar nuk është i barabartë me te — me ixhma. Disa thonë: jo, ai është i barabartë. Po kështu ka mospajtim edhe në mbytjen e të lirit për robin.">وهذا الذي ذكرناه من التكافؤ هو في المسلم الحر مع المسلم الحر، فأما الذِّمي؛ فجمهور العلماء علىٰ أنه ليس بكفْء للمسلم، كما أن المستأمن الذي يقدم من بلاد الكفار رسولًا أو تاجرًا ونحو ذلك ليس بكفء له وفاقًا. ومنهم من يقول: بل هو كفء له. وكذلك النزاع في قتل الحر بالعبد.</span></p>
<p><span class="s" data-sq="Barazia në numër nuk merret parasysh te shumica e dijetarëve, përkundrazi edhe nëse një grup vrasin njërin, vriten të gjithë, siç tha Umeri r.a.: «Edhe sikur banorët e Sana-së të kishin bashkëpunuar kundër tij, do t'i kisha ekzekutuar të gjithë.» Po kështu tha Aliu r.a. për ata që dëshmuan kundër njeriut për vjedhje, e prenë dorën, pastaj i tërhoqën dëshmitë, e tha: Sikur ta dija se e bëtë me qëllim,">ولا تعتبر المكافأة في العدد عند جماهير العلماء، بل لو قتلَ عددٌ واحدًا قُتِلوا به، كما قال عمر بن الخطاب رضي الله عنه: لو تمالأ عليه أهل صنعاء لأَقَدْتُهم به. وكذلك قال علي بن أبي طالب رضي الله عنه في الذين شهدوا علىٰ رجل بالسرقة، فقطعه، ثم رجعوا عن الشهادة، فقال: لو أعلم أنكم</span></p>`}
,{html:`<p><span class="s" data-sq="do t'ua prisja duart të dyve.">تعمدتم لقطعتكما.</span></p>
<p><span class="s" data-sq="Gjithashtu vritet mashkulli për femrën te shumica, siç vrau Profeti ﷺ njeriun çifut për gruan — kisas.">وكذلك يُقتل الذكر بالأنثىٰ عند الجماهير، كما قَتَل النبي ﷺ الرجلَ اليهودي بالمرأة قصاصًا.</span></p>
<p><span class="s" data-sq="Lloji i dytë: Gabimi që i ngjan qëllimit. Tha Profeti ﷺ:">والنوع الثاني: الخطأ الذي يشبه العمد، قال عليه السلام:</span> <span class="s hadith" data-sq="«Dijeni se mbytja gabimisht — ajo që ngjan qëllimit — me kamxhik e shkop: njëqind deve, prej tyre dyzet shtatza me fëmijë në bark.»">«ألا إن في قتل الخطأ شِبْه العمد ما كان بالسوط والعصا: مئة من الإبل، منها أربعون خَلِفة في بطونها أولادُها».</span> <span class="s" data-sq="E quajti: gjysëm-qëllim, sepse ai synoi armiqësinë ndaj tij me vepër që zakonisht nuk vret, kështu qëllimoi armiqësinë por nuk qëllimoi vrasjen. Në këtë nuk ka kisas te shumica siç përmendi ﷺ. A bie dija mbi vrasësin apo mbi familjen e tij (akilen)? Në këtë ka mospajtim ndërmjet juristëve në medhhebin e Ahmedit e ngjashëm.">فسماه: شِبه العمد؛ لأنه قصد العدوان عليه بالجناية لكنها لا تقتل غالبًا، فقد تعمَّد العدوان ولم يتعمد ما يقتل. وهذا لا قَوَد فيه عند الجمهور كما ذكر ﷺ. وهل هي علىٰ القاتل أو علىٰ عاقلته؟ فيه نزاع بين الفقهاء في مذهب أحمد وغيره.</span></p>
<p><span class="s" data-sq="Lloji i tretë: Gabimi i pastër dhe ajo që i ngjan, si kur njeri">والنوع الثالث: الخطأ المحض وما يجري مجراه، مثل أن يكون</span></p>`}
,{html:`<p><span class="s" data-sq="gjuan gjah ose shënjestër e qëllon njeri pa e ditur e pa e dashur, ky nuk ka kisas por ka dijet mbi familjen e vrasësit, ka kefareh (shlyerje) në pasurinë e tij, e në këto kapituj ka shumë çështje të njohura në librat e dijetarëve.">يرمي صيدًا أو هدفًا فيصيب به إنسانًا بغير علمه ولا قصده، فهذا ليس فيه قود وإنما فيه الدية علىٰ عاقلة القاتل، وفيه الكفَّارة في ماله، وفي هذه الأبواب مسائل كثيرة معروفة في كتب أهل العلم.</span></p>
<h2><span class="s" data-sq="Kapitull">فصل</span></h2>
<p><span class="s" data-sq="Kisasi në plagë — gjithashtu — është i vërtetuar me Kuran, Sunet e ixhma, me kusht barazinë. Kur ia pret dorën e djathtë nga nyja, ai ka të drejtë t'ia presë dorën po kështu; kur ia nxjerr dhëmbin, ai ka të drejtë t'ia nxjerrë; kur ia çan kokën ose fytyrën deri sa duket kocka, ai ka të drejtë t'ia çajë po kështu.">والقصاص في الجراح ـ أيضًا ـ ثابت بالكتاب والسنة والإجماع بشرط المساواة، فإذا قطعَ يدَه اليمنىٰ من مِفصل فله أن يقطع يده كذلك، وإذا قلع سنه فله أن يقلع سنه، وإذا شُجَّ في رأسه أو وجهه فأوضحَ العظمَ فله أن يشجَّه</span> <span class="s" data-sq="po kështu. Ama kur nuk mundësohet barazia, si kur ia thyen kockën e brendshme ose ia çan nën nivelin e kockës, nuk ligjësohet kisasi, por obligohet dija e përcaktuar ose arshi (dëmshpërblimi) sipas asaj që ka ardhur nga Profeti ﷺ e shokët e tij.">كذلك، وأما إذا لم يمكن المساواة، مثل أن يكسر له عظمًا باطنًا أو شجَّه دون الْمُوضِحَة، فلا يُشْرَع القصاص، بل تجب الدية المحدودة [أو الأَرْش]</span> <span class="s" data-sq="Çdo organ ose dobi që njeriu ka vetëm njërin, ka dijeh të plotë, si gjuha, hunda, organi mashkullor, të folurit e mendja.">بما جاء عن النبي ﷺ وأصحابه، فكل عضو أو منفعة ليس في الإنسان فيه إلا واحد؛ ففيه دية كاملة، كاللسان، والأنف، والذَّكَر، والكلام والعقل.</span></p>
<p><span class="s" data-sq="Çdo gjë që njeriu ka dy cope, në të dyja ka dijeh të plotë, e në njërën gjysmën, si dy sytë e shikimi i tyre, dy veshët e dëgjimi, dy duart e dy këmbët.">وكلُّ ما في الإنسان منه اثنان ففيهما الدية، وفي أحدهما نصفها، كالعينين ونظرهما، والأذنين والسمع، واليدين، والرِّجلين.</span></p>
<p><span class="s" data-sq="Ajo që ka tri copa, në secilën ka një të tretën e dijes, si dy anët e hundës dhe muri ndërmjet tyre.">وما في الإنسان فيه ثلاثة؛ ففي أحدها ثلث الدية، كجانبي الأنف، والحائل بينهما.</span></p>
<p><span class="s" data-sq="Ajo që ka katër copa, në secilën ka një të katërtën e dijes, si qepallat e katërta.">وما فيه منه أربعة؛ ففي أحدها ربع الدية، كالأجفان الأربعة.</span></p>`}
,{html:`<p><span class="s" data-sq="Ajo që ka më shumë, si gishtërinjtë e dhjetë: në çdo gisht një e dhjeta e dijes, në çdo dhëmb gjysma e një të dhjetës së dijes. Kur ia çan kokën ose fytyrën derisa duket kocka, ka gjysma e një e dhjeta e dijes. Nëse plaga është nën atë nivel si prerja e mishit, atëherë i plagosuri vlerësohet sikur të ishte rob i shëndoshë, pastaj vlerësohet i plagosur e shëruar, e sa i pakësohet vlera i jepet prej dijes.">وما فيه أكثر من ذلك كالأصابع العشرة؛ في كل أصبع عُشْر الدية، وفي كل سنٍّ نصف عُشْر الدية. وإذا شج رأسه أو وجهه حتىٰ ظهرَ العظمُ ووضَح؛ ففيه نصف عشر الدية، وإن كانت الشَّجَّة دون ذلك مثل أن تبضع اللحم، فإنه يُقوَّم المجروح كأنه عبد وهو سليم، ثم يُقوَّم وهو مجروح قد اندملَ جُرْحُه، فما نقصت قيمته أُعطي الجناية من ديته.</span></p>
<p><span class="s" data-sq="Sa i përket kisasit në goditje me dorë, shkop ose kamxhik, si shpulla, grushti ose goditja me shkop e ngjashëm: njëra palë e dijetarëve tha se nuk ka kisas, por ka tazir (ndëshkim disiplinor), sepse nuk mundësohet barazia.">وأما القصاص في الضرب بيده أو بعصاه أو سوطه، مثل أن يلطمه، أو يلكمه، أو يضربه بعصًىٰ، ونحو ذلك؛ فقد قال طائفة من العلماء: لا قصاص فيه بل فيه تعزير؛ لأنه لا يمكن المساواة فيه.</span></p>
<p><span class="s" data-sq="Të tjerë thanë: jo, ka kisas, dhe kjo është e transmetuara nga halifët e drejtë e të tjerë nga sahabët e tabiinët: se kisasi lejohet në këto, dhe ky është teksti i Ahmedit e juristëve të tjerë, dhe me këtë erdhi suneti i të Dërguarit të Allahut ﷺ, dhe kjo është e sakta.">وقال آخر: بل فيه القصاص، وهذا هو المأثور عن الخلفاء الراشدين وغيرهم من الصحابة والتابعين: أن القصاص مشروع في ذلك، وهو نص أحمد وغيره من الفقهاء، وبذلك جاءت سنة رسول الله ﷺ، وهو الصواب.</span></p>
<p><span class="s" data-sq="Ebu Ferasi tregon: Umeri r.a. mbajti hutbe ku tha:">قال أبو فراس: خَطَبَ عمرُ بن الخطاب رضي الله عنه فذكر حديثًا قال فيه:</span> <span class="s" data-sq="Dijeni, pasha Allahun, unë nuk i dërgoj punëtorët e mi te ju që t'ju rrahin lëkurat as t'ju marrin pasuritë, por i dërgoj që t'ju mësojnë fenë tuaj e sunetin e profetit tuaj. Kush i bëhet diçka e keqe">ألا إني والله ما أرسل عمالي إليكم ليضربوا أبشاركم ولا ليأخذوا أموالكم، ولكن أرسلهم إليكم ليعلموكم دينكم وسنة نبيكم، فمن فُعِل به سوئ</span></p>`}
,{html:`<p><span class="s" data-sq="përpara kësaj, le ta ngrejë te unë, pasha Atë që shpirti im është në dorën e Tij, do t'ia bëj kisas.">ذلك فليرفعه إليَّ، فوالذي نفسي بيده إذًا لأُقِصَّنَّه منه.</span></p>
<p><span class="s" data-sq="U ngrit Amr ibn el-Asi e tha: O Emiri i Besimtarëve, nëse ndonjë njeri nga myslimanët është mbi popullin e tij e e ndëshkon — a do t'i bësh kisas?">فوثب عَمرو بن العاص فقال: يا أمير المؤمنين، إن كان رجل من المسلمين علىٰ رعية، فأدَّب رعيَّته أئنك لمُقِصّه منه؟</span></p>
<p><span class="s" data-sq="Tha: Po, pasha Atë që shpirti i Muhamedit është në dorën e Tij, do t'ia bëj kisas. Si të mos ia bëj kur e kam parë të Dërguarin e Allahut ﷺ t'ia bëjë kisasin nga vetja e tij?! Dijeni, mos i rrahni myslimanët e t'i përulni, e mos ua ndaloni të drejtat e t'i bëni jobesimtarë! Transmetoi Ahmedi e të tjerë.">قال: إي والذي نفس محمد بيده إذًا لأُقِصَّنه منه، أنَّىٰ لا أُقِصُّه منه وقد رأيت رسول الله ﷺ يُقِصّ من نفسه؟! ألا لا تضربوا المسلمين فتُذِلُّوهم، ولا تمنعوهم حقوقَهم فتكفروهم. رواه أحمد وغيره.</span></p>
<p><span class="s" data-sq="Kuptimi i kësaj: kur qeveritari rrah popullin e tij rrahje të rëndë e të palejuar. Ama rrahja e ligjëruar nuk ka kisas — me ixhma — qoftë e obliguar, e pëlqyer ose e lejuar.">ومعنىٰ هذا إذا ضرب المتولي رعيتَه ضربًا مُبَرِّحًا غير جائز، فأما الضرب المشروع فلا قصاص فيه بالإجماع، وهو واجب أو مستحب أو جائز.</span></p>
<h2><span class="s" data-sq="Kapitull">فصل</span></h2>
<p><span class="s" data-sq="Kisasi në ndere është gjithashtu i ligjshëm: kur njeriu mallkon ose lutet kundër tjetrit, tjetri ka të drejtë t'ia bëjë njëlloj; po kështu kur e shan me shanim pa gënjeshtër. Por falja është më e mirë. Allahu i Lartësuar tha:">والقصاص في الأعراض مشروع أيضًا وهو أن الرجل إذا لعن رجلًا أو دعا عليه، فله أن يفعل به كذلك، وكذلك إذا شتمه شتيمة لا كذب فيها، والعفو أفضل، قال الله تعالىٰ:</span> <span class="s quran" data-sq="Ndëshkimi i të keqes është i njëjtë me të. E kush fal e pajton, shpërblimi i tij është te All-llahu. Ai nuk i do zullumqarët. E kush mbron veten pasi i është bërë padrejtësi, ndaj atyre s'ka qortim. Qortimi është vetëm ndaj atyre që u bëjnë padrejtësi njerëzve dhe bëjnë çrregullime në tokë pa të drejtë [Esh-Shura: 40-42]">﴿وَجَزَاءُ سَيِّئَةٍ سَيِّئَةٌ مِّثْلُهَا فَمَنْ عَفَا وَأَصْلَحَ فَأَجْرُهُ عَلَى اللَّهِ إِنَّهُ لَا يُحِبُّ الظَّالِمِينَ ۝ وَلَمَنِ انتَصَرَ بَعْدَ ظُلْمِهِ فَأُولَـٰئِكَ مَا عَلَيْهِم مِّن سَبِيلٍ ۝ إِنَّمَا السَّبِيلُ عَلَى الَّذِينَ يَظْلِمُونَ النَّاسَ وَيَبْغُونَ فِي الْأَرْضِ بِغَيْرِ الْحَقِّ﴾</span></p>
<p><span class="s" data-sq="Dhe Profeti ﷺ tha:">وقال النبي ﷺ:</span> <span class="s hadith" data-sq="«Dy shanarët — çka thanë, bie mbi atë që filloi, përderisa i padrejti nuk e kalon kufirin.»">«المُسْتَبَّان ما قالا فعلىٰ البادئ منهما ما لم يعتدِ المظلوم»</span></p>`}
,{html:`<p><span class="s" data-sq="i padrejtuari — dhe kjo quhet: mbrojtja e nderit.">المظلوم ـ ويسمىٰ هذا: الانتصار ـ.</span></p>
<p><span class="s" data-sq="Shanimi pa gënjeshtër: si lajmërimi për të keqen që ka, ose quajtja qen a gomar e ngjashëm për poshtërim.">والشتيمةُ التي لا كذب فيها: مثل الإخبار عنه بما فيه من القبائح، أو تسميته بالكلب أو الحمار ونحو ذلك علىٰ وجه الإهانة.</span></p>
<p><span class="s" data-sq="Ama nëse shpif ndaj tij, nuk i lejohet t'i shpifë; nëse e akuzon për kufër ose fisk pa të drejtë, nuk i lejohet t'ia bëjë; nëse i mallkon babain, fisin ose banorët e qytetit, nuk i lejohet t'i shkelë ata nëse nuk e ndihmuan në padrejtësi, sepse ata nuk e padrejtuan.">فأما إن افترىٰ عليه لم يحل له أن يفتري عليه، ولو كفَّره أو فسَّقه بغير حق لم يحل له أن يكفِّره أو يفسِّقه بغير حق، ولو لعن أباه أو قبيلته أو أهل بلده ونحو ذلك، لم يحل أن يعتدي علىٰ أولئك إذا لم يعينوه علىٰ ظلمه، فإنهم لم يظلموه،</span> <span class="s" data-sq="Allahu i Lartësuar tha:">قال الله تعالىٰ:</span> <span class="s quran" data-sq="O ju që besuat! Bëhuni plotësisht të vendosur për hir të All-llahut, dëshmues me drejtësi, dhe mos ju shtyjë urrejtja ndaj një populli e të mos mbani drejtësi. Mbani drejtësinë, se ajo është më afër devotshmërisë [El-Maide: 8]">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا كُونُوا قَوَّامِينَ لِلَّهِ شُهَدَاءَ بِالْقِسْطِ وَلَا يَجْرِمَنَّكُمْ شَنَآنُ قَوْمٍ عَلَىٰ أَلَّا تَعْدِلُوا اعْدِلُوا هُوَ أَقْرَبُ لِلتَّقْوَىٰ﴾</span></p>
<p><span class="s" data-sq="Si i lejohet myslimanit t'i shkelë tjetrit për urrejtje — qoftë e lejuar ose jo?!">فكيف يجوز للمسلم أن يتعدَّىٰ علىٰ مسلم لِيُبْغِضه إياه بغضًا جائزًا أو غير جائز؟!</span></p>
<p><span class="s" data-sq="Rregulli: çdo fjalë në nderin e tij që është e ndaluar për të drejtën e tij — ajo dëmtim që i vjen — lejohet kisasi me të njëjtën, si lutja kundër tij me mallkim e ngjashëm, poshtërimi me fjalë, e nxjerrja e të metave në fytyrë — kjo është">وإجماع ذلك: أن كل ما كان من الكلام في عرضه محرَّمًا لحقه ما لم يلحقه من الأذىٰ جاز الاقتصاص منه مثله، كالدعاء عليه مثل ما دعا عليه من لعنٍ وغيره، وكالإهانة في الكلام، وكإظهار مساوئه في وجهه وهو</span></p>`}
,{html:`<p><span class="s" data-sq="thumbimi, ose në mungesë — dhe kjo është gibeti (përgojimi).">الهمز، أو في مغيبه وهو الغيبة.</span></p>
<p><span class="s" data-sq="Nuk lejohet kalimi i kufirit ndaj tij duke e sharë më shumë ose më rëndë, siç tha Profeti ﷺ: «Dy shanarët — çka thanë bie mbi atë që filloi përderisa i padrejti nuk e kalon kufirin.» — kështu u kuptua se i barabartësuari nuk ka mëkat nëse nuk kalon kufirin.">ولا يجوز الاعتداء عليه بأن يسب أكثر مما يسبه، أو أشد مما سبه، كما قال النبي ﷺ: «ما قالا فعلىٰ البادئ منهما ما لم يعتدِ المظلوم»، فعُلِمَ أن المكافئ لا إثم عليه إذا إذا اعتدىٰ.</span></p>
<p><span class="s" data-sq="Ama ajo fjalë që është e ndaluar për të drejtën e Allahut — që ndalohet edhe pa qenë dëmtim — si gënjeshtra ndaj tij me shpifje, tekfir, fisk e ngjashëm, kjo nuk lejohet kundërpërgjigja me të njëjtën, por ndëshkohet me tazir, si plagët ku nuk ka kisas.">وأما ما كان من الكلام محرَّمًا لحقِّ الله، بحيث يحرم ولو لم يكن فيه إيذاء له، كالكذب عليه بالقذف والتكفير والفسق وغير ذلك؛ فهذا لا يجوز المقابلة بمثله، لكن يُعَزَّر علىٰ ذلك، بمنزلة ما ليس فيه قصاص من الجوارح.</span> <span class="s" data-sq="Dijetarët kanë mospajtim: a lejohet pajtimi me para? Në dy mendime.">وقد اختلف العلماء هل يجوز الصلح علىٰ ذلك بمال؟ علىٰ قولين.</span></p>
<p><span class="s" data-sq="I ngjashëm me këtë: kur dikush e gjymton tjetrin duke e vrarë — si djegja, prerja e duarve e këmbëve — a i bëhet njëlloj apo nuk ka kisas veçse me shpatë? Dy mendime të njohura te juristët; më i ngjashëm me Kuranin, Sunetin e drejtësinë: i bëhet siç bëri, përveç kur veprimi është i ndaluar në vetvete, si dhënia alkool ose sodomia e ngjashëm.">ونظير هذا: ما لو مثَّل بغيره في القتل، مثل أن يحرقه أو يقطع يديه ورجليه، فهل يُفْعَل به كما فعل أو لا قَوَد إلا السيف؟ فيه قولان مشهوران للفقهاء؛ أشبههما بالكتاب والسنة والعدل: أنه يُفْعَل به كما فعل ما لم يكن الفعل محرَّمًا في نفسه، كتجريع الخمر، والتلوُّط به، ونحو ذلك.</span></p>`}
,{html:`<h2><span class="s" data-sq="Kapitull">فصل</span></h2>
<p><span class="s" data-sq="Kur padrejtësia në nder është ajo ku nuk ka kisas, si shpifja e ngjashëm, ndëshkimi është me had (ndëshkim i caktuar) në shpifje, dhe me tazir (ndëshkim disiplinor) në të tjerat.">وإذا كانت المَظْلَمة في العِرْض مما لا قصاص فيه كالقذف وغيره؛ فيه العقوبة بالحدّ في القذف، وبالتعزير في غيره.</span></p>
<p><span class="s" data-sq="Sa i përket hadit të shpifjes, ai është i vërtetuar me Kuran, Sunet e ixhma. Allahu i Lartësuar tha:">أما حدُّ القذف؛ فإنه ثابت بالكتاب والسنة والإجماع، قال الله تعالىٰ:</span> <span class="s quran" data-sq="Ata që i shpifin (me kurvëri) gratë e ndershme e pastaj nuk sjellin katër dëshmitarë, rrihjuani tetëdhjetë kamxhikë dhe kurrë mos ua pranoni dëshminë, sepse ata janë të prishur. Përveç atyre që pendohen pas kësaj dhe përmirësohen, sepse All-llahu falë, mëshiron [En-Nur: 4-5]">﴿وَالَّذِينَ يَرْمُونَ الْمُحْصَنَاتِ ثُمَّ لَمْ يَأْتُوا بِأَرْبَعَةِ شُهَدَاءَ فَاجْلِدُوهُمْ ثَمَانِينَ جَلْدَةً وَلَا تَقْبَلُوا لَهُمْ شَهَادَةً أَبَدًا وَأُولَـٰئِكَ هُمُ الْفَاسِقُونَ ۝ إِلَّا الَّذِينَ تَابُوا مِن بَعْدِ ذَٰلِكَ وَأَصْلَحُوا فَإِنَّ اللَّهَ غَفُورٌ رَّحِيمٌ﴾</span></p>
<p><span class="s" data-sq="Ky had — hadi i shpifjes — i takon të shpifurit, nuk zbatohet veçse me kërkesën e tij, me ixhmanë e juristëve. Nëse fal, bie te shumica e dijetarëve si Maliku, Shafiu dhe Ahmedi në mendimin e njohur, sepse në të mbizotëron e drejta e njeriut, si kisasi e pasuritë.">وهذا الحد ـ حد القذف ـ مُسْتحقه المقذوف، فلا يُستوفىٰ إلا بطلبه باتفاق الفقهاء، فإن عفا عنه سقط عند جمهور العلماء، كمالك والشافعي وأحمد في المشهور عنه؛ لأنَّ المُغلَّب فيه حق الآدمي، كالقصاص والأموال.</span></p>`}
,{html:`<p><span class="s" data-sq="Është thënë: nuk bie me falje, duke i dhënë përparësi të drejtës së Allahut, për mungesë barazie, si hadet e tjera. Ky është mendimi i Ebu Hanifes dhe Ahmedit në njërën transmetim.">وقيل: لا يسقط تغليبًا لحق الله تعالىٰ لعدم المماثلة كسائر الحدود، وهو قول أبي حنيفة وأحمد في رواية.</span></p>
<p><span class="s" data-sq="Hadi i shpifjes obligohet kur i shpifuri është i ndershëm (muhsan): mysliman, i lirë, i pastër. Ama i njohuri për imoralitet nuk ka had ndaj shpifësit, po kështu jobesimtari i ndershëm e robi, por ndëshkohet shpifësi me tazir.">وإنما يجب حدُّ القذف إذا كان المقذوف محصنًا؛ وهو المسلم، الحر، العفيف، وأما المشهور بالفجور فلا حدَّ علىٰ قاذفه، وكذلك الكافر العفيف، والرقيق، لكن يُعَزَّر القاذف.</span></p>
<p><span class="s" data-sq="Kjo është për joshkun, sepse nuk ka nevojë për shpifje edhe nëse thotë të vërtetën, sepse Allahu i Lartësuar thotë:">وهذا في غير الزوج، إذ لا حاجة به إلىٰ القذف وإن كان صادقًا؛ لأن الله تعالىٰ يقول:</span> <span class="s quran" data-sq="Ata që duan të përhapet imoraliteti ndërmjet besimtarëve, ata kanë ndëshkim të dhembshëm në dunja e ahiret. All-llahu e di e ju nuk e dini [En-Nur: 19]">﴿إِنَّ الَّذِينَ يُحِبُّونَ أَن تَشِيعَ الْفَاحِشَةُ فِي الَّذِينَ آمَنُوا لَهُمْ عَذَابٌ أَلِيمٌ فِي الدُّنْيَا وَالْآخِرَةِ وَاللَّهُ يَعْلَمُ وَأَنتُمْ لَا تَعْلَمُونَ﴾</span></p>
<p><span class="s" data-sq="Ama bashkëshorti, atij i lejohet ta shpifë gruan kur bën zina pa mbetur shtatzënë. Nëse mbetet shtatzënë e lind, duhet ta shpifë e ta mohojë fëmijën, që të mos i bashkëngjitet kush nuk është i tij e të bëhet i afërm e mahrem i familjes.">أما الزوج فإنه يجوز له أن يقذف المرأة إذا زنت ولم تحبل من الزنا، فإن حَبِلَت منه وولدت، فعليه أن يقذفها وينفي ولدَها، لئلا يلتحق به من ليس منه، ويصير ذا رحم لأقاربه ومَحْرَمًا لنسائه.</span></p>
<p><span class="s" data-sq="Kur e shpif, ose ajo pranon zinanë ose mohon. Nëse mohon, ai ka të drejtë ta bëjë lianu (betimin e ndërsjellë), siç përmendi Allahu në Kuran e transmeton Suneti.">فإذا قذفها فإما أن تقرَّ هي بالزنا وإما أن تنكر، فإن أنكرت فله أن يلاعنها، كما ذكر الله في الكتاب، وذُكِر في السنة.</span></p>
<p><span class="s" data-sq="Sikur shpifësi të jetë rob, mbi të bie gjysma e hadit të të lirit, po kështu në kamxhikun e zinasë e pirjes, sepse Allahu i Lartësuar tha për robëreshat:">ولو كان القاذف عبدًا فعليه نصف حدِّ الحر، وكذلك في جلد الزنا والشرب؛ لأن الله تعالىٰ قال في الإماء:</span> <span class="s quran" data-sq="...mbi to bie gjysma e ndëshkimit që u takon grave të lira [En-Nisa: 25]">﴿فَعَلَيْهِنَّ نِصْفُ مَا عَلَى الْمُحْصَنَاتِ مِنَ الْعَذَابِ﴾</span> <span class="s" data-sq="e kur obligimi është mbytja ose prerja e dorës, nuk gjysmohet.">وإذا كان الواجب القتل أو القطع لليد؛ فإنه لا يُنَصَّف.</span></p>`}
,{html:`<h2><span class="s" data-sq="Kapitull">فصل</span></h2>
<p><span class="s" data-sq="Nga të drejtat: martesat. Obligimi është gjykimi ndërmjet bashkëshortëve me atë që urdhëroi Allahu: mbajtje me mirësi ose lëshim me bukuri. Mbi gruan bie bindja ndaj tij e ruajtja e fshehtësisë në veten e pasurinë e tij siç urdhëroi Allahu. Obligohet secili bashkëshort t'ia kryejë tjetrit të drejtat me zemër të mirë e gëzim.">ومن الحقوق: الأبضاع، فالواجب الحُكم بين الزوجين بما أمر الله تعالىٰ به من إمساكٍ بمعروف أو تسريحٍ بإحسان، وعليها طاعته وحِفظ الغيب في نفسها وماله كما أمر الله تعالىٰ. ويجب علىٰ كلٍّ من الزوجين أن يؤدِّي إلىٰ الآخر حقوقَه بطيب نفسٍ وانشراح صدرٍ.</span></p>
<p><span class="s" data-sq="Sa i përket gruas: ajo ka mbi të të drejtë në pasurinë e tij dhe në trupin e tij. Sa për pasurinë: mehrin dhe shpenzimet me mirësi. Nëse mehri është menjëherë — i quajtur «i parashtruar» — ajo e kërkon para hyrjes. Nëse mehri është me afat — i quajtur «i vonuar» —">فأما المرأة؛ فلها عليه حقٌّ في ماله، ولها حقٌّ في بدنه، فأما المال؛ فالصداق والنفقة بالمعروف. فإن كان الصداق حالًّا ـ وهو الذي يسمىٰ:</span></p>`}
,{html:`<p><span class="s" data-sq="i parashtruar — ajo e kërkon para hyrjes. Ama i vonuari deri në afat të caktuar — i quajtur «i vonuar» nga njerëzit — ka qenë zakon i familjeve në këto kohëra të martohen me mehr të parashtruar e mehr të vonuar, duke u dakorduar para aktit gjatë fejesës zakonisht, e kur bëjnë aktin emërojnë të gjithën pa e ndarë si i parashtruar e i vonuar.">المقدَّم ـ فتستحق مطالبته به قبل الدخول. وأما المؤجَّل إلىٰ أجل مسمىٰ ـ وهو الذي تسميه الناس: المؤخر ـ قد جرت عادةُ البواهل هذا الزمان بأن يتزوجوا المرأة علىٰ مهرٍ مقدَّم ومهرٍ مؤخَّر، ويَشْتِرطا علىٰ ذلك قبل العقد عند الخِطبة غالبًا، ثم إذا عقدوا النكاح سمَّوا الجميعَ وأطلقوا، ولم يتعرضوا للفظ مقدَّم ولا مؤخَّر.</span></p>
<p><span class="s" data-sq="Kushti i paravendosur para aktit ka pozitën e kushtit bashkëshoqërues te shumica e selefit, ky është mendimi i njohur i Malikut, Ahmedit e të tjerëve, dhe mbi të tregon Kurani e Suneti.">والشرطُ المتقدم علىٰ العقود بمنزلة المقارن عند عامة السلف، وهو المشهور من قول مالك وأحمد وغيرها، وعليه يدل الكتاب والسنة.</span></p>
<p><span class="s" data-sq="Kur e marton me mehr të parashtruar e të vonuar pa caktuar afat, juristët kanë mospajtim rreth vlefshmërisë, shumica e selefit e vërtetojnë, sepse përfitimi përballë nuk ka afat të caktuar, ndryshe nga qiraja.">وإذا تزوجها علىٰ مقدَّم ومؤخَّر ولم يسمِّ أجلًا، فقد اختلف الفقهاء في صفحة هذه التسمية، وأكثر السلف علىٰ صحّتها؛ لأن ما يقابلها من المنفعة ليس بمؤجَّل إلىٰ أجل مسمىٰ، بخلاف المنفعة في الإجارة.</span></p>
<p><span class="s" data-sq="Pastaj u mospajtën: kur bëhet i pagueshëm i vonuari? Shumë ose shumica thanë: kur ndahen me vdekje, divorc e ngjashëm, dhe ky është medhhabi i Ahmedit e të tjerëve. Sipas kësaj, shumica e grave të këtyre kohërave nuk e kanë të drejtën t'i kërkojnë bashkëshortit mehrin e vonuar derisa të ndahen, dhe kjo është e sakta, sepse burri nuk hyri me mendimin se mehri i vonuar është i menjëhershëm si i parastrhruari, as gruaja nuk hyri me synimin t'ia kërkojë si borxh të menjëhershëm, por ia kërkon vetëm kur burri i bën dëm për qëllim të keq ose për ta detyruar në divorc,">ثم تنازعوا متىٰ يحل المؤجَّل؟ فقال كثير منهم ـ أو أكثرهم ـ: يحل إذا تفرقا بموت أو طلاق ونحوه، وهذا مذهب أحمد وغيره. وعلىٰ هذا فلا يستحق عامة نساء هذه الأزمان مطالبة الزوج بالمؤخَّر من الصداق حتىٰ يتفارقا، وهذا هو الصواب؛ فإن الرجل لم يدخل علىٰ أنه حالٌّ عليه بمنزلة المقدَّم، وبمنزلة ما يحل من الأيمان والأجور، ولا المرأةُ ـ أيضًا ـ دخلت علىٰ أنها تتقاضىٰ ما كان لها حالًّا من المقدَّم والثمن والأجرة، وإنما تتقاضاه حالِّيًا عند مضارَّة الرجل لغرضٍ فاسدٍ يريد أن يفعله، أو لتخليه إلىٰ طلاقها،</span></p>`}
,{html:`<p><span class="s" data-sq="ose ta pengojë nga vetja, ose të shkojë ku të dojë. Shumica e dëmit nga martesa vjen nga teprimi i gruas në kërkimin e mehrit të vonuar.">أو إلىٰ منعه من نفسها، أو أن تذهب حيث شاءت. وأكثر الضرار الحاصل من النكاح من جهة تكثُّر المرأة من المطالبة بالمؤخَّر من الصداق.</span></p>
<p><span class="s" data-sq="Kush shikon gjendjen e njerëzve kupton sa prishje ka në këtë, që nuk e sjell as politika e njeriut të mençur — lëre më Sheriati i Islamit — derisa masa e urren natyrshëm, sidomos kur i shtohet kësaj pranimi i fjalës së gruas për mospranimin e shpenzimeve duke banuar në shtëpinë e tij pesëdhjetë vjet pa pasur burim tjetër përveç tij, e ngjashëm nga gjykimet ku rrëshqiti dikush nga dijetarët, e u shkaktua sherr që bie ndesh me Sheriatin.">ومن تأمل أحوالَ الناس علم ما في ذلك من الفساد الذي لا تأتي به سياسةُ عاقلٍ فضلًا عن شريعة الإسلام، حتىٰ تنكره العامة بطباعها، لا سيما إذا أُضِيف إلىٰ ذلك قبول قولها في عدم قبض النفقة مع عدمها سكنها في منزله خمسين سنة، وليس لها جهة معلومة إلا هو، ونحو ذلك من الأحكام التي قد زلَّ بعضُ العلماء فحَصَل منهم من تلك المنزِلَّة من الشر ما ينافي الشريعة.</span></p>
<p><span class="s" data-sq="Ama shpenzimet janë me mirësi sipas vendit e kohës, dhe te shumica e juristëve si Ebu Hanife, Maliku e Ahmedi nuk janë të caktuara me Sheriat në masë e kufij, por me zakon, rriten e pakësohen sipas gjendjes së burrit, ndërsa nëse merret parasysh gjendja e gruas ka mospajtim te Ahmedi e të tjerë.">وأما النفقة فهي بالمعروف في ذلك المكان في ذلك الزمان، وهي عند جمهور الفقهاء كأبي حنيفة ومالك وأحمد ليست مقدَّرةً بالشرع قدرًا [ولا] حدًّا، بل هي معلومة بعرف، تزيد وتنقص بحسب حال الزوج، وفي اعتبارها بحال المرأة خلافٌ في مذهب أحمد وغيره.</span></p>
<p><span class="s" data-sq="A duhet t'ia bëjë pronë gruas — domethënë ngrënien si farz — apo mjafton ta lejojë të hajë në shtëpi siç kanë bërë njerëzit zakonisht? Dy mendime te juristët; i dyti më i ngjashëm me Kuranin e Sunetin, sepse në kohën e selefit nuk dihet grua që hante me farz, dhe ky është zakoni i njohur që">وهل يجب تمليك المرأة ذلك ـ وهو الذي يسمىٰ: الأكل ـ كالفرض أم يكفي تمكينها من الأكل في المنزل كما جرت به أعراف الناس وعادتهم قديمًا وحديثًا؟ فيه قولان للفقهاء، والثاني أشبَهُهما بالكتاب والسنة، فإنه لم يُعْرَف علىٰ عهد السلف امرأة كانت تأكل بالفرض، وهذا هو المعروف الذي</span></p>`}
,{html:`<p><span class="s" data-sq="urdhëroi Allahu.">أمر الله به.</span></p>
<p><span class="s" data-sq="Kanë mospajtim gjithashtu: a obligohet shpenzimi si lidhje farefisnore apo si shkëmbim si mehri e qiraja? Dy mendime: i pari mendim i Ebu Hanifes e Ahmedit në njërën transmetim, i dyti mendim i Shafiut e Ahmedit në mendimin e njohur.">واختلفوا ـ أيضًا ـ هل وجبت النفقة علىٰ وجه الصِّلة كنفقة الأقارب، أم علىٰ وجه المعاوضة كالصداق والأجرة؟ علىٰ قولين، فالأول قول أبي حنيفة وأحمد في رواية عنه. والثاني هو قول الشافعي وأحمد في المشهور عنه.</span></p>
<p><span class="s" data-sq="Sipas mendimit të parë shpenzimi bie me kalimin e kohës nëse nuk e cakton gjykatësi, e nuk ka të drejtë feshin e aktit për paaftësi të burrit. Sipas të dytit nuk bie me kalimin e kohës si qiraja, e ka të drejtë feshin për paaftësinë e tij, si paaftësia në marrëdhënie, po kështu edhe kur ai nuk pranon — në mendimin e saktë.">وبنوا علىٰ ذلك أنها علىٰ القول الأول تسقط بمضيِّ الزمان إذا لم يفرضها حاكم، ولا تستحق فسخ العقد بإعسار الزوج. وعلىٰ الثاني لا تسقط بمضيِّ الزمان كالأجرة، وتستحق الفسخ بعجزه عنها، كعجزه عن الوطء، وكذلك بامتناعها منه في الصحيح.</span></p>
<p><span class="s" data-sq="Sa për të drejtën e saj në trupin e tij, janë dy gjëra: bashkëjetesa e kënaqësia. Kur ai është i paaftë për marrëdhënie, si i tredhuri, ajo ka të drejtë feshin — njëzëri te dijetarët, po kështu kur ai është impotent — me përjashtim të rrallë.">وأما حقها في بدنه فشيئان: العِشرة والمتعة، بحيث لو كان عاجزًا عن الوطء، لكونه مجبوبًا استحقت الفسخ عند العلماء قاطبة، وكذلك لو كان عِنِّيتًا علىٰ خلافٍ شاذٍّ فيه.</span></p>
<p><span class="s" data-sq="Kur ai bën ila — betohet në Allahun se nuk do t'i afrohet plotësisht ose për kohë mbi katër muaj — ajo e meriton ndarjen me ixhmanë e myslimanëve, siç tregon Kurani i Madhërishëm:">ولو آلىٰ منها ـ وهو أن يحلف بالله أنه لا يطؤها مطلقًا أو مدةً تكون أكثر من أربعة أشهر ـ فإنها تستحق الفُرقة باتفاق المسلمين، كما دل عليه القرآن العظيم في قوله تعالىٰ:</span> <span class="s quran" data-sq="Ata që betohen se nuk do t'u afrohen grave të tyre kanë afat katër muaj, e nëse kthehen — All-llahu falë, mëshiron. E nëse vendosin divorcin — All-llahu dëgjon, di [El-Bekare: 226-227]">﴿لِّلَّذِينَ يُؤْلُونَ مِن نِّسَائِهِمْ تَرَبُّصُ أَرْبَعَةِ أَشْهُرٍ فَإِن فَاءُوا فَإِنَّ اللَّهَ غَفُورٌ رَّحِيمٌ ۝ وَإِنْ عَزَمُوا الطَّلَاقَ فَإِنَّ اللَّهَ سَمِيعٌ عَلِيمٌ﴾</span> <span class="s" data-sq="por shumica e tyre thonë: kur kalojnë katër muaj, ose i afrohet ose divorcon, e disa thonë:">لكنَّ أكثرهم يقولون: إذا مضت أربعة أشهر فإما أن يُمَكَّن وإما أن يطلق، ومنهم</span></p>`}
,{html:`<p><span class="s" data-sq="përkundrazi divorci bie vetvetiu me kalimin e katër muajve nëse nuk i afrohet.">من يقول: بل يقع الطلاق بمُضيِّ أربعة أشهر إذا لم يفئ منها.</span></p>
<p><span class="s" data-sq="Bashkëjetesa që është ndarja e radhës, dhe kënaqësia që është marrëdhënia = janë obligim mbi të siç tregon Kurani, Suneti e parimet, madje ky është qëllimi i martesës. Kërkesa e natyrshmërisë nuk e kundërshton obligimin, si mos-kundërshtimi i obligimit të ngrënies e pirjes. Profeti ﷺ i tha Abdullah ibn Amrit r.a. kur e pa se agjëronte pandërprerë: «Gruaja jote ka të drejtë mbi ty.» Sikur të mos kishte të drejtë marrëdhënieje, nuk do të kishte të drejtë feshin e martesës për paaftësinë e tij, as refuzimin e tij me arsye fetare.">والعِشرة التي هي القَسْم ابتداء، والمتعة التي هي الوطء= واجب عليه كما دل عليه الكتاب والسنة والأصول، بل هو مقصود النكاح، واقتضاء الطبع لا ينافي الوجوب، كما لا ينافي وجوب الأكل والشرب، وقد قال النبي ﷺ لعبد الله بن عَمرو رضي الله عنهما لما رآه يسرد الصوم: «إن لزوجكَ عليكَ حقًّا»، ولولا استحقاق الوطء لما ملكت فسخ النكاح بعجزه علىٰ الوطء، وامتناعه بالدين.</span></p>
<p><span class="s" data-sq="Është thënë: obligimi është njëherë në katër muaj, sepse kjo është koha e ilasë. Është thënë: obligohet me mirësi sipas fuqisë së tij e nevojës së saj, si shpenzimet me mirësi. Gjykatësi cakton çka i takon asaj kur ka mospajtim, si çka i takon atij, si shpenzimet e mehrin e ngjashëm. Dy mendimet janë në medhhebin e Ahmedit e të tjerëve; i dyti më i ngjashëm me Kuranin, Sunetin, parimet e interesin e njerëzve, dhe nevoja nuk plotësohet e dëmi nuk largohet veçse me këtë.">ثم قد قيل: الواجب مرة في كل أربعة أشهر؛ لأنها مدة التربُّص في الإيلاء. وقيل: يجب وطؤها بالمعروف علىٰ قدر قُوَّته وحاجتها، كما تجب النفقة بالمعروف كذلك، وكما أن الواجب له يستحقه بالمعروف علىٰ قدر قوتها وحاجته. والحاكم يقدِّر ما تستحقه من الوطء عند التنازع، كما يقدر ما يستحقه هو، وكما يقدر النفقة ومهر المثل، وكلا القولين في مذهب أحمد وغيره. والثاني أشبه بالكتاب والسنة والأصول ومصلحة الخلق، ولا تُقْضِىٰ حاجة الناس ويزول الضرر إلا به.</span></p>
<p><span class="s" data-sq="Sa për të drejtën e burrit mbi të: Muslimi transmeton në «Sahihun» e tij se Profeti ﷺ tha në hutben e tij:">وأما حق الرجل عليها؛ فقد روىٰ مسلم في «صحيحه» أن النبي ﷺ قال في خطبته ﷺ:</span> <span class="s hadith" data-sq="«Kini frikë Allahun për gratë, sepse ato janë robëresha te ju, dhe ju i morët me amanetin e Allahut, dhe i bëtë hallall intimitetin e tyre me fjalën e Allahut. Ju keni të drejtë që ato të mos lejojnë">«اتقوا الله في النساء فإنهنَّ عوانٍ عندكم، وأنكم أخذتموهنَّ بأمانة الله، واستحللتم فروجهنَّ بكلمة الله، ولكم أن لا يوطِئنَ</span></p>`}
,{html:`<p><span class="s hadith" data-sq="(vazhdim) shtretërit tuaj askënd që e urreni. Nëse bëjnë këtë, rrahini rrahje jo të rëndë, e mbi ju është furnizimi dhe veshja e tyre me mirësi.»">فُرُشَكم أحدًا تكرهونه، فإن فعلنَ ذلك فاضربوهن ضربًا غير مبرِّح، ولهنَّ عليكم رزقهنَّ وكسوتهنَّ بالمعروف».</span></p>
<p><span class="s" data-sq="Dhe tha ﷺ:">وقال ﷺ:</span> <span class="s hadith" data-sq="«Çdo grua që e thërret bashkëshorti i saj në shtrat e ajo refuzon, Ai që është në qiell është i hidhëruar ndaj saj derisa të gdhijë.»">«ما من امرأةٍ يدعوها زوجُها إلىٰ فراشه فتأبىٰ عليه إلا كان الذي في السماء ساخطًا عليها حتىٰ تصبح»</span> <span class="s" data-sq="e transmetuan të dy (Buhariu e Muslimi) në «Sahihet».">أخرجاه في «الصحيحين».</span></p>
<p><span class="s" data-sq="Dhe tha:">وقال:</span> <span class="s hadith" data-sq="«Sikur të urdhëroja dikë të bëjë sexhde, do t'i urdhëroja gruas t'i bëjë sexhde burrit të saj.»">«لو كنتُ آمرًا أحدًا بالسُّجود لأمرتُ المرأة أن تسجدَ لزوجها».</span></p>
<p><span class="s" data-sq="Ahmedi dhe Ibn Maxhe transmetojnë nga Abdullah ibn Ebi Eufi se tha: Muadhi erdhi në Sham, pa të krishterët t'u bëjnë sexhde peshkopëve e kryepriftërinjve. Mendoi se i Dërguari i Allahut ﷺ e meriton më shumë madhërimin. Kur erdhi tha: O i Dërguar i Allahut, pashë të krishterët t'u bëjnë sexhde kryetarëve, e mendova se ti e meriton më shumë madhërimin. Tha:">وروىٰ أحمد وابن ماجه عن عبد الله بن أبي أوفىٰ قال: قدم معاذ الشام فرأىٰ النصارىٰ تسجد لبطارقتها وأساقفتها، فرأىٰ في نفسه أن رسول الله ﷺ أحق أن يُعَظَّم، فلما قدم قال: يا رسول الله، رأيت النصارىٰ تسجد لبطارقتها وأساقفتها، فرأيتُ في نفسي أنك أحق أن تعظَّم، فقال:</span> <span class="s hadith" data-sq="«Sikur të urdhëroja dikë, do t'i urdhëroja gruas t'i bëjë sexhde burrit. Nuk ia kryen gruaja të drejtën e Allahut plotësisht derisa t'ia kryejë të drejtën e burrit plotësisht, edhe sikur ta pyeste veten e saj mbi shalën e devesë, do t'ia jepte.»">«لو كنت آمرًا أحدًا لأمرت المرأة أن تسجد لزوجها، ولا تؤدِّي المرأةُ حقَّ الله تعالىٰ كلَّه حتىٰ تؤدِّي حقَّ زوجها كله، ولو سألها نفسَها علىٰ ظهرِ قَتَبٍ لأعطته إيَّاه».</span></p>
<p><span class="s" data-sq="Kjo është e njëzëshme ndërmjet juristëve: se ai ka të drejtë të kënaqet me të kur të dojë, përderisa nuk e dëmton">وهذا متفق عليه بين الفقهاء: أن له أن يستمتع بها متىٰ ما شاء ما لم يضرّ</span></p>`}
,{html:`<p><span class="s" data-sq="ose nuk e pengon nga farzi, e ajo duhet ta lejojë. Po kështu ajo nuk del nga shtëpia e tij veçse me lejen e tij ose lejen e Sheriatit, sepse ajo është robëreshë pranë tij, e robëresha do të thotë: rob.">بها أو يشغَلْها عن فرض، فعليها أن تُمكِّنه كذلك ولا تخرج من منزله إلا بإذنه أو إذن الشارع، فإنها عانية عنده، والعاني: الأسير.</span></p>
<p><span class="s" data-sq="Duhet që kur ajo i kërkon leje të dalë për namaz, të mos e pengojë kur nuk ka prishje. Profeti ﷺ tha:">وينبغي له إذا استأذنته أن تخرج إلىٰ الصلاة أن لا يمنعها إذا لم يكن فيه مفسدة. قال النبي ﷺ:</span> <span class="s hadith" data-sq="«Mos i pengoni robëreshat e Allahut nga xhamitë e Allahut, por shtëpitë e tyre janë më mirë për to.»">«لا تمنعوا إماءَ الله مساجدَ الله وبيوتهنَّ خيرٌ لهنَّ».</span></p>
<p><span class="s" data-sq="Po kështu nuk e pengon nga vizita e të sëmurëve të familjes e ngushëllimi i tyre.">وكذلك لا يمنعها عيادة مرضىٰ أهلها وتعزيتهم.</span></p>
<p><span class="s" data-sq="A ka ai të drejtë mbi trupin e saj për shërbim, si shtrimin, fshirjen, gatimin e ngjashëm? Juristët kanë mospajtim: është thënë obligohet, është thënë nuk obligohet, është thënë obligohet e lehta siç e kërkon zakoni — dhe kjo ndryshon sipas zakoneve të njerëzve.">وهل له حق في بدنها من الخدمة، مثل الفرش والكنس والطبخ ونحو ذلك؟ اختلف الفقهاء فيه، فقيل: يجب عليها، وقيل: لا يجب، وقيل: يجب الخفيف منه، كالذي اقتضاه العُرف، وهو يختلف باختلاف عادات الناس.</span></p>
<p style="text-align:center;">❁ ❁ ❁</p>`}
,{html:`<h2><span class="s" data-sq="Kapitull">فصل</span></h2>
<p><span class="s" data-sq="Po kështu në marrëveshjet tregtare: shitblerjet, qiratë, përfaqësimet, ortakëritë, dhurimet, vakëfet, testamentet e ngjashëm nga marrëveshjet me akte e dorëzime — drejtësia në to është shtylla e botëve, nuk rregullohet dunja e ahireti pa të.">وكذلك في المعاملات من البياعات والإجارات والوكالات والمشاركات والهبات والوقوف والوصايا ونحو ذلك من المعاملات المتعلقة بالعقود والقبوض، فإن العدل فيها هو قوام العالمين لا تصلح الدنيا والآخرة إلا به.</span></p>
<p><span class="s" data-sq="Nga drejtësia në to ajo që është e qartë e njeh çdo njeri me mendjen e tij, si obligimi i blerësit të paguajë çmimin, i shitësit të dorëzojë mallin, ndalimi i pakësimit të masës e peshores, obligimi i sinqeritetit e sqarimit, ndalimi i gënjeshtrës, tradhtisë e mashtrimit, e se shpërblimi i borxhit është kthimi e falënderimi.">فمن العدل فيها ما هو ظاهر يعرفه كل أحد بعقله، كوجوب تسليم الثمن علىٰ المشتري وتسليم المبيع علىٰ البائع للمشتري وتحريم تطفيف المكيال والميزان ووجوب الصدق والبيان وتحريم الكذب والخيانة والغش، وأن جزاء القرض الوفاء والحمد.</span></p>
<p><span class="s" data-sq="Prej tyre ka të fshehta derisa erdhën Sheriatet ose Sheriati ynë. Shumica e ndalimeve nga Kurani e Suneti në marrëveshje kthehen te vërtetimi i drejtësisë e ndalimi i padrejtësisë, imtë e trashë, si ngrënia e pasurisë me të padrejtë e llojet e ribas e kumarit, si shitblerjet e rrezikshme, shitja e barkut të barkut, shitja e shpezëve në ajër e peshqve në ujë, shitja me afat të papërcaktuar, shitja e të rrejturit, e të mashtruarit, shitja me prekje e hedhjme, shkëmbimi i frutave me frutë, shpërdorimi, shitja e frutave para pjekjes, e ndalimi i ortakërive të prishura si mëbitakësia (marrja e copës së caktuar të tokës).">ومنها ما هو خفي حتىٰ جاءت به الشرائع أو شريعتنا أهل الإسلام فإن جمهور ما نهىٰ عنه الكتاب والسنة من المعاملات يعود إلىٰ تحقيق العدل والنهي عن الظلم دقه وجله، مثل أكل المال بالباطل وجنسه من الربا والميسر وأنواع الربا والميسر التي نهىٰ عنها النبي ﷺ مثل: بيع الغرر وبيع حَبَل الحبلة وبيع الطير في الهواء والسمك في الماء والبيع إلىٰ أجل غير مسمىٰ وبيع المصراة وبيع المدلس والملامسة والمنابذة والمزابنة والمحاقلة والنجش وبيع الثمر قبل بدو صلاحه، وما نهىٰ عنه من أنواع المشاركات الفاسدة كالمخابرة بزرع بقعة بعينها من الأرض.</span></p>
<p><span class="s" data-sq="Nga këto ka çështje ku myslimanët kanë mospajtim për fshehurën e paqartësinë, njëri e sheh aktin drejtësi e tjetri padrejtësi. Allahu i Lartësuar tha:">ومن ذلك ما قد تنازع فيه المسلمون لخفائه واشتباهه، فقد يرىٰ هذا العقد والقبض صحيحًا عدلًا وإن كان غيره يرىٰ فيه جورًا يوجب فساده، وقد قال الله تعالىٰ:</span> <span class="s quran" data-sq="Bindjuni All-llahut, bindjuni të dërguarit dhe përgjegjësve tuaj. Nëse nuk pajtoheni në ndonjë gjë, drejtohuni All-llahut dhe të dërguarit, nëse i besoni All-llahut dhe ditës së fundit. Kjo është më e mira dhe përfundimi më i bukur [En-Nisa: 59]">﴿أَطِيعُوا اللَّهَ وَأَطِيعُوا الرَّسُولَ وَأُولِي الْأَمْرِ مِنكُمْ فَإِن تَنَازَعْتُمْ فِي شَيْءٍ فَرُدُّوهُ إِلَى اللَّهِ وَالرَّسُولِ إِن كُنتُمْ تُؤْمِنُونَ بِاللَّهِ وَالْيَوْمِ الْآخِرِ ذَٰلِكَ خَيْرٌ وَأَحْسَنُ تَأْوِيلًا﴾</span></p>
<p><span class="s" data-sq="Parimi: nuk ndalohet njerëzve nga marrëveshjet që u nevojiten veçse ajo që Kurani e Suneti tregon ndalimin, siç nuk u ligjësohet nga ibadetet veçse ajo që Kurani e Suneti tregon ligjshmërinë, sepse feja është çka ligjëroi Allahu e harami çka ndaloi Allahu,">والأصل في هذا أنه لا يحرم علىٰ الناس من المعاملات التي يحتاجون إليها إلا ما دل الكتاب والسنة علىٰ تحريمه، كما لا يشرع لهم من العبادات التي يتقربون بها إلىٰ الله إلا ما دل الكتاب والسنة علىٰ شرعه، إذ الدين ما شرعه الله والحرام ما حرَّمه الله</span></p>`}
,{html:`<p><span class="s" data-sq="ndryshe nga ata që Allahu i qortoi: ndaluan atë që Allahu nuk e ndaloi, i shoqëruan Atij çka nuk zbriti argument, dhe ligjëruan fe çka nuk e lejoi Allahu. O Zot, na bëj që hallallin ta bëjmë hallall, haramin haram e fenë çka Ti ligjërove.">بخلاف الذين ذمهم الله حيث حرموا من دون الله ما لم يحرمه الله، وأشركوا به ما لم ينزل به سلطانًا، وشرعوا لهم من الدين ما لم يأذن به الله، اللهم وفقنا لأن نجعل الحلال ما حللته والحرام ما حرمته والدين ما شرعته.</span></p>
<p><span class="s" data-sq="Sa i përket gjykimit në pasuri: obligohet gjykimi ndërmjet njerëzve me drejtësi siç urdhëroi Allahu e i Dërguari i Tij, si ndarja e trashëgimive ndërmjet trashëgimtarëve sipas Kuranit e Sunetit.">وأما الحكم في الأموال؛ فيجب الحكم بين الناس فيها بالعدل كما أمر الله ورسوله، مثل قَسْم المواريث بين الورثة علىٰ ما جاء به الكتاب والسنة.</span></p>
<p><span class="s" data-sq="Profeti ﷺ tha:">قال النبي ﷺ:</span> <span class="s hadith" data-sq="«Allahu ia ka dhënë çdo të drejti të drejtën e tij, e nuk ka testament për trashëgimtarin.»">«إن الله قد أعطىٰ كلَّ ذي حقٍّ حقه، ولا وصية لوارث»</span></p>
<p><span class="s" data-sq="Kur Allahu përmendi obligimet — ato të shtyllës brezore nga rrënjët e degët, e ato anësore nga bashkëshortët e kelalet — tha i Madhëruari:">ولما ذكر الله الفرائض ـ فرائض عمود النسب من الأصول والفروع وفرائض الأطراف من الزوجين والكلالة ـ قال سبحانه وتعالىٰ:</span> <span class="s quran" data-sq="Këto janë dispozitat e All-llahut. Kush respekton All-llahun dhe të dërguarin e Tij, Ai e fut në xhenete nën të cilët rrjedhin lumenj, aty do të jenë përgjithmonë. E kjo është fitore e madhe. Kush e kundërshton All-llahun dhe të dërguarin e Tij dhe i shkel dispozitat e Tij, Ai e fut në zjarr ku do të jetë përgjithmonë, dhe ai ka ndëshkim poshtërues [En-Nisa: 13-14]">﴿تِلْكَ حُدُودُ اللَّهِ وَمَن يُطِعِ اللَّهَ وَرَسُولَهُ يُدْخِلْهُ جَنَّاتٍ تَجْرِي مِن تَحْتِهَا الْأَنْهَارُ خَالِدِينَ فِيهَا وَذَٰلِكَ الْفَوْزُ الْعَظِيمُ ۝ وَمَن يَعْصِ اللَّهَ وَرَسُولَهُ وَيَتَعَدَّ حُدُودَهُ يُدْخِلْهُ نَارًا خَالِدًا فِيهَا وَلَهُ عَذَابٌ مُّهِينٌ﴾</span></p>`}
,{html:`<p><span class="s" data-sq="Ndalohet i sëmuri të veçojë disa trashëgimtarë me dhuratë ose testament, ose të bëjë hile, ose të dëshmohet mbi pranim të mësuar ose të rremë. Prandaj trashëgohen gratë e fëmijët ndryshe nga xhahilijeti, e barazohen ata që Allahu i barazoi.">فيُمْنَع المريض أن يخص بعضَ الورثة بعطيَّة أو وصية، أو يحتال علىٰ ذلك، أو يَشهدوا علىٰ إقرار قد لَقَّنوه أو عَرَفوا بطلانه، ولذلك تورَّث النساء والصِّغار بخلاف ما كان عليه أهل الجاهلية، وما قد عاد إليه كثير من الأعراب، ويسوِّىٰ بين من سوَّىٰ الله بينه وبين ولد الحرَّة والأمة.</span></p>
<p><span class="s" data-sq="Sahabët e pasardhësit kanë mospajtim në disa çështje trashëgimie, si gjyshi me vëllezërit, çështja e përbashkët, dy umerijet e ngjashëm.">وقد تنازع الصحابة ومن بعدهم في بعض مسائل الفرائض، كالجد مع الإخوة والمشرَّكة والعمريتين وغير ذلك.</span></p>
<p><span class="s" data-sq="Po kështu dituria me drejtësinë në marrëveshje — drejtësia në to është shtylla e botëve. Nga drejtësia e qartë që njeh çdokush, siç tha Allahu:">وكذلك العلم بالعدل في المعاملات؛ من البياعات والإجارات والوكالات والمشاركات والهبات والوقوف والوصايا، ونحو ذلك من المعاملات المتعلقة بالعقود والقبوض، فإنَّ العدلَ فيها هو قِوام العالمين لا تصلح الدنيا والآخرة إلا به. فمن العدل فيها ما هو ظاهرٌ يعرفه كلُّ أحد بعقله، وهو من المعروف الذي قال الله تعالىٰ:</span> <span class="s quran" data-sq="...i urdhëron me të mirën [El-A'raf: 157]">﴿يَأْمُرُهُم بِالْمَعْرُوفِ﴾</span> <span class="s" data-sq="si obligimi i pagesës, dorëzimit, ndalimi i mashtrimit, obligimi i sinqeritetit. Prej tyre ka të fshehta derisa erdhën Sheriatet,">كوجوب تسليم الثمن علىٰ المشتري، وتسليم المبيع علىٰ البائع، وتحريم تطفيف المكاييل والموازين، ووجوب الصِّدق والبيان، وتحريم الكذب والخيانة والغش، وأن جزاء القرض الوفاء والحمد. ومنها ما هو خفيٌّ علىٰ العقول حتىٰ جاءت به الشرائع وشريعتنا أهل الإسلام،</span></p>`}
,{html:`<p><span class="s" data-sq="shumica e ndalimeve kthehen te drejtësia e ndalimi i padrejtësisë, si riba, kumari e llojet e ndryshme të shitblerjeve të ndaluara — rreth dyzet lloje. E nga ortakëritë e prishura, e nga çështjet e diskutueshme ndërmjet myslimanëve.">تحقيق العدل والنهي عن الظلم دقَّه وجلَّه، مثل أكل المال بالباطل الذي حرَّمه القرآن، وذكَّر جِنْسيه: الربا والميسر، ومثل أنواع الربا والميسر التي نهىٰ عنها النبي ﷺ؛ مثل بيع الغَرَر، وبيع حَبَل الحَبَلة، وبيع الطير في الهواء، والسَّمك في الماء، والبيع إلىٰ أجل غير مسمىٰ، وبيع المصرَّاة، وبيع المدلَّس، وبيع الملامسة، والمنابذة، والمزابنة، والمحاقلة، والنَّجَش، وبيع الثَّمر قبل بُدُوِّ صلاحه، وغير ذلك، وهي نحو أربعين نوعًا من البيع. وما نهىٰ عنه من أنواع المشاركات الفاسدة؛ كالمخابرة بزرع بقعة من الأرض، ومن ذلك ما قد تنازع فيه المسلمون لخفائه واشتباهه.</span></p>
<p><span class="s" data-sq="Parimi: nuk ndalohet veçse ajo që Kurani e Suneti tregon ndalimin, siç nuk ligjësohet ibadet veçse me Kuran e Sunet. O Zot, na bëj ta bëjmë hallallin hallall, haramin haram e fenë çka ligjërove.">والأصل في هذا: أنه لا يُحَرَّم علىٰ الناس في المعاملات التي يحتاجون إليها إلا ما دلَّ الكتابُ والسنةُ علىٰ تحريمه، كما لا يُشْرَع لهم من العبادات التي يتقربون بها إلىٰ الله إلا ما دلَّ الكتاب والسنة علىٰ شرعه؛ إذ الدين ما شرعه الله والحرام ما حرَّمه الله، بخلاف الذين ذمَّهم الله، حيث حرَّموا من دون الله ما لم يحرمه الله، وأشركوا به ما لم ينزلْ به سلطانًا، وشرعوا من الدين ما لم يأذن به الله، اللهم فوقَّقنا لأن نجعل الحلال ما حللته والحرام ما حرمته والدين ما شرعته.</span></p>`}
,{html:`<p><span class="s" data-sq="Mbi qeveritarin bie të parandëshkojë marrëveshjet e ndaluara e të ndëshkojë vepruesit, si mashtrimi. Muslimi transmeton nga Ebu Hurejra r.a. se i Dërguari i Allahut ﷺ kaloi pranë grumbullit të ushqimit, futi dorën, gjetët lagështi, e tha:">وعلىٰ ولي الأمر أن يتقدم بالنهي عن المعاملات المحرَّمة وعقوبة فاعليها مثل الغِشّ، فقد روىٰ مسلم في «صحيحه» عن أبي هريرة رضي الله عنه أن رسول الله ﷺ مرَّ علىٰ صُبْرة طعام فأدخل يدَه فيها فنالت أصابعه بللًا فقال:</span> <span class="s hadith" data-sq="«Çka është kjo, o pronar i ushqimit?!»">«ما هذا يا صاحبَ الطعام؟!»</span> <span class="s" data-sq="Tha: E goditi shiu. Tha:">قال: أصابته السماءُ يا رسول الله، قال:</span> <span class="s hadith" data-sq="«Pse nuk e vure sipër që ta shohin njerëzit? Kush mashtron nuk është prej meje.»">«أفلا جعلتَه فوقَّ الطعام حتىٰ يراه الناسُ، من غشَّ فليسَ منِّي»</span> <span class="s" data-sq="në transmetim tjetër:">وفي رواية:</span> <span class="s hadith" data-sq="«Kush na mashtron nuk është prej nesh.»">«من غَشَّنا فليسَ مِنَّا».</span></p>
<p><span class="s" data-sq="Ghishi: emër për çdo kë që tregon prej mallit të kundërtën e brendësisë, si zbukurimi i sipërfaqes së ushqimeve e fshehja e të keqes brenda, e kështu me kafshët — grumbullimi i qumështit dy-tri ditë para shitjes. Profeti ﷺ tha:">والغِشُّ: اسم جامع لكل من أظهر من المبيع خلافَ باطنه، مثل الذين يحسِّنون ظاهر الأطعمة من الثمار والحبوب ونحوها، ويجعلون الرديء في باطنها، ويفعلون مثل ذلك في الحيوان؛ كتصرية الإبل والغنم، وهو أن يجمع اللبن في ضرعها يومين أو ثلاثة ثم يبيعها، فيظن المشتري أنها تحلب كلَّ يوم بقدر ما في الضرع، قال النبي ﷺ:</span> <span class="s hadith" data-sq="«Mos e grumbulloni qumështin e devesë e deles! Kush e blen, pasi ta mjelë — nëse kënaqet e mban, nëse jo e kthen bashkë me sa' hurma.»">«لا تصروا الإبل والغنم، فمن ابتاعها بعدُ أن يحلبها، إن رضيها أمسكها وإن سخطها ردَّها وصاعًا من تمر»</span> <span class="s" data-sq="e transmetuan në «Sahihet».">أخرجاه في «الصحيحين».</span></p>
<p><span class="s" data-sq="Shembull: skuqja e fytyrës së robëreshës, nxirja e flokëve e kaçurrelsimi.">ومثال ذلك: تحمير وجه الجارية، وتسويد شعرها وتجعيده.</span></p>`}
,{html:`<p><span class="s" data-sq="Po kështu mashtrimi në zanate, si prodhuesit me pagesë ose për vete; endësit, gatuesit, bukëpjekësit, pjekësit, mullinjëve, ndërmjetësve — mashtrimi shtohet te këta, dhe kjo është tradhtia e mungesës së sinqeritetit.">وكذلك الغش في الصناعات، كمن يصنع للناس بالأجرة، أو من يصنع لنفسه ثم يبيع الناس؛ من النسَّاجين، والطبَّاخين، والخبَّازين، والشوَّائين، والطحَّانين، والمناديين، والسَّماسرة= فإنَّ الغشَّ يكثر في هؤلاء، وهو من الخيانة وعدم النصيحة.</span></p>
<p><span class="s" data-sq="Në «Sahih» nga Xherir ibn Abdullah: I dhashë besën të Dërguarit ﷺ për sinqeritet ndaj çdo myslimani.">وفي «الصحيح» عن جرير بن عبد الله قال: بايعتُ رسولَ الله ﷺ علىٰ النُّصْح لكلِّ مسلم.</span></p>
<p><span class="s" data-sq="Në «Sahihet» nga Hakim ibn Hizam, tha i Dërguari ﷺ:">وفي «الصحيحين» عن حكيم بن حزام قال: قال رسول الله ﷺ:</span> <span class="s hadith" data-sq="«Dy shitblerësit kanë zgjedhje përderisa nuk ndahen. Nëse janë sinqertë e sqarojnë, bekohet shitblerja; nëse gënjejnë e fshehin, zhduket bekimi.»">«البيِّعان بالخيار ما لم يتفرَّقا، فإن صَدَقا وبيَّنا بُورِكَ في بيعهما وإن كَذَبا وكتما مُحِقت بركة بيعهما».</span></p>
<p><span class="s" data-sq="Nga mashtrimi më i madh: mashtrimi në monedha — dirhemet e dinarët. Askush nuk pret monedha veçse me urdhër sundimtari. Nuk i lejohet sundimtarit të thyejë monedhën e myslimanëve për fitim ose emër. Ebu Daudi transmeton se Profeti ﷺ">ومن أعظم الغش: الغش في جنس الأثمان؛ من الدراهم والدنانير والمصوغ منهما، فلا يمكن أحدًا أن يضرب الدراهم والدنانير إلا بأمر السلطان خوفًا من الغش، ولا يجوز لذي سلطان أن يكسر سكة المسلمين ليربح فيها، أو لأجل كتابة اسم، فقد روىٰ أبو داود في «سننه» أن النبي ﷺ</span></p>`},
{html:`<p><span class="s" data-sq="Ka ndaluar nga thyerja e monedhës së vlefshme të myslimanëve ndërmjet tyre, përveçse kur ka nevojë.">نهىٰ عن كَسر سكة المسلمين الجائزة بينهم إلا من بأس.</span></p><p><span class="s" data-sq="Disa nga të parët thanë: thyerja e monedhës së myslimanëve është shkatërrim në tokë.">وقال بعض السلف: كسر سكة المسلمين من الفساد في الأرض.</span></p><p><span class="s" data-sq="Është thënë se kjo ishte ndër gjërat për të cilat Allahu qortoi popullin e Shuajbit, ku tha:">وقد قيل: إنه مما عابه الله عز وجل علىٰ قوم شعيب حيث قال:</span> <span class="s quran" data-sq="Dhe mos u bëni njerëzve dëm në gjërat e tyre dhe mos bëni çrregullime në tokë! [Hud: 85]">﴿وَلَا تَبْخَسُوا النَّاسَ أَشْيَاءَهُمْ وَلَا تَعْثَوْا فِي الْأَرْضِ مُفْسِدِينَ﴾ [هود: ٨٥].</span></p><p><span class="s" data-sq="Po, lejohet thyerja e monedhës së falsifikuar, sepse nëse njerëzit lejohen ta bëjnë këtë, nuk dallohet sasia e falsifikimit. Transmetohet nga Haseni nga Profeti ﷺ se ka ndaluar përzierjen e qumështit me ujë për shitje. Kjo do të thotë se lejohet përzierja e qumështit për pirje, por jo për shitje, edhe nëse blerësi e di se është i përzier, sepse nuk dallohet sasia e përzierjes.">نعم يجوز كسر السِّكة المغشوشة، فإن الناس إذا مُكِّنوا من ذلك لم يتبين مقدار الغش. وقد رويٰ الحسن عن النبي ﷺ: أنه نهىٰ عن شَوْب اللبن بالماء للبيع. يعني أنه يجوز أن يُشاب اللبن للشرب، فأما البيع فلا يجوز وإن علم المشتري أنه مشوب؛ لأنه لا يتبين مقدار الشَّوْب.</span></p><p><span class="s" data-sq="Ndër llojet më të mëdha të mashtrimit është alkimia, që është prodhimi i diçkaje që i ngjan arit dhe argjendit. Po ashtu prodhohen imitime të gurëve të çmuar, parfumeve si mysku, shafrani, ambra e të tjera. Kuptimi i alkimisë është: ngjasimi. E gjithë kjo është haram, sepse produkti i prodhuar nuk mund të jetë kurrë si krijimi hyjnor, dhe qëllimi i fundit është vetëm t'i ngjajë atij në pamje dhe në disa cilësi.">ومن أعظم أنواع الغش: الكيمياء، وهو عمل ما يشبه الذهب والفضة، وكذلك يعمل ما يشبه الجواهر والطِّيب من المِسك والزعفران والعنبر وغير ذلك. ومعنىٰ الكيمياء: الشَّبَه. فإن ذلك كله محرم، إذ لا يكون المصنوع مثل المخلوق قط، وإنما غايته أن يُشَبَّه به في الظاهر وفي بعض صفاته.</span></p>`},
{html:`<p><span class="s" data-sq="Allahu nuk ka krijuar asgjë duke u dhënë krijesave rrugë të krijojnë si krijimi i Tij, as nuk i ka aftësuar të shndërrojnë një lloj krijimi në lloj tjetër. Njerëzit vetëm prodhuan xhamin, sepse Allahu nuk krijoi xham siç krijoi ar e argjend.">ولم يخلق الله شيئًا وجعلَ للخلق سبيلًا أن يخلقوا كخلقه ولا أقدرهم علىٰ أن ينقلوا نوعًا من أنواع خلقه إلىٰ نوع آخر، وإنما صَنَعَ الناسُ الزجاجَ، لأن الله لم يخلق زجاجًا كما خلقَ ذهبًا وفضة.</span></p><p><span class="s" data-sq="Të mençurit e bijve të Ademit janë dakordësuar se qëllimi përfundimtar i alkimisë është falsifikimi cilësor që nuk zbulohet veçse pas kohës së gjatë. Me alkiminë merren vetëm dy lloj njerëzish: pak-mendshi që besojnë në vërtetësinë e saj, ose pak-fetarë që e lejojnë shpenzimin e monedhës së falsifikuar. Tregime të sakta rreth saj tregojnë vetëm falsifikime cilësore që kalojnë edhe shumë ekspertë. Dënimi i këtyre është ndër detyrimet më të mëdha. Gjendja e shumë njerëzve u prish nga kjo. Prandaj juristët nuk e diskutojnë zekatin e alkimisë siç diskutojnë atë të mineraleve e thesarëve, sepse minerali ka realitet — thesarët e lashtë të quajtur matalet — ndërsa alkimia nuk ka realitet.">وقد اتفق عقلاء بني آدم علىٰ أن غاية الكيمياء الزَّغَل الجيد الذي لا ينكشف إلا بعد مدة طويلة، ولا يتعلَّق بها إلا أحد رجلين: قليل العقل يعتقد صِحَّتها، أو قليل الدين يستحل إنفاق المغشوش. ومما يُذكر فيها من الحكايات الصحيحة غايته المغشوش الجيد الذي يروج علىٰ خلق من النقّاد، فالإنكارُ علىٰ هذا الضرب وعقوبتهم من أعظم الواجبات. وأكثر ما فسَدَ حالُ كثير من الناس من هذا الوجه، ولهذا لم يذكر الفقهاء ما يجب في الكيمياء كما يجب في المعدن والركاز، إذ كان للركاز حقيقة، وهي الكنوز العادية التي تسمىٰ المطالب، وليس للكيمياء حقيقة.</span></p><p><span class="s" data-sq="Kush pretendon se Profeti ﷺ ose Musai — alejhi selam — e praktikonte ose e mësonte alkiminë, ka gënjyer e ka shpifur. Xhabir ibn Hajjani, të cilit i atribuohen veprat e alkimisë, është i panjohur, plot kontradikta e përçarje.">ومن ادعىٰ علىٰ النبي ﷺ أو علىٰ موسىٰ ـ عليه السلام ـ أنه كان يَعْملها أو يُعَلِّمها فقد كذب وافترىٰ. وجابر بن حيَّان الذي تُعْزَىٰ إليه مصنفاتها مجهولٌ كثير التخليط والتناقض.</span></p>`},
{html:`<p><span class="s" data-sq="Alkimia është nga gjinia e simijas (magjisë iluzioniste), që është magji e cila e paraqet gjënë ndryshe nga ç'është në të vërtetë, siç tregoi Allahu i Lartësuar për magjistarët e popullit të Faraonit se i thanë Musait:">والكيمياء من جنس السيمياء، وهو السحر الذي يُخَيِّل الشيَّ بخلاف ما هو عليه، كما حكىٰ الله تعالىٰ عن سَحَرة قوم فرعون أنهم قالوا لموسىٰ:</span> <span class="s quran" data-sq="'Ose hidh ti, ose do të hedhim ne të parët!' Ai tha: 'Jo, hidhni ju!' Kur ja, atij iu duk se litarët dhe shkopinjtë e tyre nga magjia e tyre lëviznin vërtet. [Ta Ha: 65-66]">﴿إِمَّا أَن تُلْقِيَ وَإِمَّا أَن نَّكُونَ أَوَّلَ مَنْ أَلْقَىٰ ۝ قَالَ بَلْ أَلْقُوا فَإِذَا حِبَالُهُمْ وَعِصِيُّهُمْ يُخَيَّلُ إِلَيْهِ مِن سِحْرِهِمْ أَنَّهَا تَسْعَىٰ﴾ [طه: ٦٥].</span></p><p><span class="s" data-sq="Thuhet se ata e arritën këtë duke vënë zhivë brenda tyre, dhe kur u nxeh dielli, zhiva lëvizi dhe i bëri ato të duken si të gjalla. Kjo i ngjan mashtrimit që bëjnë murgjit e krishterë me çudira false, si ata që mburren me devotshmëri pa pasur realitet. E gjithë kjo është lloj gënjeshtre, hipokrizie, mashtrimi, dinakërie e intrige, dhe të gjithë këta e meritojnë dënimin e ashpër, për shkak të dëmit që u sjellin vetes dhe njerëzve në fenë e dynjanë e tyre.">فيقال: إنهم تحيلوا علىٰ ذلك بزئبق وضعوه فيها، فلما حمي الحرُّ تحرَّك الزئبق بها. وهو نظير ما يفعله رهبان النصارىٰ من المخاريق والمصعون، ممن ينسب إلىٰ الصلاح بلا حقيقة. وكل هذا من نوع الكذب والنفاق والغش والخديعة والمكر، وكل هؤلاء يستحق العقوبة البالغة؛ لما فيهم من الضرر علىٰ أنفسهم وعلىٰ الناس في دينهم ودنياهم.</span></p><p><span class="s" data-sq="Sa i përket njohjes së këtyre gjërave pa mashtruar askënd, por për të kundërshtuar mashtruesin dhe për të zbuluar mashtrimin e tij — kjo mund të jetë e dobishme, sepse po të mos njihej">فأما معرفة هذه الأشياء بلا غشٍّ لأحد لكن لمعارضة المُبطِل وكشف غِشِّه وتدليسِه= فإنه قد ينتفع بذلك، إذ لولا معرفة</span></p>`},
{html:`<p><span class="s" data-sq="e vërteta, e kota do të qarkullonte te shumë që nuk e njohin atë.">الحق لنفق الباطل عند كثير ممن لا يعرفها.</span></p><p><span class="s" data-sq="Po, Allahu mund t'ia thyejë zakonin kujt të dojë nga robërit e Tij me mrekulli profetësh e keramete të devotshmëve. Por kjo nuk varet nga mjetet që i përdorin mashtruesit e alkimisë e magjisë. Madje Allahu mund t'i kthejë patëllxhanët e guralecët në ar e argjend për këdo që dëshiron, edhe pse zakonisht këta njerëz i shpenzojnë ato edhe sikur Allahu t'ua kthente.">نعم قد يخرق العادة لمن شاء من عباده بمعجزات الأنبياء وبكرامات الصالحين، ولكن ذلك لا يقف علىٰ الأسباب التي يتعاطاها أهل الغش من الكيمياوية والسَّحَرة، بل قد يقلب الله الباذنجان والحصىٰ ذهبًا وفضةً لمن شاء، مع أن عامة هؤلاء ينفقون منها ولو قلبها الله لهم.</span></p><p><span class="s" data-sq="Ndër detyrat e sundimtarit është gjithashtu mbikëqyrja e përgjegjësve të hisbes (inspektimit të tregut) dhe çmimet që vendosin ndaj myslimanëve, si edhe bashkëpunimi i shitësve të miellit e të tjerave për ryshfetin që marrin. Dëmi i kësaj është i përgjithshëm. Nëse inspektori i tregut nuk është nga ata që i frikësohen Allahut dhe i besohet ndershmëria, atëherë paratë që i jepen do të tundonin edhe më të mirët. Këta njerëz ua hanë hakun njerëzve dhe bëjnë çrregullime në tokë, duke i bërë ata objekt i lakmisë së madhe për pasurinë e ndyrë që fitojnë, duke shpenzuar shumë për të — por ajo është pak nga e shumta.">ومما يتعين أيضًا علىٰ ولي الأمر: النظر في ولاة الحِسْبة وما يدخلون لله من أسعار المسلمين ومداهنة باعة الدقيق وغيره لما ينالهم من السُّحْت، فإن مضرة هذا عامة، وإن لم يكن ناظر الحِسْبة ممن يخشىٰ الله ويوثق بأمانته، وإلا فما يُنْزَل له من المال يزلزل أمثاله، فإن هؤلاء الذين يبخسون الناسَ أشياءهم ويعثون في الأرض مفسدين، فجعلهم غرض عظيم فيما يحصلونه من المال الخبيث، فيبذلون فيه عظيمًا، وهو قليل من كثير،</span></p><p><span class="s" data-sq="dhe paraardhësit e tyre i patën thënë Shuajbit ﷺ:">فقد قال سلفهم قديمًا لشعيب ﷺ:</span> <span class="s quran" data-sq="'O Shuajb, a namazi yt po të urdhëron që ne t'i braktisim ato që i adhuronin prindërit tanë, ose të mos bëjmë me pasurinë tonë çka të duam?! Vërtet, ti qenke i butë e i mençur!' [Hud: 87]">﴿أَصَلَوٰتُكَ تَأْمُرُكَ أَن نَّتْرُكَ مَا يَعْبُدُ ءَابَآؤُنَا أَوْ أَن نَّفْعَلَ فِىٓ أَمْوَٰلِنَا مَا نَشَآءُ ۖ إِنَّكَ لَأَنتَ ٱلْحَلِيمُ ٱلرَّشِيدُ﴾ [هود: ٨٧].</span></p><p><span class="s" data-sq="Duke ditur se këto çështje janë nga të drejtat publike që duhen kryer si fillim, si çështje e të drejtave të Allahut — nuk janë hak i një njeriu të caktuar — por shpesh ankesa ndodh nga individë të caktuar, kështu që ato hyjnë në fushën e gjykimit ndërmjet njerëzve në pasuri e çështje gjyqësore, dhe gjykimi në to është si ai në gjërat e ngjashme. Allahu e di më mirë.">مع أن هذه الأشياء هي من الحقوق العامة التي يجب القيام بها ابتداءً كأمر حقوق الله ليست حقًا لآدمي معيَّن لكن كثيرًا ما يقع الشكوىٰ فيها من المعينين، فهي داخلة في الحكم بين الناس في الأموال والقضاء، والحكم فيها كأمثالها، والله أعلم.</span></p><p class="section-mark">❊ ❊ ❊</p>`},
{html:`<p class="section-title">فصل</p><p><span class="s" data-sq="Sundimtari nuk bën pa konsultim, sepse Allahu e urdhëroi këtë profetin e Tij, duke thënë i Lartësuari:">لا غنىٰ لولي الأمر عن المشاورة، فإن الله أمر بها نبيه، قال سبحانه وتعالىٰ:</span> <span class="s quran" data-sq="...pra falju atyre, kërko ndjesë për ta dhe konsultohu me ta në çështje. E kur të vendosësh, mbështetu në Allahun, se Allahu i do ata që mbështeten. [Al Imran: 159]">﴿فَاعْفُ عَنْهُمْ وَاسْتَغْفِرْ لَهُمْ وَشَاوِرْهُمْ فِي الْأَمْرِ فَإِذَا عَزَمْتَ فَتَوَكَّلْ عَلَى اللَّهِ إِنَّ اللَّهَ يُحِبُّ الْمُتَوَكِّلِينَ﴾ [آل عمران: ١٥٩].</span></p><p><span class="s" data-sq="Transmetohet nga Ebu Hurejra — Allahu qoftë i kënaqur me të — se ka thënë: Askush nuk ishte më i shumtë në konsultim me shokët e tij se sa i Dërguari i Allahut ﷺ.">وقد رُوي عن أبي هريرة رضي الله عنه قال: لم يكن أحدٌ أكثر مشاورةً لأصحابه من رسول الله ﷺ.</span></p><p><span class="s" data-sq="Është thënë se Allahu i Lartësuar e urdhëroi Profetin e Tij ﷺ me konsultim për t'ua afruar zemrat shokëve të tij, që të merret shëmbull prej atij që vjen pas tij, dhe për të nxjerrë mendimin e tyre në gjërat ku nuk ka zbritur shpallje — si çështjet e luftës, strategjisë ushtarake e të ngjashme. Nëse kjo vlen për të ﷺ, dikush tjetër ka edhe më shumë nevojë për konsultim.">وقد قيل: إن الله تعالىٰ أمر بها نبيَّه ﷺ لتاليف قلوب أصحابه، وليقتدي به من بعده، وليَسْتَخْرج منهم الرأي فيما لم ينزل فيه وحي من أمر الحروب والأمور الحربية وغير ذلك؛ فغيره ﷺ أولىٰ بالمشاورة.</span></p><p><span class="s" data-sq="Allahu i Lavdishëm e i Lartësuar i ka lavdëruar besimtarët për këtë, duke thënë i Lartësuari:">وقد أثنىٰ الله سبحانه وتعالىٰ علىٰ المؤمنين بذلك، فقال تعالىٰ:</span> <span class="s quran" data-sq="...dhe punët e tyre i kryejnë me konsultim të ndërsjellë, dhe nga ajo që Ne u kemi dhënë, ata japin. [Esh-Shura: 38]">﴿وَأَمْرُهُمْ شُورَىٰ بَيْنَهُمْ وَمِمَّا رَزَقْنَاهُمْ يُنفِقُونَ﴾ [الشورىٰ: ٣٨].</span> <span class="s" data-sq="Dhe kur i konsulton, nëse dikush prej tyre i tregon atë që duhet ndjekur nga Libri i Allahut e Syneti i të Dërguarit, ose nga konsensusi i myslimanëve, atij duhet t'i bindet, dhe nuk ka bindje ndaj askujt kundër kësaj, edhe nëse ai është i madh në fe ose">وإذا استشارَهم، فإن بيَّن له بعضهم ما يجبُ اتباعُه من كتاب الله وسنة رسوله، أو إجماع المسلمين؛ فعليه اتباع ذلك، ولا طاعة لأحدٍ في خلاف ذلك، وإن كان عظيمًا في الدين أو</span></p>`},
{html:`<p><span class="s" data-sq="në dynja. Allahu i Lartësuar thotë:">الدنيا، قال الله تعالىٰ:</span> <span class="s quran" data-sq="O ju që besuat, bindjuni Allahut, bindjuni të Dërguarit dhe përgjegjësve tuaj. Nëse nuk pajtoheni në ndonjë çështje, drejtohuni Allahut dhe të Dërguarit, nëse i besoni Allahut dhe Ditës së Fundit. Kjo është më e dobishmja dhe përfundimi më i mirë. [En-Nisa: 59]">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا أَطِيعُوا اللَّهَ وَأَطِيعُوا الرَّسُولَ وَأُولِي الْأَمْرِ مِنكُمْ فَإِن تَنَازَعْتُمْ فِي شَيْءٍ فَرُدُّوهُ إِلَى اللَّهِ وَالرَّسُولِ إِن كُنتُمْ تُؤْمِنُونَ بِاللَّهِ وَالْيَوْمِ الْآخِرِ ذَٰلِكَ خَيْرٌ وَأَحْسَنُ تَأْوِيلًا﴾ [النساء: ٥٩].</span></p><p><span class="s" data-sq="Dhe nëse çështja është nga ato ku myslimanët kanë mospajtim, duhet nxjerrë mendimi i secilit dhe argumenti i mendimit të tij, e cili mendim t'i përputhet më shumë Librit të Allahut e Synetit të të Dërguarit, ai zbatohet, siç tha i Lartësuari:">وإن كان أمرًا قد تنازع فيه المسلمون؛ فينبغي أن يستخرج من كل واحدٍ منهم رأيه ووجهَ رأيه، فأيُّ الآراء كان أشبهَ بكتاب الله وسنة رسوله عُمِلَ به، كما قال تعالىٰ:</span> <span class="s quran" data-sq="Nëse nuk pajtoheni në ndonjë çështje, drejtohuni Allahut dhe të Dërguarit, nëse i besoni Allahut dhe Ditës së Fundit. [En-Nisa: 59]">﴿فَإِن تَنَازَعْتُمْ فِي شَيْءٍ فَرُدُّوهُ إِلَى اللَّهِ وَالرَّسُولِ إِن كُنتُمْ تُؤْمِنُونَ بِاللَّهِ وَالْيَوْمِ الْآخِرِ﴾.</span></p><p><span class="s" data-sq="Përgjegjësit janë dy llojesh: sundimtarët dhe dijetarët, dhe ata janë ata që kur bëhen të mirë, bëhet i mirë populli. Më e rrezikshmja për njerëzit është dëmi i këtyre dyve. Të parët paralajmëronin nga dy sprovat e tyre: sprova e bidatçiut në fe dhe e mëkatarit në dynja — i pari ka epsh që e ka verbuar, i dyti ka dynja që e ka mashtruar. Sprova e atyre që kënaqen me fatinë e tyre siç u kënaqën ata para tyre, dhe sprova e atyre që u zhytën siç u zhytën ata para tyre.">وأولو الأمر صنفان؛ الأمراء والعلماء، وهم الذين إذا صلحوا صلح الناس، فأكثر ما يُخافُ علىٰ الناس ضررهما، وكان السلفُ يحذِّرون فتنتهما: فتنة المبتدع في دينه، والفاجر في دنياه، صاحب هوىٰ قد أعماه هواه، وصاحب دنيا قد أغوته دنياه، فتنة الذين استمتعوا بخلاقهم كما استمتع الذين من قبلهم بخلاقهم، وفتنة الذين خاضوا كما خاض الذين من قبلهم.</span></p><p><span class="s" data-sq="Dhe thonin: kush shpëton nga sprova e bidatçinjve dhe sprova e sundimtarit, ka shpëtuar.">وكانوا يقولون: من نجا من فتنة أهل البدع، وفتنة ذي السلطان نجا.</span></p><p><span class="s" data-sq="Prandaj secili prej tyre duhet të përpiqet që ajo çka thotë e bën të jetë bindje ndaj Allahut e të Dërguarit, dhe ndjekje e Librit të Allahut e Synetit të të Dërguarit. Kurdoherë që është e mundur në ndodhitë e ndërlikuara të dihet çka tregon">فعلىٰ كلٍّ منهما أن يتحرَّىٰ بما يقوله ويفعله طاعةَ الله ورسوله، واتباعَ كتاب الله وسنة رسوله، ومتىٰ أمكن في الحوادث المشكلة معرفة ما دل</span></p>`},
{html:`<p><span class="s" data-sq="Libri dhe Syneti, ky është obligimi. E nëse nuk arrihet kjo për shkak ngushtësie kohe, ose paaftësie të kërkuesit, ose barazisë së argumenteve, ose diçka tjetër, atëherë ai mund të ndjekë dikë që i beson dijen e fenë, ky është mendimi më i fortë.">عليه الكتاب والسنة= كان هو الواجب، وإن لم يمكن ذلك لضيق الوقت، أو عجز الطالب، أو تكافؤ الأدلة عنده، أو غير ذلك؛ فله أن يقلد من يرتضي علمَه ودينَه، هذا أقوىٰ الأقوال.</span></p><p><span class="s" data-sq="Është thënë se nuk i lejohet ndjekja verbërisht në asnjë rast, dhe është thënë se i lejohet në çdo rast. Të tri mendimet gjenden në medh'hebin e Ahmedit e të tjerëve.">وقد قيل: ليس له التقليد بكل حال، وقيل: له التقليد بكل حال، والأقوال الثلاثة في مذهب أحمد وغيره.</span></p><p><span class="s" data-sq="Po ashtu kushtet që kërkohen për gjyqtarët dhe sundimtarët, duhen plotësuar sipas mundësisë, madje edhe kushtet e tjera të adhurimeve — si namazi, xhihadi e të tjera — të gjitha janë obligim kur ka mundësi. Ndërsa kur ka paaftësi, Allahu nuk e ngarkon askënd mbi mundësinë; prandaj Allahu e urdhëroi namazliun të pastrohet me ujë, e nëse nuk gjen ose ka frikë nga dëmi i përdorimit për shkak të ftohtit, plagëve apo diçka tjetër, të marrë tejemum me dhe të pastër, duke fërkuar fytyrën e duart, dhe Profeti ﷺ i tha Imran ibn Husejnit:">وكذلك ما يُشْتَرط في القضاة والولاة من الشروط، يجب فعله بحسب الإمكان، بل وسائر شروط العبادات؛ من الصلاة والجهاد وغير ذلك، كلُّ ذلك واجب مع القدرة، فأمَّا مع العجز فإن الله لا يكلف نفسًا إلا وسعها؛ ولهذا أمرَ الله المصلي أن يتطهَّر بالماء، فإن عدمه أو خاف الضرر باستعماله لشدة البرد أو لجروح به أو غير ذلك= تيمم الصعيدَ الطيب؛ فمسح بوجهه ويديه منه، وقال النبي ﷺ لعمران بن حصين:</span> <span class="s hadith" data-sq="'Falu në këmbë, e nëse nuk mundesh, falu ulur, e nëse nuk mundesh, falu në krah.'">«صل قائمًا فإن لم تستطع فقاعدًا فإن لم تستطع فعلىٰ جنب».</span></p><p><span class="s" data-sq="Allahu e bëri obligim namazin në kohën e vet në çfarëdo gjendjeje, siç tha i Lartësuari:">فقد أوجب الله الصلاة في الوقت علىٰ أيِّ حال أمكن، كما قال تعالىٰ:</span> <span class="s quran" data-sq="Ruani namazet dhe namazin e mesëm, dhe qëndroni para Allahut me përulësi. Nëse keni frikë (nga armiku), atëherë (faluni) duke ecur ose duke kaloruar, e kur të jeni të sigurt, përmendeni Allahun ashtu siç u mësoi Ai juve atë çka nuk e dinit. [El-Bekare: 238-239]">﴿حَافِظُوا عَلَى الصَّلَوَاتِ وَالصَّلَاةِ الْوُسْطَىٰ وَقُومُوا لِلَّهِ قَانِتِينَ ۝ فَإِنْ خِفْتُمْ فَرِجَالًا أَوْ رُكْبَانًا فَإِذَا أَمِنتُمْ فَاذْكُرُوا اللَّهَ كَمَا عَلَّمَكُم مَّا لَمْ تَكُونُوا تَعْلَمُونَ﴾ [البقرة: ٢٣٨-٢٣٩].</span></p>`},
