{html:`<p><span class="s quran" data-sq="dhe luftuan me ju, ata janë prej jush.">وَجَاهَدُوا مَعَكُمْ فَأُولَئِكَ مِنكُمْ﴾</span> <span class="s" data-sq="[El-Enfal: 75],">[الأنفال: ٧٥]،</span> <span class="s" data-sq="dhe në fjalën e Tij:">وفي قوله:</span> <span class="s quran" data-sq="dhe ata që i ndoqën me punë të mira.">﴿وَالَّذِينَ اتَّبَعُوهُم بِإِحْسَانٍ﴾</span> <span class="s" data-sq="[Et-Teube: 100], dhe në fjalën e Tij:">[التوبة: ١٠٠]، وفي قوله تعالى:</span> <span class="s quran" data-sq="dhe tjerëve prej tyre që ende nuk u kanë bashkuar atyre; Ai është ngadhnjyesi, i urti.">﴿وَءَاخَرِينَ مِنْهُمْ لَمَّا يَلْحَقُوا بِهِمْ وَهُوَ الْعَزِيزُ الْحَكِيمُ﴾</span> <span class="s" data-sq="[El-Xhumua: 3].">[الجمعة: ٣].</span></p>

<p><span class="s" data-sq="Kuptimi i fjalës «nuk galopuat mbi të as kuaj e as deve» d.m.th.: nuk lëvizët e as ngut kuaj e as deve; andaj fukahaja thanë: fej-i është ajo që merret nga jobesimtarët pa luftë, sepse galopimi i kuajve e deveve do të thotë luftë."><span class="w" data-sq="Kuptimi i fjalës «nuk galopuat mbi të as kuaj e as deve» d.m.th.: nuk lëvizët e as ngut kuaj e as deve;">ومعنى قوله: ﴿فَمَا أَوْجَفْتُمْ عَلَيْهِ مِنْ خَيْلٍ وَلَا رِكَابٍ﴾ أي: ما حركتم ولا سقتم خيلًا ولا إبلًا،</span> <span class="w" data-sq="andaj fukahaja thanë: fej-i është ajo që merret nga jobesimtarët pa luftë, sepse galopimi i kuajve e deveve do të thotë luftë.">ولهذا قال الفقهاء: الفيء هو ما أُخِذَ من الكفار بغير قتال، لأن إيجاف الخيل والركاب هو معنى القتال.</span></span></p>

<p><span class="s" data-sq="U quajt fej (kthim) sepse Allahu ua ktheu besimtarëve nga jobesimtarët; sepse baza është se Allahu i krijoi pasuritë si ndihmë për adhurimin e Tij; ngase Ai i krijoi krijesat për adhurim. Jobesimtarët nuk e adhuruan Atë, andaj Allahu ua lejoi shpirtrat e pasuritë e tyre besimtarëve që e adhurojnë, dhe ua ktheu atë që e meritonin, ashtu siç i kthehet njeriut pasuria e grabitur nga trashëgimia edhe nëse nuk e kishte zotëruar më parë."><span class="w" data-sq="U quajt fej sepse Allahu ua ktheu besimtarëve nga jobesimtarët;">وسُمِّي فيئًا لأن الله سبحانه وتعالى أفاءه على المؤمنين، أي: رده عليهم من الكفار،</span> <span class="w" data-sq="sepse baza është se Allahu i krijoi pasuritë si ndihmë për adhurimin e Tij; ngase i krijoi krijesat për adhurim.">فإن الأصل أن الله تعالى إنما خلق الأموال إعانة على عبادته؛ لأنه إنما خلق الخلق لعبادته،</span> <span class="w" data-sq="Jobesimtarët nuk e adhuruan, andaj Allahu ua lejoi pasuritë besimtarëve, dhe ua ktheu atë që e meritonin.">فالكافرون به أباحَ نفوسَهم التي لم يعبدوه بها، وأموالَهم التي لم يستعينوا بها على عبادته لعباده المؤمنين الذين يعبدونه، وأعاد عليهم ما يستحقونه،</span> <span class="w" data-sq="ashtu siç i kthehet njeriut pasuria e grabitur nga trashëgimia edhe nëse nuk e kishte zotëruar më parë.">كما يُعاد على الرجل ما غُصِب من ميراثه، وإن لم يكن قبضه قبل ذلك.</span></span></p>

<p><span class="s" data-sq="Kjo është si xhizja mbi çifutët e të krishterët, pasuria që armiku pajtohet me të, ose ia dhurojnë sundimtarit të myslimanëve si ngarkim nga vendet e të krishterëve e tjerëve, e ajo çka merret nga tregtarët e vendit armik — e pesta — e nga tregtarët e"><span class="w" data-sq="Kjo është si xhizja mbi çifutët e të krishterët, pasuria që armiku pajtohet, ose ia dhurojnë sundimtarit,">وهذا مثل الجزية التي على اليهود والنصارى، والمال الذي يُصالح عليه العدو، أو يهدونه إلى سلطان المسلمين،</span> <span class="w" data-sq="si ngarkimi nga vendet e të krishterëve, e ajo çka merret nga tregtarët e vendit armik — e pesta — e nga tregtarët e">كالحمل الذي يُحْمَل من بلاد النصارى ونحوهم، وما يؤخذ من تجار أهل الحرب وهو العُشْر، ومن تجار</span></span></p>`},
// ===== Faqja 55: Dhimmitë, pasuritë pa pronar (PDF fq. 57) =====
{html:`<p><span class="s" data-sq="ehlu'dh-dhimmes kur tregtojnë jashtë vendit të tyre — gjysma e së dhjetës. Kështu merrte Umer ibnu'l-Hattab, radijallahu anhu. Dhe ajo çka merret nga pasuritë e atyre që thyejnë marrëveshjen, dhe haraxhi që ishte vënë fillimisht mbi ta, edhe nëse disa prej tij ka kaluar mbi disa myslimanë."><span class="w" data-sq="ehlu'dh-dhimmes kur tregtojnë jashtë vendit të tyre — gjysma e së dhjetës. Kështu merrte Umeri, radijallahu anhu.">أهل الذمة إذا اتَّجروا في غير بلادهم وهو نصف العُشْر. هكذا كان عمر بن الخطاب رضي الله عنه يأخذ.</span> <span class="w" data-sq="Dhe ajo çka merret nga pasuritë e atyre që thyejnë marrëveshjen, dhe haraxhi mbi ta, edhe nëse disa prej tij ka kaluar mbi disa myslimanë.">وما يؤخذ من أموال من ينقض العهد منهم، والخراج الذي كان مضروبًا في الأصل عليهم، وإن كان قد صار بعضه على بعض المسلمين.</span></span></p>

<p><span class="s" data-sq="Pastaj me fej-in bashkohen të gjitha pasuritë sulltanore që nuk kanë pronar të caktuar, si ai mysliman që vdes e nuk ka trashëgimtar të caktuar, e si pasuritë e grabituna, huatë e depozitat e myslimanëve që nuk gjinden pronarët e tyre, e pasuri të tjera të palujtshme e të lujtshme të myslimanëve."><span class="w" data-sq="Pastaj me fej-in bashkohen të gjitha pasuritë sulltanore që nuk kanë pronar të caktuar,">ثم إنه يجتمع مع الفيء جميع الأموال السلطانية التي ليست مال مالك مُعَيَّن،</span> <span class="w" data-sq="si ai mysliman që vdes e nuk ka trashëgimtar të caktuar, e si pasuritë e grabituna, huatë e depozitat që nuk gjinden pronarët,">مثل من يموت من المسلمين وليس له وراث معين، وكالغُصُوب، والعواري، والودائع</span> <span class="w" data-sq="e pasuri të tjera të palujtshme e të lujtshme të myslimanëve.">التي تعذَّر معرفة أصحابها، وغير ذلك من أموال المسلمين العقار والمنقول.</span></span></p>`},
// ===== Faqja 56: Trashëgimia pa trashëgimtar, atik (PDF fq. 58) =====
{html:`<p><span class="s" data-sq="Kjo e gjëra të ngjashme janë pasuri e myslimanëve; e Allahu i Lartësuar në Kur'an përmendi vetëm fej-in, sepse Pejgamberi ﷺ nuk ndodhte që ndokush të vdiste në kohën e tij pa pasur trashëgimtar të caktuar, ngase farefiset ishin të njohura mes shokëve të tij."><span class="w" data-sq="Kjo e gjëra të ngjashme janë pasuri e myslimanëve; e Allahu në Kur'an përmendi vetëm fej-in,">فهذا ونحوه مال المسلمين، وإنما ذكر الله سبحانه وتعالى في القرآن الفيءَ فقط؛</span> <span class="w" data-sq="sepse Pejgamberi ﷺ nuk ndodhte që ndokush të vdiste pa pasur trashëgimtar, ngase farefiset ishin të njohura mes shokëve.">لأن النبي ﷺ ما كان يموت على عهده ميت إلا وله وارثٌ معيَّن؛ لظهور الأنساب في أصحابه.</span></span></p>

<p><span class="s" data-sq="Njëherë vdiq njëri nga ndonjë fis e Pejgamberi ﷺ ia dha trashëgiminë të madhit të atij fisi, d.m.th. atij më të afërt me gjyshin e tyre. E kështu kanë thënë disa dijetarë si Imam Ahmedi në mendimin e qartë, e tjerë."><span class="w" data-sq="Njëherë vdiq njëri nga ndonjë fis e Pejgamberi ﷺ ia dha trashëgiminë të madhit të atij fisi, d.m.th. atij më të afërt.">وقد مات مرةً رجل من قبيلة فدفع ميراثه إلى كبير تلك القبيلة، أي: أقربهم نسبًا إلى جدهم.</span> <span class="w" data-sq="E kështu kanë thënë disa dijetarë si Imam Ahmedi e tjerë.">وقد قال بذلك طائفة من العلماء كالإمام أحمد في قول منصوصٍ وغيره.</span></span></p>

<p><span class="s" data-sq="Dhe vdiq njëri e nuk la pas vetes veçse robin e çliruar, e ia dha pasurinë atij. Dhe me këtë kanë thënë">ومات رجل ولم يُخَلِّف إلا عتيقًا له فدفع ماله لعتيقه. وقال بذلك</span></p>`},
// ===== Faqja 57: Pejgamberi nuk merrte veçse sadaka, divani i Umerit (PDF fq. 59) =====
{html:`<p><span class="s" data-sq="disa dijetarë nga pasuesit e Ahmedit e tjerëve.">طائفة من العلماء من أصحاب أحمد وغيرهم.</span></p>

<p><span class="s" data-sq="Dhe ia dha trashëgiminë e njërit njërit nga familja e fshatit të tij. Dhe Pejgamberi ﷺ e halifët e tij zgjëronin dorëdhënien e trashëgimisë te ai mes të cilit e të vdekurit kishte ndonjë lidhje, siç e përmendem."><span class="w" data-sq="Dhe ia dha trashëgiminë e njërit njërit nga familja e fshatit të tij.">ودفعَ ميراثَ رجل إلى رجل من أهل قريته.</span> <span class="w" data-sq="Dhe Pejgamberi ﷺ e halifët zgjëronin dorëdhënien e trashëgimisë te ai që kishte ndonjë lidhje, siç e përmendem.">وكان النبي ﷺ هو وخلفاؤه يتوسعون في دفع ميراث الميت إلى من بينه وبينه سبب كما ذكرناه.</span></span></p>

<p><span class="s" data-sq="Dhe nuk merrte nga myslimanët veçse sadakat, dhe i urdhëronte të luftonin në rrugën e Allahut me pasuritë e shpirtrat e tyre, siç urdhëroi Allahu në Librin e Tij.">ولم يكن يأخذ من المسلمين إلا الصدقات، وكان يأمرهم بأن يجاهدوا في سبيل الله بأموالهم وأنفسهم، كما أمر الله تعالى به في كتابه.</span></p>

<p><span class="s" data-sq="Dhe nuk kishte divan gjithëpërfshirës për pasuritë e mbledhura e të ndara në kohën e tij e të Ebu Bekrit, radijallahu anhu, por e ndante pasurinë pak e nga pak. E kur erdhi koha e Umerit, radijallahu anhu, u shtua pasuria, u zgjeruan tokat e u shtuan njerëzit, andaj bëri divanin e dhënieve për luftëtarët e tjerë."><span class="w" data-sq="Dhe nuk kishte divan gjithëpërfshirës për pasuritë në kohën e tij e të Ebu Bekrit, por e ndante pak e nga pak.">ولم يكن للأموال المقبوضة والمقسومة ديوانٌ جامع على عهده وعهد أبي بكر رضي الله عنه، بل كان يقسم المال شيئًا فشيئًا،</span> <span class="w" data-sq="E kur erdhi koha e Umerit, u shtua pasuria, u zgjeruan tokat e u shtuan njerëzit, andaj bëri divanin e dhënieve për luftëtarët e tjerë.">فلما كان في زمان عمر رضي الله عنه كثُرَ المال، واتسعت البلاد، وكثر الناس، فجعل ديوان العطاء للمقاتلة وغيرهم.</span></span></p>`},
// ===== Faqja 58: Divani, tri llojet e pasurive (PDF fq. 60) =====
{html:`<p><span class="s" data-sq="Dhe divani i ushtrisë — në këtë kohë — përfshin shumicën e atij divani, e ai është divani më i rëndësishëm i myslimanëve.">وديوان الجيش ـ في هذا الزمان ـ مشتمل على أكثر ذلك الديوان، وهو أهم دواوين المسلمين.</span></p>

<p><span class="s" data-sq="Dhe çdo qytet kishte divanet e haraxhit e fej-it për pasuritë e mbledhura; e Pejgamberi ﷺ e halifët e tij i llogaritsnin punëtorët për sadakat, fej-in e gjëra tjera."><span class="w" data-sq="Dhe çdo qytet kishte divanet e haraxhit e fej-it për pasuritë e mbledhura;">وكان للأمصار دواوين الخراج والفيء لما يُقْبَض من الأموال،</span> <span class="w" data-sq="e Pejgamberi ﷺ e halifët i llogaritsnin punëtorët për sadakat, fej-in e gjëra tjera.">وكان النبي ﷺ وخلفاؤه يحاسبون العمال على الصدقات، والفيء، وغير ذلك.</span></span></p>

<p><span class="s" data-sq="Andaj pasuritë në këto kohë e më parë u bënë tri lloje:">فصارت الأموال في هذه الأزمان وما قبلها ثلاثة أنواع:</span></p>

<p><span class="s" data-sq="Lloji i parë: që imami ka të drejtë ta mbledhë me Libër, Sunet e Ixhma, siç e përmendem.">نوع يستحقّ الإمام قبضَه بالكتاب والسنة والإجماع، كما ذكرناه.</span></p>

<p><span class="s" data-sq="Lloji i dytë: që ndalohet marrja e tij me Ixhma, si taksat e mbledhura nga fshati për gjakun e ndonjë të vrari edhe nëse ka trashëgimtar, ose ajo çka merret nga njeriu për ndonjë krim e i bie dënimi me të, e si mukuset (taksat e padrejta) që nuk lejohen me konsensus."><span class="w" data-sq="Lloji i dytë: që ndalohet marrja e tij me Ixhma, si taksat e mbledhura nga fshati për gjakun e ndonjë të vrari,">وقسم يحرم أخذه بالإجماع، كالجبايات التي تؤخذ من أهل القرية لبيت المال؛ لأجل قتيل قُتل بينهم وإن كان له وارث،</span> <span class="w" data-sq="ose ajo çka merret nga njeriu për ndonjë krim e i bie dënimi me të, e si mukuset që nuk lejohen me konsensus.">أو يؤخذ من الرجل على حدٍّ ارتكبه، وتسقط عنه العقوبة بذلك، وكالمكوس التي لا يسوغ وضعها اتفاقًا.</span></span></p>

<p><span class="s" data-sq="Dhe lloji i tretë: ku ka ixhtihad e kundërshtime, si pasuria e atij që ka farefisnë e afërt por pa hise të caktuar e pa"><span class="w" data-sq="Dhe lloji i tretë: ku ka ixhtihad e kundërshtime, si pasuria e atij që ka farefisnë e afërt por pa hise të caktuar e pa">وقسم فيه اجتهاد وتنازع، كمال من له ذو رَحِم ليس بذي فرضٍ ولا</span></span></p>`},
// ===== Faqja 59: Padrejtësia, rregulli i borxhit, dënimi (PDF fq. 61) =====
{html:`<p><span class="s" data-sq="asabe (trashëgimtar me radhë), e gjëra të ngjashme.">عَصَبة، ونحو ذلك.</span></p>

<p><span class="s" data-sq="Shumë herë ndodh padrejtësia nga udhëheqësit e populli: këta marrin atë që nuk u lejohet, e ata ndalojnë atë që duhet; siç ndodh shtypja mes ushtrisë e bujqëve, e siç lihet xhihadi i detyrueshëm, e siç grumbullojnë udhëheqësit nga pasuria e Allahut atë që nuk lejohet ta grumbullojnë. Po ashtu edhe dënimet mbi kthimin e pasurive — mund të lihet ajo çka lejohet ose detyrohet, e mund të bëhet ajo çka nuk lejohet."><span class="w" data-sq="Shumë herë ndodh padrejtësia nga udhëheqësit e populli: këta marrin atë që nuk u lejohet, e ata ndalojnë atë që duhet;">وكثيرًا ما يقع الظلم من الولاة والرعية؛ هؤلاء يأخذون ما لا يحل، وهؤلاء يمنعون ما يجب،</span> <span class="w" data-sq="siç shtypet ushtria e bujqit, siç lihet xhihadi, e siç grumbullojnë udhëheqësit atë që nuk lejohet; e dënimet mund të lihen ose të tejkalohen.">كما قد يتظالم الجندُ والفلاحون، وكما قد يترك بعض الناس من الجهاد ما يجب، ويكنز الولاة من مال الله مما لا يحل كنزه، وكذلك العقوبات على أداء الأموال؛ فإنه قد يُتْرَك منها ما يباح أو يجب، وقد يفعل ما لا يحل.</span></span></p>

<p><span class="s" data-sq="Rregulli bazë në këtë: çdokush që ka mbi vete pasuri që duhet ta kthejë — si njeri me depozitë, mudarebe, ortakëri, pasuri të dhënë me prokurë, pasuri jetimi, vakfi, bejtu'l-mali, ose borxh që mundet ta paguajë — nëse refuzon ta kthejë hakun, e dihet se mundet, dënohet derisa ta tregojë pasurinë ose ta dorëzojë; e nëse gjendet pasuria e ai duron burgun, merret haku nga pasuria pa nevojë për rrahje."><span class="w" data-sq="Rregulli bazë: çdokush që ka mbi vete pasuri që duhet ta kthejë — si depozitë, ortakëri, pasuri jetimi, vakfi, borxh —">والأصل في ذلك: أن كل مَن عليه مال يجب أداؤه؛ كرجل عنده وديعة، أو مضاربة، أو شركة، أو مال لمُوَكِّله، أو مال يتيم، أو مال وقف، أو مال لبيت المال، أو عنده دينٌ هو قادر على أدائه،</span> <span class="w" data-sq="nëse refuzon e dihet se mundet, dënohet derisa ta tregojë; e nëse gjendet pasuria, merret haku pa rrahje.">فإنه إذا امتنع من أداء الحق الواجب من عين أو دين، وعُرِفَ أنه قادر على أدائه= فإنه يستحق العقوبة حتى يُظْهِر المال أو يدل على موضعه، فإذا عُرِفَ المال وصبر على الحبس= يُسْتوفى الحق من المال ولا حاجة إلى ضربه.</span></span></p>

<p><span class="s" data-sq="E nëse refuzon ta tregojë pasurinë e ta paguajë, rrihet derisa ta kthejë hakun. Po ashtu nëse refuzon shpenzimet e detyrueshme duke pasur mundësi; ngase transmetohet nga Pejgamberi ﷺ se tha:">وإن امتنع من الدلالة على ماله ومن الإيفاء ضُرِب حتى يؤدِّي الحق أو يُمَكِّن من أدائه. وكذلك لو امتنع من أداء النفقة الواجبة عليه مع القدرة عليها؛ لما روى عمرو بن الشريد عن أبيه عن النبي ﷺ أنه قال:</span> <span class="s hadith" data-sq="«Shtyrja e borxhit nga i pasuri e bën të lejueshme nderin dhe dënimin e tij.»">«ليُّ الواجدِ يُحِلُّ عِرْضَه وعقوبَتَه»</span> <span class="s" data-sq="transmetuan pasuesit e Suneneve. Dhe tha ﷺ:">رواه أهل السنن. وقال ﷺ:</span> <span class="s hadith" data-sq="«Zvarritja e të pasurit është padrejtësi.»">«مَطْلُ الغنيِّ</span></p>`},
// ===== Faqja 60: Ta'ziri, Hajberi, hedijat e punëtorëve (PDF fq. 62) =====
{html:`<p><span class="s hadith" data-sq="padrejtësi.»">ظُلْم»</span> <span class="s" data-sq="nxorën të dytë në «Sahihejn»; dhe «lejj» do të thotë: zvarritje (e borxhit).">أخرجاه في «الصحيحين»، والليُّ: هو المَطْل.</span></p>

<p><span class="s" data-sq="Dhe zullumqari meriton dënimin dhe ta'zirin. Dhe ky është rregull i pranuar: çdokush që bën haram ose lë detyrën meriton dënim; e nëse nuk është i caktuar me sheriat, bëhet ta'zir ku udhëheqësi mendon; andaj dënohet i pasuri zvarritës me burg, e nëse këmbëngul, rrihet derisa ta kthejë detyrën. Kështu kanë thënë fukahaja nga pasuesit e Malikut, Shafiut, Ahmedit e tjerëve, dhe nuk di kundërshtim."><span class="w" data-sq="Dhe zullumqari meriton dënimin dhe ta'zirin. Dhe ky është rregull i pranuar: çdokush që bën haram ose lë detyrën meriton dënim;">والظالم يستحق العقوبة والتعزير، وهذا أصلٌ متفق عليه: أن كل من فعَل محرمًا أو ترك واجبًا استحقَّ العقوبة،</span> <span class="w" data-sq="e nëse nuk është i caktuar me sheriat, bëhet ta'zir ku udhëheqësi mendon;">فإن لم تكن مُقَدَّرة بالشرع كان تعزيرًا يجتهد فيه وليُّ الأمر،</span> <span class="w" data-sq="andaj dënohet i pasuri zvarritës me burg, e nëse këmbëngul rrihet. Kështu kanë thënë fukahaja, dhe nuk di kundërshtim.">فيعاقب الغني الماطل بالحبس، فإن أصرَّ عُوقب بالضرب حتى يؤدِّي الواجب، وقد نص على ذلك الفقهاء من أصحاب مالك والشافعي وأحمد وغيرهم، ولا أعلم فيه خلافًا.</span></span></p>

<p><span class="s" data-sq="Dhe transmetoi Buhariu në «Sahih-un» e tij nga Ibnu Umeri, radijallahu anhuma, se Pejgamberi ﷺ">وقد روى البخاري في «صحيحه» عن ابن عمر رضي الله عنهما أن النبي ﷺ</span></p>`},
// ===== Faqja 61: Hajberi, dhimmiu, hedijet e nëpunësve (PDF fq. 63) =====
{html:`<p><span class="s" data-sq="kur pajton me popullin e Hajberit mbi arin, argjendin e armët, pyeti njërin nga çifutët — Sa'jje, xhaxhain e Hujejj ibnu Ahtabit — për thesarin e Hujejjit; e ai tha: E harxhuan shpenzimet e luftërat. Tha: «Marrëveshja është e re e pasuria më e madhe se kaq» — e ia dorëzoi Sa'jjen Zubejrit, e ai e mundoi, e tha: E pashë Hujejjin duke u sjellë rreth ndonjë gërmadhes këtu; shkuan e këruan, e e gjetën miskin brenda."><span class="w" data-sq="kur pajton me popullin e Hajberit mbi arin, argjendin e armët, pyeti njërin nga çifutët për thesarin;">لما صالح أهل خيبر على الصفراء والبيضاء والسلاح سأل بعض اليهود ـ وهو سَعْيَة عم حُيَيّ بن أخطب ـ عن كنز حُيَيّ بن أخطب؟</span> <span class="w" data-sq="tha: E harxhuan shpenzimet e luftërat. Tha: «Marrëveshja e re e pasuria më e madhe»">فقال: أذهَبَتْه النفقات والحروب، فقال: «العهد قريب، والمال أكثر من ذلك»</span> <span class="w" data-sq="ia dorëzoi Zubejrit, e ai e mundoi, e tha: E pashë Hujejjin te ndonjë gërmadhë; shkuan e e gjetën miskin brenda.">فدفع رسول الله ﷺ سعية إلى الزبير، فمَسَّه بعذاب، فقال: قد رأيتُ حييًّا يطوف في خِرْبَة ههنا، فذهبوا فطافوا، فوجدوا المَسْك في الخربة.</span></span></p>

<p><span class="s" data-sq="Ky njeri ishte dhimmi, e dhimmiu nuk dënohet veçse me hak; po ashtu çdokush që fsheh atë që duhet ta tregojë, dënohet mbi lënien e detyrës."><span class="w" data-sq="Ky njeri ishte dhimmi, e dhimmiu nuk dënohet veçse me hak;">وهذا الرجل كان ذميًّا، والذمي لا تحل عقوبته إلا بحق،</span> <span class="w" data-sq="po ashtu çdokush që fsheh atë që duhet ta tregojë, dënohet mbi lënien e detyrës.">وكذلك كل مَن كتم ما يجب إظهاره من دلالة واجبة وغير ذلك عُوقِب على ترك الواجب.</span></span></p>

<p><span class="s" data-sq="Dhe çka marrin udhëheqësit e pasurive e tjerë nga pasuria e myslimanëve pa hak, udhëheqësi i drejtë duhet ta nxjerrë prej tyre, si hedijet që i marrin për shkak të punës. Tha Ebu Seid el-Hudriu, radijallahu anhu:"><span class="w" data-sq="Dhe çka marrin udhëheqësit e pasurive nga pasuria e myslimanëve pa hak, udhëheqësi i drejtë duhet ta nxjerrë prej tyre,">وما أخذ ولاة الأموال وغيرهم من مال المسلمين بغير حق، فلولي الأمر العادل استخراجه منهم،</span> <span class="w" data-sq="si hedijet që i marrin për shkak të punës. Tha Ebu Seid el-Hudriu, radijallahu anhu:">كالهدايا التي يأخذونها بسبب العمل، قال أبو سعيد الخدري رضي الله عنه:</span></span> <span class="s hadith" data-sq="Hedijet e nëpunësve janë gulul (vjedhje nga ganimeti).">هدايا العمال غلول.</span></p>`},
// ===== Faqja 62: Hedijet e emërave, hadithi i Ibnu'l-Lutbijjes (PDF fq. 64) =====
{html:`<p><span class="s" data-sq="Dhe transmetoi Ibrahim el-Harbiu në librin «El-Hedaja» nga Ibnu Abbasi, radijallahu anhuma, se Pejgamberi ﷺ tha:">وروى إبراهيم الحربي في كتاب «الهدايا» عن ابن عباس رضي الله عنهما أن النبي ﷺ قال:</span> <span class="s hadith" data-sq="«Hedijet e udhëheqësve janë gulul (vjedhje).»">«هدايا الأمراء غلول».</span></p>

<p><span class="s" data-sq="Dhe në dy Sahihat nga Ebu Humejd es-Saidi, radijallahu anhu, tha: Pejgamberi ﷺ caktoi njërin nga Ezdi, i thuhej: Ibnu'l-Lutbijje, mbi sadaka; e kur erdhi tha: Kjo është për ju dhe kjo m'u dhurua mua. Pejgamberi ﷺ tha:">وفي «الصحيحين» عن أبي حُمَيد الساعدي رضي الله عنه قال: استعمل النبي ﷺ رجلًا من الأزد يقال له: ابن اللُّتْبِيَة على الصدقة فلما قَدِم قال: هذا لكم وهذا أُهْدِي إليَّ، فقال النبي ﷺ:</span> <span class="s hadith" data-sq="«Ç'është puna e njeriut, e caktojmë mbi punë nga ato që na i ka ngarkuar Allahu, e ai thotë: Kjo është për ju e kjo m'u dhurua mua?! Pse nuk u ul në shtëpinë e babait ose nënës e ta shohë, a i dhurohet apo jo? Pasha Atë që shpirti im është në dorën e Tij, nuk merr prej tij asgjë veçse do ta bartë Ditën e Kiametit mbi qafën e tij; qoftë deve me pëllitje, lopë me pëllitje, apo dele"><span class="w" data-sq="«Ç'është puna e njeriut, e caktojmë mbi punë, e thotë: Kjo për ju e kjo m'u dhurua?! Pse nuk u ul në shtëpi e ta shohë, a i dhurohet apo jo?">«ما بال الرجل نستعمله على العمل مما ولانا الله فيقول: هذا لكم وهذا أُهْدِي إليَّ؟! فهلَّا جلس في بيت أبيه أو بيت أمه فينظر أيُهْدَى إليه أم لا؟</span> <span class="w" data-sq="Pasha Atë që shpirti im është në dorën e Tij, nuk merr asgjë veçse do ta bartë Ditën e Kiametit mbi qafë; qoftë deve me pëllitje, lopë me pëllitje, apo dele">والذي نفسي بيده لا يأخذ منه شيئًا إلا جاء به يوم القيامة يحمله على رقبته؛ إن كان بعيرًا له رُغاء، أو بقرة لها خُوار، أو شاة</span></span></p>`},
// ===== Faqja 63: Delja, mushatara e Umerit (PDF fq. 65) =====
{html:`<p><span class="s hadith" data-sq="me blegërimë.» Pastaj ngriti duart derisa i pamë bardhësinë e sqetullave, e tha: «O Allah, a e kumtova? O Allah, a e kumtova?» tri herë.">تَيْعَر» ثم رفع يده حتى رأينا عُفْرَة إبطيه: «اللهم هل بلغت، اللهم هل بلغت» ثلاثًا.</span></p>

<p><span class="s" data-sq="Po ashtu edhe favorizimi i udhëheqësve në tregti — si shitblerjet, qiratë, mudarebet, ujitjet e bujqësitë — është lloj i dhuratës. Andaj Umer ibnu'l-Hattab, radijallahu anhu, ua ndau gjysmën e pasurisë punëtorëve të tij që ishin me vlerë e fe e nuk akuzoheshin për tradhtim, por ua ndau ngase ishin favorizuar për shkak të postit; e kjo ishte e drejtë sepse ai ishte imam i drejtë që ndante barazisht."><span class="w" data-sq="Po ashtu edhe favorizimi i udhëheqësve në tregti — si shitblerjet, qiratë, mudarebet — është lloj i dhuratës.">وكذلك محاباة الولاة في المعاملة؛ من المبايعة والمؤاجرة والمضاربة، والمساقاة والمزارعة، ونحو ذلك= هو من نوع الهديَّة،</span> <span class="w" data-sq="Andaj Umeri ua ndau gjysmën e pasurisë punëtorëve që ishin me vlerë e fe, por u ishin favorizuar për shkak të postit;">ولهذا شاطر عمر بن الخطاب رضي الله عنه من عماله مَن كان له فضل ودين لا يُتَّهَم بخيانة، وإنما شاطرهم لما كانوا خُصُّوا به لأجل الولاية من محاباة وغيرها،</span> <span class="w" data-sq="e kjo ishte e drejtë sepse ai ishte imam i drejtë që ndante barazisht.">وكان الأمر يقتضي ذلك؛ لأنه كان إمامَ عدل يقسم بالسوية.</span></span></p>`},
// ===== Faqja 64: Detyrat e secilit, ndërmjetësimi (PDF fq. 66) =====
{html:`<p><span class="s" data-sq="E kur u ndryshuan imami e populli, detyra e secilit u bë: ta bëjë detyrën sa mundet, ta lërë haramin, e mos ta ndalojë veten nga ajo çka ia ka lejuar Allahu.">فلما تغير الإمام والرعية، كان الواجب على كلِّ إنسان أن يفعل من الواجب ما يقدر عليه، ويترك ما حرم عليه، ولا يحرم عليه ما أباح الله له.</span></p>

<p><span class="s" data-sq="Dhe nganjëherë populli sprovohet me udhëheqës që refuzon dhuratën e gjëra të ngjashme, për ta mundësuar shtypjen, dhe e lë detyrën e plotësimit të nevojave; andaj ai që merr kompensim për ndalimin e padrejtësisë e plotësimin e nevojës, u është më i dashur se ky; sepse i pari e shiti ahiretin me dynjanë e tjetrit, e njeriu me humbje më të madhe është ai që e shet ahiretin me dynjanë e tjetrit."><span class="w" data-sq="Dhe nganjëherë populli sprovohet me udhëheqës që refuzon dhuratën për ta mundësuar shtypjen, e lë detyrën e plotësimit të nevojave;">وقد يُبْتَلَى الناسُ من الولاة بمن يمتنع من الهدية ونحوها، ليتمكن بذلك من استيفاء المظالم منهم، ويترك ما أوجبه الله من قضاء حوائجهم،</span> <span class="w" data-sq="andaj ai që merr kompensim për ndalimin e padrejtësisë, u është më i dashur; sepse i pari e shiti ahiretin me dynjanë e tjetrit.">فيكون من أخذَ منهم عِوَضًا على كَفِّ ظلمٍ وقضاء حاجةٍ مباحةٍ أحبَّ إليهم من هذا، فإن الأول قد باع آخرته بدنيا غيره، وأخسرُ الناس صفقةً من باع آخرته بدنيا غيره.</span></span></p>

<p><span class="s" data-sq="Detyra është ndalimi i padrejtësisë sa mundesh, dhe plotësimi i nevojave të domosdoshme; nga kumtimi i nevojave sundimtarit, njoftimi i tij me çështjet e tyre, drejtimi i tij te dobija e largimi nga dëmi me mënyra të ndryshme, siç bëjnë njerëzit e interesit si sekretarët e tjerë për interesat e tyre. Tha Pejgamberi ﷺ:"><span class="w" data-sq="Detyra është ndalimi i padrejtësisë sa mundesh, dhe plotësimi i nevojave; nga kumtimi sundimtarit, njoftimi me çështjet, drejtimi te dobija;">وإنما الواجب كف الظلم عنهم بحسب القدرة، وقضاء حوائجهم التي لا تتم مصلحة الناس إلا بها؛ من تبليغ ذي السلطان حاجاتهم، وتعريفه بأمورهم، ودلالته على مصالحهم، وصرفه عن مفاسدهم بأنواع الطرق اللطيفة وغير اللطيفة،</span> <span class="w" data-sq="siç bëjnë njerëzit e interesit. Tha Pejgamberi ﷺ:">كما يفعل ذوو الأغراض من الكُتَّاب ونحوهم في أغراضهم، ففي حديث هند بن أبي هالة رضي الله عنه عن النبي ﷺ أنه كان يقول:</span></span> <span class="s hadith" data-sq="«Kumtomëni nevojën e atij që nuk mundet vetë ta kumtojë, sepse kush i kumton sundimtarit nevojën e atij që nuk mundet, Allahu ia forcon këmbët mbi Sirat ditën kur rrëshqasin këmbët.»">«أَبلِغوني حاجةً من لا يستطيع إبلاغها، فإنه من أبلغ ذا سلطان حاجةً من لا يستطيع إبلاغها ثبَّت الله قدميه على الصراط يوم تزِلُّ الأقدام»</span></p>`},
// ===== Faqja 65: Ndërmjetësimi, suhti (PDF fq. 67) =====
{html:`<p><span class="s" data-sq="Dhe transmetoi Imam Ahmedi e Ebu Davudi në «Sunen-in» e tij nga Ebu Umame el-Bahili, radijallahu anhu, tha: Tha i Dërguari i Allahut ﷺ:">وقد روى الإمام أحمد وأبو داود في «سننه» عن أبي أمامة الباهلي رضي الله عنه قال: قال رسول الله ﷺ:</span> <span class="s hadith" data-sq="«Kush ndërmjetëson për vëllanë e tij e ai i dhuron dhuratë për të e ai e pranon, ka ardhur te njëra nga dyert e mëdha të kamatës.»">«من شفع لأخيه شفاعة فأهدى له عليها هدية فقبلها، فقد أتى بابًا عظيمًا من أبواب الربا».</span></p>

<p><span class="s" data-sq="Dhe transmetoi Ibrahim el-Harbiu nga Abdullah ibnu Mes'udi, radijallahu anhu, tha: Suhti (fitimi i paligjshëm) është kur njëri kërkon nevojën për dikë, e i plotësohet, e ai i dhuron dhuratë e ky e pranon.">وروى إبراهيم الحربي عن عبد الله بن مسعود رضي الله عنه قال: السُّحْت أن يطلب الحاجةَ للرجل، فتُقْضى له، فيُهْدي إليه فيقبلها.</span></p>

<p><span class="s" data-sq="Dhe transmetohet nga Mesruku: se i foli Ibnu Zijadit për ndonjë padrejtësi e ia ktheu; e pronari i ofroi dhuratë — rob — e ai ia ktheu, dhe tha: E dëgjova Ibnu Mes'udin duke thënë: Kush ndalon padrejtësinë nga ndonjë mysliman e merr prej tij pak a shumë, ajo është suht. Thashë: O Ebu Abdurrahman, ne e konsideronim suhtin vetëm ryshfetin në gjykim. Tha: Ai është kufër."><span class="w" data-sq="Dhe transmetohet nga Mesruku: se i foli Ibnu Zijadit për ndonjë padrejtësi e ia ktheu; e pronari i ofroi rob e ai e ktheu, e tha:">وروى أيضًا عن مسروق: أنه كلم ابنَ زياد في مظلمة فردها، فأهدى له صاحبُها وصيفًا فرده عليه وقال:</span> <span class="w" data-sq="E dëgjova Ibnu Mes'udin: Kush ndalon padrejtësinë nga myslimanë e merr prej tij, ajo është suht. Thashë: Ne e konsideronim suhtin vetëm ryshfetin. Tha: Ai është kufër.">سمعت ابن مسعود يقول: من ردَّ عن مسلم مظلمة فرَزَأه عليها قليلًا أو كثيرًا فهو سُحْت. فقلت: يا أبا عبد الرحمن ما كنا نرى السحت إلا الرشوة في الحكم، قال: ذاك كفر.</span></span></p>`},
// ===== Faqja 66: Ndalimi i bashkëpunimit në zullum, dy llojet (PDF fq. 68) =====
{html:`<p><span class="s" data-sq="E nëse udhëheqësi dëshiron t'ua marrë punëtorëve ato çka do t'i veçojë vetes e familjes, nuk duhet ndihmuar asnjërin, sepse secili është zullumqar — si hajdut që vjedh hajdutin, si dy grupe që luftojnë për fanatizëm e udhëheqësi; dhe nuk i lejohet njeriut të jetë ndihmës në padrejtësi. Bashkëpunimi është dy lloje:"><span class="w" data-sq="E nëse udhëheqësi dëshiron t'ua marrë punëtorëve ato çka do t'i veçojë vetes, nuk duhet ndihmuar asnjërin, sepse secili është zullumqar;">فأما إذا كان ولي الأمر يستخرج من العمال ما يريد أن يختص به هو وذويه، فلا ينبغي إعانة واحد منهما، إذ كل منهما ظالم، كلِصٍّ سرق من لص،</span> <span class="w" data-sq="si dy grupe që luftojnë për fanatizëm; dhe nuk i lejohet njeriut të jetë ndihmës në zullum. Bashkëpunimi është dy lloje:">وكالطائفَتَيْن المُقْتَتِلَتَيْن على عصبية ورئاسة، ولا يحلُّ للرجل أن يكون عونًا على ظلم، فإن التعاون نوعان:</span></span></p>

<p><span class="s" data-sq="❊ Bashkëpunimi në mirësi e devotshmëri: si xhihadi, zbatimi i dënimeve, marrja e hakëve, dhënia merituesve — kjo është ajo çka urdhëroi Allahu e i Dërguari. E kush përmbahet nga kjo duke menduar se po i largohet ndihmës-padrejtësisë, ka lënë farz, duke menduar se po bën devotshmëri; e sa shpesh ngatërrohet frika e koprracia me devotshmërinë — secila prej tyre është frenim."><span class="w" data-sq="❊ Bashkëpunimi në mirësi e devotshmëri: si xhihadi, zbatimi i dënimeve, marrja e hakëve, dhënia merituesve;">❊ تعاون على البرّ والتقوى؛ من الجهاد، وإقامة الحدود، واستيفاء الحقوق، وإعطاء المستحقين، فهذا مما أمر الله به ورسوله.</span> <span class="w" data-sq="E kush përmbahet nga frika se do të jetë ndihmës-padrejtësie, ka lënë farz duke menduar se po bën devotshmëri; e sa shpesh ngatërrohet frika e koprracia me devotshmërinë.">ومن أمسكَ عنه خشيةَ أن يكون من أعوان الظلمة= فقد ترك فرضًا على الأعيان، أو على الكفاية، متوهِّمًا أنه متورِّع، وما أكثر ما يشتبه الجُبْن والبخل بالوَرَع؛ إذ كلٌّ منهما كفٌّ وإمساك.</span></span></p>

<p><span class="s" data-sq="❊ Dhe i dyti: bashkëpunimi në gjynah e armiqësi, si ndihma për gjakun e pafajshëm, marrja e pasurisë pa hak, rrahja e atij që nuk e meriton — kjo është ajo çka e ndaloi Allahu e i Dërguari.">❊ والثاني: تعاونٌ على الإثم والعدوان، كالإعانة على دم معصوم، أو أخذ مالٍ مغصوب، أو ضرب من لا يستحق الضرب، ونحو ذلك، فهذا الذي حرمه الله ورسوله.</span></p>

<p><span class="s" data-sq="Po, nëse pasuritë janë marrë pa hak e nuk mundesh t'ua kthesh pronarëve, si shumë pasuri sulltanore — ndihma për shpenzimin e këtyre"><span class="w" data-sq="Po, nëse pasuritë janë marrë pa hak e nuk mundesh t'ua kthesh pronarëve, si shumë pasuri sulltanore — ndihma për shpenzimin e këtyre">نعم، إذا كانت الأموال قد أُخِذَت بغير حق، وقد تَعَذَّر ردُّها إلى أصحابها، ككثير من الأموال السلطانية، فالإعانة على صرف هذه</span></span></p>`},
// ===== Faqja 67: Shpenzimi i pasurive pa pronar në interesin e myslimanëve (PDF fq. 69) =====
{html:`<p><span class="s" data-sq="pasuritë në interesat e myslimanëve; si mbyllja e kufijve, furnizimi i luftëtarëve, e ngjashëm — prej ndihmës në mirësi e devotshmëri; ngase obligimi i sulltanit për këto pasuri — kur nuk mundesh t'i njohësh pronarët e t'ua kthesh atyre as trashëgimtarëve — është t'i shpenzojë ato — me pendim nëse ai vetë është zullumqari — në interesat e myslimanëve."><span class="w" data-sq="pasuritë në interesat e myslimanëve; si mbyllja e kufijve, furnizimi i luftëtarëve, e ngjashëm — prej ndihmës në mirësi e devotshmëri;">الأموال في مصالح المسلمين؛ كسداد الثغور، ونفقة المقاتلة، ونحو ذلك من الإعانة على البر والتقوى؛</span> <span class="w" data-sq="ngase obligimi i sulltanit për këto pasuri — kur nuk mundesh t'i njohësh pronarët e t'ua kthesh as trashëgimtarëve — është t'i shpenzojë me pendim nëse ai vetë është zullumqari — në interesat e myslimanëve.">إذ الواجب على السلطان في هذه الأموال ـ إذا لم يمكن معرفة أصحابها وردها عليهم ولا على ورثتهم ـ أن يصرفها ـ مع التوبة إن كان هو الظالم ـ إلى مصالح المسلمين.</span></span></p>

<p><span class="s" data-sq="Ky është mendimi i shumicës së dijetarëve si Maliku, Ebu Hanifeja e Ahmedi, dhe është i transmetuar nga më shumë se njëri prej sahabëve, dhe për këtë dëshmon argumenti sheriatik, siç është shtjelluar në vend tjetër.">هذا قول جمهور العلماء كمالك وأبي حنيفة وأحمد، وهو منقول عن غير واحد من الصحابة، وعلى ذلك دلّت الدلالة الشرعية، كما هو مبسوط في موضع آخر.</span></p>

<p><span class="s" data-sq="Edhe nëse dikush tjetër i ka marrë, ai duhet të veprojë me to njëjtë; po ashtu nëse sulltani refuzon t'i kthejë, ndihma për shpenzimin e tyre në interesin e mbajtësve të tyre është më parësore sesa t'i lësh në dorën e tij e t'i humbë për pronarët dhe myslimanët."><span class="w" data-sq="Edhe nëse dikush tjetër i ka marrë, ai duhet të veprojë njëjtë me to;">وإن كان غيره قد أخذها، فعليه هو أن يفعل بها كذلك،</span> <span class="w" data-sq="po ashtu nëse sulltani refuzon t'i kthejë, ndihma për shpenzimin e tyre në interesin e mbajtësve është më parësore sesa t'i lësh në dorën e tij e t'i humbë për pronarët dhe myslimanët.">وكذلك لو امتنع السلطان من ردها، كان الإعانة على إنفاقها في مصالح أهلها أولى من تركها بيده ومن يضيعها على أصحابها وعلى المسلمين.</span></span></p>`},
// ===== Faqja 68: Boshti i sheriatit — teku'a, hadithi, dallimi ndihmës-mazlum (PDF fq. 70) =====
{html:`<p><span class="s" data-sq="Ngase boshti i sheriatit rrotullohet rreth fjalës së Tij, të Lartësuarit:">فإنّ مدار الشريعة على قوله تعالى:</span> <span class="s quran" data-sq="Prandaj, sa të mundeni ruajuni prej dënimit të All-llahut [Et-Tegabun: 16]">﴿فَاتَّقُوا اللَّهَ مَا اسْتَطَعْتُمْ﴾ [التغابن: ١٦]،</span> <span class="s" data-sq="që sqaron fjalën e Tij:">المفسر لقوله:</span> <span class="s quran" data-sq="Kinie frikën All-llahut me sinqeritet të vërtetë [Ali Imran: 102]">﴿اتَّقُوا اللَّهَ حَقَّ تُقَاتِهِ﴾ [آل عمران: ١٠٢]</span> <span class="s" data-sq="dhe mbi fjalën e Pejgamberit ﷺ:">وعلى قول النبي ﷺ:</span> <span class="s hadith" data-sq="«Kur ju urdhëroj diçka, bëni prej saj aq sa mundeni» — e transmetuan në «dy Sahihët».">«إذا أمرتكم بأمر فاتوا منه ما استطعتم» أخرجاه في «الصحيحين».</span></p>

<p><span class="s" data-sq="Dhe se obligimi është arritja e interesave e plotësimi i tyre, dhe çrrënjosja e dëmeve e zvogëlimi i tyre. E kur përplasen, arritja e interesit më të madh duke humbur më të voglin, dhe largimi i dëmit më të madh duke duruar më të voglin — ky është rregulli sheriatik."><span class="w" data-sq="Dhe se obligimi është arritja e interesave e plotësimi i tyre, dhe çrrënjosja e dëmeve e zvogëlimi i tyre.">وعلى أن الواجب تحصيل المصالح وتكميلها، وتبطيل المفاسد وتقليلها.</span> <span class="w" data-sq="E kur përplasen, arritja e interesit më të madh duke humbur më të voglin, dhe largimi i dëmit më të madh duke duruar më të voglin — ky është rregulli sheriatik.">فإذا تعارضت كان تحصيل أعظم المصلحتين بتفويت أدناهما، ودفع أعظم المفسدتين مع احتمال أدناهما هو المشروع.</span></span></p>

<p><span class="s" data-sq="Dhe ndihmësi në gjynah e armiqësi: është ai që ndihmon zullumqarin në zullum; ndërsa ai që ndihmon të dëmtuarin për lehtësimin e zullumit ose për përmbushjen e detyrimit, ai është përfaqësuesi i të dëmtuarit e jo i zullumqarit, si ai që i jep hua ose ai që merr përsipër bartjen e pasurisë tek zullumqari."><span class="w" data-sq="Ndihmësi në gjynah e armiqësi: është ai që ndihmon zullumqarin në zullum;">والمُعين على الإثم والعدوان: من أعان الظالم على ظلمه،</span> <span class="w" data-sq="ndërsa ai që ndihmon të dëmtuarin për lehtësimin e zullumit ose për përmbushjen e detyrimit, ai është përfaqësuesi i të dëmtuarit e jo i zullumqarit, si ai që i jep hua ose ai që merr përsipër bartjen e pasurisë tek zullumqari.">أما من أعان المظلوم على تخفيف الظلم عنه، أو على أداء المظلمة، فهو وكيل المظلوم لا وكيل الظالم، بمنزلة الذي يُقرضه أو الذي يتوكّل في حمل المال له إلى الظالم.</span></span></p>

<p><span class="s" data-sq="Kjo kur nuk i shpenzojnë njerëzit e drejtësisë e të vërtetës, e atëherë ruajtja e tyre bëhet ndihmë për zullumqarët e dorëzim në të vërtetë tek zullumqarët; kështu u ka ndaluar njerëzve të hakut e ua ka dhënë njerëzve të kotës, pa dallim mes qëllimit e mosqëllimit; ngase kush e vendos njeriun në vendin e bishave e ka vrarë, kush e hedh mishin mes egërsirave e ka ngrënë, e kush i mban pasuritë e mëdha për zullumqarët që do t'i zënë — ua ka dhënë."><span class="w" data-sq="Kjo kur nuk i shpenzojnë njerëzit e drejtësisë, e atëherë ruajtja bëhet ndihmë për zullumqarët e dorëzim tek ata; kështu u ka ndaluar njerëzve të hakut e ua ka dhënë njerëzve të kotës;">هذا إذا لم ينفقها أهل العدل والحق، فيكون حبسها إعانة للظلمة وتسليمًا في الحقيقة إلى الظلمة، فيكون قد منعها أهلَ الحق وأعطاها أهل الباطل، ولا فرق بين القصد وعدمه في هذا،</span> <span class="w" data-sq="ngase kush e vendos njeriun në vendin e bishave e ka vrarë, kush e hedh mishin mes egërsirave e ka ngrënë, e kush i mban pasuritë e mëdha për zullumqarët që do t'i zënë — ua ka dhënë.">فإن من وضع إنسانًا بمَسْبَعَة فقد قتله، ومن ألقى اللحم بين السباع فقد أكله، ومن حبس الأموال العظيمة لمن يستولي عليها من الظلمة، فقد أعطاهموها.</span></span></p>

<p><span class="s" data-sq="E kur shkatërrimi i tyre është haram e ruajtja edhe më e rëndë se shkatërrimi, atëherë shpenzimi i tyre bëhet i detyrueshëm; e duke mos pasur destinacion të caktuar, shpenzohen në gjithë drejtimet e mirësisë e afrisë me Allahun; sepse Allahu e krijoi krijesën për adhurim, dhe u krijoi pasuritë për t'u ndihmuar me to në adhurimin e Tij — kështu shpenzohen në rrugën e Allahut."><span class="w" data-sq="E kur shkatërrimi i tyre është haram e ruajtja edhe më e rëndë se shkatërrimi, shpenzimi bëhet i detyrueshëm;">فإذا كان إتلافها حرامًا وحبسها أشد من إتلافها تعيّن إنفاقها،</span> <span class="w" data-sq="e duke mos pasur destinacion të caktuar, shpenzohen në gjithë drejtimet e mirësisë e afrisë me Allahun; sepse Allahu e krijoi krijesën për adhurim, e u krijoi pasuritë për t'u ndihmuar me to në adhurimin e Tij — kështu shpenzohen në rrugën e Allahut.">وليس لها مصرف معيّن فتُصرف في جميع جهات البر والقُرَب التي يتقرب بها إلى الله؛ لأن الله خلق الخلق لعبادته، وخلق لهم الأموال ليستعينوا بها على عبادته فتصرف في سبيل الله.</span></span></p>`},
// ===== Faqja 69: Kujdestari i jetimit, vekili i pronarit, zullumi kolektiv (PDF fq. 71) =====
{html:`<p><span class="s" data-sq="Shembull: kujdestari i jetimit e i vakëfit, kur ndonjë zullumqar kërkon prej tij pasuri, e ai përpiqet ta largojë me diçka më të vogël — për atë ose për dikë tjetër — pas përpjekjes së plotë për ta larguar, ai është bamirës, e nuk ka rrugë kundër bamirësve."><span class="w" data-sq="Shembull: kujdestari i jetimit e i vakëfit, kur zullumqari kërkon pasuri, e ai përpiqet ta largojë me diçka më të vogël — për atë ose dikë tjetër;">مثال ذلك: ولي اليتيم والوقف إذا طلب ظالمٌ منه مالًا فاجتهد في دفع ذلك بما هو أقل منه إليه أو إلى غيره،</span> <span class="w" data-sq="pas përpjekjes së plotë, ai është bamirës, e nuk ka rrugë kundër bamirësve.">بعد الاجتهاد التام في الدفع فهو محسن، وما على المحسنين من سبيل.</span></span></p>

<p><span class="s" data-sq="Po ashtu edhe përfaqësuesi i pronarit nga thirrësit, shkruesit e tjerët, ai që merr përsipër kontraktimin, mbledhjen dhe pagesën e asaj çka kërkohet prej tyre — nuk përfaqëson zullumqarët në marrje.">وكذلك وكيل المالك من المنادين والكُتّاب وغيرهم، الذي يتوكل لهم في العقد والقبض ودفع ما يُطْلَب منهم، لا يتوكّل للظالمين في الأخذ.</span></p>

<p><span class="s" data-sq="Po ashtu nëse vendoset padrejtësi mbi banorët e një fshati, lagje, tregu apo qyteti, e ndërhyn njeri bamirës duke i mbrojtur sa mundet, dhe e ndan mbi ta sipas kapacitetit — pa favorizim për vete as tjetër e pa ryshfet, por duke u përfaqësuar në mbrojtjen dhe pagesën — ai është bamirës."><span class="w" data-sq="Po ashtu nëse vendoset padrejtësi mbi banorët e një fshati, lagje, tregu apo qyteti, e ndërhyn njeri bamirës duke i mbrojtur sa mundet;">وكذلك لو وُضِعَت مظلمة على أهل قرية أو دَرْب أو سوق أو مدينة، فتوسّط رجل محسن في الدفع عنهم بغاية الإمكان،</span> <span class="w" data-sq="dhe e ndan sipas kapacitetit — pa favorizim për vete as tjetër e pa ryshfet, por duke u përfaqësuar në mbrojtje e pagesë — ai është bamirës.">وقَسَّطها عليهم قدر طاقتهم من غير محاباة لنفسه ولا لغيره ولا ارتشاء، بل توكّل لهم في الدفع عنهم والإعطاء= كان محسنًا.</span></span></p>

<p><span class="s" data-sq="Por zakonisht ai që hyn në këtë punë bëhet përfaqësues i zullumqarëve, favorizues, ryshfetmarrës, lehtësues për kë do e marrës nga kë do — ky është prej zullumqarëve më të mëdhenj që grumbullohen në arkivole zjarri, ata e ndihmësit e ngjashmit e tyre, pastaj hidhen në zjarr."><span class="w" data-sq="Por zakonisht ai që hyn në këtë bëhet përfaqësues i zullumqarëve, favorizues, ryshfetmarrës, lehtësues për kë do e marrës nga kë do;">لكنّ الغالب أن من يدخل في ذلك يكون وكيل الظالمين، محابيًّا مرتشيًا مُخِفَّرًا لمن يريد، وآخذًا ممن يريد،</span> <span class="w" data-sq="ky është prej zullumqarëve më të mëdhenj që grumbullohen në arkivole zjarri, ata e ndihmësit e ngjashmit, pastaj hidhen në zjarr.">وهذا من أكبر الظلمة الذين يُحْشَرون في توابيت من نار، هم وأعوانهم وأشباههم، ثم يُقذَفون في النار.</span></span></p>`},
// ===== Faqja 70: Kapitull — Shpenzimet, prioriteti, luftëtarët, merituesit (PDF fq. 72) =====
{html:`<h2>فصل</h2>

<p><span class="s" data-sq="Sa u përket shpenzimeve; obligimi është të fillohet ndarja nga më e rëndësishmja e interesave të përgjithshme të myslimanëve, si dhënia atyre prej të cilëve myslimanët përfitojnë dobi të përgjithshme.">وأما المصارف؛ فالواجب أن يُبتدأ في القسمة بالأهم فالأهم من مصالح المسلمين العامة، كعطاء من يحصل للمسلمين به منفعة عامة.</span></p>

<p><span class="s" data-sq="Prej tyre janë luftëtarët që janë njerëzit e ndihmës e xhihadit, dhe ata janë më meritorët për fej'in; sepse ai nuk arrihet pa ta, derisa u ndanë juristët për pasurinë e fej'it: a u përket vetëm atyre apo është e përbashkët për gjithë interesat? Ndërsa pasuritë e tjera sulltanore janë për gjithë interesat me konsensus, përveç asaj çka i është caktuar ndonjë lloji si sadakat e plaçka e luftës."><span class="w" data-sq="Prej tyre janë luftëtarët që janë njerëzit e ndihmës e xhihadit, dhe ata janë më meritorët për fej'in; sepse ai nuk arrihet pa ta;">فمنهم المقاتِلة الذين هم أهل النُّصْرَة والجهاد، وهم أحق الناس بالفيء؛ لأنه لا يحصل إلا بهم،</span> <span class="w" data-sq="derisa u ndanë juristët: a u përket vetëm atyre apo është e përbashkët? Ndërsa pasuritë e tjera sulltanore janë për gjithë interesat me konsensus, përveç asaj çka i është caktuar ndonjë lloji si sadakat e plaçka.">حتى اختلف الفقهاء في مال الفيء: هل هو مختصٌّ بهم أو مشترك في جميع المصالح؟ وأما سائر الأموال السلطانية فلجميع المصالح وفاقًا، إلا ما خُص به نوع كالصدقات والمغنم.</span></span></p>

<p><span class="s" data-sq="Dhe prej merituesve: mbajtësit e posteve mbi ta; si qeveritarët, gjyqtarët, dijetarët, dhe punëtorët e pasurisë në mbledhje, ruajtje e ndarje e ngjashëm, madje edhe imamët e namazit e muezinët e ngjashëm.">ومن المستحقين: ذوو الولايات عليهم؛ كالولاة، والقضاة، والعلماء، والسُّعاة على المال جمعًا وحفظًا وقسمةً ونحو ذلك، حتى أئمة الصلاة والمؤذنين ونحو ذلك.</span></p>

<p><span class="s" data-sq="Po ashtu shpenzimi në çmime e paga për gjërat e dobisë së përgjithshme; si mbyllja e kufijve me kuaj e armë, ndërtimi i rrugëve si urat e kanalet, dhe rrugët e ujërave si lumenjtë.">وكذلك صرفه في الأثمان والأجور لما يعمُّ نفعُه؛ من سداد الثغور بالكُراع والسلاح، وعمارة ما يحتاج إلى عمارته من طرقات الناس، كالجسور والقناطر، وطرقات المياه كالأنهار.</span></p>

<p><span class="s" data-sq="Dhe prej merituesve: nevojtarët; ngase juristët u ndanë: a paraprijnë ata në gjëra jashtë sadakave, nga fej'i e ngjashëm, mbi tjerët? Me dy mendime në medhhebin e Ahmedit e tjerëve; prej tyre kush tha: Paraprijnë; e prej tyre kush tha: Pasuria u meritua me Islamin, kështu pjesëmarrja është si trashëgimtarët në trashëgimi. E e sakta është se paraprijnë, sepse"><span class="w" data-sq="Dhe prej merituesve: nevojtarët; ngase juristët u ndanë: a paraprijnë në gjëra jashtë sadakave mbi tjerët?">ومن المستحقين: ذوو الحاجات، فإن الفقهاء قد اختلفوا: هل يقدَّمون في غير الصدقات من الفيء ونحوه على غيرهم؟</span> <span class="w" data-sq="Me dy mendime; prej tyre: Paraprijnë; e prej tyre: Pasuria u meritua me Islamin, kështu janë si trashëgimtarët. E e sakta: paraprijnë, sepse">على قولين في مذهب أحمد وغيره؛ منهم من قال: يقدَّمون، ومنهم من قال: المال اسْتُحِقَّ بالإسلام، فيشتركون فيه كما يشترك الورثة في الميراث. والصحيح أنهم يقدَّمون، فإن</span></span></p>`},
// ===== Faqja 71: Omeri e ndan në 4 grupe, dhënia sipas dobisë (PDF fq. 73) =====
{html:`<p><span class="s" data-sq="Pejgamberi ﷺ i paraqiste nevojtarët, siç i paraqiti në pasurinë e Beni Nedirit.">النبي ﷺ كان يقدم ذوي الحاجات، كما قدمهم في مال بني النضير.</span></p>

<p><span class="s" data-sq="Dhe tha Omeri ibnu'l-Hattabi, radijallahu anhu: Askush nuk është më meritor për këtë pasuri se tjetri; ajo është njeriu e kontributi i tij, njeriu e shërbimi i tij, njeriu e sakrifica e tij, dhe njeriu e nevoja e tij.">وقال عمر بن الخطاب رضي الله عنه: ليس أحدٌ أحق بهذا المال من أحد، إنما هو الرجلُ وسابقتُه، والرجلُ وغَناؤه، والرجل وبلاؤه، والرجلُ وحاجتُه.</span></p>

<p><span class="s" data-sq="Kështu Omeri, radijallahu anhu, i ndau në katër grupe:">فجعلهم عمر رضي الله عنه أربعة أقسام:</span></p>

<p><span class="s" data-sq="❊ Ata me kontribute të hershme, nëpërmjet të cilëve u arrit pasuria.">❊ ذوو السوابق الذين بسابقتهم حصل المال.</span></p>

<p><span class="s" data-sq="❊ Ata që u mjaftojnë myslimanëve në sjelljen e dobive, si qeveritarët e dijetarët që u sjellin dobitë e fesë, dynjasë e ahiretit.">❊ ومن يغني عن المسلمين في جلب المنافع لهم، كالسَّاسة والعلماء الذين يجلبون لهم منافع الدين والدنيا والآخرة.</span></p>

<p><span class="s" data-sq="❊ Ata që tregojnë guxim në largimin e dëmit, si muxhahidët në rrugën e Allahut, prej ushtarëve e zbuluesve këshillues e ngjashëm.">❊ ومن يُبْلي بلاء حسنًا في دفع الضرر عنهم، كالمجاهدين في سبيل الله، من الأجناد والعيون الذين هم القُصّاد المناصحون ونحوهم.</span></p>

<p><span class="s" data-sq="Dhe i katërti: nevojtarët.">والرابع: ذوو الحاجات.</span></p>

<p><span class="s" data-sq="E kur dikush prej këtyre vullnetarizon, Allahu ka mjaftuar me të; përndryshe i jepet aq sa i mjafton ose sipas punës. E kur e di se dhënia bëhet sipas dobisë e nevojës — në pasurinë e interesave e në sadaka gjithashtu — ajo çka kalon nuk i takon njeriut përveç si i takon të ngjashmëve, si p.sh. të jetë ortak në plaçkë apo trashëgimi."><span class="w" data-sq="E kur dikush prej këtyre vullnetarizon, Allahu ka mjaftuar me të; përndryshe i jepet aq sa i mjafton ose sipas punës.">وإذا حصل من هؤلاء متبرع فقد أغنى الله به، وإلا أُعْطِي ما يكفيه أو قدر عمله.</span> <span class="w" data-sq="E kur e di se dhënia bëhet sipas dobisë e nevojës — në pasurinë e interesave e sadakave — ajo çka kalon nuk i takon përveç si i takon të ngjashmëve, si ortak në plaçkë apo trashëgimi.">وإذا عرفتَ أن العطاء يكون بحسب منفعة الرجل، وبحسب حاجته في مال المصالح وفي الصدقات ـ أيضًا ـ فما زاد على ذلك لا يستحقه الرجل إلا كما يستحقه نُظَراؤه، مثل أن يكون شريكًا في غنيمة أو ميراث.</span></span></p>`},
// ===== Faqja 72: Ndalimet e dhënies, muel-lefetul-kulub (PDF fq. 74) =====
{html:`<p><span class="s" data-sq="Dhe nuk i lejohet udhëheqësit t'i japë dikujt ajo çka nuk e meriton për qejf të vetin; si nga lidhja familjare, dashuria, e ngjashëm; e aq më pak t'i japë për dobi haram; si dhënia e djemve femërorë, të lirët e skllevërit, prostitutat, këngëtarët, komikët, e ngjashëm; apo dhënia e fallxhorëve nga kahinët, astrologët e ngjashëm."><span class="w" data-sq="Nuk i lejohet udhëheqësit t'i japë dikujt ajo çka nuk e meriton për qejf të vetin; si nga lidhja familjare, dashuria, e ngjashëm;">ولا يجوز للإمام أن يعطي أحدًا ما لا يستحقه لهوى نفسه؛ من قرابة بينهما، أو مودة، ونحو ذلك،</span> <span class="w" data-sq="e aq më pak t'i japë për dobi haram; si djemve femërorë, prostitutat, këngëtarët, komikët; apo fallxhorëve nga kahinët e astrologët.">فضلًا أن يعطيه لأجل منفعة محرمة منه؛ كعطية المُخنَّثين من الصبيان المردان؛ الأحرار والمماليك ونحوهم، والبغايا، والمغنين، والمساخر، ونحو ذلك، أو إعطاء العرّافين من الكُهّان والمُنَجِّمين ونحوهم.</span></span></p>

<p><span class="s" data-sq="Por lejohet, madje obligohet dhënia për afrimin e zemrës së atij që ka nevojë për afrim, edhe nëse atij nuk i lejohet ta marrë, siç lejoi Allahu i Lartësuar në Kur'an dhënien e sadakës për ata me zemra të afruara; dhe siç Pejgamberi ﷺ u jepte atyre me zemra të afruara nga fej'i e ngjashëm — ata janë zotërinjtë e dëgjuar në fiset e tyre."><span class="w" data-sq="Por lejohet, madje obligohet dhënia për afrimin e atij që ka nevojë, edhe nëse atij nuk i lejohet ta marrë;">لكن يجوز، بل يجب الإعطاء لتأليف من يحتاج إلى تأليف قلبه، وإن كان هو لا يحلُّ له أخذ ذلك،</span> <span class="w" data-sq="siç lejoi Allahu në Kur'an dhënien për ata me zemra të afruara; dhe siç Pejgamberi ﷺ u jepte nga fej'i — ata janë zotërinjtë e dëgjuar në fiset.">كما أباح الله سبحانه وتعالى في القرآن العطاء للمؤلفة قلوبهم من الصدقات، وكما كان النبي ﷺ يعطي المؤلفة قلوبهم من الفيء ونحوه، وهم السادة المطاعون في عشائرهم،</span></span></p>

<p><span class="s" data-sq="Siç Pejgamberi ﷺ i jepte Akre' ibnu Habisit zotërisë së Beni Temimit, Ujejnes ibnu Husnit zotërisë së Beni Fezares, Zejd el-Hajrit et-Taiut zotërisë së Beni Nebhanit, Alkames ibnu Ulathes el-Amirit zotërisë së Beni Kilabit. Edhe si zotërinjtë e Kurejshit nga të liruarit; si Safvan ibnu Umeje, Ikrime ibnu Ebi Xhehl, Ebu Sufjan ibnu Harb, Suhejl ibnu Amr, Harithi ibnu Hisham, e shumë tjerë."><span class="w" data-sq="siç i jepte Akre' ibnu Habisit zotërisë së Beni Temimit, Ujejnes ibnu Husnit zotërisë së Beni Fezares, Zejd el-Hajrit zotërisë së Beni Nebhanit, Alkames ibnu Ulathes zotërisë së Beni Kilabit.">كما كان النبي ﷺ يعطي الأقرع بن حابس سيد بني تميم، وعُيينة بن حِصْن سيد بني فَزارة، وزيد الخير الطائي سيد بني نبهان، وعلقمة بن عُلاثة العامري سيد بني كلاب.</span> <span class="w" data-sq="Edhe si zotërinjtë e Kurejshit nga të liruarit; si Safvan ibnu Umeje, Ikrime ibnu Ebi Xhehl, Ebu Sufjan ibnu Harb, Suhejl ibnu Amr, Harithi ibnu Hisham, e shumë tjerë.">ومثل سادات قريش من الطلقاء؛ كصفوان بن أُمية، وعكرمة بن أبي جهل، وأبي سفيان بن حرب، وسُهَيل بن عمرو، والحارث بن هشام، وعدد كثير.</span></span></p>`},
// ===== Faqja 73: Hadithi i arit nga Jemeni, Havarixhët (PDF fq. 75) =====
{html:`<p><span class="s" data-sq="Në «dy Sahihët» nga Ebu Seid el-Hudriu, radijallahu anhu, tha: Aliu dërgoi nga Jemeni ar të papërpunuar në dheun e tij tek i Dërguari i Allahut ﷺ, e ai e ndau mes katër vetave: Akre' ibnu Habis el-Handhali, Ujejne ibnu Bedr el-Fezari, Alkame ibnu Ulathe el-Amiri zotëria i Beni Kilabit, dhe Zejd el-Hajri et-Tai njëri prej Beni Nebhanit."><span class="w" data-sq="Në «dy Sahihët» nga Ebu Seidi, radijallahu anhu, tha: Aliu dërgoi nga Jemeni ar në dheun e tij tek i Dërguari ﷺ;">ففي «الصحيحين» عن أبي سعيد الخدري رضي الله عنه قال: بعثَ عليٌّ وهو باليمن بذُهَيبة في تُرْبتها إلى رسول الله ﷺ،</span> <span class="w" data-sq="e ai e ndau mes katër vetave: Akre' ibnu Habis el-Handhali, Ujejne ibnu Bedr el-Fezari, Alkame ibnu Ulathe el-Amiri, dhe Zejd el-Hajri et-Tai.">فقسَمها رسول الله ﷺ بين أربعة نفر: الأقرع بن حابس الحنظلي، وعُيينة بن بدر الفَزاري، وعلقمة بن عُلاثة العامري سيد بني كلاب، وزيد الخير الطائي أحد بني نبهان.</span></span></p>

<p><span class="s" data-sq="Tha: U zemërua Kurejshi e Ensarët dhe thanë: U jep zotërinjve të Nexhdit e na lë ne?!">قال: فغضبت قريش والأنصار فقالوا: يعطي صناديد نجد ويدعنا؟!</span> <span class="s hadith" data-sq="«Unë e bëra këtë vetëm për t'ua afruar zemrat.»">فقال رسول الله ﷺ: «إني إنما فعلت ذلك لأتألَّفَهم»،</span> <span class="s" data-sq="E erdhi njeri me mjekër të dendur, me faqe të dalura, me sy të thelluar, me ballë të dalur, me kokë të rruar; e tha: Frikësoju Allahut, o Muhammed.">فجاء رجلٌ كثُّ اللحية، مشرف الوَجْنتين، غائر العينين، ناتئ الجبين، محلوق الرأس، فقال: اتق الله يا محمد،</span> <span class="s hadith" data-sq="«E kush i bindet Allahut nëse unë e kundërshtoj? A më beson për banorët e tokës e ju nuk më besoni?»">فقال رسول الله ﷺ: «فمن يُطِع الله إن عصيتُه؟ أيأمَنُني على أهل الأرض ولا تأمَنُوني؟».</span></p>

<p><span class="s" data-sq="Tha: Pastaj njeriu u largua; e kërkoi leje njëri nga populli ta vriste — mendojnë se ishte Halid ibnu'l-Velidi.">قال: ثم أدبر الرجل، فاستأذن رجل من القوم في قتله ـ ويرون أنه خالد بن الوليد ـ</span> <span class="s hadith" data-sq="«Nga pasardhja e këtij do të jenë njerëz që e lexojnë Kur'anin por nuk u kalon fytin, i vrasin njerëzit e Islamit e i lënë idhujtarët, dalin nga Islami si shigjeta nga gjahu; nëse i arrij do t'i vras si vrasja e Adit.»">فقال رسول الله ﷺ: «إن من ضِئْضِئ هذا قومًا يقرؤون القرآن لا يُجاوز حناجرَهم، يقتلون أهل الإسلام، ويدعون أهل الأوثان، يمرقون من الإسلام كما يمرق السهم من الرَّميَّة، لئن أدركتُهم لأقتلنَّهم قتلَ عادٍ».</span></p>

<p><span class="s" data-sq="Dhe nga Rafi' ibnu Hadixh tha: I Dërguari i Allahut ﷺ i dha Ebu Sufjanit ibnu Harb, Safvanit ibnu Umeje, Ujejnes ibnu Husn, dhe Akre'it ibnu Habis, secilit prej tyre njëqind">وعن رافع بن خَديج قال: أعطى رسول الله ﷺ أبا سفيان بن حرب، وصفوان بن أمية، وعُيينة بن حصن، والأقرعَ بن حابس، كلَّ إنسان منهم مئةً</span></p>`},
// ===== Faqja 74: Poezia e Abbasit, muel-lefetul-kulub dy lloje (PDF fq. 76) =====
{html:`<p><span class="s" data-sq="nga devetë, dhe i dha Abbas ibnu Merdasit më pak; e tha Abbasi ibnu Merdas:">من الإبل، وأعطى عباسَ بن مرداس دون ذلك، فقال عباس بن مرداس:</span></p>

<p class="poetry"><span class="s" data-sq="[Poezi:] A e bën plaçkën time e të Ubejdit / mes Ujejnes e Akre'it / Nuk ishte Hisni as Habisi / mbi Merdasin në tubim / E nuk isha nën asnjërin prej tyre / E kush ulet sot nuk ngritet">أتجعل نهبي ونهب العُبَيْد ❊ بين عيينة والأقرع<br>فما كان حِصْنٌ ولا حابسٌ ❊ يفوقان مرداس في المجمع<br>وما كنتُ دون امرئٍ منهما ❊ ومن تَخفِضِ اليومَ لا يُرْفَع</span></p>

<p><span class="s" data-sq="Tha: I Dërguari i Allahut ﷺ ia plotësoi njëqind. E transmetoi Muslimi. El-Ubejd: emër kali i tij.">قال: فأتمَّ له رسول الله ﷺ مئة. رواه مسلم. والعُبَيد: اسم فرس له.</span></p>

<p><span class="s" data-sq="Dhe ata me zemra të afruara janë dy lloje: jobesimtar, e mysliman.">والمؤلفة قلوبهم نوعان: كافر، ومسلم.</span></p>

<p><span class="s" data-sq="Jobesimtari: ose shpresohet nga dhënia e tij dobi — si islamizimi, ose largimi i dëmit kur nuk largohet përveçse me këtë.">فالكافر إما أن يُرْجَى بعطيَّته منفعة؛ كإسلامه، أو دفع مضرته إذا لم يندفع إلا بذلك.</span></p>

<p><span class="s" data-sq="Dhe myslimani i dëgjuar, shpresohet dobi gjithashtu; si përmirësimi i Islamit të tij, ose islamizimi i ngjashmit, ose mbledhja e pasurisë nga ai që nuk jep përveç nga frika, ose goditja e armikut, ose frenimi i dëmit ndaj myslimanëve kur nuk frenohet pa këtë.">والمسلم المُطاع يُرْجَى بعطيته المنفعة أيضًا؛ كحُسْن إسلامه، أو إسلام نظيره، أو جباية المال ممن لا يعطيه إلا لخوف، أو النكاية في العدو، أو كفُّ ضرره عن المسلمين إذا لم ينكفَّ إلا بذلك.</span></p>

<p><span class="s" data-sq="Dhe ky lloj dhënieje, edhe nëse dukej si dhënia e krerëve e lënia e dobëtve — si bëjnë mbretërit — veprat janë sipas qëllimeve; e nëse qëllimi është interesi i fesë e njerëzve të saj, është nga lloji i dhënies së Pejgamberit ﷺ e halifëve; e nëse qëllimi është lartësimi në tokë e prishja, është nga lloji i dhënies së Faraonit; e vetëm fetari e kundërshton"><span class="w" data-sq="Ky lloj, edhe nëse dukej si dhënia e krerëve e lënia e dobëtve, veprat janë sipas qëllimeve;">وهذا النوع من العطاء، وإن كان ظاهره إعطاء الرؤساء وترك الضعفاء، كما يفعل الملوك، فالأعمال بالنيات؛</span> <span class="w" data-sq="nëse qëllimi është interesi i fesë, është nga lloji i dhënies së Pejgamberit ﷺ; e nëse qëllimi është lartësimi e prishja, është si dhënia e Faraonit; e vetëm fetari e kundërshton">فإذا كان القصد بذلك مصلحة الدين وأهله، كان من جنس عطاء النبي ﷺ وخلفائه، وإن كان المقصود العلو في الأرض والفساد، كان من جنس عطاء فرعون، وإنما ينكره ذو الدين</span></span></p>`},
// ===== Faqja 75: Havarixhët, devotshmëria e rreme, hadithi shuhh (PDF fq. 77) =====
{html:`<p><span class="s" data-sq="i prishur, si Dhul-Huvejsira i cili e kundërshtoi Pejgamberin ﷺ, derisa tha për të ato çka tha.">الفاسد، كذي الخُوَيصِرة الذي أنكره على النبي ﷺ، حتى قال فيه ما قال.</span></p>

<p><span class="s" data-sq="Po ashtu partia e tij — Havarixhët — kundërshtuan Emiru'l-Mu'minin Aliun, radijallahu anhu, për atë çka synoi si interes nga gjykimi, fshirja e emrit, dhe ajo çka la nga robërimi i grave e fëmijëve të myslimanëve. Këta i urdhëroi Pejgamberi ﷺ t'i luftojnë; sepse me ta ishte fe e prishur që nuk rregullon as dynjanë as ahiretin."><span class="w" data-sq="Po ashtu Havarixhët kundërshtuan Aliun për gjykimin, fshirjen e emrit, dhe lënien e robërimit të grave e fëmijëve.">وكذا حزبه الخوارج أنكروا على أمير المؤمنين علي رضي الله عنه ما قصدَ به المصلحة من التحكيم، ومَحْوِ اسمه، وما تركه من سبي نساء المسلمين وصبيانهم.</span> <span class="w" data-sq="Këta i urdhëroi Pejgamberi ﷺ t'i luftojnë; sepse me ta ishte fe e prishur që nuk rregullon as dynjanë as ahiretin.">وهؤلاء أمَرَ النبي ﷺ بقتالهم؛ لأن معهم دينًا فاسدًا لا يصلح به دنيا ولا آخرة.</span></span></p>

<p><span class="s" data-sq="Dhe shumë shpesh ngatërrohet devotshmëria e rreme me frikacakërinë e koprrracinë, ngase të dyja përmbajnë lënie; kështu ngatërrohet lënia e prishjes nga frika e Allahut me lënien e xhihadit e shpenzimit: nga frikacakëria e koprracia."><span class="w" data-sq="Shumë shpesh ngatërrohet devotshmëria e rreme me frikacakërinë e koprrracinë, ngase të dyja përmbajnë lënie;">وكثيرًا ما يشتبه الورع الفاسد بالجبن والبخل، فإن كلاهما فيه ترك،</span> <span class="w" data-sq="kështu ngatërrohet lënia e prishjes nga frika e Allahut me lënien e xhihadit e shpenzimit: nga frikacakëria e koprracia.">فيشتبه ترك الفساد لخشية الله تعالى بترك ما يُؤمَر به من الجهاد والنفقة: جبنًا وبخلًا،</span></span></p>

<p><span class="s hadith" data-sq="«Më e keqja te njeriu: koprraci shkatërrimtare dhe frikacakëria çmontuese.» Tha Tirmidhiu: hadith sahih.">وقد قال النبي ﷺ: «شرُّ ما في المرء شُحٌّ هالعٌ وجُبْن خالعٌ». قال الترمذي: حديث صحيح.</span></p>

<p><span class="s" data-sq="Dhe po ashtu njeriu mund ta lërë veprën duke menduar ose duke dukur se është devotshmëri, ndërsa ajo është mendjemadhësi">وكذلك قد يترك الإنسان العمل ظنًّا أو إظهارًا أنه ورع، وإنما هو كِبْر</span></p>`},
// ===== Faqja 76: Nijeti, bujaria e guximi, Et-Teube 38-39 (PDF fq. 78) =====
{html:`<p><span class="s" data-sq="dhe dëshirë për lartësi."><span class="w" data-sq="dhe dëshirë për lartësi;">وإرادةٌ للعلو،</span></span> <span class="s hadith" data-sq="«Veprat janë sipas qëllimeve» — fjalë përmbledhëse e plotë;">وقول النبي ﷺ: «إنما الأعمال بالنيات»</span> <span class="s" data-sq="fjalë përmbledhëse e plotë; ngase nijeti për veprën është si shpirti për trupin; përndryshe secili nga ai që i bën sexhde Allahut e ai që i bën diellit e hënës, e ka vendosur ballën në tokë — forma e tyre është njëjtë, por ky është më afër krijesave me Allahun, e ky më larg.">كلمة جامعة كاملة، فإن النية للعمل كالروح للجسد، وإلا فكل واحد من الساجد لله والساجد للشمس والقمر، قد وضع جبهته على الأرض، فصورتهما واحدة، ثم هذا أقرب الخلق إلى الله تعالى، وهذا أبعد الخلق عن الله.</span></p>

<p><span class="s" data-sq="Dhe ka thënë Allahu, azze ue xhel-le:">وقد قال الله عز وجل:</span> <span class="s quran" data-sq="dhe i porositën njëri-tjetrit t'i përmbahen të vërtetës, dhe i porositën njëri-tjetrit të jenë të durueshëm [El-Asr: 3]">﴿وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ﴾ [العصر: ٣]،</span> <span class="s quran" data-sq="dhe i porositën njëri-tjetrit durim dhe i porositën njëri-tjetrit mëshirë [El-Beled: 17]">﴿وَتَوَاصَوْا بِالصَّبْرِ وَتَوَاصَوْا بِالْمَرْحَمَةِ﴾ [البلد: ١٧].</span> <span class="s" data-sq="Dhe në ether: «Imani më i mirë: bujaria dhe durimi.» Nuk plotësohet kujdesja e njerëzve e qeverisja pa bujarinë — që është dhënia, e guximin — që është trimëria; madje nuk rregullohet as feja as dynjaja pa to.">وفي الأثر: «أفضل الإيمان: السماحة والصبر». فلا تتم رعاية الخلق وسياستهم إلا بالجود الذي هو العطاء، والنجدة التي هي الشجاعة، بل لا يصلح الدين والدنيا إلا بذلك.</span></p>

<p><span class="s" data-sq="Prandaj kush nuk ngrihet me to, Allahu ia heq pushtetin e ia kalon tjetrit, siç tha Allahu i Lartësuar:">ولهذا كان من لم يقم بهما سلبه الله الأمر ونقله إلى غيره، كما قال الله تعالى:</span> <span class="s quran" data-sq="O ju që besuat, ç'keni që kur ju thuhet: Dilni në luftë në rrugën e All-llahut, ju ngecni rëndë në tokë. A u knaqët me jetën e kësaj bote e braktisët botën tjetër? E kënaqësia e kësaj bote ndaj asaj tjetrës nuk është veç diçka e vogël. Nëse nuk dilni, Ai ju dënon me dënim të idhët, e zëvendëson me njerëz tjerë, ndërsa Atij nuk mund t'i bëni kurrfarë dëmi. All-llahu ka mundësi për çdo gjë. [Et-Teube: 38-39]">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا مَا لَكُمْ إِذَا قِيلَ لَكُمُ انفِرُوا فِي سَبِيلِ اللَّهِ اثَّاقَلْتُمْ إِلَى الْأَرْضِ أَرَضِيتُم بِالْحَيَاةِ الدُّنْيَا مِنَ الْآخِرَةِ فَمَا مَتَاعُ الْحَيَاةِ الدُّنْيَا فِي الْآخِرَةِ إِلَّا قَلِيلٌ ❊ إِلَّا تَنفِرُوا يُعَذِّبْكُمْ عَذَابًا أَلِيمًا وَيَسْتَبْدِلْ قَوْمًا غَيْرَكُمْ وَلَا تَضُرُّوهُ شَيْئًا وَاللَّهُ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ﴾ [التوبة: ٣٨-٣٩].</span></p>`},
// ===== Faqja 77: Koprracia e frikacakëria në Kur'an (PDF fq. 79) =====
{html:`<p><span class="s" data-sq="Dhe tha i Lartësuari:">وقال تعالى:</span> <span class="s quran" data-sq="Ja, ju jeni ata që thirreni për të dhënë në rrugë të All-llahut, e ka prej jush që bëhen koprracë. E kush bëhet koprrac, ai është koprrac kundër vetes, e All-llahu s'ka nevojë, e ju jeni të varfër. E nëse nuk i përgjigjeni, Ai do t'ju zëvendësojë me njerëz tjerë, e ata pastaj nuk do të jenë si ju. [Muhammed: 38]">﴿هَا أَنتُمْ هَٰؤُلَاءِ تُدْعَوْنَ لِتُنفِقُوا فِي سَبِيلِ اللَّهِ فَمِنكُم مَّن يَبْخَلُ وَمَن يَبْخَلْ فَإِنَّمَا يَبْخَلُ عَن نَّفْسِهِ وَاللَّهُ الْغَنِيُّ وَأَنتُمُ الْفُقَرَاءُ وَإِن تَتَوَلَّوْا يَسْتَبْدِلْ قَوْمًا غَيْرَكُمْ ثُمَّ لَا يَكُونُوا أَمْثَالَكُمْ﴾ [محمد: ٣٨].</span></p>

<p><span class="s" data-sq="Dhe ka thënë, i Lavdishmi e i Lartësuari:">وقد قال سبحانه وتعالى:</span> <span class="s quran" data-sq="Nuk janë të barabartë prej jush ata që shpenzuan dhe luftuan para çlirimit. Ata janë më të lartë në shkallë ndaj atyre që shpenzuan dhe luftuan pastaj. Secilit All-llahu i ka premtuar të mirën. [El-Hadid: 10]">﴿لَا يَسْتَوِي مِنكُم مَّنْ أَنفَقَ مِن قَبْلِ الْفَتْحِ وَقَاتَلَ أُولَٰئِكَ أَعْظَمُ دَرَجَةً مِّنَ الَّذِينَ أَنفَقُوا مِن بَعْدُ وَقَاتَلُوا وَكُلًّا وَعَدَ اللَّهُ الْحُسْنَىٰ﴾ [الحديد: ١٠]،</span> <span class="s" data-sq="e lidhti çështjen me shpenzimin — që është bujaria, e luftimin — që është guximi. Dhe tha në vend tjetër:">فعلق الأمر بالإنفاق الذي هو السخاء، والقتال الذي هو الشجاعة. وكذلك قال في غير موضع:</span> <span class="s quran" data-sq="dhe luftuan në rrugën e All-llahut me pasurinë dhe vetën e tyre [Et-Teube: 20]">﴿وَجَاهِدُوا فِي سَبِيلِ اللَّهِ بِأَمْوَالِهِمْ وَأَنفُسِهِمْ﴾ [التوبة: ٢٠].</span></p>

<p><span class="s" data-sq="Dhe sqaroi se koprracia është nga mëkatet e mëdha, në fjalën e Tij, të Lartësuarit:">وبيّن أن البخل من الكبائر في قوله تعالى:</span> <span class="s quran" data-sq="Ata të cilët bëjnë koprraci me atë që nga të mirat e Veta u dha All-llahu, të mos mendojnë kurrsesi se ajo është në dobi të tyre. Jo, ajo është në dëm të tyre. Ajo me çka bënë koprraci, në ditën e kijametit do t'u mbështillet. [Ali Imran: 180]">﴿وَلَا يَحْسَبَنَّ الَّذِينَ يَبْخَلُونَ بِمَا آتَاهُمُ اللَّهُ مِن فَضْلِهِ هُوَ خَيْرًا لَّهُم بَلْ هُوَ شَرٌّ لَّهُمْ سَيُطَوَّقُونَ مَا بَخِلُوا بِهِ يَوْمَ الْقِيَامَةِ﴾ [آل عمران: ١٨٠]،</span> <span class="s" data-sq="dhe në fjalën e Tij:">وفي قوله تعالى:</span> <span class="s quran" data-sq="Edhe ata që e grumbullojnë arin e argjendin e nuk e japin për rrugën e All-llahut, lajmëroji për një dënim të dhimbshëm. [Et-Teube: 34]">﴿وَالَّذِينَ يَكْنِزُونَ الذَّهَبَ وَالْفِضَّةَ وَلَا يُنفِقُونَهَا فِي سَبِيلِ اللَّهِ فَبَشِّرْهُم بِعَذَابٍ أَلِيمٍ﴾ [التوبة: ٣٤].</span></p>

<p><span class="s" data-sq="Dhe po ashtu frikacakëria, në fjalën e Tij:">وكذلك الجبن في مثل قوله تعالى:</span> <span class="s quran" data-sq="E kush ua kthen shpinën atë ditë, pos rastit kur kthehet për taktikë lufte ose shkon te grupi tjetër, ai ka tërhequr hidhërimin e All-llahut dhe vendi i tij është xhehenemi; sa vend i keq është ai. [El-Enfal: 16]">﴿وَمَن يُوَلِّهِمْ يَوْمَئِذٍ دُبُرَهُ إِلَّا مُتَحَرِّفًا لِّقِتَالٍ أَوْ مُتَحَيِّزًا إِلَىٰ فِئَةٍ فَقَدْ بَاءَ بِغَضَبٍ مِّنَ اللَّهِ وَمَأْوَاهُ جَهَنَّمُ وَبِئْسَ الْمَصِيرُ﴾ [الأنفال: ١٦]،</span> <span class="s" data-sq="dhe në fjalën e Tij:">وفي قوله:</span> <span class="s quran" data-sq="Betohen në All-llahun se janë nga ju, e ata nuk janë prej jush, por janë popull që frikohet. [Et-Teube: 56]">﴿وَيَحْلِفُونَ بِاللَّهِ إِنَّهُمْ لَمِنكُمْ وَمَا هُم مِّنكُمْ وَلَٰكِنَّهُمْ قَوْمٌ يَفْرَقُونَ﴾ [التوبة: ٥٦]،</span> <span class="s" data-sq="dhe ky është i shumtë në Libër e Sunet, dhe për të janë pajtuar njerëzit e tokës, derisa thonë në shprehjet popullore: As gostie as">وهو كثير في الكتاب والسنة، وهو مما اتفق عليه أهل الأرض، حتى إنهم يقولون في الأمثال العامية: لا طعنة ولا</span></p>`},
// ===== Faqja 78: Tri grupet e njerëzve ndaj politikës (PDF fq. 80) =====
{html:`<p><span class="s" data-sq="gostie; dhe thonë: As kalorës kuajsh as faqe e arabëve.">جفنة، ويقولون: لا فارس الخيل ولا وجه العرب.</span></p>

<p><span class="s" data-sq="Por njerëzit u ndanë këtu në tri grupe:"><b>لكن افترق الناس هنا ثلاث فرق:</b></span></p>

<p><span class="s" data-sq="❊ Njëri grup: u mbizotëroi dashuria për lartësi në tokë ose prishje, e nuk shikuan pasojat e botës tjetër, dhe panë se sulltanati nuk qëndron pa dhënie, e dhënia nuk arrihet pa nxjerrjen e pasurive nga jo-hallalli — kështu u bënë plaçkitës e dhurues."><span class="w" data-sq="❊ Njëri grup: u mbizotëroi dashuria për lartësi ose prishje, nuk shikuan pasojat;">❊ فريق غلبَ عليهم حبُّ العلو في الأرض أو الفساد، فلم ينظروا في عاقبة المعاد،</span> <span class="w" data-sq="dhe panë se sulltanati nuk qëndron pa dhënie, e dhënia nuk arrihet pa nxjerrjen e pasurive nga jo-hallalli — kështu u bënë plaçkitës e dhurues.">ورأوا أن السلطان لا يقوم إلا بعطاء، وقد لا يتأتّى العطاء إلا باستخراج أموال من غير حلِّها، فصاروا نَهّابين وهَّابين.</span></span></p>

<p><span class="s" data-sq="Këta thonë: Nuk mundet dikush të qeverisë njerëzit pa ngrënë e pa ushqyer; nëse qeveris i ndershmi që nuk ha e nuk ushqen, zemërohen krerët e e shkarkojnë, nëse nuk e dëmtojnë në vete e pasurinë. Këta shikuan të tashmen e dynjasë e lanë të ardhmen; pasoja e tyre është e keqe në dynja e ahiret, nëse nuk u ndodh pendim e ngjashëm."><span class="w" data-sq="Këta thonë: Nuk mundet dikush të qeverisë pa ngrënë e pa ushqyer; nëse qeveris i ndershmi, zemërohen krerët e e shkarkojnë.">وهؤلاء يقولون: لا يمكن أن يتولّى على الناس إلا من يأكل ويُطْعِم، فإنه إذا تولّى العفيف الذي لا يأكل ولا يُطْعِم، سَخِط عليه الرؤساء وعزلوه، إن لم يضروه في نفسه وماله.</span> <span class="w" data-sq="Këta shikuan të tashmen e lanë të ardhmen; pasoja e tyre e keqe në dynja e ahiret, nëse nuk u ndodh pendim.">وهؤلاء نظروا في عاجل دنياهم وأهملوا الآجل من دنياهم وآخرتهم، فعاقبتهم عاقبة رديئة في الدنيا والآخرة، إن لم يحصل لهم ما يُصْلِح آخرتهم من توبة ونحوها مما يعتقدونه فينجوا منه.</span></span></p>

<p><span class="s" data-sq="❊ Dhe grupi i dytë: tek ta ka frikë e Allahut e fe që i ndalon nga ajo çka e konsiderojnë të shëmtuar — si zullumi ndaj njerëzve e bërja e harameve — kjo është mirë e e obligueshme; por mund të besojnë njëkohësisht se politika nuk plotësohet pa ato çka bëjnë të parët nga harami, kështu përmbahen krejtësisht; e ndoshta ka në shpirtrat e tyre frikacakëri, koprraci, apo ngushtësi karakteri"><span class="w" data-sq="❊ Grupi i dytë: tek ta ka frikë e Allahut e fe që i ndalon nga zullumi e harami — kjo është mirë e obligueshme;">❊ وفريقٌ عندهم خوفٌ من الله تعالى، ودينٌ يمنعهم عما يعتقدونه قبيحًا، من ظلم الخلق وفعل المحارم، فهذا حسنٌ واجب،</span> <span class="w" data-sq="por besojnë se politika nuk plotësohet pa haramin, kështu përmbahen krejtësisht; e ndoshta ka frikacakëri, koprraci, apo ngushtësi karakteri">لكن قد يعتقدون مع ذلك أن السياسة لا تتم إلا بما يفعله أولئك من الحرام، فيمتنعون أو يمنعون عنها مطلقًا، وربما كان في نفوسهم جُبن أو بخل، أو ضِيق خلق</span></span></p>`},
// ===== Faqja 79: Grupi i dytë vazhdon, grupi i tretë — umeti i mesëm (PDF fq. 81) =====
{html:`<p><span class="s" data-sq="mbështetës i asaj çka kanë prej fesë, kështu nganjëherë bien në lënien e obligimit — lënia e të cilit është më e dëmshme se disa harame — ose ndalojnë nga obligimi, e ndalimi i tij është pengim nga rruga e Allahut."><span class="w" data-sq="mbështetës i asaj çka kanë prej fesë, kështu bien në lënien e obligimit — lënia e të cilit është më e dëmshme se harame;">عاضد لما معهم من الدين، فيقعون أحيانًا في ترك واجب يكون تركه أضرَّ عليهم من بعض المحرمات،</span> <span class="w" data-sq="ose ndalojnë nga obligimi, e ndalimi i tij është pengim nga rruga e Allahut.">أو يقعون في النهي عن واجب، يكون النهيُ عنه من الصدِّ عن سبيل الله.</span></span></p>

<p><span class="s" data-sq="Dhe mund të jenë të arsyetuar, e ndoshta besojnë se kundërshtimi është obligim e nuk plotësohet pa luftim, e luftojnë myslimanët si Havarixhët; këta nuk rregullojnë as dynjanë as fenë e plotë, por mund të rregullohet me ta shumë lloje feje e disa çështje dynjaje; mund t'u falet ku gabuan, e mund të jenë nga humbësit që mendonin se po bënin mirë."><span class="w" data-sq="Mund të jenë të arsyetuar, e besojnë se kundërshtimi obligohet e nuk plotësohet pa luftim, si Havarixhët;">وقد يكونون متأوِّلين، وربما اعتقدوا أن إنكار ذلك واجب ولا يتم إلا بالقتال، فيقاتلون المسلمين كما فعلت الخوارج؛</span> <span class="w" data-sq="këta nuk rregullojnë as dynjanë as fenë e plotë, por mund të rregullohet shumë me ta; mund t'u falet gabimi, e mund të jenë nga humbësit.">فهؤلاء لا تصلح بهم الدنيا ولا الدين الكامل، لكن قد يصلح بهم كثيرٌ من أنواع الدين وبعض أمور الدنيا، وقد يُعْفَى عنهم في بعض ما اجتهدوا فيه فأخطأوا، ويُغفَر لهم قصورُهم، وقد يكونون من الأخسرين الذين ضلَّ سعيُهم في الحياة الدنيا وهم يحسبون أنهم يحسنون صنعًا.</span></span></p>

<p><span class="s" data-sq="Kjo është mënyra e atij që nuk merr për vete e nuk u jep tjerëve, e nuk sheh se duhet afruar njerëzit nga jobesimtarët e mëkatarët as me pasuri as dobi, e mendon se dhënia e atyre me zemra të afruara është nga zullumi e dhënia e ndaluar.">وهذه طريقة من لا يأخذ لنفسه ولا يعطي غيره، ولا يرى أن يتألف الناس من الكفار والفجار لا بمال ولا بنفع، ويرى أن إعطاء المؤلفة قلوبهم من نوع الجور والعطاء المحرَّم.</span></p>

<p><span class="s" data-sq="❊ Grupi i tretë: Umeti i mesëm, ata janë njerëzit e fesë së Muhammedit ﷺ, dhe halifët e tij mbi njerëzit e përgjithshëm e të veçantë deri në Ditën e Kiametit; ajo është: shpenzimi i pasurisë e dobive">❊ <b>الفريق الثالث:</b> الأمة الوسط، وهم أهل دين محمد ﷺ، وخلفاؤه على عامة الناس وخاصتهم إلى يوم القيامة، وهو: إنفاق المال والمنافع</span></p>`},
// ===== Faqja 80: Umeti i mesëm vazhdon, hadithi i Heraklit (PDF fq. 82) =====
{html:`<p><span class="s" data-sq="për njerëzit — edhe nëse janë krerë — sipas nevojës për rregullimin e gjendjes për ngritjen e fesë, dhe dynjasë që i nevojitet fesë. Dhe ndershmëria në vete — nuk merr çka nuk e meriton; kështu bashkojnë mes devotshmërisë e bamirësisë:"><span class="w" data-sq="për njerëzit — edhe nëse krerë — sipas nevojës për ngritjen e fesë e dynjasë që i nevojitet fesë.">للناس ـ وإن كانوا رؤساء ـ بحسب الحاجة إلى صلاح الأحوال لإقامة الدين، والدنيا التي يحتاج إليها الدين.</span> <span class="w" data-sq="Dhe ndershmëria në vete — nuk merr çka nuk e meriton; bashkojnë devotshmërinë e bamirësinë:">وعِفَّته في نفسه فلا يأخذ ما لا يستحقه، فيجمعون بين التقوى والإحسان</span></span> <span class="s quran" data-sq="S'ka dyshim se All-llahu është me ata që janë të devotshëm dhe me ata që janë bamirës. [En-Nahl: 128]">﴿إِنَّ اللَّهَ مَعَ الَّذِينَ اتَّقَوْا وَالَّذِينَ هُم مُّحْسِنُونَ﴾ [النحل: ١٢٨].</span></p>

<p><span class="s" data-sq="Nuk plotësohet politika fetare pa këtë, e nuk rregullohet feja e dynjaja pa këtë mënyrë; ky është ai që u ushqen njerëzve çka u nevojitet e nuk ha vetë përveç hallallit; e këtij i mjafton më pak se i parit, ngase shpirtrat lakmojnë nga ai që merr çka nuk lakmojnë nga i ndershmi; e me të rregullohen njerëzit në fe çka nuk rregullohen me të dytin, ngase ndershmëria me mundësi e forcon shenjtërinë e fesë."><span class="w" data-sq="Nuk plotësohet politika fetare pa këtë, e nuk rregullohet feja e dynjaja pa këtë mënyrë;">فلا تتم السياسة الدينية إلا بهذا، ولا يصلح الدين والدنيا إلا بهذه الطريقة،</span> <span class="w" data-sq="ky u ushqen njerëzve çka u nevojitet e nuk ha përveç hallallit; e i mjafton më pak, ngase ndershmëria me mundësi e forcon shenjtërinë e fesë.">وهذا هو الذي يُطْعِم الناس ما يحتاجون إلى إطعامه، ولا يأكل هو إلا الحلال الطيب، ثم هذا يكفيه من الإنفاق أقل مما يحتاج إليه الأوَّل، فإن الذي يأخذ لنفسه تطمع فيه النفوس ما لا تطمع في العفيف، ويصلح به الناس في دينهم ما لا يصلحون بالثاني، فإن العِفّة مع القدرة تقوِّي حُرْمة الدين.</span></span></p>

<p><span class="s" data-sq="Në «dy Sahihët» nga Ebu Sufjan ibnu Harb se Herakli, mbreti i Romës, i tha për Pejgamberin ﷺ: Çka ju urdhëron? Tha: Na urdhëron me namaz, sadaka, ndershmëri e lidhje farefisnore.">وفي «الصحيحين» عن أبي سفيان بن حرب أن هرقل ملك الروم قال له عن النبي ﷺ: بماذا يأمركم؟ قال: يأمرنا بالصلاة والصدقة والعفاف والصِّلَة.</span></p>

<p><span class="s" data-sq="Dhe në ether: Se Allahu i shpalli Ibrahimit el-Halilit — paqja e Allahut mbi pejgamberin tonë e mbi të: O Ibrahim, a e di pse të mora mik? Sepse e pashë se dhënia të ishte më e dashur se marrja.">وفي الأثر: أن الله أوحى إلى رسوله إبراهيم الخليل ـ صلى الله على نبينا وعليه وعلى كافة الأنبياء والمرسلين ـ: يا إبراهيم أتدري لم اتخذتك خليلًا؟ لأني رأيتُ العطاءَ أحبَّ إليك من الأخذ.</span></p>`},
// ===== Faqja 81: Tri grupet e zemërimit, hadithi i Aishes, morali i plotë (PDF fq. 83) =====
{html:`<p><span class="s" data-sq="Dhe kjo çka e përmendëm për furnizimin e dhënien — që është bujaria — e ka ngjashmen në durim e zemërim — që është guximi: se njerëzit janë tri grupe: njëri zemërohet për vete e Zotin, njëri nuk zemërohet as për vete as Zotin; e i treti — i mesmi — zemërohet për Zotin e jo për vete."><span class="w" data-sq="Kjo çka përmendëm për bujarin e ka ngjashmen në guximin: njerëzit janë tri grupe;">وهذا الذي ذكرناه في الرزق والعطاء الذي هو السخاء وبذل المنافع= نظيرُه في الصبر والغضب الذي هو الشجاعة ودفع المضارّ: أن الناس ثلاثة أقسام:</span> <span class="w" data-sq="njëri zemërohet për vete e Zotin, njëri nuk zemërohet as për vete as Zotin; e i treti — i mesmi — zemërohet për Zotin e jo për vete.">قسم يغضبون لنفوسهم ولربهم، وقسم لا يغضبون لنفوسهم ولا لربهم، والثالث ـ وهو الوسط ـ أن يغضب لربه لا لنفسه</span></span></p>

<p><span class="s hadith" data-sq="siç në «dy Sahihët» nga Aisheja, radijallahu anha, tha: «Nuk goditi i Dërguari ﷺ me dorën e tij as shërbëtor, as grua, as kafshë, asgjë kurrë — përveç kur luftonte në rrugën e Allahut; e nuk iu bë diçka e hakmerrej për vete — përveç kur shkeleshin shenjtëritë e Allahut, e kur shkeleshin nuk qëndronte asgjë para zemërimit derisa hakmerrej për Allahun, të Bekuarin e të Lartësuarin.»"><span class="w" data-sq="Në «dy Sahihët» nga Aisheja: «Nuk goditi ﷺ as shërbëtor, as grua, as kafshë — përveç kur luftonte në rrugën e Allahut;">كما في «الصحيحين» عن عائشة رضي الله عنها قالت: «ما ضرب رسول الله ﷺ بيده خادمًا له، ولا امرأة، ولا دابة، ولا شيئًا قط إلا أن يجاهد في سبيل الله،</span> <span class="w" data-sq="e nuk iu bë diçka e hakmerrej — përveç kur shkeleshin shenjtëritë e Allahut, e atëherë nuk qëndronte asgjë derisa hakmerrej për Allahun.»">ولا نِيلَ منه شيء فانتقم لنفسه، إلا أن تُنتَهَك حُرُمات الله، فإذا انتُهِكَت حُرُمات الله لم يَقُم لغضبه شيء حتى ينتقم لله تبارك وتعالى».</span></span></p>

<p><span class="s" data-sq="E ai që zemërohet për vete e jo Zotin, ose merr për vete e nuk u jep tjerëve — ky grup i katërt janë krijesat më të këqija, nuk rregullohet me ta as fe as dynja.">فأما من يغضب لنفسه لا لربه، أو يأخذ لنفسه ولا يعطي غيره، فهذا القسم الرابع شرُّ الخلق لا يصلح بهم دين ولا دنيا.</span></p>

<p><span class="s" data-sq="Siç salihinët, zotëruesit e politikës së plotë, janë ata që kryen obligimet e lanë haramet, japin çka e rregullon fenë e nuk marrin përveç hallallit, zemërohen për Zotin kur shkelen haramet e falin hakët e veta; këto janë moralet e të Dërguarit ﷺ, e janë gjërat më të plota; sa më afër tyre, aq më mirë."><span class="w" data-sq="Salihinët — zotëruesit e politikës së plotë — kryen obligimet, lanë haramet, japin çka e rregullon fenë e nuk marrin përveç hallallit;">كما أن الصالحين أرباب السياسة الكاملة، هم الذين قاموا بالواجبات وتركوا المحرَّمات، وهم الذين يعطون ما يُصْلِح الدين بعطائه، ولا يأخذون إلا ما أُبيح لهم،</span> <span class="w" data-sq="zemërohen për Zotin kur shkelen haramet e falin hakët e veta; këto janë moralet e Pejgamberit ﷺ, gjërat më të plota; sa më afër, aq më mirë.">ويغضبون لربهم إذا انتُهِكَت محارمُه، ويعفون عن حظوظهم، وهذه أخلاق رسول الله ﷺ في بذله ودفعه، وهي أكمل الأمور، وكلما كان إليها أقرب كان أفضل.</span></span></p>

<p><span class="s" data-sq="Prandaj le të përpiqet myslimani t'u afrohet me mundësinë e tij, e t'i kërkoj falje Allahut pas kësaj nga mangësia, pasi t'i njohë plotësinë e asaj çka dërgoi Allahu me Muhammedin ﷺ prej fesë.">فليجتهد المسلم في التقرُّب إليها بجهده، ويستغفر الله تعالى بعد ذلك من قصور أو تقصير، بعد أن يعرف كمالَ ما بَعَثَ الله به محمدًا ﷺ من الدين.</span></p>`},
// ===== Faqja 82: Kapitull — Gjykimi me drejtësi, dënimet e hakët (PDF fq. 84) =====
{html:`<p><span class="s" data-sq="E kjo është në fjalën e Tij, të Bekuarit e të Lartësuarit:">فهذا في قوله تبارك وتعالى:</span> <span class="s quran" data-sq="All-llahu ju urdhëron që t'u jepni amanetet atyre që u takojnë [En-Nisa: 58]">﴿إِنَّ اللَّهَ يَأْمُرُكُمْ أَن تُؤَدُّوا الْأَمَانَاتِ إِلَىٰ أَهْلِهَا﴾ [النساء: ٥٨].</span></p>

<h2>فصل</h2>

<p><span class="s" data-sq="Sa u përket fjalës së Tij, të Lartësuarit:">وأما قوله تعالى:</span> <span class="s quran" data-sq="dhe kur të gjykoni mes njerëzve, të gjykoni me drejtësi [En-Nisa: 58]">﴿وَإِذَا حَكَمْتُم بَيْنَ النَّاسِ أَن تَحْكُمُوا بِالْعَدْلِ﴾ [النساء: ٥٨]</span> <span class="s" data-sq="gjykimi mes njerëzve bëhet në dënime e hake, dhe ato janë dy lloje:">فإن الحُكْم بين الناس يكون في الحدود والحقوق، وهما قسمان:</span></p>

<p><span class="s" data-sq="Lloji i parë: dënimet e hakët që nuk janë për njerëz të caktuar, por dobia e tyre është për gjithë myslimanët, ose ndonjë lloj prej tyre, dhe të gjithë u nevojiten; quhen dënimet e Allahut e hakët e Allahut; si: dënimi i grabitësve të rrugës, hajdutëve, kurvëruesve e ngjashëm; edhe si: gjykimi në çështjet sulltanore, vakëfet e testamentet që nuk janë për dikë të caktuar — këto janë nga çështjet më të rëndësishme të qeverisjes."><span class="w" data-sq="Lloji i parë: dënimet e hakët jo për njerëz të caktuar, por për gjithë myslimanët; quhen dënimet e Allahut e hakët e Allahut;">فالقسم الأول: الحدود والحقوق التي ليست لقوم معينين، بل منفعتها لمطلق المسلمين، أو نوع منهم، وكلهم محتاج إليها، وتسمى حدود الله وحقوق الله،</span> <span class="w" data-sq="si: dënimi i grabitësve, hajdutëve, kurvëruesve; gjykimi në çështjet sulltanore, vakëfet e testamentet — këto janë nga më të rëndësishmet e qeverisjes.">مثل: حدُّ قُطّاع الطريق، والسُّرّاق، والزُّناة ونحوهم، ومثل: الحكم في الأمور السلطانية، والوقوف والوصايا التي ليست لمعيَّن، فهذه من أهم أمور الولايات؛</span></span></p>

<p><span class="s" data-sq="prandaj tha Aliu ibnu Ebi Talibi, radijallahu anhu: Njerëzve u duhet udhëheqje, qoftë e mirë apo e keqe; i thanë: O Emir i Besimtarëve, të mirën e dimë, po ç'është puna e të keqes? Tha: Zbatohen me të dënimet, sigurohen rrugët, luftohet armiku, dhe ndahet fej'i."><span class="w" data-sq="tha Aliu, radijallahu anhu: Njerëzve u duhet udhëheqje, e mirë apo e keqe; i thanë: Të mirën e dimë, po e keqja?">ولهذا قال علي بن أبي طالب رضي الله عنه: لابدَّ للناس من إمارة برَّة كانت أو فاجرة، فقيل: يا أمير المؤمنين، هذه البرَّة قد عرفناها فما بال الفاجرة؟</span> <span class="w" data-sq="Tha: Zbatohen dënimet, sigurohen rrugët, luftohet armiku, ndahet fej'i.">فقال: تُقام بها الحدود، وتأمن بها السُّبُل، ويُجاهَد بها العدو، ويُقْسَم بها الفيء.</span></span></p>

<p><span class="s" data-sq="Dhe ky lloj obligohet mbi qeveritarët ta kërkojnë e ta zbatojnë pa nevojë për padi">وهذا القسم يجب على الولاة البحث عنه، وإقامته من غير دعوى</span></p>`},
// ===== Faqja 83: Dënimi pa padi, ndalimi i shefatit, hadithi i Ibnu Omerit (PDF fq. 85) =====
